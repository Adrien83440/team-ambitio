<script>
/* ═══════════════════════════════════════════════════════════════════════
   ACTIVITÉ TÉLÉPHONIQUE — call_logs (Ringover / Twilio), plage propre au bloc
   ───────────────────────────────────────────────────────────────────────
   Audit de cohérence du 25/11/2026 :
     · lecture par AlteoreFlow.loadCallsForMember (la même que Set NB) :
       plus de plafond muet (« lecture incomplète » affichée), plus de
       requête « 5 000 appels quelconques » pour un non-admin ;
     · décroché = règle commune AlteoreFlow.isAnswered (StatsCore :
       ≥ 5 s de conversation, répondeurs écartés), sortants seulement,
       sans condition de statut ;
     · jours et bornes à l'heure de Paris ;
     · « Personne » (pas « Closer ») : la liste contient tous les appelants ;
       un ancien membre est rangé sur « Anciens membres » (sans nom), un
       poste non relié sur « Non attribué » (appels sans auteur).
   Un admin voit toute l'équipe ; un membre ne voit que ses propres appels
   (règles Firestore). ES5, délégation d'événements, aucun onclick en ligne.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var SC = window.StatsCore, FC = window.FunnelCore, AF = window.AlteoreFlow;

  var state = {
    startIso: null, endIso: null, preset: 'week', filterUid: 'all',
    role: null, myUid: null, loading: false, logs: [], tok: 0
  };

  function $(id) { return document.getElementById(id); }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtNum(n) { return Math.round(Number(n) || 0).toLocaleString('fr-FR'); }
  function pad2(n) { return SC.pad2(n); }

  /* ── Jours de Paris ('AAAA-MM-JJ') ── */
  function isoPlus(iso, n) {
    var p = iso.split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  function jourSemaine(iso) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); }
  function aujourdhui() { return SC.jourParis(Date.now()); }
  function presetRange(key) {
    var t = aujourdhui();
    if (key === 'week' || key === 'lastweek') {
      var dow = jourSemaine(t);
      var lundi = isoPlus(t, dow === 0 ? -6 : 1 - dow);
      if (key === 'lastweek') lundi = isoPlus(lundi, -7);
      return { start: lundi, end: isoPlus(lundi, 6) };
    }
    if (key === 'month') {
      var P = FC.periodMonth(+t.slice(0, 4), +t.slice(5, 7) - 1);
      return { start: SC.jourParis(P.start), end: SC.jourParis(P.end) };
    }
    if (key === '30days') return { start: isoPlus(t, -29), end: t };
    return null;
  }
  function frCourt(iso) { return +iso.slice(8, 10) + '/' + iso.slice(5, 7); }
  function rangeLabel() { return state.startIso === state.endIso ? frCourt(state.startIso) : frCourt(state.startIso) + ' → ' + frCourt(state.endIso); }

  function fmtDuration(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    if (sec < 60) return sec + ' s';
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + ' h ' + pad2(m) + ' min';
    if (s === 0) return m + ' min';
    return m + ' min ' + pad2(s) + ' s';
  }

  /* ── Personnes (référentiel §3, D10) — auteur d'un appel par LA règle du
     Stats funnel (FunnelCore.callerOf : compte relié, sinon prénom Ringover),
     sur le roster complet (anciens membres compris). ── */
  function rosterComplet() {
    var seen = {}, out = [];
    function add(m) { var k = m && (m.slug || m.firebaseUid); if (k && !seen[k]) { seen[k] = 1; out.push(m); } }
    (window.TEAM_MEMBERS_LIST || []).forEach(add);
    var map = window.TEAM_MEMBERS || {};
    Object.keys(map).forEach(function (k) {
      var m = map[k];
      if (m && !m.slug) { var c = { slug: k }; Object.keys(m).forEach(function (f) { c[f] = m[f]; }); m = c; }
      add(m);
    });
    return out;
  }
  function ligneDe(who, jourIso) {
    if (!who) return { key: '_na', name: SC.mot('non_attribue'), color: '#6b7280', sous: SC.mot('appels_sans_auteur') };
    if (who.departed || (who.slug && AF.isDeparted(who.slug))) return { key: '_anciens', name: SC.mot('anciens_membres'), color: '#6b7280', sous: '' };
    /* Appel daté d'avant l'arrivée du membre : « Non attribué », précision
       « Prénom (avant son arrivée) » — la règle de Set NB, de la Performance
       équipe et de Pilotage (FunnelCore.ligneAppel → StatsCore.rangPersonne). */
    var la = (FC && typeof FC.ligneAppel === 'function') ? FC.ligneAppel(who, jourIso) : null;
    if (la && la.cas === 'avant_arrivee') return { key: '_na', name: SC.mot('non_attribue'), color: '#6b7280', sous: la.precision, avant: true };
    var m = (who.slug && (window.TEAM_MEMBERS || {})[who.slug]) || {};
    /* Une fiche archivée (active === false) est partie (StatsCore.estParti) :
       elle tombe dans « Anciens membres » ci-dessus, jamais ici. */
    return { key: 'p:' + who.key, name: who.name || who.slug || '', color: m.color || '#6b7280', sous: '' };
  }

  /* ── Lecture ── */
  function fetchLogs() {
    var start = SC.debutJourParis(state.startIso), end = SC.finJourParis(state.endIso);
    var isAdmin = state.role === 'admin';
    return AF.loadCallsForMember(isAdmin ? null : state.myUid, start, end, isAdmin);
  }

  /* ── Agrégat : sortants, décrochés par la règle commune ── */
  /* Vue « Toute l'équipe » (admin) : périmètre du Stats funnel (revue D17,
     FunnelCore.perimetreAppel) — équipe sales + appels sans auteur ; les
     appels de la CSM et des coachs sont à part (hors), jamais dans le total.
     Vue d'une personne (filtre admin, ou « Mes appels ») : tous ses appels. */
  function aggregate(logs) {
    var byRow = {}, byDay = {}, tot = { calls: 0, decroches: 0, talk: 0 }, hors = { calls: 0, decroches: 0, talk: 0 };
    var avant = { calls: 0, sous: '' };
    var equipe = state.role === 'admin' && state.filterUid === 'all';
    var CIDX = FC.callerIndex(rosterComplet());
    /* Filtre d'une personne (admin) : même règle d'auteur que la vue « Toute
       l'équipe » (FunnelCore.callerOf : compte relié, sinon prénom Ringover),
       pour qu'un appel nommé par le seul prénom compte dans les deux vues. */
    var filtre = state.role === 'admin' && state.filterUid !== 'all';
    var cible = filtre ? (CIDX.byUid[state.filterUid] || null) : null;
    (logs || []).forEach(function (c) {
      if (!c || c.direction !== 'outbound') return;
      if (filtre) {
        var auteur = FC.callerOf(c, CIDX);
        if (cible ? !(auteur && auteur.key === cible.key) : c.userId !== state.filterUid) return;
      }
      var ms = c.initiatedAt && c.initiatedAt.toMillis ? c.initiatedAt.toMillis() : null;
      if (ms == null) return;
      var dk = SC.jourParis(ms);
      if (equipe && FC.perimetreAppel(c, CIDX) === 'hors') {
        var dh = AF.isAnswered(c);
        hors.calls++; if (dh) { hors.decroches++; hors.talk += Number(c.durationSec) || 0; }
        return;
      }
      var L = ligneDe(FC.callerOf(c, CIDX), dk);
      /* Vue d'UNE personne (filtre admin, « Mes appels ») : seulement les
         appels de SA ligne. Un appel daté d'avant son arrivée reste en « Non
         attribué » — le même chiffre que sa ligne de « Toute l'équipe », de
         Set NB et de Pilotage : compté à part, dit sous les cartes. */
      if (!equipe && L.avant) { avant.calls++; avant.sous = L.sous; return; }
      var r = byRow[L.key] || (byRow[L.key] = { key: L.key, name: L.name, color: L.color, sous: {}, calls: 0, decroches: 0, talk: 0 });
      if (L.sous) r.sous[L.sous] = 1;
      var d = byDay[dk] || (byDay[dk] = { calls: 0, decroches: 0, talk: 0 });
      var dec = AF.isAnswered(c), talk = dec ? (Number(c.durationSec) || 0) : 0;
      r.calls++; d.calls++; tot.calls++;
      if (dec) { r.decroches++; d.decroches++; tot.decroches++; r.talk += talk; d.talk += talk; tot.talk += talk; }
    });
    return { byRow: byRow, byDay: byDay, tot: tot, hors: hors, avant: avant };
  }

  /* ── Rendu ── */
  function renderShell() {
    var root = $('call-report');
    if (!root) return;
    var presets = [
      { key: 'week', label: 'Cette semaine' }, { key: 'lastweek', label: 'Semaine dernière' },
      { key: 'month', label: 'Ce mois-ci' }, { key: '30days', label: '30 derniers jours' }, { key: 'custom', label: 'Personnalisé' }
    ];
    var filterHtml = '';
    if (state.role === 'admin') {
      /* Règle commune (D10) : une fiche archivée ou partie est un ancien membre,
         jamais nommée ni proposée ici ; son activité reste dans « Toute
         l’équipe », ligne « Anciens membres ». */
      var members = (window.TEAM_MEMBERS_LIST || []).filter(function (m) {
        return m && m.firebaseUid && !SC.estParti(m, m.slug) && !(m.slug && AF.isDeparted(m.slug));
      });
      filterHtml = '<select class="cr-filter-select" id="cr-filter"><option value="all">Toute l’équipe</option>' +
        members.map(function (m) {
          var nm = m.shortName || m.displayName || m.slug;
          return '<option value="' + esc(m.firebaseUid) + '"' + (state.filterUid === m.firebaseUid ? ' selected' : '') + '>' + esc(nm) + '</option>';
        }).join('') + '</select>';
    }
    root.innerHTML = '<div class="cr-section"><div class="cr-card">' +
      '<div class="cr-hdr"><div class="cr-title">📞 Activité téléphonique</div>' +
      '<span class="cr-badge">' + (state.role === 'admin' ? 'Équipe' : 'Mes appels' + SC.info('appels_sous_ton_compte')) + '</span>' +
      '<span class="cr-archived">période propre à ce bloc · heure de Paris</span></div>' +
      '<div class="cr-controls" id="cr-controls">' +
      presets.map(function (p) { return '<button type="button" class="cr-preset' + (state.preset === p.key ? ' active' : '') + '" data-preset="' + p.key + '">' + p.label + '</button>'; }).join('') +
      '<div class="cr-datepair"><label for="cr-date-start">Du</label><input type="date" id="cr-date-start"/><label for="cr-date-end">Au</label><input type="date" id="cr-date-end"/></div>' +
      filterHtml + '</div><div id="cr-body"></div></div></div>';
    $('cr-date-start').value = state.startIso;
    $('cr-date-end').value = state.endIso;
    $('cr-controls').addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.cr-preset') : null;
      if (btn) onPreset(btn.getAttribute('data-preset'));
    });
    $('cr-date-start').addEventListener('change', onDateChange);
    $('cr-date-end').addEventListener('change', onDateChange);
    var f = $('cr-filter');
    if (f) f.addEventListener('change', function (e) { state.filterUid = e.target.value; renderBody(); });
  }
  function setActive() {
    var list = document.querySelectorAll('#call-report .cr-preset');
    for (var i = 0; i < list.length; i++) list[i].className = 'cr-preset' + (list[i].getAttribute('data-preset') === state.preset ? ' active' : '');
    if ($('cr-date-start')) $('cr-date-start').value = state.startIso;
    if ($('cr-date-end')) $('cr-date-end').value = state.endIso;
  }
  function renderBodyLoading() { var b = $('cr-body'); if (b) b.innerHTML = '<div class="cr-loading">Chargement des appels…</div>'; }

  function stat(label, val) {
    return '<div class="cr-stat"><div class="cr-stat-label">' + label + '</div><div class="cr-stat-val">' + val + '</div></div>';
  }
  function renderBody() {
    var body = $('cr-body');
    if (!body) return;
    var logs = state.logs || [];
    var html = '';
    if (logs._erreur) {
      body.innerHTML = '<div class="cr-error">Appels illisibles : ' + esc(logs._erreur) + '. Aucun chiffre n’est affiché plutôt qu’un zéro faux.</div>';
      return;
    }
    if (logs._tronque) html += '<div class="cr-error">⚠ ' + esc(SC.mot('lecture_incomplete')) + SC.info('lecture_incomplete') + ' : trop d’appels sur la période, total partiel — réduis la période.</div>';
    var agg = aggregate(logs), t = agg.tot;
    var avg = t.decroches > 0 ? t.talk / t.decroches : 0;
    var talkInfo = SC.infoLibre('Temps d’appel', 'Temps passé en conversation sur les appels sortants décrochés de la période. Les appels reçus et les messageries ne sont pas comptés.');
    var avgInfo = SC.infoLibre('Durée moyenne', 'Temps d’appel ÷ appels décrochés de la période.');
    html += '<div class="cr-stat-row">' +
      stat(esc(SC.mot('appels')) + SC.info('appels'), fmtNum(t.calls)) +
      stat(esc(SC.mot('decroches')) + SC.info('decroches'), fmtNum(t.decroches)) +
      stat(esc(SC.mot('taux_decroche')) + SC.info('taux_decroche'), SC.fmtPct(SC.pct(t.decroches, t.calls))) +
      stat('Temps d’appel' + talkInfo, fmtDuration(t.talk)) +
      stat('Durée moyenne' + avgInfo, t.decroches > 0 ? fmtDuration(avg) : '—') +
      stat('Plage', '<span style="font-size:15px">' + esc(rangeLabel()) + '</span>') +
      '</div>';
    if (agg.avant && agg.avant.calls) {
      html += '<div class="cr-archived" style="display:block;margin:6px 0 0">' + fmtNum(agg.avant.calls) + ' appel' + (agg.avant.calls > 1 ? 's' : '') +
        ' daté' + (agg.avant.calls > 1 ? 's' : '') + ' d’avant la date d’arrivée — ' + esc(agg.avant.sous) + ' — non compté' + (agg.avant.calls > 1 ? 's' : '') +
        ' ici : rangé' + (agg.avant.calls > 1 ? 's' : '') + ' en « ' + esc(SC.mot('non_attribue')) + ' », comme sur la vue « Toute l’équipe », Set NB et Pilotage.</div>';
    }

    if (state.role === 'admin' && state.filterUid === 'all') {
      var rows = Object.keys(agg.byRow).map(function (k) { return agg.byRow[k]; });
      /* Lignes nominatives d'abord (par temps d'appel), puis les deux lignes collectives. */
      rows.sort(function (a, b) {
        var ca = a.key.charAt(0) === '_' ? 1 : 0, cb = b.key.charAt(0) === '_' ? 1 : 0;
        return ca !== cb ? ca - cb : b.talk - a.talk;
      });
      html += '<div class="cr-table-wrap"><table class="cr-table"><thead><tr>' +
        '<th>Personne</th><th class="num">' + esc(SC.mot('appels')) + SC.info('appels') + '</th><th class="num">' + esc(SC.mot('decroches')) + SC.info('decroches') + '</th>' +
        '<th class="num">' + esc(SC.mot('taux_decroche')) + SC.info('taux_decroche') + '</th><th class="num">Temps d’appel' + talkInfo + '</th><th class="num">Durée moyenne' + avgInfo + '</th>' +
        '</tr></thead><tbody>';
      if (!rows.length) html += '<tr><td colspan="6"><div class="cr-empty">Aucun appel sortant sur cette plage.</div></td></tr>';
      else {
        var tt = { calls: 0, decroches: 0, talk: 0 };
        rows.forEach(function (r) {
          tt.calls += r.calls; tt.decroches += r.decroches; tt.talk += r.talk;
          var extra = '';
          if (r.key === '_anciens') extra = SC.info('anciens_membres');
          else if (r.key === '_na') {
            extra = SC.info('non_attribue') + (r.sous[SC.mot('appels_sans_auteur')] ? ' <span class="cr-archived">' + esc(SC.mot('appels_sans_auteur')) + '</span>' + SC.info('appels_sans_auteur') : '');
            /* Autres précisions de la ligne : « Prénom (avant son arrivée) ». */
            Object.keys(r.sous).forEach(function (sx) { if (sx !== SC.mot('appels_sans_auteur')) extra += ' <span class="cr-archived">' + esc(sx) + '</span>'; });
          }
          html += '<tr><td><span class="cr-dot" style="background:' + esc(r.color) + '"></span>' + esc(r.name) + extra + '</td>' +
            '<td class="num">' + fmtNum(r.calls) + '</td><td class="num">' + fmtNum(r.decroches) + '</td>' +
            '<td class="num">' + SC.fmtPct(SC.pct(r.decroches, r.calls)) + '</td>' +
            '<td class="num">' + fmtDuration(r.talk) + '</td><td class="num">' + (r.decroches > 0 ? fmtDuration(r.talk / r.decroches) : '—') + '</td></tr>';
        });
        html += '<tr class="cr-total"><td>Total équipe' + SC.info('equipe') + '</td><td class="num">' + fmtNum(tt.calls) + '</td><td class="num">' + fmtNum(tt.decroches) + '</td>' +
          '<td class="num">' + SC.fmtPct(SC.pct(tt.decroches, tt.calls)) + '</td><td class="num">' + fmtDuration(tt.talk) + '</td>' +
          '<td class="num">' + (tt.decroches > 0 ? fmtDuration(tt.talk / tt.decroches) : '—') + '</td></tr>';
      }
      if (agg.hors.calls) {
        var hz = agg.hors;
        html += '<tr><td><span class="cr-dot" style="background:#6b7280"></span>' + esc(SC.mot('hors_equipe_sales')) + SC.info('hors_equipe_sales') +
          ' <span class="cr-archived">hors du total</span></td><td class="num">' + fmtNum(hz.calls) + '</td><td class="num">' + fmtNum(hz.decroches) + '</td>' +
          '<td class="num">' + SC.fmtPct(SC.pct(hz.decroches, hz.calls)) + '</td><td class="num">' + fmtDuration(hz.talk) + '</td>' +
          '<td class="num">' + (hz.decroches > 0 ? fmtDuration(hz.talk / hz.decroches) : '—') + '</td></tr>';
      }
      html += '</tbody></table></div>';
    }

    /* Décrochés par jour (Paris). */
    var days = [], cur = state.startIso, guard = 0;
    while (cur <= state.endIso && guard < 100) { days.push(cur); cur = isoPlus(cur, 1); guard++; }
    var maxN = 1;
    days.forEach(function (dk) { var d = agg.byDay[dk]; if (d && d.decroches > maxN) maxN = d.decroches; });
    var JL = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
    html += '<div class="cr-chart-wrap"><div class="cr-chart-title">' + esc(SC.mot('decroches')) + ' par jour' + (guard >= 100 ? ' (100 premiers jours)' : '') + '</div><div class="cr-chart">';
    if (!days.length) html += '<div class="cr-empty" style="flex:1">Aucune donnée.</div>';
    days.forEach(function (dk) {
      var d = agg.byDay[dk] || { calls: 0, decroches: 0, talk: 0 };
      var vide = d.decroches === 0;
      var tip = frCourt(dk) + ' : ' + (d.calls ? fmtNum(d.calls) + ' appels · ' + fmtNum(d.decroches) + ' décrochés — ' + fmtDuration(d.talk) : 'aucun appel');
      html += '<div class="cr-chart-col' + (vide ? ' empty' : '') + '"><div class="cr-chart-tooltip">' + esc(tip) + '</div>' +
        '<div class="cr-chart-bar" style="height:' + Math.max(d.decroches / maxN * 100, 2).toFixed(1) + '%"></div>' +
        '<div class="cr-chart-lbl">' + JL[jourSemaine(dk)] + (+dk.slice(8, 10)) + '</div></div>';
    });
    html += '</div></div>';
    body.innerHTML = html;
  }

  /* ── Événements ── */
  function onPreset(key) {
    if (key === 'custom') { state.preset = 'custom'; setActive(); return; }
    var r = presetRange(key);
    if (!r) return;
    state.startIso = r.start; state.endIso = r.end; state.preset = key;
    setActive();
    reload();
  }
  function onDateChange() {
    var s = $('cr-date-start').value, e = $('cr-date-end').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s) || !/^\d{4}-\d{2}-\d{2}$/.test(e) || s > e) return;
    state.startIso = s; state.endIso = e; state.preset = 'custom';
    setActive();
    reload();
  }
  function reload() {
    var tok = ++state.tok;
    renderBodyLoading();
    fetchLogs().then(function (logs) {
      if (tok !== state.tok) return;
      state.logs = logs || [];
      renderBody();
    }, function (e) {
      if (tok !== state.tok) return;
      var b = $('cr-body');
      if (b) b.innerHTML = '<div class="cr-error">Impossible de charger les appels : ' + esc((e && e.message) || e) + '</div>';
    });
  }

  function init(detail) {
    if (state.role) return;
    state.role = (detail && detail.role) || window._currentRole || localStorage.getItem('ambitio_role') || '';
    state.myUid = (detail && detail.uid) || window._currentUserUid || null;
    if (state.role !== 'admin' && state.role !== 'sales') { state.role = null; return; }   // coach / autres : hors périmètre
    var wk = presetRange('week');
    state.startIso = wk.start; state.endIso = wk.end;
    renderShell();
    reload();
    window.addEventListener('team-members-loaded', function () { renderShell(); renderBody(); });
  }
  if (window.__dashReady) init(window.__dashReady);
  else window.addEventListener('dash-ready', function (e) { init(e && e.detail); });
})();
</script>
</body>
</html>
