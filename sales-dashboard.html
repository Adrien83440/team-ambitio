/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
const ALL_WEEKS = ['s1','s2','s3','s4','s5','s6'];

const DB = {
  months: ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],

  // Données brutes saisies (remplacées par Firestore)
  _raw: {

      s2: { calls:8,  lives:4, offres:2, closes:2, hc:2, fu:0, contracte:12000, collecte:1000 },

      s4: { calls:9,  lives:7, offres:2, closes:0, hc:0, fu:0, contracte:1800,  collecte:200  },

    setting: {

    },
    deals: [
      { client:'Julie Berchoux',     email:'julieberchoux@icloud.com',         offre:'BP 12', type:'Closing', date:'24/01/2026', cHT:6000, coHT:500,  comm:500, bonus:0, notes:'Setting après self booking', ok:true  },
      { client:'Corinne Alaga',      email:'contact@lestabliersgourmands.com', offre:'BP 12', type:'Setting', date:'27/01/2026', cHT:null, coHT:null,  comm:125, bonus:0, notes:"Setting d'un close d'Elodie", ok:true  },
      { client:'Belinda Giangiulio', email:'lesdemoisellesduvrac@gmail.com',   offre:'BP 12', type:'Closing', date:'30/01/2026', cHT:6000, coHT:500,  comm:500, bonus:0, notes:'Setting no-booking',         ok:true  },
      { client:'Cecile Auneau',      email:'domcecile@gmail.com',              offre:'BP 12', type:'Closing', date:'09/02/2026', cHT:6000, coHT:500,  comm:500, bonus:0, notes:'Setting no-booking',         ok:true  },
      { client:'Justine Biton',      email:'lephildesidees@hotmail.com',       offre:'BP 12', type:'Closing', date:'09/02/2026', cHT:6000, coHT:500,  comm:500, bonus:0, notes:'Setting no-booking',         ok:true  },
    ],
  },

  // Calculé depuis _raw
  closing: null,
  setting: null,
  commissions: {
    'Janvier 2026': { contracte:12000, collecte:0,    totalComm:0,    statut:'Validé',     deals:[] },
    'Février 2026': { contracte:24000, collecte:2000, totalComm:2125, statut:'En attente', deals:[] },
    'Mars 2026':    { contracte:0,     collecte:0,    totalComm:1625, statut:'En attente', deals:[] },
  },
  team: {
    week: [
      { name:'Guillaume', role:'Closing + Setting', color:'#ef4444', contracte:33020, collecte:3342,  calls:23, lives:20, offres:14, closes:6, showup:0.87, txOffre:0.70,  txTransfoShow:0.30,  txTransfoOffre:0.429, caCall:1435.7 },
      { name:'Elodie',    role:'Closing',           color:'#60a5fa', contracte:22748, collecte:13629, calls:29, lives:24, offres:19, closes:7, showup:0.83, txOffre:0.792, txTransfoShow:0.292, txTransfoOffre:0.368, caCall:784.4  },
    ],
    month: [
      { name:'Guillaume', role:'Closing + Setting', color:'#ef4444', contracte:48469, collecte:4686, calls:56, lives:33, offres:17, closes:9, showup:0.589, txOffre:0.515, txTransfoShow:0.273, txTransfoOffre:0.529, caCall:721.3 },
      { name:'Elodie',    role:'Closing',           color:'#60a5fa', contracte:34069, collecte:3966, calls:46, lives:28, offres:13, closes:7, showup:0.609, txOffre:0.464, txTransfoShow:0.25,  txTransfoOffre:0.538, caCall:617.2 },
    ],
  },

  // Recalcule toutes les métriques depuis _raw
  compute() {
    const rc = DB._raw.closing;
    const rs = DB._raw.setting;
    const pc = PROJECTIONS.closing;
    const ps = PROJECTIONS.setting;

    const sumC  = k => ALL_WEEKS.reduce((t,w) => t + ((rc[w]||{})[k]||0), 0);
    const sumS  = k => ALL_WEEKS.reduce((t,w) => t + ((rs[w]||{})[k]||0), 0);
    const projC = k => ALL_WEEKS.reduce((t,w) => t + ((pc[w]||{})[k]||0), 0);
    const projS = k => ALL_WEEKS.reduce((t,w) => t + ((ps[w]||{})[k]||0), 0);

    const ca=sumC('calls'), la=sumC('lives'), oa=sumC('offres'), cla=sumC('closes');
    const cta=sumC('contracte'), cola=sumC('collecte');
    const cp=projC('calls'), lp=projC('lives'), op=projC('offres'), clp=projC('closes');
    const ctp=projC('contracte'), colp=projC('collecte');

    DB.closing = {
      mois: {
        calls:     {a:ca,  p:cp  },
        lives:     {a:la,  p:lp  },
        offres:    {a:oa,  p:op  },
        closes:    {a:cla, p:clp },
        hc:        {a:sumC('hc'), p:clp},
        fu:        {a:sumC('fu'), p:0  },
        contracte: {a:cta, p:ctp },
        collecte:  {a:cola,p:colp},
        livesP:  {a:ca>0  ? la/ca   : 0, p:pc.livesP  },
        offresP: {a:la>0  ? oa/la   : 0, p:pc.offresP },
        engP:    {a:oa>0  ? cla/oa  : 0, p:pc.engP    },
        cOffP:   {a:oa>0  ? cla/oa  : 0, p:pc.cOffP   },
        cCallP:  {a:ca>0  ? cla/ca  : 0, p:pc.cCallP  },
        cashLive:{a:la>0  ? cta/la  : 0, p:pc.cashLive},
        atteinte: ctp>0 ? cta/ctp : 0,
        delta:    Math.max(0, ctp-cta),
      },
      ...Object.fromEntries(ALL_WEEKS.filter(w => rc[w]).map(w => [w, DB._cw(w)])),
    };

    const sca=sumS('calls'), da=sumS('decroches'), pa=sumS('propRdv');
    const sa=sumS('sets'), pra=sumS('presents'), sca2=sumS('closes');

    DB.setting = {
      mois: {
        leads:     {a:sumS('leads'),  p:projS('leads')    },
        calls:     {a:sca,            p:projS('calls')    },
        decroches: {a:da,             p:projS('decroches')},
        propRdv:   {a:pa,             p:projS('propRdv')  },
        sets:      {a:sa,             p:projS('sets')     },
        presents:  {a:pra,            p:projS('presents') },
        closes:    {a:sca2,           p:projS('closes')   },
        decrochesP:{a:sca>0?da/sca:0,  p:ps.decrochesP },
        engP:      {a:da>0 ?pa/da:0,    p:ps.engP       },
        setP:      {a:pa>0 ?sa/pa:0,    p:ps.setP       },
        showupP:   {a:sa>0 ?pra/sa:0,   p:ps.showupP    },
        cCallP:    {a:sca>0?sca2/sca:0, p:ps.cCallP     },
      },
      ...Object.fromEntries(ALL_WEEKS.filter(w => rs[w]).map(w => [w, DB._sw(w)])),
    };

    // Sync deals dans commissions
    try {
      const cmk = (typeof localStorage !== 'undefined' && localStorage.getItem('sales_month')) || 'Février 2026';
      if (DB.commissions[cmk]) DB.commissions[cmk].deals = DB._raw.deals;
    } catch(e) {}
  },

  _cw(w) {
    const d=DB._raw.closing[w]||{}, p=PROJECTIONS.closing[w]||PROJECTIONS.closing.s1||{};
    return {
      calls:{a:d.calls||0,p:p.calls||0}, lives:{a:d.lives||0,p:p.lives||0},
      offres:{a:d.offres||0,p:p.offres||0}, closes:{a:d.closes||0,p:p.closes||0},
      hc:{a:d.hc||0,p:p.closes||0}, fu:{a:d.fu||0,p:0},
      contracte:{a:d.contracte||0,p:p.contracte||0}, collecte:{a:d.collecte||0,p:p.collecte||0},
    };
  },
  _sw(w) {
    const d=DB._raw.setting[w]||{}, p=PROJECTIONS.setting[w]||PROJECTIONS.setting.s1||{};
    return {
      leads:{a:d.leads||0,p:p.leads||0}, calls:{a:d.calls||0,p:p.calls||0},
      decroches:{a:d.decroches||0,p:p.decroches||0}, propRdv:{a:d.propRdv||0,p:p.propRdv||0},
      sets:{a:d.sets||0,p:p.sets||0}, presents:{a:d.presents||0,p:p.presents||0},
      closes:{a:d.closes||0,p:p.closes||0},
    };
  },
};

DB.compute();

/* ═══════════════════════════════════════════════════════════
   FIREBASE — couche temps réel
   Initialisé après que firebase SDK soit chargé + auth ready
═══════════════════════════════════════════════════════════ */
const Fire = {
  db:  null,
  uid: null,
  _unsubs: [],

  init(firestore, uid) {
    Fire.db  = firestore;
    Fire.uid = uid;
  },

  _key(label) {
    const p = label.split(' ');
    const m = DB.months.indexOf(p[0]);
    return `${p[1]}-${String(m+1).padStart(2,'0')}`;
  },

  // Écoute en temps réel les données d'un user pour un mois
  watchUser(userId, monthLabel, callback) {
    if (!Fire.db) return () => {};
    const ref = Fire.db
      .collection('saisies').doc(userId)
      .collection('mois').doc(Fire._key(monthLabel));
    const unsub = ref.onSnapshot(snap => callback(snap.exists ? snap.data() : null));
    Fire._unsubs.push(unsub);
    return unsub;
  },

  // Sauvegarde une semaine de closing
  async saveClosing(userId, monthLabel, week, data) {
    if (!Fire.db) throw new Error('Firebase non init');
    const ref = Fire.db.collection('saisies').doc(userId)
      .collection('mois').doc(Fire._key(monthLabel));
    await ref.set({ closing: { [week]: data } }, { merge: true });
  },

  // Sauvegarde une semaine de setting
  async saveSetting(userId, monthLabel, week, data) {
    if (!Fire.db) throw new Error('Firebase non init');
    const ref = Fire.db.collection('saisies').doc(userId)
      .collection('mois').doc(Fire._key(monthLabel));
    await ref.set({ setting: { [week]: data } }, { merge: true });
  },

  // Sauvegarde un deal (append)
  async saveDeal(userId, monthLabel, deal) {
    if (!Fire.db) throw new Error('Firebase non init');
    const ref = Fire.db.collection('saisies').doc(userId)
      .collection('mois').doc(Fire._key(monthLabel));
    const snap = await ref.get();
    const deals = snap.exists ? (snap.data().deals || []) : [];
    deals.push({ ...deal, _ts: Date.now() });
    await ref.set({ deals }, { merge: true });
  },

  // Applique un snapshot Firestore dans DB puis recalcule
  apply(data) {
    if (!data) return;
    if (data.closing) ALL_WEEKS.forEach(w => {
      if (data.closing[w]) Object.assign(DB._raw.closing[w]||(DB._raw.closing[w]={}), data.closing[w]);
    });
    if (data.setting) ALL_WEEKS.forEach(w => {
      if (data.setting[w]) Object.assign(DB._raw.setting[w]||(DB._raw.setting[w]={}), data.setting[w]);
    });
    if (data.deals) DB._raw.deals = data.deals;
    DB.compute();
    document.dispatchEvent(new CustomEvent('db:updated'));
  },

  stop() { Fire._unsubs.forEach(u => u()); Fire._unsubs = []; },
};

/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
const U = {
  euro:  v => v == null ? '—' : '€\u202f' + Number(v).toLocaleString('fr-FR'),
  pct:   v => v == null ? '—' : (v * 100).toFixed(1) + '%',
  num:   v => v == null ? '—' : Number(v).toLocaleString('fr-FR'),
  pp:  (a, p) => p > 0 ? Math.min((a / p) * 100, 200) : 0,
  ppv: (a, p) => p > 0 ? ((a / p) * 100).toFixed(0) + '%' : '—',
  cb:  (a, p) => { const r = p > 0 ? a / p : 0; return r >= 1 ? '#34d399' : r >= 0.65 ? '#f59e0b' : '#ef4444'; },
  g:   id => document.getElementById(id),
  getCurrentMonth: () => (typeof localStorage !== 'undefined' && localStorage.getItem('sales_month')) || 'Février 2026',
  getCurrentUser:  () => ({
    uid:  window._currentUserUid  || localStorage.getItem('ambitio_uid')  || 'guillaume',
    name: window._currentUserName || localStorage.getItem('ambitio_name') || 'Guillaume',
    role: window._currentRole     || localStorage.getItem('ambitio_role') || 'sales',
  }),

  progRow: (label, a, p, isEuro = false) => {
    const col = U.cb(a, p);
    return `<div class="pr">
      <div class="pr-l">${label}</div>
      <div class="pr-track"><div class="pr-fill" style="width:${Math.min(U.pp(a,p),100)}%;background:${col}"></div></div>
      <div class="pr-val">${isEuro ? `${U.euro(a)} / ${U.euro(p)}` : `${a} / ${p}`}</div>
      <div class="pr-pct" style="color:${col}">${U.ppv(a,p)}</div>
    </div>`;
  },

  kpiCard: ({ label, val, sub, rawA, proj, color='#ef4444', pct:fp }) => {
    const pc = fp!=null ? fp : (proj!=null ? U.pp(rawA??0, proj) : null);
    return `<div class="kpi" style="--kc:${color}">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value">${val}</div>
      ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
      ${pc!=null ? `<div class="kpi-prog">
        <div class="kpi-prog-row"><span>Atteinte</span><span>${pc.toFixed(0)}%</span></div>
        <div class="kpi-prog-track"><div class="kpi-prog-fill" style="width:${Math.min(pc,100)}%;background:${color}"></div></div>
      </div>` : ''}
    </div>`;
  },

  funnelStep: (label, val, max, isFirst=false, isEuro=false) => {
    const ratio = max > 0 ? val / max : 0;
    return `<div class="fs">
      <div class="fs-label">${label}</div>
      <div class="fs-track"><div class="fs-fill" style="width:${Math.min(ratio*100,100)}%"></div></div>
      <div class="fs-val">${isEuro ? U.euro(val) : val}</div>
      <div class="fs-rate">${!isFirst ? U.pct(ratio) : ''}</div>
    </div>`;
  },

  weekCard: (label, mainVal, mainLabel, minis, isCurrent, dateRange) => `
    <div class="wc${isCurrent?' wc-active':''}">
      <div class="wc-label">${label}</div>
      ${dateRange ? `<div class="wc-dates">${dateRange}</div>` : ''}
      <div class="wc-main">${mainVal}</div>
      <div class="wc-sub">${mainLabel}</div>
      <div class="wc-grid">${minis.map(m=>`
        <div class="wc-mini">
          <div class="wc-mini-v"${m.color?` style="color:${m.color}"`:''} >${m.val}</div>
          <div class="wc-mini-l">${m.label}</div>
        </div>`).join('')}</div>
    </div>`,

  barChart: (labels, actuals, projs, unit='') => {
    const mx = Math.max(...actuals, ...projs, 1);
    return `<div class="chart-legend">
        <span class="cl-dot cl-real"></span>Réel
        <span class="cl-dot cl-proj" style="margin-left:14px"></span>Projection
      </div>
      <div class="chart-bars">
        ${labels.map((l,i)=>`<div class="chart-col">
          <div class="chart-pair">
            <div class="chart-bar bar-real" style="height:${(actuals[i]/mx*100).toFixed(1)}%" title="${actuals[i]}${unit}"></div>
            <div class="chart-bar bar-proj" style="height:${(projs[i]/mx*100).toFixed(1)}%" title="Proj:${projs[i]}${unit}"></div>
          </div>
          <div class="chart-lbl">${l}</div>
        </div>`).join('')}
      </div>`;
  },

  toast: (msg, type='success') => {
    let t = document.getElementById('_toast');
    if (!t) { t=document.createElement('div'); t.id='_toast'; document.body.appendChild(t); }
    const s = { success:'background:#1a2e1a;border:1px solid rgba(52,211,153,.3);color:#6ee7b7', error:'background:#2e1a1a;border:1px solid rgba(239,68,68,.3);color:#fca5a5', info:'background:#1a1a2e;border:1px solid rgba(96,165,250,.3);color:#93c5fd' };
    t.style.cssText = `position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(0);font-size:12px;font-weight:600;padding:9px 18px;border-radius:10px;z-index:9999;opacity:1;transition:all .28s;white-space:nowrap;font-family:var(--font-b);${s[type]||s.success}`;
    t.textContent = msg;
    clearTimeout(t._t);
    t._t = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; }, 2800);
  },
};


/* ═══════════════════════════════════════════════════════════
   SEMAINES DU MOIS
   Avant Mars 2026 : semaines lun→dim classiques (peuvent déborder)
   À partir de Mars 2026 : semaines strictement dans le mois
     - Segments ≤ 3 jours fusionnés avec la semaine adjacente
═══════════════════════════════════════════════════════════ */
function getMonthWeeks(monthLabel) {
  const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin',
                     'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const parts = monthLabel.split(' ');
  const month = MONTHS_FR.indexOf(parts[0]);
  const year  = parseInt(parts[1]);
  if (month === -1 || isNaN(year)) return [];

  const pad = n => String(n).padStart(2,'0');
  function fmt(d) { return pad(d.getDate()) + '/' + pad(d.getMonth()+1); }
  function fmtShort(d) {
    const M = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
    return d.getDate() + ' ' + M[d.getMonth()];
  }
  function dayCount(a, b) { return Math.round((b - a) / 86400000) + 1; }

  /* ── Ancien mode (avant Mars 2026) : semaines lun→dim, débordement OK ── */
  if (year < 2026 || (year === 2026 && month < 2)) {
    const firstOfMonth = new Date(year, month, 1);
    const dayOfWeek = firstOfMonth.getDay();
    const daysToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    let monday = new Date(year, month, 1 + daysToMonday);
    const weeks = [];
    while (true) {
      const sunday = new Date(monday.getTime() + 6 * 86400000);
      if (monday.getMonth() === month || sunday.getMonth() === month) {
        weeks.push({
          id: 's' + (weeks.length + 1), label: 'S' + (weeks.length + 1),
          start: new Date(monday), end: new Date(sunday),
          range: fmt(monday) + ' \u2192 ' + fmt(sunday),
          short: fmtShort(monday) + ' \u2013 ' + fmtShort(sunday),
          tab:   fmt(monday) + '\u2192' + fmt(sunday),
        });
      }
      monday = new Date(monday.getTime() + 7 * 86400000);
      if (monday.getMonth() !== month && monday.getMonth() !== (month === 0 ? 11 : month - 1)) {
        if (monday.getMonth() !== month) break;
      }
      if (monday.getFullYear() > year + 1) break;
      if (weeks.length >= 6) break;
    }
    return weeks;
  }

  /* ── Nouveau mode (Mars 2026+) : semaines dans le mois, fusion si ≤ 3j ── */
  const lastDay = new Date(year, month + 1, 0);
  const segs    = [];
  let cursor    = new Date(year, month, 1);

  while (cursor <= lastDay) {
    const dow = cursor.getDay();
    let end;
    if (dow === 1) { end = new Date(cursor.getTime() + 6 * 86400000); }
    else { end = new Date(cursor.getTime() + (dow === 0 ? 0 : 7 - dow) * 86400000); }
    if (end > lastDay) end = new Date(lastDay);
    segs.push({ start: new Date(cursor), end: new Date(end) });
    cursor = new Date(end.getTime() + 86400000);
  }

  // Fusion début si ≤ 3 jours
  if (segs.length >= 2 && dayCount(segs[0].start, segs[0].end) <= 3) {
    segs[1].start = segs[0].start;
    segs.shift();
  }
  // Fusion fin si ≤ 3 jours
  if (segs.length >= 2 && dayCount(segs[segs.length-1].start, segs[segs.length-1].end) <= 3) {
    segs[segs.length-2].end = segs[segs.length-1].end;
    segs.pop();
  }

  return segs.map((s, i) => ({
    id:    's' + (i + 1),
    label: 'S' + (i + 1),
    start: s.start,
    end:   s.end,
    range: fmt(s.start) + ' \u2192 ' + fmt(s.end),
    short: fmtShort(s.start) + ' \u2013 ' + fmtShort(s.end),
    tab:   fmt(s.start) + '\u2192' + fmt(s.end),
  }));
}

window.DB=DB; window.U=U; window.Fire=Fire; window.PROJECTIONS=PROJECTIONS;
window.getMonthWeeks=getMonthWeeks; window.ALL_WEEKS=ALL_WEEKS;

/* === end sales-data.js === */

    var fsKey = _year + '-' + String(m+1).padStart(2,'0');
    results[monthKey] = {};
    for (var u = 0; u < SYNC_UIDS.length; u++) {
      var uid = SYNC_UIDS[u];
      var data = null;
      if (db) {
        try {
          var ref = db.collection('saisies').doc(uid).collection('mois').doc(fsKey);
          var snap = await ref.get();
          if (snap.exists) {
            var raw = snap.data();
            data = { closing: null, setting: null };
            if (raw.closing_total) data.closing = raw.closing_total;
            else if (raw.closing) {
              var t = {}; ['calls','lives','offres','closes','hardClose','followUp','contracte','collecte'].forEach(function(k){t[k]=0;});
              ALL_WEEKS.forEach(function(w){ if(raw.closing[w]) Object.keys(t).forEach(function(k){t[k]+=(raw.closing[w][k]||0);}); });
              data.closing = t;
            }
            if (raw.setting_total) data.setting = raw.setting_total;
            else if (raw.setting) {
              var t = {}; ['leads','calls','decroches','propRdv','sets','presents','closes','collecte'].forEach(function(k){t[k]=0;});
              ALL_WEEKS.forEach(function(w){ if(raw.setting[w]) Object.keys(t).forEach(function(k){t[k]+=(raw.setting[w][k]||0);}); });
              data.setting = t;
            }
          }
        } catch(e) { console.warn('[year] Firestore err', uid, monthKey, e.message); }
      }
      if (!data) {
        var cls = null, set = null;
        try { var v = localStorage.getItem('saisie_closing_'+uid+'_'+monthKey) || localStorage.getItem('closing_'+uid+'_'+monthKey); cls = v ? JSON.parse(v) : null; } catch(e){}
        try { var v = localStorage.getItem('saisie_setting_'+uid+'_'+monthKey) || localStorage.getItem('setting_'+uid+'_'+monthKey); set = v ? JSON.parse(v) : null; } catch(e){}
        if (cls || set) {
          data = { closing: null, setting: null };
          if (cls) {
            if (cls._total) data.closing = cls._total;
            else { var t = {}; ['calls','lives','offres','closes','hardClose','followUp','contracte','collecte'].forEach(function(k){t[k]=0;}); ALL_WEEKS.forEach(function(w){if(cls[w])Object.keys(t).forEach(function(k){t[k]+=(cls[w][k]||0);});}); data.closing = t; }
          }
          if (set) {
            if (set._total) data.setting = set._total;
            else { var t = {}; ['leads','calls','decroches','propRdv','sets','presents','closes','collecte'].forEach(function(k){t[k]=0;}); ALL_WEEKS.forEach(function(w){if(set[w])Object.keys(t).forEach(function(k){t[k]+=(set[w][k]||0);});}); data.setting = t; }
          }
        }
      }
      if (!data) {
        var h = HIST_DATA[uid];
        if (h) {
          data = { closing: null, setting: null };
          if (h.closing && h.closing[monthKey]) data.closing = h.closing[monthKey];
          if (h.closing_weekly && h.closing_weekly[monthKey]) {
            var weeks = h.closing_weekly[monthKey];
            var t = {}; ['calls','lives','offres','closes','hardClose','followUp','contracte','collecte'].forEach(function(k){t[k]=0;});
            Object.values(weeks).forEach(function(w){Object.keys(t).forEach(function(k){t[k]+=(w[k]||0);});});
            data.closing = t;
          }
          if (h.setting && h.setting[monthKey]) data.setting = h.setting[monthKey];
          if (h.setting_weekly && h.setting_weekly[monthKey]) {
            var weeks = h.setting_weekly[monthKey];
            var t = {}; ['leads','calls','decroches','propRdv','sets','presents','closes','collecte'].forEach(function(k){t[k]=0;});
            Object.values(weeks).forEach(function(w){Object.keys(t).forEach(function(k){t[k]+=(w[k]||0);});});
            data.setting = t;
          }
          if (!data.closing && !data.setting) data = null;
        }
      }
      results[monthKey][uid] = data;
    }
  }
  return results;
}

/* ═══════════════════════════════════════════════════════════
   AGRÉGER — prend en compte closing + setting complet
═══════════════════════════════════════════════════════════ */
function aggregateData(yearData, monthKeys) {
  var totals = { calls:0, lives:0, offres:0, closes:0, contracte:0, collecte:0,
                 sLeads:0, sCalls:0, sDecroches:0, sPropRdv:0, sSets:0, sPresents:0, sCloses:0 };
  var perMonth = {};
  var perMember = {};
  SYNC_UIDS.forEach(function(uid) { perMember[uid] = { calls:0, lives:0, offres:0, closes:0, contracte:0, collecte:0, sLeads:0, sCalls:0, sDecroches:0, sPropRdv:0, sSets:0, sPresents:0, sCloses:0 }; });

  monthKeys.forEach(function(mk) {
    var mData = yearData[mk] || {};
    var mt = { calls:0, lives:0, offres:0, closes:0, contracte:0, collecte:0,
               sLeads:0, sCalls:0, sDecroches:0, sPropRdv:0, sSets:0, sPresents:0, sCloses:0, hasData:false };
    SYNC_UIDS.forEach(function(uid) {
      var d = mData[uid];
      if (!d) return;
      if (d.closing) {
        mt.hasData = true;
        ['calls','lives','offres','closes','contracte','collecte'].forEach(function(k) {
          var v = d.closing[k] || 0; mt[k] += v; totals[k] += v; perMember[uid][k] += v;
        });
      }
      if (d.setting) {
        mt.hasData = true;
        var map = {leads:'sLeads',calls:'sCalls',decroches:'sDecroches',propRdv:'sPropRdv',sets:'sSets',presents:'sPresents',closes:'sCloses'};
        Object.keys(map).forEach(function(sk) {
          var v = d.setting[sk] || 0; var tk = map[sk]; mt[tk] += v; totals[tk] += v; perMember[uid][tk] += v;
        });
      }
    });
    perMonth[mk] = mt;
  });
  return { totals: totals, perMonth: perMonth, perMember: perMember };
}

/* ═══════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════ */
var _yearData = null;

async function refreshYear() {
  document.getElementById('year-lbl').textContent = yearLabel();
  _yearData = await loadYearData();
  renderAll();
}

function renderAll() {
  if (!_yearData) return;
  var allMK = MF.map(function(m) { return m + ' ' + _year; });
  var fullAgg = aggregateData(_yearData, allMK);

  renderObjectiveBar(fullAgg.totals.contracte);
  renderPeriodSelector(fullAgg.perMonth);

  var activeMK, label;
  if (_viewMode === 'year') {
    activeMK = allMK;
    label = 'Année ' + _year;
  } else {
    activeMK = _selectedMonths;
    label = activeMK.length === 1 ? activeMK[0] : activeMK[0].split(' ')[0] + ' → ' + activeMK[activeMK.length-1].split(' ')[0] + ' ' + _year;
  }

  var agg = (_viewMode === 'year') ? fullAgg : aggregateData(_yearData, activeMK);
  renderContent(agg, fullAgg.perMonth, label);
}

/* ── OBJECTIVE BAR ── */
function renderObjectiveBar(contracteTotal) {
  var pct = Math.min(contracteTotal / OBJECTIF_ANNUEL * 100, 100);
  var remaining = Math.max(OBJECTIF_ANNUEL - contracteTotal, 0);
  var color = pct >= 100 ? '#34d399' : pct >= 50 ? '#f59e0b' : '#ef4444';
  var gradient = pct >= 100 ? 'linear-gradient(90deg,#065f46,#34d399)' : pct >= 50 ? 'linear-gradient(90deg,#92400e,#f59e0b)' : 'linear-gradient(90deg,#991b1b,#ef4444)';
  document.getElementById('obj-bar').innerHTML =
    '<div class="obj-header">' +
      '<div>' +
        '<div class="obj-title">Objectif annuel ' + _year + '</div>' +
        '<div class="obj-amount">' + U.euro(contracteTotal) + ' <small>/ ' + U.euro(OBJECTIF_ANNUEL) + '</small></div>' +
      '</div>' +
      '<div style="text-align:right">' +
        '<div style="font-size:36px;font-weight:800;color:' + color + ';font-family:var(--font-d);line-height:1">' + pct.toFixed(1) + '%</div>' +
        '<div class="obj-target">contracté</div>' +
      '</div>' +
    '</div>' +
    '<div class="obj-track">' +
      '<div class="obj-fill" data-pct="' + pct.toFixed(1) + '%" style="width:' + pct + '%;background:' + gradient + '"></div>' +
    '</div>' +
    '<div class="obj-stats">' +
      '<div class="obj-stat">Restant : <b>' + U.euro(remaining) + '</b></div>' +
      '<div class="obj-stat">Mois écoulés : <b>' + getElapsedMonths() + '/12</b></div>' +
      (pct > 0 ? '<div class="obj-stat">Rythme projeté : <b>' + U.euro(contracteTotal / Math.max(getElapsedMonths(), 1) * 12) + '</b></div>' : '') +
    '</div>';
}

/* ── PERIOD SELECTOR ── */
function renderPeriodSelector(perMonth) {
  // Tabs
  var tabs = [
    { mode:'year',  label:'📊 Année entière' },
    { mode:'month', label:'📅 Mois' },
    { mode:'range', label:'📐 Période' },
  ];
  document.getElementById('period-tabs').innerHTML = tabs.map(function(t) {
    return '<div class="period-tab' + (_viewMode === t.mode ? ' active' : '') + '" onclick="setViewMode(\'' + t.mode + '\')">' + t.label + '</div>';
  }).join('');

  // Month grid
  var html = MF.map(function(m, i) {
    var mk = m + ' ' + _year;
    var md = perMonth[mk];
    var hasData = md && md.hasData;
    var isActive = _selectedMonths.indexOf(mk) >= 0;
    var inRange = false;
    if (_viewMode === 'range' && _selectedMonths.length >= 2) {
      var first = MF.indexOf(_selectedMonths[0].split(' ')[0]);
      var last = MF.indexOf(_selectedMonths[_selectedMonths.length-1].split(' ')[0]);
      inRange = i >= first && i <= last;
    }
    var cls = 'month-btn';
    if (isActive) cls += ' active';
    else if (inRange) cls += ' in-range';
    if (hasData) cls += ' has-data';
    return '<div class="' + cls + '" onclick="clickMonth(' + i + ')" data-idx="' + i + '">' + m.slice(0, 3) + '</div>';
  }).join('');
  document.getElementById('month-grid').innerHTML = html;

  // Info
  var info = '';
  if (_viewMode === 'range' && _rangeStart !== null && _selectedMonths.length < 2) {
    info = '💡 Cliquer sur un second mois pour définir la plage';
  } else if (_viewMode === 'range' && _selectedMonths.length >= 2) {
    info = '📐 ' + _selectedMonths[0] + ' → ' + _selectedMonths[_selectedMonths.length - 1];
  }
  document.getElementById('period-info').textContent = info;
}

function setViewMode(mode) {
  _viewMode = mode;
  _selectedMonths = [];
  _rangeStart = null;
  renderAll();
}

function clickMonth(idx) {
  var mk = MF[idx] + ' ' + _year;
  if (_viewMode === 'year') {
    // Passer en mode mois
    _viewMode = 'month';
    _selectedMonths = [mk];
  } else if (_viewMode === 'month') {
    _selectedMonths = [mk];
  } else if (_viewMode === 'range') {
    if (_rangeStart === null) {
      _rangeStart = idx;
      _selectedMonths = [mk];
    } else {
      var from = Math.min(_rangeStart, idx);
      var to = Math.max(_rangeStart, idx);
      _selectedMonths = [];
      for (var i = from; i <= to; i++) _selectedMonths.push(MF[i] + ' ' + _year);
      _rangeStart = null;
    }
  }
  renderAll();
}

/* ── MAIN CONTENT ── */
function renderContent(agg, perMonth, label) {
  var T = agg.totals;
  var isYear = _viewMode === 'year';
  var h = '';

  // Back button if not year
  if (!isYear) {
    h += '<div class="drill-back" onclick="setViewMode(\'year\')">◀ Retour année ' + _year + '</div>';
  }

  // ── KPIs CLOSING ──
  h += '<div class="section-title" style="margin-top:0">Closing</div>';
  h += '<div class="yr-grid">';
  h += kpi('Contracté', U.euro(T.contracte), T.closes + ' closes', '#ef4444');
  h += kpi('Collecté', U.euro(T.collecte), T.contracte > 0 ? (T.collecte/T.contracte*100).toFixed(0) + '% du contracté' : '', '#34d399');
  h += kpi('Calls → Lives', U.num(T.calls), T.lives + ' lives · ' + T.offres + ' offres', '#f59e0b');
  var txClose = T.offres > 0 ? (T.closes/T.offres*100).toFixed(1) + '%' : '—';
  h += kpi('Tx Closing', txClose, T.closes + '/' + T.offres + ' offres', '#ef4444');
  h += '</div>';

  // ── KPIs SETTING ──
  h += '<div class="section-title">Setting</div>';
  h += '<div class="yr-grid">';
  h += kpi('Appels Setting', U.num(T.sCalls), T.sDecroches + ' décrochés', '#60a5fa');
  h += kpi('RDV posés', U.num(T.sSets), T.sPresents + ' présents · ' + T.sCloses + ' closes', '#818cf8');
  var txDecroche = T.sCalls > 0 ? (T.sDecroches/T.sCalls*100).toFixed(1) + '%' : '—';
  h += kpi('Tx Décroché', txDecroche, T.sDecroches + '/' + T.sCalls + ' appels', '#60a5fa');
  var txShowup = T.sSets > 0 ? (T.sPresents/T.sSets*100).toFixed(1) + '%' : '—';
  h += kpi('Tx Show-up', txShowup, T.sPresents + '/' + T.sSets + ' sets', '#34d399');
  h += '</div>';

  // ── CHART + FUNNELS ──
  if (isYear || _selectedMonths.length > 1) {
    // Chart contracté par mois
    h += '<div class="yr-row-3">';
    h += '<div class="yr-card">';
    h += '<div class="yr-card-hdr"><div class="yr-card-title">Contracté & Collecté — ' + label + '</div></div>';
    h += '<div class="chart-legend-row">';
    h += '<div class="chart-legend-item"><div class="chart-legend-dot" style="background:#ef4444"></div>Contracté</div>';
    h += '<div class="chart-legend-item"><div class="chart-legend-dot" style="background:#34d399"></div>Collecté</div>';
    h += '<div class="chart-legend-item"><div class="chart-legend-dot" style="background:#60a5fa"></div>Sets</div>';
    h += '</div>';
    h += '<div class="yr-chart" id="yr-chart"></div>';
    h += '</div>';

    // Closing funnel
    h += '<div class="yr-card">';
    h += '<div class="yr-card-hdr"><div class="yr-card-title">Funnel Closing</div></div>';
    h += renderFunnel(
      [{l:'Calls',v:T.calls},{l:'Lives',v:T.lives},{l:'Offres',v:T.offres},{l:'Closes',v:T.closes}],
      'closing'
    );
    h += '</div>';
    h += '</div>';

    // Setting funnel standalone
    h += '<div class="yr-row">';
    h += '<div class="yr-card">';
    h += '<div class="yr-card-hdr"><div class="yr-card-title">Funnel Setting</div></div>';
    h += renderFunnel(
      [{l:'Appels',v:T.sCalls},{l:'Décrochés',v:T.sDecroches},{l:'Prop RDV',v:T.sPropRdv},{l:'Sets',v:T.sSets},{l:'Présents',v:T.sPresents},{l:'Closes',v:T.sCloses}],
      'setting'
    );
    h += '</div>';

    // Team table
    h += '<div class="yr-card">';
    h += '<div class="yr-card-hdr"><div class="yr-card-title">Performance équipe</div><div class="yr-card-badge">' + label + '</div></div>';
    h += renderTeamTable(agg.perMember);
    h += '</div>';
    h += '</div>';
  } else {
    // Single month — funnels side by side
    h += '<div class="yr-row">';
    h += '<div class="yr-card">';
    h += '<div class="yr-card-hdr"><div class="yr-card-title">Funnel Closing</div></div>';
    h += renderFunnel(
      [{l:'Calls',v:T.calls},{l:'Lives',v:T.lives},{l:'Offres',v:T.offres},{l:'Closes',v:T.closes}],
      'closing'
    );
    h += '</div>';
    h += '<div class="yr-card">';
    h += '<div class="yr-card-hdr"><div class="yr-card-title">Funnel Setting</div></div>';
    h += renderFunnel(
      [{l:'Appels',v:T.sCalls},{l:'Décrochés',v:T.sDecroches},{l:'Prop RDV',v:T.sPropRdv},{l:'Sets',v:T.sSets},{l:'Présents',v:T.sPresents},{l:'Closes',v:T.sCloses}],
      'setting'
    );
    h += '</div>';
    h += '</div>';

    // Team

  if (isYear || _selectedMonths.length > 1) {
    var monthKeys = isYear ? MF.map(function(m) { return m + ' ' + _year; }) : _selectedMonths;
    var monthsWithData = monthKeys.filter(function(mk) { return perMonth[mk] && perMonth[mk].hasData; });
    if (monthsWithData.length > 0) {
      h += '<div class="yr-card">';

      h += '<tbody>';
      monthsWithData.forEach(function(mk) {
        var d = perMonth[mk];

        h += '<tr style="cursor:pointer" onclick="clickMonth(' + MF.indexOf(mName) + ')">';
        h += '<td style="color:var(--red3)">' + mName + '</td>';

        h += '</tr>';
      });
      h += '<tr class="tr-total"><td>Total</td>';
      h += '<td>' + T.calls + '</td><td>' + T.lives + '</td><td>' + T.closes + '</td>';
      h += '<td>' + U.euro(T.contracte) + '</td><td>' + U.euro(T.collecte) + '</td>';
      h += '<td>' + T.sCalls + '</td><td>' + T.sSets + '</td><td>' + T.sPresents + '</td>';
      h += '</tr></tbody></table></div>';
      h += '</div>';
    }
  }

  document.getElementById('main-content').innerHTML = h;

  // Render chart after DOM insertion
  if ((isYear || _selectedMonths.length > 1) && document.getElementById('yr-chart')) {
    renderChart(perMonth, isYear ? MF.map(function(m){return m+' '+_year;}) : _selectedMonths);
  }
}

/* ── HELPERS ── */
function kpi(label, val, sub, color) {
  return '<div class="yr-kpi" style="--kc:' + color + '">' +
    '<div class="yr-kpi-label">' + label + '</div>' +
    '<div class="yr-kpi-val">' + val + '</div>' +
    '<div class="yr-kpi-sub">' + sub + '</div>' +
  '</div>';
}

function renderFunnel(steps, type) {
  var maxV = Math.max.apply(null, steps.map(function(s){return s.v;}));
  if (maxV === 0) maxV = 1;
  var h = '<div class="yr-funnel">';
  steps.forEach(function(s, i) {
    var w = Math.max(s.v / maxV * 100, 3).toFixed(0);
    var rate = '';
    if (i > 0 && steps[i-1].v > 0) rate = (s.v / steps[i-1].v * 100).toFixed(1) + '%';
    h += '<div class="yr-funnel-row">';
    h += '<div class="yr-funnel-label">' + s.l + '</div>';
    h += '<div class="yr-funnel-track"><div class="yr-funnel-fill ' + type + '" style="width:' + w + '%"></div></div>';
    h += '<div class="yr-funnel-val">' + U.num(s.v) + '</div>';
    h += '<div class="yr-funnel-rate">' + rate + '</div>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderTeamTable(perMember) {
  var _role = window._currentRole || localStorage.getItem('ambitio_role') || '';
  var _isAdmin = (_role === 'admin');
  var _src = _isAdmin ? SYNC_MEMBERS : SYNC_MEMBERS.filter(function(m) { return m.active !== false; });
  var members = _src.map(function(m) {
    var d = perMember[m.uid] || {};
    return Object.assign({}, m, d, {
      showup: d.calls > 0 ? d.lives/d.calls : 0,
      txClose: d.offres > 0 ? d.closes/d.offres : 0,
      sShowup: d.sSets > 0 ? d.sPresents/d.sSets : 0,
    });
  });
  var tC = {calls:0,lives:0,offres:0,closes:0,contracte:0,collecte:0,sCalls:0,sSets:0,sPresents:0};
  members.forEach(function(m) { Object.keys(tC).forEach(function(k){tC[k]+=(m[k]||0);}); });

  var h = '<div class="yr-table-wrap"><table class="yr-table">';
  h += '<thead><tr><th>Membre</th><th>Calls C.</th><th>Lives</th><th>Closes</th><th>Contracté</th><th>Collecté</th><th>Appels S.</th><th>Sets</th><th>Show-up S.</th></tr></thead>';
  h += '<tbody>';
  members.forEach(function(m) {
    var rowCls = (m.active === false) ? ' member-archived-admin' : '';
    h += '<tr class="yr-row' + rowCls + '">';
    h += '<td><span class="member-dot" style="background:' + m.color + '"></span>' + m.name + (m.active === false ? ' <span class="archived-pill">📦 Archivé</span>' : '') + '</td>';
    h += '<td>' + (m.calls||0) + '</td><td>' + (m.lives||0) + '</td><td>' + (m.closes||0) + '</td>';
    h += '<td>' + U.euro(m.contracte||0) + '</td><td>' + U.euro(m.collecte||0) + '</td>';
    h += '<td>' + (m.sCalls||0) + '</td><td>' + (m.sSets||0) + '</td>';
    h += '<td>' + U.pct(m.sShowup) + '</td>';
    h += '</tr>';
  });
  h += '<tr class="tr-total"><td>Total</td>';
  h += '<td>' + tC.calls + '</td><td>' + tC.lives + '</td><td>' + tC.closes + '</td>';
  h += '<td>' + U.euro(tC.contracte) + '</td><td>' + U.euro(tC.collecte) + '</td>';
  h += '<td>' + tC.sCalls + '</td><td>' + tC.sSets + '</td>';
  h += '<td>' + (tC.sSets > 0 ? U.pct(tC.sPresents/tC.sSets) : '—') + '</td>';
  h += '</tr></tbody></table></div>';
  return h;
}

function renderChart(perMonth, monthKeys) {
  var el = document.getElementById('yr-chart');
  if (!el) return;
  var chartData = [];
  monthKeys.forEach(function(mk) {
    var md = perMonth[mk];
    if (md && md.hasData) {
      chartData.push({ label: mk.split(' ')[0].slice(0, 3), ct: md.contracte, co: md.collecte, sets: md.sSets || 0, mk: mk });
    }
  });
  if (chartData.length === 0) { el.innerHTML = '<div style="color:var(--muted);font-size:12px;text-align:center;width:100%;padding:40px 0">Aucune donnée</div>'; return; }

  var maxCt = Math.max.apply(null, chartData.map(function(c){return c.ct;}));
  var maxSets = Math.max.apply(null, chartData.map(function(c){return c.sets;}));
  if (maxCt === 0) maxCt = 1;
  if (maxSets === 0) maxSets = 1;

  el.innerHTML = chartData.map(function(c) {
    var hCt = (c.ct / maxCt * 170).toFixed(0);
    var hCo = (c.co / maxCt * 170).toFixed(0);
    var hSet = (c.sets / maxSets * 80).toFixed(0);
    var mIdx = MF.indexOf(c.mk.split(' ')[0]);
    return '<div class="yr-chart-col" onclick="clickMonth(' + mIdx + ')">' +
      '<div class="yr-chart-tooltip">' + c.label + ': ' + U.euro(c.ct) + ' ct · ' + U.euro(c.co) + ' co · ' + c.sets + ' sets</div>' +
      '<div style="display:flex;align-items:flex-end;gap:2px;height:190px;width:100%">' +
        '<div class="yr-chart-bar bar-ct" style="height:' + hCt + 'px;flex:1"></div>' +
        '<div class="yr-chart-bar bar-co" style="height:' + hCo + 'px;flex:1"></div>' +
        '<div class="yr-chart-bar bar-set" style="height:' + hSet + 'px;flex:1"></div>' +
      '</div>' +
      '<div class="yr-chart-lbl">' + c.label + '</div>' +
    '</div>';
  }).join('');
}

<script>
(function () {
  'use strict';

  // ─── Config ────────────────────────────────────────────────────────────
  // Seuil pour considérer un appel comme "décroché" (cohérent avec
  // stats.connected du Dialer — exclut les répondeurs < 5s).
  const ANSWERED_DURATION_THRESHOLD_SEC = 5;
  const LOGS_QUERY_LIMIT = 5000;

  // ─── State ─────────────────────────────────────────────────────────────
  const state = {
    rangeStart: null,
    rangeEnd: null,
    activePreset: 'week',
    filterUid: 'all',
    role: null,
    myUid: null,
    uidToMember: {},
    loading: false,
    logs: []
  };

  // ─── Helpers date ─────────────────────────────────────────────────────
  function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function endOfDay(d) { const x = new Date(d); x.setHours(23,59,59,999); return x; }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function isoDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function getCurrentWeekRange() {
    const now = new Date();
    const dow = now.getDay(); // 0=dim
    const diffToMon = dow === 0 ? -6 : 1 - dow;
    const mon = new Date(now);
    mon.setDate(now.getDate() + diffToMon);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    return { start: startOfDay(mon), end: endOfDay(sun) };
  }
  function getLastWeekRange() {
    const cur = getCurrentWeekRange();
    const s = new Date(cur.start); s.setDate(s.getDate() - 7);
    const e = new Date(cur.end);   e.setDate(e.getDate() - 7);
    return { start: startOfDay(s), end: endOfDay(e) };
  }
  function getCurrentMonthRange() {
    const now = new Date();
    const s = new Date(now.getFullYear(), now.getMonth(), 1);
    const e = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return { start: startOfDay(s), end: endOfDay(e) };
  }
  function getLast30DaysRange() {
    const now = new Date();
    const s = new Date(now); s.setDate(now.getDate() - 29);
    return { start: startOfDay(s), end: endOfDay(now) };
  }

  // ─── Helpers format ────────────────────────────────────────────────────
  function fmtDuration(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    if (sec < 60) return sec + 's';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return h + 'h ' + pad2(m) + 'min';
    if (s === 0) return m + 'min';
    return m + 'min ' + pad2(s) + 's';
  }
  function fmtDurationShort(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + 'h' + (m > 0 ? pad2(m) : '');
    return m + 'min';
  }
  function fmtShortDate(d) {
    return d.getDate() + '/' + pad2(d.getMonth()+1);
  }
  function rangeLabel(start, end) {
    const sd = new Date(start), ed = new Date(end);
    if (isoDate(sd) === isoDate(ed)) return fmtShortDate(sd);
    return fmtShortDate(sd) + ' → ' + fmtShortDate(ed);
  }

  // ─── Attendre window._currentRole + TEAM_MEMBERS ──────────────────────
  async function waitForReady() {
    const startTs = Date.now();
    while (Date.now() - startTs < 8000) {
      if (window._currentRole && window._currentUserUid) {
        // Le role est set. TEAM_MEMBERS peut encore se charger, mais nav.js
        // a probablement déjà fini. On tolère un TEAM_MEMBERS vide et on
        // retente après.
        return true;
      }
      await new Promise(r => setTimeout(r, 100));
    }
    return false;
  }

  async function waitForTeamMembers() {
    const startTs = Date.now();
    while (Date.now() - startTs < 5000) {
      if (window.TEAM_MEMBERS_LIST && window.TEAM_MEMBERS_LIST.length > 0) return true;
      await new Promise(r => setTimeout(r, 100));
    }
    return false; // on continue quand même avec ce qu'on a
  }

  function buildUidToMember() {
    const map = {};
    const list = window.TEAM_MEMBERS_LIST || [];
    for (const m of list) {
      if (m && m.firebaseUid) {
        map[m.firebaseUid] = {
          slug: m.slug,
          name: m.shortName || m.displayName || m.slug,
          color: m.color || '#6b7280',
          active: m.active !== false
        };
      }
    }
    state.uidToMember = map;
  }

  // ─── Query Firestore ───────────────────────────────────────────────────
  async function fetchLogs() {
    const db = firebase.firestore();
    const start = state.rangeStart;
    const end = state.rangeEnd;

    try {
      let q;
      if (state.role === 'admin') {
        // Admin : plage temporelle seule (pas de filter userId → composite index non requis)
        q = db.collection('call_logs')
          .where('initiatedAt', '>=', start)
          .where('initiatedAt', '<=', end)
          .limit(LOGS_QUERY_LIMIT);
      } else {
        // Sales : filtre par userId seul (aucun composite index requis)
        // On filtre la plage temporelle côté client.
        q = db.collection('call_logs')
          .where('userId', '==', state.myUid)
          .limit(LOGS_QUERY_LIMIT);
      }
      const snap = await q.get();
      const logs = [];
      snap.forEach(function (doc) {
        const d = doc.data();
        if (!d.initiatedAt || !d.initiatedAt.toDate) return;
        const when = d.initiatedAt.toDate();
        if (state.role === 'sales') {
          // Filtre côté client sur la plage
          if (when < start || when > end) return;
        }
        logs.push({
          id: doc.id,
          userId: d.userId || null,
          direction: d.direction || null,
          status: d.status || null,
          durationSec: typeof d.durationSec === 'number' ? d.durationSec : 0,
          initiatedAt: when
        });
      });
      return logs;
    } catch (e) {
      console.error('[callReport] fetch error:', e);
      throw e;
    }
  }

  // ─── Aggrégation ──────────────────────────────────────────────────────
  function aggregate(logs) {
    // Filtre métier : outbound + completed + décroché (>= 5s)
    const answered = logs.filter(function (l) {
      return l.direction === 'outbound'
          && l.status === 'completed'
          && (l.durationSec || 0) >= ANSWERED_DURATION_THRESHOLD_SEC;
    });

    // Par closer
    const byUser = {};
    // Par jour (global)
    const byDay = {};

    for (const l of answered) {
      const uid = l.userId || '__unknown';
      if (!byUser[uid]) byUser[uid] = { count: 0, totalSec: 0, uid: uid };
      byUser[uid].count += 1;
      byUser[uid].totalSec += l.durationSec;

      const dk = isoDate(l.initiatedAt);
      if (!byDay[dk]) byDay[dk] = { count: 0, totalSec: 0 };
      byDay[dk].count += 1;
      byDay[dk].totalSec += l.durationSec;
    }

    return { byUser: byUser, byDay: byDay, totalCount: answered.length };
  }

  function buildDaysSeries(byDay, start, end) {
    // Série continue jour par jour (remplit les jours sans appel avec 0)
    const days = [];
    const cur = new Date(start); cur.setHours(0,0,0,0);
    const endD = new Date(end);  endD.setHours(0,0,0,0);
    // Cap à 60 jours pour éviter un barchart illisible sur très longue plage
    let safety = 0;
    while (cur <= endD && safety < 100) {
      const dk = isoDate(cur);
      const d = byDay[dk] || { count: 0, totalSec: 0 };
      days.push({
        date: new Date(cur),
        dateKey: dk,
        count: d.count,
        totalSec: d.totalSec
      });
      cur.setDate(cur.getDate() + 1);
      safety++;
    }
    return days;
  }

  // ─── Render ────────────────────────────────────────────────────────────
  function renderShell() {
    const root = document.getElementById('call-report');
    if (!root) return;

    const presets = [
      { key: 'week',     label: 'Cette semaine' },
      { key: 'lastweek', label: 'Semaine dernière' },
      { key: 'month',    label: 'Ce mois-ci' },
      { key: '30days',   label: '30 derniers jours' },
      { key: 'custom',   label: 'Personnalisé' }
    ];

    let filterHtml = '';
    if (state.role === 'admin') {
      const members = (window.TEAM_MEMBERS_LIST || []).filter(function (m) {
        return m && m.firebaseUid;
      });
      filterHtml = '<select class="cr-filter-select" id="cr-filter">'
        + '<option value="all">Tous les closers</option>'
        + members.map(function (m) {
            const nm = m.shortName || m.displayName || m.slug;
            return '<option value="' + m.firebaseUid + '">' + nm
                 + (m.active === false ? ' (archivé)' : '') + '</option>';
          }).join('')
        + '</select>';
    }

    const titleBadge = state.role === 'admin'
      ? '<span class="cr-badge">Équipe</span>'
      : '<span class="cr-badge">Mes stats</span>';

    root.innerHTML = ''
      + '<div class="cr-section"><div class="cr-card">'
      + '<div class="cr-hdr">'
      +   '<div class="cr-title">📞 Activité téléphonique</div>'
      +   titleBadge
      + '</div>'
      + '<div class="cr-controls" id="cr-controls">'
      +   presets.map(function (p) {
            return '<button class="cr-preset' + (state.activePreset === p.key ? ' active' : '')
                 + '" data-preset="' + p.key + '">' + p.label + '</button>';
          }).join('')
      +   '<div class="cr-datepair">'
      +     '<label>Du</label><input type="date" id="cr-date-start"/>'
      +     '<label>Au</label><input type="date" id="cr-date-end"/>'
      +   '</div>'
      +   filterHtml
      + '</div>'
      + '<div id="cr-body"></div>'
      + '</div></div>';

    // Init date pickers
    document.getElementById('cr-date-start').value = isoDate(state.rangeStart);
    document.getElementById('cr-date-end').value = isoDate(state.rangeEnd);

    // Event listeners
    document.getElementById('cr-controls').addEventListener('click', function (e) {
      const btn = e.target.closest('.cr-preset');
      if (!btn) return;
      onPresetClick(btn.dataset.preset);
    });
    document.getElementById('cr-date-start').addEventListener('change', onDateChange);
    document.getElementById('cr-date-end').addEventListener('change', onDateChange);
    if (state.role === 'admin') {
      document.getElementById('cr-filter').addEventListener('change', function (e) {
        state.filterUid = e.target.value;
        renderBody();
      });
    }
  }

  function renderBodyLoading() {
    const body = document.getElementById('cr-body');
    if (body) body.innerHTML = '<div class="cr-loading">Chargement des appels…</div>';
  }

  function renderBodyError(msg) {
    const body = document.getElementById('cr-body');
    if (body) body.innerHTML = '<div class="cr-error">' + msg + '</div>';
  }

  function renderBody() {
    const body = document.getElementById('cr-body');
    if (!body) return;

    const agg = aggregate(state.logs);

    // Appliquer filtre closer (admin only)
    let filteredByUser = agg.byUser;
    let filteredByDay = agg.byDay;
    let filteredTotal = agg.totalCount;

    if (state.role === 'admin' && state.filterUid !== 'all') {
      // Re-agréger uniquement pour l'UID sélectionné
      const uid = state.filterUid;
      filteredByUser = agg.byUser[uid] ? { [uid]: agg.byUser[uid] } : {};
      filteredByDay = {};
      filteredTotal = 0;
      for (const l of state.logs) {
        if (l.userId !== uid) continue;
        if (l.direction !== 'outbound' || l.status !== 'completed') continue;
        if ((l.durationSec || 0) < ANSWERED_DURATION_THRESHOLD_SEC) continue;
        const dk = isoDate(l.initiatedAt);
        if (!filteredByDay[dk]) filteredByDay[dk] = { count: 0, totalSec: 0 };
        filteredByDay[dk].count++;
        filteredByDay[dk].totalSec += l.durationSec;
        filteredTotal++;
      }
    }

    // Total général (pour bannière stats)
    let totalCount = 0, totalSec = 0;
    Object.values(filteredByUser).forEach(function (u) {
      totalCount += u.count;
      totalSec += u.totalSec;
    });
    const avgSec = totalCount > 0 ? totalSec / totalCount : 0;

    // ── Bannière stats ──────────────────────────────────────────────────
    let html = '<div class="cr-stat-row">';
    html += '<div class="cr-stat"><div class="cr-stat-label">Appels décrochés</div>'
         + '<div class="cr-stat-val">' + totalCount + '</div></div>';
    html += '<div class="cr-stat"><div class="cr-stat-label">Temps total</div>'
         + '<div class="cr-stat-val">' + fmtDuration(totalSec) + '</div></div>';
    html += '<div class="cr-stat"><div class="cr-stat-label">Durée moyenne</div>'
         + '<div class="cr-stat-val">' + (totalCount > 0 ? fmtDuration(avgSec) : '—') + '</div></div>';
    html += '<div class="cr-stat"><div class="cr-stat-label">Plage</div>'
         + '<div class="cr-stat-val" style="font-size:15px">'
         + rangeLabel(state.rangeStart, state.rangeEnd) + '</div></div>';
    html += '</div>';

    // ── Tableau (admin + vue "Tous") OR uniquement si plusieurs uid ────
    const showTable = state.role === 'admin' && state.filterUid === 'all';
    if (showTable) {
      const rows = Object.values(filteredByUser)
        .map(function (u) {
          const m = state.uidToMember[u.uid] || null;
          return {
            uid: u.uid,
            name: m ? m.name : ('Inconnu (' + String(u.uid || '').slice(0, 6) + ')'),
            color: m ? m.color : '#6b7280',
            active: m ? m.active : true,
            count: u.count,
            totalSec: u.totalSec,
            avg: u.count > 0 ? (u.totalSec / u.count) : 0
          };
        })
        .sort(function (a, b) { return b.totalSec - a.totalSec; });

      html += '<div class="cr-table-wrap"><table class="cr-table">';
      html += '<thead><tr>'
            + '<th>Closer</th>'
            + '<th class="num">Appels décrochés</th>'
            + '<th class="num">Temps total</th>'
            + '<th class="num">Temps moyen</th>'
            + '</tr></thead><tbody>';

      if (rows.length === 0) {
        html += '<tr><td colspan="4"><div class="cr-empty">'
             + 'Aucun appel décroché sur cette plage.</div></td></tr>';
      } else {
        rows.forEach(function (r) {
          html += '<tr>';
          html += '<td>'
               +   '<span class="cr-dot" style="background:' + r.color + '"></span>'
               +   r.name
               +   (r.active === false ? '<span class="cr-archived">archivé</span>' : '')
               + '</td>';
          html += '<td class="num">' + r.count + '</td>';
          html += '<td class="num">' + fmtDuration(r.totalSec) + '</td>';
          html += '<td class="num">' + fmtDuration(r.avg) + '</td>';
          html += '</tr>';
        });
        html += '<tr class="cr-total"><td>Total équipe</td>'
             +   '<td class="num">' + totalCount + '</td>'
             +   '<td class="num">' + fmtDuration(totalSec) + '</td>'
             +   '<td class="num">' + (totalCount > 0 ? fmtDuration(avgSec) : '—') + '</td>'
             + '</tr>';
      }
      html += '</tbody></table></div>';
    }

    // ── Barchart par jour ──────────────────────────────────────────────
    const days = buildDaysSeries(filteredByDay, state.rangeStart, state.rangeEnd);
    const maxSec = days.reduce(function (mx, d) { return Math.max(mx, d.totalSec); }, 0) || 1;

    html += '<div class="cr-chart-wrap">';
    html += '<div class="cr-chart-title">Répartition par jour</div>';
    html += '<div class="cr-chart">';
    if (days.length === 0) {
      html += '<div class="cr-empty" style="flex:1">Aucune donnée.</div>';
    } else {
      days.forEach(function (d) {
        const pct = Math.max(d.totalSec / maxSec * 100, 2);
        const isEmpty = d.totalSec === 0;
        const dayLbl = ['D', 'L', 'M', 'M', 'J', 'V', 'S'][d.date.getDay()];
        const dn = d.date.getDate();
        const tip = isEmpty
          ? (fmtShortDate(d.date) + ' : aucun appel')
          : (fmtShortDate(d.date) + ' : ' + d.count + ' appels — ' + fmtDuration(d.totalSec));
        html += '<div class="cr-chart-col' + (isEmpty ? ' empty' : '') + '">';
        html += '<div class="cr-chart-tooltip">' + tip + '</div>';
        html += '<div class="cr-chart-bar" style="height:' + pct.toFixed(1) + '%"></div>';
        html += '<div class="cr-chart-lbl">' + dayLbl + dn + '</div>';
        html += '</div>';
      });
    }
    html += '</div></div>';

    body.innerHTML = html;
  }

  // ─── Event handlers ────────────────────────────────────────────────────
  function setPreset(key) {
    state.activePreset = key;
    // Actualiser classes actives
    document.querySelectorAll('.cr-preset').forEach(function (b) {
      b.classList.toggle('active', b.dataset.preset === key);
    });
    // Actualiser dates
    const pickStart = document.getElementById('cr-date-start');
    const pickEnd = document.getElementById('cr-date-end');
    if (pickStart) pickStart.value = isoDate(state.rangeStart);
    if (pickEnd) pickEnd.value = isoDate(state.rangeEnd);
  }

  async function onPresetClick(key) {
    let r = null;
    switch (key) {
      case 'week':     r = getCurrentWeekRange(); break;
      case 'lastweek': r = getLastWeekRange(); break;
      case 'month':    r = getCurrentMonthRange(); break;
      case '30days':   r = getLast30DaysRange(); break;
      case 'custom':
        state.activePreset = 'custom';
        document.querySelectorAll('.cr-preset').forEach(function (b) {
          b.classList.toggle('active', b.dataset.preset === 'custom');
        });
        return; // on attend que l'user modifie les date pickers
    }
    if (!r) return;
    state.rangeStart = r.start;
    state.rangeEnd = r.end;
    setPreset(key);
    await reload();
  }

  async function onDateChange() {
    const s = document.getElementById('cr-date-start').value;
    const e = document.getElementById('cr-date-end').value;
    if (!s || !e) return;
    const sd = new Date(s + 'T00:00:00');
    const ed = new Date(e + 'T23:59:59');
    if (isNaN(sd) || isNaN(ed)) return;
    if (sd > ed) return; // ignorer l'input invalide
    state.rangeStart = sd;
    state.rangeEnd = ed;
    state.activePreset = 'custom';
    document.querySelectorAll('.cr-preset').forEach(function (b) {
      b.classList.toggle('active', b.dataset.preset === 'custom');
    });
    await reload();
  }

  async function reload() {
    if (state.loading) return;
    state.loading = true;
    renderBodyLoading();
    try {
      state.logs = await fetchLogs();
      renderBody();
    } catch (e) {
      renderBodyError("Impossible de charger les appels : " + (e.message || e));
    } finally {
      state.loading = false;
    }
  }

  // ─── Init ──────────────────────────────────────────────────────────────
  async function init() {
    const ok = await waitForReady();
    if (!ok) { console.warn('[callReport] auth/role non prêts'); return; }

    state.role = window._currentRole;
    state.myUid = window._currentUserUid;

    if (state.role !== 'admin' && state.role !== 'sales') {
      // Coach n'est pas dans le scope L1
      return;
    }

    await waitForTeamMembers();
    buildUidToMember();

    // Plage par défaut : cette semaine
    const wk = getCurrentWeekRange();
    state.rangeStart = wk.start;
    state.rangeEnd = wk.end;

    renderShell();
    await reload();

    // Réagir si TEAM_MEMBERS arrive tardivement (après un fetch team_members)
    window.addEventListener('team-members-loaded', function () {
      buildUidToMember();
      renderShell();
      renderBody();
    });
  }

  // Lancement : on attend que le DOM soit prêt ET que l'auth soit traitée.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { init(); });
  } else {
    init();
  }
})();
</script>
</body>
</html>
