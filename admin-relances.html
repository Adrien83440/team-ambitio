<style>

.rl{padding:20px 26px 80px;max-width:1240px;margin:0 auto}
.rl .sp{flex:1}
.rl-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.rl-ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#6d5efc,#ec4899);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rl-top h1{font-family:var(--font-d);font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.rl-top small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.rl-pills{display:flex;gap:8px;flex-wrap:wrap;margin-right:36px}
.rl-pill{padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--bg2)}
.rl-pill.test{border-color:rgba(34,197,94,.5);color:#4ade80}
.rl-pill.prod{border-color:rgba(239,68,68,.6);color:#f87171}
.rl-pill.rouge{border-color:rgba(239,68,68,.6);color:#f87171}
.rl-pill.jaune{border-color:rgba(251,191,36,.6);color:#fbbf24}
.rl-pill.vert{border-color:rgba(34,197,94,.5);color:#4ade80}
.rl-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.rl-tab{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.rl-tab:hover{color:var(--text)}
.rl-tab.on{color:var(--text);border-color:rgba(109,94,252,.6);background:rgba(109,94,252,.12)}
.rl-pane{display:none}
.rl-pane.on{display:block}
.rl-banner{padding:10px 14px;border-radius:10px;font-size:12.5px;line-height:1.55;margin-bottom:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:#fcd34d}
.rl-banner.ok{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25);color:#86efac}
.rl-banner.ko{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fca5a5}
.rl-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.rl-card h2{font-size:14px;font-weight:800;margin:0 0 3px}
.rl-card>small{display:block;font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.rl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.rl-f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.rl-in,.rl-sel,.rl-ta{padding:8px 10px;background:var(--bg3);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:13px;outline:0;box-sizing:border-box;width:100%}
.rl-ta{min-height:82px;resize:vertical;line-height:1.5}
.rl-in:focus,.rl-sel:focus,.rl-ta:focus{border-color:#6d5efc}
.rl-checks{display:flex;flex-wrap:wrap;gap:6px}
.rl-chk{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.rl-chk input{margin:0}
.rl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.rl-act{padding:9px 14px;border:1px solid var(--border2);border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--bg3);color:var(--text);line-height:1.3;white-space:nowrap}
.rl-act:hover{border-color:#6d5efc}
.rl-act:disabled{opacity:.5;cursor:default}
.rl-act.pri{background:#6d5efc;border-color:#6d5efc;color:#fff}
.rl-act.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.rl-act.ko{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5)}
.rl-act.mini{padding:5px 9px;font-size:11.5px}
.rl-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}
.rl-kpi{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:9px 11px}
.rl-kpi span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.rl-kpi b{font-family:var(--font-d);font-size:19px;font-weight:800}
.rl-scroll{overflow-x:auto;max-height:520px;overflow-y:auto}
.rl-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rl-table th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;padding:5px 8px;border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0;background:var(--bg2)}
.rl-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.rl-table td.n{text-align:right;white-space:nowrap}
.rl-table a{color:#a5b4fc;text-decoration:none;font-weight:600}
.rl-table a:hover{text-decoration:underline}
.rl-vide{text-align:center;padding:26px 16px;color:var(--muted);font-size:13px;line-height:1.7;background:var(--bg2);border:1px dashed var(--border2);border-radius:12px}
.rl-list{display:flex;flex-direction:column;gap:6px}
.rl-item{text-align:left;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer}
.rl-item small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.rl-item.on{border-color:#6d5efc;background:rgba(109,94,252,.12)}
.rl-split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px}
.rl-step{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg3)}
.rl-step-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rl-step-h b{font-size:13px}
.rl-prev{white-space:pre-wrap;font-size:12.5px;line-height:1.55;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-top:6px}
.rl-wa{margin-top:10px;padding:14px;border-radius:12px;background:#e9e2d8;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.rl-wa-t{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#6b6257}
.rl-wa-bulle{background:#fff;color:#111b21;border-radius:10px;box-shadow:0 1px 1px rgba(0,0,0,.12);width:100%;max-width:360px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
.rl-wa-media{display:block;width:100%;max-height:220px;background:#000;object-fit:cover}
.rl-wa-manque{padding:28px 12px;text-align:center;background:#f3d2d2;color:#9b1c1c;font-size:12.5px;font-weight:700}
.rl-wa-corps{padding:8px 10px 4px;font-size:14px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word}
.rl-wa-pied{padding:0 10px 6px;font-size:12px;color:#667781}
.rl-wa-h{padding:0 10px 6px;text-align:right;font-size:11px;color:#667781}
.rl-wa-btn{display:block;border-top:1px solid #e9edef;padding:10px;text-align:center;color:#027eb5;font-size:14px;font-weight:600}
.rl-wa-btn small{display:block;font-size:10.5px;font-weight:500;color:#667781;margin-top:2px;word-break:break-all}
.rl-wa-sms{background:#e9e9eb;color:#111;border-radius:16px;padding:9px 12px;max-width:360px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
.rl-hint{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.rl-hint.ko{color:#f87171}
.rl-tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:800;border:1px solid var(--border2)}
.rl-tag.brouillon{color:#a5b4fc}.rl-tag.en_cours{color:#4ade80}.rl-tag.pause{color:#fbbf24}.rl-tag.terminee{color:var(--muted)}
.rl-locked{text-align:center;padding:90px 20px;color:var(--muted)}
.rl-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a28;border:1px solid var(--border2);color:var(--text);font-size:13px;font-weight:600;padding:10px 20px;border-radius:10px;z-index:2000;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw}
.rl-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:820px){
  .rl{padding:14px 12px 70px}
  .rl-split{grid-template-columns:minmax(0,1fr)}
  .rl-pills{margin-right:0}
}
</style>
</head>
<body>
<div id="nav-container"></div>

<main class="rl" id="mainView" style="display:none">
  <header class="rl-top">
    <div class="rl-ic">🔁</div>
    <div>
      <h1>Relances</h1>
      <small>Segment de leads → séquence WhatsApp / SMS / e-mail → réponses, RDV, ventes</small>
    </div>
    <div class="sp"></div>
    <div class="rl-pills" id="rlPills"></div>
  </header>

  <div id="rlBanner"></div>

  <nav class="rl-tabs">
    <button class="rl-tab on" type="button" data-tab="campagnes">📣 Campagnes</button>
    <button class="rl-tab" type="button" data-tab="segments">🎯 Segments</button>

  </nav>

  <section class="rl-pane on" id="paneCampagnes"><div class="rl-split"><div id="rlCampList"></div><div id="rlCampEdit"></div></div></section>
  <section class="rl-pane" id="paneSegments"><div class="rl-split"><div id="rlSegList"></div><div id="rlSegEdit"></div></div></section>
  <section class="rl-pane" id="paneSuivi"><div id="rlSuivi"></div></section>
  <section class="rl-pane" id="paneModeles"><div id="rlModeles"></div></section>
  <section class="rl-pane" id="paneReglages"><div id="rlReglages"></div></section>
</main>

<div class="rl-locked" id="lockedView" style="display:none"><div style="font-size:48px;margin-bottom:12px">🔒</div><div>Module réservé aux administrateurs.</div></div>

<script>
(function () {
'use strict';

var API = '/api/relances';
var C = window.RelancesCore;
var S = { etat: null, modeles: null, seg: null, segApercu: null, camp: null, prep: null, stats: null, suiviId: '', occupe: false };

function $(id) { return document.getElementById(id); }
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function toast(msg) {
  var t = $('rlToast');
  t.textContent = msg;
  t.className = 'rl-toast show';
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.className = 'rl-toast'; }, 4500);
}
function appel(corps) {
  return firebase.auth().currentUser.getIdToken().then(function (t) {
    var o = { headers: { 'Authorization': 'Bearer ' + t } };
    if (corps) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(corps); }
    return fetch(API + (corps ? '' : '?action=etat'), o);
  }).then(function (r) { return r.json().catch(function () { return { ok: false, error: 'server_error' }; }); });
}
function erreurTexte(j) {
  if (!j) return 'Erreur réseau.';
  if (j.erreurs && j.erreurs.length) return j.erreurs.join(' · ');
  if (j.bloquants && j.bloquants.length) return j.bloquants.join(' · ');
  return j.detail || j.error || j.erreur || 'Une erreur est survenue.';
}
function jour(ms) { return ms ? new Date(ms).toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris' }) : '—'; }
function jourHeure(ms) { return ms ? new Date(ms).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—'; }
function ymdFr(s) { s = String(s || ''); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—'; }
function euros(n) { return (Math.round((+n || 0) * 100) / 100).toFixed(2).replace('.', ',') + ' €'; }
function occupe(b) { S.occupe = b; document.querySelectorAll('[data-action]').forEach(function (x) { if (x.tagName === 'BUTTON') x.disabled = b; }); }
function campNom(id) {
  var l = (S.etat && S.etat.campagnes) || [];
  for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i].nom;
  return id;
}
function setterNom(slug) {
  var l = (S.etat && S.etat.setters) || [];
  for (var i = 0; i < l.length; i++) if (l[i].slug === slug) return l[i].nom;
  return slug || '—';
}
function libCanal(c) { return { whatsapp: '📲 WhatsApp', sms: '💬 SMS', email: '✉️ E-mail' }[c] || c; }
function libEtat(e) { return { brouillon: 'Brouillon', en_cours: 'En cours', pause: 'En pause', terminee: 'Terminée' }[e] || e; }

/* ── Chargement ──────────────────────────────────────────────────────── */
function charger() {
  return appel(null).then(function (j) {
    if (!j.ok) { toast(erreurTexte(j)); return; }
    S.etat = j;
    peindreEntete();
    peindreCampagnes();
    peindreSegments();
    peindreSuivi();
    peindreReglages();
  });
}
function chargerModeles() {
  if (S.modeles) return Promise.resolve(S.modeles);
  return appel({ action: 'modeles' }).then(function (j) {
    S.modeles = j.ok ? (j.modeles || []) : [];
    if (!j.ok) toast('Modèles WhatsApp illisibles : ' + erreurTexte(j));
    return S.modeles;
  });
}
function modele(nom) {
  var l = S.modeles || [];
  for (var i = 0; i < l.length; i++) if (l[i].nom === nom) return l[i];
  return null;
}

function peindreEntete() {
  var cfg = S.etat.config, w = S.etat.whatsapp || {}, h = '';
  h += cfg.modeTest !== false
    ? '<span class="rl-pill test">🧪 MODE TEST — aucun envoi réel</span>'
    : '<span class="rl-pill prod">🔴 PRODUCTION — envois réels actifs</span>';
  if (w.ok) {
    var q = String(w.qualite || '').toUpperCase(), cls = q === 'GREEN' ? 'vert' : (q === 'RED' ? 'rouge' : 'jaune');
    h += '<span class="rl-pill ' + cls + '" title="Note attribuée par Meta au compte de l\'API WhatsApp (le même que Leads Live)">API WhatsApp : qualité ' + esc({ GREEN: 'bonne', YELLOW: 'moyenne', RED: 'basse' }[q] || q)
      + (w.palier ? ' · ' + esc(w.palier) : '') + '</span>';
  } else h += '<span class="rl-pill jaune">WhatsApp : état illisible</span>';
  $('rlPills').innerHTML = h;
  var b = '';
  if (!(S.etat.campagnes || []).length) {
    b = '<div class="rl-banner">Aucune campagne pour l\'instant. La première campagne (Follow-up + Jamais joints Elite, depuis le 13/08) peut être créée en brouillon : rien ne part tant que tu ne l\'as pas testée et lancée.'
      + '<div class="rl-row"><button class="rl-act pri" type="button" data-action="preconfigurer">Créer la campagne préconfigurée</button></div></div>';
  }
  if (w.ok && String(w.qualite).toUpperCase() === 'RED') b += '<div class="rl-banner ko">La qualité du compte de l\'API WhatsApp est BASSE : les campagnes sont mises en pause automatiquement. Ce compte sert aussi à Leads Live et aux rappels de coaching.</div>';
  $('rlBanner').innerHTML = b;
}

/* ── Segments ────────────────────────────────────────────────────────── */
function segVide() { return { id: '', nom: '', filtres: { statuts: [], etapes: [], provenances: [], setters: [], sansScore: true } }; }
function peindreSegments() {
  var l = S.etat.segments || [], h = '<div class="rl-card"><h2>Segments enregistrés</h2><small>Un segment est une liste de filtres : il est recalculé à chaque aperçu et au lancement.</small><div class="rl-list">';
  l.forEach(function (s) {
    h += '<button class="rl-item' + (S.seg && S.seg.id === s.id ? ' on' : '') + '" type="button" data-action="seg-ouvrir" data-id="' + esc(s.id) + '">' + esc(s.nom) + '<small>' + esc(resumeFiltres(s.filtres)) + '</small></button>';
  });
  h += '</div><div class="rl-row"><button class="rl-act" type="button" data-action="seg-nouveau">+ Nouveau segment</button></div></div>';
  $('rlSegList').innerHTML = h;
  if (!S.seg) S.seg = segVide();
  peindreSegEdit();
}
function resumeFiltres(f) {
  f = f || {};
  var p = [];
  if (f.campagneSource) p.push('sans réaction (ni réponse, ni clic, ni RDV) à « ' + campNom(f.campagneSource) + ' »');
  if ((f.statuts || []).length) p.push(f.statuts.join(', '));
  if ((f.etapes || []).length) p.push('étapes ' + f.etapes.join(', '));
  if ((f.provenances || []).length) p.push('provenance « ' + f.provenances.join(' / ') + ' »');
  if (f.entreDu) p.push('entrés depuis le ' + ymdFr(f.entreDu));
  p.push('ancienneté ≥ ' + (f.ancienneteMin != null ? f.ancienneteMin : S.etat.config.ancienneteMinJours) + ' j');
  p.push('silence ≥ ' + (f.silenceMin != null ? f.silenceMin : S.etat.config.silenceMinJours) + ' j');
  if (f.entreAu) p.push('jusqu\'au ' + ymdFr(f.entreAu));
  if ((f.setters || []).length) p.push('setters ' + f.setters.join(', '));
  if (f.scoreMin != null || f.scoreMax != null) p.push('score ' + (f.scoreMin != null ? f.scoreMin : 0) + '–' + (f.scoreMax != null ? f.scoreMax : 100));
  return p.join(' · ') || 'Aucun filtre';
}
function cases(nom, items, choisis) {
  var h = '<div class="rl-checks">';
  items.forEach(function (it) {
    h += '<label class="rl-chk"><input type="checkbox" data-f="' + nom + '" value="' + esc(it.id) + '"' + ((choisis || []).indexOf(it.id) >= 0 ? ' checked' : '') + '>' + esc(it.t) + '</label>';
  });
  return h + '</div>';
}
function peindreSegEdit() {
  var s = S.seg, f = s.filtres || {};
  var cols = (window.PipelineEtapes && window.PipelineEtapes.COLS || []).map(function (c) { return { id: c.id, t: c.t }; });
  var setters = (S.etat.setters || []).map(function (m) { return { id: m.slug, t: m.nom }; });
  var h = '<div class="rl-card"><h2>' + (s.id ? 'Segment : ' + esc(s.nom) : 'Nouveau segment') + '</h2>'
    + '<small>Exclusions automatiques, <b>non désactivables</b> : clients, faux numéros / poubelle, disqualifiés, pas intéressés, STOP, exclus définitifs des relances, contacts bloqués, RDV à venir, rappel déjà programmé par le setter, nouvel opt-in de moins de ' + esc(S.etat.config.optinRecentJours) + ' jours, fiches fusionnées, leads déjà dans une autre séquence.<br>'
      + 'Par défaut, un segment écarte aussi les leads entrés il y a moins de ' + esc(S.etat.config.ancienneteMinJours) + ' jours et ceux contactés depuis moins de ' + esc(S.etat.config.silenceMinJours) + ' jours (appel décroché, SMS, WhatsApp, e-mail, RDV — un appel sans réponse ne compte pas). Mets 0 pour désactiver sur un segment.</small>'
    + '<div class="rl-grid">'
    + '<label class="rl-f">Nom<input class="rl-in" id="sgNom" value="' + esc(s.nom) + '" placeholder="ex. Follow-up Elite"></label>'
    + '<label class="rl-f">Provenance contient (séparer par des virgules)<input class="rl-in" id="sgProv" value="' + esc((f.provenances || []).join(', ')) + '" placeholder="ex. elite"></label>'
    + '<label class="rl-f">Entrés depuis le<input class="rl-in" type="date" id="sgDu" value="' + esc(f.entreDu || '') + '"></label>'

function setTab(t) {
  document.querySelectorAll('.rl-tab').forEach(function (x) { x.className = 'rl-tab' + (x.getAttribute('data-tab') === t ? ' on' : ''); });
  ['campagnes', 'segments', 'suivi', 'modeles', 'reglages'].forEach(function (p) { $('pane' + p.charAt(0).toUpperCase() + p.slice(1)).className = 'rl-pane' + (p === t ? ' on' : ''); });
  if (t === 'modeles') peindreModeles();
}
function action(corps, ok) {
  if (S.occupe) return;
  occupe(true);
  return appel(corps).then(function (j) {
    occupe(false);
    if (!j.ok) { toast(erreurTexte(j)); return j; }
    if (ok) ok(j);
    return j;
  }).catch(function (e) { occupe(false); toast('Erreur réseau : ' + (e && e.message)); });
}

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-tab],[data-action]');
  if (!t) return;
  if (t.hasAttribute('data-tab')) { setTab(t.getAttribute('data-tab')); return; }
  var a = t.getAttribute('data-action');
  if (a === 'preconfigurer') {
    action({ action: 'preconfigurer' }, function () { toast('Campagne préconfigurée créée (brouillon).'); S.camp = null; charger(); });
  } else if (a === 'seg-nouveau') { S.seg = segVide(); S.segApercu = null; peindreSegments(); }
  else if (a === 'seg-ouvrir') {
    (S.etat.segments || []).forEach(function (s) { if (s.id === t.getAttribute('data-id')) S.seg = JSON.parse(JSON.stringify(s)); });
    S.segApercu = null; peindreSegments();
  } else if (a === 'seg-apercu') {
    S.seg = lireSegment();
    action({ action: 'apercu', filtres: S.seg.filtres }, function (j) { S.segApercu = j; peindreApercu(); });
  } else if (a === 'seg-enregistrer') {
    S.seg = lireSegment();
    if (!S.seg.nom) { toast('Donne un nom au segment.'); return; }
    action({ action: 'segment', id: S.seg.id || null, nom: S.seg.nom, filtres: S.seg.filtres }, function (j) { S.seg.id = j.id; toast('Segment enregistré.'); charger(); });
  } else if (a === 'camp-nouvelle') { S.camp = campVide(); S.prep = null; peindreCampEdit(); }
  else if (a === 'camp-ouvrir') {
    (S.etat.campagnes || []).forEach(function (c) { if (c.id === t.getAttribute('data-id')) S.camp = JSON.parse(JSON.stringify(c)); });
    S.prep = null; peindreCampagnes();
  } else if (a === 'vague-ajout') { lireCampagne(); S.camp.vagues.push({ segmentId: '', jours: [1] }); peindreCampEdit(); }
  else if (a === 'vague-suppr') { lireCampagne(); S.camp.vagues.splice(+t.getAttribute('data-i'), 1); peindreCampEdit(); }
  else if (a === 'etape-ajout') {
    lireCampagne();
    var last = S.camp.etapes[S.camp.etapes.length - 1];
    S.camp.etapes.push({ canal: 'sms', delaiJours: (last ? (+last.delaiJours || 0) : 0) + 2, texte: '' });
    peindreCampEdit();
  } else if (a === 'etape-suppr') { lireCampagne(); S.camp.etapes.splice(+t.getAttribute('data-i'), 1); peindreCampEdit(); }
  else if (a === 'camp-enregistrer') {
    var c = lireCampagne();
    var errs = [];
    c.etapes.forEach(function (e, i) { var m = modele(e.modele); var x = C.verifierEtape(Object.assign({}, e, m ? { enteteFormat: m.enteteFormat, corpsModele: m.corps, videoAuto: !!m.exempleEntete } : {}), i); if (x) errs.push(x); });
    if (errs.length) toast('Enregistré, mais à corriger avant le test : ' + errs[0]);
    if (c.vagues.some(function (v) { return !v.jours || !v.jours.length; })) { toast('Indique les jours de campagne de chaque vague (ex. 1, ou 2,3).'); return; }
    action({ action: 'campagne', id: c.id || null, nom: c.nom, dateDebut: c.dateDebut, plafondJour: c.plafondJour, setterRepli: c.setterRepli, lienRdv: c.lienRdv, vagues: c.vagues, etapes: c.etapes },
      function (j) { S.camp.id = j.id; if (!errs.length) toast('Campagne enregistrée.'); charger(); });
  } else if (a === 'camp-test') {
    if (!window.confirm('Envoyer chaque étape de la séquence (et chaque SMS de repli) à tes coordonnées de test ?\n\nAucun lead ne reçoit rien.')) return;
    action({ action: 'test', campagneId: S.camp.id }, function (j) {
      toast(j.testReussi ? 'Test envoyé : vérifie ton téléphone et ta boîte mail.' : 'Test en échec : voir le détail.');
      charger();
    });
  } else if (a === 'camp-preparer') {
    action({ action: 'preparer', campagneId: S.camp.id }, function (j) { S.prep = j; S.prep.campagneId = S.camp.id; peindrePrep(); });
  } else if (a === 'camp-lancer') {
    var p = S.prep;
    var saisie = window.prompt('LANCEMENT RÉEL\n\n' + p.total + ' leads vont recevoir la séquence (coût estimé ' + euros(p.cout) + ').\nLes envois commencent au jour 1 (' + ymdFr(S.camp.dateDebut) + ') à ' + S.etat.config.heureDebut + ' h.\n\nPour confirmer, tape le nombre de leads :');
    if (saisie === null) return;
    if (parseInt(saisie, 10) !== p.total) { toast('Nombre différent : lancement annulé.'); return; }
    action({ action: 'lancer', campagneId: S.camp.id, nb: p.total }, function (j) { toast(j.inscrits + ' leads inscrits. Les envois partiront selon le calendrier.'); S.prep = null; charger(); });
  } else if (a === 'camp-pause') { action({ action: 'pause', campagneId: S.camp.id }, function () { toast('Campagne en pause.'); charger(); }); }
  else if (a === 'camp-reprendre') { action({ action: 'reprendre', campagneId: S.camp.id }, function () { toast('Campagne reprise.'); charger(); }); }
  else if (a === 'camp-arreter') {
    if (!window.confirm('Arrêter DÉFINITIVEMENT cette campagne ? Aucune étape restante ne partira.')) return;
    action({ action: 'arreter', campagneId: S.camp.id }, function (j) { toast(j.arretees + ' séquences arrêtées.'); charger(); });
  } else if (a === 'camp-dry') {
    if (S.occupe) return;
    occupe(true);
    firebase.auth().currentUser.getIdToken().then(function (tk) {
      return fetch('/api/relances-cron', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tk, 'Content-Type': 'application/json' }, body: JSON.stringify({ dryRun: true }) });
    }).then(function (r) { return r.json(); }).then(function (j) {
      occupe(false);
      window.alert('Simulation du prochain passage (rien n\'est envoyé)\n\nMode test : ' + (j.modeTest ? 'oui' : 'non') + ' · Plage ouverte : ' + (j.ouvert ? 'oui' : 'non')
        + '\nÉtapes dues : ' + (j.dues || 0) + ' · Ce passage traiterait : ' + ((j.envois || []).length) + ' · Rattrapages SMS : ' + ((j.rattrapages || []).length)
        + (j.saute ? '\nSauté : ' + j.saute : ''));
    }).catch(function () { occupe(false); toast('Simulation impossible.'); });
  } else if (a === 'camp-suivi') { S.suiviId = S.camp.id; setTab('suivi'); chargerSuivi(); }
  else if (a === 'etape-tester') {
    var it = +t.getAttribute('data-i');
    if (S.camp.etat === 'brouillon' || !S.camp.etat) lireCampagne();
    var et = S.camp.etapes[it];
    var tel = window.prompt('Envoyer ce WhatsApp, tel qu\'un client le recevra, au numéro :', (S.etat.config.testTelephone || ''));
    if (tel === null) return;
    var res = $('testRes_' + it);
    res.className = 'rl-hint'; res.textContent = 'Envoi en cours…';
    action({ action: 'testerEtape', etape: et, telephone: tel.trim(), prenom: exemple().prenom, setter: exemple().setter, campagneId: S.camp.id || null }, function (j) {
      if (!j.envoye) { res.className = 'rl-hint ko'; res.textContent = '✗ Refusé avant l\'envoi : ' + (j.erreur || 'erreur') + (j.codeMeta ? ' (code Meta ' + j.codeMeta + ')' : ''); return; }
      res.textContent = '✓ Accepté par Meta, vers ' + j.vers + '. J\'attends l\'accusé de réception…';
      suivreTest(j.wamid, res, 0);
    }).then(function (j) { if (j && !j.ok) { res.className = 'rl-hint ko'; res.textContent = '✗ ' + erreurTexte(j); } });
  }
  else if (a === 'inserer') {
    var v = t.getAttribute('data-v');
    remplirChamp(t.getAttribute('data-champ'), t.getAttribute('data-i'), function (ta) {
      var d = ta.selectionStart != null ? ta.selectionStart : ta.value.length, f = ta.selectionEnd != null ? ta.selectionEnd : d;
      var avant = ta.value.slice(0, d), apres = ta.value.slice(f);
      var ins = (avant && !/\s$/.test(avant) ? ' ' : '') + v + (apres && !/^\s/.test(apres) ? ' ' : '');
      ta.value = avant + ins + apres;
      ta.selectionStart = ta.selectionEnd = (avant + ins).length;
    });
  }
  else if (a === 'sms-conseille') {
    remplirChamp(t.getAttribute('data-champ'), t.getAttribute('data-i'), function (ta) {
      if (ta.value.trim() && !window.confirm('Remplacer le texte actuel par le texte conseillé ?')) return;
      ta.value = SMS_CONSEILLE;
    });
  }
  else if (a === 'camp-supprimer') {
    if (!window.confirm('Supprimer la campagne « ' + (S.camp.nom || '') + ' » ?\n\nElle disparaît de la liste. Ses envois et statistiques restent conservés en base.')) return;
    action({ action: 'supprimerCampagne', campagneId: S.camp.id }, function () { toast('Campagne supprimée.'); S.camp = null; S.prep = null; charger(); });
  }
  else if (a === 'seg-supprimer') {
    if (!window.confirm('Supprimer le segment « ' + (S.seg.nom || '') + ' » ?')) return;
    action({ action: 'supprimerSegment', segmentId: S.seg.id }, function () { toast('Segment supprimé.'); S.seg = null; S.segApercu = null; charger(); });
  }
  else if (a === 'camp-suivi-creer') {
    action({ action: 'creerSuivi', campagneId: S.camp.id }, function (j) { toast('Campagne de suivi créée (brouillon).'); S.camp = { id: j.suiviId }; charger(); });
  }
  else if (a === 'suivi-charger') { S.suiviId = $('suCamp').value; chargerSuivi(); }
  else if (a === 'suivi-csv') { exporterCsv(); }
  else if (a === 'seg-csv') { if (S.segApercu) exporterSegment(); }
  else if (a === 'modele-soumettre') {
    var nom = t.getAttribute('data-nom'), vid = $('mdVid_' + nom);
    if (!window.confirm('Soumettre le modèle « ' + nom + ' » à l\'examen de Meta ?')) return;
    action({ action: 'soumettreModele', nom: nom, videoUrl: vid ? vid.value.trim() : '' }, function () { toast('Modèle soumis à Meta : statut visible ici dès son examen.'); S.modeles = null; peindreModeles(); });
  } else if (a === 'reglages-enregistrer') {
    action({ action: 'config', patch: {
      testTelephone: $('rgTel').value.trim(), testEmail: $('rgMail').value.trim(), plafondJour: $('rgPlaf').value,
      heureDebut: $('rgDeb').value, heureFin: $('rgFin').value, setterRepli: $('rgRepli').value, emailCompte: $('rgCompte').value,
      pauseSiQualiteRouge: $('rgQual').checked, coutWhatsapp: $('rgCw').value, coutSms: $('rgCs').value, coutEmail: $('rgCe').value
    } }, function () { toast('Réglages enregistrés.'); charger(); });
  } else if (a === 'mode-production') {
    var c2 = window.prompt('PASSER EN PRODUCTION\n\nLes campagnes LANCÉES enverront réellement leurs messages aux leads.\nTape PRODUCTION pour confirmer :');
    if (c2 !== 'PRODUCTION') { if (c2 !== null) toast('Confirmation incorrecte : rien n\'a changé.'); return; }
    action({ action: 'config', patch: { modeTest: false }, confirmation: 'PRODUCTION' }, function () { toast('Production activée.'); charger(); });
  } else if (a === 'mode-test') {
    action({ action: 'config', patch: { modeTest: true } }, function () { toast('Mode test : plus aucun envoi réel.'); charger(); });
  }
});
document.addEventListener('change', function (ev) {
  var x = ev.target;
  if (x && x.getAttribute && (x.getAttribute('data-e') === 'canal' || x.getAttribute('data-e') === 'modele')) {
    lireCampagne();
    if (x.getAttribute('data-e') === 'modele') {
      var e = S.camp.etapes[+x.getAttribute('data-i')], m = modele(x.value);
      if (e && m) e.parametres = (e.parametres && e.parametres.length >= m.variables) ? e.parametres : ['prenom', 'setter'].slice(0, Math.max(1, m.variables));
    }
    peindreCampEdit();
  }
});
document.addEventListener('input', function (ev) {
  var x = ev.target;
  if (!x || !x.getAttribute) return;
  var k = x.getAttribute('data-e');
  var et = S.camp && S.camp.etapes ? S.camp.etapes[+x.getAttribute('data-i')] : null;
  if ((k === 'texte' && et && et.canal === 'sms') || k === 'texteRepli') {
    var h = x.parentNode.nextElementSibling;
    if (h && h.className.indexOf('rl-hint') >= 0) h.outerHTML = compteurSms(x.value);
    var pv = $('smsPrev_' + x.getAttribute('data-i'));
    if (pv) pv.outerHTML = apercuSms(x.value, x.getAttribute('data-i'));
  }
});
document.addEventListener('change', function (ev) {
  var x = ev.target;
  if (!x || !x.getAttribute) return;
  if (x.id === 'apPrenom' || x.id === 'apSetter') {
    exemple()[x.id === 'apPrenom' ? 'prenom' : 'setter'] = x.value.trim() || (x.id === 'apPrenom' ? 'Julie' : 'Anthony');
    lireCampagne(); rafraichirApercus(); return;
  }
  var k = x.getAttribute('data-e');
  if (k === 'param' || k === 'videoUrl' || (x.id === 'cpLien')) { lireCampagne(); rafraichirApercus(); }
});
/* Suit l'accusé Meta du message de test : délivré / lu = tout est bon ;
   failed = la raison exacte de Meta s'affiche. 2 minutes au plus. */
function suivreTest(wamid, res, n) {
  setTimeout(function () {
    appel({ action: 'statutTest', wamid: wamid }).then(function (j) {
      var st = j && j.statut;
      if (st === 'read') { res.className = 'rl-hint'; res.innerHTML = '<b style="color:#16a34a">✓ Reçu et lu sur ton téléphone.</b> Vérifie la vidéo, le texte et clique les deux boutons.'; return; }
      if (st === 'delivered') { res.className = 'rl-hint'; res.innerHTML = '<b style="color:#16a34a">✓ Délivré sur ton téléphone.</b> Ouvre-le : vidéo, texte, boutons.'; if (n < 40) suivreTest(wamid, res, n + 1); return; }
      if (st === 'failed') {
        var em = (j && j.erreurMeta) || {};
        res.className = 'rl-hint ko';
        res.textContent = '✗ Refusé par Meta' + (em.code ? ' (code ' + em.code + ')' : '') + ' : ' + (em.detail || em.titre || 'raison inconnue');
        return;
      }
      if (n >= 40) { res.className = 'rl-hint'; res.textContent = 'Pas encore d\'accusé de Meta après 2 minutes : regarde ton téléphone.'; return; }
      if (st === 'sent') res.textContent = '… Envoyé par Meta, en cours de livraison.';
      suivreTest(wamid, res, n + 1);
    });
  }, 3000);
}
function chargerSuivi() {
  if (!S.suiviId) { S.stats = null; peindreSuivi(); return; }
  action({ action: 'stats', campagneId: S.suiviId }, function (j) { S.stats = j; peindreSuivi(); });
}

firebase.auth().onAuthStateChanged(function (user) {
  if (!user) { window.location.href = 'login.html'; return; }
  if ((localStorage.getItem('ambitio_role') || '') !== 'admin') { $('lockedView').style.display = ''; return; }
  $('mainView').style.display = '';
  charger();
});

})();
</script>
