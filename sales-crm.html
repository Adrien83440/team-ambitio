<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ambitio — CRM Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>if(!firebase.apps.length){firebase.initializeApp({apiKey:"AIzaSyDo30FASeWnhvx4mYWYungKOu4AMhyJz6o",authDomain:"ambitio-team.firebaseapp.com",projectId:"ambitio-team",storageBucket:"ambitio-team.firebasestorage.app",messagingSenderId:"1079366902268",appId:"1:1079366902268:web:b4ec1691dba54230339279"});}</script>
<link rel="stylesheet" href="sales-crm.css"/>
</head>
<body style="display:flex;flex-direction:column;height:100vh">
<div class="crm-header"><div class="crm-logo">A</div><div class="crm-title">CRM Pipeline</div><div class="crm-stats"><div class="crm-stat"><div class="crm-stat-val" id="statTotal">—</div><div class="crm-stat-label">Total</div></div><div class="crm-stat"><div class="crm-stat-val" style="color:var(--green)" id="statWon">—</div><div class="crm-stat-label">Won</div></div><div class="crm-stat"><div class="crm-stat-val" style="color:var(--red3)" id="statLost">—</div><div class="crm-stat-label">Lost</div></div></div><button class="settings-gear" id="settingsGear" title="Paramètres">⚙</button></div>
<div class="crm-toolbar"><div class="sv-wrapper" id="svWrapper"><div class="sv-trigger" id="svTrigger"><span style="font-size:14px">📋</span> <span id="svTriggerLabel">Toutes les Affaires</span> <span class="sv-count" id="svTriggerCount">—</span> <span class="sv-trigger-caret">▼</span></div><div class="sv-dropdown" id="svDropdown"><div class="sv-search-wrap"><input class="sv-search-input" id="svSearchInput" placeholder="Rechercher des affichages"/></div><div id="svListDefault"></div><div id="svListCustom"></div><button class="sv-create-btn" id="svCreateBtn">+ Créer l'affichage</button></div></div><input class="crm-search" id="crmSearch" placeholder="Rechercher..."/><button class="crm-filter-pill active" data-setter="all">Tous</button><button class="crm-filter-pill" data-setter="guillaume">Guillaume</button><button class="crm-filter-pill" data-setter="elodie">Élodie</button><button class="crm-section-pill active" data-section="all">Tout</button><button class="crm-section-pill" data-section="Prospection">Prospection</button><button class="crm-section-pill" data-section="Closing">Closing</button><div class="view-toggle"><button class="view-btn active" data-view="pipeline" title="Pipeline">▥</button><button class="view-btn" data-view="list" title="Liste">☰</button><button class="view-btn" data-view="sheet" title="Feuille">▦</button></div><div class="sort-wrapper" id="sortWrapper"><span style="font-size:12px;color:var(--muted);font-weight:600">Trier par</span><div class="sort-trigger" id="sortTrigger"><span id="sortTriggerLabel">Heure de création</span> <span style="font-size:9px">▼</span></div><div class="sort-dd" id="sortDD"></div><button class="sort-dir-btn" id="sortDirBtn" title="Inverser le tri">↕</button></div><button class="colcfg-btn" id="colcfgBtn" title="Colonnes affichées">⚙</button><button class="crm-clients-btn" id="crmClientsBtn" onclick="openClientsPanel()">👥 Clients actifs <span class="crm-clients-count" id="crmClientsCount"></span></button><button class="crm-add-btn" id="crmAddBtn">+ Nouveau lead</button></div>
<div class="filter-bar" id="filterBar">
  <div class="fb-archive-toggle" id="fbArchiveToggle"><button class="fb-archive-btn active" data-archive="recent">📅 Récents</button><button class="fb-archive-btn" data-archive="old">📦 Anciens (+6 mois)</button></div>
  <div class="fb-sep"></div>
  <div class="fb-dd-wrapper" id="fbDateWrapper">
    <div class="fb-dd-trigger" id="fbDateTrigger">📅 Période <span class="fb-dd-caret">▼</span></div>
    <div class="fb-dd-menu" id="fbDateDD">
      <div class="fb-dd-item active" data-daterange="all">Tout</div>
      <div class="fb-dd-item" data-daterange="7d">7 jours</div>
      <div class="fb-dd-item" data-daterange="30d">30 jours</div>
      <div class="fb-dd-item" data-daterange="90d">3 mois</div>
      <div class="fb-dd-item" data-daterange="year">Cette année</div>
      <div class="fb-dd-item" data-daterange="custom">Personnalisé</div>
    </div>
  </div>
  <input type="date" class="fb-date-input" id="fbDateFrom" style="display:none" title="Du"/>
  <input type="date" class="fb-date-input" id="fbDateTo" style="display:none" title="Au"/>
  <div class="fb-dd-wrapper" id="fbTagWrapper">
    <div class="fb-dd-trigger" id="fbTagTrigger">🏷 Tags <span class="fb-dd-caret">▼</span></div>
    <div class="fb-tag-dd" id="fbTagDD"></div>
  </div>
  <div class="fb-dd-wrapper" id="fbTypeWrapper">
    <div class="fb-dd-trigger" id="fbTypeTrigger">📦 Type <span class="fb-dd-caret">▼</span></div>
    <div class="fb-dd-menu" id="fbTypeDD"></div>
  </div>
  <div class="fb-active-chips" id="fbActiveChips"></div>
  <button class="fb-clear-all" id="fbClearAll" style="display:none">Tout effacer</button>
</div>
<div class="crm-views-container"><div class="crm-view active" id="viewPipeline"><div class="crm-board" id="crmBoard"></div></div><div class="crm-view list-view" id="viewList"><div class="list-table-wrap"><table class="list-table" id="listTable"><thead><tr id="listHead"></tr></thead><tbody id="listBody"></tbody></table></div><div class="pagi-bar" id="pagiList"></div></div><div class="crm-view sheet-view" id="viewSheet"><div class="sheet-table-wrap"><table class="sheet-table" id="sheetTable"><thead><tr id="sheetHead"></tr></thead><tbody id="sheetBody"></tbody></table></div><div class="pagi-bar" id="pagiSheet"></div></div></div>
<div class="bulk-bar" id="bulkBar"><span class="bulk-count" id="bulkCount">0 sélectionnés</span><div style="position:relative"><button class="bulk-btn" id="bulkStageBtn">🔀 Changer étape</button><div class="bulk-stage-dropdown" id="bulkStageDD"></div></div><button class="bulk-btn" id="bulkSetterBtn">⭐ Changer setter</button><button class="bulk-btn" id="bulkTagBtn" style="border-color:rgba(167,139,250,0.25);background:rgba(167,139,250,0.08);color:#c4b5fd">🏷 Ajouter tag</button><button class="bulk-btn danger" id="bulkDeleteBtn">🗑 Supprimer</button><button class="bulk-deselect" id="bulkDeselect">✕ Désélectionner tout</button></div>
<div class="crm-modal-bg" id="modalBg"><div class="crm-modal" id="modalPanel"></div></div>
<div class="qv-overlay" id="qvOverlay"></div><div class="qv-panel" id="qvPanel" style="display:none"></div>
<div class="cv-backdrop" id="cvBackdrop"><div class="cv-modal" id="cvModal"></div></div>
<div class="colcfg-panel" id="colcfgPanel"></div>
<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-panel" id="settingsPanel"></div>
<div class="crm-toast" id="crmToast"></div>
<script src="dialer-bridge.js" defer></script>
<link rel="stylesheet" href="call-detail-modal.css">
<script src="call-detail-modal.js" defer></script>
<script src="sales-crm-app.js"></script>
<script src="nav.js"></script>

<!-- ═══ CLIENTS PANEL ═══ -->
<div id="clientsPanelOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8000;backdrop-filter:blur(4px)" onclick="if(event.target===this)closeClientsPanel()"></div>
<div id="clientsPanel" style="display:none;position:fixed;top:0;right:0;bottom:0;width:min(92vw,1100px);background:var(--bg);border-left:1px solid var(--border2);z-index:8001;overflow-y:auto;flex-direction:column">
  <div style="padding:20px 24px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:10">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:17px">👥</div>
      <div>
        <div style="font-family:var(--font-d);font-size:18px;font-weight:800">Clients actifs</div>
        <div style="font-size:11px;color:var(--muted)" id="clientsPanelCount">Chargement…</div>
      </div>
      <div style="flex:1"></div>
      <div style="display:flex;gap:6px;align-items:center"><button id="clientsViewGrid" onclick="setClientsView('grid')" title="Grille" style="background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);border-radius:8px;padding:6px 10px;color:#34d399;cursor:pointer;font-size:13px">⊞</button><button id="clientsViewList" onclick="setClientsView('list')" title="Liste" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--muted);cursor:pointer;font-size:13px">☰</button><button onclick="closeClientsPanel()" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted);cursor:pointer;font-size:13px">✕</button></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="clientsSearch" placeholder="🔍 Rechercher un client…" oninput="renderClientsGrid()" style="flex:1;min-width:180px;padding:8px 12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-b);font-size:12px;outline:none"/>
      <select id="clientsFilter" onchange="renderClientsGrid()" style="padding:8px 12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-b);font-size:12px;outline:none;cursor:pointer">
        <option value="">Tous les statuts</option>
        <option value="active">✅ Actif</option>
        <option value="paused">⏸ En pause</option>
        <option value="completed">🎉 Terminé</option>
        <option value="stopped">🛑 Stoppé</option>
        <option value="procedure">⚖️ Procédure</option>
      </select>
    </div>
  </div>
  <div id="clientsGrid" style="padding:20px 24px;flex:1"></div>
</div>

<!-- ═══ CLIENT DETAIL MODAL ═══ -->
<div id="clientDetailBg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;backdrop-filter:blur(4px);align-items:center;justify-content:center" onclick="if(event.target===this)closeClientDetail()">
  <div id="clientDetailModal" style="background:var(--bg);border:1px solid var(--border2);border-radius:18px;width:min(94vw,720px);max-height:92vh;overflow-y:auto;padding:28px;position:relative"></div>
</div>
</body>
</html>
