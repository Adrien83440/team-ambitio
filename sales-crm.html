<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#08080f; --bg2:#0f0f1a; --bg3:#14141f; --bg4:#1a1a28;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --red:#b91c1c; --red2:#ef4444; --red3:#fca5a5;
  --gold:#f59e0b; --green:#34d399; --blue:#60a5fa; --purple:#a78bfa;
  --text:rgba(255,255,255,0.92); --muted:rgba(255,255,255,0.48); --muted2:rgba(255,255,255,0.22);
  --radius:12px; --radius2:16px;
  --fh:'Syne',sans-serif; --fb:'Inter',sans-serif; --fm:'DM Mono',monospace;
}
html,body { min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--fb); font-size:14px; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased; }

/* ══════════════════════════════
   HEADER
   ══════════════════════════════ */
.crm-header {
  padding:14px 20px 12px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.crm-logo { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#ef4444,#b91c1c); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:white; box-shadow:0 3px 12px rgba(239,68,68,0.3); flex-shrink:0; }
.crm-title { font-family:var(--fh); font-size:18px; font-weight:800; }
.crm-stats { display:flex; gap:8px; margin-left:auto; align-items:center; }
.crm-stat { text-align:center; padding:3px 10px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; }
.crm-stat-val { font-family:var(--fm); font-size:15px; font-weight:700; }
.crm-stat-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); }

/* ══════════════════════════════
   TOOLBAR
   ══════════════════════════════ */
.crm-toolbar {
  padding:8px 20px; display:flex; gap:8px; align-items:center;
  border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
}

/* ── Saved Views Dropdown ── */
.sv-wrapper { position:relative; flex-shrink:0; }
.sv-trigger {
  display:flex; align-items:center; gap:6px; padding:6px 12px 6px 10px;
  background:var(--bg2); border:1.5px solid var(--border); border-radius:8px;
  cursor:pointer; font-family:var(--fb); font-size:12px; font-weight:700;
  color:var(--text); transition:all .15s; white-space:nowrap; user-select:none;
}
.sv-trigger:hover { border-color:var(--border2); }
.sv-trigger.open { border-color:var(--red2); background:rgba(185,28,28,0.06); }
.sv-trigger-icon { font-size:14px; }
.sv-trigger-caret { font-size:8px; color:var(--muted); transition:transform .15s; }
.sv-trigger.open .sv-trigger-caret { transform:rotate(180deg); }
.sv-count {
  font-family:var(--fm); font-size:10px; font-weight:600; color:var(--muted);
  background:var(--bg3); padding:1px 5px; border-radius:4px;
}

.sv-dropdown {
  display:none; position:absolute; top:calc(100% + 4px); left:0; z-index:200;
  width:320px; max-height:420px; overflow-y:auto;
  background:var(--bg2); border:1.5px solid var(--border2); border-radius:12px;
  box-shadow:0 16px 48px rgba(0,0,0,0.5); padding:6px;
  animation:svIn .12s ease;
}
.sv-dropdown.open { display:block; }
@keyframes svIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

.sv-tabs { display:flex; gap:0; margin-bottom:6px; border-bottom:1px solid var(--border); }
.sv-tab {
  flex:1; padding:8px 6px; text-align:center; font-size:11px; font-weight:700;
  color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;
  transition:all .15s;
}
.sv-tab:hover { color:var(--text); }
.sv-tab.active { color:var(--red3); border-bottom-color:var(--red2); }

.sv-search-wrap { padding:4px 6px 6px; }
.sv-search-input {
  width:100%; padding:6px 10px; background:var(--bg3); border:1.5px solid var(--border);
  border-radius:6px; color:var(--text); font-family:var(--fb); font-size:11px; outline:none;
}
.sv-search-input:focus { border-color:var(--red2); }
.sv-search-input::placeholder { color:var(--muted2); }

.sv-section-label {
  padding:6px 10px 3px; font-size:9px; font-weight:800; text-transform:uppercase;
  letter-spacing:0.8px; color:var(--muted2);
}
.sv-item {
  display:flex; align-items:center; gap:8px; padding:7px 10px;
  border-radius:8px; cursor:pointer; transition:all .12s; font-size:12px;
  font-weight:600; color:rgba(255,255,255,0.7);
}
.sv-item:hover { background:rgba(255,255,255,0.05); color:var(--text); }
.sv-item.active { background:rgba(185,28,28,0.1); color:var(--red3); }
.sv-item-icon { font-size:14px; width:20px; text-align:center; flex-shrink:0; }
.sv-item-label { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sv-item-count {
  font-family:var(--fm); font-size:10px; color:var(--muted);
  background:var(--bg3); padding:1px 5px; border-radius:4px;
}
.sv-item-del {
  width:20px; height:20px; border-radius:4px; display:none; align-items:center;
  justify-content:center; font-size:10px; color:var(--muted); cursor:pointer;
  background:transparent; border:none; transition:all .12s;
}
.sv-item:hover .sv-item-del { display:flex; }
.sv-item-del:hover { color:var(--red2); background:rgba(239,68,68,0.1); }

.sv-create-btn {
  display:flex; align-items:center; gap:6px; width:100%; padding:8px 10px;
  margin-top:4px; border:1.5px dashed var(--border); border-radius:8px;
  background:transparent; color:var(--muted); font-family:var(--fb);
  font-size:11px; font-weight:700; cursor:pointer; transition:all .15s;
}
.sv-create-btn:hover { border-color:var(--red2); color:var(--red3); background:rgba(185,28,28,0.05); }

/* ── Search & Filters ── */
.crm-search {
  padding:6px 12px; background:var(--bg2); border:1.5px solid var(--border);
  border-radius:8px; color:var(--text); font-family:var(--fb); font-size:12px;
  outline:none; min-width:160px;
}
.crm-search:focus { border-color:var(--red2); }
.crm-search::placeholder { color:var(--muted2); }

.crm-filter-pill {
  padding:4px 10px; border:1.5px solid var(--border); border-radius:20px;
  background:transparent; color:var(--muted); font-family:var(--fb);
  font-size:11px; font-weight:700; cursor:pointer; transition:all .15s;
}
.crm-filter-pill:hover { border-color:var(--border2); color:var(--text); }
.crm-filter-pill.active { border-color:var(--red2); color:var(--red3); background:rgba(185,28,28,0.08); }

/* ── Section Filter Pills ── */
.crm-section-pill {
  padding:4px 10px; border:1.5px solid var(--border); border-radius:20px;
  background:transparent; color:var(--muted); font-family:var(--fb);
  font-size:11px; font-weight:700; cursor:pointer; transition:all .15s;
}
.crm-section-pill:hover { border-color:var(--border2); color:var(--text); }
.crm-section-pill.active { border-color:var(--gold); color:var(--gold); background:rgba(245,158,11,0.08); }

/* ── View Toggle ── */
.view-toggle { display:flex; gap:0; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; margin-left:auto; flex-shrink:0; }
.view-btn {
  padding:5px 10px; background:transparent; border:none; border-right:1px solid var(--border);
  color:var(--muted); font-size:14px; cursor:pointer; transition:all .12s;
  display:flex; align-items:center; justify-content:center; min-width:34px;
}
.view-btn:last-child { border-right:none; }
.view-btn:hover { color:var(--text); background:rgba(255,255,255,0.04); }
.view-btn.active { color:var(--red3); background:rgba(185,28,28,0.1); }

.crm-add-btn {
  padding:6px 14px; border:none; border-radius:8px;
  background:linear-gradient(135deg,#b91c1c,#ef4444); color:white;
  font-family:var(--fb); font-size:12px; font-weight:700;
  cursor:pointer; transition:all .15s; flex-shrink:0;
}
.crm-add-btn:hover { transform:translateY(-1px); }

/* ══════════════════════════════
   VIEW CONTAINERS
   ══════════════════════════════ */
.crm-views-container { flex:1; overflow:hidden; position:relative; }
.crm-view { display:none; height:100%; }
.crm-view.active { display:flex; }

/* ── PIPELINE (Kanban) ── */
.crm-board { display:flex; gap:0; overflow-x:auto; flex:1; padding:0; scroll-behavior:smooth; }
.crm-board::-webkit-scrollbar { height:6px; }
.crm-board::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:3px; }
.crm-board::-webkit-scrollbar-track { background:transparent; }

.crm-col { min-width:240px; max-width:240px; display:flex; flex-direction:column; border-right:1px solid var(--border); flex-shrink:0; height:100%; }
.crm-col-head { padding:12px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10; }
.crm-col-head-top { display:flex; align-items:center; gap:6px; margin-bottom:2px; }
.crm-col-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.crm-col-title { font-family:var(--fh); font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crm-col-count { font-family:var(--fm); font-size:11px; font-weight:600; color:var(--muted); margin-left:auto; background:var(--bg3); padding:1px 6px; border-radius:4px; }
.crm-col-cards { flex:1; overflow-y:auto; padding:8px 8px 60px; min-height:100px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.06) transparent; }
.crm-col-cards::-webkit-scrollbar { width:3px; }
.crm-col-cards::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.06); border-radius:3px; }
.crm-col-cards.drag-over { background:rgba(52,211,153,0.04); outline:2px dashed rgba(52,211,153,0.2); outline-offset:-4px; border-radius:8px; }

/* ── Cards ── */
.crm-card { padding:10px 12px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; margin-bottom:6px; cursor:grab; transition:all .15s; position:relative; }
.crm-card:hover { border-color:var(--border2); }
.crm-card:active { cursor:grabbing; opacity:0.7; }
.crm-card.dragging { opacity:0.4; }
.crm-card-name { font-family:var(--fh); font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
.crm-card-phone { font-size:11px; color:var(--muted); font-family:var(--fm); margin-bottom:4px; }
.crm-card-bottom { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.crm-card-badge { font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; text-transform:uppercase; letter-spacing:0.3px; }
.crm-card-badge.vsl { background:rgba(167,139,250,0.12); color:#c4b5fd; }
.crm-card-badge.self { background:rgba(245,158,11,0.12); color:#fcd34d; }
.crm-card-badge.other { background:rgba(96,165,250,0.12); color:#93bbfd; }
.crm-card-setter { font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,0.05); color:var(--muted); }
.crm-card-setter.g { color:#fca5a5; }
.crm-card-setter.e { color:#93c5fd; }
.crm-card-notes-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); margin-left:auto; flex-shrink:0; }
.crm-card-eye {
  position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:6px;
  background:rgba(255,255,255,0.06); border:1px solid transparent;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:12px; opacity:0; transition:all .15s; z-index:5;
}
.crm-card:hover .crm-card-eye { opacity:1; }
.crm-card-eye:hover { background:rgba(96,165,250,0.15); border-color:rgba(96,165,250,0.3); }

/* ── LIST VIEW ── */
.list-view { flex-direction:column; overflow:hidden; }
.list-table-wrap { flex:1; overflow:auto; }
.list-table { width:100%; border-collapse:collapse; min-width:900px; }
.list-table thead { position:sticky; top:0; z-index:10; }
.list-table th {
  padding:10px 14px; text-align:left; font-size:10px; font-weight:800;
  text-transform:uppercase; letter-spacing:0.6px; color:var(--muted);
  background:var(--bg2); border-bottom:1.5px solid var(--border2);
  cursor:pointer; user-select:none; white-space:nowrap; transition:color .12s;
}
.list-table th:hover { color:var(--text); }
.list-table th .sort-arrow { font-size:8px; margin-left:4px; opacity:0.4; }
.list-table th.sorted .sort-arrow { opacity:1; color:var(--red3); }
.list-table td {
  padding:8px 14px; border-bottom:1px solid var(--border);
  font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:200px;
}
.list-table tr { cursor:pointer; transition:background .12s; }
.list-table tbody tr:hover { background:rgba(255,255,255,0.03); }
.list-stage-badge {
  display:inline-flex; align-items:center; gap:4px; padding:3px 8px;
  border-radius:6px; font-size:10px; font-weight:700;
}
.list-stage-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.list-setter-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; }
.list-type-badge { font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; text-transform:uppercase; }

/* ── SHEET VIEW ── */
.sheet-view { flex-direction:column; overflow:hidden; }
.sheet-table-wrap { flex:1; overflow:auto; }
.sheet-table { width:100%; border-collapse:collapse; min-width:1200px; }
.sheet-table thead { position:sticky; top:0; z-index:10; }
.sheet-table th {
  padding:6px 10px; text-align:left; font-size:10px; font-weight:800;
  text-transform:uppercase; letter-spacing:0.4px; color:var(--muted);
  background:var(--bg3); border:1px solid var(--border); min-width:100px;
  white-space:nowrap;
}
.sheet-table td {
  padding:0; border:1px solid var(--border); position:relative;
}
.sheet-cell {
  width:100%; padding:5px 8px; background:transparent; border:none;
  color:var(--text); font-family:var(--fb); font-size:11px; outline:none;
  min-height:30px; display:block;
}
.sheet-cell:focus { background:rgba(185,28,28,0.06); box-shadow:inset 0 0 0 1.5px var(--red2); }
.sheet-cell::placeholder { color:var(--muted2); }
.sheet-cell-select {
  width:100%; padding:5px 8px; background:transparent; border:none;
  color:var(--text); font-family:var(--fb); font-size:11px; outline:none;
  cursor:pointer;
}
.sheet-cell-select:focus { background:rgba(185,28,28,0.06); }
.sheet-cell-select option { background:var(--bg2); }
.sheet-row-num {
  padding:5px 8px; font-family:var(--fm); font-size:10px; color:var(--muted2);
  text-align:center; background:var(--bg3); border:1px solid var(--border);
  width:40px; min-width:40px;
}

/* ══════════════════════════════
   QUICK VIEW PANEL
   ══════════════════════════════ */
.qv-overlay { display:none; position:fixed; inset:0; z-index:400; }
.qv-overlay.open { display:block; }
.qv-panel {
  position:fixed; z-index:401; width:320px; max-height:70vh;
  background:var(--bg2); border:1px solid var(--border2); border-radius:14px;
  box-shadow:0 16px 48px rgba(0,0,0,0.5); overflow:hidden;
  animation:qvIn .15s ease;
}
@keyframes qvIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; } }
.qv-head { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.qv-av { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:var(--fh); font-size:14px; font-weight:800; color:white; flex-shrink:0; }
.qv-name { font-family:var(--fh); font-size:14px; font-weight:800; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qv-close { width:24px; height:24px; border:1px solid var(--border); border-radius:6px; background:transparent; cursor:pointer; color:var(--muted); font-size:11px; display:flex; align-items:center; justify-content:center; }
.qv-close:hover { color:var(--text); }
.qv-body { padding:12px 16px; overflow-y:auto; max-height:calc(70vh - 60px); }
.qv-field { display:flex; align-items:center; gap:6px; padding:4px 0; font-size:12px; }
.qv-field-label { color:var(--muted); min-width:80px; font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:0.3px; flex-shrink:0; }
.qv-field-input { flex:1; padding:5px 8px; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--text); font-family:var(--fb); font-size:12px; outline:none; }
.qv-field-input:hover { border-color:var(--border); }
.qv-field-input:focus { border-color:var(--red2); background:var(--bg3); }
.qv-field-input::placeholder { color:var(--muted2); }
.qv-select { flex:1; padding:5px 8px; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--text); font-family:var(--fb); font-size:12px; outline:none; cursor:pointer; }
.qv-select:hover { border-color:var(--border); }
.qv-select option { background:var(--bg2); }
.qv-sep { height:1px; background:var(--border); margin:8px 0; }
.qv-saved { font-size:10px; color:var(--green); text-align:center; padding:4px; opacity:0; transition:opacity .3s; }
.qv-link { display:block; text-align:center; padding:8px; margin-top:4px; font-size:11px; font-weight:700; color:var(--blue); text-decoration:none; border:1px solid rgba(96,165,250,0.2); border-radius:8px; transition:all .15s; }
.qv-link:hover { background:rgba(96,165,250,0.08); }

/* ══════════════════════════════
   DETAIL MODAL
   ══════════════════════════════ */
.crm-modal-bg { display:none; position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); }
.crm-modal-bg.open { display:flex; justify-content:flex-end; }
.crm-modal { width:480px; max-width:100%; height:100vh; background:var(--bg2); border-left:1px solid var(--border); overflow-y:auto; animation:slideIn 0.25s cubic-bezier(.4,0,.2,1); }
@keyframes slideIn { from { transform:translateX(100%); } to { transform:translateX(0); } }
.crm-modal-head { padding:20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg2); z-index:1; }
.crm-modal-av { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:var(--fh); font-size:18px; font-weight:800; color:white; flex-shrink:0; }
.crm-modal-name { font-family:var(--fh); font-size:18px; font-weight:800; flex:1; }
.crm-modal-close { width:32px; height:32px; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,0.06); cursor:pointer; color:var(--muted); font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.crm-modal-close:hover { background:rgba(255,255,255,0.12); color:white; }
.crm-modal-body { padding:20px; }
.crm-modal-section { margin-bottom:20px; }
.crm-modal-stitle { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.crm-modal-field { display:flex; gap:8px; padding:5px 0; font-size:13px; align-items:center; }
.crm-modal-field-label { color:var(--muted); min-width:100px; font-weight:600; font-size:12px; }
.crm-modal-input { flex:1; padding:7px 10px; background:var(--bg3); border:1.5px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--fb); font-size:12px; outline:none; }
.crm-modal-input:focus { border-color:var(--red2); }
.crm-modal-select { flex:1; padding:7px 10px; background:var(--bg3); border:1.5px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--fb); font-size:12px; outline:none; }
.crm-modal-select option { background:var(--bg2); }
.crm-modal-saved { font-size:11px; color:var(--green); text-align:center; padding:4px; opacity:0; transition:opacity 0.3s; }
.crm-stage-pills { display:flex; flex-wrap:wrap; gap:4px; }
.crm-stage-pill { padding:4px 8px; border:1px solid var(--border); border-radius:6px; font-size:10px; font-weight:600; cursor:pointer; transition:all .15s; color:var(--muted); }
.crm-stage-pill:hover { border-color:var(--border2); color:var(--text); }
.crm-stage-pill.active { border-color:currentColor; }
.crm-note-item { padding:8px 10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; margin-bottom:6px; }
.crm-note-date { font-size:10px; font-weight:700; color:var(--muted); }
.crm-note-text { font-size:12px; color:rgba(255,255,255,0.8); line-height:1.5; margin-top:2px; }
.crm-note-add-row { display:flex; gap:6px; }
.crm-note-input { flex:1; padding:8px 10px; background:var(--bg3); border:1.5px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--fb); font-size:12px; outline:none; resize:none; min-height:36px; }
.crm-note-input:focus { border-color:var(--red2); }
.crm-note-add-btn { padding:8px 12px; border:none; border-radius:8px; background:var(--bg4); color:var(--muted); font-family:var(--fb); font-size:11px; font-weight:700; cursor:pointer; }
.crm-note-add-btn:hover { color:var(--green); background:rgba(52,211,153,0.1); }

/* ══════════════════════════════
   CREATE VIEW MODAL
   ══════════════════════════════ */
.cv-backdrop {
  display:none; position:fixed; inset:0; z-index:600;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
  align-items:center; justify-content:center;
}
.cv-backdrop.open { display:flex; }
.cv-modal {
  background:var(--bg2); border:1px solid var(--border2); border-radius:16px;
  width:100%; max-width:440px; max-height:80vh; overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,0.5); margin:20px;
  animation:cvIn .2s ease;
}
@keyframes cvIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }
.cv-head { padding:20px 20px 0; display:flex; align-items:center; justify-content:space-between; }
.cv-title { font-family:var(--fh); font-size:16px; font-weight:800; }
.cv-close { width:28px; height:28px; border:1px solid var(--border); border-radius:6px; background:transparent; cursor:pointer; color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center; }
.cv-body { padding:20px; }
.cv-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:5px; margin-top:14px; }
.cv-label:first-child { margin-top:0; }
.cv-input { width:100%; padding:8px 12px; background:var(--bg3); border:1.5px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--fb); font-size:13px; outline:none; }
.cv-input:focus { border-color:var(--red2); }
.cv-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.cv-chip {
  padding:4px 10px; border:1.5px solid var(--border); border-radius:6px;
  font-size:10px; font-weight:700; cursor:pointer; transition:all .12s;
  color:var(--muted); background:transparent;
}
.cv-chip:hover { border-color:var(--border2); color:var(--text); }
.cv-chip.selected { border-color:var(--red2); color:var(--red3); background:rgba(185,28,28,0.08); }
.cv-actions { display:flex; gap:8px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
.cv-btn { flex:1; padding:10px; border:none; border-radius:8px; font-family:var(--fb); font-size:13px; font-weight:700; cursor:pointer; }
.cv-btn-save { background:linear-gradient(135deg,#b91c1c,#ef4444); color:white; }
.cv-btn-cancel { background:var(--bg3); color:var(--muted); border:1px solid var(--border); }

/* ── Toast ── */
.crm-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#1a2e1a; border:1px solid rgba(16,185,129,0.3); color:#6ee7b7; font-size:13px; font-weight:600; padding:10px 20px; border-radius:10px; z-index:2000; opacity:0; transition:all 0.3s; pointer-events:none; }
.crm-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>

<body style="display:flex;flex-direction:column;height:100vh">

<div class="crm-toolbar">

<div class="crm-toast" id="crmToast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   CRM PIPELINE v2 — Ambitio Corp
   Pipeline / Liste / Feuille + Vues sauvegardées
   ═══════════════════════════════════════════════════════ */
var db = firebase.firestore();

/* ── Pipeline Stages ── */
var STAGES = [
  { key:'lead',              label:'Lead',                color:'#34d399', section:'Prospection' },
  { key:'nrp1',              label:'NRP 1',               color:'#f59e0b', section:'Prospection' },
  { key:'nrp2',              label:'NRP 2',               color:'#e67e22', section:'Prospection' },
  { key:'nrp3',              label:'NRP 3',               color:'#ef4444', section:'Prospection' },
  { key:'all_nrp',           label:'All NRP',             color:'#6b7280', section:'Prospection' },
  { key:'poubelle',          label:'Poubelle',            color:'#374151', section:'Prospection' },
  { key:'disqualification',  label:'Disqualification',    color:'#6b7280', section:'Prospection' },
  { key:'follow_up_pm',      label:'Follow Up (PM)',      color:'#60a5fa', section:'Prospection' },
  { key:'set',               label:'SET',                 color:'#a78bfa', section:'Prospection' },
  { key:'rdv_self_booking',  label:'RDV Self Booking',    color:'#fbbf24', section:'Prospection' },
  { key:'rdv_confirmes',     label:'RDV confirmés',       color:'#34d399', section:'Closing' },
  { key:'rdv_annules_prospect', label:'RDV annulés Prospect', color:'#ef4444', section:'Closing' },
  { key:'rdv_annules_equipe',label:'RDV annulés Équipe',  color:'#f87171', section:'Closing' },
  { key:'no_show_self',      label:'No Show Self Booking',color:'#f59e0b', section:'Closing' },
  { key:'no_show_setting',   label:'No Show Setting',     color:'#e67e22', section:'Closing' },
  { key:'partenariats',      label:'Partenariats',        color:'#8b5cf6', section:'Closing' },
  { key:'closed_won_setting',label:'Closed Won Setting',  color:'#10b981', section:'Closing' },
  { key:'closed_won_self',   label:'Closed Won Self B.',  color:'#059669', section:'Closing' },
  { key:'closed_lost',       label:'Closed Lost',         color:'#ef4444', section:'Closing' },
  { key:'follow_up_closing', label:'Follow-Up',           color:'#60a5fa', section:'Closing' },
  { key:'disqualifie_closing',label:'Disqualifié',        color:'#6b7280', section:'Closing' }
];
var STAGE_MAP = {};
STAGES.forEach(function(s) { STAGE_MAP[s.key] = s; });

var LEAD_TYPES = { vsl_elite:'VSL', self_booking:'Self Booking' };
var TYPE_BADGE = { vsl_elite:'vsl', self_booking:'self' };

var STAGE_TO_STATUS = {
  lead:'nouveau', nrp1:'nrp1', nrp2:'nrp2', nrp3:'nrp3', all_nrp:'nrp3',
  poubelle:'disqualifie', disqualification:'disqualifie', follow_up_pm:'appele',
  set:'rdv_pose', rdv_self_booking:'rdv_pose', rdv_confirmes:'rdv_pose',
  rdv_annules_prospect:'pas_interesse', rdv_annules_equipe:'pas_interesse',
  no_show_self:'pas_interesse', no_show_setting:'pas_interesse',
  partenariats:'rdv_pose', closed_won_setting:'rdv_pose', closed_won_self:'rdv_pose',
  closed_lost:'pas_interesse', follow_up_closing:'appele', disqualifie_closing:'disqualifie'
};

/* ── State ── */
var allLeads = [];
var filterSetter = 'all';
var filterSection = 'all';
var searchQuery = '';
var draggedLeadId = null;
var currentView = 'pipeline';
var listSortKey = 'createdAt';
var listSortDir = 'desc';

/* ── Saved Views ── */
var savedViews = [];
var activeViewId = '__all__';
var DEFAULT_VIEWS = [
  { id:'__all__',        name:'Toutes les Affaires',  icon:'📋', filters:{ stages:[], setter:'all', section:'all', search:'' } },
  { id:'__prospection__',name:'Prospection',           icon:'📞', filters:{ stages:STAGES.filter(function(s){return s.section==='Prospection'}).map(function(s){return s.key}), setter:'all', section:'Prospection', search:'' } },
  { id:'__closing__',    name:'Closing',               icon:'🤝', filters:{ stages:STAGES.filter(function(s){return s.section==='Closing'}).map(function(s){return s.key}), setter:'all', section:'Closing', search:'' } },
  { id:'__won__',        name:'Closed Won',            icon:'🏆', filters:{ stages:['closed_won_setting','closed_won_self'], setter:'all', section:'all', search:'' } },
  { id:'__lost__',       name:'Closed Lost',           icon:'❌', filters:{ stages:['closed_lost'], setter:'all', section:'all', search:'' } },
  { id:'__followup__',   name:'Follow-Up',             icon:'🔔', filters:{ stages:['follow_up_pm','follow_up_closing'], setter:'all', section:'all', search:'' } },
  { id:'__leads__',      name:'Leads récents',         icon:'✨', filters:{ stages:['lead'], setter:'all', section:'all', search:'' } },
  { id:'__guillaume__',  name:'Guillaume',             icon:'⭐', filters:{ stages:[], setter:'guillaume', section:'all', search:'' } },
  { id:'__elodie__',     name:'Élodie',                icon:'⭐', filters:{ stages:[], setter:'elodie', section:'all', search:'' } }
];

/* ── Utils ── */
function toast(msg) { var t = document.getElementById('crmToast'); t.textContent = msg; t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2200); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escA(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmtNow() { var d = new Date(); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(ts) {
  if (!ts) return '—';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}

/* ═══════════════════════════════
   FILTERING
   ═══════════════════════════════ */
function getFiltered() {
  var list = allLeads.slice();
  // Active view filters
  var view = getActiveView();
  var vf = view ? view.filters : null;

  // Setter filter
  var setter = filterSetter;
  if (vf && vf.setter && vf.setter !== 'all') setter = vf.setter;
  if (setter !== 'all') {
    list = list.filter(function(l) { return l.assignedTo === setter; });
  }

  // Stage filter from view
  if (vf && vf.stages && vf.stages.length > 0) {
    list = list.filter(function(l) { return vf.stages.indexOf(l.stage || 'lead') >= 0; });
  }

  // Section filter
  var section = filterSection;
  if (vf && vf.section && vf.section !== 'all') section = vf.section;
  if (section !== 'all') {
    var sectionStages = STAGES.filter(function(s) { return s.section === section; }).map(function(s) { return s.key; });
    list = list.filter(function(l) { return sectionStages.indexOf(l.stage || 'lead') >= 0; });
  }

  // Search
  var q = searchQuery || (vf ? vf.search : '');
  if (q) {
    q = q.toLowerCase();
    list = list.filter(function(l) {
      return ((l.nom || '') + ' ' + (l.telephone || '') + ' ' + (l.email || '')).toLowerCase().indexOf(q) >= 0;
    });
  }
  return list;
}

function getActiveView() {
  for (var i = 0; i < DEFAULT_VIEWS.length; i++) {
    if (DEFAULT_VIEWS[i].id === activeViewId) return DEFAULT_VIEWS[i];
  }
  for (var j = 0; j < savedViews.length; j++) {
    if (savedViews[j].id === activeViewId) return savedViews[j];
  }
  return DEFAULT_VIEWS[0];
}

/* ═══════════════════════════════
   BUILD KANBAN BOARD
   ═══════════════════════════════ */
function buildBoard() {
  var board = document.getElementById('crmBoard');
  var h = '';
  STAGES.forEach(function(st) {
    h += '<div class="crm-col" data-stage="' + st.key + '" data-section="' + st.section + '">';
    h += '<div class="crm-col-head">';
    h += '<div class="crm-col-head-top">';
    h += '<span class="crm-col-dot" style="background:' + st.color + '"></span>';
    h += '<span class="crm-col-title" title="' + escA(st.label) + '">' + esc(st.label) + '</span>';
    h += '<span class="crm-col-count" data-count="' + st.key + '">0</span>';
    h += '</div></div>';
    h += '<div class="crm-col-cards" data-drop="' + st.key + '"></div>';
    h += '</div>';
  });
  board.innerHTML = h;
}
buildBoard();

/* ═══════════════════════════════
   BUILD LIST HEAD
   ═══════════════════════════════ */
var LIST_COLS = [
  { key:'nom',        label:'Nom',       w:'180px' },
  { key:'telephone',  label:'Téléphone', w:'130px' },
  { key:'email',      label:'Email',     w:'180px' },
  { key:'stage',      label:'Étape',     w:'160px' },
  { key:'assignedTo', label:'Setter',    w:'120px' },
  { key:'type',       label:'Type',      w:'100px' },
  { key:'utm',        label:'Source',    w:'120px' },
  { key:'createdAt',  label:'Créé le',   w:'100px' }
];

function buildListHead() {
  var h = '';
  LIST_COLS.forEach(function(col) {
    var isSorted = listSortKey === col.key;
    var arrow = isSorted ? (listSortDir === 'asc' ? '▲' : '▼') : '▲';
    h += '<th data-sortcol="' + col.key + '" class="' + (isSorted ? 'sorted' : '') + '" style="min-width:' + col.w + '">';
    h += esc(col.label);
    h += '<span class="sort-arrow">' + arrow + '</span>';
    h += '</th>';
  });
  document.getElementById('listHead').innerHTML = h;
}
buildListHead();

/* ═══════════════════════════════
   BUILD SHEET HEAD
   ═══════════════════════════════ */
var SHEET_COLS = [
  { key:'_num',       label:'#',         edit:false },
  { key:'nom',        label:'Nom',       edit:true },
  { key:'telephone',  label:'Téléphone', edit:true },
  { key:'email',      label:'Email',     edit:true },
  { key:'stage',      label:'Étape',     edit:'select' },
  { key:'assignedTo', label:'Setter',    edit:'select' },
  { key:'type',       label:'Type',      edit:'select' },
  { key:'utm',        label:'Source',    edit:true },
  { key:'secteur',    label:'Secteur',   edit:true },
  { key:'ca',         label:'CA',        edit:true },
  { key:'defi',       label:'Défi',      edit:true },
  { key:'closeur',    label:'Closeur',   edit:true },
  { key:'setting',    label:'Setting',   edit:true }
];

function buildSheetHead() {
  var h = '';
  SHEET_COLS.forEach(function(col) {
    h += '<th>' + esc(col.label) + '</th>';
  });
  document.getElementById('sheetHead').innerHTML = h;
}
buildSheetHead();

/* ═══════════════════════════════
   RENDER ALL
   ═══════════════════════════════ */
function renderAll() {
  var leads = getFiltered();
  updateStats(leads);
  if (currentView === 'pipeline') renderPipeline(leads);
  else if (currentView === 'list') renderList(leads);
  else if (currentView === 'sheet') renderSheet(leads);
  updateViewCount(leads.length);
}

function updateStats(leads) {
  var total = leads.length;
  var won = leads.filter(function(l) { return l.stage === 'closed_won_setting' || l.stage === 'closed_won_self'; }).length;
  var lost = leads.filter(function(l) { return l.stage === 'closed_lost'; }).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statWon').textContent = won;
  document.getElementById('statLost').textContent = lost;
}

function updateViewCount(n) {
  document.getElementById('svTriggerCount').textContent = n;
}

/* ── Pipeline Render ── */
function renderPipeline(leads) {
  var counts = {};
  STAGES.forEach(function(s) { counts[s.key] = 0; });
  leads.forEach(function(l) {
    var st = l.stage || 'lead';
    if (counts[st] !== undefined) counts[st]++;
  });
  STAGES.forEach(function(s) {
    var el = document.querySelector('[data-count="' + s.key + '"]');
    if (el) el.textContent = counts[s.key];
  });

  // Show/hide columns based on section filter & view
  var view = getActiveView();
  var vf = view ? view.filters : null;
  var visibleStages = null;
  if (vf && vf.stages && vf.stages.length > 0) visibleStages = vf.stages;

  STAGES.forEach(function(s) {
    var container = document.querySelector('[data-drop="' + s.key + '"]');
    var col = container ? container.closest('.crm-col') : null;
    if (!col) return;

    // Visibility based on active view stages
    if (visibleStages && visibleStages.indexOf(s.key) < 0) {
      col.style.display = 'none';
      return;
    }
    // Visibility based on section filter
    if (filterSection !== 'all' && s.section !== filterSection) {
      col.style.display = 'none';
      return;
    }
    col.style.display = '';

    var stageLeads = leads.filter(function(l) { return (l.stage || 'lead') === s.key; });
    var h = '';
    stageLeads.forEach(function(l) {
      h += renderCard(l);
    });
    container.innerHTML = h;
  });
}

function renderCard(l) {
  var typeKey = l.type || 'vsl_elite';
  var badge = TYPE_BADGE[typeKey] || 'other';
  var typeLabel = LEAD_TYPES[typeKey] || typeKey;
  var setter = l.assignedTo || '';
  var setterLabel = setter === 'guillaume' ? 'Guillaume' : (setter === 'elodie' ? 'Élodie' : '');
  var setterClass = setter === 'guillaume' ? 'g' : (setter === 'elodie' ? 'e' : '');
  var hasNotes = l.notesHistory && l.notesHistory.length > 0;
  var statusLabels = {nouveau:'Nouveau',appele:'Appelé',decroche:'Décroché',messagerie:'Msg',nrp1:'NRP1',nrp2:'NRP2',nrp3:'NRP3',rdv_pose:'RDV posé',pas_interesse:'Pas intéressé',disqualifie:'Disqualifié'};
  var lStatus = l.status || 'nouveau';

  var h = '';
  h += '<div class="crm-card" draggable="true" data-id="' + l.id + '">';
  h += '<span class="crm-card-eye" data-action="quickview" data-id="' + l.id + '" title="Aperçu rapide">👁</span>';
  h += '<div class="crm-card-name">' + esc(l.nom || '—') + '</div>';
  if (l.telephone) h += '<div class="crm-card-phone">' + esc(l.telephone) + '</div>';
  h += '<div class="crm-card-bottom">';
  h += '<span class="crm-card-badge ' + badge + '">' + typeLabel + '</span>';
  if (setterLabel) h += '<span class="crm-card-setter ' + setterClass + '">' + setterLabel + '</span>';
  if (lStatus !== 'nouveau') {
    h += '<span class="crm-card-setter" style="color:var(--blue);border-color:rgba(96,165,250,0.2)">📞 ' + (statusLabels[lStatus] || lStatus) + '</span>';
  }
  if (hasNotes) h += '<span class="crm-card-notes-dot" title="A des notes"></span>';
  h += '</div></div>';
  return h;
}

/* ── List Render ── */
function renderList(leads) {
  // Sort
  var sorted = leads.slice().sort(function(a, b) {
    var va = a[listSortKey] || '';
    var vb = b[listSortKey] || '';
    // Handle timestamps
    if (listSortKey === 'createdAt') {
      va = va && va.toDate ? va.toDate().getTime() : 0;
      vb = vb && vb.toDate ? vb.toDate().getTime() : 0;
    }
    if (listSortKey === 'stage') {
      va = STAGE_MAP[va] ? STAGE_MAP[va].label : va;
      vb = STAGE_MAP[vb] ? STAGE_MAP[vb].label : vb;
    }
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return listSortDir === 'asc' ? -1 : 1;
    if (va > vb) return listSortDir === 'asc' ? 1 : -1;
    return 0;
  });

  var h = '';
  sorted.forEach(function(l) {
    var st = STAGE_MAP[l.stage || 'lead'] || STAGES[0];
    var setter = l.assignedTo || '';
    var setterLabel = setter === 'guillaume' ? 'Guillaume' : (setter === 'elodie' ? 'Élodie' : '—');
    var typeKey = l.type || 'vsl_elite';
    var typeLabel = LEAD_TYPES[typeKey] || typeKey;
    var typeBadge = TYPE_BADGE[typeKey] || 'other';

    h += '<tr data-id="' + l.id + '">';
    h += '<td style="font-family:var(--fh);font-weight:700">' + esc(l.nom || '—') + '</td>';
    h += '<td style="font-family:var(--fm);color:var(--muted)">' + esc(l.telephone || '') + '</td>';
    h += '<td style="color:var(--muted)">' + esc(l.email || '') + '</td>';
    h += '<td><span class="list-stage-badge" style="background:' + st.color + '14;color:' + st.color + '"><span class="list-stage-dot" style="background:' + st.color + '"></span>' + esc(st.label) + '</span></td>';
    h += '<td><span class="list-setter-badge" style="background:' + (setter === 'guillaume' ? 'rgba(239,68,68,0.1);color:#fca5a5' : 'rgba(96,165,250,0.1);color:#93c5fd') + '">' + esc(setterLabel) + '</span></td>';
    h += '<td><span class="list-type-badge" style="background:' + (typeBadge === 'vsl' ? 'rgba(167,139,250,0.12);color:#c4b5fd' : 'rgba(245,158,11,0.12);color:#fcd34d') + '">' + typeLabel + '</span></td>';
    h += '<td style="color:var(--muted)">' + esc(l.utm || '') + '</td>';
    h += '<td style="font-family:var(--fm);font-size:11px;color:var(--muted)">' + fmtDate(l.createdAt) + '</td>';
    h += '</tr>';
  });
  document.getElementById('listBody').innerHTML = h;
}

/* ── Sheet Render ── */
function renderSheet(leads) {
  var h = '';
  leads.forEach(function(l, idx) {
    h += '<tr data-sid="' + l.id + '">';
    SHEET_COLS.forEach(function(col) {
      if (col.key === '_num') {
        h += '<td class="sheet-row-num">' + (idx + 1) + '</td>';
      } else if (col.edit === 'select' && col.key === 'stage') {
        h += '<td><select class="sheet-cell-select" data-sf="stage">';
        STAGES.forEach(function(s) {
          h += '<option value="' + s.key + '"' + ((l.stage || 'lead') === s.key ? ' selected' : '') + '>' + esc(s.label) + '</option>';
        });
        h += '</select></td>';
      } else if (col.edit === 'select' && col.key === 'assignedTo') {
        h += '<td><select class="sheet-cell-select" data-sf="assignedTo">';
        h += '<option value="">—</option>';
        h += '<option value="guillaume"' + (l.assignedTo === 'guillaume' ? ' selected' : '') + '>Guillaume</option>';
        h += '<option value="elodie"' + (l.assignedTo === 'elodie' ? ' selected' : '') + '>Élodie</option>';
        h += '</select></td>';
      } else if (col.edit === 'select' && col.key === 'type') {
        h += '<td><select class="sheet-cell-select" data-sf="type">';
        h += '<option value="vsl_elite"' + (l.type === 'vsl_elite' ? ' selected' : '') + '>VSL</option>';
        h += '<option value="self_booking"' + (l.type === 'self_booking' ? ' selected' : '') + '>Self Booking</option>';
        h += '</select></td>';
      } else if (col.edit) {
        h += '<td><input class="sheet-cell" data-sf="' + col.key + '" value="' + escA(l[col.key] || '') + '" placeholder="—"/></td>';
      } else {
        h += '<td style="padding:5px 8px;font-size:11px;color:var(--muted)">' + esc(String(l[col.key] || '')) + '</td>';
      }
    });
    h += '</tr>';
  });
  document.getElementById('sheetBody').innerHTML = h;
}

/* ═══════════════════════════════
   SAVED VIEWS SYSTEM
   ═══════════════════════════════ */
function renderSavedViews(filter) {
  filter = (filter || '').toLowerCase();
  var hDef = '';
  hDef += '<div class="sv-section-label">Par défaut</div>';
  DEFAULT_VIEWS.forEach(function(v) {
    if (filter && v.name.toLowerCase().indexOf(filter) < 0) return;
    var cnt = countViewLeads(v);
    hDef += '<div class="sv-item' + (activeViewId === v.id ? ' active' : '') + '" data-svid="' + v.id + '">';
    hDef += '<span class="sv-item-icon">' + v.icon + '</span>';
    hDef += '<span class="sv-item-label">' + esc(v.name) + '</span>';
    hDef += '<span class="sv-item-count">' + cnt + '</span>';
    hDef += '</div>';
  });
  document.getElementById('svListDefault').innerHTML = hDef;

  var hCust = '';
  if (savedViews.length > 0) {
    hCust += '<div class="sv-section-label">Mes affichages</div>';
    savedViews.forEach(function(v) {
      if (filter && v.name.toLowerCase().indexOf(filter) < 0) return;
      var cnt = countViewLeads(v);
      hCust += '<div class="sv-item' + (activeViewId === v.id ? ' active' : '') + '" data-svid="' + v.id + '">';
      hCust += '<span class="sv-item-icon">📌</span>';
      hCust += '<span class="sv-item-label">' + esc(v.name) + '</span>';
      hCust += '<span class="sv-item-count">' + cnt + '</span>';
      hCust += '<button class="sv-item-del" data-svdel="' + v.id + '" title="Supprimer">✕</button>';
      hCust += '</div>';
    });
  }
  document.getElementById('svListCustom').innerHTML = hCust;
}

function countViewLeads(view) {
  var list = allLeads.slice();
  var vf = view.filters;
  if (vf.setter && vf.setter !== 'all') list = list.filter(function(l) { return l.assignedTo === vf.setter; });
  if (vf.stages && vf.stages.length > 0) list = list.filter(function(l) { return vf.stages.indexOf(l.stage || 'lead') >= 0; });
  if (vf.section && vf.section !== 'all') {
    var ss = STAGES.filter(function(s) { return s.section === vf.section; }).map(function(s) { return s.key; });
    list = list.filter(function(l) { return ss.indexOf(l.stage || 'lead') >= 0; });
  }
  return list.length;
}

function activateView(viewId) {
  activeViewId = viewId;
  var view = getActiveView();
  document.getElementById('svTriggerLabel').textContent = view.name;
  // Reset manual filters to match view
  filterSetter = (view.filters && view.filters.setter) || 'all';
  filterSection = (view.filters && view.filters.section) || 'all';
  // Update pill states
  document.querySelectorAll('.crm-filter-pill').forEach(function(p) {
    p.classList.toggle('active', p.dataset.setter === filterSetter);
  });
  document.querySelectorAll('.crm-section-pill').forEach(function(p) {
    p.classList.toggle('active', p.dataset.section === filterSection);
  });
  renderSavedViews();
  renderAll();
  closeSvDropdown();
}

});

/* ── View item clicks ── */
document.getElementById('svDropdown').addEventListener('click', function(e) {
  var del = e.target.closest('[data-svdel]');
  if (del) {
    e.stopPropagation();
    var vid = del.dataset.svdel;
    if (!confirm('Supprimer cet affichage ?')) return;
    db.collection('crm_views').doc(vid).delete().then(function() {
      toast('🗑 Affichage supprimé');
      savedViews = savedViews.filter(function(v) { return v.id !== vid; });
      if (activeViewId === vid) activateView('__all__');
      else renderSavedViews();
    });

  if (item) {
    activateView(item.dataset.svid);
  }
});

  var h = '';
  h += '<div class="cv-head"><div class="cv-title">Nouvel affichage</div><button class="cv-close" id="cvClose">✕</button></div>';
  h += '<div class="cv-body">';

  h += '</div>';
  h += '<div class="cv-label">Filtrer par section</div>';
  h += '<div class="cv-chips" id="cvSectionChips">';
  h += '<span class="cv-chip selected" data-cvsection="all">Tout</span>';
  h += '<span class="cv-chip" data-cvsection="Prospection">Prospection</span>';
  h += '<span class="cv-chip" data-cvsection="Closing">Closing</span>';
  h += '</div>';
  h += '<div class="cv-actions">';
  h += '<button class="cv-btn cv-btn-cancel" id="cvCancel">Annuler</button>';
  h += '<button class="cv-btn cv-btn-save" id="cvSave">Créer l\'affichage</button>';
  h += '</div></div>';

  document.getElementById('cvModal').innerHTML = h;
  document.getElementById('cvBackdrop').classList.add('open');

  // Events
  document.getElementById('cvClose').addEventListener('click', closeCreateView);
  document.getElementById('cvCancel').addEventListener('click', closeCreateView);
  document.getElementById('cvBackdrop').addEventListener('click', function(e) {
    if (e.target === this) closeCreateView();
  });

  // Stage chip toggle
  document.getElementById('cvStageChips').addEventListener('click', function(e) {
    var chip = e.target.closest('[data-cvstage]');
    if (chip) chip.classList.toggle('selected');
  });
  // Setter chips (single select)
  document.getElementById('cvSetterChips').addEventListener('click', function(e) {
    var chip = e.target.closest('[data-cvsetter]');
    if (chip) {
      this.querySelectorAll('.cv-chip').forEach(function(c) { c.classList.remove('selected'); });
      chip.classList.add('selected');
    }
  });
  // Section chips (single select)
  document.getElementById('cvSectionChips').addEventListener('click', function(e) {
    var chip = e.target.closest('[data-cvsection]');
    if (chip) {
      this.querySelectorAll('.cv-chip').forEach(function(c) { c.classList.remove('selected'); });
      chip.classList.add('selected');
    }
  });

  // Save
  document.getElementById('cvSave').addEventListener('click', function() {
    var name = document.getElementById('cvName').value.trim();
    if (!name) { toast('Donne un nom à l\'affichage'); return; }
    var stages = [];
    document.querySelectorAll('#cvStageChips .cv-chip.selected').forEach(function(c) {
      stages.push(c.dataset.cvstage);
    });
    var setter = 'all';
    var setterSel = document.querySelector('#cvSetterChips .cv-chip.selected');
    if (setterSel) setter = setterSel.dataset.cvsetter;
    var section = 'all';
    var sectionSel = document.querySelector('#cvSectionChips .cv-chip.selected');
    if (sectionSel) section = sectionSel.dataset.cvsection;

    var viewData = {
      name: name,
      filters: { stages: stages, setter: setter, section: section, search: '' },
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: firebase.auth().currentUser ? firebase.auth().currentUser.uid : 'anon'
    };
    db.collection('crm_views').add(viewData).then(function(ref) {
      viewData.id = ref.id;
      savedViews.push(viewData);
      toast('✅ Affichage "' + name + '" créé');
      closeCreateView();
      activateView(ref.id);
    }).catch(function(err) {
      toast('❌ ' + err.message);
    });
  });
}

function closeCreateView() {
  document.getElementById('cvBackdrop').classList.remove('open');
}

/* ── Load saved views from Firestore ── */
function loadSavedViews() {
  db.collection('crm_views').orderBy('createdAt', 'desc').onSnapshot(function(snap) {
    savedViews = [];
    snap.forEach(function(doc) {
      var d = doc.data();
      d.id = doc.id;
      savedViews.push(d);
    });
    renderSavedViews();
  }, function(err) {
    console.warn('[crm_views] listener error:', err);
  });
}

document.getElementById('crmBoard').addEventListener('dragstart', function(e) {
  var card = e.target.closest('.crm-card');
  if (!card) return;
  draggedLeadId = card.dataset.id;
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', draggedLeadId);
});

document.getElementById('crmBoard').addEventListener('dragend', function(e) {
  var card = e.target.closest('.crm-card');
  if (card) card.classList.remove('dragging');
  document.querySelectorAll('.crm-col-cards.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
  draggedLeadId = null;
});

document.getElementById('crmBoard').addEventListener('dragover', function(e) {
  var drop = e.target.closest('[data-drop]');
  if (drop) { e.preventDefault(); drop.classList.add('drag-over'); }
});

document.getElementById('crmBoard').addEventListener('dragleave', function(e) {
  var drop = e.target.closest('[data-drop]');
  if (drop) drop.classList.remove('drag-over');
});

document.getElementById('crmBoard').addEventListener('drop', function(e) {
  e.preventDefault();
  var drop = e.target.closest('[data-drop]');
  if (!drop || !draggedLeadId) return;
  drop.classList.remove('drag-over');

  var newStage = drop.dataset.drop;
  var leadId = draggedLeadId;
  draggedLeadId = null;

  for (var i = 0; i < allLeads.length; i++) {
    if (allLeads[i].id === leadId) { allLeads[i].stage = newStage; break; }
  }
  renderAll();

  var dragUpdates = { stage: newStage, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  var syncStatus = STAGE_TO_STATUS[newStage];
  if (syncStatus) dragUpdates.status = syncStatus;
  db.collection('leads').doc(leadId).update(dragUpdates).then(function() {
    var stageObj = STAGE_MAP[newStage];
    toast('→ ' + (stageObj ? stageObj.label : newStage));
  }).catch(function(err) { toast('❌ ' + err.message); });
});

   SHEET INLINE EDIT
   ═══════════════════════════════ */
var sheetSaveTimer = null;
document.getElementById('sheetBody').addEventListener('input', function(e) {
  var el = e.target.closest('[data-sf]');
  if (!el) return;
  var tr = el.closest('tr[data-sid]');
  if (!tr) return;
  if (sheetSaveTimer) clearTimeout(sheetSaveTimer);
  sheetSaveTimer = setTimeout(function() { saveSheetRow(tr); }, 1500);
});
document.getElementById('sheetBody').addEventListener('change', function(e) {
  var el = e.target.closest('[data-sf]');
  if (!el) return;
  var tr = el.closest('tr[data-sid]');
  if (tr) saveSheetRow(tr);
});

function saveSheetRow(tr) {
  var leadId = tr.dataset.sid;
  var updates = {};
  tr.querySelectorAll('[data-sf]').forEach(function(el) {
    updates[el.dataset.sf] = el.value.trim();
  });
  updates.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  // Sync status if stage changed
  if (updates.stage && STAGE_TO_STATUS[updates.stage]) {
    updates.status = STAGE_TO_STATUS[updates.stage];
  }
  // Update local
  for (var i = 0; i < allLeads.length; i++) {
    if (allLeads[i].id === leadId) {
      for (var k in updates) { if (k !== 'updatedAt') allLeads[i][k] = updates[k]; }
      break;
    }
  }
  db.collection('leads').doc(leadId).update(updates).then(function() {
    toast('✅ Sauvegardé');
  }).catch(function(err) { toast('❌ ' + err.message); });
}

var qvTimer = null;
var qvLeadId = null;

function openQuickView(leadId, anchor) {
  var lead = null;
  for (var i = 0; i < allLeads.length; i++) {
    if (allLeads[i].id === leadId) { lead = allLeads[i]; break; }
  }
  if (!lead) return;
  qvLeadId = leadId;

  var sc = lead.assignedTo === 'guillaume' ? '#ef4444' : '#60a5fa';
  var ini = (lead.nom || '?')[0].toUpperCase();

  var h = '';
  h += '<div class="qv-head">';
  h += '<div class="qv-av" style="background:linear-gradient(135deg,' + sc + ',' + sc + '88)">' + ini + '</div>';
  h += '<span class="qv-name">' + esc(lead.nom || '—') + '</span>';
  h += '<button class="qv-close" id="qvClose">✕</button>';
  h += '</div><div class="qv-body">';
  h += qvF('Nom', 'nom', lead.nom);
  h += qvF('Téléphone', 'telephone', lead.telephone);
  h += qvF('Email', 'email', lead.email);
  h += '<div class="qv-field"><span class="qv-field-label">Attribué</span><select class="qv-select" data-qf="assignedTo">';
  h += '<option value="guillaume"' + (lead.assignedTo === 'guillaume' ? ' selected' : '') + '>Guillaume</option>';
  h += '<option value="elodie"' + (lead.assignedTo === 'elodie' ? ' selected' : '') + '>Élodie</option>';
  h += '</select></div>';
  h += '<div class="qv-sep"></div>';
  h += qvF('Source', 'utm', lead.utm);
  h += qvF('Secteur', 'secteur', lead.secteur);
  h += qvF('CA actuel', 'ca', lead.ca);
  h += qvF('Défi', 'defi', lead.defi);
  h += '<div class="qv-sep"></div>';
  h += qvF('Closeur', 'closeur', lead.closeur);
  h += qvF('Setting', 'setting', lead.setting);
  h += '<div class="qv-saved" id="qvSaved">✅ Sauvegardé</div>';
  h += '<a class="qv-link" href="sales-contact.html?id=' + leadId + '">↗ Ouvrir la fiche complète</a>';
  h += '</div>';

  var panel = document.getElementById('qvPanel');
  panel.innerHTML = h;
  var rect = anchor.getBoundingClientRect();
  var left = rect.right + 8;
  if (left + 320 > window.innerWidth) left = rect.left - 328;
  if (left < 8) left = 8;
  var top = rect.top - 20;
  if (top + 400 > window.innerHeight) top = window.innerHeight - 420;
  if (top < 8) top = 8;
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
  panel.style.display = '';
  document.getElementById('qvOverlay').classList.add('open');
  document.getElementById('qvClose').addEventListener('click', closeQV);
  document.getElementById('qvOverlay').addEventListener('click', closeQV);
  panel.addEventListener('input', function(e) {
    if (e.target.closest('[data-qf]')) { if (qvTimer) clearTimeout(qvTimer); qvTimer = setTimeout(saveQV, 2000); }
  });
  panel.addEventListener('change', function(e) { if (e.target.closest('[data-qf]')) saveQV(); });
}

function qvF(label, key, val) {
  return '<div class="qv-field"><span class="qv-field-label">' + esc(label) + '</span><input class="qv-field-input" data-qf="' + key + '" value="' + escA(val || '') + '" placeholder="—"/></div>';
}

function saveQV() {
  if (!qvLeadId) return;
  var panel = document.getElementById('qvPanel');
  var fields = ['nom','telephone','email','assignedTo','utm','secteur','ca','defi','closeur','setting'];
  var updates = {};
  fields.forEach(function(f) { var el = panel.querySelector('[data-qf="' + f + '"]'); if (el) updates[f] = el.value.trim(); });
  updates.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  for (var i = 0; i < allLeads.length; i++) {
    if (allLeads[i].id === qvLeadId) { for (var k in updates) { if (k !== 'updatedAt') allLeads[i][k] = updates[k]; } break; }
  }
  db.collection('leads').doc(qvLeadId).update(updates).then(function() {
    var msg = document.getElementById('qvSaved');
    if (msg) { msg.style.opacity = '1'; setTimeout(function() { msg.style.opacity = '0'; }, 1500); }
    renderAll();
  });
}

function closeQV() {
  document.getElementById('qvPanel').style.display = 'none';
  document.getElementById('qvOverlay').classList.remove('open');
  qvLeadId = null;
}

/* ═══════════════════════════════
   DETAIL MODAL
   ═══════════════════════════════ */
function openModal(leadId) {
  var lead = null;
  for (var i = 0; i < allLeads.length; i++) { if (allLeads[i].id === leadId) { lead = allLeads[i]; break; } }
  if (!lead) return;
  var stageObj = STAGE_MAP[lead.stage || 'lead'] || STAGES[0];
  var sc = lead.assignedTo === 'guillaume' ? '#ef4444' : '#60a5fa';
  var ini = (lead.nom || '?')[0].toUpperCase();

  var h = '';
  h += '<div class="crm-modal-head">';
  h += '<div class="crm-modal-av" style="background:linear-gradient(135deg,' + sc + ',' + sc + '88)">' + ini + '</div>';
  h += '<div class="crm-modal-name">' + esc(lead.nom || '—') + '</div>';
  h += '<a href="sales-contact.html?id=' + leadId + '" style="padding:6px 12px;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap">↗ Fiche</a>';
  h += '<button class="crm-modal-close" data-action="closeModal">✕</button>';
  h += '</div><div class="crm-modal-body">';

  h += '<div class="crm-modal-section">';
  h += '<div class="crm-modal-stitle">📋 Informations</div>';
  h += modalField('Nom', 'nom', lead.nom);
  h += modalField('Téléphone', 'telephone', lead.telephone);
  h += modalField('Email', 'email', lead.email);
  h += modalField('Source', 'utm', lead.utm);
  h += '<div class="crm-modal-field"><span class="crm-modal-field-label">Attribué à</span><select class="crm-modal-select" data-medit="assignedTo">';
  h += '<option value="guillaume"' + (lead.assignedTo === 'guillaume' ? ' selected' : '') + '>Guillaume Bilcke</option>';
  h += '<option value="elodie"' + (lead.assignedTo === 'elodie' ? ' selected' : '') + '>Élodie Vidotto Siarri</option>';
  h += '</select></div>';
  h += '<div class="crm-modal-field"><span class="crm-modal-field-label">Type</span><select class="crm-modal-select" data-medit="type">';
  h += '<option value="vsl_elite"' + (lead.type === 'vsl_elite' ? ' selected' : '') + '>VSL ÉLITE</option>';
  h += '<option value="self_booking"' + (lead.type === 'self_booking' ? ' selected' : '') + '>Self Booking</option>';
  h += '</select></div>';
  h += modalField('Secteur', 'secteur', lead.secteur);
  h += modalField('CA actuel', 'ca', lead.ca);
  h += modalField('Défi', 'defi', lead.defi);
  h += '<div class="crm-modal-saved" id="modalSaved">✅ Sauvegardé</div>';
  h += '</div>';

  h += '<div class="crm-modal-section">';
  h += '<div class="crm-modal-stitle">🔀 Étape pipeline</div>';
  h += '<div class="crm-stage-pills">';
  STAGES.forEach(function(s) {
    var isA = (lead.stage || 'lead') === s.key;
    h += '<span class="crm-stage-pill' + (isA ? ' active' : '') + '" data-action="setStage" data-stage="' + s.key + '" style="' + (isA ? 'color:' + s.color + ';border-color:' + s.color + ';background:' + s.color + '18' : '') + '">' + esc(s.label) + '</span>';
  });
  h += '</div></div>';

  h += '<div class="crm-modal-section">';
  h += '<div class="crm-modal-stitle">📝 Notes</div>';
  var notes = lead.notesHistory || [];
  for (var ni = notes.length - 1; ni >= 0; ni--) {
    h += '<div class="crm-note-item"><div class="crm-note-date">' + esc(notes[ni].date || '') + '</div><div class="crm-note-text">' + esc(notes[ni].text || '') + '</div></div>';
  }
  h += '<div class="crm-note-add-row"><textarea class="crm-note-input" id="modalNoteInput" placeholder="Ajouter une note..."></textarea>';
  h += '<button class="crm-note-add-btn" data-action="addNote">+ Ajouter</button></div></div>';

  h += '<div class="crm-modal-section">';
  if (lead.telephone) h += '<a href="tel:' + lead.telephone.replace(/\s/g, '') + '" style="display:block;text-align:center;padding:10px;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2);border-radius:10px;color:#34d399;font-weight:700;font-size:13px;text-decoration:none;margin-bottom:8px">📞 Appeler</a>';
  if (lead.email) h += '<a href="mailto:' + escA(lead.email) + '" style="display:block;text-align:center;padding:10px;background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.2);border-radius:10px;color:#60a5fa;font-weight:700;font-size:13px;text-decoration:none">✉️ Email</a>';
  h += '</div></div>';

  document.getElementById('modalPanel').innerHTML = h;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalBg')._leadId = leadId;
}

function modalField(label, key, val) {
  return '<div class="crm-modal-field"><span class="crm-modal-field-label">' + esc(label) + '</span><input class="crm-modal-input" data-medit="' + key + '" value="' + escA(val || '') + '"/></div>';
}

/* ── Modal Events ── */
document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
  if (e.target.closest('[data-action="closeModal"]')) this.classList.remove('open');

  var stagePill = e.target.closest('[data-action="setStage"]');
  if (stagePill) {
    var newStage = stagePill.dataset.stage;
    var leadId = this._leadId;
    for (var i = 0; i < allLeads.length; i++) {
      if (allLeads[i].id === leadId) { allLeads[i].stage = newStage; break; }
    }
    document.querySelectorAll('.crm-stage-pill').forEach(function(p) { p.classList.remove('active'); p.style.color=''; p.style.borderColor=''; p.style.background=''; });
    stagePill.classList.add('active');
    var sObj = STAGE_MAP[newStage];
    if (sObj) { stagePill.style.color=sObj.color; stagePill.style.borderColor=sObj.color; stagePill.style.background=sObj.color+'18'; }
    renderAll();
    var upd = { stage: newStage, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (STAGE_TO_STATUS[newStage]) upd.status = STAGE_TO_STATUS[newStage];
    db.collection('leads').doc(leadId).update(upd).then(function() { toast('→ ' + (sObj ? sObj.label : newStage)); });
  }

  var noteBtn = e.target.closest('[data-action="addNote"]');
  if (noteBtn) {
    var input = document.getElementById('modalNoteInput');
    var text = input ? input.value.trim() : '';
    if (!text) return;
    var lid = this._leadId;
    var newNote = { text: text, date: fmtNow() };
    for (var j = 0; j < allLeads.length; j++) {
      if (allLeads[j].id === lid) {
        if (!allLeads[j].notesHistory) allLeads[j].notesHistory = [];
        allLeads[j].notesHistory.push(newNote);
        db.collection('leads').doc(lid).update({
          notesHistory: allLeads[j].notesHistory,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() { toast('✅ Note ajoutée'); });
        break;
      }
    }
    openModal(lid);
  }
});

/* Auto-save modal fields */
var modalSaveTimer = null;
document.getElementById('modalBg').addEventListener('input', function(e) {
  var el = e.target.closest('[data-medit]');
  if (!el) return;
  if (modalSaveTimer) clearTimeout(modalSaveTimer);
  modalSaveTimer = setTimeout(function() { saveModalFields(); }, 2000);
});
document.getElementById('modalBg').addEventListener('change', function(e) {
  if (e.target.closest('[data-medit]')) saveModalFields();
});

function saveModalFields() {
  var leadId = document.getElementById('modalBg')._leadId;
  if (!leadId) return;
  var panel = document.getElementById('modalPanel');
  var fields = ['nom','telephone','email','utm','assignedTo','type','secteur','ca','defi'];
  var updates = {};
  fields.forEach(function(f) { var inp = panel.querySelector('[data-medit="' + f + '"]'); if (inp) updates[f] = inp.value.trim(); });
  updates.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  for (var i = 0; i < allLeads.length; i++) {
    if (allLeads[i].id === leadId) { for (var k in updates) { if (k !== 'updatedAt') allLeads[i][k] = updates[k]; } break; }
  }
  db.collection('leads').doc(leadId).update(updates).then(function() {
    var msg = document.getElementById('modalSaved');
    if (msg) { msg.style.opacity='1'; setTimeout(function() { msg.style.opacity='0'; }, 1500); }
    renderAll();
  });
}

/* ═══════════════════════════════
   SEARCH & FILTER
   ═══════════════════════════════ */
document.getElementById('crmSearch').addEventListener('input', function() {
  searchQuery = this.value.trim();
  renderAll();
});

document.querySelectorAll('.crm-filter-pill').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.crm-filter-pill').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    filterSetter = btn.dataset.setter;
    // Reset to custom (no saved view setter override)
    if (activeViewId !== '__all__') {
      var view = getActiveView();
      if (view && view.filters && view.filters.setter !== filterSetter) {
        activeViewId = '__all__';
        document.getElementById('svTriggerLabel').textContent = 'Toutes les Affaires';
        renderSavedViews();
      }
    }
    renderAll();
  });
});

document.querySelectorAll('.crm-section-pill').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.crm-section-pill').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    filterSection = btn.dataset.section;
    renderAll();
  });
});

/* ═══════════════════════════════
   ADD NEW LEAD
   ═══════════════════════════════ */
document.getElementById('crmAddBtn').addEventListener('click', function() {
  var nom = prompt('Nom du lead :');
  if (!nom || !nom.trim()) return;
  var tel = prompt('Téléphone :') || '';
  var email = prompt('Email :') || '';
  db.collection('leads').add({
    nom: nom.trim(), telephone: tel.trim(), email: email.trim(),
    type: 'vsl_elite', stage: 'lead', status: 'nouveau',
    assignedTo: '', notesHistory: [],
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() { toast('✅ Lead ajouté'); })
    .catch(function(err) { toast('❌ ' + err.message); });
});

/* ═══════════════════════════════
   FIRESTORE LISTENER
   ═══════════════════════════════ */
db.collection('leads')
  .orderBy('createdAt', 'desc')
  .onSnapshot(function(snap) {
    allLeads = [];
    snap.forEach(function(doc) {
      var d = doc.data();
      d.id = doc.id;
      if (!d.stage) d.stage = 'lead';
      allLeads.push(d);
    });
    renderAll();
    renderSavedViews();
  }, function(err) {
    console.error('[crm] listener error:', err);
  });

/* ═══════════════════════════════
   AUTH + INIT
   ═══════════════════════════════ */
firebase.auth().onAuthStateChanged(function(user) {
  if (user) {
    db.collection('users').doc(user.uid).get().then(function(snap) {
      var data = snap.exists ? snap.data() : {};
      window._currentRole = data.role || 'sales';
      window._currentUserName = user.displayName || user.email.split('@')[0];
      localStorage.setItem('ambitio_role', data.role || 'sales');
      localStorage.setItem('ambitio_name', window._currentUserName);
    });
    loadSavedViews();
  }
});
</script>
