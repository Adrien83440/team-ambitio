<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Ambitio — CRM Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>if(!firebase.apps.length){firebase.initializeApp({apiKey:"AIzaSyDo30FASeWnhvx4mYWYungKOu4AMhyJz6o",authDomain:"ambitio-team.firebaseapp.com",projectId:"ambitio-team",storageBucket:"ambitio-team.firebasestorage.app",messagingSenderId:"1079366902268",appId:"1:1079366902268:web:b4ec1691dba54230339279"}); /* Firestore: auto-detect long-polling (corrige les blocages de connexion intermittents sous Safari) */ try { firebase.firestore().settings({ experimentalAutoDetectLongPolling: true }); } catch (e) { if (window.console) console.warn('[firestore] settings non appliques:', e && e.message); }}</script>
<link rel="stylesheet" href="sales-crm.css"/>
</head>
<body style="display:flex;flex-direction:column;height:100vh" data-crm-view="pipeline">

<!-- ═══ EN-TÊTE : titre · vue · recherche · stats · mode d'affichage · actions ═══ -->
<div class="crm-header">
  <div class="crm-logo">A</div>
  <div class="crm-title">Pipeline</div>
  <div class="sv-wrapper" id="svWrapper">
    <div class="sv-trigger" id="svTrigger"><span class="sv-trigger-ico">📋</span> <span id="svTriggerLabel">Toutes les Affaires</span> <span class="sv-count" id="svTriggerCount">—</span> <span class="sv-trigger-caret">▼</span></div>
    <div class="sv-dropdown" id="svDropdown"><div class="sv-search-wrap"><input class="sv-search-input" id="svSearchInput" placeholder="Rechercher des affichages"/></div><div id="svListDefault"></div><div id="svListCustom"></div><button class="sv-create-btn" id="svCreateBtn">+ Créer l'affichage</button></div>
  </div>
  <div class="crm-search-wrap" id="crmSearchWrap">
    <span class="crm-search-ico">⌕</span>
    <input class="crm-search" id="crmSearch" placeholder="Nom, tél, email, secteur, source, @insta…" title="Recherche : nom, téléphone (chiffres seuls acceptés), email, secteur, source, pseudo Instagram — raccourci : /" autocomplete="off"/>
    <button class="crm-search-clear" id="crmSearchClear" title="Effacer la recherche">✕</button>
  </div>
  <!-- Mobile uniquement : ouvre la feuille de filtres -->
  <button class="fb-mobile-btn" id="fbMobileBtn">Filtres <span class="fb-mobile-count" id="fbMobileCount" style="display:none">0</span></button>
  <div class="crm-stats"><div class="crm-stat"><div class="crm-stat-val" id="statTotal">—</div><div class="crm-stat-label">Total</div></div><div class="crm-stat"><div class="crm-stat-val" style="color:var(--green)" id="statWon">—</div><div class="crm-stat-label">Won</div></div><div class="crm-stat"><div class="crm-stat-val" style="color:var(--red3)" id="statLost">—</div><div class="crm-stat-label">Lost</div></div></div>
  <div class="view-toggle"><button class="view-btn active" data-view="pipeline" title="Pipeline">▥</button><button class="view-btn" data-view="list" title="Liste">☰</button><button class="view-btn" data-view="sheet" title="Feuille">▦</button></div>
  <a class="crm-clients-btn" href="sales-clients.html">👥 <span class="crm-txt-lbl">Clients actifs</span> <span class="crm-clients-count" id="crmClientsCount"></span></a>
  <button class="crm-add-btn" id="crmAddBtn">+ <span class="crm-txt-lbl">Nouveau lead</span></button>
  <button class="settings-gear" id="settingsGear" title="Paramètres">⚙</button>
</div>

<!-- ═══ BARRE DE FILTRES (desktop : une ligne · mobile : feuille ouverte par « Filtres ») ═══ -->
<div class="fb-backdrop" id="fbBackdrop"></div>
<div class="filter-bar" id="filterBar">
  <div class="fb-sheet-head"><span>Filtres &amp; tri</span><button class="fb-sheet-close" id="fbSheetClose">✕</button></div>
  <!-- Setter : roster dynamique + compteurs, rendu par renderSetterDD() -->
  <div class="fb-dd-wrapper" id="fbSetterWrapper">
    <div class="fb-dd-trigger" id="fbSetterTrigger">👤 Setter <span class="fb-dd-caret">▼</span></div>
    <div class="fb-dd-menu" id="fbSetterDD"></div>
  </div>
  <div class="fb-seg" id="fbSectionSeg"><button class="crm-section-pill active" data-section="all">Tout</button><button class="crm-section-pill" data-section="Prospection">Prospection</button><button class="crm-section-pill" data-section="Closing">Closing</button></div>
  <div class="fb-sep"></div>
  <!-- Période : pilote la requête Firestore (createdAt >= borne basse) ET le filtre en mémoire sur la date réelle. -->
  <div class="fb-dd-wrapper" id="fbDateWrapper">
    <div class="fb-dd-trigger" id="fbDateTrigger">📅 Période <span class="fb-dd-caret">▼</span></div>
    <div class="fb-dd-menu" id="fbDateDD"></div>
  </div>
  <div class="fb-dd-wrapper" id="fbStatusWrapper">
    <div class="fb-dd-trigger" id="fbStatusTrigger">📞 Statut <span class="fb-dd-caret">▼</span></div>
    <div class="fb-dd-menu" id="fbStatusDD"></div>
  </div>
  <div class="fb-dd-wrapper" id="fbContactWrapper">
    <div class="fb-dd-trigger" id="fbContactTrigger">⏱ Dernier contact <span class="fb-dd-caret">▼</span></div>
    <div class="fb-dd-menu" id="fbContactDD"></div>
  </div>
  <div class="fb-dd-wrapper" id="fbTagWrapper">
    <div class="fb-dd-trigger" id="fbTagTrigger">🏷 Tags <span class="fb-dd-caret">▼</span></div>
    <div class="fb-tag-dd" id="fbTagDD"></div>
  </div>
  <div class="fb-dd-wrapper" id="fbTypeWrapper">
    <div class="fb-dd-trigger" id="fbTypeTrigger">📦 Type <span class="fb-dd-caret">▼</span></div>
    <div class="fb-dd-menu" id="fbTypeDD"></div>
  </div>
  <div class="fb-dd-wrapper" id="fbMoreWrapper">
    <div class="fb-dd-trigger" id="fbMoreTrigger">➕ Plus <span class="fb-dd-caret">▼</span></div>
    <div class="fb-dd-menu" id="fbMoreDD"></div>
  </div>
  <div class="fb-spacer"></div>
  <div class="sort-wrapper" id="sortWrapper"><span class="sort-label">Tri</span><div class="sort-trigger" id="sortTrigger"><span id="sortTriggerLabel">Date réelle</span> <span style="font-size:9px">▼</span></div><div class="sort-dd" id="sortDD"></div><button class="sort-dir-btn" id="sortDirBtn" title="Inverser le tri">↓</button></div>
  <button class="colcfg-btn" id="colcfgBtn" title="Champs et colonnes affichés">⚙</button>
  <button class="fb-sheet-apply" id="fbSheetApply">Voir les leads</button>
</div>

<!-- ═══ BARRE DE RÉSULTATS : visible dès qu'un filtre, une vue ou une recherche restreint la liste ═══ -->
<div class="crm-result-bar" id="crmResultBar">
  <span class="crm-result-count" id="crmResultCount"></span>
  <div class="fb-active-chips" id="fbActiveChips"></div>
  <button class="crm-result-toggle" id="crmEmptyColsToggle" title="Afficher ou replier les colonnes sans résultat"></button>
  <button class="fb-clear-all" id="fbClearAll">Tout effacer</button>
</div>
<div class="crm-limit-banner" id="crmLimitBanner" style="display:none"></div>
<!-- Mobile : navigation rapide entre les étapes du kanban -->
<div class="crm-stage-strip" id="crmStageStrip"></div>

<div class="crm-views-container">
  <div class="crm-empty" id="crmEmpty"><div class="crm-empty-ico">🔍</div><div class="crm-empty-title">Aucun lead ne correspond</div><div class="crm-empty-sub" id="crmEmptySub"></div><button class="crm-empty-btn" id="crmEmptyClear">Tout effacer</button></div>
  <div class="crm-view active" id="viewPipeline"><div class="crm-board" id="crmBoard"></div></div><div class="crm-view list-view" id="viewList"><div class="list-table-wrap"><table class="list-table" id="listTable"><thead><tr id="listHead"></tr></thead><tbody id="listBody"></tbody></table></div><div class="pagi-bar" id="pagiList"></div></div><div class="crm-view sheet-view" id="viewSheet"><div class="sheet-table-wrap"><table class="sheet-table" id="sheetTable"><thead><tr id="sheetHead"></tr></thead><tbody id="sheetBody"></tbody></table></div><div class="pagi-bar" id="pagiSheet"></div></div></div>
<div class="bulk-bar" id="bulkBar"><span class="bulk-count" id="bulkCount">0 sélectionnés</span><div style="position:relative"><button class="bulk-btn" id="bulkStageBtn">🔀 Changer étape</button><div class="bulk-stage-dropdown" id="bulkStageDD"></div></div><button class="bulk-btn" id="bulkSetterBtn">⭐ Changer setter</button><button class="bulk-btn" id="bulkTagBtn" style="border-color:rgba(167,139,250,0.25);background:rgba(167,139,250,0.08);color:#c4b5fd">🏷 Ajouter tag</button><button class="bulk-btn danger" id="bulkDeleteBtn">🗑 Supprimer</button><button class="bulk-deselect" id="bulkDeselect">✕ Désélectionner tout</button></div>
<div class="crm-modal-bg" id="modalBg"><div class="crm-modal" id="modalPanel"></div></div>
<div class="qv-overlay" id="qvOverlay"></div><div class="qv-panel" id="qvPanel" style="display:none"></div>
<div class="cv-backdrop" id="cvBackdrop"><div class="cv-modal" id="cvModal"></div></div>
<div class="colcfg-panel" id="colcfgPanel"></div>
<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-panel" id="settingsPanel"></div>
<div class="crm-toast" id="crmToast"></div>
<script src="dialer-bridge.js" defer></script>
<link rel="stylesheet" href="call-detail-modal.css">
<script src="call-detail-modal.js" defer></script>
<script src="alteore-flow.js"></script>
<script src="close-wizard.js"></script>
<script src="sales-crm-app.js"></script>
<script src="nav.js"></script>
</body>
</html>
