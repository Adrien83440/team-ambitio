<!-- Labo Pipeline (21/10/2026) : le NOUVEAU Pipeline (pipeline-v2.js) sur de

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
html,body{margin:0;background:#eceff8}

.sbxpl-band button{border:0;border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.14);color:#fff;font:inherit;cursor:pointer}
.sbxpl-band button:hover{background:rgba(255,255,255,.24)}
</style>
