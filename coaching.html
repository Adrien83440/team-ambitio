<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Ambitio Team — Espace Coaching</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;450;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --blue-dark:#0f1f5c;--blue-main:#1a3dce;--blue-light:#4f7ef8;--blue-ghost:#f0f4ff;
      --text:#1a1f36;--muted:#6b7280;--border:#e2e8f0;--bg:#f5f7ff;--radius:14px;
      --green:#10b981;--green-light:#d1fae5;--orange:#f59e0b;--orange-light:#fef3c7;
      --red:#ef4444;--red-light:#fee2e2;--purple:#6366f1;--purple-light:#eef2ff;--teal:#14b8a6;
    }
    /* ═══════════════════════════════════════════════════════════
     * REFONTE 2026-04-16 — Editorial minimalism
     * Nouveaux tokens ajoutés SANS casser les anciens (panel, modales...)
     * ═══════════════════════════════════════════════════════════ */
    :root{
      --bg-warm:        #f7f6f2;
      --bg-elev:        #ffffff;
      --bg-soft:        #fafaf7;
      --ink:            #0b0d17;
      --ink-soft:       #2b2f3e;
      --ink-muted:      #6b7088;
      --ink-muted-2:    #9b9fb0;
      --hair:           #e8e4da;
      --hair-2:         #efeadd;
      --accent-ink:     #1a3dce;
      --accent-soft-2:  #eff2ff;
      --red-2:          #c2410c;
      --red-soft-2:     #fdf4ed;
      --amber-2:        #a16207;
      --amber-soft-2:   #fef7e6;
      --green-2:        #15803d;
      --green-soft-2:   #f0f7f1;
      --slate:          #475569;
      --slate-soft-2:   #f1f2f4;
      --prog-1:         #1a3dce;
      --prog-2:         #0891b2;
      --prog-3:         #7c3aed;
      --prog-4:         #a16207;
      --prog-5:         #15803d;
      --shadow-s:       0 1px 2px rgba(11,13,23,.04);
      --shadow-m:       0 2px 8px rgba(11,13,23,.06), 0 1px 2px rgba(11,13,23,.04);
      --shadow-l:       0 12px 40px rgba(11,13,23,.08), 0 2px 8px rgba(11,13,23,.04);
    }
    body{
      background: var(--bg-warm);
      color: var(--ink);
      font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "ss01", "cv11";
    }
    body::before{
      content:''; position: fixed; inset: 0;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(26,61,206,.04), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(194,65,12,.03), transparent 50%);
      pointer-events: none; z-index: 0;
    }
    .ambitio-v2 { position: relative; z-index: 1; }

    /* ── TOPBAR ── */
    .topbar{
      position: sticky; top: 0; z-index: 50;
      background: rgba(247,246,242,.85);
      backdrop-filter: saturate(1.4) blur(18px);
      -webkit-backdrop-filter: saturate(1.4) blur(18px);
      border-bottom: 1px solid var(--hair);
      padding: 14px 32px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: none;
    }
    .topbar-left{display:flex;align-items:center;gap:16px}
    .topbar-logo{
      width:36px;height:36px;
      background: var(--ink);
      border-radius:10px;display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:700;font-size:14px;
      font-family:'Fraunces',serif;
      letter-spacing:-0.5px;
      box-shadow: var(--shadow-s);
    }
    .topbar-left h1{
      font-family:'Fraunces',serif;
      font-size:22px;font-weight:600;
      letter-spacing:-0.6px;line-height:1;
    }
    .topbar-left h1 span{
      font-style: italic; color: var(--accent-ink); font-weight: 500;
    }
    .topbar-sub{font-size:11.5px;color:var(--ink-muted);margin-top:3px;letter-spacing:.1px}
    .topbar-right{display:flex;align-items:center;gap:10px}

    /* Boutons — on redéfinit proprement */
    .btn{
      padding:9px 16px;border:none;border-radius:10px;
      font-family:inherit;font-size:13px;font-weight:550;
      cursor:pointer;transition:all .16s ease;
      display:inline-flex;align-items:center;gap:7px;
      letter-spacing:-0.1px;
    }
    .btn-primary{
      background: var(--ink); color: white;
      box-shadow: var(--shadow-s);
    }
    .btn-primary:hover{ background: var(--ink-soft); transform: translateY(-1px); box-shadow: var(--shadow-m); }
    .btn-outline{
      background: var(--bg-elev); color: var(--ink-soft);
      border: 1px solid var(--hair);
    }
    .btn-outline:hover{ border-color: var(--ink); background: var(--bg-warm); }
    .btn-danger{
      background: #fef2f2; color: var(--red-2);
      border: 1px solid #fecaca;
    }
    .btn-danger:hover{ background: #fee2e2; }
    .btn-green{
      background: var(--green-2); color: white;
      box-shadow: 0 1px 2px rgba(21,128,61,.15);
    }
    .btn-green:hover{ background: #166534; transform: translateY(-1px); }
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
    .btn-xs{padding:4px 8px;font-size:11px;border-radius:6px}

    .user-badge{
      display:flex;align-items:center;gap:9px;
      padding:6px 12px 6px 6px;
      background: var(--bg-elev);
      border: 1px solid var(--hair);
      border-radius:28px;
    }
    .user-avatar{
      width:28px;height:28px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent-ink),#7c3aed);
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:600;color:#fff;
    }
    .user-badge-name{font-size:12px;font-weight:600}
    .user-badge-role{font-size:10.5px;color:var(--ink-muted)}

    /* ── HERO (mois + stats inline) ── */
    .hero{padding:28px 32px 20px}
    .hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
    .month-nav{display:flex;align-items:center;gap:14px}
    .month-btn{
      width:32px;height:32px;border-radius:10px;
      border:1px solid var(--hair);background:var(--bg-elev);
      cursor:pointer;color:var(--ink-soft);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;transition:all .15s;
      font-family:inherit;
    }
    .month-btn:hover{border-color:var(--ink);background:var(--ink);color:white}
    .month-label{
      font-family:'Fraunces',serif;
      font-size:28px;font-weight:500;letter-spacing:-0.8px;
      line-height:1;
    }
    .month-label-year{color:var(--ink-muted);font-weight:400}
    .month-today{
      font-size:11px;color:var(--ink-muted);
      padding:4px 10px;border-radius:20px;background:var(--bg-elev);
      border:1px solid var(--hair);
      cursor:pointer;transition:all .15s;
      margin-left:4px;font-weight:500;
      font-family:inherit;
    }
    .month-today:hover{color:var(--accent-ink);border-color:var(--accent-ink)}
    .stats-inline{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
    .stat-pill{display:flex;align-items:baseline;gap:6px}
    .stat-val{
      font-family:'Fraunces',serif;
      font-size:22px;font-weight:600;
      letter-spacing:-0.5px;line-height:1;
      font-variant-numeric: tabular-nums;
    }
    .stat-val.ok{color:var(--green-2)}
    .stat-val.warn{color:var(--amber-2)}
    .stat-val.alert{color:var(--red-2)}
    .stat-lbl{font-size:11.5px;color:var(--ink-muted);font-weight:450}

    /* ── STATUS TABS (underline minimaliste) ── */
    .status-tabs{
      padding: 0 32px 16px;
      display: flex; gap: 2px; flex-wrap: wrap;
      border-bottom: 1px solid var(--hair);
      margin-bottom: 16px;
    }
    .status-tab{
      padding: 10px 14px;
      border: none; background: transparent;
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      color: var(--ink-muted); cursor: pointer;
      transition: all .15s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      display: inline-flex; align-items: center; gap: 8px;
      letter-spacing: -0.1px;
    }
    .status-tab:hover{color:var(--ink-soft)}
    .status-tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
    .status-tab .st-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
    .status-tab .st-count{
      font-family:'Fraunces',serif;
      font-size:12px;font-weight:500;
      font-variant-numeric:tabular-nums;
      color:var(--ink-muted-2);
    }
    .status-tab.active .st-count{color:var(--ink-soft)}

    /* ── CONTROLS (search + selects + toggle) ── */
    .controls{padding:0 32px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .search{flex:1;min-width:260px;max-width:420px;position:relative}
    .search input{
      width:100%;padding:10px 14px 10px 38px;
      background:var(--bg-elev);
      border:1px solid var(--hair);border-radius:10px;
      font-family:inherit;font-size:13px;color:var(--ink);
      outline:none;transition:all .15s;
    }
    .search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(11,13,23,.05)}
    .search input::placeholder{color:var(--ink-muted-2)}
    .search-icon{
      position:absolute;left:13px;top:50%;transform:translateY(-50%);
      color:var(--ink-muted-2);font-size:14px;pointer-events:none;
    }
    .select-ambitio{
      padding:9px 32px 9px 12px;
      background:var(--bg-elev);
      border:1px solid var(--hair);border-radius:10px;
      font-family:inherit;font-size:12.5px;font-weight:500;
      color:var(--ink-soft);cursor:pointer;
      appearance:none;-webkit-appearance:none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1L5 5L9 1' stroke='%236b7088' stroke-width='1.5' stroke-linecap='round'/></svg>");
      background-repeat:no-repeat;background-position:right 12px center;
      transition:all .15s;
    }
    .select-ambitio:hover{border-color:var(--ink-muted-2)}
    .select-ambitio:focus{outline:none;border-color:var(--ink)}

    .view-toggle{
      display:flex;background:var(--bg-elev);
      border:1px solid var(--hair);
      border-radius:10px;padding:3px;
      margin-left:auto;
    }
    .view-tab{
      padding:6px 14px;border:none;background:transparent;
      font-family:inherit;font-size:12px;font-weight:500;
      color:var(--ink-muted);border-radius:7px;
      cursor:pointer;transition:all .15s;
      display:inline-flex;align-items:center;gap:5px;
    }
    .view-tab.active{
      background:var(--ink);color:white;
      box-shadow:var(--shadow-s);
    }

    /* ── RECENT STRIP ── */
    .recent-strip{
      padding:0 32px 16px;
      display:flex;align-items:center;gap:14px;
      overflow-x:auto;scrollbar-width:none;
    }
    .recent-strip::-webkit-scrollbar{display:none}
    .recent-label{
      font-size:10.5px;font-weight:600;color:var(--ink-muted);
      letter-spacing:1.2px;text-transform:uppercase;
      display:flex;align-items:center;gap:6px;
      white-space:nowrap;flex-shrink:0;
    }
    .recent-label::before{content:'';width:14px;height:1px;background:var(--ink-muted-2)}
    .ra-card{
      display:flex;align-items:center;gap:10px;
      padding:8px 14px 8px 8px;
      background:var(--bg-elev);
      border:1px solid var(--hair);
      border-radius:30px;
      cursor:pointer;transition:all .18s;
      flex-shrink:0;max-width:260px;
      white-space:normal;min-width:auto;
    }
    .ra-card:hover{
      border-color:var(--ink);transform:translateY(-1px);
      box-shadow:var(--shadow-m);
    }
    .ra-avatar{
      width:28px;height:28px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:11px;font-weight:600;
      flex-shrink:0;
    }
    .ra-info{min-width:0;line-height:1.2}
    .ra-name{
      font-size:12.5px;font-weight:600;letter-spacing:-0.2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .ra-meta{font-size:10.5px;color:var(--ink-muted);margin-top:1px}
    .ra-badge{display:none}
    .ra-section-label{display:none}

    /* ── KANBAN PAR PROGRAMME ── */
    .kanban-wrap{
      padding:0 24px 48px;
      overflow-x:auto;
    }
    .kanban{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:14px;
      align-items:flex-start;
      min-height:400px;
    }
    /* Colonnes toutes de même largeur */
    .kanban-col{
      background:var(--bg-soft);
      border:1px solid var(--hair);
      border-radius:18px;overflow:hidden;
      display:flex;flex-direction:column;
      max-height:calc(100vh - 340px);
      min-height:200px;
      min-width: 0; /* Permet à grid d'imposer la largeur */
    }
    /* Les classes weight-* sont conservées pour rétro-compat mais désactivées : grid gère tout */
    .kanban-col.weight-xs,
    .kanban-col.weight-s,
    .kanban-col.weight-m,
    .kanban-col.weight-l{
      flex-grow: unset;
      max-width: unset;
    }

    .kanban-col-head{
      padding:14px 16px 12px;
      border-bottom:1px solid var(--hair);
      background:var(--bg-elev);
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;
    }
    .col-title-wrap{display:flex;flex-direction:column;gap:3px;min-width:0}
    .col-title{
      display:flex;align-items:center;gap:9px;
      font-size:13px;font-weight:650;letter-spacing:-0.2px;
    }
    .col-prog-mark{
      width:3px;height:14px;border-radius:2px;flex-shrink:0;
      background:var(--ink-muted-2);
    }
    .kanban-col[data-prog="bp12-12"] .col-prog-mark{background:var(--prog-1)}
    .kanban-col[data-prog="bp12-24"] .col-prog-mark{background:var(--prog-2)}
    .kanban-col[data-prog="bp6"] .col-prog-mark{background:var(--prog-3)}
    .kanban-col[data-prog="elite"] .col-prog-mark{background:var(--prog-4)}
    .kanban-col[data-prog="custom"] .col-prog-mark{background:var(--prog-5)}
    .col-sub{
      font-size:10.5px;color:var(--ink-muted);
      font-weight:500;letter-spacing:.1px;
    }
    .col-count{
      font-family:'Fraunces',serif;
      font-size:18px;font-weight:500;
      color:var(--ink);font-variant-numeric:tabular-nums;
      line-height:1;flex-shrink:0;
    }
    .kanban-cards{
      padding:10px;overflow-y:auto;flex:1;
      display:flex;flex-direction:column;gap:8px;
    }
    .kanban-cards::-webkit-scrollbar{width:8px}
    .kanban-cards::-webkit-scrollbar-thumb{background:var(--hair);border-radius:4px}
    .kanban-cards::-webkit-scrollbar-thumb:hover{background:var(--ink-muted-2)}
    .col-empty{
      padding:32px 16px;text-align:center;
      color:var(--ink-muted-2);font-size:12px;font-style:italic;
    }

    /* ── CARTE CLIENT ── */
    .client-card{
      background:var(--bg-elev);
      border:1px solid var(--hair);
      border-radius:12px;
      padding:12px 14px;
      cursor:pointer;
      transition:all .18s ease;
      position:relative;
      display:flex;flex-direction:column;gap:10px;
      width: 100%;
    }
    .client-card:hover{
      border-color:var(--ink);
      transform:translateY(-1px);
      box-shadow:var(--shadow-m);
    }
    .client-card.inactive{opacity:.6;background:var(--bg-soft)}
    .client-card.inactive:hover{opacity:.9}
    .client-card::before{
      content:'';position:absolute;
      left:0;top:10px;bottom:10px;width:3px;
      border-radius:0 2px 2px 0;
      opacity:0;transition:opacity .18s;
    }
    .client-card.alert::before{background:var(--red-2);opacity:1}
    .client-card.warning::before{background:var(--amber-2);opacity:1}

    .cc-top{
      display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    }
    .cc-name{
      font-size:13.5px;font-weight:600;
      letter-spacing:-0.2px;line-height:1.25;
    }
    .cc-activite{
      font-size:11.5px;color:var(--ink-muted);
      margin-top:2px;font-weight:450;
    }
    .cc-coach{
      font-size:10.5px;font-weight:600;
      padding:3px 8px;border-radius:20px;
      background:var(--slate-soft-2);color:var(--slate);
      white-space:nowrap;flex-shrink:0;
      letter-spacing:.1px;
    }
    .cc-status-badge.inactive{
      font-size:10px;font-weight:600;
      padding:3px 8px;border-radius:20px;
      background:var(--slate-soft-2);color:var(--slate);
      white-space:nowrap;
    }

    .cc-progress{display:flex;align-items:center;gap:10px}
    .cc-progress-label{display:none} /* On replace par inline */
    .cc-bar{
      flex:1;height:5px;
      background:var(--hair-2);border-radius:3px;
      overflow:hidden;position:relative;
    }
    .cc-bar-fill{
      height:100%;border-radius:3px;
      background:var(--ink);
      transition:width .6s ease;
    }
    .cc-bar-fill.ok{background:var(--green-2)}
    .cc-bar-fill.warn{background:var(--amber-2)}
    .cc-bar-fill.alert{background:var(--red-2)}
    .cc-prog-text{
      font-family:'Fraunces',serif;
      font-size:13px;font-weight:500;
      color:var(--ink);font-variant-numeric:tabular-nums;
      letter-spacing:-0.3px;flex-shrink:0;
      white-space:nowrap;
    }
    .cc-prog-text .total{color:var(--ink-muted-2)}

    .cc-quota{
      font-size:10.5px;color:var(--ink-muted);font-weight:500;
      display:flex;align-items:center;gap:6px;
      padding:5px 0;
    }
    .cc-quota.ok{color:var(--green-2)}
    .cc-quota.partial{color:var(--amber-2)}
    .cc-quota.empty{color:var(--red-2)}
    .cc-quota.done{color:var(--ink-muted)}

    .cc-bottom,.cc-foot{
      display:flex;align-items:center;justify-content:space-between;
      gap:8px;padding-top:10px;
      border-top:1px dashed var(--hair);
    }
    .cc-date,.cc-last{
      font-size:10.5px;color:var(--ink-muted);
      font-weight:500;
      display:flex;flex-direction:column;align-items:flex-end;
      gap:2px;line-height:1.2;text-align:right;
    }
    .cc-last strong{color:var(--ink-soft);font-weight:600}
    .cc-last.alert strong{color:var(--red-2)}
    .cc-last.warn strong{color:var(--amber-2)}
    .cc-last-date{
      font-size:10px;color:var(--ink-muted-2);
      font-weight:500;font-variant-numeric:tabular-nums;
      letter-spacing:.1px;
    }
    .cc-last-date::before{content:'↳ ';opacity:.5}
    .cc-alert-badge,.cc-warn-badge{display:none}

    /* ── VUE LISTE ── */
    .list-view{padding:0 32px 48px;display:none}
    .list-view.active{display:block}
    .list-table{
      width:100%;
      background:var(--bg-elev);
      border:1px solid var(--hair);
      border-radius:16px;
      overflow:hidden;border-collapse:collapse;
    }
    .list-table th{
      padding:12px 18px;text-align:left;
      font-size:10.5px;font-weight:600;
      color:var(--ink-muted);text-transform:uppercase;
      letter-spacing:1px;
      background:var(--bg-soft);
      border-bottom:1px solid var(--hair);
    }
    .list-table td{
      padding:14px 18px;
      border-bottom:1px solid var(--hair-2);
      font-size:13px;vertical-align:middle;
    }
    .list-table tr{cursor:pointer;transition:background .1s}
    .list-table tbody tr:hover{background:var(--bg-soft)}
    .list-table tbody tr:last-child td{border-bottom:none}
    .list-table .name-cell{font-weight:600}
    .list-table .urg-dot{
      display:inline-block;width:6px;height:6px;border-radius:50%;
      margin-right:8px;vertical-align:middle;
    }
    .list-table .urg-dot.alert{background:var(--red-2)}
    .list-table .urg-dot.warn{background:var(--amber-2)}
    .list-table .urg-dot.ok{background:var(--green-2)}
    .list-table .urg-dot.inactive{background:var(--slate)}
    .progress-mini{width:60px;height:5px;background:var(--hair-2);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
    .progress-mini-fill{height:100%;border-radius:99px}
    .inactive-row{opacity:.55}
    .inactive-row:hover{opacity:.8}

    /* Animation staggered */
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .client-card{animation:fadeUp .35s ease both}
    .kanban-cards .client-card:nth-child(1){animation-delay:.02s}
    .kanban-cards .client-card:nth-child(2){animation-delay:.05s}
    .kanban-cards .client-card:nth-child(3){animation-delay:.08s}
    .kanban-cards .client-card:nth-child(4){animation-delay:.11s}
    .kanban-cards .client-card:nth-child(5){animation-delay:.14s}
    .kanban-cards .client-card:nth-child(n+6){animation-delay:.17s}

    /* Responsive kanban */
    @media (max-width:1300px){
      .kanban{grid-template-columns: repeat(4, minmax(260px, 1fr)); min-width: max-content;}
    }
    @media (max-width:900px){
      .kanban{grid-template-columns: repeat(2, 1fr); min-width: auto;}
    }
    @media (max-width:600px){
      .kanban{grid-template-columns: 1fr;}
    }
    @media (max-width:720px){
      .topbar{padding:12px 18px}
      .hero,.controls,.recent-strip,.status-tabs{padding-left:18px;padding-right:18px}
      .kanban-wrap{padding-left:18px;padding-right:18px}
      .hero-row{flex-direction:column;align-items:flex-start}
      .stats-inline{flex-wrap:wrap;gap:16px}
    }

    /* ── CLIENT DETAIL PANEL ── */
    /* Overrides d'harmonisation avec le nouveau design (ivoire + Fraunces).
       Ne touche pas à la logique, juste au look visible. */
    .detail-overlay{
      position:fixed;inset:0;
      background:rgba(11,13,23,.45);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      z-index:200;display:none;justify-content:flex-end;
    }
    .detail-overlay.show{display:flex}
    .detail-panel{
      width:720px;max-width:100vw;height:100vh;
      background:var(--bg-warm);
      overflow-y:auto;
      box-shadow:-12px 0 60px rgba(11,13,23,.18);
      animation:slideIn .28s ease;
    }
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    .dp-header{
      padding:24px 28px 20px;
      border-bottom:1px solid var(--hair);
      position:sticky;top:0;
      background:var(--bg-warm);
      z-index:5;
    }
    .dp-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
    .dp-close{
      width:36px;height:36px;
      border:1px solid var(--hair);border-radius:10px;
      background:var(--bg-elev);cursor:pointer;
      font-size:15px;
      display:flex;align-items:center;justify-content:center;
      transition:all .15s;color:var(--ink-soft);
    }
    .dp-close:hover{background:var(--ink);border-color:var(--ink);color:white}
    .dp-name{
      font-family:'Fraunces',serif;
      font-size:26px;font-weight:600;
      letter-spacing:-0.6px;line-height:1.15;
      color:var(--ink);
    }
    .dp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .dp-badge{
      font-size:11px;font-weight:550;
      padding:4px 11px;border-radius:20px;
      background:var(--bg-elev);
      color:var(--ink-soft);
      border:1px solid var(--hair);
      letter-spacing:.1px;
    }
    .dp-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .dp-info{
      padding:12px 14px;
      background:var(--bg-elev);
      border:1px solid var(--hair);
      border-radius:12px;
    }
    .dp-info-label{font-size:10px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;margin-bottom:3px;letter-spacing:.8px}
    .dp-info-val{font-size:13px;font-weight:600;color:var(--ink);font-family:'Inter',sans-serif}
    .dp-progress-section{padding:18px 28px;border-bottom:1px solid var(--hair);background:var(--bg-elev)}
    .dp-progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .dp-progress-title{font-size:13px;font-weight:600;color:var(--ink-soft);letter-spacing:-0.1px}
    .dp-progress-count{
      font-family:'Fraunces',serif;
      font-size:24px;font-weight:600;
      color:var(--ink);
      letter-spacing:-0.5px;
      font-variant-numeric:tabular-nums;
    }
    .dp-bar{height:6px;background:var(--hair-2);border-radius:99px;overflow:hidden}
    .dp-bar-fill{height:100%;border-radius:99px;transition:width .6s ease}
    .dp-alert-box{
      margin:14px 28px;padding:12px 16px;
      border-radius:12px;font-size:12px;font-weight:500;
      display:flex;align-items:center;gap:8px;
      border:1px solid;
    }
    .dp-alert-box.red{background:var(--red-soft-2);color:var(--red-2);border-color:#fed7aa}
    .dp-alert-box.orange{background:var(--amber-soft-2);color:var(--amber-2);border-color:#fcd34d}
    .dp-alert-box.green{background:var(--green-soft-2);color:var(--green-2);border-color:#bbf7d0}

    /* ── QUOTA DETAIL ── */
    .dp-quota-section{
      margin:14px 28px 0;padding:16px 18px;
      border-radius:14px;
      border:1px solid var(--hair);
      background:var(--bg-elev);
    }
    .dp-quota-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .dp-quota-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
    .dp-quota-badge{
      font-family:'Fraunces',serif;
      font-size:18px;font-weight:600;
      padding:4px 14px;border-radius:10px;
      letter-spacing:-0.3px;
      font-variant-numeric:tabular-nums;
    }
    .dp-quota-badge.ok{background:var(--green-soft-2);color:var(--green-2)}
    .dp-quota-badge.partial{background:var(--amber-soft-2);color:var(--amber-2)}
    .dp-quota-badge.empty{background:var(--red-soft-2);color:var(--red-2)}
    .dp-quota-badge.over{background:#f3e8ff;color:#7c3aed}
    .dp-quota-badge.done{background:var(--slate-soft-2);color:var(--slate)}
    .dp-quota-bar{height:6px;background:var(--hair-2);border-radius:99px;overflow:hidden;margin:8px 0}
    .dp-quota-bar-fill{height:100%;border-radius:99px;transition:width .4s}
    .dp-quota-sub{font-size:11px;color:var(--ink-muted)}
    .dp-quota-history{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
    .dp-quota-month{
      padding:4px 10px;border-radius:8px;
      font-size:11px;font-weight:500;
      border:1px solid var(--hair);
      font-variant-numeric:tabular-nums;
    }
    .dp-quota-month.ok{background:var(--green-soft-2);color:var(--green-2);border-color:#bbf7d0}
    .dp-quota-month.partial{background:var(--amber-soft-2);color:var(--amber-2);border-color:#fcd34d}
    .dp-quota-month.empty{background:var(--red-soft-2);color:var(--red-2);border-color:#fed7aa}

    /* ── SESSIONS LIST ── */
    .dp-sessions{padding:16px 24px}
    .dp-sessions-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .dp-sessions-title{font-size:14px;font-weight:700}
    .session-item{border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
    .session-item:hover{border-color:var(--blue-light)}
    .session-item.done{border-left:4px solid var(--green)}
    .session-item.planned{border-left:4px solid var(--border)}
    .si-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:white;transition:background .1s}
    .si-header:hover{background:#fafbff}
    .si-left{display:flex;align-items:center;gap:10px}
    .si-num{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
    .si-num.done{background:var(--green-light);color:var(--green)}
    .si-num.planned{background:#f1f5f9;color:var(--muted)}
    .si-info{display:flex;flex-direction:column}
    .si-title{font-size:12px;font-weight:700}
    .si-meta{font-size:11px;color:var(--muted);display:flex;gap:8px}
    .si-right{display:flex;align-items:center;gap:6px}
    .si-chevron{font-size:14px;color:var(--muted);transition:transform .2s}
    .session-item.open .si-chevron{transform:rotate(180deg)}
    .si-body{padding:0 16px 14px;display:none}
    .session-item.open .si-body{display:block}
    .si-resume{font-size:12px;line-height:1.7;color:var(--text);padding:12px;background:var(--bg);border-radius:10px;margin-bottom:8px;white-space:pre-wrap}
    .si-devoirs{font-size:12px;padding:10px 12px;background:#fefce8;border-radius:8px;border-left:3px solid var(--orange)}

    /* ── NEW SESSION FORM ── */
    .new-session-form{padding:16px;background:var(--blue-ghost);border-radius:12px;margin:10px 24px;display:none}
    .new-session-form.show{display:block}
    .nsf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .nsf-field label{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
    .nsf-field input,.nsf-field select,.nsf-field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;outline:none;background:white}
    .nsf-field textarea{min-height:100px;resize:vertical}
    .nsf-field input:focus,.nsf-field textarea:focus{border-color:var(--blue-main)}

    /* ── MODAL ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,31,92,.45);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal{background:white;border-radius:18px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(15,31,92,.2);overflow:hidden}
    .modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .modal-head h3{font-size:16px;font-weight:700}
    .modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px}
    .modal-body{padding:20px 24px;max-height:70vh;overflow-y:auto}
    .modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
    .mf{margin-bottom:14px}
    .mf label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block}
    .mf input,.mf select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;outline:none}
    .mf input:focus,.mf select:focus{border-color:var(--blue-main)}
    .mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    /* ── TOAST ── */
    .toast{position:fixed;bottom:24px;right:24px;background:#1a1f36;color:white;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s}
    .toast.show{transform:translateY(0);opacity:1}
    .toast.success{background:var(--green)}
    .toast.error{background:var(--red)}

    /* ── DRIVE LINK ── */
    .si-drive-link{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#e8f0fe;color:#1a73e8;border-radius:6px;font-size:11px;font-weight:600;text-decoration:none;margin-top:6px;transition:background .15s}
    .si-drive-link:hover{background:#d2e3fc}
    .drive-scan-bar{padding:12px 16px;background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:10px;margin:10px 24px;display:flex;align-items:center;gap:10px;color:white;font-size:12px;font-weight:600}
    .drive-scan-bar .btn-drive{background:rgba(255,255,255,.2);color:white;border:1.5px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s}
    .drive-scan-bar .btn-drive:hover{background:rgba(255,255,255,.35)}
    .drive-scan-bar .btn-drive:disabled{opacity:.5;cursor:wait}
    .drive-scan-log{margin:0 24px;max-height:0;overflow:hidden;transition:max-height .3s;font-size:11px;background:#0f172a;color:rgba(255,255,255,.7);border-radius:0 0 10px 10px}
    .drive-scan-log.show{max-height:200px;padding:10px 14px;overflow-y:auto}
    .dsl-match{color:#34d399}
    .dsl-skip{color:#94a3b8}
    .dsl-err{color:#f87171}
    .drive-unlinked{margin-top:14px;padding:14px 16px;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:12px}
    .drive-unlinked-title{font-size:13px;font-weight:700;margin-bottom:10px;color:#c2410c;display:flex;align-items:center;gap:6px}
    .drive-unlinked-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #fed7aa}
    .drive-unlinked-item:last-child{border-bottom:none}

    /* ── STATUT ACTIF / INACTIF ── */
    .client-card.inactive {
      opacity: 0.55;
      border-left: 4px solid #94a3b8 !important;
      filter: grayscale(0.3);
    }
    .client-card.inactive:hover {
      opacity: 0.75;
      filter: grayscale(0);
    }
    .cc-status-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    }
    .cc-status-badge.active { background: var(--green-light); color: var(--green); }
    .cc-status-badge.inactive { background: #f1f5f9; color: #64748b; }

    /* Toggle switch */
    .status-toggle-wrap {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; background: #f8faff; border-radius: 10px;
      border: 1.5px solid var(--border); margin: 12px 24px;
    }
    .status-toggle-label { font-size: 13px; font-weight: 600; flex: 1; }
    .status-toggle-sub { font-size: 11px; color: var(--muted); }
    .toggle-switch {
      position: relative; width: 44px; height: 24px; cursor: pointer;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; border-radius: 24px;
      background: #cbd5e1; transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; left: 3px; top: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: white; transition: transform .2s;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--green); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }

    /* Inactive section in kanban */
    .kanban-col.inactive-col .kanban-col-head { background: #f8fafc; }
    .inactive-section {
      padding: 14px 28px 0;
    }
    .inactive-toggle-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 10px;
      background: white; font-family: inherit; font-size: 12px; font-weight: 600;
      cursor: pointer; color: var(--muted); transition: all .15s; margin-bottom: 8px;
    }
    .inactive-toggle-btn:hover { border-color: #94a3b8; color: var(--text); }
    .list-table tr.inactive-row { opacity: 0.55; }
    .list-table tr.inactive-row:hover { opacity: 0.8; background: #f8fafc; }

    /* ── PLAN D'ACTION ── */
    .dp-plan-section {
      margin: 0 24px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .dp-plan-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(135deg, #faf5ff, #f0f4ff);
      border-bottom: 1.5px solid var(--border);
    }
    .dp-plan-title {
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .dp-plan-badge {
      font-size: 10px; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; background: var(--purple-light); color: var(--purple);
    }
    .dp-plan-body { padding: 16px; background: white; }
    .dp-plan-empty {
      text-align: center; padding: 24px 16px; color: var(--muted); font-size: 13px;
    }
    .dp-plan-empty-icon { font-size: 30px; margin-bottom: 8px; }
    .dp-plan-empty-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .dp-plan-btn-ia {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white; font-family: inherit; font-size: 13px; font-weight: 700;
      cursor: not-allowed; transition: all .18s; margin-top: 12px;
      box-shadow: 0 3px 12px rgba(99,102,241,.25); opacity: 0.7;
      position: relative;
    }
    .dp-plan-btn-ia .soon-tag {
      position: absolute; top: -8px; right: -8px;
      background: var(--orange); color: white; font-size: 9px; font-weight: 800;
      padding: 2px 6px; border-radius: 20px; letter-spacing: .5px;
    }
    .dp-plan-content {
      font-size: 13px; line-height: 1.8; white-space: pre-wrap;
      color: var(--text); background: #f8faff; border-radius: 10px;
      padding: 14px 16px; border: 1px solid #e2e8f0;
    }
    .dp-plan-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .dp-plan-edit-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--border);
      background: white; font-family: inherit; font-size: 12px; font-weight: 600;
      cursor: pointer; color: var(--muted); transition: all .15s;
    }
    .dp-plan-edit-btn:hover { border-color: var(--blue-main); color: var(--blue-main); }
    .dp-plan-textarea {
      width: 100%; min-height: 160px; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-family: inherit; font-size: 13px; line-height: 1.7;
      color: var(--text); background: white; resize: vertical; outline: none;
    }
    .dp-plan-textarea:focus { border-color: var(--purple); }
    .dp-plan-save-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }

    /* ── PLANS D'ACTION (documents HTML) ── */
    .dp-plans-section {
      margin: 0 24px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .dp-plans-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(135deg, #fff7ed, #fef3c7);
      border-bottom: 1.5px solid var(--border);
    }
    .dp-plans-title {
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .dp-plans-count {
      font-size: 10px; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; background: #fde68a; color: #92400e;
    }
    .dp-plans-body { padding: 12px 14px; background: white; }
    .dp-plans-loading {
      text-align: center; padding: 18px 12px; color: var(--muted); font-size: 12px;
    }
    .dp-plans-empty {
      text-align: center; padding: 20px 14px; color: var(--muted); font-size: 13px;
    }
    .dp-plans-empty-icon { font-size: 28px; margin-bottom: 6px; }
    .dp-plans-empty-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .dp-plan-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      margin-bottom: 8px;
      transition: all .15s;
    }
    .dp-plan-item:hover { border-color: #f59e0b; background: #fef3c7; }
    .dp-plan-item:last-child { margin-bottom: 0; }
    .dp-plan-item-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #C9960C, #F5C842);
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(201,150,12,.25);
    }
    .dp-plan-item-main { flex: 1; min-width: 0; }
    .dp-plan-item-title {
      font-size: 13px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dp-plan-item-meta {
      font-size: 11px; color: var(--muted); margin-top: 3px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .dp-plan-tier-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; background: #C9960C; color: white;
      letter-spacing: .3px;
    }
    .dp-plan-tier-badge.phenix { background: #7c3aed; }
    .dp-plan-tier-badge.autre  { background: #64748b; }
    .dp-plan-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .dp-plan-action-btn {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1.5px solid var(--border); background: white;
      font-size: 14px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: all .15s; color: var(--muted);
    }
    .dp-plan-action-btn:hover { border-color: var(--blue-main); color: var(--blue-main); }
    .dp-plan-action-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }
    .dp-plan-upload-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 16px; border-radius: 10px; border: none;

<script>
// ── STATE ──
let _clients = [];
let _filtered = [];
let _currentView = 'kanban';
let _alertFilterOn = false;
let _quotaFilterOn = false;
let _activeFilterOn = true;
let _statusTab = 'actifs'; // actifs | retard | attention | quota | inactifs | tous

// ── NORMALISE COACH NAME ──
// Regroupe toutes les variantes vers un prénom canonique
function normalizeCoach(raw){
  if(!raw) return '';
  const s = raw.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(/^mick|^micha|^mik/.test(s)) return 'Mickael';
  if(/^edou|^edw|^edo/.test(s)) return 'Edouard';
  if(/^emil/.test(s)) return 'Emily';
  if(/^adri/.test(s)) return 'Adrien';
  // fallback : capitalize first word
  const first = raw.trim().split(/[\s.]/)[0];
  return first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
}
const ALERT_DAYS = 21;
const WARN_DAYS = 14;

// Current viewed month
let _viewYear = new Date().getFullYear();
let _viewMonth = new Date().getMonth(); // 0-indexed

// ── QUOTA LOGIC ──
function getMonthlyQuota(programme){
  if(!programme) return 1;
  const p = programme.toLowerCase();
  if(p.includes('24c')) return 2;
  if(p.includes('12c')) return 1;
  if(p.includes('6c')) return 1;
  return 1;
}

// Helper: collect all sessions from years (or legacy flat array)
function getAllSessions(c){
  if(c.years && c.years.length){
    const all = [];
    c.years.forEach(y => (y.sessions||[]).forEach(s => all.push(s)));
    return all;
  }
  return c.sessions||[];
}

function getSessionsInMonth(c, year, month){
  return getAllSessions(c).filter(s=>{
    if(s.statut!=='fait' || !s.date) return false;
    if(s.numero===0 || s.type==='rdv72h') return false;
    const d = new Date(s.date);
    return d.getFullYear()===year && d.getMonth()===month;
  });
}

function getQuotaStatus(c, year, month){
  const done = c.nbCoachingsFaits||0;
  const total = c.nbCoachingsTotal||12;
  if(done >= total) return {status:'done', used:0, max:0, label:'Terminé'};
  
  const quota = getMonthlyQuota(c.programme);
  const sessions = getSessionsInMonth(c, year, month);
  const used = sessions.length;
  
  if(used >= quota) return {status:'ok', used, max:quota, label:`${used}/${quota}`};
  if(used > 0) return {status:'partial', used, max:quota, label:`${used}/${quota}`};
  return {status:'empty', used:0, max:quota, label:`0/${quota}`};
}

function getQuotaHistory(c){
  // Get last 6 months of quota history
  const months = [];
  const now = new Date();
  const entry = c.dateEntree ? new Date(c.dateEntree) : null;
  
  for(let i=5; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    // Skip months before client entry
    if(entry && d < new Date(entry.getFullYear(), entry.getMonth(), 1)) continue;
    const q = getQuotaStatus(c, d.getFullYear(), d.getMonth());
    months.push({
      year: d.getFullYear(),
      month: d.getMonth(),
      label: d.toLocaleDateString('fr-FR',{month:'short'}),
      ...q
    });
  }
  return months;
}

function updateQuotaStats(){

  _clients.forEach(c=>{
    if(c.statut === 'inactif') return; // exclure les inactifs

    const total = c.nbCoachingsTotal||12;

    const q = getQuotaStatus(c, _viewYear, _viewMonth);
    if(q.status==='ok') ok++;

// ── COACH COLORS — dynamique ──
// Lit window.TEAM_MEMBERS[slug].color (alimenté depuis _meta/team_members via admin-users.html).
// Fallback : palette hash-based déterministe si aucune couleur définie pour un coach.
// Les valeurs "classiques" (Emily, Mickael, Edouard, Adrien) sont préservées par défaut
// pour assurer la continuité visuelle si le champ color n'est pas renseigné.
const COACH_COLORS_DEFAULT = {
  'Mickael':'#3b82f6','Edouard':'#10b981','Emily':'#f59e0b','Adrien':'#6366f1'
};
const COACH_FALLBACK_PALETTE = [
  '#3b82f6','#10b981','#f59e0b','#6366f1','#ef4444','#14b8a6',
  '#a16207','#7c3aed','#0891b2','#be185d','#0d9488','#dc2626'
];
function hashString(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = ((h<<5) - h + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function coachColorFor(coachName){
  if(!coachName) return '#94a3b8';
  const canon = normalizeCoach(coachName); // "Mickael", "Emily", etc.
  const slug = canon.toLowerCase();
  // 1. Lookup TEAM_MEMBERS
  if(window.TEAM_MEMBERS && window.TEAM_MEMBERS[slug] && window.TEAM_MEMBERS[slug].color){
    return window.TEAM_MEMBERS[slug].color;
  }
  // 2. Default classique (continuité visuelle)
  if(COACH_COLORS_DEFAULT[canon]) return COACH_COLORS_DEFAULT[canon];
  // 3. Fallback hash déterministe
  return COACH_FALLBACK_PALETTE[hashString(slug) % COACH_FALLBACK_PALETTE.length];
}
// Objet legacy (rétrocompat) — les rares endroits qui y accèdent encore passeront par ça
const COACH_COLORS = new Proxy({}, {
  get(_, key){ return coachColorFor(key); }
});

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60)   return 'à l\'instant';
  if (diff < 3600) return `il y a ${Math.floor(diff/60)} min`;
  if (diff < 86400)return `il y a ${Math.floor(diff/3600)} h`;
  const days = Math.floor(diff/86400);
  if (days === 1)  return 'hier';
  if (days < 7)   return `il y a ${days} j`;
  return new Date(ts).toLocaleDateString('fr-FR', {day:'numeric',month:'short'});
}

function renderRecentActivity() {
  const bar = document.getElementById('recentActivityBar');
  if (!bar) return;

  // Trier les clients par _updatedAt décroissant, garder les 8 premiers
  const sorted = [..._clients]
    .filter(c => c._updatedAt || c.lastSessionDate)
    .sort((a, b) => {
      const ta = a._updatedAt || 0;
      const tb = b._updatedAt || 0;
      return tb - ta;
    })
    .slice(0, 8);

  if (sorted.length === 0) { bar.innerHTML = ''; return; }

  const items = sorted.map(c => {
    // Dernière session faite
    let lastSession = null;
    const allSessions = [];
    if (c.years) {
      c.years.forEach(y => (y.sessions||[]).forEach(s => allSessions.push(s)));
    } else {
      (c.sessions||[]).forEach(s => allSessions.push(s));
    }
    const done = allSessions.filter(s => s.statut === 'fait').sort((a,b) => (b.date||'').localeCompare(a.date||''));
    if (done.length) lastSession = done[0];

    // Coach principal
    const coach = lastSession?.coach || c.coach || '';
    const coachColor = coach ? coachColorFor(coach) : '#94a3b8';
    const initials = (c.nom||'?').slice(0,2).toUpperCase();

    // Badge type
    const isNew = c._updatedAt && (Date.now() - c._updatedAt) < 3600000 && !lastSession;
    const hasRecentSession = lastSession && c._updatedAt && (Date.now() - c._updatedAt) < 86400000 * 3;
    const badgeHtml = hasRecentSession
      ? `<span class="ra-badge session">Séance</span>`
      : isNew
        ? `<span class="ra-badge new">Nouveau</span>`
        : `<span class="ra-badge edit">Modifié</span>`;

    // Méta info
    const sessionInfo = lastSession
      ? `${lastSession.titre||'Séance'} · ${lastSession.date||''}`
      : coach ? `Coach: ${coach}` : '';
    const timeInfo = timeAgo(c._updatedAt);
    const meta = [sessionInfo, timeInfo].filter(Boolean).join(' · ');

    return `<div class="ra-card" onclick="openDetail('${c._id}')">
      <div class="ra-avatar" style="background:${coachColor}">${initials}</div>
      <div class="ra-info">
        <div class="ra-name">${c.nom||'—'}</div>
        <div class="ra-meta">${meta}</div>
      </div>
      ${badgeHtml}
    </div>`;
  });

  bar.innerHTML = `<div class="recent-label">Récents</div>` + items.join('');
}

// ── FILTERS ──
function applyFilters(){
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  const prog = document.getElementById('filterProg').value;
  const coach = document.getElementById('filterCoach').value;

  // Compute all counts for tabs (before status-tab filter)
  const base = _clients.filter(c=>{
    if(q && !c.nom.toLowerCase().includes(q) && !(c.email||'').toLowerCase().includes(q) && !(c.activite||'').toLowerCase().includes(q)) return false;
    if(prog && c.programme !== prog) return false;
    if(coach){
      const hasCoach = getAllSessions(c).some(s=>normalizeCoach(s.coach)===coach);
      if(!hasCoach) return false;
    }
    return true;
  });

  const actifs    = base.filter(c=>c.statut !== 'inactif');
  const inactifs  = base.filter(c=>c.statut === 'inactif');
  const retard    = actifs.filter(c=>getAlertStatus(c)==='alert');
  const attention = actifs.filter(c=>getAlertStatus(c)==='warning');
  const quotaMiss = actifs.filter(c=>{ const qs=getQuotaStatus(c,_viewYear,_viewMonth); return qs.status==='empty'||qs.status==='partial'; });

  // Update tab counts
  document.getElementById('tabCount-actifs').textContent    = actifs.length;
  document.getElementById('tabCount-retard').textContent    = retard.length;
  document.getElementById('tabCount-attention').textContent = attention.length;
  document.getElementById('tabCount-quota').textContent     = quotaMiss.length;
  document.getElementById('tabCount-inactifs').textContent  = inactifs.length;
  document.getElementById('tabCount-tous').textContent      = base.length;

  // Apply status tab filter
  switch(_statusTab){
    case 'actifs':    _filtered = actifs; break;
    case 'retard':    _filtered = retard; break;
    case 'attention': _filtered = attention; break;
    case 'quota':     _filtered = quotaMiss; break;
    case 'inactifs':  _filtered = inactifs; break;
    case 'tous':      _filtered = base; break;
    default:          _filtered = actifs;
  }

  document.getElementById('statTotal').textContent    = _filtered.length;
  document.getElementById('statSessions').textContent = _filtered.reduce((s,c)=>getAllSessions(c).filter(s=>s.statut==='fait'&&s.numero!==0&&s.type!=='rdv72h').length+s,0);
  document.getElementById('statInactive').textContent = inactifs.length;
  updateQuotaStats();
  render();
}

// ── ALERT STATUS ──
function getAlertStatus(c){
  const done = c.nbCoachingsFaits||0;
  const total = c.nbCoachingsTotal||12;
  if(done >= total) return 'ok';
  if(!c.lastSessionDate) return 'alert';
  const last = new Date(c.lastSessionDate);
  const diff = (Date.now() - last.getTime()) / (1000*60*60*24);
  if(diff > ALERT_DAYS) return 'alert';
  if(diff > WARN_DAYS) return 'warning';
  return 'ok';
}

function getAlertText(c){
  const done = c.nbCoachingsFaits||0;
  const total = c.nbCoachingsTotal||12;
  if(done >= total) return '';
  if(!c.lastSessionDate) return 'Aucune séance';
  const last = new Date(c.lastSessionDate);
  const diff = Math.floor((Date.now() - last.getTime()) / (1000*60*60*24));
  if(diff > ALERT_DAYS) return `${diff}j sans coaching`;
  if(diff > WARN_DAYS) return `${diff}j depuis dernier`;
  return '';
}

// ── RENDER KANBAN ──
// Les colonnes ont des largeurs adaptatives via les classes weight-xs/s/m/l
// calculées selon le nombre de cartes dans chaque colonne.
// Les "Autres" programmes (hors 4 standards) sont agrégés dans une colonne "custom".
function renderKanban(){
  const PROG_CONFIG = [
    { key: 'bp12-12', prog: 'BP 12 Mois - 12C',      title: 'BP 12 Mois',               sub: '12 coachings sur 12 mois' },
    { key: 'bp12-24', prog: 'BP 12 Mois - 24C',      title: 'BP 12 Mois · Premium',     sub: '24 coachings sur 12 mois' },
    { key: 'bp6',     prog: 'BP 6 Mois - 6C',        title: 'BP 6 Mois',                sub: '6 coachings sur 6 mois' },
    { key: 'elite',   prog: 'Elite - 12 Mois - 24C', title: 'Elite ★',                  sub: '24 coachings sur 12 mois' }
  ];

  // Grouper : 4 standards + 1 colonne "Autres" pour les programmes non listés
  const standards = PROG_CONFIG.map(cfg => ({
    ...cfg,
    items: _filtered.filter(c => c.programme === cfg.prog)
  }));
  const otherItems = _filtered.filter(c =>
    !PROG_CONFIG.some(cfg => cfg.prog === c.programme)
  );
  const cols = [...standards];
  if(otherItems.length > 0){
    cols.push({
      key: 'custom', prog: '_other',
      title: 'Autres programmes', sub: otherItems.length + ' client' + (otherItems.length>1?'s':''),
      items: otherItems
    });
  }

  // Calculer la classe de pondération selon le count (max parmi toutes les colonnes)
  const maxCount = Math.max(1, ...cols.map(c => c.items.length));
  function weightClass(count){
    if(count === 0) return 'weight-xs';
    const ratio = count / maxCount;
    if(ratio >= 0.65) return 'weight-l';
    if(ratio >= 0.30) return 'weight-m';
    if(ratio >= 0.10) return 'weight-s';
    return 'weight-xs';
  }

  const kanban = document.getElementById('kanbanView');
  kanban.innerHTML = cols.map(col => {
    const wcls = weightClass(col.items.length);
    const body = col.items.length
      ? col.items.map(c => renderCard(c)).join('')
      : '<div class="col-empty">Aucun client</div>';
    return `<div class="kanban-col ${wcls}" data-prog="${col.key}">
      <div class="kanban-col-head">
        <div class="col-title-wrap">
          <div class="col-title">
            <div class="col-prog-mark"></div>
            <span>${col.title}</span>
          </div>
          <div class="col-sub">${col.sub}</div>
        </div>
        <div class="col-count">${col.items.length}</div>
      </div>
      <div class="kanban-cards">${body}</div>
    </div>`;
  }).join('');
}

// Carte client : hiérarchie nom → coach → progression → quota → date
function renderCard(c){
  const done = c.nbCoachingsFaits || 0;
  const total = c.nbCoachingsTotal || 12;
  const pct = Math.min(done/total*100, 100);
  const alert = getAlertStatus(c);
  const alertText = getAlertText(c);
  const isInactive = c.statut === 'inactif';

  const barCls = isInactive ? '' : (alert === 'alert' ? 'alert' : alert === 'warning' ? 'warn' : (pct >= 100 ? 'ok' : ''));

  const lastSession = getAllSessions(c).filter(s => s.coach && s.statut === 'fait').pop();
  const lastCoach = lastSession ? lastSession.coach : '';
  const coachColor = lastCoach ? coachColorFor(lastCoach) : '';

  // Quota du mois en vue
  const q = getQuotaStatus(c, _viewYear, _viewMonth);
  const quotaCls = isInactive ? 'done' : q.status;

  // Dernière séance : deux lignes (durée + date exacte)
  let lastBlock = '';
  if(isInactive){
    lastBlock = `<div class="cc-last"><span class="cc-last-date">Inactif</span></div>`;
  } else if(!c.lastSessionDate){
    lastBlock = `<div class="cc-last alert">
      <span><strong>Aucune séance</strong></span>
      <span class="cc-last-date">—</span>
    </div>`;
  } else {
    const diffDays = Math.floor((Date.now() - new Date(c.lastSessionDate).getTime()) / 86400000);
    const urgCls = alert === 'alert' ? 'alert' : alert === 'warning' ? 'warn' : '';
    const durLabel = alert === 'alert'
      ? `${diffDays}j <strong>sans séance</strong>`
      : alert === 'warning'
        ? `${diffDays}j <strong>depuis dernier</strong>`
        : (diffDays === 0 ? `<strong>Aujourd'hui</strong>` : `Il y a <strong>${diffDays}j</strong>`);
    lastBlock = `<div class="cc-last ${urgCls}">
      <span>${durLabel}</span>
      <span class="cc-last-date">${formatDate(c.lastSessionDate)}</span>
    </div>`;
  }

  // Coach pill : couleur dynamique via style inline (lookup TEAM_MEMBERS)
  const coachPill = isInactive
    ? `<span class="cc-status-badge inactive">Inactif</span>`
    : (lastCoach
        ? `<div class="cc-coach" style="background:${coachColor}18;color:${coachColor}">${lastCoach}</div>`
        : '');

  const cardCls = isInactive ? 'inactive' : (alert === 'alert' ? 'alert' : alert === 'warning' ? 'warning' : '');

  return `<div class="client-card ${cardCls}" onclick="openDetail('${c._id}')">
    <div class="cc-top">
      <div>
        <div class="cc-name">${escHtml(c.nom || '—')}</div>
        ${c.activite ? `<div class="cc-activite">${escHtml(c.activite)}</div>` : ''}
      </div>
      ${coachPill}

      <div class="cc-bar"><div class="cc-bar-fill ${barCls}" style="width:${pct}%"></div></div>
      <div class="cc-prog-text">${done}<span class="total">/${total}</span></div>
    </div>
    ${!isInactive ? `<div class="cc-quota ${quotaCls}">Ce mois : ${q.label}</div>` : ''}
    <div class="cc-foot">
      <div></div>
      ${lastBlock}
    </div>
  </div>`;
}

async function addSession(clientId){
  const date = document.getElementById('ns-date').value;
  const coach = normalizeCoach(document.getElementById('ns-coach').value.trim());
  if(!date || !coach){showToast('Remplissez la date et le coach','error');return;}
  
  const c = _clients.find(x=>x._id===clientId);
  if(!c) return;
  
  const sessions = c.sessions||[];
  const maxNum = sessions.reduce((m,s)=>Math.max(m,s.numero),0);
  const newSession = {
    numero: maxNum+1,
    titre: `COACHING #${maxNum+1}`,
    date, coach,
    resume: document.getElementById('ns-resume').value.trim(),
    devoirs: document.getElementById('ns-devoirs').value.trim(),
    statut: 'fait'
  };
  sessions.push(newSession);
  c.sessions = sessions;
  c.nbCoachingsFaits = sessions.filter(s=>s.statut==='fait'&&s.numero!==0&&s.type!=='rdv72h').length;
  const dates = sessions.filter(s=>s.date&&s.statut==='fait'&&s.numero!==0&&s.type!=='rdv72h').map(s=>s.date);
  c.lastSessionDate = dates.length?dates.sort().pop():'';
  
  try{
    c._updatedAt = Date.now();
    await window._setDoc(window._doc(window._db,'clients',clientId),c);
    showToast('✅ Séance ajoutée !','success');
    openDetail(clientId);
    applyFilters(); renderRecentActivity();
  }catch(e){showToast('Erreur: '+e.message,'error');console.error(e);}
}

function generateSessionsTemplate(programme, nbTotal){
  const sessions = [];

  // Session 72H urgente en premier (numero = 0)
  sessions.push({
    numero: 0,
    titre: 'RDV URGENT 72H',
    date: '',
    coach: '',
    resume: '',
    devoirs: '',
    statut: 'planifie',
    type: 'rdv72h'
  });

  // Séances de coaching numérotées 1 → nbTotal
  for(let i = 1; i <= nbTotal; i++){
    sessions.push({
      numero: i,
      titre: `COACHING #${i}`,
      date: '',
      coach: '',
      resume: '',
      devoirs: '',
      statut: 'planifie'
    });
  }

  return sessions;
}

async function createClient(){
  const nom = document.getElementById('nc-nom').value.trim();
  if(!nom){showToast('Nom requis','error');return;}
  const programme = document.getElementById('nc-programme').value;
  const nbMatch = programme.match(/(\d+)C/);
  const nbTotal = nbMatch ? parseInt(nbMatch[1]) : 12;

  const sessions = generateSessionsTemplate(programme, nbTotal);

  const id = 'cli_'+Date.now();
  const client = {
    _id: id, nom,
    email: document.getElementById('nc-email').value.trim(),
    tel: document.getElementById('nc-tel').value.trim(),
    activite: document.getElementById('nc-activite').value.trim(),
    programme,
    dateEntree: document.getElementById('nc-date').value||new Date().toISOString().slice(0,10),
    nbCoachingsTotal: nbTotal,
    nbCoachingsFaits: 0,
    lastSessionDate: '',
    sessions,
    years:[{yearNum:1, label:'Année 1', startDate:document.getElementById('nc-date').value||new Date().toISOString().slice(0,10), notes:programme, sessions:sessions}],
    planAction: '',
    statut: 'actif'
  };

  try{
    client._updatedAt = Date.now();
    await window._setDoc(window._doc(window._db,'clients',id),client);
    _clients.push(client);
    closeNewClientModal();
    applyFilters(); renderRecentActivity();
    showToast(`✅ Client créé — ${nbTotal + 1} séances générées (72H + ${nbTotal} coachings) !`,'success');
    ['nc-nom','nc-email','nc-tel','nc-activite'].forEach(fieldId=>document.getElementById(fieldId).value='');

// ── PLANS D'ACTION (documents HTML attachés) ──
// Sous-collection Firestore : clients/{clientId}/plans/{planId}
// Schéma doc plan :
//   name       : string (nom fichier source, ex. "plan_action_julie.html")
//   title      : string (titre lisible, extrait du <title> si possible)
//   tier       : 'elite' | 'phenix' | 'autre'
//   html       : string (contenu HTML complet, UTF-8)
//   size       : number (octets)
//   yearNum    : number | null (année de coaching liée, optionnel)
//   uploadedAt : number (Date.now())
//   uploadedBy : string (uid admin)
// ══════════════════════════════════════════════════════════════════

const PLAN_MAX_BYTES = 750 * 1024; // 750 Ko, aligné sur la limite des files séance

function renderPlansList(c, id){
  const plans = c.plans;
  if(plans === undefined){
    return `<div class="dp-plans-loading">⏳ Chargement des plans...</div>`;
  }
  if(!plans || plans.length === 0){
    return `
      <div class="dp-plans-empty">
        <div class="dp-plans-empty-icon">📜</div>
        <div>Aucun plan d'action attaché</div>
        <div class="dp-plans-empty-sub">${window._role === 'admin' ? 'Cliquez sur « Ajouter un plan » pour en uploader un (HTML)' : 'Les plans seront ajoutés par un administrateur'}</div>
      </div>`;
  }
  // Tri : plus récent en premier
  const sorted = plans.slice().sort((a,b)=>(b.uploadedAt||0)-(a.uploadedAt||0));
  const isAdmin = window._role === 'admin';
  return sorted.map(p => {
    const tier = (p.tier || 'autre').toLowerCase();
    const tierLabel = tier === 'elite' ? 'ELITE' : tier === 'phenix' ? 'PHÉNIX' : 'AUTRE';
    const tierCls = tier === 'elite' ? '' : tier === 'phenix' ? 'phenix' : 'autre';
    const dateStr = p.uploadedAt ? new Date(p.uploadedAt).toLocaleDateString('fr-FR', {day:'2-digit',month:'short',year:'numeric'}) : '';
    const sizeKb = p.size ? Math.round(p.size/1024) + ' Ko' : '';
    const yearStr = p.yearNum ? `An ${p.yearNum}` : '';
    return `
      <div class="dp-plan-item">
        <div class="dp-plan-item-icon">📜</div>
        <div class="dp-plan-item-main">
          <div class="dp-plan-item-title">${escHtml(p.title || p.name || 'Plan d\'action')}</div>
          <div class="dp-plan-item-meta">
            <span class="dp-plan-tier-badge ${tierCls}">${tierLabel}</span>
            ${yearStr ? `<span>${yearStr}</span>` : ''}
            ${dateStr ? `<span>📅 ${dateStr}</span>` : ''}
            ${sizeKb ? `<span>${sizeKb}</span>` : ''}
          </div>
        </div>
        <div class="dp-plan-item-actions">
          <button class="dp-plan-action-btn" onclick="openPlan('${id}','${p._id}')" title="Ouvrir dans un nouvel onglet">👁️</button>
          <button class="dp-plan-action-btn" onclick="downloadPlan('${id}','${p._id}')" title="Télécharger">⬇️</button>
          ${isAdmin ? `<button class="dp-plan-action-btn danger" onclick="deletePlan('${id}','${p._id}')" title="Supprimer">🗑️</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function loadClientPlans(clientId){
  const c = _clients.find(x=>x._id===clientId);
  if(!c) return;
  // Évite le rechargement si déjà en mémoire (re-render instantané)
  if(c.plans !== undefined){
    const target = document.getElementById('plansList-'+clientId);
    if(target) target.innerHTML = renderPlansList(c, clientId);
    const cnt = document.getElementById('plansCount-'+clientId);
    if(cnt) cnt.textContent = (c.plans || []).length;
    return;
  }
  try{
    const snap = await window._getDocs(window._collection(window._db,'clients',clientId,'plans'));
    const plans = [];
    snap.forEach(d => {
      const data = d.data();
      data._id = d.id;
      plans.push(data);
    });
    c.plans = plans;
  }catch(e){
    console.warn('loadClientPlans error:', e);
    c.plans = []; // Évite le retry infini en cas d'erreur (permission, réseau)
  }
  // Rafraîchit uniquement la zone plans si le panel est toujours ouvert sur ce client
  const target = document.getElementById('plansList-'+clientId);
  if(target) target.innerHTML = renderPlansList(c, clientId);
  const cnt = document.getElementById('plansCount-'+clientId);
  if(cnt) cnt.textContent = (c.plans || []).length;
}

async function uploadPlanFile(clientId, inputEl){
  if(window._role !== 'admin'){ showToast('Réservé aux admins','error'); return; }
  const file = inputEl && inputEl.files && inputEl.files[0];
  if(!file) return;

  // Validation type
  const nameLc = (file.name||'').toLowerCase();
  if(!nameLc.endsWith('.html') && !nameLc.endsWith('.htm') && file.type !== 'text/html'){
    showToast('Format attendu : fichier .html','error');
    inputEl.value = '';
    return;
  }
  if(file.size > PLAN_MAX_BYTES){
    showToast(`Fichier trop lourd (max ${Math.round(PLAN_MAX_BYTES/1024)} Ko)`,'error');
    inputEl.value = '';
    return;
  }

  const c = _clients.find(x=>x._id===clientId);
  if(!c){ inputEl.value = ''; return; }

  // Prompt : tier + année liée
  const tierRaw = prompt('Catégorie du plan ?\n\n  elite   — Business Phénix Elite\n  phenix  — Business Phénix\n  autre   — Autre\n\nEntrez : elite, phenix ou autre', 'elite');
  if(tierRaw === null){ inputEl.value = ''; return; }
  const tier = (tierRaw||'').trim().toLowerCase();
  if(!['elite','phenix','autre'].includes(tier)){
    showToast('Catégorie invalide (elite, phenix, autre)','error');
    inputEl.value = '';
    return;
  }

  const currentYear = (c.years && c.years.length) ? c.years[c.years.length-1].yearNum : null;
  const yearRaw = prompt('Année de coaching liée à ce plan ? (laisser vide si non applicable)', currentYear ? String(currentYear) : '');
  let yearNum = null;
  if(yearRaw !== null && yearRaw.trim() !== ''){
    const n = parseInt(yearRaw, 10);
    if(!isNaN(n) && n > 0) yearNum = n;
  }

  // Lecture du fichier en texte (pas base64 — c'est du HTML UTF-8)
  let html;
  try{
    html = await file.text();
  }catch(e){
    showToast('Erreur lecture fichier: '+e.message,'error');
    inputEl.value = '';
    return;
  }

  // Extraire le <title> du HTML pour l'afficher plus joliment
  let title = file.name.replace(/\.(html?|htm)$/i,'');
  const m = html.match(/<title>([^<]+)<\/title>/i);
  if(m && m[1]) title = m[1].trim();

  // Écriture Firestore
  const ts = Date.now();
  const planId = ts + '_' + Math.random().toString(36).slice(2, 8);
  const planData = {
    name: file.name,
    title: title,
    tier: tier,
    html: html,
    size: file.size,
    yearNum: yearNum,
    uploadedAt: ts,
    uploadedBy: window._uid || ''
  };

  try{
    const ref = window._doc(window._db,'clients',clientId,'plans',planId);
    await window._setDoc(ref, planData);
    // Met à jour le cache local et le rendu
    if(!c.plans) c.plans = [];
    c.plans.push({ ...planData, _id: planId });
    const target = document.getElementById('plansList-'+clientId);
    if(target) target.innerHTML = renderPlansList(c, clientId);
    const cnt = document.getElementById('plansCount-'+clientId);
    if(cnt) cnt.textContent = c.plans.length;
    showToast('✅ Plan ajouté !','success');
  }catch(e){
    showToast('Erreur sauvegarde: '+(e.message||e),'error');
  }finally{
    inputEl.value = '';
  }
}

async function openPlan(clientId, planId){
  // Tente d'abord via le cache mémoire pour être instantané
  const c = _clients.find(x=>x._id===clientId);
  let html = null;
  let title = 'Plan d\'action';
  if(c && c.plans){
    const p = c.plans.find(x=>x._id===planId);
    if(p){ html = p.html; title = p.title || p.name || title; }
  }
  // Fallback : relecture Firestore si non présent en mémoire
  if(!html){
    try{
      const snap = await window._getDoc(window._doc(window._db,'clients',clientId,'plans',planId));
      if(!snap.exists()){ showToast('Plan introuvable','error'); return; }
      const d = snap.data();
      html = d.html; title = d.title || d.name || title;
    }catch(e){
      showToast('Erreur chargement: '+e.message,'error');
      return;
    }
  }
  if(!html){ showToast('Plan vide','error'); return; }

  // Ouverture dans un nouvel onglet via Blob URL
  // (document.write() marche aussi mais Blob URL gère mieux les gros HTML + print)
  try{
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if(!w){
      showToast('Popup bloquée par le navigateur','error');
      URL.revokeObjectURL(url);
      return;
    }
    // Libère l'URL après ouverture (le navigateur garde la ressource tant que l'onglet est ouvert)
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){
    showToast('Erreur ouverture: '+e.message,'error');
  }
}

async function downloadPlan(clientId, planId){
  const c = _clients.find(x=>x._id===clientId);
  let html = null;
  let name = 'plan_action.html';
  if(c && c.plans){
    const p = c.plans.find(x=>x._id===planId);
    if(p){ html = p.html; name = p.name || name; }
  }
  if(!html){
    try{
      const snap = await window._getDoc(window._doc(window._db,'clients',clientId,'plans',planId));
      if(!snap.exists()){ showToast('Plan introuvable','error'); return; }
      const d = snap.data();
      html = d.html; name = d.name || name;
    }catch(e){ showToast('Erreur: '+e.message,'error'); return; }
  }
  try{
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(e){
    showToast('Erreur téléchargement: '+e.message,'error');
  }
}

function formatDate(d){

  try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}
  catch(e){return d;}
}
function escHtml(s){
  if(!s) return '';
  // Les anciens textes en base contiennent parfois des <br> littéraux (saisis avant
  // qu'on n'utilise \n). On les convertit d'abord en \n AVANT l'échappement pour
  // qu'ils redeviennent de vrais retours ligne après traitement.
  var str = String(s).replace(/<br\s*\/?>/gi, '\n');
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

const GAPI_CLIENT_ID = '1050138912851-3ffa6ol1cet9mjgg5fkp3ijdji0b7k4u.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
let _driveToken = null;

// Connect Drive then scan for a specific client
function connectDriveThen(clientId){
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GAPI_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if(resp.error){ showToast('Erreur Drive: '+resp.error,'error'); return; }
      _driveToken = resp.access_token;
      showToast('✅ Drive connecté !','success');
      // Re-render panel to show scan button
      openDetail(clientId);
      // Auto-scan
      setTimeout(()=>scanDriveForClient(clientId), 500);
    }
  });
  client.requestAccessToken();
}

// Drive API helper
async function driveApi(url){
  const res = await fetch(url, {headers:{'Authorization':'Bearer '+_driveToken}});
  if(!res.ok) return null;
  return res.json();
}

// Fetch doc text content (first 2000 chars for summary)
async function fetchDocText(docId){
  try{
    const res = await fetch(
      `https://www.googleapis.com/drive/v3/files/${docId}/export?mimeType=text/plain`,
      {headers:{'Authorization':'Bearer '+_driveToken}}
    );
    if(!res.ok) return '';
    return (await res.text()).substring(0, 2500);
  }catch(e){ return ''; }
}

// Extract summary from Gemini doc text
function extractSummary(text){
  if(!text) return '';
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l);
  let summary = '';
  let capture = false;
  for(const line of lines){
    if(/^(résumé|summary|vue d.ensemble|overview)/i.test(line)){ capture=true; continue; }
    if(/^(détails|details|transcription|étapes suivantes|next steps|action items)/i.test(line)){
      if(summary) break;
      capture=true; continue;
    }
    if(capture && line.length>5){
      summary += (summary?'\n':'')+line;
      if(summary.length>600) break;
    }
  }
  if(!summary) summary = lines.filter(l=>l.length>20).slice(0,4).join('\n');
  return summary.substring(0,800);
}

// Normalize name for matching
function normName(n){
  return (n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}

// Scan Drive for a specific client
async function scanDriveForClient(clientId){
  const c = _clients.find(x=>x._id===clientId);
  if(!c || !_driveToken) return;

  const btn = document.getElementById('driveScanBtn-'+clientId);
  const status = document.getElementById('driveScanStatus-'+clientId);
  const logEl = document.getElementById('driveScanLog-'+clientId);
  if(btn){ btn.disabled=true; btn.textContent='⏳ Recherche...'; }
  logEl.classList.add('show');
  logEl.innerHTML = '';
  const log = (msg,cls='') => { logEl.innerHTML+=`<div class="${cls}">${msg}</div>`; logEl.scrollTop=logEl.scrollHeight; };

  // Build search terms from client name
  const nameParts = normName(c.nom).split(' ').filter(p=>p.length>2);
  log(`🔍 Recherche pour "${c.nom}" → mots-clés: ${nameParts.join(', ')}`);

  // Search Drive by client name parts
  let allDocs = [];
  for(const part of nameParts){
    const q = encodeURIComponent(`name contains '${part}' and mimeType='application/vnd.google-apps.document'`);
    const res = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,createdTime)&pageSize=50&orderBy=createdTime desc&supportsAllDrives=true&includeItemsFromAllDrives=true`);
    if(res && res.files){
      res.files.forEach(f=>{
        if(!allDocs.find(d=>d.id===f.id)) allDocs.push(f);
      });
    }
  }
  log(`📄 ${allDocs.length} document(s) trouvé(s) dans Drive`);

  // Filter: only coaching/rdv docs that match this client
  const matchedDocs = [];
  for(const doc of allDocs){
    const title = doc.name||'';
    // Must be a coaching or RDV doc
    if(!/coaching 1:1|rdv urgent|post inscription/i.test(title)) continue;
    // Skip group coaching
    if(/coaching gr/i.test(title)) continue;

    // Extract client name from title
    const withMatch = title.match(/with\s+(.+?)\s*-\s*\d{4}/i) || title.match(/with\s+(.+?)(?:\s*-|$)/i);
    if(!withMatch) continue;
    const driveClient = normName(withMatch[1]);

    // Check if this Drive doc matches our client
    const clientNorm = normName(c.nom);
    const clientParts = clientNorm.split(' ').filter(p=>p.length>2);
    const driveParts = driveClient.split(' ').filter(p=>p.length>2);

    let score = 0;
    for(const dp of driveParts){
      for(const cp of clientParts){
        if(cp===dp) score+=10;
        else if(cp.startsWith(dp)||dp.startsWith(cp)) score+=5;
        else if(cp.includes(dp)||dp.includes(cp)) score+=3;
      }
    }
    if(score < 5) continue;

    // Extract date
    const dateMatch = title.match(/(\d{4})\/(\d{2})\/(\d{2})/);
    const date = dateMatch ? `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}` : null;
    const type = /rdv urgent|post inscription/i.test(title) ? 'rdv72h' : 'coaching';

    matchedDocs.push({id:doc.id, title, date, type, url:`https://docs.google.com/document/d/${doc.id}/edit`});
    log(`✅ Match: "${title.substring(0,70)}..." (${date})`,'dsl-match');
  }

  if(matchedDocs.length===0){
    log('⚠️ Aucun document trouvé pour ce client','dsl-skip');
    if(btn){ btn.disabled=false; btn.textContent='🔍 Chercher les résumés'; }
    if(status) status.textContent='Aucun doc trouvé';
    return;
  }

  // Link docs to sessions (avoid duplicates)
  let linked=0, unlinked=0;
  let changed = false;
  // Collect all sessions from all years (references, so modifications propagate)
  const sessions = [];
  if(c.years && c.years.length){
    c.years.forEach(y => (y.sessions||[]).forEach(s => sessions.push(s)));
  } else {
    (c.sessions||[]).forEach(s => sessions.push(s));
  }
  if(!c.driveDocs) c.driveDocs = [];

  for(const doc of matchedDocs){
    // Check if already linked to a session (by URL)
    const alreadyInSession = sessions.some(s=>s.driveUrl===doc.url);
    if(alreadyInSession){
      log(`⏩ Déjà lié à une session: ${doc.date}`,'dsl-skip');
      continue;
    }

    // If in driveDocs (previously unlinked), remove it — we'll retry linking
    const prevIdx = c.driveDocs.findIndex(d=>d.docUrl===doc.url);
    const wasPrevUnlinked = prevIdx !== -1;

    // Fetch summary (use cached from driveDocs if available)
    let summary = '';
    if(wasPrevUnlinked && c.driveDocs[prevIdx].summary){
      summary = c.driveDocs[prevIdx].summary;
      log(`📝 Résumé en cache pour ${doc.date}`);
    } else {
      log(`📝 Récupération résumé ${doc.date}...`);
      const text = await fetchDocText(doc.id);
      summary = extractSummary(text);
    }

    // Try to match to a session by date (±2 days)
    let matchedSession = null;
    if(doc.date){
      const dDate = new Date(doc.date);
      matchedSession = sessions.find(s=>{
        if(!s.date || s.driveUrl) return false; // skip already linked
        const sDate = new Date(s.date);
        return Math.abs(dDate-sDate) < 86400000*2;
      });
    }

    if(matchedSession){
      matchedSession.driveUrl = doc.url;
      matchedSession.driveTitle = doc.title;
      matchedSession.driveSummary = summary;
      if(!matchedSession.resume || matchedSession.resume.length<20){
        matchedSession.resume = summary;
      }
      // Remove from driveDocs if it was previously unlinked
      if(wasPrevUnlinked) c.driveDocs.splice(prevIdx, 1);
      linked++;
      changed = true;
      log(`🔗 Lié à session #${matchedSession.numero} (${matchedSession.date})`,'dsl-match');
    } else if(!wasPrevUnlinked){
      // Store as unlinked (only if not already there)
      c.driveDocs.push({
        date: doc.date,
        docUrl: doc.url,
        docTitle: doc.title,
        type: doc.type,
        summary: summary
      });
      unlinked++;
      changed = true;
      log(`📎 Pas de session correspondante → stocké comme non-lié (${doc.date})`,'dsl-skip');
    } else {
      log(`⏩ Toujours non-lié: ${doc.date} (pas de session à ±2j)`,'dsl-skip');
    }
  }

  // Save
  if(changed){
    try{
      c._updatedAt = Date.now();
    await window._setDoc(window._doc(window._db,'clients',clientId),c);
      log(`💾 Sauvegardé: ${linked} liés, ${unlinked} non-liés`,'dsl-match');
    }catch(e){
      log(`❌ Erreur sauvegarde: ${e.message}`,'dsl-err');
    }
  }

  if(btn){ btn.disabled=false; btn.textContent='🔍 Chercher les résumés'; }
  if(status) status.textContent=`✅ ${linked} liés · ${unlinked} non-liés`;

  // Refresh detail panel
  if(linked>0 || unlinked>0){
    showToast(`✅ ${linked} résumé(s) lié(s), ${unlinked} doc(s) trouvé(s)`,'success');
    setTimeout(()=>openDetail(clientId), 300);
  }
}

  if(!c||!c.years||!c.years[yi])return;
  var s=(c.years[yi].sessions||[]).find(function(x){return x.numero===sn;});
  if(!s)return;
  var k='y'+yi+'s'+sn;
  var g=function(id){return (document.getElementById(id)||{}).value||'';};
  s.date=g('sed-'+k);s.coach=normalizeCoach(g('sec-'+k));
  s.visioUrl=g('sev-'+k).trim();s.driveUrl=g('seg-'+k).trim();
  s.resume=g('ser-'+k).trim();s.devoirs=g('sedv-'+k).trim();s.notes=g('sen-'+k).trim();
  syncYearStats(c);
  try{
    c._updatedAt = Date.now();
    await window._setDoc(window._doc(window._db,'clients',clientId),c);

  }catch(e){showToast('Erreur: '+e.message,'error');}
