/* ═══════════════════════════════════════════════════════════
   FILE UPLOAD — RDV 72H uniquement
   Stocke dans Firebase Storage: coaching-72h/{clientId}/{filename}
   Metadata dans session.files: [{name, url, storagePath, type, size, uploadedAt}]
═══════════════════════════════════════════════════════════ */

function _fileIcon(name) {
  var ext = (name || '').split('.').pop().toLowerCase();
  if (ext === 'pdf') return '📕';
  if (['jpg','jpeg','png','gif','webp','svg'].indexOf(ext) >= 0) return '🖼️';
  if (['doc','docx'].indexOf(ext) >= 0) return '📄';
  if (['xls','xlsx','csv'].indexOf(ext) >= 0) return '📊';
  if (['ppt','pptx'].indexOf(ext) >= 0) return '📽️';
  if (ext === 'html') return '🌐';
  if (['mp4','mov','avi'].indexOf(ext) >= 0) return '🎬';
  if (['mp3','wav'].indexOf(ext) >= 0) return '🎵';
  if (['zip','rar','7z'].indexOf(ext) >= 0) return '📦';
  return '📎';
}

function _fileSize(bytes) {
  if (bytes < 1024) return bytes + ' o';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' Ko';
  return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
}

function render72hFiles(files, clientId, yi, sn) {
  var k = 'y' + yi + 's' + sn;
  var h = '';
  h += '<div class="si-files-zone" id="fz-' + k + '" ondragover="event.preventDefault();this.classList.add(\'dragging\')" ondragleave="this.classList.remove(\'dragging\')" ondrop="event.preventDefault();this.classList.remove(\'dragging\');drop72hFile(event,\'' + clientId + '\',' + yi + ',' + sn + ')">';
  h += '<div class="si-files-title">📎 Fichiers joints</div>';

  if (files && files.length > 0) {
    h += '<div class="si-files-list">';
    for (var fi = 0; fi < files.length; fi++) {
      var f = files[fi];
      h += '<div class="si-file-item">';
      h += '<span class="si-file-icon">' + _fileIcon(f.name) + '</span>';
      h += '<span class="si-file-name"><a href="#" onclick="event.preventDefault();preview72hFile(\'' + clientId + '\',\'' + (f.fileDocId || '') + '\')">' + escHtml(f.name) + '</a></span>';
      h += '<span class="si-file-size">' + (f.size ? _fileSize(f.size) : '') + '</span>';
      h += '<button class="si-upload-btn" style="padding:3px 8px;font-size:10px" onclick="event.stopPropagation();download72hFile(\'' + clientId + '\',\'' + (f.fileDocId || '') + '\',\'' + escHtml(f.name).replace(/'/g, '') + '\')">⬇</button>';
      h += '<button class="si-file-del" title="Supprimer" onclick="event.stopPropagation();delete72hFile(\'' + clientId + '\',' + yi + ',' + sn + ',' + fi + ')">✕</button>';
      h += '</div>';
    }
    h += '</div>';
  }

  h += '<div class="si-upload-row">';
  h += '<input class="si-upload-input" type="file" id="fu-' + k + '" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.svg,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.html,.txt" onchange="upload72hFiles(\'' + clientId + '\',' + yi + ',' + sn + ')">';
  h += '<button class="si-upload-btn" onclick="document.getElementById(\'fu-' + k + '\').click()">📤 Ajouter un fichier</button>';
  h += '<span class="si-upload-hint">ou glisser-déposer · max 750 Ko / fichier</span>';
  h += '</div>';
  h += '<div class="si-upload-progress" id="fp-' + k + '"><div class="si-upload-progress-fill" id="fpf-' + k + '"></div></div>';
  h += '</div>';
  return h;
}

async function upload72hFiles(clientId, yi, sn) {
  var k = 'y' + yi + 's' + sn;
  var input = document.getElementById('fu-' + k);
  if (!input || !input.files || input.files.length === 0) return;
  if (!window._db) { showToast('Firebase non initialisé', 'error'); return; }

  var c = _clients.find(function(x) { return x._id === clientId; });
  if (!c || !c.years || !c.years[yi]) return;
  var sess = (c.years[yi].sessions || []).find(function(x) { return x.numero === sn; });
  if (!sess) return;
  if (!sess.files) sess.files = [];

  var progBar = document.getElementById('fp-' + k);
  var progFill = document.getElementById('fpf-' + k);
  if (progBar) progBar.classList.add('active');

  var files = Array.from(input.files);
  var total = files.length;
  var done = 0;
  var MAX_SIZE = 750 * 1024; // 750 Ko max (base64 = ~1Mo = limite Firestore doc)

  for (var i = 0; i < files.length; i++) {
    var file = files[i];
    if (file.size > MAX_SIZE) {
      showToast('Fichier trop lourd : ' + file.name + ' (max 750 Ko)', 'error');
      continue;
    }

    try {
      // Lire le fichier en base64
      var base64 = await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = function() { reject(new Error('Lecture échouée')); };
        reader.readAsDataURL(file);
      });

      // Sauvegarder dans Firestore sous-collection clients/{id}/files/{fileId}
      var ts = Date.now();
      var fileDocId = ts + '_' + Math.random().toString(36).slice(2, 8);
      var filesCol = window._collection(window._db, 'clients', clientId, 'files');
      var fileRef = window._doc(filesCol, fileDocId);
      await window._setDoc(fileRef, {
        name: file.name,
        base64: base64,
        type: file.type || 'application/octet-stream',
        size: file.size,
        uploadedAt: ts,
        sessionKey: 'y' + yi + 's' + sn
      });

      // Stocker uniquement les métadonnées dans session.files
      sess.files.push({
        name: file.name,
        fileDocId: fileDocId,
        type: file.type || 'application/octet-stream',
        size: file.size,
        uploadedAt: ts
      });
      done++;
      if (progFill) progFill.style.width = (done / total * 100) + '%';
    } catch (e) {
      showToast('Erreur upload ' + file.name + ': ' + e.message, 'error');
    }
  }

  // Sauvegarder le client (avec les métadonnées fichiers)
  try {
    c._updatedAt = Date.now();
    await window._setDoc(window._doc(window._db, 'clients', clientId), c);
    showToast(done + ' fichier(s) ajouté(s) !', 'success');
  } catch (e) {
    showToast('Erreur sauvegarde: ' + e.message, 'error');
  }

  input.value = '';
  if (progBar) { progBar.classList.remove('active'); if (progFill) progFill.style.width = '0'; }
  applyFilters();
  openDetail(clientId);
}

function drop72hFile(event, clientId, yi, sn) {
  var dt = event.dataTransfer;
  if (!dt || !dt.files || dt.files.length === 0) return;
  var k = 'y' + yi + 's' + sn;
  var input = document.getElementById('fu-' + k);
  if (input) {
    input.files = dt.files;
    upload72hFiles(clientId, yi, sn);
  }
}

async function download72hFile(clientId, fileDocId, fileName) {
  try {
    var fileRef = window._doc(window._db, 'clients', clientId, 'files', fileDocId);
    var snap = await window._getDoc(fileRef);
    if (!snap.exists()) { showToast('Fichier introuvable', 'error'); return; }
    var data = snap.data();
    // data.base64 = "data:type;base64,xxxx"
    var a = document.createElement('a');
    a.href = data.base64;
    a.download = fileName || data.name || 'fichier';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (e) {
    showToast('Erreur téléchargement: ' + e.message, 'error');
  }
}

async function preview72hFile(clientId, fileDocId) {
  try {
    var fileRef = window._doc(window._db, 'clients', clientId, 'files', fileDocId);
    var snap = await window._getDoc(fileRef);
    if (!snap.exists()) { showToast('Fichier introuvable', 'error'); return; }
    var data = snap.data();
    // Ouvrir dans un nouvel onglet
    var w = window.open('');
    if (w) {
      if (data.type && data.type.indexOf('image') >= 0) {
        w.document.write('<img src="' + data.base64 + '" style="max-width:100%"/>');
      } else if (data.type === 'application/pdf') {
        w.document.write('<iframe src="' + data.base64 + '" style="width:100%;height:100vh;border:none"></iframe>');
      } else {
        // Téléchargement direct pour les autres types
        w.close();
        download72hFile(clientId, fileDocId, data.name);
      }
    }
  } catch (e) {
    showToast('Erreur aperçu: ' + e.message, 'error');
  }
}

async function delete72hFile(clientId, yi, sn, fileIdx) {
  if (!confirm('Supprimer ce fichier ?')) return;
  var c = _clients.find(function(x) { return x._id === clientId; });
  if (!c || !c.years || !c.years[yi]) return;
  var sess = (c.years[yi].sessions || []).find(function(x) { return x.numero === sn; });
  if (!sess || !sess.files || !sess.files[fileIdx]) return;

  var file = sess.files[fileIdx];

  // Supprimer le doc Firestore
  if (file.fileDocId && window._db) {
    try {
      var fileRef = window._doc(window._db, 'clients', clientId, 'files', file.fileDocId);
      await window._deleteDoc(fileRef);
    } catch (e) {
      console.warn('Firestore file delete failed:', e.message);
    }
  }

  // Retirer de l'array
  sess.files.splice(fileIdx, 1);

  // Sauvegarder le client
  try {
    c._updatedAt = Date.now();
    await window._setDoc(window._doc(window._db, 'clients', clientId), c);
    showToast('Fichier supprimé', 'success');
  } catch (e) {
    showToast('Erreur: ' + e.message, 'error');
  }

  applyFilters();
  openDetail(clientId);
}

function editClient(id){
  const c = _clients.find(x=>x._id===id);
  if(!c) return;

  document.getElementById('ec-id').value       = id;
  document.getElementById('ec-nom').value      = c.nom       || '';
  document.getElementById('ec-email').value    = c.email     || '';
  document.getElementById('ec-tel').value      = c.tel       || '';
  document.getElementById('ec-activite').value = c.activite  || '';
  document.getElementById('ec-date').value     = c.dateEntree|| '';
  document.getElementById('ec-notes').value    = c.clientNotes || '';

  const sel = document.getElementById('ec-programme');
  sel.value = c.programme || 'BP 12 Mois - 12C';

  document.getElementById('editClientModal').classList.add('show');
}

function closeEditClientModal(){
  document.getElementById('editClientModal').classList.remove('show');
}

async function saveEditClient(){
  const id  = document.getElementById('ec-id').value;
  const nom = document.getElementById('ec-nom').value.trim();
  if(!nom){ showToast('Nom requis','error'); return; }

  const c = _clients.find(x=>x._id===id);
  if(!c) return;

  // Update only info fields — preserve sessions, plan, etc.
  c.nom          = nom;
  c.email        = document.getElementById('ec-email').value.trim();
  c.tel          = document.getElementById('ec-tel').value.trim();
  c.activite     = document.getElementById('ec-activite').value.trim();
  c.programme    = document.getElementById('ec-programme').value;
  c.dateEntree   = document.getElementById('ec-date').value;
  c.clientNotes  = document.getElementById('ec-notes').value.trim();

  // Update nbCoachingsTotal if programme changed
  const nbMatch = c.programme.match(/(\d+)C/);
  if(nbMatch) c.nbCoachingsTotal = parseInt(nbMatch[1]);

  try{
    c._updatedAt = Date.now();
    await window._setDoc(window._doc(window._db,'clients',id), c);
    closeEditClientModal();
    applyFilters(); renderRecentActivity();
    openDetail(id);
    showToast('✅ Informations mises à jour !','success');
  }catch(e){ showToast('Erreur: '+e.message,'error'); }
}

window.editClient=editClient;
window.closeEditClientModal=closeEditClientModal;
window.saveEditClient=saveEditClient;

</script>
