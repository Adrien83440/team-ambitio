<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Utilisateurs — Ambitio</title>
<link rel="stylesheet" href="sales.css"/>
<script src="nav.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#08080f;color:white;min-height:100vh}
.page{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.pg-head{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.pg-head-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:24px}
.pg-head h1{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;flex:1}
.pg-head-sub{font-size:13px;color:rgba(255,255,255,.4);margin-top:2px}
.bb{padding:10px 18px;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.bb-p{background:#8b5cf6;color:#fff}.bb-p:hover{background:#7c3aed}
.bb-o{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1)}.bb-o:hover{background:rgba(255,255,255,.12);color:#fff}
.bb-r{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}.bb-r:hover{background:rgba(239,68,68,.18)}
.bb-g{background:rgba(52,211,153,.1);color:#6ee7b7;border:1px solid rgba(52,211,153,.2)}.bb-g:hover{background:rgba(52,211,153,.18)}
.bi{width:100%;padding:10px 14px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);border-radius:10px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color .15s}
.bi:focus{border-color:#8b5cf6}
.bi::placeholder{color:rgba(255,255,255,.2)}
.bs{padding:10px 14px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);border-radius:10px;color:#fff;font-family:inherit;font-size:13px;outline:none;cursor:pointer}
.bs option{background:var(--bg2,#12121f)}

/* Search bar */
.search-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px}
.search-bar select{min-width:140px}

/* User cards */
.u-grid{display:flex;flex-direction:column;gap:8px}
.u-card{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;cursor:pointer;transition:all .15s}
.u-card:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.u-av{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-email{font-size:12px;color:rgba(255,255,255,.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;align-items:center}
.u-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:6px;white-space:nowrap}
.u-b-admin{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.u-b-coach{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.2)}
.u-b-sales{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)}
.u-b-csm{background:rgba(94,234,212,.12);color:#5eead4;border:1px solid rgba(94,234,212,.25)}
.u-b-active{background:rgba(52,211,153,.08);color:#34d399;border:1px solid rgba(52,211,153,.15)}
.u-b-invited{background:rgba(96,165,250,.08);color:#60a5fa;border:1px solid rgba(96,165,250,.15)}
.u-b-disabled{background:rgba(239,68,68,.08);color:#fca5a5;border:1px solid rgba(239,68,68,.15)}
.u-b-archived{background:rgba(148,163,184,.08);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}
.u-perms{font-size:11px;color:rgba(255,255,255,.3);flex-shrink:0;min-width:80px;text-align:right}
.u-empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);font-size:14px}

/* Archive modal */
.arch-banner{padding:12px 14px;border-radius:10px;background:rgba(148,163,184,.07);border:1px solid rgba(148,163,184,.18);margin-bottom:14px;font-size:12px;color:#cbd5e1;line-height:1.5}
.arch-banner b{color:#fff}
.arch-scan{padding:14px;border-radius:10px;background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.06);margin-bottom:12px}
.arch-scan-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.4);margin-bottom:8px;font-weight:700}
.arch-scan-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.arch-scan-row:last-child{border-bottom:0}
.arch-scan-row .lbl{flex:1;color:#e2e8f0}
.arch-scan-row .val{font-family:'JetBrains Mono',monospace;color:#fbbf24;font-weight:700;font-size:13px}
.arch-scan-row .val.zero{color:rgba(255,255,255,.3)}
.arch-confirm-input{font-family:'JetBrains Mono',monospace !important;letter-spacing:.04em}
.arch-warn{padding:10px 12px;border-radius:8px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#fca5a5;font-size:12px;line-height:1.5;margin-top:10px}
.bb-warn{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.35);color:#fbbf24}
.bb-warn:hover:not(:disabled){background:rgba(245,158,11,.22)}

/* ─── Section Couleurs équipe ─── */
.tc-section{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:18px 20px;
  margin-bottom:20px;
}
.tc-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.tc-title{
  font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;
  font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.tc-sub{
  font-size:11px;color:rgba(255,255,255,.35);
  margin-top:2px;
}
.tc-toggle{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);
  padding:5px 12px;border-radius:8px;
  font-family:inherit;font-size:11px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.tc-toggle:hover{background:rgba(255,255,255,.1);color:#fff}
.tc-body{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}
.tc-body.collapsed{display:none}
.tc-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  transition:all .15s;
}
.tc-item:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.tc-swatch{
  width:38px;height:38px;border-radius:10px;
  flex-shrink:0;
  border:2px solid rgba(255,255,255,.12);
  cursor:pointer;
  position:relative;
  transition:transform .15s;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;
  overflow:hidden;
}
.tc-swatch:hover{transform:scale(1.06)}
.tc-swatch input[type="color"]{
  position:absolute;inset:0;
  opacity:0;cursor:pointer;
  border:none;padding:0;
}
.tc-info{flex:1;min-width:0}
.tc-name{
  font-size:13px;font-weight:600;
  color:rgba(255,255,255,.9);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tc-meta{
  font-size:10.5px;color:rgba(255,255,255,.4);
  margin-top:2px;
  display:flex;gap:6px;align-items:center;
}
.tc-role-pill{
  font-size:9px;font-weight:700;padding:1.5px 6px;
  border-radius:4px;text-transform:uppercase;letter-spacing:.4px;
}
.tc-role-pill.coach{background:rgba(139,92,246,.18);color:#c4b5fd}
.tc-role-pill.sales{background:rgba(16,185,129,.18);color:#6ee7b7}
.tc-role-pill.setter{background:rgba(96,165,250,.18);color:#93c5fd}
.tc-role-pill.closer{background:rgba(245,158,11,.18);color:#fcd34d}
.tc-role-pill.admin{background:rgba(245,158,11,.18);color:#fbbf24}
.tc-role-pill.csm{background:rgba(94,234,212,.18);color:#5eead4}
.tc-role-pill.other{background:rgba(148,163,184,.15);color:#cbd5e1}
.tc-save-ind{
  font-size:10px;color:rgba(52,211,153,.9);
  opacity:0;transition:opacity .2s;
  font-weight:600;
}
.tc-item.saved .tc-save-ind{opacity:1}
.tc-empty{
  text-align:center;padding:20px;
  color:rgba(255,255,255,.35);font-size:12px;
  font-style:italic;
}

/* Modal */
.mo-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.mo-bg.on{display:flex}
.mo{background:var(--bg2,#0e0e1a);border:1px solid rgba(255,255,255,.08);border-radius:20px;width:100%;max-width:600px;box-shadow:0 32px 80px rgba(0,0,0,.6);animation:moIn .2s ease}
@keyframes moIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.mo-h{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.06)}
.mo-t{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:800;flex:1}
.mo-x{width:32px;height:32px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.mo-x:hover{background:rgba(255,255,255,.12);color:#fff}
.mo-b{padding:24px}
.mf{margin-bottom:14px}
.mf label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.mfr{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Role selector cards */
.role-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.role-opt{padding:12px 10px;border:1.5px solid rgba(255,255,255,.08);border-radius:12px;text-align:center;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.02)}
.role-opt:hover{background:rgba(255,255,255,.06)}
.role-opt.on{border-color:#8b5cf6;background:rgba(139,92,246,.08)}
.role-opt[data-role="csm"].on{border-color:#5eead4;background:rgba(94,234,212,.08)}
.role-opt[data-role="sales"].on{border-color:#10b981;background:rgba(16,185,129,.08)}
.role-opt[data-role="admin"].on{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.role-opt-icon{font-size:20px;margin-bottom:4px}
.role-opt-label{font-size:12px;font-weight:700}
.role-opt-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}

/* Method selector */
.method-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.method-opt{padding:12px;border:1.5px solid rgba(255,255,255,.08);border-radius:12px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.02)}
.method-opt:hover{background:rgba(255,255,255,.06)}
.method-opt.on{border-color:#8b5cf6;background:rgba(139,92,246,.08)}

/* Permission grid */
.perm-section{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.perm-title{font-size:13px;font-weight:800;margin-bottom:12px;font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif}
.perm-head{display:grid;grid-template-columns:1fr 80px 80px 80px;gap:4px;padding:0 4px;margin-bottom:6px}
.perm-head span{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;text-align:center}
.perm-head span:first-child{text-align:left}
.perm-row{display:grid;grid-template-columns:1fr 80px 80px 80px;gap:4px;padding:8px 4px;border-radius:8px;align-items:center}
.perm-row:nth-child(odd){background:rgba(255,255,255,.02)}
.perm-row-label{font-size:13px;font-weight:600}
.perm-row-section{font-size:10px;color:rgba(255,255,255,.25);margin-top:1px}
.perm-radio{display:flex;justify-content:center}
.perm-radio input[type="radio"]{display:none}
.perm-radio label{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;border:1.5px solid rgba(255,255,255,.08);transition:all .15s;background:rgba(255,255,255,.02)}
.perm-radio label:hover{background:rgba(255,255,255,.08)}
.perm-radio input[type="radio"]:checked+label.perm-none{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:#fca5a5}
.perm-radio input[type="radio"]:checked+label.perm-read{border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.1);color:#60a5fa}
.perm-radio input[type="radio"]:checked+label.perm-edit{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1);color:#34d399}

/* Quick actions */
.qa-bar{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000}
.toast{padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;background:#1a2e1a;border:1px solid rgba(16,185,129,.3);color:#6ee7b7;opacity:0;transition:all .3s;transform:translateY(10px)}
.toast.show{opacity:1;transform:translateY(0)}

/* Stats */
.u-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.u-stat{padding:14px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;text-align:center}
.u-stat-n{font-size:22px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif}
.u-stat-l{font-size:11px;color:rgba(255,255,255,.38);margin-top:2px}

@media(max-width:640px){
  .perm-head,.perm-row{grid-template-columns:1fr 60px 60px 60px}
  .mfr{grid-template-columns:1fr}
  .role-opts{grid-template-columns:1fr}
  .u-badges{display:none}
}

/* ═══ Password modal (sous-modal par dessus le modal edit) ═══ */
.pw-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:1200;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.pw-bg.on{display:flex}
.pw-mo{background:var(--bg2,#0e0e1a);border:1px solid rgba(255,255,255,.08);border-radius:20px;width:100%;max-width:560px;box-shadow:0 32px 80px rgba(0,0,0,.7);animation:moIn .2s ease}
.pw-h{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.06)}
.pw-t{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:800;flex:1}
.pw-t-sub{font-size:11px;color:rgba(255,255,255,.4);font-weight:500;margin-top:2px}
.pw-b{padding:20px 24px 24px}
.pw-section{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:14px;background:rgba(255,255,255,.02)}
.pw-section-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pw-section-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pw-section-ic.reset{background:rgba(96,165,250,.12);color:#60a5fa;border:1px solid rgba(96,165,250,.25)}
.pw-section-ic.set{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.pw-section-ic.self{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.25)}
.pw-section-title{font-size:14px;font-weight:700}
.pw-section-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px;line-height:1.4}
.pw-section-body{margin-top:6px}
.pw-link-box{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.pw-link-box input{flex:1;font-family:'JetBrains Mono',monospace;font-size:11px;padding:10px 12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#e2e8f0;outline:none;letter-spacing:.02em}
.pw-link-box .bb{flex-shrink:0}
.pw-email-status{font-size:11px;margin-top:8px;padding:8px 10px;border-radius:7px;line-height:1.4}
.pw-email-status.ok{background:rgba(52,211,153,.08);color:#6ee7b7;border:1px solid rgba(52,211,153,.2)}
.pw-email-status.warn{background:rgba(245,158,11,.08);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.pw-pwd-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pw-pwd-row-single{display:block;margin-top:10px}
.pw-hint{font-size:10.5px;color:rgba(255,255,255,.35);margin-top:6px;line-height:1.4}
.pw-warn{padding:10px 12px;border-radius:8px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);color:#fcd34d;font-size:11.5px;line-height:1.45;margin-top:10px}
.pw-success-box{margin-top:10px;padding:10px 12px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);border-radius:8px;font-size:12px;color:#6ee7b7;line-height:1.5}
@media(max-width:640px){
  .pw-pwd-row{grid-template-columns:1fr}
  .pw-link-box{flex-direction:column}
}
</style>
</head>
<body>
<div class="page">
  <div class="pg-head">
    <div class="pg-head-icon">🔑</div>
    <div>
      <h1>Utilisateurs</h1>
      <div class="pg-head-sub">Gestion des accès et permissions</div>
    </div>
    <button class="bb bb-o" id="btnSyncBooking" title="Créer les fiches expert Booking manquantes pour les membres existants">📅 Synchroniser Booking</button>
    <button class="bb bb-p" id="btnAdd">+ Nouvel utilisateur</button>
  </div>

  <div class="u-stats" id="stats"></div>

  <div class="search-bar">
    <input class="bi" id="searchQ" placeholder="🔍 Rechercher par nom ou email…"/>
    <select class="bs" id="filterRole">
      <option value="">Tous les rôles</option>
      <option value="admin">👑 Admin</option>
      <option value="coach">🎓 Coach</option>
      <option value="sales">📈 Sales</option>
      <option value="csm">💎 Customer Success</option>
    </select>
    <select class="bs" id="filterStatus">
      <option value="">Tous les statuts</option>
      <option value="active">✅ Actif</option>
      <option value="invited">📩 Invité</option>
      <option value="disabled">🚫 Désactivé</option>
      <option value="archived">🗄 Archivé</option>
    </select>
  </div>

  <!-- Couleurs équipe (colorimétrie pour coaching.html et autres modules) -->
  <div class="tc-section" id="teamColorsSection">
    <div class="tc-head">
      <div>
        <div class="tc-title">🎨 Couleurs équipe</div>
        <div class="tc-sub">Choisissez une couleur par membre — utilisée pour les cartes, badges, avatars dans toute l'app.</div>
      </div>
      <button class="tc-toggle" id="tcToggle">Masquer</button>
    </div>
    <div class="tc-body" id="teamColorsBody">
      <div class="tc-empty">Chargement des membres…</div>
    </div>
  </div>

  <div class="u-grid" id="userList"></div>
</div>

<!-- Create / Edit modal -->
<div class="mo-bg" id="modal">
  <div class="mo">
    <div class="mo-h">
      <div class="mo-t" id="moTitle">Nouvel utilisateur</div>
      <button class="mo-x" id="moClose">✕</button>
    </div>
    <div class="mo-b" id="moBody"></div>
  </div>
</div>

<!-- Password management modal (sous-modal par dessus le modal edit) -->
<div class="pw-bg" id="pwdModal">
  <div class="pw-mo">
    <div class="pw-h">
      <div style="flex:1">
        <div class="pw-t" id="pwdTitle">🔑 Gestion du mot de passe</div>
        <div class="pw-t-sub" id="pwdSubtitle"></div>
      </div>
      <button class="mo-x" id="pwdClose">✕</button>
    </div>
    <div class="pw-b" id="pwdBody"></div>
  </div>
</div>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

// ─── COULEURS ÉQUIPE (écrit dans _meta/team_members.members[slug].color) ───
// Le doc _meta/team_members peut stocker `members` soit en OBJET (slug→obj)
// soit en ARRAY (Firestore array-ify parfois). On gère les 2 cas : on lit
// en détectant le format et on RÉ-ÉCRIT dans le MÊME format pour préserver
// la structure existante.
// ══════════════════════════════════════════════════════════════════

let TEAM_MEMBERS_CACHE = null;         // liste normalisée pour l'UI
let TEAM_MEMBERS_RAW_FORMAT = 'object'; // 'object' | 'array'
let TEAM_MEMBERS_RAW_DATA = null;       // le champ members brut (pour préserver les index array)

// Palette de suggestions si aucune couleur définie
const COLOR_SUGGESTIONS = [
  '#3b82f6','#10b981','#f59e0b','#6366f1','#ef4444','#14b8a6',
  '#a16207','#7c3aed','#0891b2','#be185d','#0d9488','#dc2626',
  '#9333ea','#059669','#ea580c','#0284c7','#16a34a','#db2777'
];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}return Math.abs(h);}
function suggestColorFor(slug){ return COLOR_SUGGESTIONS[hashStr(slug||'x') % COLOR_SUGGESTIONS.length]; }

// ══════════════════════════════════════════════════════════════════
// ─── PROPAGATION VERS BOOKING (fiche expert booking_config) ───
// ══════════════════════════════════════════════════════════════════
// Quand un membre d'équipe est créé dans cette page, on crée
// automatiquement sa fiche expert dans booking_config/{id} (doc avec
// __type:'person') pour qu'il apparaisse dans Booking et puisse
// recevoir/gérer des RDV. La fiche est "inerte" au départ (aucune
// consultation assignée, aucun horaire) : aucun risque, elle se configure
// ensuite dans booking-admin.html.
//
// Liaison : firebaseUid = uid du membre → il pourra éditer SA fiche et
// connecter SON Google Agenda (cf. ownsBookingPerson dans firestore.rules).
// isCoach = true si le rôle est 'coach'.
//
// Règle Firestore : booking_config allow create:if isAdmin() → l'admin
// authentifié sur cette page écrit directement (pas de Cloud Function).

// Libellé "Rôle" lisible affiché sur la fiche expert
const BOOKING_ROLE_LABELS = { coach:'Coach', sales:'Closer', csm:'Customer Success', admin:'Admin' };

// Slug alpha minuscule (sans accents) pour la base de l'ID de fiche
function _bkSlugFromName(name){
  var base = (name||'expert').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,15);
  return base || 'expert';
}
function _bkRandSuffix(){
  return Math.random().toString(36).slice(2,6) + Date.now().toString(36).slice(-2);
}

// Construit l'objet fiche expert booking_config à partir d'un user
function buildBookingExpertDoc(opts){
  var role = opts.role || 'coach';
  return {
    __type: 'person',
    name: opts.displayName || (opts.email ? opts.email.split('@')[0] : 'Expert'),
    role: BOOKING_ROLE_LABELS[role] || 'Expert',
    color: suggestColorFor(opts.displayName || opts.uid || opts.email || 'x'),
    types: [],
    schedule: {},
    blockedDates: [],
    isCoach: role === 'coach',
    firebaseUid: opts.uid || null,
    personalEmail: opts.email || '',
    createdAt: new Date().toISOString(),
    createdVia: 'admin-users-auto'
  };
}

// Charge toutes les fiches expert (docs __type==='person') de booking_config
async function loadBookingExperts(){
  var snap = await getDocs(collection(db,'booking_config'));
  var list = [];
  snap.forEach(function(d){
    var v = d.data();
    if(v && v.__type==='person'){ v.id = d.id; list.push(v); }
  });
  return list;
}

// Cherche une fiche expert déjà associée à un user, pour éviter les
// doublons avec des fiches créées manuellement (coachs déjà présents non
// liés à un firebaseUid). Match prioritaire par firebaseUid, sinon par
// nom normalisé ou email de notification.
function _findExistingExpert(experts, user){
  var uid = user.uid;
  var nm  = _normName(user.displayName||'');
  var em  = (user.email||'').trim().toLowerCase();
  var byNameEmail = null;
  for(var i=0;i<experts.length;i++){
    var e = experts[i];
    if(uid && e.firebaseUid===uid) return {matched:true, byUid:true, byNameOrEmail:false, expert:e};
    if(!byNameEmail){
      var enm=_normName(e.name||'');
      var eem=(e.personalEmail||'').trim().toLowerCase();
      if((nm && enm && enm===nm) || (em && eem && eem===em)) byNameEmail=e;
    }
  }
  if(byNameEmail) return {matched:true, byUid:false, byNameOrEmail:true, expert:byNameEmail};
  return {matched:false};
}

// Crée (ou lie) la fiche expert pour un user si nécessaire.
// opts.experts : liste préchargée (optionnel). opts.linkExisting : lie une
// fiche trouvée par nom/email au lieu de la laisser non liée.
// Renvoie { created, linked, id, reason }
async function ensureBookingExpert(user, opts){
  opts = opts || {};
  var experts = opts.experts || await loadBookingExperts();
  var found = _findExistingExpert(experts, user);
  if(found.matched && found.byUid){
    return { created:false, linked:false, id:found.expert.id, reason:'already-linked' };
  }
  if(found.matched && found.byNameOrEmail){
    if(opts.linkExisting){
      var patch = { firebaseUid:user.uid };
      if(!found.expert.personalEmail && user.email) patch.personalEmail = user.email;
      await updateDoc(doc(db,'booking_config',found.expert.id), patch);
      return { created:false, linked:true, id:found.expert.id, reason:'linked-existing' };
    }
    return { created:false, linked:false, id:found.expert.id, reason:'exists-unlinked' };
  }
  // Aucune fiche → création
  var id = _bkSlugFromName(user.displayName||user.email) + '_' + _bkRandSuffix();
  var guard=0;
  while(experts.some(function(e){return e.id===id;}) && guard<5){
    id = _bkSlugFromName(user.displayName||user.email)+'_'+_bkRandSuffix(); guard++;
  }
  await setDoc(doc(db,'booking_config',id), buildBookingExpertDoc({
    uid:user.uid, displayName:user.displayName, email:user.email, role:user.role
  }));
  return { created:true, linked:false, id:id, reason:'created' };
}

  openModal('📅 Synchroniser Booking');

    var members=USERS.filter(function(u){return (u.status||'active')!=='archived';});
    var toCreate=[], unlinked=[], linked=[];
    members.forEach(function(u){
      var f=_findExistingExpert(experts,u);
      if(f.matched && f.byUid) linked.push({u:u,e:f.expert});
      else if(f.matched && f.byNameOrEmail) unlinked.push({u:u,e:f.expert});
      else toCreate.push({u:u});
    });
    window.__bkSync={toCreate:toCreate,unlinked:unlinked,linked:linked};
    renderBookingSyncReport();

    body.innerHTML='<div class="arch-warn" style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5;padding:12px;border-radius:10px">❌ Erreur analyse : '+esc(e.message)+'</div>';
  }
}

async function applyBookingSync(){
  var d=window.__bkSync||{toCreate:[],unlinked:[],linked:[]};
  var linkExisting=!!(document.getElementById('bkLinkExisting')||{}).checked;
  var btn=document.getElementById('bkApply'); if(btn){btn.disabled=true;btn.textContent='⏳ Application…';}
  try{
    var experts=await loadBookingExperts(); // fraîche pour l'anti-collision d'ID
    var nCreated=0,nLinked=0,nErr=0;
    for(var i=0;i<d.toCreate.length;i++){
      try{
        var r=await ensureBookingExpert(d.toCreate[i].u,{experts:experts});
        if(r.created){ nCreated++; experts.push({id:r.id,__type:'person',firebaseUid:d.toCreate[i].u.uid,name:d.toCreate[i].u.displayName,personalEmail:d.toCreate[i].u.email}); }
      }catch(e){ console.error('[bkSync] create failed',d.toCreate[i].u,e); nErr++; }
    }
    if(linkExisting){
      for(var j=0;j<d.unlinked.length;j++){
        try{ var rr=await ensureBookingExpert(d.unlinked[j].u,{experts:experts,linkExisting:true}); if(rr.linked)nLinked++; }
        catch(e){ console.error('[bkSync] link failed',d.unlinked[j].u,e); nErr++; }
      }
    }
    toast('✅ Booking : '+nCreated+' créée(s)'+(nLinked?', '+nLinked+' liée(s)':'')+(nErr?' · '+nErr+' erreur(s)':''));
    await openBookingSyncModal(); // re-scan → rapport rafraîchi
  }catch(e){
    console.error('[bkSync] apply error',e);
    toast('❌ '+e.message);
    if(btn){btn.disabled=false;btn.textContent='Appliquer';}
  }
}

async function loadTeamColors(){
  const body = document.getElementById('teamColorsBody');
  if(!body) return;
  try{
    const snap = await getDoc(doc(db,'_meta','team_members'));
    if(!snap.exists()){
      body.innerHTML = '<div class="tc-empty">Aucun membre dans <code>_meta/team_members</code>.<br>Lance migrate-team-members.js pour initialiser.</div>';
      return;
    }
    const data = snap.data() || {};
    const raw = data.members;

    // Normaliser en liste + mémoriser le format original
    const list = [];
    if(Array.isArray(raw)){
      TEAM_MEMBERS_RAW_FORMAT = 'array';
      TEAM_MEMBERS_RAW_DATA = raw.slice(); // copie pour préservation
      raw.forEach((entry, i) => {
        if(!entry || typeof entry !== 'object') return;
        const slug = entry.slug || ('m' + i);
        list.push({
          _rawIndex: i,
          slug: slug,
          name: entry.name || entry.displayName || slug,
          role: entry.role || '',
          color: entry.color || '',
          active: entry.active !== false,
          order: entry.order || 999
        });
      });
    } else if(raw && typeof raw === 'object'){
      TEAM_MEMBERS_RAW_FORMAT = 'object';
      TEAM_MEMBERS_RAW_DATA = Object.assign({}, raw);
      Object.keys(raw).forEach(slug => {
        const entry = raw[slug];
        if(!entry || typeof entry !== 'object') return;
        const realSlug = entry.slug || slug;
        list.push({
          _rawKey: slug,
          slug: realSlug,
          name: entry.name || entry.displayName || realSlug,
          role: entry.role || '',
          color: entry.color || '',
          active: entry.active !== false,
          order: entry.order || 999
        });
      });
    } else {
      body.innerHTML = '<div class="tc-empty">Champ <code>members</code> absent ou invalide.</div>';
      return;
    }

    list.sort((a,b) => (a.order||999) - (b.order||999) || a.name.localeCompare(b.name));
    TEAM_MEMBERS_CACHE = list;
    renderTeamColors();
  }catch(e){
    console.error('loadTeamColors error:', e);
    body.innerHTML = '<div class="tc-empty" style="color:#fca5a5">Erreur chargement : ' + esc(e.message) + '</div>';
  }
}

function renderTeamColors(){
  const body = document.getElementById('teamColorsBody');
  if(!body || !TEAM_MEMBERS_CACHE) return;
  if(TEAM_MEMBERS_CACHE.length === 0){
    body.innerHTML = '<div class="tc-empty">Aucun membre trouvé.</div>';
    return;
  }
  body.innerHTML = TEAM_MEMBERS_CACHE.map(m => {
    const color = m.color || suggestColorFor(m.slug);
    const isDefault = !m.color;
    const initials = (m.name || m.slug).slice(0,2).toUpperCase();
    const roleCls = ['coach','sales','setter','closer','admin'].includes(m.role) ? m.role : 'other';
    const roleLbl = m.role ? m.role : '—';
    return `<div class="tc-item" data-slug="${esc(m.slug)}">
      <div class="tc-swatch" style="background:${color}" title="Cliquez pour changer">
        ${initials}
        <input type="color" value="${color}" onchange="window.__saveTeamColor('${esc(m.slug)}', this.value)"/>
      </div>
      <div class="tc-info">
        <div class="tc-name">${esc(m.name)}${!m.active ? ' <span style="color:rgba(255,255,255,.3);font-weight:400">(inactif)</span>' : ''}</div>
        <div class="tc-meta">
          <span class="tc-role-pill ${roleCls}">${esc(roleLbl)}</span>
          <span>${esc(m.slug)}</span>
          ${isDefault ? '<span style="color:rgba(148,163,184,.7)">· auto</span>' : ''}
        </div>
      </div>
      <div class="tc-save-ind">✓</div>
    </div>`;
  }).join('');
}

// Exposé en global pour l'onchange inline du <input type="color">
window.__saveTeamColor = async function(slug, newColor){
  if(!TEAM_MEMBERS_CACHE || !TEAM_MEMBERS_RAW_DATA){ toast('❌ Données non chargées'); return; }
  const member = TEAM_MEMBERS_CACHE.find(m => m.slug === slug);
  if(!member){ toast('❌ Membre introuvable : ' + slug); return; }

  try{
    // Mettre à jour la structure brute (en préservant le format array ou object)
    if(TEAM_MEMBERS_RAW_FORMAT === 'array'){
      const idx = member._rawIndex;
      if(idx == null || !TEAM_MEMBERS_RAW_DATA[idx]){ throw new Error('Index introuvable'); }
      TEAM_MEMBERS_RAW_DATA[idx] = Object.assign({}, TEAM_MEMBERS_RAW_DATA[idx], { color: newColor });
    } else {
      const key = member._rawKey;
      if(!key || !TEAM_MEMBERS_RAW_DATA[key]){ throw new Error('Clé introuvable'); }
      TEAM_MEMBERS_RAW_DATA[key] = Object.assign({}, TEAM_MEMBERS_RAW_DATA[key], { color: newColor });
    }

    // Écrire dans Firestore — updateDoc pour ne pas écraser les autres champs du doc
    await updateDoc(doc(db,'_meta','team_members'), { members: TEAM_MEMBERS_RAW_DATA });

    // Mettre à jour le cache UI
    member.color = newColor;

    // Feedback visuel discret

// ─── Build permission grid HTML ───
function buildPermGrid(modules,prefix){
  var h='<div class="perm-section"><div class="perm-title">📋 Permissions par module</div>';
  h+='<div class="perm-head"><span>Module</span><span>❌ Aucun</span><span>👁 Lecture</span><span>✏️ Édition</span></div>';
  var lastSec='';
  PERM_KEYS.forEach(function(k){
    var sec=PERM_SECTIONS[k]||'';
    var val=modules[k]||'none';
    if(sec!==lastSec){
      h+='<div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.8px;padding:10px 4px 4px">'+sec+'</div>';
      lastSec=sec;
    }
    h+='<div class="perm-row">';
    h+='<div class="perm-row-label">'+esc(PERM_LABELS[k]||k)+'</div>';
    ['none','read','edit'].forEach(function(v){
      var id=prefix+'_'+k+'_'+v;
      var icons={none:'✕',read:'👁',edit:'✏️'};
      h+='<div class="perm-radio"><input type="radio" name="'+prefix+'_'+k+'" id="'+id+'" value="'+v+'"'+(val===v?' checked':'')+'/><label for="'+id+'" class="perm-'+v+'">'+icons[v]+'</label></div>';
    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function readPermGrid(prefix){
  var mods={};
  PERM_KEYS.forEach(function(k){
    var radios=document.querySelectorAll('input[name="'+prefix+'_'+k+'"]');
    radios.forEach(function(r){if(r.checked)mods[k]=r.value;});
    if(!mods[k])mods[k]='none';
  });
  return mods;
}

async function handleCreate(){
  var email=document.getElementById('cEmail').value.trim();
  var firstname=document.getElementById('cFirstname').value.trim();
  var lastname=document.getElementById('cLastname').value.trim();
  var displayName=((firstname+' '+lastname).trim())||email.split('@')[0];
  var roleEl=document.querySelector('.role-opt.on');
  var role=roleEl?roleEl.dataset.role:'coach';
  var methodEl=document.querySelector('.method-opt.on');
  var method=methodEl?methodEl.dataset.method:'invite';

  if(!email){toast('⚠️ Email requis');return;}

  var password;
  if(method==='direct'){
    password=document.getElementById('cPwd').value;
    if(!password||password.length<6){toast('⚠️ Mot de passe min. 6 caractères');return;}
  }else{
    password=crypto.getRandomValues(new Uint8Array(16)).reduce(function(s,b){return s+b.toString(36);},'').slice(0,20);
  }

  var btn=document.getElementById('cSubmit');
  btn.disabled=true;btn.textContent='⏳ Création…';

  try{
    // Create user via secondary app (to not sign out admin)
    var secondApp=initializeApp(FBCFG,'_create_'+Date.now());
    var secondAuth=getAuth(secondApp);
    var result=await createUserWithEmailAndPassword(secondAuth,email,password);
    var uid=result.user.uid;

    // Sign out from secondary immediately
    var signOutMod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    await signOutMod.signOut(secondAuth);
    await deleteApp(secondApp);

    // Read permissions from grid
    var modules=readPermGrid('c');

    // Create Firestore user doc
    var userData={
      email:email,
      displayName:displayName,
      role:role,
      status:method==='invite'?'invited':'active',
      modules:modules,
      createdAt:new Date().toISOString(),
      createdBy:currentUid
    };
    await setDoc(doc(db,'users',uid),userData);

    // ─── Propagation automatique vers Booking (fiche expert booking_config) ───
    // Crée la fiche expert pour que le membre apparaisse dans Booking et
    // puisse recevoir/gérer des RDV. N'interrompt jamais la création du
    // compte si elle échoue (Booking pourra être synchronisé après coup
    // via le bouton « Synchroniser Booking »).
    var bkMsg='';
    try{
      var bkRes=await ensureBookingExpert({uid:uid,displayName:displayName,email:email,role:role});
      if(bkRes.created) bkMsg=' · 📅 fiche Booking créée';
      else if(bkRes.reason==='exists-unlinked') bkMsg=' · 📅 fiche Booking existante (non liée)';
    }catch(bkErr){
      console.error('[handleCreate] booking expert auto-create failed:',bkErr);
      bkMsg=' · ⚠️ fiche Booking à créer manuellement';
    }

    // Send password reset for invitation
    if(method==='invite'){
      await sendPasswordResetEmail(auth,email);
    }

    toast((method==='invite'?'✅ Invitation envoyée à '+email:'✅ Utilisateur créé')+bkMsg);
    closeModal();
    await loadUsers();
  }catch(e){
    console.error('Create error:',e);
    var msgs={
      'auth/email-already-in-use':'Cet email est déjà utilisé',
      'auth/invalid-email':'Email invalide',
      'auth/weak-password':'Mot de passe trop faible (min. 6 car.)'
    };
    toast('❌ '+(msgs[e.code]||e.message));
    btn.disabled=false;btn.textContent='Créer l\'utilisateur';
  }
}

async function handleSave(uid){
  var btn=document.getElementById('eSave');
  btn.disabled=true;btn.textContent='⏳…';
  try{
    // Parse les zones texte multilignes en arrays
    function parseList(id){
      var raw=(document.getElementById(id)||{}).value||'';
      return raw.split(/[\n,;]+/).map(function(s){return s.trim();}).filter(Boolean);
    }
    var afFormIds=readAlteoFormsAccess();
    var upd={
      displayName:document.getElementById('eName').value.trim(),
      role:document.getElementById('eRole').value,
      status:document.getElementById('eStatus').value,
      ringoverPhones:parseList('ePhones'),
      workEmails:parseList('eEmails'),
      modules:readPermGrid('e')
    };
    if(afFormIds!==null)upd.alteoformsFormIds=afFormIds;
    var paymentsEl=document.getElementById('ePaymentsAccess');
    if(paymentsEl)upd.paymentsAccess=paymentsEl.checked;
    var trigEl=document.getElementById('ePaymentsTrigger');
    if(trigEl)upd.paymentsTrigger=trigEl.checked;
    var sigEl=document.getElementById('eSignaturesAccess');
    if(sigEl)upd.signaturesAccess=sigEl.checked;
    await updateDoc(doc(db,'users',uid),upd);

    // ─── Sync vers _meta/team_members (visibilité Lead Live + identité équipe) ───
    var inLMEl = document.getElementById('eInLeadsModule');
    var eligibleEl = document.getElementById('eEligibleForLeads');
    var tmRawKey = window.__editingTmRawKey;
    if (inLMEl && tmRawKey != null && TEAM_MEMBERS_RAW_DATA) {
      var tmPatch = {
        inLeadsModule: inLMEl.checked,
        eligibleForLeads: eligibleEl ? eligibleEl.checked : false
      };
      var slugVal = (document.getElementById('eTmSlug') || {}).value;
      var colorVal = (document.getElementById('eTmColorHex') || {}).value;
      var shortVal = (document.getElementById('eTmShortName') || {}).value;
      var initVal = (document.getElementById('eTmInitials') || {}).value;
      if (slugVal && slugVal.trim()) tmPatch.slug = slugVal.trim();
      if (colorVal && /^#[0-9a-fA-F]{6}$/.test(colorVal)) tmPatch.color = colorVal;
      if (shortVal != null) tmPatch.shortName = shortVal.trim();
      if (initVal != null) tmPatch.initials = (initVal.trim() || '?').toUpperCase().slice(0, 3);

      // Applique sur RAW_DATA en préservant le format (array vs object)
      if (TEAM_MEMBERS_RAW_FORMAT === 'array' && Array.isArray(TEAM_MEMBERS_RAW_DATA)) {
        if (TEAM_MEMBERS_RAW_DATA[tmRawKey]) {
          TEAM_MEMBERS_RAW_DATA[tmRawKey] = Object.assign({}, TEAM_MEMBERS_RAW_DATA[tmRawKey], tmPatch);
        }
      } else if (TEAM_MEMBERS_RAW_FORMAT === 'object' && TEAM_MEMBERS_RAW_DATA[tmRawKey]) {
        TEAM_MEMBERS_RAW_DATA[tmRawKey] = Object.assign({}, TEAM_MEMBERS_RAW_DATA[tmRawKey], tmPatch);
      }
      await updateDoc(doc(db,'_meta','team_members'), { members: TEAM_MEMBERS_RAW_DATA });
      // Recharge le cache pour que la prochaine ouverture soit fraîche
      loadTeamColors();
    }

    toast('✅ Utilisateur mis à jour');
    closeModal();
    await loadUsers();
  }catch(e){
    console.error(e);toast('❌ Erreur: '+e.message);
    btn.disabled=false;btn.textContent='💾 Enregistrer';
  }
}

// Génère un MDP aléatoire facile à dicter (16 car alphanum sans ambigus)
function generateRandomPassword(){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  var pwd = '';
  var arr = new Uint32Array(16);
  window.crypto.getRandomValues(arr);
  for(var i=0; i<16; i++){
    pwd += chars[arr[i] % chars.length];
  }
  return pwd;
}

// Appel backend authentifié avec idToken
async function callAdminPassword(payload){
  var user = auth.currentUser;
  if(!user) throw new Error('Session expirée — reconnecte-toi');
  var idToken = await user.getIdToken();
  var resp = await fetch('/api/admin-password', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + idToken
    },
    body: JSON.stringify(payload)
  });
  var data = await resp.json().catch(function(){ return {}; });
  if(!resp.ok) throw new Error(data.error || ('HTTP '+resp.status));
  return data;
}

async function handleSendResetLink(uid){
  var btn = document.getElementById('pwdSendReset');
  var resultDiv = document.getElementById('pwdResetResult');
  btn.disabled = true;
  btn.textContent = '⏳ Envoi en cours…';
  resultDiv.style.display = 'none';
  resultDiv.innerHTML = '';
  try{
    var data = await callAdminPassword({ action: 'sendResetLink', uid: uid });
    var html = '';
    if(data.emailSent){
      html += '<div class="pw-email-status ok">✅ Email envoyé à '+esc(data.targetEmail||'')+'</div>';
    }else{
      html += '<div class="pw-email-status warn">⚠️ Email non envoyé ('+esc(data.emailError||'erreur inconnue')+') — utilise le lien ci-dessous</div>';
    }
    html += '<div class="pw-link-box">';
    html +=   '<input type="text" id="pwdLinkCopy" readonly value="'+esc(data.link)+'"/>';
    html +=   '<button class="bb bb-o" id="pwdLinkBtn">📋 Copier</button>';
    html += '</div>';
    html += '<div class="pw-hint">Le lien expire après 1h. Tu peux le partager par WhatsApp/SMS/vocal si besoin.</div>';
    resultDiv.innerHTML = html;
    resultDiv.style.display = 'block';
    document.getElementById('pwdLinkBtn').addEventListener('click', function(){
      var input = document.getElementById('pwdLinkCopy');
      input.select();
      navigator.clipboard.writeText(input.value).then(function(){
        document.getElementById('pwdLinkBtn').textContent = '✅ Copié';
        setTimeout(function(){
          var b = document.getElementById('pwdLinkBtn');
          if(b) b.textContent = '📋 Copier';
        }, 2000);
      }).catch(function(){ toast('❌ Impossible de copier — sélectionne manuellement'); });
    });
    toast(data.emailSent ? '✅ Lien envoyé par email' : '⚠️ Email échoué — lien disponible ci-dessous');
  }catch(e){
    console.error(e);
    toast('❌ '+e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = '📧 Envoyer le lien de reset';
  }
}

}

// ════════════════════════════════════════════════════════════════════
//   ARCHIVAGE & TRANSFERT
// ════════════════════════════════════════════════════════════════════
//
// Architecture :
//  • USERS (firebase auth + role + permissions) — ce module
//  • _meta/team_members.members — slug → {shortName, displayName, color, active, order, ...}
//  • leads/{id}.assignedTo — string slug (= clé d'un member)
//
// Pas de lien formel user→slug. L'admin confirme le slug équipe correspondant
// dans le modal d'archivage (auto-matché par nom).
//
// Archiver = 3 actions liées :
//  1. Transférer leads.assignedTo (fromSlug → toSlug) — writeBatch chunks 450
//  2. _meta/team_members.members[fromSlug].active = false
//  3. users/{authUid}.status = 'archived' + métadonnées + audit_log

const ARCHIVE_CLOSED_STAGES = CLOSED_STAGES; // alias local

// Lit _meta/team_members et retourne {raw, members:[{slug,...}], wasArray}
async function loadTeamMembersDoc(){
  const snap = await getDoc(doc(db,'_meta','team_members'));
  if(!snap.exists()) return {raw:null, members:[], wasArray:false};
  const data = snap.data() || {};
  const rawMembers = data.members;
  const members = [];
  let wasArray = false;
  if(Array.isArray(rawMembers)){
    wasArray = true;
    rawMembers.forEach((entry,i)=>{
      if(!entry || typeof entry!=='object') return;
      const slug = entry.slug || ('m'+i);
      members.push(Object.assign({slug:slug}, entry));
    });
  }else if(rawMembers && typeof rawMembers==='object'){
    Object.keys(rawMembers).forEach(slug=>{
      const entry = rawMembers[slug];
      if(!entry || typeof entry!=='object') return;
      const realSlug = entry.slug || slug;
      members.push(Object.assign({slug:realSlug}, entry));
    });
  }
  members.sort((a,b)=>(a.order||999)-(b.order||999));
  return {raw:data, members:members, wasArray:wasArray};
}

// Réécrit _meta/team_members.members en respectant le format d'origine (object|array)
async function writeTeamMembersDoc(tmDoc, mutator){
  // mutator: function(members[]) → modifie en place
  mutator(tmDoc.members);
  let newMembersField;
  if(tmDoc.wasArray){
    newMembersField = tmDoc.members.map(m=>Object.assign({},m));
  }else{
    newMembersField = {};
    tmDoc.members.forEach(m=>{ newMembersField[m.slug] = Object.assign({},m); });
  }
  await updateDoc(doc(db,'_meta','team_members'), {members:newMembersField});
}

// Normalise un nom pour matching tolérant accents/casse
function _normName(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'');
}

// Auto-match : trouve le slug team_member le plus probable pour un user
function autoMatchSlug(user, members){
  const candidates = [user.displayName, user.email && user.email.split('@')[0]].filter(Boolean).map(_normName);
  for(const m of members){
    const variants = [m.slug, m.shortName, m.displayName].filter(Boolean).map(_normName);
    for(const c of candidates){
      for(const v of variants){
        if(c && v && (c===v || c.indexOf(v)>=0 || v.indexOf(c)>=0)) return m.slug;
      }
    }
  }
  return '';
}

// Compte les leads assignés à un slug, séparant pipeline-actifs vs clos
async function scanLeadsForSlug(slug){
  if(!slug) return {active:0, closed:0, total:0};
  const q = query(collection(db,'leads'), where('assignedTo','==',slug));
  const snap = await getDocs(q);
  let active=0, closed=0;
  snap.forEach(d=>{
    const stage = (d.data()||{}).stage || '';
    if(ARCHIVE_CLOSED_STAGES.indexOf(stage)>=0) closed++;
    else active++;
  });
  return {active:active, closed:closed, total:active+closed};
}

let _archState = null; // {user, tmDoc, fromSlug, scan}

async function openArchiveModal(u){
  if(u.uid===currentUid){toast('⚠️ Tu ne peux pas archiver ton propre compte');return;}
  closeModal();
  openModal('🗄 Archiver — '+(u.displayName||u.email));
  document.getElementById('moBody').innerHTML='<div class="u-empty">Chargement des membres équipe…</div>';

  let tmDoc;
  try{
    tmDoc = await loadTeamMembersDoc();
  }catch(e){
    document.getElementById('moBody').innerHTML='<div class="arch-warn">❌ Erreur lecture _meta/team_members : '+esc(e.message)+'</div>';
    return;
  }
  if(!tmDoc.members.length){
    document.getElementById('moBody').innerHTML='<div class="arch-warn">⚠️ Aucun membre dans <code>_meta/team_members</code>. Lance la migration équipe d\'abord.</div>';
    return;
  }

  const guess = autoMatchSlug(u, tmDoc.members);
  _archState = {user:u, tmDoc:tmDoc, fromSlug:guess, scan:null};

  renderArchiveModal();
  if(guess) refreshArchiveScan();
}

function renderArchiveModal(){
  const st = _archState; if(!st) return;
  const u = st.user;
  const members = st.tmDoc.members;
  const activeMembers = members.filter(m=>m.active!==false && m.slug!==st.fromSlug);

  let h = '';
  h += '<div class="arch-banner">';
  h += 'Tu vas archiver <b>'+esc(u.displayName||u.email)+'</b>. Le compte Firebase Auth ne sera <b>pas supprimé</b> (tu peux le réactiver). Les leads attribués au membre équipe correspondant seront transférés vers le destinataire choisi. Les données historiques (EOD, commissions, setting/closing) restent intactes au nom de la personne archivée.';
  h += '</div>';

  // 1. Slug source
  h += '<div class="mf"><label>Membre équipe correspondant (source)</label>';
  h += '<select class="bs" id="archFrom" style="width:100%">';
  h += '<option value="">— Sélectionner —</option>';
  members.forEach(m=>{
    const lab = (m.displayName||m.shortName||m.slug)+(m.active===false?' 🔒 (déjà inactif)':'');
    h += '<option value="'+esc(m.slug)+'"'+(m.slug===st.fromSlug?' selected':'')+'>'+esc(lab)+'</option>';
  });
  h += '</select>';
  h += '<div style="font-size:10px;color:rgba(255,255,255,.4);margin-top:4px">Auto-matché par nom. Corrige si nécessaire.</div></div>';

  // 2. Scan compteurs
  h += '<div class="arch-scan" id="archScanBox"><div class="arch-scan-h">📊 Leads attribués</div>';
  if(!st.fromSlug){
    h += '<div style="color:rgba(255,255,255,.3);font-size:12px;text-align:center;padding:10px">Sélectionne un membre source pour scanner</div>';
  }else if(!st.scan){
    h += '<div style="color:rgba(255,255,255,.4);font-size:12px;text-align:center;padding:10px">⏳ Scan en cours…</div>';
  }else{
    const s = st.scan;
    h += '<div class="arch-scan-row"><span class="lbl">🟢 Leads en pipeline actif</span><span class="val'+(s.active?'':' zero')+'">'+s.active+'</span></div>';
    h += '<div class="arch-scan-row"><span class="lbl">⚫ Leads en stages clos (gagné/perdu/poubelle)</span><span class="val'+(s.closed?'':' zero')+'">'+s.closed+'</span></div>';
    h += '<div class="arch-scan-row"><span class="lbl"><b>Total</b></span><span class="val">'+s.total+'</span></div>';
  }
  h += '</div>';

  // 3. Destinataire
  h += '<div class="mf"><label>Transférer les leads vers</label>';
  h += '<select class="bs" id="archTo" style="width:100%">';
  h += '<option value="">— Sélectionner un destinataire —</option>';
  activeMembers.forEach(m=>{
    h += '<option value="'+esc(m.slug)+'">'+esc(m.displayName||m.shortName||m.slug)+'</option>';
  });
  h += '</select></div>';

  // 4. Toggle inclure clos
  h += '<div class="mf" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(15,23,42,.4);border-radius:10px;border:1px solid rgba(255,255,255,.05)">';
  h += '<input type="checkbox" id="archInclClosed" style="width:16px;height:16px;cursor:pointer"/>';
  h += '<label for="archInclClosed" style="margin:0;cursor:pointer;font-size:12px;color:#cbd5e1">Inclure aussi les leads en stages clos (par défaut : non)</label>';
  h += '</div>';

  // 5. Note bookings
  h += '<div class="arch-warn" style="background:rgba(96,165,250,.07);border-color:rgba(96,165,250,.2);color:#93c5fd"><b>ℹ Bookings non transférés.</b> Les RDV (collection <code>bookings</code>) sont liés aux experts définis dans <code>booking_config</code>, indépendamment des comptes utilisateurs. Si la personne archivée était aussi un expert booking, va dans <b>Booking → Experts</b> pour transférer manuellement les RDV.</div>';

  // 6. Confirmation
  const confirmName = u.displayName || u.email || '?';
  h += '<div class="mf" style="margin-top:14px"><label>Pour confirmer, tape <b style="color:#fbbf24">'+esc(confirmName)+'</b></label>';
  h += '<input class="bi arch-confirm-input" id="archConfirm" placeholder="'+esc(confirmName)+'" autocomplete="off"/></div>';

  // 7. Boutons
  h += '<div style="display:flex;gap:10px;margin-top:18px">';
  h += '<button class="bb bb-o" id="archCancel">Annuler</button>';
  h += '<button class="bb bb-warn" id="archGo" style="flex:1" disabled>🗄 Archiver et transférer</button>';
  h += '</div>';

  document.getElementById('moBody').innerHTML = h;

  document.getElementById('archFrom').addEventListener('change', function(){
    _archState.fromSlug = this.value;
    _archState.scan = null;
    renderArchiveModal();
    if(this.value) refreshArchiveScan();
  });
  document.getElementById('archCancel').addEventListener('click', closeModal);
  const goBtn = document.getElementById('archGo');
  const confirmInput = document.getElementById('archConfirm');
  function refreshGoState(){
    const ok = _archState.fromSlug
      && document.getElementById('archTo').value
      && _archState.scan
      && _normName(confirmInput.value) === _normName(confirmName);
    goBtn.disabled = !ok;
  }
  confirmInput.addEventListener('input', refreshGoState);
  document.getElementById('archTo').addEventListener('change', refreshGoState);
  goBtn.addEventListener('click', function(){
    handleArchive(
      _archState.user,
      _archState.fromSlug,
      document.getElementById('archTo').value,
      document.getElementById('archInclClosed').checked
    );
  });
}

async function refreshArchiveScan(){
  const slug = _archState.fromSlug;
  try{
    const scan = await scanLeadsForSlug(slug);
    if(_archState && _archState.fromSlug===slug){
      _archState.scan = scan;
      renderArchiveModal();
    }
  }catch(e){
    console.error('[archive scan]',e);
    toast('❌ Scan leads : '+e.message);
  }
}

async function handleArchive(u, fromSlug, toSlug, includeClosed){
  if(!fromSlug || !toSlug || fromSlug===toSlug){toast('⚠️ Source et destinataire invalides');return;}
  const goBtn = document.getElementById('archGo');
  goBtn.disabled = true; goBtn.textContent = '⏳ Archivage en cours…';
  try{
    // 1. Récupérer tous les leads source
    const leadsSnap = await getDocs(query(collection(db,'leads'), where('assignedTo','==',fromSlug)));
    const targets = [];
    leadsSnap.forEach(d=>{
      const stage = (d.data()||{}).stage || '';
      if(!includeClosed && ARCHIVE_CLOSED_STAGES.indexOf(stage)>=0) return;
      targets.push(d.id);
    });

    // 2. Batch update par chunks de 450
    const CHUNK = 450;
    for(let i=0;i<targets.length;i+=CHUNK){
      const batch = writeBatch(db);
      const slice = targets.slice(i,i+CHUNK);
      slice.forEach(id=>{
        batch.update(doc(db,'leads',id), {
          assignedTo: toSlug,
          archivedFromSlug: fromSlug,
          updatedAt: serverTimestamp()
        });
      });
      await batch.commit();
    }

    // 3. Désactiver le member dans _meta/team_members
    await writeTeamMembersDoc(_archState.tmDoc, function(members){
      members.forEach(m=>{ if(m.slug===fromSlug){ m.active = false; m.archivedAt = new Date().toISOString(); }});
    });

    // 4. Marquer le user comme archivé
    await updateDoc(doc(db,'users',u.uid), {
      status: 'archived',
      archivedAt: serverTimestamp(),
      archivedBy: currentUid,
      archivedFromSlug: fromSlug,
      archivedToSlug: toSlug,
      archiveTransferCount: targets.length,
      archiveIncludedClosed: !!includeClosed
    });

    // 5. Audit log
    try{
      await addDoc(collection(db,'audit_log'), {
        action: 'archive_user',
        targetUid: u.uid,
        targetName: u.displayName || u.email || '',
        byUid: currentUid,
        at: serverTimestamp(),
        fromSlug: fromSlug,
        toSlug: toSlug,
        transferCount: targets.length,
        includeClosed: !!includeClosed
      });
    }catch(e){console.warn('[audit_log] write failed (non bloquant):',e.message);}

    toast('✅ Archivé — '+targets.length+' lead'+(targets.length>1?'s':'')+' transféré'+(targets.length>1?'s':''));
    _archState = null;
    closeModal();
    await loadUsers();
  }catch(e){
    console.error('[handleArchive]',e);
    toast('❌ '+e.message);
    if(goBtn){ goBtn.disabled = false; goBtn.textContent = '🗄 Archiver et transférer'; }
  }
}

async function handleReactivate(u){
  if(!confirm('Réactiver le compte de "'+(u.displayName||u.email)+'" ?\n\nLe compte redevient actif et le membre équipe correspondant est ré-activé.\n\nNote : les leads déjà transférés ne reviennent PAS automatiquement.'))return;
  try{
    const fromSlug = u.archivedFromSlug;
    if(fromSlug){
      const tmDoc = await loadTeamMembersDoc();
      await writeTeamMembersDoc(tmDoc, function(members){
        members.forEach(m=>{ if(m.slug===fromSlug){ m.active = true; delete m.archivedAt; }});
      });
    }
    await updateDoc(doc(db,'users',u.uid), {
      status: 'active',
      archivedAt: deleteField(),
      archivedBy: deleteField(),
      archivedFromSlug: deleteField(),
      archivedToSlug: deleteField(),
      archiveTransferCount: deleteField(),
      archiveIncludedClosed: deleteField(),
      reactivatedAt: serverTimestamp(),
      reactivatedBy: currentUid
    });
    try{
      await addDoc(collection(db,'audit_log'), {
        action: 'reactivate_user',
        targetUid: u.uid,
        targetName: u.displayName || u.email || '',
        byUid: currentUid,
        at: serverTimestamp(),
        restoredSlug: fromSlug || null
      });
    }catch(e){console.warn('[audit_log]',e.message);}
    toast('♻ Compte réactivé');
    closeModal();
    await loadUsers();
  }catch(e){
    console.error('[handleReactivate]',e);
    toast('❌ '+e.message);
  }
}
