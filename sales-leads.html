// Guard anti-double-listener : Firebase re-fire onAuthStateChanged à chaque
// refresh de token (~1h), ce qui empile les listeners sans cleanup → doublons
// de notifications lead et d'événements de booking traités plusieurs fois.
var _leadsListenerUnsub = null;
var _bookingBridgeUnsub = null;
var _leadsResurrectListenerUnsub = null;

// IDs des leads ressuscités (vus via le second listener mais hors fenêtre 30j
// du listener principal). Sert à poser le badge "🔄 Réactivé" dans renderCard
// et à déclencher popup + son sur changement de lastBookingAt.
var resurrectedLeadIds = {};
var lastBookingTimestamps = {};

// Listener parallèle pour les RE-OPTIN webhook (lead déjà CRM qui re-optin VSL).
// Pose le drapeau _resurrectedOptin pour afficher le badge "🔄 Déjà CRM".
var _leadsOptinResurrectListenerUnsub = null;
var optinResurrectedLeadIds = {};
var lastOptinTimestamps = {};

function getCurrentVoiceUser() {
  // Construit l'auteur d'un vocal à partir de l'auth Firebase + nav.js
  // (TEAM_MEMBERS exposé globalement). Si introuvable, on retombe sur un
  // identifiant générique pour ne pas bloquer l'enregistrement.
  var u = firebase.auth().currentUser;
  if (!u) return null;
  var members = window.TEAM_MEMBERS_LIST || [];
  var match = null;
  for (var i = 0; i < members.length; i++) {
    if (members[i].firebaseUid === u.uid || members[i].uid === u.uid) {
      match = members[i];
      break;
    }
  }
  return {
    uid: u.uid,
    email: u.email || '',
    slug: match ? match.slug : (u.email ? u.email.split('@')[0] : 'user'),
    name: match ? (match.fullName || match.name || match.slug) : (u.displayName || u.email || 'Utilisateur'),
    color: match ? match.color : '#6b7280',
    initials: match ? match.initials : ((u.email || '?')[0] || '?').toUpperCase()
  };
}

/* ═══ MENTIONS — parsing @slug et autocomplete dans la zone Note ═══
   Pattern :
     - L'utilisateur tape "@" dans le textarea note → un dropdown apparaît
       sous le caret, listant les membres actifs filtrés par les caractères
       tapés ensuite.
     - Au clic sur un membre, "@slug " est inséré dans le texte.
     - À la sauvegarde de la note, parseMentions() extrait tous les "@slug"
       du texte et les résout vers les firebaseUid des membres correspondants.
     - Le doc note résultant a un champ mentions: [uid, uid] qui déclenche
       la Cloud Function onLeadNoteMentionNotify côté backend. */

function parseMentions(text) {
  if (!text) return [];
  var members = window.TEAM_MEMBERS_LIST || [];
  var slugRegex = /@([a-zA-Z0-9_\-]+)/g;
  var found = {};
  var match;
  while ((match = slugRegex.exec(text)) !== null) {
    var slug = match[1].toLowerCase();
    for (var i = 0; i < members.length; i++) {
      var m = members[i];
      if (m && m.slug && m.slug.toLowerCase() === slug && m.firebaseUid) {
        found[m.firebaseUid] = true;
        break;
      }
    }
  }
  return Object.keys(found);
}

// Surligne les mentions @slug valides dans un texte de note pour l'affichage.
// Échappe d'abord le texte, puis remplace les @slug par un <span> coloré.
function highlightMentions(text) {
  if (!text) return '';
  var safe = escHtml(text);
  var members = window.TEAM_MEMBERS_LIST || [];
  if (!members.length) return safe;
  return safe.replace(/@([a-zA-Z0-9_\-]+)/g, function(full, slug) {
    var slugLower = slug.toLowerCase();
    for (var i = 0; i < members.length; i++) {
      var m = members[i];
      if (m && m.slug && m.slug.toLowerCase() === slugLower) {
        var c = m.color || '#a78bfa';
        return '<span style="color:' + c + ';font-weight:700;background:' + c + '1a;padding:1px 5px;border-radius:4px">@' + escHtml(slug) + '</span>';
      }
    }
    return full;
  });
}

/* ─── Autocomplete @ : un seul popup global réutilisable ────────── */

var _mentionPopup = null;
var _mentionActiveTextarea = null;
var _mentionAtIndex = -1;

function ensureMentionPopup() {
  if (_mentionPopup) return _mentionPopup;
  var p = document.createElement('div');
  p.id = 'mentionPopup';
  p.style.cssText = 'position:absolute;z-index:9999;display:none;min-width:200px;max-height:240px;overflow-y:auto;background:var(--bg2,#1a1a1f);border:1px solid var(--border,rgba(255,255,255,0.12));border-radius:9px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,0.5);font-family:var(--fm,system-ui),sans-serif';
  document.body.appendChild(p);
  _mentionPopup = p;

  // Clic sur un item → insère @slug dans le textarea actif
  p.addEventListener('click', function(e) {
    var item = e.target.closest('[data-mention-slug]');
    if (!item || !_mentionActiveTextarea) return;
    insertMentionIntoTextarea(_mentionActiveTextarea, item.dataset.mentionSlug, _mentionAtIndex);
    hideMentionPopup();
  });

  // Cacher le popup au clic ailleurs
  document.addEventListener('click', function(e) {
    if (_mentionPopup && _mentionPopup.style.display !== 'none' &&
        !_mentionPopup.contains(e.target) && e.target !== _mentionActiveTextarea) {
      hideMentionPopup();
    }
  });

  return _mentionPopup;
}

function hideMentionPopup() {
  if (_mentionPopup) _mentionPopup.style.display = 'none';
  _mentionActiveTextarea = null;
  _mentionAtIndex = -1;
}

function showMentionPopup(textarea, query, atIndex) {
  var popup = ensureMentionPopup();
  var members = (window.TEAM_MEMBERS_ACTIVE || window.TEAM_MEMBERS_LIST || []).filter(function(m) {
    if (!m || !m.firebaseUid || !m.slug) return false;
    if (!query) return true;
    var q = query.toLowerCase();
    var s = (m.slug || '').toLowerCase();
    var n = (m.fullName || m.shortName || '').toLowerCase();
    return s.indexOf(q) >= 0 || n.indexOf(q) >= 0;
  });

  if (members.length === 0) {
    hideMentionPopup();
    return;
  }

  var html = '';
  members.slice(0, 8).forEach(function(m) {
    var c = m.color || '#6b7280';
    html += '<button data-mention-slug="' + escAttr(m.slug) + '" style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:transparent;border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:600;text-align:left;cursor:pointer;border-radius:6px;width:100%;transition:background 0.1s" onmouseover="this.style.background=\'rgba(255,255,255,0.06)\'" onmouseout="this.style.background=\'transparent\'">';
    html += '<span style="width:8px;height:8px;border-radius:50%;background:' + c + ';flex-shrink:0"></span>';
    html += '<span><strong style="color:#fff">' + escHtml(m.fullName || m.shortName || m.slug) + '</strong> <span style="opacity:0.5">@' + escHtml(m.slug) + '</span></span>';
    html += '</button>';
  });
  popup.innerHTML = html;

  // Positionner sous le textarea
  var rect = textarea.getBoundingClientRect();
  popup.style.left = (rect.left + window.scrollX) + 'px';
  popup.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  popup.style.display = 'block';

  _mentionActiveTextarea = textarea;
  _mentionAtIndex = atIndex;
}

function insertMentionIntoTextarea(textarea, slug, atIndex) {
  if (atIndex < 0) atIndex = textarea.value.lastIndexOf('@');
  if (atIndex < 0) return;
  var before = textarea.value.slice(0, atIndex);
  var after = textarea.value.slice(textarea.selectionStart || textarea.value.length);
  var insertion = '@' + slug + ' ';
  textarea.value = before + insertion + after;
  textarea.focus();
  var newPos = (before + insertion).length;
  textarea.setSelectionRange(newPos, newPos);
}

// Listener global : sur input dans n'importe quel textarea data-field="newNote",
// détecter "@" en cours de frappe et déclencher l'autocomplete.
document.addEventListener('input', function(e) {
  var ta = e.target;
  if (!ta || ta.tagName !== 'TEXTAREA') return;
  if (!ta.matches('[data-field="newNote"]')) return;

  var val = ta.value;
  var caret = ta.selectionStart || val.length;
  // Cherche le dernier "@" avant le caret, sans espace après
  var atIdx = val.lastIndexOf('@', caret - 1);
  if (atIdx < 0) { hideMentionPopup(); return; }
  var between = val.slice(atIdx + 1, caret);
  // Si y a un espace ou newline entre @ et caret → pas une mention en cours
  if (/[\s\n]/.test(between)) { hideMentionPopup(); return; }
  // Si le @ est juste précédé d'un caractère alphanumérique, pas une mention
  // (ex : adresse email "contact@adrienemily.com")
  if (atIdx > 0 && /[a-zA-Z0-9]/.test(val.charAt(atIdx - 1))) { hideMentionPopup(); return; }

  showMentionPopup(ta, between, atIdx);
});

// Cacher le popup à la perte de focus du textarea (sauf si on clique dans le popup)
document.addEventListener('focusout', function(e) {
  if (e.target && e.target.tagName === 'TEXTAREA' && e.target.matches('[data-field="newNote"]')) {
    // Petit délai pour permettre le clic sur un item du popup
    setTimeout(function() {
      if (_mentionPopup && !_mentionPopup.contains(document.activeElement)) hideMentionPopup();
    }, 200);
  }
});

function startListening() {
  // Cleanup si re-appel (défensif)
  if (_leadsListenerUnsub) { _leadsListenerUnsub(); _leadsListenerUnsub = null; }
  // Fenêtre glissante 30 jours : on charge tous les leads créés depuis 30 jours
  // au lieu d'une limite fixe à 500 (qui devenait insuffisante avec >500 leads/semaine
  // et faisait disparaître des leads récents de la vue Lead Live).
  var thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  var cutoffTs = firebase.firestore.Timestamp.fromDate(thirtyDaysAgo);

  _leadsListenerUnsub = db.collection('leads')
    .where('createdAt', '>=', cutoffTs)
    .orderBy('createdAt', 'desc')
    .onSnapshot(function(snap) {
      var newLeads = [];

      snap.docChanges().forEach(function(change) {
        if (change.type === 'added' && !isFirstLoad && !knownLeadIds[change.doc.id]) {
          var newLead = change.doc.data();
          newLead.id = change.doc.id;

          // Skip imported leads (no popup/sound)
          if (newLead.source === 'bigin_import' || newLead.source === 'migration_suivi_client') {
            knownLeadIds[change.doc.id] = true;
            return;
          }

          newLead._isNew = true;

          // Auto-assign if no assignedTo
          if (!newLead.assignedTo) {
            assignLeadRoundRobin(change.doc.id);
          }

          newLeads.push(newLead);
        }
        knownLeadIds[change.doc.id] = true;
      });

      // Rebuild full list — MAIS on préserve les leads ressuscités (re-optin
      // ou re-booking) qui ont été injectés par les listeners parallèles
      // startResurrectListening / startOptinResurrectListening. Sans ça, ces
      // leads sont écrasés à chaque rebuild parce qu'ils ne sont pas dans le
      // snapshot principal (leur createdAt est > 30j).
      var snapIds = {};
      snap.forEach(function(doc) { snapIds[doc.id] = true; });
      var preservedResurrects = allLeads.filter(function(l) {
        return (l._resurrectedOptin === true || l._resurrected === true) && !snapIds[l.id];
      });

      allLeads = [];
      snap.forEach(function(doc) {
        var d = doc.data();
        d.id = doc.id;
        // Skip les leads marqués comme fusionnés (via dedup ou repair scripts)
        if (d._merged === true) return;
        // Check if it's one of the new ones
        for (var i = 0; i < newLeads.length; i++) {
          if (newLeads[i].id === doc.id) { d._isNew = true; break; }
        }
        allLeads.push(d);
      });

      // Ré-injecte les leads ressuscités qui n'étaient pas dans le snapshot
      // principal. unshift pour les garder en haut du feed (cohérent avec
      // ce que font les listeners resurrect quand ils les ajoutent).
      if (preservedResurrects.length > 0) {
        allLeads = preservedResurrects.concat(allLeads);
      }

      // Don't re-render while user is editing — only update data + counts
      if (isEditingLead && newLeads.length === 0) {
        updateCounts();
      } else {
        renderFeed();
      }

      // Show popups for new leads
      for (var j = 0; j < newLeads.length; j++) {
        // In personal mode, only show popup for my leads
        if (personalUser && newLeads[j].assignedTo && newLeads[j].assignedTo !== personalUser) continue;
        showLeadPopup(newLeads[j]);
      }

      isFirstLoad = false;

      // On first load, assign any unassigned recent leads (arrived while page was closed)
      if (!window._firstLoadAssignDone) {
        window._firstLoadAssignDone = true;
        allLeads.forEach(function(l) {
          // Round-robin pour les leads sans assignedTo, SAUF les leads import qui n'ont
          // PAS re-optin (ceux-là restent en stock historique). Un lead import qui re-optin
          // (lastOptinAt posé par le backend onWebhookInbox) est traité comme un nouveau
          // lead et passe au round-robin.
          if (l.assignedTo) return;
          var isImport = l.source === 'bigin_import' || l.source === 'webinar_import' || l.source === 'migration_suivi_client';
          var hasReoptin = !!l.lastOptinAt;
          if (!isImport || hasReoptin) {
            assignLeadRoundRobin(l.id);
          }
        });
      }

    }, function(err) {
      console.error('[leads] listener error:', err);
      document.getElementById('ldFeed').innerHTML = '<div class="ld-empty">Erreur de connexion : ' + escHtml(err.message) + '</div>';
    });
}

/* ═══ LISTENER RESSURECTION ═══
   Second onSnapshot parallèle. Pose le drapeau _resurrected sur les leads
   qui ont une activité booking récente (lastBookingAt) MAIS dont createdAt
   est trop ancien pour le listener principal. Fait remonter ces leads en
   tête du feed Lead Live avec popup + son, comme un nouveau lead.
   Dedup côté client : si le lead est déjà dans allLeads, on ne le ré-injecte
   pas, on actualise juste son data + on déclenche le popup si lastBookingAt
   a bougé. */
function startResurrectListening() {
  if (_leadsResurrectListenerUnsub) { _leadsResurrectListenerUnsub(); _leadsResurrectListenerUnsub = null; }
      if (_leadsOptinResurrectListenerUnsub) { _leadsOptinResurrectListenerUnsub(); _leadsOptinResurrectListenerUnsub = null; }
  var thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  var cutoffTs = firebase.firestore.Timestamp.fromDate(thirtyDaysAgo);

  _leadsResurrectListenerUnsub = db.collection('leads')
    .where('lastBookingAt', '>=', cutoffTs)
    .orderBy('lastBookingAt', 'desc')
    .onSnapshot(function(snap) {
      var changed = false;
      snap.docChanges().forEach(function(change) {
        if (change.type === 'removed') return;
        var d = change.doc.data();
        d.id = change.doc.id;
        if (d._merged === true) return;

        // Auto-attribution si re-booking non assigné (cf maybeAutoAssignResurrect).
        maybeAutoAssignResurrect(d);

        // Détecte un lead "ressuscité" : son createdAt est plus ancien que
        // la fenêtre du listener principal. Il faut le forcer dans allLeads.
        var createdAtMs = (d.createdAt && d.createdAt.toMillis) ? d.createdAt.toMillis() : 0;
        var isOld = createdAtMs > 0 && createdAtMs < cutoffTs.toMillis();
        if (isOld) resurrectedLeadIds[d.id] = true;

        // Cherche s'il est déjà dans allLeads
        var idx = -1;
        for (var i = 0; i < allLeads.length; i++) {
          if (allLeads[i].id === d.id) { idx = i; break; }
        }

        var newLastTs = (d.lastBookingAt && d.lastBookingAt.toMillis) ? d.lastBookingAt.toMillis() : 0;
        var prevLastTs = lastBookingTimestamps[d.id] || 0;
        var bookingChanged = newLastTs > prevLastTs && prevLastTs > 0;
        var isFirstSightFresh = !lastBookingTimestamps[d.id];
        lastBookingTimestamps[d.id] = newLastTs;

        if (idx === -1) {
          // Lead absent du listener principal → on l'ajoute
          if (resurrectedLeadIds[d.id]) d._resurrected = true;
          d._isNew = true;
          allLeads.unshift(d);
          changed = true;
          // Popup + son si pas le tout premier load (sinon on bombarde au refresh)
          if (!isFirstLoad && !isFirstSightFresh) {
            // En mode personnel, ne notifier que si c'est mon lead
            if (!personalUser || !d.assignedTo || d.assignedTo === personalUser) {
              showLeadPopup(d);
            }
          }
        } else {
          // Lead déjà chargé → actualise data + ressuscité si applicable
          if (resurrectedLeadIds[d.id]) {
            allLeads[idx]._resurrected = true;
            d._resurrected = true;
          }
          // Merge propre des champs récents
          for (var k in d) {
            if (k === 'id') continue;
            allLeads[idx][k] = d[k];
          }
          changed = true;
          // Popup uniquement si c'est un nouveau RDV (lastBookingAt a bougé)
          if (bookingChanged && !isFirstLoad) {
            allLeads[idx]._isNew = true;
            if (!personalUser || !d.assignedTo || d.assignedTo === personalUser) {
              showLeadPopup(allLeads[idx]);
            }
          }
        }
      });

      if (changed && !isEditingLead) renderFeed();
    }, function(err) {
      // L'index composite (lastBookingAt asc + orderBy) peut ne pas exister
      // au premier déploiement — Firestore loggue alors un lien direct dans
      // la console pour le créer en un clic.
      console.warn('[leads-resurrect] listener error (index manquant ?):', err.message);
    });
}

/* ═══ LISTENER OPTIN RESURRECTION ═══
   3e onSnapshot parallèle. Pose le drapeau _resurrectedOptin sur les leads
   qui re-optin via webhook (lead déjà présent dans le CRM). Le backend
   onWebhookInbox écrit lastOptinAt sur le lead existant au lieu de créer
   un doublon. Ce listener détecte ces updates et injecte la card dans
   Leads Live avec popup + son, badge "🔄 Déjà CRM" via _resurrectedOptin. */
function startOptinResurrectListening() {
  if (_leadsOptinResurrectListenerUnsub) {
    _leadsOptinResurrectListenerUnsub();
    _leadsOptinResurrectListenerUnsub = null;
  }
  var thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  var cutoffTs = firebase.firestore.Timestamp.fromDate(thirtyDaysAgo);

  _leadsOptinResurrectListenerUnsub = db.collection('leads')
    .where('lastOptinAt', '>=', cutoffTs)
    .orderBy('lastOptinAt', 'desc')
    .onSnapshot(function(snap) {
      var changed = false;
      snap.docChanges().forEach(function(change) {
        if (change.type === 'removed') return;
        var d = change.doc.data();
        d.id = change.doc.id;
        if (d._merged === true) return;

        // Tout lead avec lastOptinAt → est par définition un re-optin sur lead existant.
        optinResurrectedLeadIds[d.id] = true;

        // Auto-attribution si re-optin non assigné (cf maybeAutoAssignResurrect).
        maybeAutoAssignResurrect(d);

        var idx = -1;
        for (var i = 0; i < allLeads.length; i++) {
          if (allLeads[i].id === d.id) { idx = i; break; }
        }

        var newOptinTs = (d.lastOptinAt && d.lastOptinAt.toMillis) ? d.lastOptinAt.toMillis() : 0;
        var prevOptinTs = lastOptinTimestamps[d.id] || 0;
        var optinChanged = newOptinTs > prevOptinTs && prevOptinTs > 0;
        var isFirstSightFresh = !lastOptinTimestamps[d.id];
        lastOptinTimestamps[d.id] = newOptinTs;

        if (idx === -1) {
          // Lead absent du listener principal (createdAt > 30j) → on l'injecte
          d._resurrectedOptin = true;
          d._isNew = true;
          allLeads.unshift(d);
          changed = true;
          if (!isFirstLoad && !isFirstSightFresh) {
            if (!personalUser || !d.assignedTo || d.assignedTo === personalUser) {
              showLeadPopup(d);
            }
          }
        } else {
          // Lead déjà chargé → merge data + drapeau + popup si nouveau re-optin
          allLeads[idx]._resurrectedOptin = true;
          for (var k in d) {
            if (k === 'id') continue;
            allLeads[idx][k] = d[k];
          }
          changed = true;
          if (optinChanged && !isFirstLoad) {
            allLeads[idx]._isNew = true;
            if (!personalUser || !d.assignedTo || d.assignedTo === personalUser) {
              showLeadPopup(allLeads[idx]);
            }
          }
        }
      });

      if (changed && !isEditingLead) renderFeed();
    }, function(err) {
      console.warn('[leads-optin-resurrect] listener error (index manquant ?):', err.message);
    });
}

/* ═══ BRIDGE: booking_events → leads ═══
   Quand un booking_event arrive (form self-booking externe via Make), on cherche
   d'abord si un lead existe déjà pour ce prospect (par email puis téléphone).
   Si oui → update intelligent. Si non → create. */

var TERMINAL_STAGES = ['closed_won_setting', 'closed_won_self', 'closed_lost', 'poubelle', 'disqualification'];
var IMPORT_SOURCES_BRIDGE = ['bigin_import', 'migration_suivi_client', 'webinar_import'];

function telVariants(raw) {
  // telVariants-fix-2026-05 : génère une "base" propre (0XXXXXXXXX, 10 digits)
  // quel que soit le format d'entrée, en strippant le 0 parasite après +33/33.
  // Avant : "+330749668323" → variants ["+330749668323","00749668323","330749668323"]
  //         → aucun match avec le lead existant en "+33749668323" → doublon.
  if (!raw) return [];
  var clean = String(raw).replace(/\s+/g, '');
  var set = {};
  set[clean] = 1;

  var digits = clean.replace(/[^\d+]/g, '').replace(/^\+/, '');

  // Calcul de la base canonique = "0XXXXXXXXX"
  var base = '';
  if (digits.indexOf('33') === 0 && digits.length >= 11) {
    var after33 = digits.slice(2);
    if (after33.charAt(0) === '0' && after33.length === 10) after33 = after33.slice(1);
    base = '0' + after33;
  } else if (digits.charAt(0) === '0' && digits.length === 10) {
    base = digits;
  } else if (digits.length === 9) {
    base = '0' + digits;
  }

  if (base && base.length === 10) {
    set[base] = 1;
    set['+33' + base.slice(1)] = 1;
    set['33' + base.slice(1)] = 1;
    set[base.slice(0,2) + ' ' + base.slice(2,4) + ' ' + base.slice(4,6) + ' ' + base.slice(6,8) + ' ' + base.slice(8,10)] = 1;
    set[base.slice(0,2) + '.' + base.slice(2,4) + '.' + base.slice(4,6) + '.' + base.slice(6,8) + '.' + base.slice(8,10)] = 1;
  }

  if (digits) set[digits] = 1;
  return Object.keys(set);
}

// Préfère les leads non-import (VSL/webinaire/self vs Bigin/webinar_import).
// Parmi les candidats non-imports, prend le plus récemment actif.
function pickBestLead(docs) {
  if (!docs || docs.length === 0) return null;
  var nonImports = [], imports = [];
  docs.forEach(function(d) {
    if (IMPORT_SOURCES_BRIDGE.indexOf(d.data.source) < 0) nonImports.push(d);
    else imports.push(d);
  });
  var pool = nonImports.length > 0 ? nonImports : imports;
  pool.sort(function(a, b) {
    var ta = (a.data.updatedAt && a.data.updatedAt.toMillis) ? a.data.updatedAt.toMillis() :
             ((a.data.createdAt && a.data.createdAt.toMillis) ? a.data.createdAt.toMillis() : 0);
    var tb = (b.data.updatedAt && b.data.updatedAt.toMillis) ? b.data.updatedAt.toMillis() :
             ((b.data.createdAt && b.data.createdAt.toMillis) ? b.data.createdAt.toMillis() : 0);
    return tb - ta;
  });
  return pool[0];
}

function findExistingLead(email, phone) {
  return new Promise(function(resolve) {
    var emailNorm = (email || '').trim().toLowerCase();

    function byPhone() {
      var variants = telVariants(phone);
      // byPhone-fix-2026-05 : ajout d'un fallback par phoneNormalized (9 derniers
      // chiffres). Filet de sécurité pour les leads avec format exotique en
      // telephone (espaces, importés Bigin, etc.) que les variants ne couvrent pas.
      var digitsOnly = String(phone || '').replace(/[^\d]/g, '');
      var last9 = digitsOnly.length >= 9 ? digitsOnly.slice(-9) : null;
      var queries = variants.length + (last9 ? 1 : 0);
      if (queries === 0) { resolve(null); return; }
      var remaining = queries;
      var collectedMap = {};
      function done() {
        remaining--;
        if (remaining === 0) {
          var collected = Object.keys(collectedMap).map(function(k){ return collectedMap[k]; });
          resolve(pickBestLead(collected));
        }
      }
      variants.forEach(function(v) {
        db.collection('leads').where('telephone', '==', v).get().then(function(snap) {
          snap.forEach(function(doc) {
            if (doc.data()._merged === true) return;
            if (!collectedMap[doc.id]) collectedMap[doc.id] = { id: doc.id, data: doc.data() };
          });
          done();
        }).catch(done);
      });
      if (last9) {
        db.collection('leads').where('phoneNormalized', '==', last9).get().then(function(snap) {
          snap.forEach(function(doc) {
            if (doc.data()._merged === true) return;
            if (!collectedMap[doc.id]) collectedMap[doc.id] = { id: doc.id, data: doc.data() };
          });
          done();
        }).catch(done);
      }
    }

    if (emailNorm) {
      db.collection('leads').where('email', '==', emailNorm).get().then(function(snap) {
        var collected = [];
        snap.forEach(function(doc) {
          if (doc.data()._merged === true) return;
          collected.push({ id: doc.id, data: doc.data() });
        });
        var emailRaw = (email || '').trim();
        if (collected.length === 0 && emailRaw && emailRaw !== emailNorm) {
          db.collection('leads').where('email', '==', emailRaw).get().then(function(snap2) {
            snap2.forEach(function(doc) {
              if (doc.data()._merged === true) return;
              collected.push({ id: doc.id, data: doc.data() });
            });
            if (collected.length > 0) resolve(pickBestLead(collected));
            else byPhone();
          }).catch(byPhone);
        } else if (collected.length > 0) {
          resolve(pickBestLead(collected));
        } else {
          byPhone();
        }
      }).catch(byPhone);
    } else {
      byPhone();
    }
  });
}

function startBookingBridge() {
  // Cleanup si re-appel (défensif — l'onAuth peut re-fire)
  if (_bookingBridgeUnsub) { _bookingBridgeUnsub(); _bookingBridgeUnsub = null; }
  _bookingBridgeUnsub = db.collection('booking_events')
    .where('processed', '==', false)
    .onSnapshot(function(snap) {
      snap.docChanges().forEach(function(change) {
        if (change.type !== 'added') return;
        var be = change.doc.data();
        var beId = change.doc.id;
        var beRef = change.doc.ref;
        var nowFr = new Date().toLocaleString('fr-FR');

        findExistingLead(be.email, be.telephone).then(function(existing) {
          if (existing) {
            // ───── UPDATE lead existant ─────
            var leadRef = db.collection('leads').doc(existing.id);
            var cur = existing.data || {};
            // bridge-fix-2026-05-05 : poser lastBookingAt pour que le lead
            // remonte dans Leads Live via startResurrectListening (sinon le lead
            // gardait son ancienne position et le sales ne voyait pas le nouveau RDV).
            var update = {
              bookingEventId: beId,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              lastBookingAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            // ═══════════════════════════════════════════════════════════════
            // RDV pris sur lead existant → archivage de l'état actuel dans
            // engagementHistory[] puis reset des champs déclaratifs.
            //
            // Philosophie (validée avec Adrien) :
            //   - Vue Lead Live = état FRAIS du dernier engagement
            //   - À chaque nouveau RDV (ou opt-in, ou re-soumission form), on
            //     archive l'état précédent et on présente la fiche comme un
            //     nouveau lead avec les infos du moment.
            //   - L'historique reste accessible via le bloc accordéon
            //     "📜 Historique des passages" en bas de la fiche.
            //
            // Ce qui est ARCHIVÉ (et donc retiré de la vue principale) :
            //   type, stage, status, utm, source, sourceDetail,
            //   formId/formTitle/formAnswers/formSubmittedAt
            //
            // Ce qui PERSISTE (R1+R2+R3) :
            //   assignedTo, notesHistory (audit du closer), bookings (RDV
            //   passés et futurs gardent leur propre collection).
            // ═══════════════════════════════════════════════════════════════

            // 1. Snapshot l'état actuel (avant écrasement) dans engagementHistory[]
            //    On ne snapshot que si le lead avait quelque chose à archiver
            //    (un type/stage différent du booking qui arrive).
            var hadPrevState = cur.type || cur.stage || cur.formAnswers || cur.utm;
            if (hadPrevState) {
              update.engagementHistory = firebase.firestore.FieldValue.arrayUnion({
                archivedAt:       new Date().toISOString(),
                archivedFor:      'booking',
                type:             cur.type             || null,
                stage:            cur.stage            || null,
                status:           cur.status           || null,
                utm:              cur.utm              || null,
                source:           cur.source           || null,
                sourceDetail:     cur.sourceDetail     || null,
                formId:           cur.formId           || null,
                formTitle:        cur.formTitle        || null,
                formAnswers:      cur.formAnswers      || null,
                formSubmittedAt:  cur.formSubmittedAt  || null,
                bookingEventId:   beId
              });
            }

            // 2. Type : NE PAS écraser. Le `type` reflète le tunnel d'origine
            //    (VSL Élite, VSL Business, etc.). Le fait qu'un RDV soit pris
            //    est porté par `stage = rdv_self_booking`.

            // 3. Reset des champs déclaratifs de formulaire (les anciennes
            //    réponses partent dans l'historique, plus dans la vue principale).
            update.formId           = firebase.firestore.FieldValue.delete();
            update.formTitle        = firebase.firestore.FieldValue.delete();
            update.formAnswers      = firebase.firestore.FieldValue.delete();
            update.formSubmittedAt  = firebase.firestore.FieldValue.delete();

            // Si phoneNormalized manque côté master, le calculer maintenant
            if (!cur.phoneNormalized) {
              var pn = phoneNormalized(cur.telephone || be.telephone);
              if (pn) update.phoneNormalized = pn;
            }

            // Merger champs formulaire uniquement si vides côté lead
            var mergeFields = ['secteur', 'ca', 'defi', 'disponibilite', 'timeline'];
            mergeFields.forEach(function(f) {
              if (be[f] && !cur[f]) update[f] = be[f];
            });

            // ── Rafraîchir source / UTM / sourceDetail pour refléter la dernière
            //    action du lead (cohérent avec le soft-reset appliqué côté
            //    api/alteoform-submit.js). L'ancien UTM reste consultable dans
            //    timeline_history et formSubmissionsHistory si jamais besoin.
            update.source       = 'forms_self_booking';
            update.sourceDetail = be.type || 'Forms Self Booking';
            update.utm          = be.type || 'Forms Self Booking';

            // ── Soft-reset (aligné sur api/alteoform-submit.js) ─────────────
            // Listes synchronisées : tout changement ici doit être répercuté
            // dans api/alteoform-submit.js et inversement.
            //   - CLIENT_STAGES   : protégés, ne pas rétrograder.
            //   - RESETABLE_STAGES: stages "abandonnés" → lead remonte fresh
            //                       avec previousStatus + previousStage archivés
            //                       (badge "⚠️ Avant : X" dans Lead Live).
            //   - autres (actifs) : comportement classique → on passe le stage
            //                       à rdv_self_booking puisqu'un RDV est pris.
            var CLIENT_STAGES_BRIDGE = ['closed_won_setting', 'closed_won_self'];
            var RESETABLE_STAGES_BRIDGE = [
              'closed_lost',
              'poubelle',
              'disqualification',
              'pas_interesse',
              'rdv_annules_prospect',
              'rdv_annules_equipe',
              'no_show_self',
              'no_show_setting',
              'disqualifie_closing'
            ];

            var curStage = cur.stage || 'lead';
            var isClientBridge = cur.isClient === true || CLIENT_STAGES_BRIDGE.indexOf(curStage) >= 0;
            var isResetable    = !isClientBridge && RESETABLE_STAGES_BRIDGE.indexOf(curStage) >= 0;

            var tlText;
            if (isClientBridge) {
              // Client : on ne rétrograde rien. On note juste l'évènement.
              tlText = '📅 Nouveau RDV Self-Booking pour un client existant';
            } else if (isResetable) {
              // Stage abandonné → remise en file fresh + archivage état précédent.
              update.previousStatus = cur.status || null;
              update.previousStage  = curStage   || null;
              update.stage  = 'rdv_self_booking';
              update.status = 'rdv_pose';
              tlText = '🔁 Lead remonté via RDV Self-Booking (était : ' + curStage + ')';
            } else {
              // Stage actif (lead, nrp*, set, rdv_*, follow_up_*, etc.)
              // Comportement classique : on passe le stage au RDV pris.
              update.stage  = 'rdv_self_booking';
              update.status = 'rdv_pose';
              if (curStage === 'rdv_self_booking' || curStage === 'rdv_confirmes' || curStage === 'set') {
                tlText = '🔄 RDV Self-Booking reporté (form externe)';
              } else {
                tlText = '📅 RDV Self-Booking pris (form externe)';
              }
            }

            var tlEntry = { text: tlText, date: nowFr, color: '#34d399' };
            update.timeline_history = (cur.timeline_history || []).concat([tlEntry]);

            var batch = db.batch();
            batch.update(leadRef, update);
            batch.update(beRef, { processed: true, mergedIntoLeadId: existing.id });
            batch.commit().then(function() {
              console.log('[bridge] booking_event ' + beId + ' → merged into ' + existing.id);
            }).catch(function(err) {
              console.error('[bridge] merge error for ' + beId + ':', err);
            });

          } else {
            // ───── CREATE nouveau lead ─────
            var lead = {
              nom:            be.nom || '',
              email:          (be.email || '').trim().toLowerCase(),
              telephone:      normalizeTel(be.telephone || ''),
              phoneNormalized: phoneNormalized(be.telephone || ''),
              secteur:        be.secteur || '',
              ca:             be.ca || '',
              defi:           be.defi || '',
              disponibilite:  be.disponibilite || '',
              timeline:       be.timeline || '',
              type:           'self_booking',
              source:         'forms_self_booking',
              utm:            be.type || 'Forms Self Booking',
              stage:          'lead',
              status:         'nouveau',
              assignedTo:     '',
              notesHistory:   [],
              timeline_history: [{ text: '✨ Lead créé via form Self-Booking', date: nowFr, color: '#a78bfa' }],
              bookingEventId: beId,
              createdAt:      be.createdAt || firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt:      firebase.firestore.FieldValue.serverTimestamp()
            };

            var batch = db.batch();
            var newLeadRef = db.collection('leads').doc('be_' + beId);
            batch.set(newLeadRef, lead);
            batch.update(beRef, { processed: true });
            batch.commit().then(function() {
              console.log('[bridge] booking_event ' + beId + ' → new lead ' + newLeadRef.id);
            }).catch(function(err) {
              console.error('[bridge] create error for ' + beId + ':', err);
            });
          }
        }).catch(function(err) {
          console.error('[bridge] findExistingLead error for ' + beId + ':', err);
        });
      });
    }, function(err) {
      console.error('[bridge] booking_events listener error:', err);
    });
}

/* ═══ AUTH & INIT ═══ */
(function init() {
  // Charge les membres en parallèle de l'auth (idempotent, debounced via cache)
  if (typeof window.loadTeamMembers === 'function') {
    window.loadTeamMembers().then(function() {
      // L'événement team-members-loaded sera fire et déclenchera onTeamMembersReady.
      // On force un appel direct au cas où la page est déjà initialisée.
      onTeamMembersReady();
    });
  }

  // Guard anti-double-démarrage des listeners (voir startListening / startBookingBridge)
  var _leadsListenersStarted = false;

  firebase.auth().onAuthStateChanged(function(user) {
    if (user) {
      // Hide login overlay
      document.getElementById('appLoginOverlay').style.display = 'none';
      db.collection('users').doc(user.uid).get().then(function(snap) {
        var data = snap.exists ? snap.data() : {};
        window._currentRole = data.role || 'sales';
        window._currentUserName = user.displayName || user.email.split('@')[0];
        localStorage.setItem('ambitio_role', data.role || 'sales');
        localStorage.setItem('ambitio_name', window._currentUserName);
        if (!_leadsListenersStarted) {
          _leadsListenersStarted = true;
          startListening();
          startResurrectListening();
          startOptinResurrectListening();
          startBookingBridge();
        }
      }).catch(function() {
        if (!_leadsListenersStarted) {
          _leadsListenersStarted = true;
          startListening();
          startResurrectListening();
          startOptinResurrectListening();
          startBookingBridge();
        }
      });
    } else {
      // Sign out : cleanup + reset flag pour permettre un re-login propre
      if (_leadsListenerUnsub) { _leadsListenerUnsub(); _leadsListenerUnsub = null; }
      if (_leadsResurrectListenerUnsub) { _leadsResurrectListenerUnsub(); _leadsResurrectListenerUnsub = null; }
      if (_bookingBridgeUnsub) { _bookingBridgeUnsub(); _bookingBridgeUnsub = null; }
      _leadsListenersStarted = false;
      // Show login overlay
      var overlay = document.getElementById('appLoginOverlay');
      overlay.style.display = 'flex';
    }
  });

  // Login button handler
  document.getElementById('appLoginBtn').addEventListener('click', doAppLogin);
  document.getElementById('appLoginPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doAppLogin();
  });

  function doAppLogin() {
    var email = document.getElementById('appLoginEmail').value.trim();
    var pwd = document.getElementById('appLoginPassword').value;
    var errEl = document.getElementById('appLoginError');
    if (!email || !pwd) { errEl.textContent = 'Email et mot de passe requis'; errEl.style.display = ''; return; }
    errEl.style.display = 'none';
    var btn = document.getElementById('appLoginBtn');
    btn.textContent = 'Connexion...';
    btn.disabled = true;
    var persist = document.getElementById('appLoginRemember').checked
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION;
    firebase.auth().setPersistence(persist).then(function() {
      return firebase.auth().signInWithEmailAndPassword(email, pwd);
    }).catch(function(err) {
      var msgs = {
        'auth/wrong-password': 'Mot de passe incorrect',
        'auth/user-not-found': 'Aucun compte avec cet email',
        'auth/invalid-email': 'Email invalide',
        'auth/too-many-requests': 'Trop de tentatives, réessayez plus tard'
      };
      errEl.textContent = msgs[err.code] || err.message;
      errEl.style.display = '';
      btn.textContent = 'Se connecter';
      btn.disabled = false;
    });
  }

  // Enable audio on first interaction (mobile requirement)
  document.addEventListener('click', function initAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
    document.removeEventListener('click', initAudio);
  });
})();
</script>

  if (Notification.permission === 'denied') {
    var btn2 = document.getElementById('pushBtn');
    btn2.innerHTML = '🚫';
    btn2.title = 'Allez dans Réglages > Notifications pour réactiver';
    return;
  }

  updatePushBtn('loading');

  // requestPermission: handle both callback and promise
  try {
    var permResult = Notification.requestPermission(function(perm) {
      // Callback style (older browsers)
      handlePermission(perm);
    });
    // Promise style (modern browsers)
    if (permResult && permResult.then) {
      permResult.then(function(perm) { handlePermission(perm); });
    }
  } catch(e) {
    console.error('requestPermission error:', e);
    updatePushBtn('error');
  }
}

function handlePermission(perm) {
  if (perm === 'granted') {
    registerToken();
  } else {
    updatePushBtn(perm);
  }
}

function registerToken() {
  updatePushBtn('loading');
  navigator.serviceWorker.register('sw-leads.js').then(function(reg) {
    // Wait for SW to be ready
    return navigator.serviceWorker.ready.then(function() { return reg; });
  }).then(function(reg) {
    return firebase.messaging().getToken({
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: reg
    });
  }).then(function(token) {
    if (!token) { updatePushBtn('error'); return; }
    var userName = window._currentUserName || localStorage.getItem('ambitio_name') || 'Inconnu';
    pushDb.collection('fcm_tokens').doc(token).set({
      token: token,
      userName: userName,
      userAgent: navigator.userAgent.substring(0, 100),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(function() {
      updatePushBtn('active');
      console.log('FCM token OK:', token.substring(0, 20) + '...');
    }).catch(function() {
      // Token registered in FCM but Firestore write failed — still active
      updatePushBtn('active');
    });
  }).catch(function(err) {
    console.error('Push registration failed:', err);
    updatePushBtn('error');
    // Show error on button for 3s then reset
    var btn = document.getElementById('pushBtn');
    if (btn) btn.title = 'Erreur: ' + (err.message || err).toString().substring(0, 60);
  });
}

// Handle foreground messages
if (pushSupported) {
  try {
    firebase.messaging().onMessage(function(payload) {
      console.log('Foreground push (app handles it):', payload);
    });
  } catch(e) {}
}

// Auto-register if already granted
if (pushSupported && Notification.permission === 'granted') {
  registerToken();
}
</script>

<!-- Follow-Up ↔ Google Calendar (Stratégie) -->
<script>
/**
 * Push un follow-up en tant qu'event Google Calendar sur le calendrier
 * primary du closer assigné au lead. Non-bloquant : en cas d'échec, le
 * FU reste créé dans Firestore, on affiche juste un toast warning.
 *
 * Cible : /api/calendar-followup-event action=create
 */
async function pushFollowUpToCalendar(lead, fuObj) {
  try {
    if (!lead || !fuObj) return;
    var assignedToSlug = lead.assignedTo || '';
    if (!assignedToSlug) {
      toast('⚠️ FU créé sans event : lead non assigné');
      return;
    }

    // Pré-check local : le member a-t-il un firebaseUid dans TEAM_MEMBERS ?
    var tm = (window.TEAM_MEMBERS || {})[assignedToSlug];
    if (!tm) {
      toast('⚠️ FU créé sans event : closer inconnu (' + assignedToSlug + ')');
      return;
    }
    if (!tm.firebaseUid) {
      toast('⚠️ FU créé sans event : ' + (tm.shortName || tm.displayName || assignedToSlug) + ' n\'a pas de compte Firebase lié');
      return;
    }

    var user = firebase.auth().currentUser;
    if (!user) {
      toast('⚠️ FU créé sans event : session expirée');
      return;
    }
    var idToken = await user.getIdToken(false);

    var leadName = ((lead.prenom || '') + ' ' + (lead.nom || '')).trim() || (lead.nom || 'Lead');
    var payload = {
      action: 'create',
      leadId: lead.id,
      fuId: fuObj.id,
      assignedToSlug: assignedToSlug,
      fuDateTime: fuObj.dateTime,
      duration: fuObj.duration || 30,
      note: fuObj.note || '',
      leadName: leadName,
      leadPhone: lead.telephone || '',
      leadEmail: lead.email || ''
    };

    var resp = await fetch('/api/calendar-followup-event', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + idToken
      },
      body: JSON.stringify(payload)
    });

    var data = null;
    try { data = await resp.json(); } catch (_) { data = null; }

    if (!resp.ok) {
      var errCode = data && data.error ? data.error : 'unknown';
      var msg = '⚠️ Event calendrier non créé : ';
      switch (errCode) {
        case 'no_firebase_uid':     msg += 'closer sans compte lié'; break;
        case 'no_booking_config':   msg += 'fiche booking absente'; break;
        case 'calendar_not_connected': msg += 'calendrier Google non connecté pour ' + (data.memberName || 'ce closer'); break;
        case 'member_not_found':    msg += 'closer introuvable'; break;
        case 'team_members_missing': msg += '_meta/team_members absent'; break;
        case 'forbidden':           msg += 'droits insuffisants'; break;
        default:                    msg += (data && data.message) || ('code ' + resp.status);
      }
      toast(msg);
      return;
    }

    // Succès : MAJ locale du lead pour refléter calendarEventId + link
    // (le backend a déjà patché Firestore, mais on évite d'attendre
    // l'onSnapshot pour afficher la pastille).
    if (data && data.eventId) {
      var localLead = (window.allLeads || []).find(function (l) { return l.id === lead.id; });
      if (localLead && Array.isArray(localLead.followUps)) {
        for (var i = 0; i < localLead.followUps.length; i++) {
          if (localLead.followUps[i] && localLead.followUps[i].id === fuObj.id) {
            localLead.followUps[i].calendarEventId = data.eventId;
            localLead.followUps[i].calendarEventLink = data.eventLink || '';
            localLead.followUps[i].calendarPersonId = data.personId || '';
            break;
          }
        }
        if (typeof renderFeed === 'function') renderFeed();
      }
      toast('📅 Event ajouté au calendrier de ' + (data.memberName || 'closer'));
    }
  } catch (e) {
    console.error('[pushFollowUpToCalendar] error:', e);
    toast('⚠️ Event calendrier non créé : ' + (e.message || 'erreur réseau'));
  }
}

/**
 * Supprime l'event Google Calendar associé à un follow-up qu'on vient
 * de retirer. Non-bloquant : erreur → toast warning mais le FU reste
 * bien supprimé côté Firestore.
 *
 * Cible : /api/calendar-followup-event action=delete
 */
async function deleteFollowUpCalendarEvent(removedFu, lead) {
  try {
    if (!removedFu || !removedFu.calendarEventId) return;

    var user = firebase.auth().currentUser;
    if (!user) return;
    var idToken = await user.getIdToken(false);

    var payload = {
      action: 'delete',
      eventId: removedFu.calendarEventId,
      personId: removedFu.calendarPersonId || '',
      assignedToSlug: (lead && lead.assignedTo) || ''
    };

    var resp = await fetch('/api/calendar-followup-event', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + idToken
      },
      body: JSON.stringify(payload)
    });

    if (!resp.ok) {
      var data = null;
      try { data = await resp.json(); } catch (_) { data = null; }
      console.warn('[deleteFollowUpCalendarEvent] API error:', resp.status, data);
      toast('⚠️ Event Google non supprimé — à retirer manuellement');
    }
  } catch (e) {
    console.error('[deleteFollowUpCalendarEvent] error:', e);
  }
}
</script>

<!-- Follow-Up Reminder System -->
<script>
var _fuNotifiedIds = {};
var _fuCheckInterval = null;

function checkFollowUpReminders() {
  if (!window.allLeads || allLeads.length === 0) return;
  var now = Date.now();
  var hasOverdue = false;

  for (var i = 0; i < allLeads.length; i++) {
    var l = allLeads[i];
    // In personal mode, only check my leads
    if (window.personalUser && l.assignedTo !== window.personalUser) continue;
    var fus = l.followUps || [];
    for (var j = 0; j < fus.length; j++) {
      var fu = fus[j];
      if (fu.done) continue;
      var fuTs = new Date(fu.dateTime).getTime();
      var diff = fuTs - now;
      // Notify if due within 2 minutes or overdue (and not already notified)
      var fuKey = l.id + '_' + j + '_' + fu.dateTime;
      if (diff <= 120000 && !_fuNotifiedIds[fuKey]) {
        _fuNotifiedIds[fuKey] = true;
        hasOverdue = true;
        // Toast
        var fuName = l.nom || 'Lead';
        var fuNote = fu.note ? ' — ' + fu.note : '';
        toast('🔔 FU: ' + fuName + fuNote);
        // Browser notification
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            var notifBody = 'Follow-up pour ' + fuName;
            if (fu.note) notifBody += '\n' + fu.note;
            new Notification('🔔 Rappel Follow-Up', {
              body: notifBody,
              icon: 'icon-leads.png',
              tag: 'fu-' + fuKey,
              requireInteraction: true
            });
          } catch(e) { console.warn('Notification error:', e); }
        }
        // Play sound
        if (typeof playNotifSound === 'function') playNotifSound();
      }
    }
  }

  // Re-render badges if there are overdue FUs (throttled)
  if (hasOverdue && !window._fuRenderThrottle) {
    window._fuRenderThrottle = true;
    renderFeed();
    setTimeout(function() { window._fuRenderThrottle = false; }, 10000);
  }
}

// Check every 30 seconds
_fuCheckInterval = setInterval(checkFollowUpReminders, 30000);
// Also check on first load after a short delay
setTimeout(checkFollowUpReminders, 3000);
</script>
