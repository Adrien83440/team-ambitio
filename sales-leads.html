// Helper : retourne la date EFFECTIVE d'un lead pour les filtres de période.
// = max(createdAt, lastOptinAt, lastBookingAt). Permet aux leads ressuscités
// (re-optin webhook ou booking sur lead ancien) d'apparaître dans "Aujourd'hui"
// / "Cette semaine" / filtres custom même si leur createdAt est ancien.
function _getLeadEffectiveDate(l) {
  if (!l) return null;
  var dates = [];
  if (l.createdAt) {
    var d1 = l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt);
    if (d1 && !isNaN(d1.getTime())) dates.push(d1);
  }
  if (l.lastOptinAt) {
    var d2 = l.lastOptinAt.toDate ? l.lastOptinAt.toDate() : new Date(l.lastOptinAt);
    if (d2 && !isNaN(d2.getTime())) dates.push(d2);
  }
  if (l.lastBookingAt) {
    var d3 = l.lastBookingAt.toDate ? l.lastBookingAt.toDate() : new Date(l.lastBookingAt);
    if (d3 && !isNaN(d3.getTime())) dates.push(d3);
  }
  if (dates.length === 0) return null;
  return new Date(Math.max.apply(null, dates.map(function(d){ return d.getTime(); })));
}

function getFilteredLeads() {
  var list = getBaseLeads();
  var searching = !!filterSearch;

  // Period filter — skipped en mode recherche (pour trouver n'importe quel
  // lead dans la fenêtre 30j)
  if (!searching) {
    if (filterPeriod === 'today') {
      var now = new Date();
      var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
      var todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      list = list.filter(function(l) {
        var d = _getLeadEffectiveDate(l);
        if (!d) return false;
        return d >= todayStart && d <= todayEnd;
      });
    } else if (filterPeriod === 'week') {
      var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
      list = list.filter(function(l) {
        var d = _getLeadEffectiveDate(l);
        if (!d) return false;
        return d >= weekAgo;
      });
    } else if (filterPeriod === 'unprocessed') {
      list = list.filter(function(l) { return !l.status || l.status === 'nouveau'; });
    } else if (filterPeriod === 'custom' && customDateFrom) {
      var cFrom = customDateFrom;
      var cTo = customDateTo || new Date(customDateFrom.getFullYear(), customDateFrom.getMonth(), customDateFrom.getDate(), 23, 59, 59, 999);
      list = list.filter(function(l) {
        var d = _getLeadEffectiveDate(l);
        if (!d) return false;
        return d >= cFrom && d <= cTo;
      });
    }
    // 'all' = no period filter
  }

  // Membre : toujours appliqué (cohérent avec le mode personnel / vue active)
  if (filterMember !== 'all') {
    list = list.filter(function(l) { return l.assignedTo === filterMember; });
  }

  // Type / statut : skipped en mode recherche
  if (!searching) {
    if (filterType !== 'all') {
      list = list.filter(function(l) { return (l.type || '') === filterType; });
    }
    if (filterStatus !== 'all') {
      list = list.filter(function(l) { return (l.status || 'nouveau') === filterStatus; });
    }
  }

  // ── Search filter (nom / tel / email / secteur / utm / défi / dispo / timeline /
  //    stage / type / membre assigné / id). Multi-tokens : AND entre tokens,
  //    OR entre champs. Téléphone matché sur 9 derniers digits (FR). ──
  if (searching) {
    var rawQ = filterSearch;
    var q = _normForSearch(rawQ);
    var tokens = q.split(/\s+/).filter(Boolean);
    var members = (typeof window !== 'undefined' && window.TEAM_MEMBERS) ? window.TEAM_MEMBERS : {};
    list = list.filter(function(l) {
      // Texte concaténé pour match générique
      var assigned = l.assignedTo || '';
      var memberFull = '';
      if (assigned && members[assigned]) {
        var m = members[assigned];
        memberFull = (m.name || '') + ' ' + (m.shortName || '') + ' ' + (m.slug || '');
      }
      var statusObj = (typeof getStatusObj === 'function') ? getStatusObj(l.status || 'nouveau') : null;
      var statusLabel = statusObj ? (statusObj.label || '') : '';
      var typeLabel = (typeof LEAD_TYPES !== 'undefined' && LEAD_TYPES[l.type]) ? (LEAD_TYPES[l.type].label || '') : '';
      var hay = _normForSearch([
        l.nom, l.email, l.utm, l.secteur, l.ca, l.defi,
        l.disponibilite, l.timeline, l.stage, l.type, typeLabel,
        l.status, statusLabel, assigned, memberFull, l.id
      ].filter(Boolean).join(' \u0001 '));
      // Digits du téléphone (9 derniers)
      var phone9 = phoneNormalized(l.telephone) || '';
      var phoneFull = _digitsOnly(l.telephone);
      // Chaque token doit matcher au moins un champ
      for (var ti = 0; ti < tokens.length; ti++) {
        var tok = tokens[ti];
        if (!tok) continue;
        var matched = hay.indexOf(tok) !== -1;
        if (!matched) {
          var tokDigits = _digitsOnly(tok);
          if (tokDigits && (phone9 || phoneFull)) {
            // Normalise le token comme phoneNormalized (9 derniers digits si >= 9)
            var tokKey = tokDigits.length >= 9 ? tokDigits.slice(-9) : tokDigits;
            if (phone9 && phone9.indexOf(tokKey) !== -1) matched = true;
            else if (phoneFull && phoneFull.indexOf(tokDigits) !== -1) matched = true;
          }
        }
        if (!matched) return false;
      }
      return true;
    });
  }

  // Tri par "date d'activité" décroissante : on prend le max entre createdAt,
  // lastOptinAt et lastBookingAt. Garantit que les leads les plus récemment
  // actifs (création OU re-optin OU re-booking) remontent en haut, et qu'un
  // lead ressuscité ne reste pas coincé en tête au-delà de sa date d'activité.
  list.sort(function(a, b) {
    var da = _getLeadEffectiveDate(a);
    var db = _getLeadEffectiveDate(b);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return db.getTime() - da.getTime();
  });

  return list;
}

/* Base filter: only leads CREATED in the last 30 days (rolling window).
   On filtre uniquement sur createdAt (vraie date d'origine après migration),
   PAS sur updatedAt — sinon les vieux leads ré-engagés remontent dans la liste.
   En mode 'custom' (sélecteur de date), on bypass le plafond 30j pour
   permettre à l'utilisateur de remonter dans le passé. */
function getBaseLeads() {
  var useCutoff = filterPeriod !== 'custom';
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  return allLeads.filter(function(l) {
    if (l.source === 'migration_suivi_client') return false;
    // Utilise la date effective (max createdAt/lastOptinAt/lastBookingAt)
    // pour ne PAS exclure les leads ressuscités via re-optin ou booking récent.
    var cd = _getLeadEffectiveDate(l);
    if (!cd) return false;
    if (useCutoff && cd <= cutoff) return false;
    return true;
  });
}

function updateCounts() {
  var base = getBaseLeads();
  // Compteurs dynamiques par slug
  var countsBySlug = {};
  var list = window.TEAM_MEMBERS_LIST || [];
  for (var i = 0; i < list.length; i++) countsBySlug[list[i].slug] = 0;
  base.forEach(function(l) {
    if (l.assignedTo && countsBySlug.hasOwnProperty(l.assignedTo)) {
      countsBySlug[l.assignedTo]++;
    }
  });
  document.getElementById('countAll').textContent = base.length;

  // Re-render les pills dynamiques avec leurs compteurs (actifs + dans le module)
  var dyn = document.getElementById('ldMemberPillsDynamic');
  if (dyn) {
    var html = '';
    var active = getLeadsModuleMembers(false);
    for (var k = 0; k < active.length; k++) {
      var m = active[k];
      var c = countsBySlug[m.slug] || 0;
      var isSelected = filterMember === m.slug;
      html += '<button class="ld-member-pill' + (isSelected ? ' active' : '') + '" data-member="' + m.slug + '">' +
              '<span class="mp-dot" style="background:' + (m.color || '#6b7280') + '"></span>' +
              '<span>' + escHtml(m.shortName || m.slug) + '</span> ' +
              '<span class="mp-count">' + c + '</span>' +
              '</button>';
    }
    dyn.innerHTML = html;
  }

  if (personalUser) {
    var myCount = countsBySlug[personalUser] || 0;
    document.getElementById('ldCount').textContent = myCount + ' lead' + (myCount > 1 ? 's' : '');
  } else {
    document.getElementById('ldCount').textContent = base.length + ' lead' + (base.length > 1 ? 's' : '');
  }
}

/* Recalcule les compteurs affichés dans les boutons de période (Aujourd'hui,
   7 jours, Non traités, Tout). Les counts reflètent ce qui s'afficherait
   réellement si on cliquait sur le bouton : on applique les filtres membre /
   type / statut / search actifs, mais PAS le filtre période lui-même (sinon
   chaque bouton afficherait le count de la période sélectionnée). */
function updatePeriodCounts() {
  var base = getBaseLeads();
  var members = (typeof window !== 'undefined' && window.TEAM_MEMBERS) ? window.TEAM_MEMBERS : {};

  // Pré-filtre commun : membre + type + statut + search
  var searching = !!filterSearch;
  var tokens = searching ? _normForSearch(filterSearch).split(/\s+/).filter(Boolean) : [];

  function matchesCommonFilters(l) {
    if (filterMember !== 'all' && l.assignedTo !== filterMember) return false;
    // En mode recherche, on ignore type & statut (même logique que getFilteredLeads)
    if (!searching) {
      if (filterType !== 'all' && (l.type || '') !== filterType) return false;
      if (filterStatus !== 'all' && (l.status || 'nouveau') !== filterStatus) return false;
    }
    if (searching) {
      var assigned = l.assignedTo || '';
      var memberFull = '';
      if (assigned && members[assigned]) {
        var m = members[assigned];
        memberFull = (m.name || '') + ' ' + (m.shortName || '') + ' ' + (m.slug || '');
      }
      var statusObj = (typeof getStatusObj === 'function') ? getStatusObj(l.status || 'nouveau') : null;
      var statusLabel = statusObj ? (statusObj.label || '') : '';
      var typeLabel = (typeof LEAD_TYPES !== 'undefined' && LEAD_TYPES[l.type]) ? (LEAD_TYPES[l.type].label || '') : '';
      var hay = _normForSearch([
        l.nom, l.email, l.utm, l.secteur, l.ca, l.defi,
        l.disponibilite, l.timeline, l.stage, l.type, typeLabel,
        l.status, statusLabel, assigned, memberFull, l.id
      ].filter(Boolean).join(' \u0001 '));
      var phone9 = phoneNormalized(l.telephone) || '';
      var phoneFull = _digitsOnly(l.telephone);
      for (var ti = 0; ti < tokens.length; ti++) {
        var tok = tokens[ti]; if (!tok) continue;
        var matched = hay.indexOf(tok) !== -1;
        if (!matched) {
          var tokDigits = _digitsOnly(tok);
          if (tokDigits && (phone9 || phoneFull)) {
            var tokKey = tokDigits.length >= 9 ? tokDigits.slice(-9) : tokDigits;
            if (phone9 && phone9.indexOf(tokKey) !== -1) matched = true;
            else if (phoneFull && phoneFull.indexOf(tokDigits) !== -1) matched = true;
          }
        }
        if (!matched) return false;
      }
    }
    return true;
  }

  // Bornes période
  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
  var todayEnd   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
  var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);

  var counts = { today: 0, week: 0, unprocessed: 0, all: 0 };
  for (var i = 0; i < base.length; i++) {
    var l = base[i];
    if (!matchesCommonFilters(l)) continue;
    counts.all++;
    var d = _getLeadEffectiveDate(l);
    if (d) {
      if (d >= todayStart && d <= todayEnd) counts.today++;
      if (d >= weekAgo) counts.week++;
    }
    if (!l.status || l.status === 'nouveau') counts.unprocessed++;
  }

  var keys = ['today', 'week', 'unprocessed', 'all'];
  for (var k = 0; k < keys.length; k++) {
    var el = document.querySelector('[data-period-count="' + keys[k] + '"]');
    if (!el) continue;
    var c = counts[keys[k]];
    el.textContent = c;
    if (c === 0) el.classList.add('zero');
    else         el.classList.remove('zero');
  }
}

function rebuildTypeFilters() {
  // Le comptage des types doit refléter la vue active : on applique les
  // filtres période (today / week / unprocessed / custom date range) + membre
  // + search, et on compte les types sur ce sous-ensemble. Le filtre `type`
  // lui-même n'est pas appliqué (sinon chaque bouton afficherait 0 ou le
  // count de la sélection en cours).
  var types = {};
  var base = getBaseLeads();
  var searching = !!filterSearch;
  var tokens = searching ? _normForSearch(filterSearch).split(/\s+/).filter(Boolean) : [];
  var members = (typeof window !== 'undefined' && window.TEAM_MEMBERS) ? window.TEAM_MEMBERS : {};

  // Bornes période (mêmes bornes que getFilteredLeads)
  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
  var todayEnd   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
  var weekAgo    = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  var customFrom = customDateFrom;
  var customTo   = customDateFrom ? (customDateTo || new Date(customDateFrom.getFullYear(), customDateFrom.getMonth(), customDateFrom.getDate(), 23, 59, 59, 999)) : null;

  function inPeriod(l) {
    if (searching) return true; // la recherche bypass la période
    if (filterPeriod === 'all') return true;
    var d = _getLeadEffectiveDate(l);
    if (filterPeriod === 'unprocessed') return !l.status || l.status === 'nouveau';
    if (!d) return false;
    if (filterPeriod === 'today')  return d >= todayStart && d <= todayEnd;
    if (filterPeriod === 'week')   return d >= weekAgo;
    if (filterPeriod === 'custom' && customFrom) return d >= customFrom && d <= customTo;
    return true;
  }

  function matchesSearch(l) {
    if (!searching) return true;
    var assigned = l.assignedTo || '';
    var memberFull = '';
    if (assigned && members[assigned]) {
      var m = members[assigned];
      memberFull = (m.name || '') + ' ' + (m.shortName || '') + ' ' + (m.slug || '');
    }
    var statusObj = (typeof getStatusObj === 'function') ? getStatusObj(l.status || 'nouveau') : null;
    var statusLabel = statusObj ? (statusObj.label || '') : '';
    var typeLabel = (typeof LEAD_TYPES !== 'undefined' && LEAD_TYPES[l.type]) ? (LEAD_TYPES[l.type].label || '') : '';
    var hay = _normForSearch([
      l.nom, l.email, l.utm, l.secteur, l.ca, l.defi,
      l.disponibilite, l.timeline, l.stage, l.type, typeLabel,
      l.status, statusLabel, assigned, memberFull, l.id
    ].filter(Boolean).join(' \u0001 '));
    var phone9 = phoneNormalized(l.telephone) || '';
    var phoneFull = _digitsOnly(l.telephone);
    for (var ti = 0; ti < tokens.length; ti++) {
      var tok = tokens[ti]; if (!tok) continue;
      var matched = hay.indexOf(tok) !== -1;
      if (!matched) {
        var tokDigits = _digitsOnly(tok);
        if (tokDigits && (phone9 || phoneFull)) {
          var tokKey = tokDigits.length >= 9 ? tokDigits.slice(-9) : tokDigits;
          if (phone9 && phone9.indexOf(tokKey) !== -1) matched = true;
          else if (phoneFull && phoneFull.indexOf(tokDigits) !== -1) matched = true;
        }
      }
      if (!matched) return false;
    }
    return true;
  }

  for (var i = 0; i < base.length; i++) {
    var l = base[i];
    if (filterMember !== 'all' && l.assignedTo !== filterMember) continue;
    if (!inPeriod(l)) continue;
    if (!matchesSearch(l)) continue;
    var t = l.type || '';
    if (t) types[t] = (types[t] || 0) + 1;
  }

  var keys = Object.keys(types).sort();
  var container = document.getElementById('ldTypeFilters');
  // Hide row if 0 or 1 type only
  if (keys.length <= 1) { container.innerHTML = ''; filterType = 'all'; return; }
  // Reset if selected type no longer exists
  if (filterType !== 'all' && !types[filterType]) filterType = 'all';
  var h = '<button class="ld-filter' + (filterType === 'all' ? ' active' : '') + '" data-type="all">Tous</button>';
  for (var j = 0; j < keys.length; j++) {
    var k = keys[j];
    var label = LEAD_TYPES[k] ? LEAD_TYPES[k].label : k;
    h += '<button class="ld-filter' + (filterType === k ? ' active' : '') + '" data-type="' + k + '"><span>' + label + '</span><span class="ld-period-count' + (types[k] === 0 ? ' zero' : '') + '">' + types[k] + '</span></button>';
  }
  container.innerHTML = h;
}

function renderFeed() {
  var leads = getFilteredLeads();
  updateCounts();
  updatePeriodCounts();
  rebuildTypeFilters();
  var feed = document.getElementById('ldFeed');

  if (leads.length === 0) {
    feed.innerHTML = '<div class="ld-empty">Aucun lead ' + (filterSearch ? 'ne correspond à « ' + escHtml(filterSearch) + ' »' : (filterStatus !== 'all' ? 'avec ce statut' : '')) + '</div>';
    return;
  }

  var h = '';
  for (var i = 0; i < leads.length; i++) {
    h += renderCard(leads[i]);
  }
  feed.innerHTML = h;

  // Dialer bridge : boutons d'appel + multi-sélection campagne
  if (window.DialerBridge) {
    try {
      window.DialerBridge.attachButtons('#ldFeed', { cardSelector: '.ld-card' });
      window.DialerBridge.enableMultiSelect('#ldFeed', { cardSelector: '.ld-card', maxSelection: 5 });
    } catch (e) { console.warn('[DialerBridge] attach failed', e); }
  }

  // Restore open card
  if (openCardId) {
    var el = document.querySelector('[data-lead-id="' + openCardId + '"]');
    if (el) {
      el.classList.add('open');
      // Re-render a recréé le DOM des cards : on force un repaint du RDV box
      // (l'ancien snapshot a peint un DOM qui n'existe plus).
      detachLeadRdvListener(openCardId);
      attachLeadRdvListener(openCardId);
    }
  }
}

/* ── RDV box (lue temps réel depuis bookings) ── */
var _ldRdvUnsubs = {};   // leadId -> unsubscribe fn

function attachLeadRdvListener(leadId) {
  if (!leadId) return;
  // Si déjà attaché, ne rien faire
  if (_ldRdvUnsubs[leadId]) return;
  var todayStr = (function(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  })();
  try {
    _ldRdvUnsubs[leadId] = db.collection('bookings')
      .where('leadId', '==', leadId)
      .where('date', '>=', todayStr)
      .onSnapshot(function(snap){
        var items = [];
        snap.forEach(function(doc){
          var d = doc.data();
          if (d.status === 'confirmed' || d.status === 'pending') {
            d.id = doc.id;
            items.push(d);
          }
        });
        items.sort(function(a, b){
          var ka = (a.date||'') + 'T' + (a.time||'');
          var kb = (b.date||'') + 'T' + (b.time||'');
          return ka < kb ? -1 : (ka > kb ? 1 : 0);
        });
        paintLeadRdvBox(leadId, items);
      }, function(err){
        console.warn('[ldRdv] snapshot error', leadId, err);
      });
  } catch(e) {
    console.warn('[ldRdv] attach error', leadId, e);
  }
}

function detachLeadRdvListener(leadId) {
  if (!leadId) return;
  var unsub = _ldRdvUnsubs[leadId];
  if (unsub) { try { unsub(); } catch(e){} delete _ldRdvUnsubs[leadId]; }
}

function paintLeadRdvBox(leadId, items) {
  var block = document.querySelector('[data-rdv-block="' + leadId + '"]');
  var list  = document.querySelector('[data-rdv-list="'  + leadId + '"]');
  if (!block || !list) return;
  if (!items || items.length === 0) {
    block.classList.remove('has-rdv');
    list.innerHTML = '';
    return;
  }
  var JOURS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  var MOIS  = ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  var html = '';
  items.forEach(function(b){
    var dt = new Date((b.date || '') + 'T' + (b.time || '00:00') + ':00');
    var when = JOURS[dt.getDay()] + ' ' + dt.getDate() + ' ' + MOIS[dt.getMonth()];
    var typeName = (b.consultation && b.consultation.label) || b.typeName || b.typeLabel || b.type || 'RDV';
    var personName = b.personName || '';
    var meta = escHtml(typeName) + (personName ? ' · ' + escHtml(personName) : '');
    html += '<div class="ld-rdv-row">';
    html += '<span class="ld-rdv-when">' + escHtml(when) + ' <span class="d">à</span> ' + escHtml(b.time || '') + '</span>';
    html += '<span class="ld-rdv-meta">' + meta + '</span>';
    html += '</div>';
  });
  list.innerHTML = html;
  block.classList.add('has-rdv');
}

/* ── Réponses du formulaire (AlteoForm) ── */
// Gère deux formats sur le lead :
//  - Tableau enrichi : [{fieldId,label,type,value}, ...] (nouveau format, posé par alteoforms-render)
//  - Map clé→valeur  : {fieldId: value, ...} (ancien format, leads créés avant le patch)
//
// Skip les champs dont le contactMapping vise des données déjà affichées
// dans le bloc principal de la fiche (nom, email, téléphone). Évite le
// doublon visuel : afficher "Prénom: Adrien" + "Nom: François" + "Email: x@y" +
// "Téléphone: 0688..." sous "Réponses au formulaire" alors que ces données
// sont déjà visibles tout en haut de la carte.
//
// Si formulaire pas en cache ou champ supprimé entre temps → on garde l'ID
// brut en libellé — transparent et non-mensonger.
var SKIP_CONTACT_MAPPINGS_LD = { prenom: 1, nom: 1, email: 1, telephone: 1 };

// Helper : transforme un formAnswers (array enrichi OU map legacy) en liste
// de rows {fieldId, label, value} prêtes à être rendues, en filtrant les
// champs déjà affichés en haut de carte (prenom/nom/email/telephone).
function ldExtractFormRows(fa, fieldIndex) {
  var rows = [];
  if (!fa) return rows;
  fieldIndex = fieldIndex || {};
  if (Array.isArray(fa)) {
    fa.forEach(function(a){
      if (!a || a.value === '' || a.value == null) return;
      var meta = fieldIndex[a.fieldId];
      if (meta && SKIP_CONTACT_MAPPINGS_LD[meta.contactMapping]) return;
      rows.push(a);
    });
  } else if (typeof fa === 'object') {
    Object.keys(fa).forEach(function(k){
      var v = fa[k];
      if (v === '' || v == null) return;
      var meta = fieldIndex[k];
      if (meta && SKIP_CONTACT_MAPPINGS_LD[meta.contactMapping]) return;
      rows.push({ fieldId: k, label: (meta && meta.label) || k, value: v });
    });
  }
  return rows;
}

// Helper : rend en HTML une liste de rows d'un formulaire
function ldRenderFormRows(rows) {
  var h = '';
  rows.forEach(function(r){
    h += '<div class="ld-form-answer-row">';
    h += '<span class="ld-form-answer-label">' + escHtml(r.label || r.fieldId || '') + '</span>';
    h += '<span class="ld-form-answer-val">' + escHtml(String(r.value)) + '</span>';
    h += '</div>';
  });
  return h;
}

function renderFormAnswersBlock(l, id) {
  var fa = l.formAnswers;
  if (!fa) return '';
  var fieldIndex = (l.formId && window.__formsLabels && window.__formsLabels[l.formId]) || {};
  var rows = ldExtractFormRows(fa, fieldIndex);
  if (rows.length === 0) return '';

  // Date dans le titre (option A choisie) :
  //  - re-soumission (formSubmissionsHistory non-vide)  → "Dernière soumission le …"
  //  - première soumission via AlteoForm                → "Soumis le …"
  //  - fallback si formSubmittedAt absent (legacy)      → "Reçu le …" sur createdAt
  var hasHistory = Array.isArray(l.formSubmissionsHistory) && l.formSubmissionsHistory.length > 0;
  var datePart = '';
  if (l.formSubmittedAt) {
    datePart = ' · ' + (hasHistory ? 'Dernière soumission le ' : 'Soumis le ') + formatDateTimeFr(l.formSubmittedAt);
  } else if (l.createdAt) {
    datePart = ' · Reçu le ' + formatDateTimeFr(l.createdAt);
  }

  var h = '<div class="ld-form-answers has-answers" data-form-answers="' + id + '">';
  var headTitle = '📋 Réponses au formulaire' + (l.formTitle ? ' — ' + escHtml(l.formTitle) : '') + datePart;
  h += '<div class="ld-form-answers-title">' + headTitle + '</div>';
  h += ldRenderFormRows(rows);
  h += '</div>';
  return h;
}

// Bloc historique : bouton "Voir N soumissions précédentes" + accordéon.
// Alimenté par le champ formSubmissionsHistory (array d'entries
// {submittedAt, formId, formTitle, formAnswers}) archivé côté backend
// par api/alteoform-submit.js à chaque re-soumission AlteoForm.
function renderFormHistoryBlock(l, id) {
  var hist = l.formSubmissionsHistory;
  if (!Array.isArray(hist) || hist.length === 0) return '';

  // Tri : plus récent d'abord
  var sorted = hist.slice().sort(function(a, b){
    var ta = a && a.submittedAt ? new Date(a.submittedAt).getTime() : 0;
    var tb = b && b.submittedAt ? new Date(b.submittedAt).getTime() : 0;
    return tb - ta;
  });

  var entriesHtml = '';
  var nValid = 0;
  sorted.forEach(function(entry){
    if (!entry || !entry.formAnswers) return;
    var entryFormId = entry.formId || l.formId;
    var fieldIndex  = (entryFormId && window.__formsLabels && window.__formsLabels[entryFormId]) || {};
    var rows        = ldExtractFormRows(entry.formAnswers, fieldIndex);
    if (rows.length === 0) return;
    var dateLbl = entry.submittedAt ? formatDateTimeFr(entry.submittedAt) : 'date inconnue';
    entriesHtml += '<div class="ld-form-history-entry">';
    entriesHtml += '<div class="ld-form-history-entry-title">📝 Soumission du ' + escHtml(dateLbl) + (entry.formTitle ? ' — ' + escHtml(entry.formTitle) : '') + '</div>';
    entriesHtml += ldRenderFormRows(rows);
    entriesHtml += '</div>';
    nValid++;
  });

  if (!nValid) return '';

  var h = '<div class="ld-form-history-wrap">';
  h += '<button class="ld-form-history-toggle" data-action="toggleFormHistory" data-id="' + id + '">';
  h += '↩️ Voir ' + nValid + ' soumission' + (nValid > 1 ? 's' : '') + ' précédente' + (nValid > 1 ? 's' : '');
  h += '</button>';
  h += '<div class="ld-form-history-content" data-form-history-content="' + id + '" style="display:none">';
  h += entriesHtml;
  h += '</div>';
  h += '</div>';
  return h;
}

// ═══════════════════════════════════════════════════════════════════════
// HISTORIQUE DES PASSAGES (engagementHistory[])
// ─────────────────────────────────────────────────────────────────────────
// À chaque ré-engagement d'un lead existant (opt-in webhook, re-soumission
// formulaire, RDV pris), un snapshot complet de l'état ANTÉRIEUR est
// archivé dans engagementHistory[]. La vue principale de la fiche affiche
// les nouvelles infos "fraîches". Cet historique permet de retrouver tout
// le parcours du lead : anciens types, anciennes étapes, anciennes
// réponses de formulaire, anciens UTM.
//
// Schéma d'une entry :
//   {
//     archivedAt:      ISO,
//     archivedFor:     'optin' | 'form' | 'booking',
//     type:            string,         // tunnel d'origine de l'époque
//     stage:           string,         // étape commerciale de l'époque
//     status:          string,         // statut de l'époque
//     utm:             string,
//     source:          string,
//     sourceDetail:    string,
//     formId:          string|null,
//     formTitle:       string|null,
//     formAnswers:     array|object|null,
//     formSubmittedAt: ISO|null,
//     bookingEventId:  string|null     // si archivedFor=='booking'
//   }
// ═══════════════════════════════════════════════════════════════════════
function renderEngagementHistoryBlock(l, id) {
  var hist = l.engagementHistory;
  if (!Array.isArray(hist) || hist.length === 0) return '';

  // Tri : plus récent d'abord
  var sorted = hist.slice().sort(function(a, b){
    var ta = a && a.archivedAt ? new Date(a.archivedAt).getTime() : 0;
    var tb = b && b.archivedAt ? new Date(b.archivedAt).getTime() : 0;
    return tb - ta;
  });

  function badgeClassFor(t) {
    var lt = LEAD_TYPES[t];
    if (lt && lt.badgeClass) return lt.badgeClass;
    return 'other';
  }
  function labelFor(t) {
    var lt = LEAD_TYPES[t];
    if (lt && lt.label) return lt.label;
    if (t === 'alteoform') return 'AlteoForm';
    return t || '—';
  }
  function triggerLabel(a) {
    if (a === 'optin')   return 'opt-in';
    if (a === 'form')    return 'formulaire';
    if (a === 'booking') return 'RDV pris';
    return a || 'engagement';
  }

  // Map des stages → labels lisibles (extrait de la config existante)
  var STAGE_LABELS = {
    lead: 'Nouveau', nrp1: 'NRP 1', nrp2: 'NRP 2', nrp3: 'NRP 3',
    all_nrp: 'All NRP', follow_up_pm: 'Follow Up PM', set: 'SET',
    rdv_self_booking: 'RDV Self Booking', rdv_pose: 'RDV posé',
    rdv_confirmes: 'RDV confirmé', rdv_annules_prospect: 'RDV annulé prospect',
    rdv_annules_equipe: 'RDV annulé équipe', no_show_self: 'No-show self',
    no_show_setting: 'No-show setting', follow_up_closing: 'Follow Up Closing',
    disqualifie_closing: 'Disqualifié closing', disqualification: 'Disqualifié',
    pas_interesse: 'Pas intéressé', poubelle: 'Poubelle',
    closed_won_setting: 'Closed Won Setting', closed_won_self: 'Closed Won Self',
    closed_lost: 'Closed Lost', partenariats: 'Partenariats'
  };

  var entriesHtml = '';
  sorted.forEach(function(e, idx){
    if (!e) return;
    var dateLbl = e.archivedAt ? formatDateTimeFr(e.archivedAt) : 'date inconnue';
    var bc      = badgeClassFor(e.type);
    var lbl     = labelFor(e.type);
    var trig    = triggerLabel(e.archivedFor);
    var stageLbl = STAGE_LABELS[e.stage] || e.stage || '—';

    // Résumé sur la ligne (visible avant dépliage)
    var summary = stageLbl;
    if (e.formTitle) summary += ' · ' + e.formTitle;
    else if (e.utm) summary += ' · ' + e.utm;

    var entryId = id + '_eng_' + idx;
    entriesHtml += '<div class="ld-eng-entry" data-eng-entry="' + entryId + '">';
    // Header cliquable
    entriesHtml += '<div class="ld-eng-entry-head" data-action="toggleEngEntry" data-entry="' + entryId + '">';
    entriesHtml += '<span class="ld-eng-entry-chevron">▶</span>';
    entriesHtml += '<span class="ld-eng-entry-date">' + escHtml(dateLbl) + '</span>';
    entriesHtml += '<span class="ld-eng-entry-badge ' + bc + '">' + escHtml(lbl) + '</span>';
    entriesHtml += '<span class="ld-eng-entry-trigger">' + escHtml(trig) + '</span>';
    entriesHtml += '<span class="ld-eng-entry-summary">' + escHtml(summary) + '</span>';
    entriesHtml += '</div>';
    // Body dépliable
    entriesHtml += '<div class="ld-eng-entry-body">';
    if (e.type)         entriesHtml += '<div class="ld-eng-detail-row"><span class="ld-eng-detail-lbl">Tunnel</span><span class="ld-eng-detail-val">' + escHtml(lbl) + '</span></div>';
    if (e.stage)        entriesHtml += '<div class="ld-eng-detail-row"><span class="ld-eng-detail-lbl">Étape</span><span class="ld-eng-detail-val">' + escHtml(stageLbl) + '</span></div>';
    if (e.status)       entriesHtml += '<div class="ld-eng-detail-row"><span class="ld-eng-detail-lbl">Statut</span><span class="ld-eng-detail-val">' + escHtml(e.status) + '</span></div>';
    if (e.utm)          entriesHtml += '<div class="ld-eng-detail-row"><span class="ld-eng-detail-lbl">UTM</span><span class="ld-eng-detail-val">' + escHtml(e.utm) + '</span></div>';
    if (e.source)       entriesHtml += '<div class="ld-eng-detail-row"><span class="ld-eng-detail-lbl">Source</span><span class="ld-eng-detail-val">' + escHtml(e.source) + (e.sourceDetail ? ' — ' + escHtml(e.sourceDetail) : '') + '</span></div>';
    if (e.formSubmittedAt) entriesHtml += '<div class="ld-eng-detail-row"><span class="ld-eng-detail-lbl">Soumis le</span><span class="ld-eng-detail-val">' + escHtml(formatDateTimeFr(e.formSubmittedAt)) + '</span></div>';

    // Bloc formulaire (si présent)
    if (e.formAnswers) {
      var fieldIndex = (e.formId && window.__formsLabels && window.__formsLabels[e.formId]) || {};
      var rows = ldExtractFormRows(e.formAnswers, fieldIndex);
      if (rows.length > 0) {
        entriesHtml += '<div class="ld-eng-form-block">';
        entriesHtml += '<div class="ld-eng-form-block-title">📋 Réponses au formulaire' + (e.formTitle ? ' — ' + escHtml(e.formTitle) : '') + '</div>';
        rows.forEach(function(r){
          entriesHtml += '<div class="ld-eng-form-row">';
          entriesHtml += '<span class="ld-eng-form-row-q">' + escHtml(r.label || r.id || '—') + '</span>';
          entriesHtml += '<span class="ld-eng-form-row-a">' + escHtml(r.value || '—') + '</span>';
          entriesHtml += '</div>';
        });
        entriesHtml += '</div>';
      }
    }

    entriesHtml += '</div>'; // body
    entriesHtml += '</div>'; // entry
  });

  var h = '<div class="ld-eng-history-wrap">';
  h += '<div class="ld-eng-history-title">📜 Historique des passages (' + sorted.length + ')</div>';
  h += '<div class="ld-eng-history-list">' + entriesHtml + '</div>';
  h += '</div>';
  return h;
}

/* ── SMS composer (envoi via SalesDialerAPI) ── */
function updateSmsCounter(leadId) {
  if (!leadId) return;
  var ta = document.querySelector('[data-sms-input="' + leadId + '"]');
  var counter = document.querySelector('[data-sms-counter="' + leadId + '"]');
  if (!ta || !counter) return;
  var txt = ta.value;
  var len = txt.length;
  // GSM-7 segmente à 160, Unicode à 70
  var isUnicode = /[^\u0000-\u00ff]/.test(txt);
  var segSize = isUnicode ? 70 : 160;
  var segs = len === 0 ? 0 : Math.ceil(len / segSize);
  counter.textContent = len + ' / ' + segSize + (segs > 1 ? ' · ' + segs + ' SMS' : '');
  counter.className = 'ld-sms-composer-counter' + (segs >= 3 ? ' warn' : '') + (segs >= 8 ? ' over' : '');
}

function sendSmsFromCard(leadId, btn) {
  if (!leadId || !btn) return;
  var ta      = document.querySelector('[data-sms-input="'  + leadId + '"]');
  var errEl   = document.querySelector('[data-sms-error="'  + leadId + '"]');
  if (!ta) return;
  var msg = ta.value.trim();
  if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }
  if (!msg) {
    if (errEl) { errEl.textContent = 'Message vide'; errEl.style.display = 'block'; }
    return;
  }
  if (!window.SalesDialerAPI || !window.SalesDialerAPI.sendSms) {
    if (errEl) { errEl.textContent = 'SalesDialerAPI non chargé'; errEl.style.display = 'block'; }
    return;
  }
  btn.disabled = true;
  ta.disabled = true;
  var origLabel = btn.textContent;
  btn.textContent = 'Envoi…';
  window.SalesDialerAPI.sendSms({ leadId: leadId, message: msg })
    .then(function(result) {
      toast('✅ SMS envoyé à ' + (result && result.to ? result.to : ''));
      ta.value = '';
      updateSmsCounter(leadId);
    })
    .catch(function(e) {
      console.error('[sendSmsFromCard]', e);
      if (errEl) {
        errEl.textContent = '❌ ' + (e && e.message ? e.message : 'Échec envoi');
        errEl.style.display = 'block';
      }
    })
    .then(function() {
      btn.disabled = false;
      ta.disabled = false;
      btn.textContent = origLabel || '💬 Envoyer SMS';
    });
}

/* ── FU badge helper ── */
function getFuBadge(l) {
  var fus = l.followUps || [];
  if (fus.length === 0) return '';
  var now = Date.now();
  var pending = 0, overdue = 0, nextTs = Infinity;
  for (var i = 0; i < fus.length; i++) {
    if (fus[i].done) continue;
    pending++;
    var ts = new Date(fus[i].dateTime).getTime();
    if (ts <= now) overdue++;
    if (ts < nextTs) nextTs = ts;
  }
  if (pending === 0) return '';
  if (overdue > 0) return '<span class="ld-fu-badge overdue">🔔 ' + overdue + ' FU</span>';
  // Show next FU time
  var nd = new Date(nextTs);
  var nStr = String(nd.getDate()).padStart(2,'0') + '/' + String(nd.getMonth()+1).padStart(2,'0') + ' ' + String(nd.getHours()).padStart(2,'0') + ':' + String(nd.getMinutes()).padStart(2,'0');
  return '<span class="ld-fu-badge">🔔 ' + nStr + '</span>';
}

  h += '<div class="ld-detail-row"><span class="ld-detail-label">Type</span><select class="ld-detail-select" data-edit="type" data-id="' + id + '">';
  h += '<option value="vsl_elite"' + (l.type === 'vsl_elite' ? ' selected' : '') + '>VSL ÉLITE</option>';
  h += '<option value="self_booking"' + (l.type === 'self_booking' ? ' selected' : '') + '>Self-Booking</option>';
  h += '<option value="business"' + (l.type === 'business' ? ' selected' : '') + '>Business</option>';
  h += '</select></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Attribué à</span><select class="ld-detail-select" data-edit="assignedTo" data-id="' + id + '">';
  h += '<option value="">— Non attribué —</option>';
  h += buildAssignSelectOptions(l.assignedTo, false);
  h += '</select></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Secteur</span><input class="ld-detail-input" data-edit="secteur" data-id="' + id + '" value="' + escAttr(l.secteur || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">CA actuel</span><input class="ld-detail-input" data-edit="ca" data-id="' + id + '" value="' + escAttr(l.ca || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Défi</span><input class="ld-detail-input" data-edit="defi" data-id="' + id + '" value="' + escAttr(l.defi || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Dispo</span><input class="ld-detail-input" data-edit="disponibilite" data-id="' + id + '" value="' + escAttr(l.disponibilite || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Timeline</span><input class="ld-detail-input" data-edit="timeline" data-id="' + id + '" value="' + escAttr(l.timeline || '') + '"/></div>';
  h += '<div class="ld-autosave-msg" data-autosave-msg="' + id + '" style="font-size:11px;color:var(--green);text-align:center;padding:6px 0;opacity:0;transition:opacity 0.3s">✅ Sauvegardé automatiquement</div>';
  h += '</div>';

  // Actions
  h += '<div class="ld-actions">';
  h += '<div class="ld-actions-title">Statut</div>';
  h += '<div class="ld-status-grid">';
  for (var si = 0; si < STATUSES.length; si++) {
    var s = STATUSES[si];
    var isActive = (l.status || 'nouveau') === s.key;
    h += '<button class="ld-status-btn' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'color:' + s.color + ';border-color:' + s.color : '') + '" data-action="setStatus" data-id="' + id + '" data-status="' + s.key + '">' + s.icon + ' ' + s.label + '</button>';
  }
  h += '</div>';

  // RDV fields (hidden unless rdv_pose)
  var showRdv = (l.status || 'nouveau') === 'rdv_pose';
  h += '<div class="ld-rdv-section" data-rdv-section="' + id + '" style="display:' + (showRdv ? 'block' : 'none') + '">';
  h += '<div class="ld-actions-title">📅 Rendez-vous</div>';
  h += '<div class="ld-rdv-row">';
  h += '<input type="date" data-field="rdvDate" data-id="' + id + '" value="' + (l.rdvDate || '') + '"/>';
  h += '<input type="time" data-field="rdvHeure" data-id="' + id + '" value="' + (l.rdvHeure || '') + '"/>';
  h += '</div>';
  h += '</div>';

  // Notes history
  h += '<div class="ld-actions-title">Notes</div>';
  var notesArr = l.notesHistory || [];
  if (notesArr.length > 0) {
    h += '<div class="ld-notes-history">';
    for (var ni = notesArr.length - 1; ni >= 0; ni--) {
      var n = notesArr[ni];
      var nDate = n.date || '';
      h += '<div class="ld-note-item">';
      h += '<div class="ld-note-item-head">';
      h += '<span class="ld-note-item-date">' + escHtml(nDate) + '</span>';
      h += '<button class="ld-note-item-del" data-action="delNote" data-id="' + id + '" data-note-idx="' + ni + '" title="Supprimer">✕</button>';
      h += '</div>';
      h += '<div class="ld-note-item-text">' + highlightMentions(n.text || '') + '</div>';
      h += '</div>';
    }
    h += '</div>';
  }
  h += '<div class="ld-notes-add-row">';
  h += '<textarea class="ld-notes-area" data-field="newNote" data-id="' + id + '" placeholder="Ajouter une note..." rows="2"></textarea>';
  h += '<button class="ld-notes-add-btn" data-action="addNote" data-id="' + id + '">+ Ajouter</button>';
  h += '</div>';

  // ── Vocaux (fil de discussion audio) ──
  // Le conteneur est présent dans le HTML, mais le module VoiceNotes
  // ne s'attache qu'au moment où la card est ouverte (cf. listener
  // toggle plus bas) pour éviter des dizaines d'onSnapshot inutiles.
  h += '<div class="ld-actions-title" style="margin-top:14px">🎙️ Vocaux</div>';
  h += '<div class="vn-container" data-vn-mount="' + id + '"></div>';

  // ── Follow-Up section ──
  var fus = l.followUps || [];
  var fuPending = 0, fuOverdue = 0;
  var nowTs = Date.now();
  for (var fi = 0; fi < fus.length; fi++) {
    if (!fus[fi].done) {
      fuPending++;
      var fuTs = new Date(fus[fi].dateTime).getTime();
      if (fuTs <= nowTs) fuOverdue++;
    }
  }
  h += '<div class="ld-fu-section">';
  h += '<button class="ld-fu-toggle" data-action="toggleFu" data-id="' + id + '">';
  h += '🔔 Follow-Up';
  if (fuOverdue > 0) {
    h += ' <span class="ld-fu-count" style="background:rgba(239,68,68,0.12);color:#ef4444">' + fuOverdue + ' en retard</span>';
  } else if (fuPending > 0) {
    h += ' <span class="ld-fu-count" style="background:rgba(245,158,11,0.12);color:#f59e0b">' + fuPending + '</span>';
  }
  h += '<span class="ct-arrow">▼</span></button>';
  h += '<div class="ld-fu-body" data-fu-body="' + id + '" style="display:none">';
  // Add form
  h += '<div class="ld-fu-add">';
  h += '<input type="date" data-fu-field="date" data-id="' + id + '"/>';
  h += '<input type="time" data-fu-field="time" data-id="' + id + '"/>';
  h += '<textarea data-fu-field="note" data-id="' + id + '" placeholder="Note du FU (optionnel)..." rows="1"></textarea>';
  h += '<button class="ld-fu-add-btn" data-action="addFu" data-id="' + id + '">🔔 Programmer</button>';
  h += '</div>';
  // Row 2 : durée + switch "ajouter au calendrier Stratégie"
  h += '<div class="ld-fu-add-row2">';
  h += '<span class="ld-fu-duration-label">Durée</span>';
  h += '<select class="ld-fu-duration-select" data-fu-field="duration" data-id="' + id + '">';
  h += '<option value="15">15 min</option>';
  h += '<option value="30" selected>30 min</option>';
  h += '<option value="45">45 min</option>';
  h += '<option value="60">1h</option>';
  h += '</select>';
  h += '<label class="ld-fu-cal-switch" title="Crée un événement sur le calendrier Google du closer assigné">';
  h += '<input type="checkbox" data-fu-field="pushCal" data-id="' + id + '" checked/>';
  h += '<span class="sw-track"></span>';
  h += '<span class="sw-label">📅 Calendrier Stratégie</span>';
  h += '</label>';
  h += '</div>';
  // List
  if (fus.length === 0) {
    h += '<div class="ld-fu-empty">Aucun follow-up programmé</div>';
  } else {
    h += '<div class="ld-fu-list">';
    // Sort: pending first (overdue first), then done
    var fuSorted = fus.map(function(f, idx) { f._idx = idx; return f; }).sort(function(a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return new Date(a.dateTime).getTime() - new Date(b.dateTime).getTime();
    });
    for (var fj = 0; fj < fuSorted.length; fj++) {
      var fu = fuSorted[fj];
      var fuDate = new Date(fu.dateTime);
      var fuTimeDiff = fuDate.getTime() - nowTs;
      var fuClass = '';
      if (!fu.done) {
        if (fuTimeDiff <= 0) fuClass = ' overdue';
        else if (fuTimeDiff <= 3600000) fuClass = ' due-soon'; // 1h
      }
      var fuDateStr = String(fuDate.getDate()).padStart(2,'0') + '/' + String(fuDate.getMonth()+1).padStart(2,'0') + '/' + fuDate.getFullYear();
      var fuTimeStr = String(fuDate.getHours()).padStart(2,'0') + ':' + String(fuDate.getMinutes()).padStart(2,'0');
      h += '<div class="ld-fu-item' + (fu.done ? ' done' : '') + fuClass + '">';
      h += '<button class="ld-fu-check" data-action="toggleFuDone" data-id="' + id + '" data-fu-idx="' + fu._idx + '">' + (fu.done ? '✓' : '') + '</button>';
      h += '<div class="ld-fu-info">';
      h += '<div class="ld-fu-datetime">' + (fu.done ? '✅ ' : (fuTimeDiff <= 0 && !fu.done ? '⚠️ ' : '🔔 ')) + fuDateStr + ' à ' + fuTimeStr;
      if (fu.calendarEventId && fu.calendarEventLink) {
        h += '<a class="ld-fu-cal-badge" href="' + escHtml(fu.calendarEventLink) + '" target="_blank" rel="noopener" title="Ouvrir l\'événement Google Calendar" onclick="event.stopPropagation()">📅 Calendrier</a>';
      } else if (fu.calendarEventId) {
        h += '<span class="ld-fu-cal-badge" title="Événement Google Calendar associé">📅</span>';
      }
      h += '</div>';
      if (fu.note) h += '<div class="ld-fu-note">' + escHtml(fu.note) + '</div>';
      if (fu.createdBy) h += '<div class="ld-fu-by">par ' + escHtml(fu.createdBy) + '</div>';
      h += '</div>';
      h += '<button class="ld-fu-del" data-action="delFu" data-id="' + id + '" data-fu-idx="' + fu._idx + '">✕</button>';
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>'; // fu-body
  h += '</div>'; // fu-section

  // ── SMS composer (envoi vers le prospect) ──
  var smsOptedOut = !!l.smsOptedOut;
  var smsHasPhone = !!(l.telephone && String(l.telephone).trim());
  if (smsOptedOut || !smsHasPhone) {
    h += '<div class="ld-sms-composer">';
    h += '<div class="ld-sms-composer-head"><div class="ld-sms-composer-title">💬 Envoyer un SMS</div></div>';
    if (smsOptedOut) {
      h += '<div class="ld-sms-composer-blocked">⚠️ Ce lead s\'est désabonné des SMS (STOP reçu). Impossible d\'envoyer.</div>';
    } else {
      h += '<div class="ld-sms-composer-blocked">⚠️ Aucun téléphone enregistré pour ce lead.</div>';
    }
    h += '</div>';
  } else {
    h += '<div class="ld-sms-composer">';
    h += '<div class="ld-sms-composer-head">';
    h += '<div class="ld-sms-composer-title">💬 Envoyer un SMS</div>';
    h += '<div class="ld-sms-composer-from">→ ' + escHtml(l.telephone) + '</div>';
    h += '</div>';
    h += '<textarea data-sms-input="' + id + '" placeholder="Votre message (signez avec votre prénom)..." maxlength="1530"></textarea>';
    h += '<div class="ld-sms-composer-footer">';
    h += '<div class="ld-sms-composer-counter" data-sms-counter="' + id + '">0 / 160</div>';
    h += '<button class="ld-sms-send-btn" data-action="sendSms" data-id="' + id + '">💬 Envoyer SMS</button>';
    h += '</div>';
    h += '<div class="ld-sms-composer-error" data-sms-error="' + id + '" style="display:none"></div>';
    h += '</div>';
  }

  // ── Communications history (calls + SMS) ──
  var comms = l.communications || [];
  var callsAndSms = [];
  for (var ci = 0; ci < comms.length; ci++) {
    if (comms[ci].type === 'call' || comms[ci].type === 'sms') callsAndSms.push(comms[ci]);
  }
  var callCount = 0, smsCount = 0;
  for (var cci = 0; cci < callsAndSms.length; cci++) {
    if (callsAndSms[cci].type === 'call') callCount++; else smsCount++;
  }
  h += '<div class="ld-comm-section">';
  h += '<button class="ld-comm-toggle" data-action="toggleComm" data-id="' + id + '">';
  h += '📞 Appels';
  if (callCount) h += ' <span class="ld-comm-count" style="background:rgba(52,211,153,0.12);color:#34d399">' + callCount + '</span>';
  h += ' &nbsp;💬 SMS';
  if (smsCount) h += ' <span class="ld-comm-count" style="background:rgba(96,165,250,0.12);color:#60a5fa">' + smsCount + '</span>';
  h += '<span class="ct-arrow">▼</span></button>';
  h += '<div class="ld-comm-list" data-comm-list="' + id + '" style="display:none">';
  if (callsAndSms.length === 0) {
    h += '<div class="ld-comm-empty">Aucun appel ou SMS synchronisé<br/>Les données apparaîtront via Ringover</div>';
  } else {
    // Tri chronologique ASC (du plus vieux en haut, comme iMessage)
    callsAndSms.sort(function(a, b) {
      var da = a.date ? new Date(a.date).getTime() : 0;
      var db2 = b.date ? new Date(b.date).getTime() : 0;
      return da - db2;
    });
    var ldOwnerKey = function(c) {
      // 1. Si on a ownerUid (Cloud Function moderne), match direct sur firebaseUid
      if (c.ownerUid) {
        var listU = window.TEAM_MEMBERS_LIST || [];
        for (var iu = 0; iu < listU.length; iu++) {
          if (listU[iu].firebaseUid === c.ownerUid) return listU[iu].slug;
        }
      }
      // 2. Fallback : match texte sur ownerName contre shortName/displayName
      var n = (c.ownerName || '').toLowerCase();
      if (n) {
        var listN = window.TEAM_MEMBERS_LIST || [];
        for (var jn = 0; jn < listN.length; jn++) {
          var sn = (listN[jn].shortName || '').toLowerCase();
          var dn = (listN[jn].displayName || '').toLowerCase();
          if (sn && n.indexOf(sn.replace(/[éèê]/g, 'e')) >= 0) return listN[jn].slug;
          if (sn && n.indexOf(sn) >= 0) return listN[jn].slug;
          if (dn && n.indexOf(dn.split(' ')[0].toLowerCase()) >= 0) return listN[jn].slug;
        }
      }
      return 'unknown';
    };
    // Détermine si la comm vient de l'équipe (out) ou du prospect (in).
    // Règle : si ownerName est défini → forcément équipe (out).
    // Sinon on regarde direction (qui peut être 'out', 'outbound', 'sortant', etc.).
    var ldSide = function(c) {
      if (c.ownerName) return 'out';
      var d = String(c.direction || '').toLowerCase();
      if (d === 'out' || d === 'outbound' || d === 'sortant') return 'out';
      return 'in';
    };
    var ldLastDay = '';
    for (var cj = 0; cj < callsAndSms.length; cj++) {
      var cm = callsAndSms[cj];
      var isCall = cm.type === 'call';
      var side = ldSide(cm);
      var ow = ldOwnerKey(cm);
      var cmDate = cm.date ? new Date(cm.date) : null;
      var cmDayKey = cmDate ? cmDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
      if (cmDayKey && cmDayKey !== ldLastDay) {
        h += '<div class="ld-conv-date-sep">' + escHtml(cmDayKey) + '</div>';
        ldLastDay = cmDayKey;
      }
      var timeStr = cmDate ? cmDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
      h += '<div class="ld-conv-row ' + side + '">';
      // Auteur (côté équipe seulement)
      if (side === 'out' && cm.ownerName) {
        h += '<div class="ld-conv-author ' + ow + '">' + escHtml(cm.ownerName) + '</div>';
      }
      if (isCall) {
        var clMissed = !cm.duration;
        var clDurStr = '';
        if (cm.duration) {
          var dm = Math.floor(cm.duration / 60), ds = cm.duration % 60;
          clDurStr = dm + 'm' + (ds ? String(ds).padStart(2, '0') + 's' : '');
        }
        var clIcon = side === 'out' ? '📞↗' : (clMissed ? '❌' : '📞↙');
        var clTitle = (side === 'out' ? 'Appel sortant' : 'Appel entrant') + (clMissed && side === 'in' ? ' (manqué)' : '');
        var callClass = 'ld-conv-call ' + side + (side === 'out' ? ' ' + ow : '') + (clMissed && side === 'in' ? ' missed' : '');
        // Bouton détail cliquable si l'appel a un callLogId (Twilio Dialer) ou un recordingUrl legacy (Ringover)
        var hasDetail = !!cm.callLogId;
        if (hasDetail) callClass += ' has-detail';
        h += '<div class="' + callClass + '"' + (hasDetail ? ' data-action="callDetail" data-cid="' + escAttr(cm.callLogId) + '" style="cursor:pointer"' : '') + '>';
        h += '<span class="ld-conv-call-icon">' + clIcon + '</span>';
        h += '<span class="ld-conv-call-title">' + escHtml(clTitle) + '</span>';
        if (clDurStr) h += '<span class="ld-conv-call-dur">' + clDurStr + '</span>';
        if (hasDetail) {
          var badges = '';
          if (cm.hasRecording)  badges += '🎙';
          if (cm.hasTranscript) badges += '📄';
          if (cm.hasAiAnalysis) badges += '🤖';
          if (badges) h += '<span class="ld-conv-call-badges" style="margin-left:auto;font-size:13px;opacity:0.85">' + badges + '</span>';
        }
        h += '</div>';
      } else {
        // SMS bubble
        h += '<div class="ld-conv-bubble ' + side + (side === 'out' ? ' ' + ow : '') + '">';
        if (cm.content) h += sanitizeCommContent(cm.content);
        else h += '<span style="color:var(--muted);font-style:italic">Contenu non disponible</span>';
        h += '</div>';
      }
      h += '<div class="ld-conv-meta">' + escHtml(timeStr) + (cm.source ? ' · ' + escHtml(cm.source) : '') + '</div>';
      h += '</div>'; // ld-conv-row
    }
  }
  h += '</div>';
  h += '</div>';

  // Delete button
  h += '<button class="ld-delete-btn" data-action="deleteLead" data-id="' + id + '">🗑 Supprimer cette fiche</button>';

  h += '</div>'; // actions
  h += '</div>'; // body
  h += '</div>'; // card

  return h;
}

/* ═══ FEED EVENTS ═══ */
document.getElementById('ldFeed').addEventListener('click', function(e) {
  // Appel via Ringover (DialerBridge) — numéro de tél du détail
  var dcTarget = e.target.closest('[data-action="dialerCall"]');
  if (dcTarget) {
    e.preventDefault();
    e.stopPropagation();
    if (window.DialerBridge && dcTarget.dataset.phone) {
      window.DialerBridge.callLead(
        dcTarget.dataset.leadId || null,
        dcTarget.dataset.phone,
        dcTarget.dataset.name || null
      );
    } else if (!window.DialerBridge) {
      console.warn('[DialerBridge] non chargé');
    }
    return;
  }

  // Call detail modal (click on a call row with callLogId)
  var cdTarget = e.target.closest('[data-action="callDetail"]');
  if (cdTarget) {
    e.stopPropagation();
    var cid = cdTarget.dataset.cid;
    if (cid && window.CallDetailModal) window.CallDetailModal.open(cid);
    return;
  }

  // Toggle card
  var toggle = e.target.closest('[data-action="toggle"]');
  if (toggle) {
    var card = toggle.closest('.ld-card');
    var id = card.dataset.leadId;
    if (card.classList.contains('open')) {
      card.classList.remove('open');
      openCardId = null;
      // Cleanup vocaux + listener RDV de la card qui se ferme
      var vnC = card.querySelector('.vn-container');
      if (vnC && window.VoiceNotes) window.VoiceNotes.detach(vnC);
      detachLeadRdvListener(id);
    } else {
      document.querySelectorAll('.ld-card.open').forEach(function(c) {
        c.classList.remove('open');
        // Cleanup vocaux + listener RDV des cards qui se ferment
        var oldVn = c.querySelector('.vn-container');
        if (oldVn && window.VoiceNotes) window.VoiceNotes.detach(oldVn);
        var oldId = c.dataset.leadId;
        if (oldId) detachLeadRdvListener(oldId);
      });
      card.classList.add('open');
      openCardId = id;
      // Attacher le module Vocaux pour la fiche qui vient de s'ouvrir
      var vnMount = card.querySelector('[data-vn-mount="' + id + '"]');
      if (vnMount && window.VoiceNotes) {
        window.VoiceNotes.attach(vnMount, id, getCurrentVoiceUser());
      }
      // Attacher le listener RDV (lit bookings.where('leadId','==',id) en temps réel)
      attachLeadRdvListener(id);
    }
    return;
  }

  // Send SMS (composer dans la card)
  var smsBtn = e.target.closest('[data-action="sendSms"]');
  if (smsBtn) {
    var smsLeadId = smsBtn.dataset.id;
    sendSmsFromCard(smsLeadId, smsBtn);
    return;
  }

  // Toggle communications history
  var commToggle = e.target.closest('[data-action="toggleComm"]');
  if (commToggle) {
    var commId = commToggle.dataset.id;
    var commList = document.querySelector('[data-comm-list="' + commId + '"]');
    if (commList) {
      var isOpen = commList.style.display !== 'none';
      commList.style.display = isOpen ? 'none' : 'flex';
      commToggle.classList.toggle('open', !isOpen);
    }
    return;
  }

  // Toggle form submissions history accordion
  var fhToggle = e.target.closest('[data-action="toggleFormHistory"]');
  if (fhToggle) {
    var fhId = fhToggle.dataset.id;
    var fhContent = document.querySelector('[data-form-history-content="' + fhId + '"]');
    if (fhContent) {
      var fhOpen = fhContent.style.display !== 'none';
      fhContent.style.display = fhOpen ? 'none' : 'block';
      fhToggle.classList.toggle('open', !fhOpen);
    }
    return;
  }

  // Toggle engagement history entry (accordéon d'un passage précédent)
  var engHead = e.target.closest('[data-action="toggleEngEntry"]');
  if (engHead) {
    var engEntryId = engHead.dataset.entry;
    var engEntry = document.querySelector('[data-eng-entry="' + engEntryId + '"]');
    if (engEntry) engEntry.classList.toggle('open');
    return;
  }

  // Toggle edit mode
  var editBtn = e.target.closest('[data-action="toggleEdit"]');
  if (editBtn) {
    var eid = editBtn.dataset.id;
    var viewEl = document.querySelector('[data-view-mode="' + eid + '"]');
    var editEl = document.querySelector('[data-edit-mode="' + eid + '"]');
    if (!viewEl || !editEl) return;
    var isEditing = editEl.style.display !== 'none';
    if (isEditing) {
      // Closing edit mode → re-render with fresh data
      isEditingLead = false;
      openCardId = eid;
      renderFeed();
    } else {
      // Opening edit mode
      viewEl.style.display = 'none';
      editEl.style.display = '';
      editBtn.classList.add('editing');
      editBtn.innerHTML = '✕ Annuler';
      isEditingLead = true;
    }
    return;
  }

  // Status button
  var statusBtn = e.target.closest('[data-action="setStatus"]');
  if (statusBtn) {
    var leadId = statusBtn.dataset.id;
    var newStatus = statusBtn.dataset.status;
    // Visual update
    var card2 = statusBtn.closest('.ld-card');
    card2.querySelectorAll('.ld-status-btn').forEach(function(b) {
      b.classList.remove('active');
      b.style.color = '';
      b.style.borderColor = '';
    });

      rdvSection.style.display = (newStatus === 'rdv_pose') ? 'block' : 'none';
    }

      nouveau:'lead', appele:'lead', decroche:'lead', messagerie:'lead',
      nrp1:'nrp1', nrp2:'nrp2', nrp3:'nrp3', all_nrp:'all_nrp',
      faux_numero:'faux_numero',
      follow_up_pm:'follow_up_pm', set:'set', rdv_self_booking:'rdv_self_booking',
      rdv_pose:'rdv_confirmes',
      pas_interesse:'disqualification', disqualifie:'disqualification',
      poubelle:'poubelle'
    };
    var syncStage = STATUS_TO_STAGE[newStatus];
    var updates = { status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (syncStage) {
      updates.stage = syncStage;
      for (var j = 0; j < allLeads.length; j++) {

  // Delete lead (two-step confirmation)

/* ═══ ROUND-ROBIN ASSIGNMENT ═══
   Round-robin sur les membres ÉLIGIBLES uniquement. Critères stricts :
     - active !== false
     - !archivedAt
     - eligibleForLeads === true (le flag dédié — un membre peut être visible
       dans Lead Live sans recevoir de leads en auto, ex: Head of Sales).
   Si le flag eligibleForLeads n'est pas posé, on retombe sur inLeadsModule
   pour la rétrocompatibilité (tant que la migration Phase 2 n'est pas faite). */
function getRoundRobinPool() {
  var src = window.TEAM_MEMBERS_LIST || [];
  return src.filter(function (m) {
    if (!m) return false;
    if (m.active === false) return false;
    if (m.archivedAt) return false;
    // STRICT : require explicit eligibleForLeads === true.
    // Tout autre cas (false, undefined, null) = exclu.
    // Évite les attributions sauvages quand le cache TEAM_MEMBERS_LIST est obsolète
    // sur un device de l'équipe (membre sans flag posé = jamais dans le pool).
    return m.eligibleForLeads === true;
  });
}

function assignLeadRoundRobin(leadId, callback) {
  var pool = getRoundRobinPool();
  if (pool.length === 0) {
    console.warn('[leads] roundrobin: aucun membre éligible, abandon');
    if (callback) callback(null);
    return;
  }
  // Si un seul membre éligible, lui attribuer directement (pas de RR nécessaire)
  if (pool.length === 1) {
    var only = pool[0].slug;
    db.collection('leads').doc(leadId).update({ assignedTo: only })
      .then(function() { if (callback) callback(only); })
      .catch(function(err) { console.error('[leads] solo-assign error:', err); });
    return;
  }
  var metaRef = db.collection('_meta').doc('roundrobin');
  db.runTransaction(function(tx) {
    return tx.get(metaRef).then(function(snap) {
      var last = (snap.exists && snap.data().lastAssigned) || null;
      // Trouver l'index du dernier dans le pool actuel (-1 si parti du pool)
      var lastIdx = -1;
      for (var i = 0; i < pool.length; i++) {
        if (pool[i].slug === last) { lastIdx = i; break; }
      }
      // Le suivant = (lastIdx + 1) % nbPool
      var nextIdx = (lastIdx + 1) % pool.length;
      var next = pool[nextIdx].slug;
      tx.set(metaRef, { lastAssigned: next }, { merge: true });
      tx.update(db.collection('leads').doc(leadId), { assignedTo: next });
      return next;
    });
  }).then(function(assigned) {
    if (callback) callback(assigned);
  }).catch(function(err) {
    console.error('[leads] roundrobin error:', err);
  });
}

/* Leads déjà tentés en auto-attribution depuis les listeners parallèles
   (re-optin / re-booking). Évite de relancer un round-robin à chaque tick
   tant que l'écriture assignedTo ne s'est pas propagée. */
var _resurrectAssignAttempted = {};

/* Attribue en round-robin un lead "ressuscité" (re-optin ou re-booking) qui
   n'a pas d'assignee. Les listeners parallèles (startOptinResurrectListening /
   startResurrectListening) surfacent ces leads "Déjà CRM" dans le feed MAIS
   ne passaient pas par le round-robin — contrairement au listener principal
   pour les nouveaux leads. Résultat : un lead dont la fiche existante n'avait
   pas d'assignedTo (ancien import, lead pré-attribution) restait sur "?" et
   devait être attribué à la main.
   Garde-fou course : si le pool n'est pas encore prêt (TEAM_MEMBERS_LIST pas
   chargé), on NE marque PAS "tenté" → un tick ultérieur réessaiera, plutôt
   que de geler définitivement le lead sur "?". */
function maybeAutoAssignResurrect(d) {
  if (!d || !d.id) return;
  if (d.assignedTo) return;                 // déjà attribué → rien à faire
  if (d._merged === true) return;           // doc fusionné → ignoré
  if (_resurrectAssignAttempted[d.id]) return;
  if (getRoundRobinPool().length === 0) return; // pool pas prêt → retry au prochain tick
  _resurrectAssignAttempted[d.id] = true;
  assignLeadRoundRobin(d.id);
}
