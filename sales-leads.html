<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #08080f;
  --bg2:    #0f0f1a;
  --bg3:    #14141f;
  --bg4:    #1a1a28;
  --border: rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --red:    #b91c1c;
  --red2:   #ef4444;
  --red3:   #fca5a5;
  --gold:   #f59e0b;
  --green:  #34d399;
  --blue:   #60a5fa;
  --purple: #a78bfa;
  --text:   rgba(255,255,255,0.92);
  --muted:  rgba(255,255,255,0.48);
  --muted2: rgba(255,255,255,0.22);
  --radius: 12px;
  --radius2:16px;
  --fh:     'Syne', sans-serif;
  --fb:     'Inter', sans-serif;
  --fm:     'DM Mono', monospace;
}

html, body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 680px; margin: 0 auto; padding: 0 0 100px; }

/* ── Header ── */
.ld-header {
  position: sticky; top: 0; z-index: 100;
  padding: 14px 16px;
  background: rgba(8,8,15,0.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.ld-header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ld-logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg,#ef4444,#b91c1c); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: white; box-shadow: 0 3px 12px rgba(239,68,68,0.3); flex-shrink: 0; }
.ld-title { font-family: var(--fh); font-size: 18px; font-weight: 800; flex: 1; }
.ld-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; animation: pulse 2s infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.ld-live-label { font-size: 11px; font-weight: 700; color: #34d399; text-transform: uppercase; letter-spacing: 0.5px; }
.ld-count { font-family: var(--fm); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: auto; }

/* ── Filters ── */
.ld-filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.ld-filters::-webkit-scrollbar { display: none; }
.ld-filter {
  padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: all 0.15s; flex-shrink: 0;
}
.ld-filter:hover { border-color: var(--border2); color: var(--text); }
.ld-filter.active { border-color: var(--red2); color: var(--red3); background: rgba(185,28,28,0.08); }

/* ── Date range popover ── */
.ld-date-wrap { position: relative; display: inline-block; flex-shrink: 0; }
.ld-date-pop {
  position: fixed; z-index: 9999;
  background: #14141f; border: 1px solid var(--border2); border-radius: 10px;
  padding: 12px; width: 240px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
.ld-date-pop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ld-date-pop-row label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--muted); width: 28px; flex-shrink: 0;
}
.ld-date-pop input[type="date"] {
  flex: 1; padding: 6px 8px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: var(--fb); font-size: 12px;
  color-scheme: dark;
}
.ld-date-pop input[type="date"]:focus { outline: none; border-color: var(--gold); }
.ld-date-pop-actions { display: flex; gap: 6px; margin-top: 4px; }
.ld-date-pop-actions button {
  flex: 1; padding: 7px 10px; border-radius: 7px; border: 1.5px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.ld-date-pop-actions button:hover { border-color: var(--border2); color: var(--text); }
.ld-date-pop-actions button.primary {
  border-color: var(--red2); color: var(--red3); background: rgba(185,28,28,0.08);
}
.ld-date-pop-actions button.primary:hover { background: rgba(185,28,28,0.16); }
.ld-date-pop-hint { font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.4; }

/* ── Member pills ── */
.ld-members { display: flex; gap: 6px; margin-bottom: 10px; }
.ld-member-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 20px; border: 1.5px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.ld-member-pill:hover { border-color: var(--border2); }
.ld-member-pill.active { border-color: var(--red2); color: var(--red3); background: rgba(185,28,28,0.08); }
.ld-member-pill .mp-dot { width: 7px; height: 7px; border-radius: 50%; }
.ld-member-pill .mp-count { font-family: var(--fm); font-size: 10px; opacity: 0.7; }

/* ── Search bar ── */
.ld-search {
  position: relative;
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  transition: border-color 0.15s, background 0.15s;
}
.ld-search:focus-within {
  border-color: rgba(239,68,68,0.4);
  background: var(--bg4);
}
.ld-search.has-value {
  border-color: rgba(239,68,68,0.3);
}
.ld-search-icon {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; flex-shrink: 0;
  color: var(--muted); font-size: 14px;
}
.ld-search-input {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--fb);
  font-size: 13px; font-weight: 500;
  padding: 8px 4px;
}
.ld-search-input::placeholder { color: var(--muted2); }
.ld-search-clear {
  display: none;
  align-items: center; justify-content: center;
  width: 28px; height: 28px; margin-right: 4px;
  background: transparent; border: none; border-radius: 6px;
  color: var(--muted); font-size: 16px; cursor: pointer;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.ld-search-clear:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.ld-search.has-value .ld-search-clear { display: flex; }
.ld-search-hint {
  font-size: 10px; font-weight: 600; color: var(--muted2);
  padding: 0 10px; font-family: var(--fm);
  flex-shrink: 0;
}

/* ── Feed ── */
.ld-feed { padding: 12px 12px; }
.ld-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

/* ── Lead Card ── */
.ld-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2);
  margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s;
}
.ld-card.new { border-color: rgba(52,211,153,0.4); animation: cardGlow 2s ease-out; }
@keyframes cardGlow { 0% { box-shadow: 0 0 20px rgba(52,211,153,0.3); } 100% { box-shadow: none; } }
.ld-card-head {
  padding: 14px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.ld-card-avatar {
  width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-family: var(--fh); font-size: 15px; font-weight: 800; color: white; flex-shrink: 0;
}
.ld-card-info { flex: 1; min-width: 0; }
.ld-card-name { font-family: var(--fh); font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ld-card-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.ld-card-badges { display: flex; gap: 4px; flex-shrink: 0; }
.ld-badge {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
}
.ld-badge.vsl { background: rgba(167,139,250,0.12); color: #c4b5fd; }
.ld-badge.self { background: rgba(245,158,11,0.12); color: #fcd34d; }
.ld-badge.other { background: rgba(96,165,250,0.12); color: #93bbfd; }
.ld-badge-status {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  display: flex; align-items: center; gap: 4px;
}
.ld-badge-status .sd { width: 6px; height: 6px; border-radius: 50%; }
.ld-assigned {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
}
.ld-card-time { font-size: 10px; color: var(--muted2); white-space: nowrap; flex-shrink: 0; }
.ld-card-arrow { font-size: 10px; color: var(--muted2); flex-shrink: 0; transition: transform 0.2s; }
.ld-card.open .ld-card-arrow { transform: rotate(180deg); }

/* ── Card Body (expanded) ── */
.ld-card-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.ld-card.open .ld-card-body { display: block; }

.ld-details { padding: 12px 0; }
.ld-detail-row { display: flex; gap: 8px; padding: 5px 0; font-size: 12px; align-items: center; }
.ld-detail-label { color: var(--muted); min-width: 90px; flex-shrink: 0; font-weight: 600; }
.ld-detail-val { color: var(--text); word-break: break-all; }
.ld-detail-val a { color: var(--blue); text-decoration: none; }

/* Edit mode */
.ld-edit-toggle {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  font-family: var(--fb); font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s;
  margin-bottom: 4px;
}
.ld-edit-toggle:hover { color: var(--text); border-color: var(--border2); }
.ld-edit-toggle.editing { color: var(--gold); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.06); }
.ld-detail-input {
  flex: 1; padding: 5px 8px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: var(--fb); font-size: 12px; outline: none;
  transition: border-color 0.15s;
}
.ld-detail-input:focus { border-color: var(--red2); }
.ld-detail-select {
  flex: 1; padding: 5px 8px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: var(--fb); font-size: 12px; outline: none;
}
.ld-detail-select option { background: var(--bg2); }
.ld-save-info-btn {
  width: 100%; padding: 8px; border: none; border-radius: 8px;
  background: rgba(245,158,11,0.15); color: #fcd34d;
  font-family: var(--fb); font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; margin-top: 6px;
}
.ld-save-info-btn:hover { background: rgba(245,158,11,0.25); }

/* Actions */
.ld-actions { padding: 12px 0 0; border-top: 1px solid var(--border); }
.ld-actions-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; }
.ld-status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
@media (max-width: 400px) { .ld-status-grid { grid-template-columns: repeat(2, 1fr); } }
.ld-status-btn {
  padding: 8px 6px; border-radius: 8px; border: 1.5px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center;
}
.ld-status-btn:hover { border-color: var(--border2); color: var(--text); }
.ld-status-btn.active { border-color: currentColor; background: rgba(255,255,255,0.04); }

.ld-rdv-row { display: flex; gap: 8px; margin-bottom: 10px; }
.ld-rdv-row input {
  flex: 1; padding: 8px 10px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: var(--fb); font-size: 12px; outline: none;
}
.ld-rdv-row input:focus { border-color: var(--red2); }

.ld-notes-area {
  width: 100%; padding: 10px 12px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: var(--fb); font-size: 12px;
  resize: none; min-height: 40px; max-height: 80px; outline: none;
}
.ld-notes-area:focus { border-color: var(--red2); }
.ld-notes-area::placeholder { color: var(--muted2); }
.ld-notes-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
.ld-notes-add-btn {
  padding: 8px 14px; border: none; border-radius: 8px; background: var(--bg4);
  border: 1px solid var(--border); color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.ld-notes-add-btn:hover { background: rgba(52,211,153,0.1); color: #34d399; border-color: rgba(52,211,153,0.3); }
.ld-notes-history { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; max-height: 200px; overflow-y: auto; }
.ld-notes-history::-webkit-scrollbar { width: 3px; }
.ld-notes-history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
.ld-note-item {
  padding: 8px 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 8px; font-size: 12px; line-height: 1.5;
}
.ld-note-item-head { display: flex; justify-content: space-between; margin-bottom: 3px; }
.ld-note-item-date { font-size: 10px; font-weight: 700; color: var(--muted); }
.ld-note-item-del {
  font-size: 10px; color: var(--muted2); cursor: pointer; background: none; border: none;
  padding: 0 2px; transition: color 0.15s;
}
.ld-note-item-del:hover { color: #ef4444; }
.ld-note-item-text { color: rgba(255,255,255,0.8); }

.ld-save-btn {
  width: 100%; padding: 10px; border: none; border-radius: 10px;
  background: linear-gradient(135deg,#b91c1c,#ef4444); color: white;
  font-family: var(--fb); font-size: 13px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; box-shadow: 0 3px 12px rgba(185,28,28,0.3);
}
.ld-save-btn:hover { transform: translateY(-1px); }
.ld-save-btn:active { transform: scale(0.98); }

/* Delete lead */
.ld-delete-btn {
  width: 100%; padding: 9px; border: 1.5px solid rgba(239,68,68,0.25); border-radius: 10px;
  background: transparent; color: rgba(239,68,68,0.7);
  font-family: var(--fb); font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all 0.2s; margin-top: 14px;
}
.ld-delete-btn:hover { background: rgba(239,68,68,0.08); color: #ef4444; border-color: rgba(239,68,68,0.4); }
.ld-delete-btn.confirming {
  background: rgba(239,68,68,0.15); color: #fca5a5; border-color: #ef4444;
  animation: deletePulse 1s infinite;
}
@keyframes deletePulse { 0%,100% { border-color: #ef4444; } 50% { border-color: rgba(239,68,68,0.4); } }

/* ── Communications history ── */
.ld-comm-section { padding: 12px 0 0; border-top: 1px solid var(--border); }
.ld-comm-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.ld-comm-toggle:hover { color: var(--text); border-color: var(--border2); }
.ld-comm-toggle .ct-arrow { transition: transform 0.2s; font-size: 9px; margin-left: auto; }
.ld-comm-toggle.open .ct-arrow { transform: rotate(180deg); }
.ld-comm-count { font-family: var(--fm); font-size: 10px; padding: 1px 5px; border-radius: 4px; }
.ld-comm-list {
  display: none; margin-top: 8px; max-height: 320px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px; padding: 4px 2px;
}
/* ── Bulles iMessage compactes (Leads Live cards) ── */
.ld-conv-row { display: flex; flex-direction: column; max-width: 82%; }
.ld-conv-row.in { align-self: flex-start; align-items: flex-start; }
.ld-conv-row.out { align-self: flex-end; align-items: flex-end; }
.ld-conv-author { font-size: 9px; font-weight: 700; padding: 0 10px 2px; letter-spacing: 0.2px; color: var(--muted); }
.ld-conv-author.elodie { color: #60a5fa; }
.ld-conv-author.guillaume { color: #f87171; }
.ld-conv-bubble {
  padding: 7px 11px; border-radius: 13px; font-size: 12px; line-height: 1.4;
  word-wrap: break-word; border: 1px solid transparent;
}
.ld-conv-bubble.in {
  background: rgba(255,255,255,0.04); border-color: var(--border);
  border-bottom-left-radius: 4px; color: rgba(255,255,255,0.86);
}
.ld-conv-bubble.out { border-bottom-right-radius: 4px; color: rgba(255,255,255,0.94); }
.ld-conv-bubble.out.elodie {
  background: linear-gradient(135deg, rgba(96,165,250,0.30), rgba(96,165,250,0.14));
  border-color: rgba(96,165,250,0.32);
}
.ld-conv-bubble.out.guillaume {
  background: linear-gradient(135deg, rgba(248,113,113,0.30), rgba(248,113,113,0.14));
  border-color: rgba(248,113,113,0.32);
}
.ld-conv-bubble.out.unknown {
  background: linear-gradient(135deg, rgba(167,139,250,0.26), rgba(167,139,250,0.12));
  border-color: rgba(167,139,250,0.30);
}
.ld-conv-call {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.04);
  border-radius: 13px; min-width: 180px; font-size: 11px;
}
.ld-conv-call.in { border-bottom-left-radius: 4px; }
.ld-conv-call.out { border-bottom-right-radius: 4px; }
.ld-conv-call.out.elodie { background: rgba(96,165,250,0.10); border-color: rgba(96,165,250,0.26); }
.ld-conv-call.out.guillaume { background: rgba(248,113,113,0.10); border-color: rgba(248,113,113,0.26); }
.ld-conv-call.missed { background: rgba(239,68,68,0.10); border-color: rgba(239,68,68,0.28); }
.ld-conv-call-icon { font-size: 12px; }
.ld-conv-call-title { font-weight: 600; color: rgba(255,255,255,0.9); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ld-conv-call-dur { font-family: var(--fm); font-size: 10px; color: var(--muted); flex-shrink: 0; }
.ld-conv-meta { font-size: 9px; color: var(--muted); margin-top: 2px; padding: 0 10px; }
.ld-conv-date-sep {
  align-self: center; font-size: 9px; font-weight: 700; color: var(--muted);
  padding: 8px 0 2px; letter-spacing: 0.4px; text-transform: uppercase;
}
.ld-comm-empty { text-align: center; padding: 16px; color: var(--muted2); font-size: 11px; }

/* ── Follow-Up Section ── */
.ld-fu-section { padding: 12px 0 0; border-top: 1px solid var(--border); }
.ld-fu-toggle {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.ld-fu-toggle:hover { color: var(--text); border-color: var(--border2); }
.ld-fu-toggle .ct-arrow { transition: transform 0.2s; font-size: 9px; margin-left: auto; }
.ld-fu-toggle.open .ct-arrow { transform: rotate(180deg); }
.ld-fu-count { font-family: var(--fm); font-size: 10px; padding: 1px 5px; border-radius: 4px; }
.ld-fu-body { margin-top: 8px; }
.ld-fu-add { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.ld-fu-add input[type="date"], .ld-fu-add input[type="time"] {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg3); color: var(--text); font-family: var(--fm); font-size: 12px;
  flex: 1; min-width: 100px;
}
.ld-fu-add input:focus { border-color: var(--gold); }
.ld-fu-add textarea {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg3); color: var(--text); font-family: var(--fb); font-size: 12px;
  resize: none; line-height: 1.4;
}
.ld-fu-add textarea::placeholder { color: var(--muted2); }
.ld-fu-add-btn {
  padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(245,158,11,0.3);
  background: rgba(245,158,11,0.1); color: #f59e0b; font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.ld-fu-add-btn:hover { background: rgba(245,158,11,0.15); color: #fbbf24; border-color: rgba(245,158,11,0.5); }
.ld-fu-list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; }
.ld-fu-list::-webkit-scrollbar { width: 3px; }
.ld-fu-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
.ld-fu-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; background: rgba(255,255,255,0.02); border: 1px solid var(--border);
  border-radius: 8px; font-size: 12px; line-height: 1.4; transition: all 0.15s;
}
.ld-fu-item.done { opacity: 0.45; }
.ld-fu-item.overdue { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.04); }
.ld-fu-item.due-soon { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.04); }
.ld-fu-check {
  width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border2);
  background: transparent; cursor: pointer; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center; font-size: 10px;
  color: transparent; transition: all 0.15s;
}
.ld-fu-check:hover { border-color: var(--green); color: var(--green); }
.ld-fu-item.done .ld-fu-check { border-color: var(--green); color: var(--green); background: rgba(52,211,153,0.1); }
.ld-fu-info { flex: 1; min-width: 0; }
.ld-fu-datetime { font-weight: 700; font-size: 11px; color: var(--gold); }
.ld-fu-item.done .ld-fu-datetime { color: var(--muted); }
.ld-fu-item.overdue .ld-fu-datetime { color: #ef4444; }
.ld-fu-note { font-size: 11px; color: rgba(255,255,255,0.65); margin-top: 2px; }
.ld-fu-by { font-size: 9px; color: var(--muted2); margin-top: 2px; }
.ld-fu-del {
  background: none; border: none; color: var(--muted2); cursor: pointer;
  font-size: 11px; padding: 2px; flex-shrink: 0; transition: color 0.15s;
}
.ld-fu-del:hover { color: #ef4444; }
.ld-fu-empty { text-align: center; padding: 12px; color: var(--muted2); font-size: 11px; }

/* ── FU add form : durée + switch calendrier ── */
.ld-fu-add-row2 {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: -4px; margin-bottom: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: rgba(255,255,255,0.02); border: 1px solid var(--border);
}
.ld-fu-duration-label {
  font-family: var(--fb); font-size: 11px; font-weight: 700;
  color: var(--muted); letter-spacing: 0.02em;
}
.ld-fu-duration-select {
  padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg3);
  color: var(--text); font-family: var(--fm); font-size: 11px;
  cursor: pointer;
}
.ld-fu-duration-select:focus { border-color: var(--gold); outline: none; }
.ld-fu-cal-switch {
  display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; user-select: none;
  font-family: var(--fb); font-size: 11px; color: var(--text);
  margin-left: auto;
}
.ld-fu-cal-switch input { display: none; }
.ld-fu-cal-switch .sw-track {
  width: 30px; height: 16px; border-radius: 9px;
  background: var(--bg3); border: 1px solid var(--border);
  position: relative; transition: all 0.15s;
}
.ld-fu-cal-switch .sw-track::after {
  content: ''; position: absolute; top: 1px; left: 1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--muted2); transition: all 0.15s;
}
.ld-fu-cal-switch input:checked + .sw-track {
  background: rgba(167,139,250,0.2); border-color: rgba(167,139,250,0.5);
}
.ld-fu-cal-switch input:checked + .sw-track::after {
  left: 16px; background: #a78bfa;
}
.ld-fu-cal-switch .sw-label { white-space: nowrap; }

/* ── FU item : pastille "event Google Calendar" ── */
.ld-fu-cal-badge {
  display: inline-flex; align-items: center; gap: 3px;
  margin-left: 6px; padding: 1px 6px; border-radius: 4px;
  background: rgba(167,139,250,0.14); color: #a78bfa;
  font-family: var(--fm); font-size: 10px; font-weight: 700;
  text-decoration: none; cursor: pointer;
  transition: all 0.15s;
}
.ld-fu-cal-badge:hover {
  background: rgba(167,139,250,0.22); color: #c4b5fd;
}

/* ── FU badge on card header ── */
.ld-fu-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--fm); font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 4px;
  background: rgba(245,158,11,0.12); color: #f59e0b;
}
.ld-fu-badge.overdue { background: rgba(239,68,68,0.12); color: #ef4444; animation: fuPulse 2s ease-in-out infinite; }
@keyframes fuPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* ── Reassign button ── */
.ld-reassign-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px;
  border-radius: 8px; font-size: 12px; font-weight: 700; font-family: var(--fm);
  background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.2);
  color: #f59e0b; text-decoration: none; cursor: pointer; transition: all 0.15s;
}
.ld-reassign-btn:hover { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); }

/* ── Booking button ── */
.ld-booking-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px;
  border-radius: 8px; font-size: 12px; font-weight: 700; font-family: var(--fm);
  background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.2);
  color: #a78bfa; cursor: pointer; transition: all 0.15s;
}
.ld-booking-btn:hover { background: rgba(167,139,250,0.15); border-color: rgba(167,139,250,0.4); }

/* ── Booking modal ── */
.ld-booking-overlay {
  display: none; position: fixed; inset: 0; z-index: 1500;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 16px;
}
.ld-booking-overlay.show { display: flex; }
.ld-booking-modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 16px; width: 100%; max-width: 800px; height: 85vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  animation: popIn 0.3s cubic-bezier(.4,0,.2,1);
}
.ld-booking-modal-header {
  display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.ld-booking-modal-header .title {
  font-family: var(--fh); font-size: 15px; font-weight: 800; flex: 1;
}
.ld-booking-modal-header .lead-info {
  font-size: 11px; color: var(--muted); font-family: var(--fm);
}
.ld-booking-close {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg3); color: var(--muted); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.ld-booking-close:hover { color: var(--text); border-color: var(--border2); }
.ld-booking-iframe {
  flex: 1; border: none; width: 100%; background: white; border-radius: 0 0 16px 16px;
}

@media (max-width: 640px) {
  .ld-booking-modal { max-width: 100%; height: 95vh; border-radius: 12px; }
}

/* ── New Lead Popup ── */
.ld-popup-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 20px;
}
.ld-popup-overlay.show { display: flex; }
.ld-popup {
  background: var(--bg2); border: 2px solid rgba(52,211,153,0.4);
  border-radius: 20px; width: 100%; max-width: 380px; overflow: hidden;
  animation: popIn 0.3s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px rgba(52,211,153,0.15);
}
@keyframes popIn { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.ld-popup-header {
  padding: 20px; text-align: center;
  background: linear-gradient(135deg, rgba(52,211,153,0.1), rgba(96,165,250,0.05));
}
.ld-popup-icon { font-size: 40px; margin-bottom: 8px; }
.ld-popup-title { font-family: var(--fh); font-size: 18px; font-weight: 800; }
.ld-popup-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.ld-popup-body { padding: 16px 20px; }
.ld-popup-field { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.ld-popup-field:last-child { border-bottom: none; }
.ld-popup-field-label { color: var(--muted); font-weight: 600; }
.ld-popup-field-val { font-weight: 700; text-align: right; max-width: 60%; word-break: break-all; }
.ld-popup-assigned {
  margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; text-align: center;
  font-size: 13px; font-weight: 700;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
}
.ld-popup-actions { padding: 12px 20px 20px; display: flex; gap: 8px; }
.ld-popup-btn {
  flex: 1; padding: 12px; border: none; border-radius: 12px;
  font-family: var(--fb); font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.ld-popup-btn.primary { background: linear-gradient(135deg,#059669,#34d399); color: #0f0f1a; }
.ld-popup-btn.ghost { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }
.ld-popup-btn:active { transform: scale(0.97); }

/* ── Toast ── */
.ld-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1a2e1a; border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7;
  font-size: 13px; font-weight: 600; padding: 10px 20px; border-radius: 10px;
  z-index: 2000; opacity: 0; transition: all 0.3s; white-space: nowrap; pointer-events: none;
}
.ld-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Responsive helpers ── */
@media (min-width: 769px) {
  .page { padding-top: 16px; }
}
</style>
</head>
<body>

<div class="page">

  <!-- ── HEADER ── -->
  <div class="ld-header">
    <div class="ld-header-top">
      <div class="ld-logo">A</div>
      <div class="ld-title" id="ldTitle">Leads Live</div>
      <span class="ld-live-dot"></span>
      <span class="ld-live-label">Live</span>
      <span id="ldPersonalBadge" style="display:none;font-size:12px;font-weight:800;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid var(--border)"></span>
      <span class="ld-count" id="ldCount">— leads</span>
      <button id="shareBtn" title="Liens app mobile" style="margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0" onclick="toggleSharePanel()">🔗</button>
      <button id="pushBtn" title="Activer les notifications" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0" onclick="requestPush()">🔕</button>
      <button title="Créer une fiche" style="width:34px;height:34px;border-radius:9px;border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.1);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;color:#34d399;font-weight:700" onclick="openCreateLead()">+</button>
    </div>
    <!-- Share panel -->
    <div id="sharePanel" style="display:none;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin:8px 0">
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:8px">📱 Liens app mobile — ajouter à l'écran d'accueil</div>
      <div id="shareLinksList"></div>
    </div>
    <!-- Search bar -->
    <div class="ld-search" id="ldSearch">
      <span class="ld-search-icon">🔍</span>
      <input type="text" id="ldSearchInput" class="ld-search-input" placeholder="Chercher un lead (nom, tel, email, secteur…)" autocomplete="off" spellcheck="false"/>
      <span class="ld-search-hint" id="ldSearchHint" style="display:none"></span>
      <button type="button" id="ldSearchClear" class="ld-search-clear" aria-label="Effacer la recherche">×</button>
    </div>
    <div class="ld-members" id="ldMembers">
      <button class="ld-member-pill active" data-member="all">
        <span>Tous</span> <span class="mp-count" id="countAll">0</span>
      </button>
      <!-- Les pills par membre sont injectées dynamiquement par renderMemberPillsCounters() -->
      <span id="ldMemberPillsDynamic"></span>
    </div>
    <div class="ld-filters" id="ldPeriodFilters" style="margin-bottom:4px">
      <button class="ld-filter active" data-period="today">📅 Aujourd'hui</button>
      <button class="ld-filter" data-period="week">🗓 7 jours</button>
      <button class="ld-filter" data-period="unprocessed">🆕 Non traités</button>
      <button class="ld-filter" data-period="all">📋 Tout</button>
      <div class="ld-date-wrap">
        <button class="ld-filter" id="ldDateBtn" type="button">📆 Date</button>
        <div class="ld-date-pop" id="ldDatePop" style="display:none">
          <div class="ld-date-pop-row">
            <label>Du</label>
            <input type="date" id="ldDateFrom"/>
          </div>
          <div class="ld-date-pop-row">
            <label>Au</label>
            <input type="date" id="ldDateTo"/>
          </div>
          <div class="ld-date-pop-actions">
            <button type="button" id="ldDateClear">Effacer</button>
            <button type="button" class="primary" id="ldDateApply">Appliquer</button>
          </div>
          <div class="ld-date-pop-hint">Laisse « Au » vide pour filtrer un seul jour.</div>
        </div>
      </div>
    </div>
    <div class="ld-filters" id="ldTypeFilters" style="margin-bottom:4px"></div>
    <div class="ld-filters" id="ldFilters">
      <button class="ld-filter active" data-status="all">Tous</button>
      <button class="ld-filter" data-status="nouveau">🆕 Nouveau</button>
      <button class="ld-filter" data-status="appele">📞 Appelé</button>
      <button class="ld-filter" data-status="decroche">✅ Décroché</button>
      <button class="ld-filter" data-status="messagerie">📩 Messagerie</button>
      <button class="ld-filter" data-status="nrp1">📵 NRP 1</button>
      <button class="ld-filter" data-status="nrp2">📵 NRP 2</button>
      <button class="ld-filter" data-status="nrp3">📵 NRP 3</button>
      <button class="ld-filter" data-status="rdv_pose">📅 RDV posé</button>
      <button class="ld-filter" data-status="pas_interesse">👎 Pas intéressé</button>
      <button class="ld-filter" data-status="disqualifie">🚫 Disqualifié</button>
    </div>
  </div>

  <!-- ── FEED ── -->
  <div class="ld-feed" id="ldFeed">
    <div class="ld-empty">Chargement des leads...</div>
  </div>

</div>

<!-- ── APP LOGIN ── -->
<div id="appLoginOverlay" style="display:none;position:fixed;inset:0;z-index:2000;background:var(--bg);padding:20px;display:none;flex-direction:column;align-items:center;justify-content:center">
  <div style="width:100%;max-width:340px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#b91c1c,#ef4444);display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:white;margin-bottom:12px;box-shadow:0 4px 16px rgba(185,28,28,0.3)">A</div>
      <div style="font-family:var(--fh);font-size:20px;font-weight:800">Leads Live</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Connectez-vous pour accéder aux leads</div>
    </div>
    <div style="margin-bottom:12px">
      <input type="email" id="appLoginEmail" placeholder="Email" style="width:100%;padding:12px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--fb);font-size:14px;outline:none"/>
    </div>
    <div style="margin-bottom:16px">
      <input type="password" id="appLoginPassword" placeholder="Mot de passe" style="width:100%;padding:12px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--fb);font-size:14px;outline:none"/>
    </div>
    <button id="appLoginBtn" style="width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#b91c1c,#ef4444);color:white;font-family:var(--fb);font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(185,28,28,0.3)">Se connecter</button>
    <div id="appLoginError" style="text-align:center;font-size:12px;color:#ef4444;margin-top:10px;display:none"></div>
    <label style="display:flex;align-items:center;gap:6px;margin-top:12px;cursor:pointer;font-size:12px;color:var(--muted)">
      <input type="checkbox" id="appLoginRemember" checked style="accent-color:#ef4444"/> Rester connecté
    </label>
  </div>
</div>

<!-- ── NEW LEAD POPUP ── -->
<div class="ld-popup-overlay" id="popupOverlay">
  <div class="ld-popup">
    <div class="ld-popup-header">
      <div class="ld-popup-icon">🔔</div>
      <div class="ld-popup-title">Nouveau Lead !</div>
      <div class="ld-popup-sub" id="popupType"></div>
    </div>
    <div class="ld-popup-body" id="popupBody"></div>
    <div class="ld-popup-actions">
      <button class="ld-popup-btn ghost" id="popupDismiss">OK</button>
      <button class="ld-popup-btn primary" id="popupCall">📞 Appeler</button>
    </div>
  </div>
</div>

<div class="ld-toast" id="ldToast"></div>

<!-- ── CREATE LEAD MODAL ── -->
<div id="createLeadOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;backdrop-filter:blur(4px);align-items:center;justify-content:center" onclick="if(event.target===this)closeCreateLead()">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:92%;max-width:420px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <div style="width:36px;height:36px;border-radius:10px;background:rgba(52,211,153,.15);display:flex;align-items:center;justify-content:center;font-size:18px">📝</div>
      <div style="font-family:var(--fh);font-size:16px;font-weight:800">Nouvelle fiche</div>
      <button onclick="closeCreateLead()" style="margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px">✕</button>
    </div>

<script>
/* ═══════════════════════════════════════

var db = firebase.firestore();

/* ── Config ── */
/* SETTERS est désormais un cache local rempli dynamiquement depuis
   window.TEAM_MEMBERS (chargé via nav.js → loadTeamMembers).
   Le format reste { slug: { name, color, initials, active } } pour
   garder la compatibilité avec tout le code existant. */
var SETTERS = {};

function refreshSettersFromTeamMembers() {
  SETTERS = {};
  var list = window.TEAM_MEMBERS_LIST || [];
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    SETTERS[m.slug] = {
      name: m.shortName || m.displayName || m.slug,
      color: m.color || '#6b7280',
      initials: m.initials || (m.shortName || m.slug || '?')[0].toUpperCase(),
      active: m.active !== false,
      _meta: m
    };
  }
}

/* Injection dynamique du CSS pour chaque membre (couleurs des bulles, auteurs,
   appels). On génère une règle par slug à partir de TEAM_MEMBERS_LIST.
   Les membres inactifs reçoivent une teinte grise + opacité. */
function injectTeamMemberStyles() {
  var styleId = 'team-member-dynamic-styles';
  var existing = document.getElementById(styleId);
  if (existing) existing.remove();
  var list = window.TEAM_MEMBERS_LIST || [];
  if (!list.length) return;
  var css = '';
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    var slug = m.slug;
    var color = m.color || '#6b7280';
    // Convertir hex → rgba pour les fonds atténués
    var rgb = hexToRgb(color);
    var rgbStr = rgb ? rgb.r + ',' + rgb.g + ',' + rgb.b : '107,114,128';
    var inactive = m.active === false;
    var opacityRule = inactive ? 'opacity:.55;' : '';
    css += '.ld-conv-author.' + slug + '{color:' + color + ';' + opacityRule + '}';
    css += '.ld-conv-bubble.out.' + slug + '{background:rgba(' + rgbStr + ',0.18);border-color:rgba(' + rgbStr + ',0.32);color:#fff;' + opacityRule + '}';
    css += '.ld-conv-call.out.' + slug + '{background:rgba(' + rgbStr + ',0.10);border-color:rgba(' + rgbStr + ',0.26);' + opacityRule + '}';
    if (inactive) {
      css += '.ld-conv-author.' + slug + '::after{content:" 🔒";font-size:10px;}';
    }
  }
  var styleEl = document.createElement('style');
  styleEl.id = styleId;
  styleEl.textContent = css;
  document.head.appendChild(styleEl);
}

function hexToRgb(hex) {
  var s = (hex || '').replace('#', '');
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  if (s.length !== 6) return null;
  var n = parseInt(s, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

/* Génère et injecte les "pills" de membres en haut de la page Leads Live.
   Remplace le HTML statique guillaume/elodie par du dynamique basé sur
   TEAM_MEMBERS_ACTIVE. */
function renderMemberPills() {
  var container = document.getElementById('ldMemberPillsContainer');
  if (!container) return;
  var html = '<button class="ld-member-pill active" data-member="all">' +
             '<span class="ld-member-dot" style="background:linear-gradient(135deg,#a78bfa,#60a5fa)"></span>Tous</button>';
  var active = window.TEAM_MEMBERS_ACTIVE || [];
  for (var i = 0; i < active.length; i++) {
    var m = active[i];
    html += '<button class="ld-member-pill" data-member="' + m.slug + '">' +
            '<span class="ld-member-dot" style="background:' + m.color + '"></span>' +
            escHtml(m.shortName || m.displayName || m.slug) +
            '</button>';
  }
  container.innerHTML = html;
  // Re-attach les listeners (les anciens sont morts avec l'innerHTML)
  container.querySelectorAll('.ld-member-pill').forEach(function (p) {
    p.addEventListener('click', function () {
      container.querySelectorAll('.ld-member-pill').forEach(function (x) { x.classList.remove('active'); });
      p.classList.add('active');
      filterMember = p.dataset.member;
      renderFeed();
    });
  });
  // Si on est en mode personnel, sélectionner la pill correspondante
  if (personalUser) {
    container.querySelectorAll('.ld-member-pill').forEach(function (p) {
      p.classList.remove('active');
      if (p.dataset.member === personalUser) p.classList.add('active');
    });
  }
}

/* Génère le contenu d'un <select> pour assigner un lead à un membre.
   `currentSlug` = la valeur actuelle (pour préselection).
   `includeEmpty` = ajouter une option "Non attribué".
   Inclut les inactifs avec mention "(inactif)" et icône cadenas mais
   désactivés (non sélectionnables) sauf si la valeur courante est déjà
   un inactif (pour ne pas faire disparaître la valeur affichée). */
function buildAssignSelectOptions(currentSlug, includeEmpty) {
  var html = '';
  if (includeEmpty) html += '<option value="">Non attribué</option>';
  var list = window.TEAM_MEMBERS_LIST || [];
  // Actifs en premier
  var activeList = list.filter(function (m) { return m.active !== false; });
  var inactiveList = list.filter(function (m) { return m.active === false; });
  for (var i = 0; i < activeList.length; i++) {
    var m = activeList[i];
    var sel = m.slug === currentSlug ? ' selected' : '';
    html += '<option value="' + m.slug + '"' + sel + '>' + escHtml(m.shortName || m.slug) + '</option>';
  }
  for (var j = 0; j < inactiveList.length; j++) {
    var m2 = inactiveList[j];
    var isCurrent = m2.slug === currentSlug;
    var sel2 = isCurrent ? ' selected' : '';
    var disabled = isCurrent ? '' : ' disabled';
    html += '<option value="' + m2.slug + '"' + sel2 + disabled + '>🔒 ' + escHtml(m2.shortName || m2.slug) + ' (inactif)</option>';
  }
  return html;
}

function toast(msg) {

function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function sanitizeCommContent(raw) {
  if (!raw) return '';
  var s = raw;
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<a[^>]+href=["']([^"']+)["'][^>]*>[^<]*<\/a>/gi, '$1');
  s = s.replace(/<a[^>]+href=["']([^"']+)["'][^>]*/gi, '$1');
  s = s.replace(/<a[^>]*href=["'][^"']*/gi, '');
  s = s.replace(/<[^>]*>?/g, '');
  s = s.replace(/\[\d*m\]/g, '');
  s = s.replace(/\x1b\[[0-9;]*m/g, '');
  s = s.replace(/Enregistrement de l'appel\s*:\s*$/gm, '');
  s = s.replace(/Enregistrement de l'appel\s*:\s*htt\w{0,5}\s*$/gm, '');
  s = s.replace(/\n\s*\n/g, '\n').replace(/\n+$/, '').replace(/^\n+/, '');
  var d = document.createElement('div');
  d.textContent = s;
  var escaped = d.innerHTML;
  escaped = escaped.replace(/\n/g, '<br/>');
  escaped = escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#60a5fa;word-break:break-all">$1</a>');
  return escaped;
}

function normalizeTel(raw) {
  if (!raw) return '';
  var s = raw.replace(/[^\d+]/g, '');
  // +33XXXXXXXXX → 0XXXXXXXXX
  if (s.indexOf('+33') === 0 && s.length >= 12) s = '0' + s.slice(3);
  // 33XXXXXXXXX (11 digits) → 0XXXXXXXXX
  if (/^33[67]/.test(s) && s.length === 11) s = '0' + s.slice(2);
  // 9 digits starting with 6 or 7 → prepend 0
  if (/^[67]/.test(s) && s.length === 9) s = '0' + s;
  // Format 10-digit French number with spaces
  if (/^0[67]\d{8}$/.test(s)) return s.replace(/(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4 $5');
  // Fallback: return cleaned version
  return raw;
}

// Retourne les 9 derniers chiffres significatifs d'un numéro (mobile FR ou
// international). Sert de clé de matching robuste indépendante du format.
//   "06 11 71 73 05"   → "611717305"
//   "+33611717305"     → "611717305"
//   "33611717305"      → "611717305"
function phoneNormalized(raw) {
  if (!raw) return null;
  var digits = String(raw).replace(/[^\d]/g, '');
  if (digits.length < 6) return null;
  if (digits.length >= 9) return digits.slice(-9);
  return digits;
}

/* Normalise une chaîne pour la recherche texte : minuscules + strip accents. */
function _normForSearch(s) {
  if (s === null || s === undefined) return '';
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .trim();
}
/* Retourne uniquement les chiffres d'une chaîne. */
function _digitsOnly(s) {
  return String(s || '').replace(/\D/g, '');
}

function timeAgo(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var now = new Date();
  var diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'À l\'instant';
  if (diff < 3600) return Math.floor(diff / 60) + ' min';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return Math.floor(diff / 86400) + 'j';
}

function formatDateTimeFr(ts) {
  if (!ts) return '—';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var jours = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  return jours[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + ' à ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* ═══ SOUND NOTIFICATION ═══ */
var audioCtx = null;
function playNotifSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    // Two-tone chime
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}

/* ═══ NEW LEAD POPUP ═══ */
var popupQueue = [];
var popupShowing = false;

function showLeadPopup(lead) {
  popupQueue.push(lead);
  if (!popupShowing) processPopupQueue();
}

function processPopupQueue() {
  if (popupQueue.length === 0) { popupShowing = false; return; }
  popupShowing = true;
  var lead = popupQueue.shift();
  var typeObj = LEAD_TYPES[lead.type] || { label: lead.type || 'Lead', badgeClass: 'other' };
  var setterObj = SETTERS[lead.assignedTo] || null;

  document.getElementById('popupType').textContent = typeObj.label;
  var h = '';
  h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Nom</span><span class="ld-popup-field-val">' + escHtml(lead.nom) + '</span></div>';
  if (lead.telephone) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Téléphone</span><span class="ld-popup-field-val">' + escHtml(lead.telephone) + '</span></div>';
  if (lead.email) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Email</span><span class="ld-popup-field-val">' + escHtml(lead.email) + '</span></div>';
  if (lead.utm) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Source</span><span class="ld-popup-field-val">' + escHtml(lead.utm) + '</span></div>';
  if (lead.secteur) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Secteur</span><span class="ld-popup-field-val">' + escHtml(lead.secteur) + '</span></div>';
  if (lead.ca) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">CA</span><span class="ld-popup-field-val">' + escHtml(lead.ca) + '</span></div>';
  if (setterObj) {
    h += '<div class="ld-popup-assigned">Attribué à <strong style="color:' + setterObj.color + '">' + setterObj.name + '</strong></div>';
  }
  document.getElementById('popupBody').innerHTML = h;

  // Call button
  var callBtn = document.getElementById('popupCall');
  if (lead.telephone) {
    callBtn.style.display = '';
    callBtn.onclick = function() {
      window.open('tel:' + lead.telephone.replace(/\s/g, ''), '_self');
    };
  } else {
    callBtn.style.display = 'none';
  }

  document.getElementById('popupOverlay').classList.add('show');
  playNotifSound();
}

document.getElementById('popupDismiss').addEventListener('click', function() {
  document.getElementById('popupOverlay').classList.remove('show');
  setTimeout(processPopupQueue, 300);
});
document.getElementById('popupOverlay').addEventListener('click', function(e) {

/* ── Date popover ── */
// Sort le popover de .ld-header (qui a backdrop-filter, créant un containing
// block pour position:fixed en WebKit). Ré-appendu à <body> pour que
// position:fixed se calcule bien par rapport au viewport.
(function moveDatePopToBody() {
  var pop = document.getElementById('ldDatePop');
  if (pop && pop.parentNode !== document.body) {
    document.body.appendChild(pop);
  }
})();

function refreshDateBtnLabel() {
  var btn = document.getElementById('ldDateBtn');
  if (!btn) return;
  if (filterPeriod === 'custom' && customDateFrom) {
    var fmt = function(d) {
      return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
    };
    var label = '📆 ' + fmt(customDateFrom);
    if (customDateTo) {
      // Si même jour, on n'affiche qu'une date
      var sameDay = customDateFrom.getFullYear() === customDateTo.getFullYear()
                 && customDateFrom.getMonth() === customDateTo.getMonth()
                 && customDateFrom.getDate() === customDateTo.getDate();
      if (!sameDay) label += ' → ' + fmt(customDateTo);
    }
    btn.textContent = label;
    btn.classList.add('active');
  } else {
    btn.textContent = '📆 Date';
    btn.classList.remove('active');
  }
}

document.getElementById('ldDateBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  var pop = document.getElementById('ldDatePop');
  var btn = e.currentTarget;
  var open = pop.style.display !== 'none';
  if (open) { pop.style.display = 'none'; return; }
  // Position fixed sous le bouton, recalée pour ne pas dépasser à droite
  var rect = btn.getBoundingClientRect();
  var popW = 240 + 24; // largeur + padding
  var left = Math.min(rect.left, window.innerWidth - popW - 8);
  if (left < 8) left = 8;

/* ── Search bar ──
   Comportement : quand la recherche devient active, on élargit automatiquement
   la période à 'all' (dans la fenêtre 30j chargée par le listener Firestore)
   pour que la recherche couvre un maximum de leads. Au clear, on restaure la
   période précédente. Les filtres membre / type / statut continuent à se
   cumuler avec la recherche. */
(function() {
  var searchWrap  = document.getElementById('ldSearch');
  var searchInput = document.getElementById('ldSearchInput');
  var clearBtn    = document.getElementById('ldSearchClear');
  if (!searchInput || !searchWrap) return;

  function _setPeriodUI(period) {
    var btns = document.querySelectorAll('#ldPeriodFilters .ld-filter');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      if (!b.dataset.period) continue;
      if (b.dataset.period === period) b.classList.add('active');
      else b.classList.remove('active');
    }
  }

  function _applySearch(val) {
    var prev = filterSearch;
    filterSearch = val.trim();

    if (filterSearch && !prev) {
      // Transition inactive → active : on mémorise la période et on élargit
      _prevPeriodBeforeSearch = filterPeriod;
      if (filterPeriod !== 'all' && filterPeriod !== 'custom') {
        filterPeriod = 'all';
        _setPeriodUI('all');
      }
    } else if (!filterSearch && prev) {
      // Transition active → inactive : on restaure la période précédente
      if (_prevPeriodBeforeSearch && _prevPeriodBeforeSearch !== 'all') {
        filterPeriod = _prevPeriodBeforeSearch;
        _setPeriodUI(filterPeriod);
      }
      _prevPeriodBeforeSearch = null;
    }

    // UI state : afficher / cacher le bouton clear
    if (filterSearch) searchWrap.classList.add('has-value');
    else              searchWrap.classList.remove('has-value');

    renderFeed();
  }

  // Debounce léger pour éviter de re-render à chaque frappe sur des grosses listes
  var _searchTimer = null;
  searchInput.addEventListener('input', function() {
    var v = this.value;
    if (_searchTimer) clearTimeout(_searchTimer);
    _searchTimer = setTimeout(function() { _applySearch(v); }, 80);
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      searchInput.value = '';
      _applySearch('');
      searchInput.blur();
    }
  });

  clearBtn.addEventListener('click', function() {
    searchInput.value = '';
    _applySearch('');
    searchInput.focus();
  });
})();

/* ═══ RENDER FEED ═══ */
function getFilteredLeads() {
  var list = getBaseLeads();

  // Period filter
  if (filterPeriod === 'today') {
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    var todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    list = list.filter(function(l) {
      if (!l.createdAt) return false;
      var d = l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt);
      return d >= todayStart && d <= todayEnd;
    });
  } else if (filterPeriod === 'week') {
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    list = list.filter(function(l) {
      if (!l.createdAt) return false;
      var d = l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt);
      return d >= weekAgo;
    });
  } else if (filterPeriod === 'unprocessed') {
    list = list.filter(function(l) { return !l.status || l.status === 'nouveau'; });
  } else if (filterPeriod === 'custom' && customDateFrom) {
    var cFrom = customDateFrom;
    var cTo = customDateTo || new Date(customDateFrom.getFullYear(), customDateFrom.getMonth(), customDateFrom.getDate(), 23, 59, 59, 999);
    list = list.filter(function(l) {
      if (!l.createdAt) return false;
      var d = l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt);
      return d >= cFrom && d <= cTo;
    });
  }
  // 'all' = no period filter

  if (filterMember !== 'all') {
    list = list.filter(function(l) { return l.assignedTo === filterMember; });
  }
  if (filterType !== 'all') {
    list = list.filter(function(l) { return (l.type || '') === filterType; });
  }
  if (filterStatus !== 'all') {
    list = list.filter(function(l) { return (l.status || 'nouveau') === filterStatus; });
  }

  // ── Search filter (nom / tel / email / secteur / utm / défi / dispo / timeline /
  //    stage / type / membre assigné / id). Multi-tokens : AND entre tokens,
  //    OR entre champs. Téléphone matché sur 9 derniers digits (FR). ──
  if (filterSearch) {
    var rawQ = filterSearch;
    var q = _normForSearch(rawQ);
    var tokens = q.split(/\s+/).filter(Boolean);
    var members = (typeof window !== 'undefined' && window.TEAM_MEMBERS) ? window.TEAM_MEMBERS : {};
    list = list.filter(function(l) {
      // Texte concaténé pour match générique
      var assigned = l.assignedTo || '';
      var memberFull = '';
      if (assigned && members[assigned]) {
        var m = members[assigned];
        memberFull = (m.name || '') + ' ' + (m.shortName || '') + ' ' + (m.slug || '');
      }
      var statusObj = (typeof getStatusObj === 'function') ? getStatusObj(l.status || 'nouveau') : null;
      var statusLabel = statusObj ? (statusObj.label || '') : '';
      var typeLabel = (typeof LEAD_TYPES !== 'undefined' && LEAD_TYPES[l.type]) ? (LEAD_TYPES[l.type].label || '') : '';
      var hay = _normForSearch([
        l.nom, l.email, l.utm, l.secteur, l.ca, l.defi,
        l.disponibilite, l.timeline, l.stage, l.type, typeLabel,
        l.status, statusLabel, assigned, memberFull, l.id
      ].filter(Boolean).join(' \u0001 '));
      // Digits du téléphone (9 derniers)
      var phone9 = phoneNormalized(l.telephone) || '';
      var phoneFull = _digitsOnly(l.telephone);
      // Chaque token doit matcher au moins un champ
      for (var ti = 0; ti < tokens.length; ti++) {
        var tok = tokens[ti];
        if (!tok) continue;
        var matched = hay.indexOf(tok) !== -1;
        if (!matched) {
          var tokDigits = _digitsOnly(tok);
          if (tokDigits && (phone9 || phoneFull)) {
            // Normalise le token comme phoneNormalized (9 derniers digits si >= 9)
            var tokKey = tokDigits.length >= 9 ? tokDigits.slice(-9) : tokDigits;
            if (phone9 && phone9.indexOf(tokKey) !== -1) matched = true;
            else if (phoneFull && phoneFull.indexOf(tokDigits) !== -1) matched = true;
          }
        }
        if (!matched) return false;
      }
      return true;
    });
  }

  return list;
}

/* Base filter: only leads CREATED in the last 30 days (rolling window).
   On filtre uniquement sur createdAt (vraie date d'origine après migration),
   PAS sur updatedAt — sinon les vieux leads ré-engagés remontent dans la liste.
   En mode 'custom' (sélecteur de date), on bypass le plafond 30j pour
   permettre à l'utilisateur de remonter dans le passé. */
function getBaseLeads() {
  var useCutoff = filterPeriod !== 'custom';
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  return allLeads.filter(function(l) {
    if (l.source === 'migration_suivi_client') return false;
    if (!l.createdAt) return false;
    var cd = l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt);
    if (isNaN(cd.getTime())) return false;
    if (useCutoff && cd <= cutoff) return false;
    return true;
  });
}

function updateCounts() {
  var base = getBaseLeads();
  // Compteurs dynamiques par slug
  var countsBySlug = {};
  var list = window.TEAM_MEMBERS_LIST || [];
  for (var i = 0; i < list.length; i++) countsBySlug[list[i].slug] = 0;
  base.forEach(function(l) {
    if (l.assignedTo && countsBySlug.hasOwnProperty(l.assignedTo)) {
      countsBySlug[l.assignedTo]++;
    }
  });
  document.getElementById('countAll').textContent = base.length;

  // Re-render les pills dynamiques avec leurs compteurs (actifs uniquement)
  var dyn = document.getElementById('ldMemberPillsDynamic');
  if (dyn) {
    var html = '';
    var active = window.TEAM_MEMBERS_ACTIVE || [];
    for (var k = 0; k < active.length; k++) {
      var m = active[k];
      var c = countsBySlug[m.slug] || 0;
      var isSelected = filterMember === m.slug;
      html += '<button class="ld-member-pill' + (isSelected ? ' active' : '') + '" data-member="' + m.slug + '">' +
              '<span class="mp-dot" style="background:' + (m.color || '#6b7280') + '"></span>' +
              '<span>' + escHtml(m.shortName || m.slug) + '</span> ' +
              '<span class="mp-count">' + c + '</span>' +
              '</button>';
    }
    dyn.innerHTML = html;
  }

  if (personalUser) {
    var myCount = countsBySlug[personalUser] || 0;
    document.getElementById('ldCount').textContent = myCount + ' lead' + (myCount > 1 ? 's' : '');
  } else {
    document.getElementById('ldCount').textContent = base.length + ' lead' + (base.length > 1 ? 's' : '');
  }
}

function rebuildTypeFilters() {
  var types = {};
  var base = getBaseLeads();
  for (var i = 0; i < base.length; i++) {
    var t = base[i].type || '';
    if (t) types[t] = (types[t] || 0) + 1;
  }
  var keys = Object.keys(types).sort();
  var container = document.getElementById('ldTypeFilters');
  // Hide row if 0 or 1 type only
  if (keys.length <= 1) { container.innerHTML = ''; filterType = 'all'; return; }
  // Reset if selected type no longer exists
  if (filterType !== 'all' && !types[filterType]) filterType = 'all';
  var h = '<button class="ld-filter' + (filterType === 'all' ? ' active' : '') + '" data-type="all">Tous</button>';
  for (var j = 0; j < keys.length; j++) {
    var k = keys[j];
    var label = LEAD_TYPES[k] ? LEAD_TYPES[k].label : k;
    h += '<button class="ld-filter' + (filterType === k ? ' active' : '') + '" data-type="' + k + '">' + label + ' <span style="opacity:.5">' + types[k] + '</span></button>';
  }
  container.innerHTML = h;
}

function renderFeed() {
  var leads = getFilteredLeads();
  updateCounts();
  rebuildTypeFilters();
  var feed = document.getElementById('ldFeed');

  if (leads.length === 0) {
    feed.innerHTML = '<div class="ld-empty">Aucun lead ' + (filterSearch ? 'ne correspond à « ' + escHtml(filterSearch) + ' »' : (filterStatus !== 'all' ? 'avec ce statut' : '')) + '</div>';
    return;
  }

  var h = '';
  for (var i = 0; i < leads.length; i++) {
    h += renderCard(leads[i]);
  }
  feed.innerHTML = h;

  // Dialer bridge : boutons d'appel + multi-sélection campagne
  if (window.DialerBridge) {
    try {
      window.DialerBridge.attachButtons('#ldFeed', { cardSelector: '.ld-card' });
      window.DialerBridge.enableMultiSelect('#ldFeed', { cardSelector: '.ld-card', maxSelection: 5 });
    } catch (e) { console.warn('[DialerBridge] attach failed', e); }
  }

  // Restore open card
  if (openCardId) {
    var el = document.querySelector('[data-lead-id="' + openCardId + '"]');
    if (el) el.classList.add('open');
  }
}

/* ── FU badge helper ── */
function getFuBadge(l) {
  var fus = l.followUps || [];
  if (fus.length === 0) return '';
  var now = Date.now();
  var pending = 0, overdue = 0, nextTs = Infinity;
  for (var i = 0; i < fus.length; i++) {
    if (fus[i].done) continue;
    pending++;
    var ts = new Date(fus[i].dateTime).getTime();
    if (ts <= now) overdue++;
    if (ts < nextTs) nextTs = ts;
  }
  if (pending === 0) return '';
  if (overdue > 0) return '<span class="ld-fu-badge overdue">🔔 ' + overdue + ' FU</span>';
  // Show next FU time
  var nd = new Date(nextTs);
  var nStr = String(nd.getDate()).padStart(2,'0') + '/' + String(nd.getMonth()+1).padStart(2,'0') + ' ' + String(nd.getHours()).padStart(2,'0') + ':' + String(nd.getMinutes()).padStart(2,'0');
  return '<span class="ld-fu-badge">🔔 ' + nStr + '</span>';
}
