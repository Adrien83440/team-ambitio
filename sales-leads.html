<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #08080f;
  --bg2:    #0f0f1a;
  --bg3:    #14141f;
  --bg4:    #1a1a28;
  --border: rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --red:    #b91c1c;
  --red2:   #ef4444;
  --red3:   #fca5a5;
  --gold:   #f59e0b;
  --green:  #34d399;
  --blue:   #60a5fa;
  --purple: #a78bfa;
  --text:   rgba(255,255,255,0.92);
  --muted:  rgba(255,255,255,0.48);
  --muted2: rgba(255,255,255,0.22);
  --radius: 12px;
  --radius2:16px;
  --fh:     'Syne', sans-serif;
  --fb:     'Inter', sans-serif;
  --fm:     'DM Mono', monospace;
}

html, body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 680px; margin: 0 auto; padding: 0 0 100px; }

/* ── Header ── */
.ld-header {
  position: sticky; top: 0; z-index: 100;
  padding: 14px 16px;
  background: rgba(8,8,15,0.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.ld-header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ld-logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg,#ef4444,#b91c1c); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: white; box-shadow: 0 3px 12px rgba(239,68,68,0.3); flex-shrink: 0; }
.ld-title { font-family: var(--fh); font-size: 18px; font-weight: 800; flex: 1; }
.ld-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; animation: pulse 2s infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.ld-live-label { font-size: 11px; font-weight: 700; color: #34d399; text-transform: uppercase; letter-spacing: 0.5px; }
.ld-count { font-family: var(--fm); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: auto; }

/* ── Filters ── */
.ld-filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.ld-filters::-webkit-scrollbar { display: none; }
.ld-filter {
  padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: all 0.15s; flex-shrink: 0;
}
.ld-filter:hover { border-color: var(--border2); color: var(--text); }
.ld-filter.active { border-color: var(--red2); color: var(--red3); background: rgba(185,28,28,0.08); }

/* ── Member pills ── */
.ld-members { display: flex; gap: 6px; margin-bottom: 10px; }
.ld-member-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 20px; border: 1.5px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.ld-member-pill:hover { border-color: var(--border2); }
.ld-member-pill.active { border-color: var(--red2); color: var(--red3); background: rgba(185,28,28,0.08); }
.ld-member-pill .mp-dot { width: 7px; height: 7px; border-radius: 50%; }
.ld-member-pill .mp-count { font-family: var(--fm); font-size: 10px; opacity: 0.7; }

/* ── Feed ── */
.ld-feed { padding: 12px 12px; }
.ld-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }

/* ── Lead Card ── */
.ld-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2);
  margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s;
}
.ld-card.new { border-color: rgba(52,211,153,0.4); animation: cardGlow 2s ease-out; }
@keyframes cardGlow { 0% { box-shadow: 0 0 20px rgba(52,211,153,0.3); } 100% { box-shadow: none; } }
.ld-card-head {
  padding: 14px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.ld-card-avatar {
  width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-family: var(--fh); font-size: 15px; font-weight: 800; color: white; flex-shrink: 0;
}
.ld-card-info { flex: 1; min-width: 0; }
.ld-card-name { font-family: var(--fh); font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ld-card-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.ld-card-badges { display: flex; gap: 4px; flex-shrink: 0; }
.ld-badge {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
}
.ld-badge.vsl { background: rgba(167,139,250,0.12); color: #c4b5fd; }
.ld-badge.self { background: rgba(245,158,11,0.12); color: #fcd34d; }
.ld-badge.other { background: rgba(96,165,250,0.12); color: #93bbfd; }
.ld-badge-status {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  display: flex; align-items: center; gap: 4px;
}
.ld-badge-status .sd { width: 6px; height: 6px; border-radius: 50%; }
.ld-assigned {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
}
.ld-card-time { font-size: 10px; color: var(--muted2); white-space: nowrap; flex-shrink: 0; }
.ld-card-arrow { font-size: 10px; color: var(--muted2); flex-shrink: 0; transition: transform 0.2s; }
.ld-card.open .ld-card-arrow { transform: rotate(180deg); }

/* ── Card Body (expanded) ── */
.ld-card-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.ld-card.open .ld-card-body { display: block; }

.ld-details { padding: 12px 0; }
.ld-detail-row { display: flex; gap: 8px; padding: 5px 0; font-size: 12px; align-items: center; }
.ld-detail-label { color: var(--muted); min-width: 90px; flex-shrink: 0; font-weight: 600; }
.ld-detail-val { color: var(--text); word-break: break-all; }
.ld-detail-val a { color: var(--blue); text-decoration: none; }

/* Edit mode */
.ld-edit-toggle {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  font-family: var(--fb); font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.15s;
  margin-bottom: 4px;
}
.ld-edit-toggle:hover { color: var(--text); border-color: var(--border2); }
.ld-edit-toggle.editing { color: var(--gold); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.06); }
.ld-detail-input {
  flex: 1; padding: 5px 8px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: var(--fb); font-size: 12px; outline: none;
  transition: border-color 0.15s;
}
.ld-detail-input:focus { border-color: var(--red2); }
.ld-detail-select {
  flex: 1; padding: 5px 8px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: var(--fb); font-size: 12px; outline: none;
}
.ld-detail-select option { background: var(--bg2); }
.ld-save-info-btn {
  width: 100%; padding: 8px; border: none; border-radius: 8px;
  background: rgba(245,158,11,0.15); color: #fcd34d;
  font-family: var(--fb); font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; margin-top: 6px;
}
.ld-save-info-btn:hover { background: rgba(245,158,11,0.25); }

/* Actions */
.ld-actions { padding: 12px 0 0; border-top: 1px solid var(--border); }
.ld-actions-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; }
.ld-status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
@media (max-width: 400px) { .ld-status-grid { grid-template-columns: repeat(2, 1fr); } }
.ld-status-btn {
  padding: 8px 6px; border-radius: 8px; border: 1.5px solid var(--border);
  background: transparent; color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center;
}
.ld-status-btn:hover { border-color: var(--border2); color: var(--text); }
.ld-status-btn.active { border-color: currentColor; background: rgba(255,255,255,0.04); }

.ld-rdv-row { display: flex; gap: 8px; margin-bottom: 10px; }
.ld-rdv-row input {
  flex: 1; padding: 8px 10px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: var(--fb); font-size: 12px; outline: none;
}
.ld-rdv-row input:focus { border-color: var(--red2); }

.ld-notes-area {
  width: 100%; padding: 10px 12px; background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: var(--fb); font-size: 12px;
  resize: none; min-height: 40px; max-height: 80px; outline: none;
}
.ld-notes-area:focus { border-color: var(--red2); }
.ld-notes-area::placeholder { color: var(--muted2); }
.ld-notes-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
.ld-notes-add-btn {
  padding: 8px 14px; border: none; border-radius: 8px; background: var(--bg4);
  border: 1px solid var(--border); color: var(--muted); font-family: var(--fb);
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.ld-notes-add-btn:hover { background: rgba(52,211,153,0.1); color: #34d399; border-color: rgba(52,211,153,0.3); }
.ld-notes-history { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; max-height: 200px; overflow-y: auto; }
.ld-notes-history::-webkit-scrollbar { width: 3px; }
.ld-notes-history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
.ld-note-item {
  padding: 8px 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 8px; font-size: 12px; line-height: 1.5;
}
.ld-note-item-head { display: flex; justify-content: space-between; margin-bottom: 3px; }
.ld-note-item-date { font-size: 10px; font-weight: 700; color: var(--muted); }
.ld-note-item-del {
  font-size: 10px; color: var(--muted2); cursor: pointer; background: none; border: none;
  padding: 0 2px; transition: color 0.15s;
}
.ld-note-item-del:hover { color: #ef4444; }
.ld-note-item-text { color: rgba(255,255,255,0.8); }

.ld-save-btn {
  width: 100%; padding: 10px; border: none; border-radius: 10px;
  background: linear-gradient(135deg,#b91c1c,#ef4444); color: white;
  font-family: var(--fb); font-size: 13px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; box-shadow: 0 3px 12px rgba(185,28,28,0.3);
}
.ld-save-btn:hover { transform: translateY(-1px); }
.ld-save-btn:active { transform: scale(0.98); }

/* ── New Lead Popup ── */
.ld-popup-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 20px;
}
.ld-popup-overlay.show { display: flex; }
.ld-popup {
  background: var(--bg2); border: 2px solid rgba(52,211,153,0.4);
  border-radius: 20px; width: 100%; max-width: 380px; overflow: hidden;
  animation: popIn 0.3s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px rgba(52,211,153,0.15);
}
@keyframes popIn { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.ld-popup-header {
  padding: 20px; text-align: center;
  background: linear-gradient(135deg, rgba(52,211,153,0.1), rgba(96,165,250,0.05));
}
.ld-popup-icon { font-size: 40px; margin-bottom: 8px; }
.ld-popup-title { font-family: var(--fh); font-size: 18px; font-weight: 800; }
.ld-popup-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.ld-popup-body { padding: 16px 20px; }
.ld-popup-field { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.ld-popup-field:last-child { border-bottom: none; }
.ld-popup-field-label { color: var(--muted); font-weight: 600; }
.ld-popup-field-val { font-weight: 700; text-align: right; max-width: 60%; word-break: break-all; }
.ld-popup-assigned {
  margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; text-align: center;
  font-size: 13px; font-weight: 700;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
}
.ld-popup-actions { padding: 12px 20px 20px; display: flex; gap: 8px; }
.ld-popup-btn {
  flex: 1; padding: 12px; border: none; border-radius: 12px;
  font-family: var(--fb); font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.ld-popup-btn.primary { background: linear-gradient(135deg,#059669,#34d399); color: #0f0f1a; }
.ld-popup-btn.ghost { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }
.ld-popup-btn:active { transform: scale(0.97); }

/* ── Toast ── */
.ld-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1a2e1a; border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7;
  font-size: 13px; font-weight: 600; padding: 10px 20px; border-radius: 10px;
  z-index: 2000; opacity: 0; transition: all 0.3s; white-space: nowrap; pointer-events: none;
}
.ld-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Responsive helpers ── */
@media (min-width: 769px) {
  .page { padding-top: 16px; }
}
</style>
</head>
<body>

<div class="page">

  <!-- ── HEADER ── -->
  <div class="ld-header">
    <div class="ld-header-top">
      <div class="ld-logo">A</div>
      <div class="ld-title" id="ldTitle">Leads Live</div>
      <span class="ld-live-dot"></span>
      <span class="ld-live-label">Live</span>
      <span id="ldPersonalBadge" style="display:none;font-size:12px;font-weight:800;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid var(--border)"></span>
      <span class="ld-count" id="ldCount">— leads</span>
      <button id="shareBtn" title="Liens app mobile" style="margin-left:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0" onclick="toggleSharePanel()">🔗</button>
      <button id="pushBtn" title="Activer les notifications" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0" onclick="requestPush()">🔕</button>
    </div>
    <!-- Share panel -->
    <div id="sharePanel" style="display:none;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin:8px 0">
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:8px">📱 Liens app mobile — ajouter à l'écran d'accueil</div>
      <div id="shareLinksList"></div>
    </div>
    <div class="ld-members" id="ldMembers">
      <button class="ld-member-pill active" data-member="all">
        <span>Tous</span> <span class="mp-count" id="countAll">0</span>
      </button>
      <button class="ld-member-pill" data-member="guillaume">
        <span class="mp-dot" style="background:#ef4444"></span>
        <span>Guillaume</span> <span class="mp-count" id="countGuillaume">0</span>
      </button>
      <button class="ld-member-pill" data-member="elodie">
        <span class="mp-dot" style="background:#60a5fa"></span>
        <span>Élodie</span> <span class="mp-count" id="countElodie">0</span>
      </button>
    </div>
    <div class="ld-filters" id="ldPeriodFilters" style="margin-bottom:4px">
      <button class="ld-filter active" data-period="today">📅 Aujourd'hui</button>
      <button class="ld-filter" data-period="week">🗓 7 jours</button>
      <button class="ld-filter" data-period="unprocessed">🆕 Non traités</button>
      <button class="ld-filter" data-period="all">📋 Tout</button>
    </div>
    <div class="ld-filters" id="ldTypeFilters" style="margin-bottom:4px"></div>
    <div class="ld-filters" id="ldFilters">
      <button class="ld-filter active" data-status="all">Tous</button>
      <button class="ld-filter" data-status="nouveau">🆕 Nouveau</button>
      <button class="ld-filter" data-status="appele">📞 Appelé</button>
      <button class="ld-filter" data-status="decroche">✅ Décroché</button>
      <button class="ld-filter" data-status="messagerie">📩 Messagerie</button>
      <button class="ld-filter" data-status="nrp1">📵 NRP 1</button>
      <button class="ld-filter" data-status="nrp2">📵 NRP 2</button>
      <button class="ld-filter" data-status="nrp3">📵 NRP 3</button>
      <button class="ld-filter" data-status="rdv_pose">📅 RDV posé</button>
      <button class="ld-filter" data-status="pas_interesse">👎 Pas intéressé</button>
      <button class="ld-filter" data-status="disqualifie">🚫 Disqualifié</button>
    </div>
  </div>

  <!-- ── FEED ── -->
  <div class="ld-feed" id="ldFeed">
    <div class="ld-empty">Chargement des leads...</div>
  </div>

</div>

<!-- ── APP LOGIN ── -->
<div id="appLoginOverlay" style="display:none;position:fixed;inset:0;z-index:2000;background:var(--bg);padding:20px;display:none;flex-direction:column;align-items:center;justify-content:center">
  <div style="width:100%;max-width:340px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#b91c1c,#ef4444);display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:white;margin-bottom:12px;box-shadow:0 4px 16px rgba(185,28,28,0.3)">A</div>
      <div style="font-family:var(--fh);font-size:20px;font-weight:800">Leads Live</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Connectez-vous pour accéder aux leads</div>
    </div>
    <div style="margin-bottom:12px">
      <input type="email" id="appLoginEmail" placeholder="Email" style="width:100%;padding:12px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--fb);font-size:14px;outline:none"/>
    </div>
    <div style="margin-bottom:16px">
      <input type="password" id="appLoginPassword" placeholder="Mot de passe" style="width:100%;padding:12px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--fb);font-size:14px;outline:none"/>

<div class="ld-popup-overlay" id="popupOverlay">

<div class="ld-toast" id="ldToast"></div>

<script>
/* ═══════════════════════════════════════
   LEADS LIVE — Ambitio Corp
   ═══════════════════════════════════════ */
var db = firebase.firestore();

/* ── Config ── */
var SETTERS = {
  guillaume: { name: 'Guillaume', color: '#ef4444', initials: 'G' },
  elodie:    { name: 'Élodie',    color: '#60a5fa', initials: 'É' }
};

var LEAD_TYPES = {
  vsl_elite:    { label: 'VSL ÉLITE',     badgeClass: 'vsl' },
  self_booking: { label: 'Self-Booking',   badgeClass: 'self' }
};

var STATUSES = [
  { key: 'nouveau',       label: 'Nouveau',       icon: '🆕', color: '#34d399', bg: 'rgba(52,211,153,0.12)' },
  { key: 'appele',        label: 'Appelé',        icon: '📞', color: '#60a5fa', bg: 'rgba(96,165,250,0.12)' },
  { key: 'decroche',      label: 'Décroché',      icon: '✅', color: '#34d399', bg: 'rgba(52,211,153,0.12)' },
  { key: 'messagerie',    label: 'Messagerie',    icon: '📩', color: '#fbbf24', bg: 'rgba(245,158,11,0.12)' },
  { key: 'nrp1',          label: 'NRP 1',         icon: '📵', color: '#f59e0b', bg: 'rgba(245,158,11,0.12)' },
  { key: 'nrp2',          label: 'NRP 2',         icon: '📵', color: '#e67e22', bg: 'rgba(230,126,34,0.12)' },
  { key: 'nrp3',          label: 'NRP 3',         icon: '📵', color: '#ef4444', bg: 'rgba(239,68,68,0.1)' },
  { key: 'rdv_pose',      label: 'RDV posé',      icon: '📅', color: '#a78bfa', bg: 'rgba(167,139,250,0.12)' },
  { key: 'pas_interesse', label: 'Pas intéressé', icon: '👎', color: '#ef4444', bg: 'rgba(239,68,68,0.1)' },
  { key: 'disqualifie',   label: 'Disqualifié',   icon: '🚫', color: '#6b7280', bg: 'rgba(107,114,128,0.12)' }
];

function getStatusObj(key) {
  for (var i = 0; i < STATUSES.length; i++) { if (STATUSES[i].key === key) return STATUSES[i]; }
  return STATUSES[0];
}

/* ── State ── */
var allLeads = [];
var filterMember = 'all';
var filterStatus = 'all';
var filterType = 'all';
var filterPeriod = 'today';
var knownLeadIds = {};
var isFirstLoad = true;
var openCardId = null;
var isEditingLead = false;

/* ── Personal mode via URL param ── */
var personalUser = null;
(function detectPersonalMode() {
  var params = new URLSearchParams(window.location.search);
  var u = params.get('user');
  if (u && SETTERS[u]) {
    personalUser = u;
    filterMember = u;
    // Update header
    var setter = SETTERS[u];
    document.getElementById('ldTitle').textContent = 'Mes Leads';
    document.getElementById('ldPersonalBadge').style.display = '';
    document.getElementById('ldPersonalBadge').textContent = setter.name;
    document.getElementById('ldPersonalBadge').style.color = setter.color;
    // Hide member pills
    document.getElementById('ldMembers').style.display = 'none';
  }
})();

/* ── Utils ── */
function toast(msg) {
  var el = document.getElementById('ldToast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function normalizeTel(raw) {
  if (!raw) return '';
  var s = raw.replace(/[^\d+]/g, '');
  // +33XXXXXXXXX → 0XXXXXXXXX
  if (s.indexOf('+33') === 0 && s.length >= 12) s = '0' + s.slice(3);
  // 33XXXXXXXXX (11 digits) → 0XXXXXXXXX
  if (/^33[67]/.test(s) && s.length === 11) s = '0' + s.slice(2);
  // 9 digits starting with 6 or 7 → prepend 0
  if (/^[67]/.test(s) && s.length === 9) s = '0' + s;
  // Format 10-digit French number with spaces
  if (/^0[67]\d{8}$/.test(s)) return s.replace(/(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4 $5');
  // Fallback: return cleaned version
  return raw;
}

function timeAgo(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var now = new Date();
  var diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'À l\'instant';
  if (diff < 3600) return Math.floor(diff / 60) + ' min';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h';
  return Math.floor(diff / 86400) + 'j';
}

function formatDateTimeFr(ts) {
  if (!ts) return '—';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var jours = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  return jours[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + ' à ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* ═══ SOUND NOTIFICATION ═══ */
var audioCtx = null;
function playNotifSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    // Two-tone chime
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}

/* ═══ NEW LEAD POPUP ═══ */
var popupQueue = [];
var popupShowing = false;

function showLeadPopup(lead) {
  popupQueue.push(lead);
  if (!popupShowing) processPopupQueue();
}

function processPopupQueue() {
  if (popupQueue.length === 0) { popupShowing = false; return; }
  popupShowing = true;
  var lead = popupQueue.shift();
  var typeObj = LEAD_TYPES[lead.type] || { label: lead.type || 'Lead', badgeClass: 'other' };
  var setterObj = SETTERS[lead.assignedTo] || null;

  document.getElementById('popupType').textContent = typeObj.label;
  var h = '';
  h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Nom</span><span class="ld-popup-field-val">' + escHtml(lead.nom) + '</span></div>';
  if (lead.telephone) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Téléphone</span><span class="ld-popup-field-val">' + escHtml(lead.telephone) + '</span></div>';
  if (lead.email) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Email</span><span class="ld-popup-field-val">' + escHtml(lead.email) + '</span></div>';
  if (lead.utm) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Source</span><span class="ld-popup-field-val">' + escHtml(lead.utm) + '</span></div>';
  if (lead.secteur) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">Secteur</span><span class="ld-popup-field-val">' + escHtml(lead.secteur) + '</span></div>';
  if (lead.ca) h += '<div class="ld-popup-field"><span class="ld-popup-field-label">CA</span><span class="ld-popup-field-val">' + escHtml(lead.ca) + '</span></div>';
  if (setterObj) {
    h += '<div class="ld-popup-assigned">Attribué à <strong style="color:' + setterObj.color + '">' + setterObj.name + '</strong></div>';
  }
  document.getElementById('popupBody').innerHTML = h;

  // Call button
  var callBtn = document.getElementById('popupCall');
  if (lead.telephone) {
    callBtn.style.display = '';
    callBtn.onclick = function() {
      window.open('tel:' + lead.telephone.replace(/\s/g, ''), '_self');
    };
  } else {
    callBtn.style.display = 'none';
  }

  document.getElementById('popupOverlay').classList.add('show');
  playNotifSound();
}

document.getElementById('popupDismiss').addEventListener('click', function() {
  document.getElementById('popupOverlay').classList.remove('show');
  setTimeout(processPopupQueue, 300);
});
document.getElementById('popupOverlay').addEventListener('click', function(e) {
  if (e.target === this) {
    this.classList.remove('show');
    setTimeout(processPopupQueue, 300);
  }
});

/* ═══ FILTERS ═══ */
document.getElementById('ldMembers').addEventListener('click', function(e) {
  var pill = e.target.closest('.ld-member-pill');
  if (!pill) return;
  document.querySelectorAll('.ld-member-pill').forEach(function(p) { p.classList.remove('active'); });
  pill.classList.add('active');
  filterMember = pill.dataset.member;
  renderFeed();
});

document.getElementById('ldPeriodFilters').addEventListener('click', function(e) {
  var btn = e.target.closest('.ld-filter');
  if (!btn || !btn.dataset.period) return;
  document.querySelectorAll('#ldPeriodFilters .ld-filter').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  filterPeriod = btn.dataset.period;
  renderFeed();
});

document.getElementById('ldTypeFilters').addEventListener('click', function(e) {
  var btn = e.target.closest('.ld-filter');
  if (!btn || !btn.dataset.type) return;
  document.querySelectorAll('#ldTypeFilters .ld-filter').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  filterType = btn.dataset.type;
  renderFeed();
});

document.getElementById('ldFilters').addEventListener('click', function(e) {
  var btn = e.target.closest('.ld-filter');
  if (!btn || !btn.dataset.status) return;
  document.querySelectorAll('#ldFilters .ld-filter').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  filterStatus = btn.dataset.status;
  renderFeed();
});

/* ═══ RENDER FEED ═══ */
function getFilteredLeads() {
  var list = getBaseLeads();

  // Period filter
  if (filterPeriod === 'today') {
    var todayStr = new Date().toISOString().slice(0, 10);
    list = list.filter(function(l) {
      if (!l.createdAt) return false;
      var d = l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt);
      return d.toISOString().slice(0, 10) === todayStr;
    });
  } else if (filterPeriod === 'week') {
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    list = list.filter(function(l) {
      if (!l.createdAt) return false;
      var d = l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt);
      return d >= weekAgo;
    });
  } else if (filterPeriod === 'unprocessed') {
    list = list.filter(function(l) { return !l.status || l.status === 'nouveau'; });
  }
  // 'all' = no period filter

  if (filterMember !== 'all') {
    list = list.filter(function(l) { return l.assignedTo === filterMember; });
  }
  if (filterType !== 'all') {
    list = list.filter(function(l) { return (l.type || '') === filterType; });
  }
  if (filterStatus !== 'all') {
    list = list.filter(function(l) { return (l.status || 'nouveau') === filterStatus; });
  }
  return list;
}

/* Base filter: only leads after fresh-start cutoff */
var LEADS_LIVE_CUTOFF = new Date('2026-04-02T22:00:00+02:00');
function getBaseLeads() {
  return allLeads.filter(function(l) {
    if (!l.createdAt) return false;
    var d = l.createdAt.toDate ? l.createdAt.toDate() : new Date(l.createdAt);
    return d > LEADS_LIVE_CUTOFF;
  });
}

function updateCounts() {
  var base = getBaseLeads();
  var gCount = 0, eCount = 0;
  base.forEach(function(l) {
    if (l.assignedTo === 'guillaume') gCount++;
    if (l.assignedTo === 'elodie') eCount++;
  });
  document.getElementById('countAll').textContent = base.length;
  document.getElementById('countGuillaume').textContent = gCount;
  document.getElementById('countElodie').textContent = eCount;
  if (personalUser) {
    var myCount = personalUser === 'guillaume' ? gCount : eCount;
    document.getElementById('ldCount').textContent = myCount + ' lead' + (myCount > 1 ? 's' : '');
  } else {
    document.getElementById('ldCount').textContent = base.length + ' lead' + (base.length > 1 ? 's' : '');
  }
}

function rebuildTypeFilters() {
  var types = {};
  var base = getBaseLeads();
  for (var i = 0; i < base.length; i++) {
    var t = base[i].type || '';
    if (t) types[t] = (types[t] || 0) + 1;
  }
  var keys = Object.keys(types).sort();
  var container = document.getElementById('ldTypeFilters');
  // Hide row if 0 or 1 type only
  if (keys.length <= 1) { container.innerHTML = ''; filterType = 'all'; return; }
  // Reset if selected type no longer exists
  if (filterType !== 'all' && !types[filterType]) filterType = 'all';
  var h = '<button class="ld-filter' + (filterType === 'all' ? ' active' : '') + '" data-type="all">Tous</button>';
  for (var j = 0; j < keys.length; j++) {
    var k = keys[j];
    var label = LEAD_TYPES[k] ? LEAD_TYPES[k].label : k;
    h += '<button class="ld-filter' + (filterType === k ? ' active' : '') + '" data-type="' + k + '">' + label + ' <span style="opacity:.5">' + types[k] + '</span></button>';
  }
  container.innerHTML = h;
}

function renderFeed() {
  var leads = getFilteredLeads();
  updateCounts();
  rebuildTypeFilters();
  var feed = document.getElementById('ldFeed');

  if (leads.length === 0) {
    feed.innerHTML = '<div class="ld-empty">Aucun lead ' + (filterStatus !== 'all' ? 'avec ce statut' : '') + '</div>';
    return;
  }

  var h = '';
  for (var i = 0; i < leads.length; i++) {
    h += renderCard(leads[i]);
  }
  feed.innerHTML = h;

  // Restore open card
  if (openCardId) {
    var el = document.querySelector('[data-lead-id="' + openCardId + '"]');
    if (el) el.classList.add('open');
  }
}

function renderCard(l) {
  var id = l.id;
  var typeObj = LEAD_TYPES[l.type] || { label: l.type || 'Lead', badgeClass: 'other' };
  var statusObj = getStatusObj(l.status || 'nouveau');
  var setterObj = SETTERS[l.assignedTo] || null;
  var isNew = l._isNew;
  var ago = timeAgo(l.createdAt);

  var h = '<div class="ld-card' + (isNew ? ' new' : '') + '" data-lead-id="' + id + '">';

  // Head
  h += '<div class="ld-card-head" data-action="toggle" data-id="' + id + '">';
  if (setterObj) {
    h += '<div class="ld-card-avatar" style="background:linear-gradient(135deg,' + setterObj.color + ',' + setterObj.color + '99)">' + setterObj.initials + '</div>';
  } else {
    h += '<div class="ld-card-avatar" style="background:var(--bg4)">?</div>';
  }
  h += '<div class="ld-card-info">';
  h += '<div class="ld-card-name">' + escHtml(l.nom || '—') + '</div>';
  h += '<div class="ld-card-meta">';
  h += '<span class="ld-badge ' + typeObj.badgeClass + '">' + typeObj.label + '</span>';
  h += '<span class="ld-badge-status" style="background:' + statusObj.bg + ';color:' + statusObj.color + '"><span class="sd" style="background:' + statusObj.color + '"></span>' + statusObj.label + '</span>';
  if (setterObj) h += '<span class="ld-assigned">' + setterObj.name + '</span>';
  if (l.stage && l.stage !== 'lead') {
    var stageNames = {nrp1:'NRP1',nrp2:'NRP2',nrp3:'NRP3',all_nrp:'All NRP',poubelle:'Poubelle',disqualification:'Disqualif.',follow_up_pm:'Follow Up',set:'SET',rdv_self_booking:'RDV Self',rdv_confirmes:'RDV Conf.',rdv_annules_prospect:'Annulé',rdv_annules_equipe:'Annulé Éq.',no_show_self:'No Show',no_show_setting:'No Show S.',partenariats:'Partenariat',closed_won_setting:'Won Setting',closed_won_self:'Won Self',closed_lost:'Lost',follow_up_closing:'Follow Up',disqualifie_closing:'Disqualif.'};
    var stName = stageNames[l.stage] || l.stage;
    h += '<span class="ld-assigned" style="color:var(--purple);border-color:rgba(167,139,250,0.25)">🔀 ' + stName + '</span>';
  }
  h += '</div>';
  h += '</div>';
  h += '<span class="ld-card-time">' + ago + '</span>';
  h += '<span class="ld-card-arrow">▼</span>';
  h += '</div>';

  // Body
  h += '<div class="ld-card-body">';

  // Edit toggle
  h += '<button class="ld-edit-toggle" data-action="toggleEdit" data-id="' + id + '">✏️ Modifier les infos</button>';

  // ── VIEW MODE ──
  h += '<div class="ld-details" data-view-mode="' + id + '">';
  if (l.nom) h += '<div class="ld-detail-row"><span class="ld-detail-label">Nom</span><span class="ld-detail-val">' + escHtml(l.nom) + '</span></div>';
  if (l.telephone) h += '<div class="ld-detail-row"><span class="ld-detail-label">Téléphone</span><span class="ld-detail-val"><a href="tel:' + normalizeTel(l.telephone).replace(/\s/g, '') + '">' + escHtml(normalizeTel(l.telephone)) + '</a></span></div>';
  if (l.email) h += '<div class="ld-detail-row"><span class="ld-detail-label">Email</span><span class="ld-detail-val"><a href="mailto:' + escHtml(l.email) + '">' + escHtml(l.email) + '</a></span></div>';
  if (l.utm) h += '<div class="ld-detail-row"><span class="ld-detail-label">UTM / Source</span><span class="ld-detail-val">' + escHtml(l.utm) + '</span></div>';
  if (l.secteur) h += '<div class="ld-detail-row"><span class="ld-detail-label">Secteur</span><span class="ld-detail-val">' + escHtml(l.secteur) + '</span></div>';
  if (l.ca) h += '<div class="ld-detail-row"><span class="ld-detail-label">CA actuel</span><span class="ld-detail-val">' + escHtml(l.ca) + '</span></div>';
  if (l.defi) h += '<div class="ld-detail-row"><span class="ld-detail-label">Défi</span><span class="ld-detail-val">' + escHtml(l.defi) + '</span></div>';
  if (l.disponibilite) h += '<div class="ld-detail-row"><span class="ld-detail-label">Dispo</span><span class="ld-detail-val">' + escHtml(l.disponibilite) + '</span></div>';
  if (l.timeline) h += '<div class="ld-detail-row"><span class="ld-detail-label">Mise en place</span><span class="ld-detail-val">' + escHtml(l.timeline) + '</span></div>';
  if (l.dateRdv) h += '<div class="ld-detail-row"><span class="ld-detail-label">Date booking</span><span class="ld-detail-val">' + escHtml(l.dateRdv) + '</span></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Reçu le</span><span class="ld-detail-val">' + formatDateTimeFr(l.createdAt) + '</span></div>';
  h += '</div>';

  // ── EDIT MODE (hidden by default) ──
  h += '<div class="ld-details" data-edit-mode="' + id + '" style="display:none">';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Nom</span><input class="ld-detail-input" data-edit="nom" data-id="' + id + '" value="' + escAttr(l.nom || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Téléphone</span><input class="ld-detail-input" data-edit="telephone" data-id="' + id + '" value="' + escAttr(normalizeTel(l.telephone || '')) + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Email</span><input class="ld-detail-input" data-edit="email" data-id="' + id + '" type="email" value="' + escAttr(l.email || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">UTM / Source</span><input class="ld-detail-input" data-edit="utm" data-id="' + id + '" value="' + escAttr(l.utm || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Type</span><select class="ld-detail-select" data-edit="type" data-id="' + id + '">';
  h += '<option value="vsl_elite"' + (l.type === 'vsl_elite' ? ' selected' : '') + '>VSL ÉLITE</option>';
  h += '<option value="self_booking"' + (l.type === 'self_booking' ? ' selected' : '') + '>Self-Booking</option>';
  h += '</select></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Attribué à</span><select class="ld-detail-select" data-edit="assignedTo" data-id="' + id + '">';

  h += '<option value="elodie"' + (l.assignedTo === 'elodie' ? ' selected' : '') + '>Élodie</option>';

  h += '<div class="ld-detail-row"><span class="ld-detail-label">Secteur</span><input class="ld-detail-input" data-edit="secteur" data-id="' + id + '" value="' + escAttr(l.secteur || '') + '"/></div>';

document.getElementById('ldFeed').addEventListener('click', function(e) {
  // Toggle card
  var toggle = e.target.closest('[data-action="toggle"]');
  if (toggle) {
    var card = toggle.closest('.ld-card');
    var id = card.dataset.leadId;
    if (card.classList.contains('open')) {
      card.classList.remove('open');
      openCardId = null;
    } else {
      document.querySelectorAll('.ld-card.open').forEach(function(c) { c.classList.remove('open'); });
      card.classList.add('open');
      openCardId = id;
    }
    return;
  }

  // Toggle edit mode
  var editBtn = e.target.closest('[data-action="toggleEdit"]');
  if (editBtn) {
    var eid = editBtn.dataset.id;
    var viewEl = document.querySelector('[data-view-mode="' + eid + '"]');
    var editEl = document.querySelector('[data-edit-mode="' + eid + '"]');
    if (!viewEl || !editEl) return;
    var isEditing = editEl.style.display !== 'none';
    if (isEditing) {
      // Closing edit mode → re-render with fresh data
      isEditingLead = false;
      openCardId = eid;
      renderFeed();
    } else {
      // Opening edit mode
      viewEl.style.display = 'none';
      editEl.style.display = '';
      editBtn.classList.add('editing');
      editBtn.innerHTML = '✕ Annuler';
      isEditingLead = true;
    }
    return;
  }

  // Status button
  var statusBtn = e.target.closest('[data-action="setStatus"]');
  if (statusBtn) {
    var leadId = statusBtn.dataset.id;
    var newStatus = statusBtn.dataset.status;
    // Visual update
    var card2 = statusBtn.closest('.ld-card');
    card2.querySelectorAll('.ld-status-btn').forEach(function(b) {
      b.classList.remove('active');
      b.style.color = '';
      b.style.borderColor = '';
    });
    statusBtn.classList.add('active');
    var sObj = getStatusObj(newStatus);
    statusBtn.style.color = sObj.color;
    statusBtn.style.borderColor = sObj.color;
    // Update local state
    for (var i = 0; i < allLeads.length; i++) {
      if (allLeads[i].id === leadId) { allLeads[i].status = newStatus; break; }
    }
    // Show/hide RDV section
    var rdvSection = card2.querySelector('[data-rdv-section="' + leadId + '"]');
    if (rdvSection) {
      rdvSection.style.display = (newStatus === 'rdv_pose') ? 'block' : 'none';
    }
    // Auto-save status + sync pipeline stage
    var STATUS_TO_STAGE = {
      nouveau:'lead', appele:'lead', decroche:'lead', messagerie:'lead',
      nrp1:'nrp1', nrp2:'nrp2', nrp3:'nrp3',
      rdv_pose:'rdv_confirmes', pas_interesse:'disqualification', disqualifie:'disqualification'
    };
    var syncStage = STATUS_TO_STAGE[newStatus];
    var updates = { status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (syncStage) {
      updates.stage = syncStage;
      for (var j = 0; j < allLeads.length; j++) {
        if (allLeads[j].id === leadId) { allLeads[j].stage = syncStage; break; }
      }
    }
    db.collection('leads').doc(leadId).update(updates).then(function() {
      toast('✅ Statut → ' + sObj.label + (syncStage ? ' (pipeline mis à jour)' : ''));
    }).catch(function(err) {
      toast('❌ ' + err.message);
    });
    return;
  }

  // Add note
  var addNoteBtn = e.target.closest('[data-action="addNote"]');
  if (addNoteBtn) {
    var noteLeadId = addNoteBtn.dataset.id;
    var card3 = addNoteBtn.closest('.ld-card');
    var textarea = card3.querySelector('[data-field="newNote"]');
    var text = textarea ? textarea.value.trim() : '';
    if (!text) { toast('⚠️ Écris une note d\'abord'); return; }
    // Format date
    var now = new Date();
    var dateStr = String(now.getDate()).padStart(2,'0') + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + now.getFullYear() + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var newNote = { text: text, date: dateStr };
    // Update local
    for (var ni = 0; ni < allLeads.length; ni++) {
      if (allLeads[ni].id === noteLeadId) {
        if (!allLeads[ni].notesHistory) allLeads[ni].notesHistory = [];
        allLeads[ni].notesHistory.push(newNote);
        break;
      }
    }
    // Save to Firestore
    var lead3 = allLeads.find(function(l) { return l.id === noteLeadId; });
    db.collection('leads').doc(noteLeadId).update({
      notesHistory: lead3.notesHistory,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      toast('✅ Note ajoutée');
    }).catch(function(err) {
      toast('❌ Erreur : ' + err.message);
    });
    // Re-render the card
    openCardId = noteLeadId;
    renderFeed();
    return;
  }

  // Delete note
  var delNoteBtn = e.target.closest('[data-action="delNote"]');
  if (delNoteBtn) {
    var dnLeadId = delNoteBtn.dataset.id;
    var dnIdx = parseInt(delNoteBtn.dataset.noteIdx);
    for (var di = 0; di < allLeads.length; di++) {
      if (allLeads[di].id === dnLeadId && allLeads[di].notesHistory) {
        allLeads[di].notesHistory.splice(dnIdx, 1);
        db.collection('leads').doc(dnLeadId).update({
          notesHistory: allLeads[di].notesHistory,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() {
          toast('🗑 Note supprimée');
        });
        break;
      }
    }
    openCardId = dnLeadId;
    renderFeed();
    return;
  }

});

/* ═══ AUTO-SAVE EDIT FIELDS ═══ */
var autoSaveTimers = {};

function autoSaveField(leadId, field, value) {
  // Debounce per lead
  if (autoSaveTimers[leadId]) clearTimeout(autoSaveTimers[leadId]);
  autoSaveTimers[leadId] = setTimeout(function() {
    // Gather ALL edit fields for this lead (not just the changed one)
    var card = document.querySelector('[data-lead-id="' + leadId + '"]');
    if (!card) return;
    var fields = ['nom', 'telephone', 'email', 'utm', 'type', 'assignedTo', 'secteur', 'ca', 'defi', 'disponibilite', 'timeline'];
    var updates = {};
    for (var i = 0; i < fields.length; i++) {
      var el = card.querySelector('[data-edit="' + fields[i] + '"]');
      if (el) updates[fields[i]] = el.value.trim();
    }
    updates.updatedAt = firebase.firestore.FieldValue.serverTimestamp();

    // Update local state
    for (var li = 0; li < allLeads.length; li++) {
      if (allLeads[li].id === leadId) {
        for (var key in updates) { if (key !== 'updatedAt') allLeads[li][key] = updates[key]; }
        break;
      }
    }

    db.collection('leads').doc(leadId).update(updates).then(function() {
      // Flash autosave message
      var msg = document.querySelector('[data-autosave-msg="' + leadId + '"]');
      if (msg) {
        msg.style.opacity = '1';
        setTimeout(function() { msg.style.opacity = '0'; }, 1500);
      }
    }).catch(function(err) {
      toast('❌ Erreur : ' + err.message);
    });
  }, 3000);
}

/* ═══ ROUND-ROBIN ASSIGNMENT ═══ */
function assignLeadRoundRobin(leadId, callback) {
  var metaRef = db.collection('_meta').doc('roundrobin');
  db.runTransaction(function(tx) {
    return tx.get(metaRef).then(function(snap) {
      var last = (snap.exists && snap.data().lastAssigned) || 'elodie';
      var next = (last === 'guillaume') ? 'elodie' : 'guillaume';
      tx.set(metaRef, { lastAssigned: next }, { merge: true });
      tx.update(db.collection('leads').doc(leadId), { assignedTo: next });
      return next;
    });
  }).then(function(assigned) {
    if (callback) callback(assigned);
  }).catch(function(err) {
    console.error('[leads] roundrobin error:', err);
  });
}

/* ═══ FIRESTORE LISTENER ═══ */
function startListening() {
  db.collection('leads')
    .orderBy('createdAt', 'desc')
    .limit(500)
    .onSnapshot(function(snap) {
      var newLeads = [];

      snap.docChanges().forEach(function(change) {
        if (change.type === 'added' && !isFirstLoad && !knownLeadIds[change.doc.id]) {
          var newLead = change.doc.data();
          newLead.id = change.doc.id;

          // Skip imported leads (no popup/sound)
          if (newLead.source === 'bigin_import') {
            knownLeadIds[change.doc.id] = true;
            return;
          }

          newLead._isNew = true;

          // Auto-assign if no assignedTo
          if (!newLead.assignedTo) {
            assignLeadRoundRobin(change.doc.id);
          }

          newLeads.push(newLead);
        }
        knownLeadIds[change.doc.id] = true;
      });

      // Rebuild full list
      allLeads = [];
      snap.forEach(function(doc) {
        var d = doc.data();
        d.id = doc.id;
        // Check if it's one of the new ones
        for (var i = 0; i < newLeads.length; i++) {
          if (newLeads[i].id === doc.id) { d._isNew = true; break; }
        }
        allLeads.push(d);
      });

      // Don't re-render while user is editing — only update data + counts
      if (isEditingLead && newLeads.length === 0) {
        updateCounts();
      } else {
        renderFeed();
      }

      // Show popups for new leads
      for (var j = 0; j < newLeads.length; j++) {
        // In personal mode, only show popup for my leads
        if (personalUser && newLeads[j].assignedTo && newLeads[j].assignedTo !== personalUser) continue;
        showLeadPopup(newLeads[j]);
      }

      isFirstLoad = false;

    }, function(err) {
      console.error('[leads] listener error:', err);
      document.getElementById('ldFeed').innerHTML = '<div class="ld-empty">Erreur de connexion : ' + escHtml(err.message) + '</div>';
    });
}

/* ═══ BRIDGE: booking_events → leads ═══ */
function startBookingBridge() {
  db.collection('booking_events')
    .where('processed', '==', false)
    .onSnapshot(function(snap) {
      snap.docChanges().forEach(function(change) {
        if (change.type !== 'added') return;
        var be = change.doc.data();
        var beId = change.doc.id;

        // Build the lead document
        var lead = {
          nom:            be.nom || '',
          email:          be.email || '',
          telephone:      normalizeTel(be.telephone || ''),
          secteur:        be.secteur || '',
          ca:             be.ca || '',
          defi:           be.defi || '',
          disponibilite:  be.disponibilite || '',
          timeline:       be.timeline || '',
          type:           'self_booking',
          source:         'forms_self_booking',
          utm:            be.type || 'Forms Self Booking',
          stage:          'lead',
          status:         'nouveau',
          assignedTo:     '',
          notesHistory:   [],
          bookingEventId: beId,
          createdAt:      be.createdAt || firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt:      firebase.firestore.FieldValue.serverTimestamp()
        };

        // Create lead + mark booking_event processed in a batch
        // Use deterministic lead ID to prevent duplicates across tabs
        var batch = db.batch();
        var newLeadRef = db.collection('leads').doc('be_' + beId);
        batch.set(newLeadRef, lead);
        batch.update(change.doc.ref, { processed: true });
        batch.commit().then(function() {
          console.log('[bridge] booking_event ' + beId + ' → lead ' + newLeadRef.id);
        }).catch(function(err) {
          console.error('[bridge] error processing ' + beId + ':', err);
        });
      });
    }, function(err) {
      console.error('[bridge] booking_events listener error:', err);
    });
}

/* ═══ AUTH & INIT ═══ */
(function init() {
  firebase.auth().onAuthStateChanged(function(user) {
    if (user) {
      // Hide login overlay
      document.getElementById('appLoginOverlay').style.display = 'none';
      db.collection('users').doc(user.uid).get().then(function(snap) {
        var data = snap.exists ? snap.data() : {};
        window._currentRole = data.role || 'sales';
        window._currentUserName = user.displayName || user.email.split('@')[0];
        localStorage.setItem('ambitio_role', data.role || 'sales');
        localStorage.setItem('ambitio_name', window._currentUserName);
        startListening();
        startBookingBridge();
      }).catch(function() { startListening(); startBookingBridge(); });
    } else {
      // Show login overlay
      var overlay = document.getElementById('appLoginOverlay');
      overlay.style.display = 'flex';
    }
  });

  // Login button handler
  document.getElementById('appLoginBtn').addEventListener('click', doAppLogin);
  document.getElementById('appLoginPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doAppLogin();
  });

  function doAppLogin() {
    var email = document.getElementById('appLoginEmail').value.trim();
    var pwd = document.getElementById('appLoginPassword').value;
    var errEl = document.getElementById('appLoginError');
    if (!email || !pwd) { errEl.textContent = 'Email et mot de passe requis'; errEl.style.display = ''; return; }
    errEl.style.display = 'none';
    var btn = document.getElementById('appLoginBtn');
    btn.textContent = 'Connexion...';
    btn.disabled = true;
    var persist = document.getElementById('appLoginRemember').checked
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION;
    firebase.auth().setPersistence(persist).then(function() {
      return firebase.auth().signInWithEmailAndPassword(email, pwd);
    }).catch(function(err) {
      var msgs = {
        'auth/wrong-password': 'Mot de passe incorrect',
        'auth/user-not-found': 'Aucun compte avec cet email',
        'auth/invalid-email': 'Email invalide',
        'auth/too-many-requests': 'Trop de tentatives, réessayez plus tard'
      };
      errEl.textContent = msgs[err.code] || err.message;
      errEl.style.display = '';
      btn.textContent = 'Se connecter';
      btn.disabled = false;
    });
  }

  // Enable audio on first interaction (mobile requirement)
  document.addEventListener('click', function initAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
    document.removeEventListener('click', initAudio);
  });
})();
</script>

    btn.title = 'Non supporté sur ce navigateur';
    setTimeout(function() { updatePushBtn('error'); }, 2000);
    return;
  }
  if (Notification.permission === 'denied') {
    var btn2 = document.getElementById('pushBtn');
    btn2.innerHTML = '🚫';
    btn2.title = 'Allez dans Réglages > Notifications pour réactiver';
    return;
  }

  updatePushBtn('loading');

  // requestPermission: handle both callback and promise
  try {
    var permResult = Notification.requestPermission(function(perm) {
      // Callback style (older browsers)
      handlePermission(perm);
    });
    // Promise style (modern browsers)
    if (permResult && permResult.then) {
      permResult.then(function(perm) { handlePermission(perm); });
    }
  } catch(e) {
    console.error('requestPermission error:', e);
    updatePushBtn('error');
  }
}

function handlePermission(perm) {
  if (perm === 'granted') {
    registerToken();
  } else {
    updatePushBtn(perm);
  }
}

function registerToken() {
  updatePushBtn('loading');
  navigator.serviceWorker.register('sw-leads.js').then(function(reg) {
    // Wait for SW to be ready
    return navigator.serviceWorker.ready.then(function() { return reg; });
  }).then(function(reg) {
    return firebase.messaging().getToken({
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: reg
    });
  }).then(function(token) {
    if (!token) { updatePushBtn('error'); return; }
    var userName = window._currentUserName || localStorage.getItem('ambitio_name') || 'Inconnu';
    pushDb.collection('fcm_tokens').doc(token).set({
      token: token,
      userName: userName,
      userAgent: navigator.userAgent.substring(0, 100),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(function() {
      updatePushBtn('active');
      console.log('FCM token OK:', token.substring(0, 20) + '...');
    }).catch(function() {
      // Token registered in FCM but Firestore write failed — still active
      updatePushBtn('active');
    });
  }).catch(function(err) {
    console.error('Push registration failed:', err);
    updatePushBtn('error');
    // Show error on button for 3s then reset
    var btn = document.getElementById('pushBtn');
    if (btn) btn.title = 'Erreur: ' + (err.message || err).toString().substring(0, 60);
  });
}

// Handle foreground messages
if (pushSupported) {
  try {
    firebase.messaging().onMessage(function(payload) {
      console.log('Foreground push (app handles it):', payload);
    });
  } catch(e) {}
}

// Auto-register if already granted
if (pushSupported && Notification.permission === 'granted') {
  registerToken();
}
</script>

<script>
// App mode: skip nav, force sales role
var isAppMode = new URLSearchParams(window.location.search).has('app');
if (isAppMode) {
  localStorage.setItem('ambitio_role', 'sales');
  window._currentRole = 'sales';
  document.body.style.paddingLeft = '0';
} else {
  var navScript = document.createElement('script');
  navScript.src = 'nav.js';
  document.body.appendChild(navScript);
}
</script>
