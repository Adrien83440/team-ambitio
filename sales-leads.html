  h += '<div class="ld-detail-row"><span class="ld-detail-label">Secteur</span><input class="ld-detail-input" data-edit="secteur" data-id="' + id + '" value="' + escAttr(l.secteur || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">CA actuel</span><input class="ld-detail-input" data-edit="ca" data-id="' + id + '" value="' + escAttr(l.ca || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Défi</span><input class="ld-detail-input" data-edit="defi" data-id="' + id + '" value="' + escAttr(l.defi || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Dispo</span><input class="ld-detail-input" data-edit="disponibilite" data-id="' + id + '" value="' + escAttr(l.disponibilite || '') + '"/></div>';
  h += '<div class="ld-detail-row"><span class="ld-detail-label">Timeline</span><input class="ld-detail-input" data-edit="timeline" data-id="' + id + '" value="' + escAttr(l.timeline || '') + '"/></div>';
  h += '<div class="ld-autosave-msg" data-autosave-msg="' + id + '" style="font-size:11px;color:var(--green);text-align:center;padding:6px 0;opacity:0;transition:opacity 0.3s">✅ Sauvegardé automatiquement</div>';
  h += '</div>';

  // Actions
  h += '<div class="ld-actions">';
  h += '<div class="ld-actions-title">Statut</div>';
  h += '<div class="ld-status-grid">';
  for (var si = 0; si < STATUSES.length; si++) {
    var s = STATUSES[si];
    var isActive = (l.status || 'nouveau') === s.key;
    h += '<button class="ld-status-btn' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'color:' + s.color + ';border-color:' + s.color : '') + '" data-action="setStatus" data-id="' + id + '" data-status="' + s.key + '">' + s.icon + ' ' + s.label + '</button>';
  }
  h += '</div>';

  // RDV fields (hidden unless rdv_pose)
  var showRdv = (l.status || 'nouveau') === 'rdv_pose';
  h += '<div class="ld-rdv-section" data-rdv-section="' + id + '" style="display:' + (showRdv ? 'block' : 'none') + '">';
  h += '<div class="ld-actions-title">📅 Rendez-vous</div>';
  h += '<div class="ld-rdv-row">';
  h += '<input type="date" data-field="rdvDate" data-id="' + id + '" value="' + (l.rdvDate || '') + '"/>';
  h += '<input type="time" data-field="rdvHeure" data-id="' + id + '" value="' + (l.rdvHeure || '') + '"/>';
  h += '</div>';
  h += '</div>';

  // Notes history
  h += '<div class="ld-actions-title">Notes</div>';
  var notesArr = l.notesHistory || [];
  if (notesArr.length > 0) {
    h += '<div class="ld-notes-history">';
    for (var ni = notesArr.length - 1; ni >= 0; ni--) {
      var n = notesArr[ni];
      var nDate = n.date || '';
      h += '<div class="ld-note-item">';
      h += '<div class="ld-note-item-head">';
      h += '<span class="ld-note-item-date">' + escHtml(nDate) + '</span>';
      h += '<button class="ld-note-item-del" data-action="delNote" data-id="' + id + '" data-note-idx="' + ni + '" title="Supprimer">✕</button>';
      h += '</div>';
      h += '<div class="ld-note-item-text">' + escHtml(n.text || '') + '</div>';
      h += '</div>';
    }
    h += '</div>';
  }
  h += '<div class="ld-notes-add-row">';
  h += '<textarea class="ld-notes-area" data-field="newNote" data-id="' + id + '" placeholder="Ajouter une note..." rows="2"></textarea>';
  h += '<button class="ld-notes-add-btn" data-action="addNote" data-id="' + id + '">+ Ajouter</button>';
  h += '</div>';

  // ── Follow-Up section ──
  var fus = l.followUps || [];
  var fuPending = 0, fuOverdue = 0;
  var nowTs = Date.now();
  for (var fi = 0; fi < fus.length; fi++) {
    if (!fus[fi].done) {
      fuPending++;
      var fuTs = new Date(fus[fi].dateTime).getTime();
      if (fuTs <= nowTs) fuOverdue++;
    }
  }
  h += '<div class="ld-fu-section">';
  h += '<button class="ld-fu-toggle" data-action="toggleFu" data-id="' + id + '">';
  h += '🔔 Follow-Up';
  if (fuOverdue > 0) {
    h += ' <span class="ld-fu-count" style="background:rgba(239,68,68,0.12);color:#ef4444">' + fuOverdue + ' en retard</span>';
  } else if (fuPending > 0) {
    h += ' <span class="ld-fu-count" style="background:rgba(245,158,11,0.12);color:#f59e0b">' + fuPending + '</span>';
  }
  h += '<span class="ct-arrow">▼</span></button>';
  h += '<div class="ld-fu-body" data-fu-body="' + id + '" style="display:none">';
  // Add form
  h += '<div class="ld-fu-add">';
  h += '<input type="date" data-fu-field="date" data-id="' + id + '"/>';
  h += '<input type="time" data-fu-field="time" data-id="' + id + '"/>';
  h += '<textarea data-fu-field="note" data-id="' + id + '" placeholder="Note du FU (optionnel)..." rows="1"></textarea>';
  h += '<button class="ld-fu-add-btn" data-action="addFu" data-id="' + id + '">🔔 Programmer</button>';
  h += '</div>';
  // Row 2 : durée + switch "ajouter au calendrier Stratégie"
  h += '<div class="ld-fu-add-row2">';
  h += '<span class="ld-fu-duration-label">Durée</span>';
  h += '<select class="ld-fu-duration-select" data-fu-field="duration" data-id="' + id + '">';
  h += '<option value="15">15 min</option>';
  h += '<option value="30" selected>30 min</option>';
  h += '<option value="45">45 min</option>';
  h += '<option value="60">1h</option>';
  h += '</select>';
  h += '<label class="ld-fu-cal-switch" title="Crée un événement sur le calendrier Google du closer assigné">';
  h += '<input type="checkbox" data-fu-field="pushCal" data-id="' + id + '" checked/>';
  h += '<span class="sw-track"></span>';
  h += '<span class="sw-label">📅 Calendrier Stratégie</span>';
  h += '</label>';
  h += '</div>';
  // List
  if (fus.length === 0) {
    h += '<div class="ld-fu-empty">Aucun follow-up programmé</div>';
  } else {
    h += '<div class="ld-fu-list">';
    // Sort: pending first (overdue first), then done
    var fuSorted = fus.map(function(f, idx) { f._idx = idx; return f; }).sort(function(a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return new Date(a.dateTime).getTime() - new Date(b.dateTime).getTime();
    });
    for (var fj = 0; fj < fuSorted.length; fj++) {
      var fu = fuSorted[fj];
      var fuDate = new Date(fu.dateTime);
      var fuTimeDiff = fuDate.getTime() - nowTs;
      var fuClass = '';
      if (!fu.done) {
        if (fuTimeDiff <= 0) fuClass = ' overdue';
        else if (fuTimeDiff <= 3600000) fuClass = ' due-soon'; // 1h
      }
      var fuDateStr = String(fuDate.getDate()).padStart(2,'0') + '/' + String(fuDate.getMonth()+1).padStart(2,'0') + '/' + fuDate.getFullYear();
      var fuTimeStr = String(fuDate.getHours()).padStart(2,'0') + ':' + String(fuDate.getMinutes()).padStart(2,'0');
      h += '<div class="ld-fu-item' + (fu.done ? ' done' : '') + fuClass + '">';
      h += '<button class="ld-fu-check" data-action="toggleFuDone" data-id="' + id + '" data-fu-idx="' + fu._idx + '">' + (fu.done ? '✓' : '') + '</button>';
      h += '<div class="ld-fu-info">';
      h += '<div class="ld-fu-datetime">' + (fu.done ? '✅ ' : (fuTimeDiff <= 0 && !fu.done ? '⚠️ ' : '🔔 ')) + fuDateStr + ' à ' + fuTimeStr;
      if (fu.calendarEventId && fu.calendarEventLink) {
        h += '<a class="ld-fu-cal-badge" href="' + escHtml(fu.calendarEventLink) + '" target="_blank" rel="noopener" title="Ouvrir l\'événement Google Calendar" onclick="event.stopPropagation()">📅 Calendrier</a>';
      } else if (fu.calendarEventId) {
        h += '<span class="ld-fu-cal-badge" title="Événement Google Calendar associé">📅</span>';
      }
      h += '</div>';
      if (fu.note) h += '<div class="ld-fu-note">' + escHtml(fu.note) + '</div>';
      if (fu.createdBy) h += '<div class="ld-fu-by">par ' + escHtml(fu.createdBy) + '</div>';
      h += '</div>';
      h += '<button class="ld-fu-del" data-action="delFu" data-id="' + id + '" data-fu-idx="' + fu._idx + '">✕</button>';
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>'; // fu-body
  h += '</div>'; // fu-section

  // ── Communications history (calls + SMS) ──
  var comms = l.communications || [];
  var callsAndSms = [];
  for (var ci = 0; ci < comms.length; ci++) {
    if (comms[ci].type === 'call' || comms[ci].type === 'sms') callsAndSms.push(comms[ci]);
  }
  var callCount = 0, smsCount = 0;
  for (var cci = 0; cci < callsAndSms.length; cci++) {
    if (callsAndSms[cci].type === 'call') callCount++; else smsCount++;
  }
  h += '<div class="ld-comm-section">';
  h += '<button class="ld-comm-toggle" data-action="toggleComm" data-id="' + id + '">';
  h += '📞 Appels';
  if (callCount) h += ' <span class="ld-comm-count" style="background:rgba(52,211,153,0.12);color:#34d399">' + callCount + '</span>';
  h += ' &nbsp;💬 SMS';
  if (smsCount) h += ' <span class="ld-comm-count" style="background:rgba(96,165,250,0.12);color:#60a5fa">' + smsCount + '</span>';
  h += '<span class="ct-arrow">▼</span></button>';
  h += '<div class="ld-comm-list" data-comm-list="' + id + '" style="display:none">';
  if (callsAndSms.length === 0) {
    h += '<div class="ld-comm-empty">Aucun appel ou SMS synchronisé<br/>Les données apparaîtront via Ringover</div>';
  } else {
    // Tri chronologique ASC (du plus vieux en haut, comme iMessage)
    callsAndSms.sort(function(a, b) {
      var da = a.date ? new Date(a.date).getTime() : 0;
      var db2 = b.date ? new Date(b.date).getTime() : 0;
      return da - db2;
    });
    var ldOwnerKey = function(c) {
      // 1. Si on a ownerUid (Cloud Function moderne), match direct sur firebaseUid
      if (c.ownerUid) {
        var listU = window.TEAM_MEMBERS_LIST || [];
        for (var iu = 0; iu < listU.length; iu++) {
          if (listU[iu].firebaseUid === c.ownerUid) return listU[iu].slug;
        }
      }
      // 2. Fallback : match texte sur ownerName contre shortName/displayName
      var n = (c.ownerName || '').toLowerCase();
      if (n) {
        var listN = window.TEAM_MEMBERS_LIST || [];
        for (var jn = 0; jn < listN.length; jn++) {
          var sn = (listN[jn].shortName || '').toLowerCase();
          var dn = (listN[jn].displayName || '').toLowerCase();
          if (sn && n.indexOf(sn.replace(/[éèê]/g, 'e')) >= 0) return listN[jn].slug;
          if (sn && n.indexOf(sn) >= 0) return listN[jn].slug;
          if (dn && n.indexOf(dn.split(' ')[0].toLowerCase()) >= 0) return listN[jn].slug;
        }
      }
      return 'unknown';
    };
    // Détermine si la comm vient de l'équipe (out) ou du prospect (in).
    // Règle : si ownerName est défini → forcément équipe (out).
    // Sinon on regarde direction (qui peut être 'out', 'outbound', 'sortant', etc.).
    var ldSide = function(c) {
      if (c.ownerName) return 'out';
      var d = String(c.direction || '').toLowerCase();
      if (d === 'out' || d === 'outbound' || d === 'sortant') return 'out';
      return 'in';
    };
    var ldLastDay = '';
    for (var cj = 0; cj < callsAndSms.length; cj++) {
      var cm = callsAndSms[cj];
      var isCall = cm.type === 'call';
      var side = ldSide(cm);
      var ow = ldOwnerKey(cm);
      var cmDate = cm.date ? new Date(cm.date) : null;
      var cmDayKey = cmDate ? cmDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
      if (cmDayKey && cmDayKey !== ldLastDay) {
        h += '<div class="ld-conv-date-sep">' + escHtml(cmDayKey) + '</div>';
        ldLastDay = cmDayKey;
      }
      var timeStr = cmDate ? cmDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
      h += '<div class="ld-conv-row ' + side + '">';
      // Auteur (côté équipe seulement)
      if (side === 'out' && cm.ownerName) {
        h += '<div class="ld-conv-author ' + ow + '">' + escHtml(cm.ownerName) + '</div>';
      }
      if (isCall) {
        var clMissed = !cm.duration;
        var clDurStr = '';
        if (cm.duration) {
          var dm = Math.floor(cm.duration / 60), ds = cm.duration % 60;
          clDurStr = dm + 'm' + (ds ? String(ds).padStart(2, '0') + 's' : '');
        }
        var clIcon = side === 'out' ? '📞↗' : (clMissed ? '❌' : '📞↙');
        var clTitle = (side === 'out' ? 'Appel sortant' : 'Appel entrant') + (clMissed && side === 'in' ? ' (manqué)' : '');
        var callClass = 'ld-conv-call ' + side + (side === 'out' ? ' ' + ow : '') + (clMissed && side === 'in' ? ' missed' : '');
        // Bouton détail cliquable si l'appel a un callLogId (Twilio Dialer) ou un recordingUrl legacy (Ringover)
        var hasDetail = !!cm.callLogId;
        if (hasDetail) callClass += ' has-detail';
        h += '<div class="' + callClass + '"' + (hasDetail ? ' data-action="callDetail" data-cid="' + escA(cm.callLogId) + '" style="cursor:pointer"' : '') + '>';
        h += '<span class="ld-conv-call-icon">' + clIcon + '</span>';
        h += '<span class="ld-conv-call-title">' + escHtml(clTitle) + '</span>';
        if (clDurStr) h += '<span class="ld-conv-call-dur">' + clDurStr + '</span>';
        if (hasDetail) {
          var badges = '';
          if (cm.hasRecording)  badges += '🎙';
          if (cm.hasTranscript) badges += '📄';
          if (cm.hasAiAnalysis) badges += '🤖';
          if (badges) h += '<span class="ld-conv-call-badges" style="margin-left:auto;font-size:13px;opacity:0.85">' + badges + '</span>';
        }
        h += '</div>';
      } else {
        // SMS bubble
        h += '<div class="ld-conv-bubble ' + side + (side === 'out' ? ' ' + ow : '') + '">';
        if (cm.content) h += sanitizeCommContent(cm.content);
        else h += '<span style="color:var(--muted);font-style:italic">Contenu non disponible</span>';
        h += '</div>';
      }
      h += '<div class="ld-conv-meta">' + escHtml(timeStr) + (cm.source ? ' · ' + escHtml(cm.source) : '') + '</div>';
      h += '</div>'; // ld-conv-row
    }
  }
  h += '</div>';
  h += '</div>';

  // Delete button
  h += '<button class="ld-delete-btn" data-action="deleteLead" data-id="' + id + '">🗑 Supprimer cette fiche</button>';

  h += '</div>'; // actions
  h += '</div>'; // body
  h += '</div>'; // card

  return h;
}

/* ═══ FEED EVENTS ═══ */
document.getElementById('ldFeed').addEventListener('click', function(e) {
  // Call detail modal (click on a call row with callLogId)
  var cdTarget = e.target.closest('[data-action="callDetail"]');
  if (cdTarget) {
    e.stopPropagation();
    var cid = cdTarget.dataset.cid;
    if (cid && window.CallDetailModal) window.CallDetailModal.open(cid);
    return;
  }

  // Toggle card
  var toggle = e.target.closest('[data-action="toggle"]');
  if (toggle) {
    var card = toggle.closest('.ld-card');
    var id = card.dataset.leadId;
    if (card.classList.contains('open')) {
      card.classList.remove('open');
      openCardId = null;
    } else {
      document.querySelectorAll('.ld-card.open').forEach(function(c) { c.classList.remove('open'); });
      card.classList.add('open');
      openCardId = id;
    }
    return;
  }

  // Toggle communications history
  var commToggle = e.target.closest('[data-action="toggleComm"]');
  if (commToggle) {
    var commId = commToggle.dataset.id;
    var commList = document.querySelector('[data-comm-list="' + commId + '"]');
    if (commList) {
      var isOpen = commList.style.display !== 'none';
      commList.style.display = isOpen ? 'none' : 'flex';
      commToggle.classList.toggle('open', !isOpen);
    }
    return;
  }

  // Toggle edit mode
  var editBtn = e.target.closest('[data-action="toggleEdit"]');
  if (editBtn) {
    var eid = editBtn.dataset.id;
    var viewEl = document.querySelector('[data-view-mode="' + eid + '"]');
    var editEl = document.querySelector('[data-edit-mode="' + eid + '"]');
    if (!viewEl || !editEl) return;
    var isEditing = editEl.style.display !== 'none';
    if (isEditing) {
      // Closing edit mode → re-render with fresh data
      isEditingLead = false;
      openCardId = eid;
      renderFeed();
    } else {
      // Opening edit mode
      viewEl.style.display = 'none';
      editEl.style.display = '';
      editBtn.classList.add('editing');
      editBtn.innerHTML = '✕ Annuler';
      isEditingLead = true;
    }
    return;
  }

  // Status button
  var statusBtn = e.target.closest('[data-action="setStatus"]');
  if (statusBtn) {
    var leadId = statusBtn.dataset.id;
    var newStatus = statusBtn.dataset.status;
    // Visual update
    var card2 = statusBtn.closest('.ld-card');
    card2.querySelectorAll('.ld-status-btn').forEach(function(b) {
      b.classList.remove('active');
      b.style.color = '';
      b.style.borderColor = '';
    });
    statusBtn.classList.add('active');
    var sObj = getStatusObj(newStatus);
    statusBtn.style.color = sObj.color;
    statusBtn.style.borderColor = sObj.color;
    // Update local state
    for (var i = 0; i < allLeads.length; i++) {
      if (allLeads[i].id === leadId) { allLeads[i].status = newStatus; break; }
    }
    // Show/hide RDV section
    var rdvSection = card2.querySelector('[data-rdv-section="' + leadId + '"]');
    if (rdvSection) {
      rdvSection.style.display = (newStatus === 'rdv_pose') ? 'block' : 'none';
    }
    // Auto-save status + sync pipeline stage
    var STATUS_TO_STAGE = {
      nouveau:'lead', appele:'lead', decroche:'lead', messagerie:'lead',
      nrp1:'nrp1', nrp2:'nrp2', nrp3:'nrp3',
      rdv_pose:'rdv_confirmes', pas_interesse:'disqualification', disqualifie:'disqualification'
    };
    var syncStage = STATUS_TO_STAGE[newStatus];
    var updates = { status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (syncStage) {
      updates.stage = syncStage;
      for (var j = 0; j < allLeads.length; j++) {
        if (allLeads[j].id === leadId) { allLeads[j].stage = syncStage; break; }
      }
    }
    db.collection('leads').doc(leadId).update(updates).then(function() {
      toast('✅ Statut → ' + sObj.label + (syncStage ? ' (pipeline mis à jour)' : ''));
    }).catch(function(err) {
      toast('❌ ' + err.message);
    });
    return;
  }

  // Add note
  var addNoteBtn = e.target.closest('[data-action="addNote"]');
  if (addNoteBtn) {
    var noteLeadId = addNoteBtn.dataset.id;
    var card3 = addNoteBtn.closest('.ld-card');
    var textarea = card3.querySelector('[data-field="newNote"]');
    var text = textarea ? textarea.value.trim() : '';
    if (!text) { toast('⚠️ Écris une note d\'abord'); return; }
    // Format date
    var now = new Date();
    var dateStr = String(now.getDate()).padStart(2,'0') + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + now.getFullYear() + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var newNote = { text: text, date: dateStr };
    // Update local
    for (var ni = 0; ni < allLeads.length; ni++) {
      if (allLeads[ni].id === noteLeadId) {
        if (!allLeads[ni].notesHistory) allLeads[ni].notesHistory = [];
        allLeads[ni].notesHistory.push(newNote);
        break;
      }
    }
    // Save to Firestore
    var lead3 = allLeads.find(function(l) { return l.id === noteLeadId; });
    db.collection('leads').doc(noteLeadId).update({
      notesHistory: lead3.notesHistory,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      toast('✅ Note ajoutée');
    }).catch(function(err) {
      toast('❌ Erreur : ' + err.message);
    });
    // Re-render the card
    openCardId = noteLeadId;
    renderFeed();
    return;
  }

  // Delete note
  var delNoteBtn = e.target.closest('[data-action="delNote"]');
  if (delNoteBtn) {
    var dnLeadId = delNoteBtn.dataset.id;
    var dnIdx = parseInt(delNoteBtn.dataset.noteIdx);
    for (var di = 0; di < allLeads.length; di++) {
      if (allLeads[di].id === dnLeadId && allLeads[di].notesHistory) {
        allLeads[di].notesHistory.splice(dnIdx, 1);
        db.collection('leads').doc(dnLeadId).update({
          notesHistory: allLeads[di].notesHistory,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() {
          toast('🗑 Note supprimée');
        });
        break;
      }
    }
    openCardId = dnLeadId;
    renderFeed();
    return;
  }

  // Toggle FU section
  var fuToggle = e.target.closest('[data-action="toggleFu"]');
  if (fuToggle) {
    var fuId = fuToggle.dataset.id;
    var fuBody = document.querySelector('[data-fu-body="' + fuId + '"]');
    if (fuBody) {
      var isOpen = fuBody.style.display !== 'none';
      fuBody.style.display = isOpen ? 'none' : 'block';
      fuToggle.classList.toggle('open', !isOpen);
    }
    return;
  }

  // Add FU
  var addFuBtn = e.target.closest('[data-action="addFu"]');
  if (addFuBtn) {
    var afId = addFuBtn.dataset.id;
    var card4 = addFuBtn.closest('.ld-card');
    var fuDateEl = card4.querySelector('[data-fu-field="date"]');
    var fuTimeEl = card4.querySelector('[data-fu-field="time"]');
    var fuNoteEl = card4.querySelector('[data-fu-field="note"]');
    var fuDurEl = card4.querySelector('[data-fu-field="duration"]');
    var fuPushCalEl = card4.querySelector('[data-fu-field="pushCal"]');
    var fuDate = fuDateEl ? fuDateEl.value : '';
    var fuTime = fuTimeEl ? fuTimeEl.value : '';
    var fuNote = fuNoteEl ? fuNoteEl.value.trim() : '';
    var fuDuration = fuDurEl ? parseInt(fuDurEl.value, 10) || 30 : 30;
    var fuPushCal = fuPushCalEl ? !!fuPushCalEl.checked : false;
    if (!fuDate || !fuTime) { toast('⚠️ Date et heure requises'); return; }
    var fuDateTime = fuDate + 'T' + fuTime + ':00';
    var fuObj = {
      id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
      dateTime: fuDateTime,
      note: fuNote,
      duration: fuDuration,
      done: false,
      createdBy: personalUser ? (SETTERS[personalUser] ? SETTERS[personalUser].name : personalUser) : (window._currentUserName || 'Admin'),
      createdAt: new Date().toISOString()
    };
    // Update local
    var afLead = allLeads.find(function(l) { return l.id === afId; });
    if (afLead) {
      if (!afLead.followUps) afLead.followUps = [];
      afLead.followUps.push(fuObj);
      // Save to Firestore
      db.collection('leads').doc(afId).update({
        followUps: afLead.followUps,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        toast('🔔 Follow-up programmé');
        // Request notification permission if not already granted
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
        // Push event Google Calendar si switch activé + closer assigné
        if (fuPushCal) {
          pushFollowUpToCalendar(afLead, fuObj);
        }
      }).catch(function(err) { toast('❌ ' + err.message); });
    }
    openCardId = afId;
    renderFeed();
    // Re-open the FU section
    setTimeout(function() {
      var ft = document.querySelector('[data-action="toggleFu"][data-id="' + afId + '"]');
      var fb = document.querySelector('[data-fu-body="' + afId + '"]');
      if (ft && fb) { fb.style.display = 'block'; ft.classList.add('open'); }
    }, 50);
    return;
  }

  // Toggle FU done
  var fuDoneBtn = e.target.closest('[data-action="toggleFuDone"]');
  if (fuDoneBtn) {
    var fdId = fuDoneBtn.dataset.id;
    var fdIdx = parseInt(fuDoneBtn.dataset.fuIdx);
    var fdLead = allLeads.find(function(l) { return l.id === fdId; });
    if (fdLead && fdLead.followUps && fdLead.followUps[fdIdx] !== undefined) {
      fdLead.followUps[fdIdx].done = !fdLead.followUps[fdIdx].done;
      db.collection('leads').doc(fdId).update({
        followUps: fdLead.followUps,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        toast(fdLead.followUps[fdIdx].done ? '✅ FU terminé' : '🔔 FU réactivé');
      }).catch(function(err) { toast('❌ ' + err.message); });
      openCardId = fdId;
      renderFeed();
      setTimeout(function() {
        var ft = document.querySelector('[data-action="toggleFu"][data-id="' + fdId + '"]');
        var fb = document.querySelector('[data-fu-body="' + fdId + '"]');
        if (ft && fb) { fb.style.display = 'block'; ft.classList.add('open'); }
      }, 50);
    }
    return;
  }

  // Delete FU
  var fuDelBtn = e.target.closest('[data-action="delFu"]');
  if (fuDelBtn) {
    var fxId = fuDelBtn.dataset.id;
    var fxIdx = parseInt(fuDelBtn.dataset.fuIdx);
    var fxLead = allLeads.find(function(l) { return l.id === fxId; });
    if (fxLead && fxLead.followUps) {
      // Capture le FU avant splice pour récupérer d'éventuelles infos calendrier
      var removedFu = fxLead.followUps[fxIdx] || null;
      fxLead.followUps.splice(fxIdx, 1);
      db.collection('leads').doc(fxId).update({
        followUps: fxLead.followUps,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        toast('🗑 Follow-up supprimé');
        // Si le FU supprimé avait un event Google Calendar lié → delete côté Google
        if (removedFu && removedFu.calendarEventId) {
          deleteFollowUpCalendarEvent(removedFu, fxLead);
        }
      }).catch(function(err) { toast('❌ ' + err.message); });
      openCardId = fxId;
      renderFeed();
      setTimeout(function() {
        var ft = document.querySelector('[data-action="toggleFu"][data-id="' + fxId + '"]');
        var fb = document.querySelector('[data-fu-body="' + fxId + '"]');
        if (ft && fb) { fb.style.display = 'block'; ft.classList.add('open'); }
      }, 50);
    }
    return;
  }

  // Open booking modal
  var bookBtn = e.target.closest('[data-action="openBooking"]');
  if (bookBtn) {
    var bkId = bookBtn.dataset.id;
    var bkLead = allLeads.find(function(l) { return l.id === bkId; });
    if (bkLead) openBookingModal(bkLead);
    return;
  }

  // Reassign lead to me
  var reassignBtn = e.target.closest('[data-action="reassign"]');
  if (reassignBtn) {
    var raId = reassignBtn.dataset.id;
    if (!personalUser) return;
    var raLead = allLeads.find(function(l) { return l.id === raId; });
    var prevSetter = raLead ? raLead.assignedTo : '';
    db.collection('leads').doc(raId).update({
      assignedTo: personalUser,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      toast('📥 Lead réattribué à ' + (SETTERS[personalUser] ? SETTERS[personalUser].name : personalUser));
      // Add note about reassignment
      var raNote = { text: '📥 Réattribué de ' + (SETTERS[prevSetter] ? SETTERS[prevSetter].name : prevSetter) + ' à ' + (SETTERS[personalUser] ? SETTERS[personalUser].name : personalUser), date: new Date().toLocaleString('fr-FR') };
      var notes = (raLead && raLead.notesHistory) ? raLead.notesHistory : [];
      notes.push(raNote);
      db.collection('leads').doc(raId).update({ notesHistory: notes });
    }).catch(function(err) { toast('❌ ' + err.message); });
    return;
  }

  // Delete lead (two-step confirmation)
  var delLeadBtn = e.target.closest('[data-action="deleteLead"]');
  if (delLeadBtn) {
    var dlId = delLeadBtn.dataset.id;
    if (!delLeadBtn.classList.contains('confirming')) {
      // First click: ask confirmation
      delLeadBtn.classList.add('confirming');
      delLeadBtn.textContent = '⚠️ Confirmer la suppression ?';
      // Auto-reset after 4s
      delLeadBtn._resetTimer = setTimeout(function() {
        delLeadBtn.classList.remove('confirming');
        delLeadBtn.textContent = '🗑 Supprimer cette fiche';
      }, 4000);
    } else {
      // Second click: actually delete
      if (delLeadBtn._resetTimer) clearTimeout(delLeadBtn._resetTimer);
      delLeadBtn.textContent = '⏳ Suppression...';
      delLeadBtn.disabled = true;
      db.collection('leads').doc(dlId).delete().then(function() {
        // Remove from local state
        allLeads = allLeads.filter(function(l) { return l.id !== dlId; });
        delete knownLeadIds[dlId];
        if (openCardId === dlId) openCardId = null;
        renderFeed();
        toast('🗑 Fiche supprimée');
      }).catch(function(err) {
        toast('❌ Erreur : ' + err.message);
        delLeadBtn.classList.remove('confirming');
        delLeadBtn.textContent = '🗑 Supprimer cette fiche';
        delLeadBtn.disabled = false;
      });
    }
    return;
  }

});

var autoSaveTimers = {};

function autoSaveField(leadId, field, value) {
  // Debounce per lead
  if (autoSaveTimers[leadId]) clearTimeout(autoSaveTimers[leadId]);
  autoSaveTimers[leadId] = setTimeout(function() {
    // Gather ALL edit fields for this lead (not just the changed one)
    var card = document.querySelector('[data-lead-id="' + leadId + '"]');
    if (!card) return;
    var fields = ['nom', 'telephone', 'email', 'utm', 'type', 'assignedTo', 'secteur', 'ca', 'defi', 'disponibilite', 'timeline'];
    var updates = {};
    for (var i = 0; i < fields.length; i++) {
      var el = card.querySelector('[data-edit="' + fields[i] + '"]');
      if (el) updates[fields[i]] = el.value.trim();
    }
    // Si le téléphone fait partie du payload, recalculer phoneNormalized
    if (updates.telephone != null) {
      updates.phoneNormalized = phoneNormalized(updates.telephone);
    }
    updates.updatedAt = firebase.firestore.FieldValue.serverTimestamp();

    // Update local state
    for (var li = 0; li < allLeads.length; li++) {
      if (allLeads[li].id === leadId) {
        for (var key in updates) { if (key !== 'updatedAt') allLeads[li][key] = updates[key]; }
        break;
      }
    }

    db.collection('leads').doc(leadId).update(updates).then(function() {
      // Flash autosave message
      var msg = document.querySelector('[data-autosave-msg="' + leadId + '"]');
      if (msg) {
        msg.style.opacity = '1';
        setTimeout(function() { msg.style.opacity = '0'; }, 1500);
      }
    }).catch(function(err) {
      toast('❌ Erreur : ' + err.message);
    });
  }, 3000);
}

/* ═══ ROUND-ROBIN ASSIGNMENT ═══
   Round-robin générique sur tous les membres ACTIFS de l'équipe.
   Lit la liste depuis window.TEAM_MEMBERS_ACTIVE (chargé via nav.js).
   Les membres archivés sont automatiquement exclus de la rotation. */
function assignLeadRoundRobin(leadId, callback) {
  var active = window.TEAM_MEMBERS_ACTIVE || [];
  if (active.length === 0) {
    console.warn('[leads] roundrobin: aucun membre actif, abandon');
    if (callback) callback(null);
    return;
  }
  // Si un seul membre actif, lui attribuer directement (pas de round-robin nécessaire)
  if (active.length === 1) {
    var only = active[0].slug;
    db.collection('leads').doc(leadId).update({ assignedTo: only })
      .then(function() { if (callback) callback(only); })
      .catch(function(err) { console.error('[leads] solo-assign error:', err); });
    return;
  }
  var metaRef = db.collection('_meta').doc('roundrobin');
  db.runTransaction(function(tx) {
    return tx.get(metaRef).then(function(snap) {
      var last = (snap.exists && snap.data().lastAssigned) || null;
      // Trouver l'index du dernier dans la liste active (-1 si introuvable ou archivé)
      var lastIdx = -1;
      for (var i = 0; i < active.length; i++) {
        if (active[i].slug === last) { lastIdx = i; break; }
      }
      // Le suivant = (lastIdx + 1) % nbActifs
      var nextIdx = (lastIdx + 1) % active.length;
      var next = active[nextIdx].slug;
      tx.set(metaRef, { lastAssigned: next }, { merge: true });
      tx.update(db.collection('leads').doc(leadId), { assignedTo: next });
      return next;
    });
  }).then(function(assigned) {
    if (callback) callback(assigned);
  }).catch(function(err) {
    console.error('[leads] roundrobin error:', err);
  });
}

/* ═══ FIRESTORE LISTENER ═══ */
function startListening() {
  // Fenêtre glissante 30 jours : on charge tous les leads créés depuis 30 jours
  // au lieu d'une limite fixe à 500 (qui devenait insuffisante avec >500 leads/semaine
  // et faisait disparaître des leads récents de la vue Lead Live).
  var thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  var cutoffTs = firebase.firestore.Timestamp.fromDate(thirtyDaysAgo);

  db.collection('leads')
    .where('createdAt', '>=', cutoffTs)
    .orderBy('createdAt', 'desc')
    .onSnapshot(function(snap) {
      var newLeads = [];

      snap.docChanges().forEach(function(change) {
        if (change.type === 'added' && !isFirstLoad && !knownLeadIds[change.doc.id]) {
          var newLead = change.doc.data();
          newLead.id = change.doc.id;

          // Skip imported leads (no popup/sound)
          if (newLead.source === 'bigin_import' || newLead.source === 'migration_suivi_client') {
            knownLeadIds[change.doc.id] = true;
            return;
          }

          newLead._isNew = true;

          // Auto-assign if no assignedTo
          if (!newLead.assignedTo) {
            assignLeadRoundRobin(change.doc.id);
          }

          newLeads.push(newLead);
        }
        knownLeadIds[change.doc.id] = true;
      });

      // Rebuild full list
      allLeads = [];
      snap.forEach(function(doc) {
        var d = doc.data();
        d.id = doc.id;
        // Skip les leads marqués comme fusionnés (via dedup ou repair scripts)
        if (d._merged === true) return;
        // Check if it's one of the new ones
        for (var i = 0; i < newLeads.length; i++) {
          if (newLeads[i].id === doc.id) { d._isNew = true; break; }
        }
        allLeads.push(d);
      });

      // Don't re-render while user is editing — only update data + counts
      if (isEditingLead && newLeads.length === 0) {
        updateCounts();
      } else {
        renderFeed();
      }

      // Show popups for new leads
      for (var j = 0; j < newLeads.length; j++) {
        // In personal mode, only show popup for my leads
        if (personalUser && newLeads[j].assignedTo && newLeads[j].assignedTo !== personalUser) continue;
        showLeadPopup(newLeads[j]);
      }

      isFirstLoad = false;

      // On first load, assign any unassigned recent leads (arrived while page was closed)
      if (!window._firstLoadAssignDone) {
        window._firstLoadAssignDone = true;
        allLeads.forEach(function(l) {
          if (!l.assignedTo && l.source !== 'bigin_import' && l.source !== 'webinar_import' && l.source !== 'migration_suivi_client') {
            assignLeadRoundRobin(l.id);
          }
        });
      }

    }, function(err) {
      console.error('[leads] listener error:', err);
      document.getElementById('ldFeed').innerHTML = '<div class="ld-empty">Erreur de connexion : ' + escHtml(err.message) + '</div>';
    });
}

/* ═══ BRIDGE: booking_events → leads ═══
   Quand un booking_event arrive (form self-booking externe via Make), on cherche
   d'abord si un lead existe déjà pour ce prospect (par email puis téléphone).
   Si oui → update intelligent. Si non → create. */

var TERMINAL_STAGES = ['closed_won_setting', 'closed_won_self', 'closed_lost', 'poubelle', 'disqualification'];
var IMPORT_SOURCES_BRIDGE = ['bigin_import', 'migration_suivi_client', 'webinar_import'];

function telVariants(raw) {
  if (!raw) return [];
  var clean = String(raw).replace(/\s+/g, '');
  var set = {};
  set[clean] = 1;
  if (clean.indexOf('+33') === 0) set['0' + clean.slice(3)] = 1;
  if (clean.indexOf('33') === 0 && clean.length >= 11) set['0' + clean.slice(2)] = 1;
  if (clean.indexOf('0') === 0 && clean.length === 10) {
    set['+33' + clean.slice(1)] = 1;
    set['33' + clean.slice(1)] = 1;
  }
  var digitsOnly = clean.replace(/[^\d]/g, '');
  if (digitsOnly) set[digitsOnly] = 1;
  return Object.keys(set);
}

// Préfère les leads non-import (VSL/webinaire/self vs Bigin/webinar_import).
// Parmi les candidats non-imports, prend le plus récemment actif.
function pickBestLead(docs) {
  if (!docs || docs.length === 0) return null;
  var nonImports = [], imports = [];
  docs.forEach(function(d) {
    if (IMPORT_SOURCES_BRIDGE.indexOf(d.data.source) < 0) nonImports.push(d);
    else imports.push(d);
  });
  var pool = nonImports.length > 0 ? nonImports : imports;
  pool.sort(function(a, b) {
    var ta = (a.data.updatedAt && a.data.updatedAt.toMillis) ? a.data.updatedAt.toMillis() :
             ((a.data.createdAt && a.data.createdAt.toMillis) ? a.data.createdAt.toMillis() : 0);
    var tb = (b.data.updatedAt && b.data.updatedAt.toMillis) ? b.data.updatedAt.toMillis() :
             ((b.data.createdAt && b.data.createdAt.toMillis) ? b.data.createdAt.toMillis() : 0);
    return tb - ta;
  });
  return pool[0];
}

function findExistingLead(email, phone) {
  return new Promise(function(resolve) {
    var emailNorm = (email || '').trim().toLowerCase();

    function byPhone() {
      var variants = telVariants(phone);
      if (!variants.length) { resolve(null); return; }
      var remaining = variants.length;
      var collected = [];
      variants.forEach(function(v) {
        db.collection('leads').where('telephone', '==', v).get().then(function(snap) {
          snap.forEach(function(doc) {
            if (doc.data()._merged === true) return;
            collected.push({ id: doc.id, data: doc.data() });
          });
          remaining--;
          if (remaining === 0) resolve(pickBestLead(collected));
        }).catch(function() {
          remaining--;
          if (remaining === 0) resolve(pickBestLead(collected));
        });
      });
    }

    if (emailNorm) {
      db.collection('leads').where('email', '==', emailNorm).get().then(function(snap) {
        var collected = [];
        snap.forEach(function(doc) {
          if (doc.data()._merged === true) return;
          collected.push({ id: doc.id, data: doc.data() });
        });
        var emailRaw = (email || '').trim();
        if (collected.length === 0 && emailRaw && emailRaw !== emailNorm) {
          db.collection('leads').where('email', '==', emailRaw).get().then(function(snap2) {
            snap2.forEach(function(doc) {
              if (doc.data()._merged === true) return;
              collected.push({ id: doc.id, data: doc.data() });
            });
            if (collected.length > 0) resolve(pickBestLead(collected));
            else byPhone();
          }).catch(byPhone);
        } else if (collected.length > 0) {
          resolve(pickBestLead(collected));
        } else {
          byPhone();
        }
      }).catch(byPhone);
    } else {
      byPhone();
    }
  });
}

function startBookingBridge() {
  db.collection('booking_events')
    .where('processed', '==', false)
    .onSnapshot(function(snap) {
      snap.docChanges().forEach(function(change) {
        if (change.type !== 'added') return;
        var be = change.doc.data();
        var beId = change.doc.id;
        var beRef = change.doc.ref;
        var nowFr = new Date().toLocaleString('fr-FR');

        findExistingLead(be.email, be.telephone).then(function(existing) {
          if (existing) {
            // ───── UPDATE lead existant ─────
            var leadRef = db.collection('leads').doc(existing.id);
            var cur = existing.data || {};
            var update = {
              bookingEventId: beId,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            // Type : on force self_booking (lead plus engagé)
            if (cur.type !== 'self_booking') {
              update.type = 'self_booking';
            }

            // Si phoneNormalized manque côté master, le calculer maintenant
            if (!cur.phoneNormalized) {
              var pn = phoneNormalized(cur.telephone || be.telephone);
              if (pn) update.phoneNormalized = pn;
            }

            // Merger champs formulaire uniquement si vides côté lead
            var mergeFields = ['secteur', 'ca', 'defi', 'disponibilite', 'timeline'];
            mergeFields.forEach(function(f) {
              if (be[f] && !cur[f]) update[f] = be[f];
            });

            // Stage : ne pas écraser si terminal
            var curStage = cur.stage || 'lead';
            if (TERMINAL_STAGES.indexOf(curStage) < 0) {
              update.stage = 'rdv_self_booking';
              update.status = 'rdv_pose';
            }

            var tlText;
            if (curStage === 'rdv_self_booking' || curStage === 'rdv_confirmes' || curStage === 'set') {
              tlText = '🔄 RDV Self-Booking reporté (form externe)';
            } else if (TERMINAL_STAGES.indexOf(curStage) >= 0) {
              tlText = '📅 Nouveau RDV Self-Booking reçu (lead déjà en ' + curStage + ')';
            } else {
              tlText = '📅 RDV Self-Booking pris (form externe)';
            }
            var tlEntry = { text: tlText, date: nowFr, color: '#34d399' };
            update.timeline_history = (cur.timeline_history || []).concat([tlEntry]);

            var batch = db.batch();
            batch.update(leadRef, update);
            batch.update(beRef, { processed: true, mergedIntoLeadId: existing.id });
            batch.commit().then(function() {
              console.log('[bridge] booking_event ' + beId + ' → merged into ' + existing.id);
            }).catch(function(err) {
              console.error('[bridge] merge error for ' + beId + ':', err);
            });

          } else {
            // ───── CREATE nouveau lead ─────
            var lead = {
              nom:            be.nom || '',
              email:          (be.email || '').trim().toLowerCase(),
              telephone:      normalizeTel(be.telephone || ''),
              phoneNormalized: phoneNormalized(be.telephone || ''),
              secteur:        be.secteur || '',
              ca:             be.ca || '',
              defi:           be.defi || '',
              disponibilite:  be.disponibilite || '',
              timeline:       be.timeline || '',
              type:           'self_booking',
              source:         'forms_self_booking',
              utm:            be.type || 'Forms Self Booking',
              stage:          'lead',
              status:         'nouveau',
              assignedTo:     '',
              notesHistory:   [],
              timeline_history: [{ text: '✨ Lead créé via form Self-Booking', date: nowFr, color: '#a78bfa' }],
              bookingEventId: beId,
              createdAt:      be.createdAt || firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt:      firebase.firestore.FieldValue.serverTimestamp()
            };

            var batch = db.batch();
            var newLeadRef = db.collection('leads').doc('be_' + beId);
            batch.set(newLeadRef, lead);
            batch.update(beRef, { processed: true });
            batch.commit().then(function() {
              console.log('[bridge] booking_event ' + beId + ' → new lead ' + newLeadRef.id);
            }).catch(function(err) {
              console.error('[bridge] create error for ' + beId + ':', err);
            });
          }
        }).catch(function(err) {
          console.error('[bridge] findExistingLead error for ' + beId + ':', err);
        });
      });
    }, function(err) {
      console.error('[bridge] booking_events listener error:', err);
    });
}

/* ═══ TEAM MEMBERS — initialisation et re-render ═══ */
function onTeamMembersReady() {
  refreshSettersFromTeamMembers();
  injectTeamMemberStyles();
  // Re-render les pills membres (leur contenu dépend de TEAM_MEMBERS_ACTIVE)
  if (typeof renderMemberPills === 'function') renderMemberPills();

  // (pour que chaque carte affiche l'avatar/couleur/nom du bon setter)

    if (typeof renderFeed === 'function') renderFeed();
  }
  // Recalcule toujours les compteurs (ils dépendent des slugs TEAM_MEMBERS_LIST)
  if (typeof updateCounts === 'function') updateCounts();

function updatePushBtn(state) {
  var btn = document.getElementById('pushBtn');
  if (!btn) return;
  if (state === 'granted' || state === 'active') {
    btn.innerHTML = '🔔';
    btn.style.borderColor = 'rgba(52,211,153,0.3)';
    btn.style.background = 'rgba(52,211,153,0.1)';

  } else if (state === 'denied') {
    btn.innerHTML = '🚫';
    btn.style.borderColor = 'rgba(239,68,68,0.3)';
    btn.style.background = 'rgba(239,68,68,0.06)';
    btn.title = 'Notifications bloquées';
  } else if (state === 'loading') {
    btn.innerHTML = '⏳';
    btn.style.borderColor = 'rgba(245,158,11,0.3)';
    btn.style.background = 'rgba(245,158,11,0.06)';
  } else if (state === 'error') {
    btn.innerHTML = '⚠️';
    btn.style.borderColor = 'rgba(239,68,68,0.3)';
    btn.style.background = 'rgba(239,68,68,0.06)';
  } else {
    btn.innerHTML = '🔕';
    btn.style.borderColor = '';
    btn.style.background = 'var(--bg2)';
    btn.title = 'Activer les notifications';
  }
}

// Check support and current state
var pushSupported = ('Notification' in window) && ('serviceWorker' in navigator);
if (pushSupported) {
  updatePushBtn(Notification.permission === 'granted' ? 'granted' : 'default');
} else {
  updatePushBtn('error');
}

function requestPush() {
  if (!pushSupported) {
    // Show inline error instead of alert (alerts can fail on mobile PWA)
    var btn = document.getElementById('pushBtn');
    btn.innerHTML = '⚠️';
    btn.title = 'Non supporté sur ce navigateur';
    setTimeout(function() { updatePushBtn('error'); }, 2000);
    return;
  }
  if (Notification.permission === 'denied') {
    var btn2 = document.getElementById('pushBtn');
    btn2.innerHTML = '🚫';
    btn2.title = 'Allez dans Réglages > Notifications pour réactiver';
    return;
  }

  updatePushBtn('loading');

  // requestPermission: handle both callback and promise
  try {
    var permResult = Notification.requestPermission(function(perm) {
      // Callback style (older browsers)
      handlePermission(perm);
    });
    // Promise style (modern browsers)
    if (permResult && permResult.then) {
      permResult.then(function(perm) { handlePermission(perm); });
    }
  } catch(e) {
    console.error('requestPermission error:', e);
    updatePushBtn('error');
  }
}

function handlePermission(perm) {
  if (perm === 'granted') {
    registerToken();
  } else {
    updatePushBtn(perm);
  }
}

function registerToken() {
  updatePushBtn('loading');
  navigator.serviceWorker.register('sw-leads.js').then(function(reg) {
    // Wait for SW to be ready
    return navigator.serviceWorker.ready.then(function() { return reg; });
  }).then(function(reg) {
    return firebase.messaging().getToken({
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: reg
    });
  }).then(function(token) {
    if (!token) { updatePushBtn('error'); return; }
    var userName = window._currentUserName || localStorage.getItem('ambitio_name') || 'Inconnu';
    pushDb.collection('fcm_tokens').doc(token).set({
      token: token,
      userName: userName,
      userAgent: navigator.userAgent.substring(0, 100),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(function() {
      updatePushBtn('active');
      console.log('FCM token OK:', token.substring(0, 20) + '...');
    }).catch(function() {
      // Token registered in FCM but Firestore write failed — still active
      updatePushBtn('active');
    });
  }).catch(function(err) {
    console.error('Push registration failed:', err);
    updatePushBtn('error');
    // Show error on button for 3s then reset
    var btn = document.getElementById('pushBtn');
    if (btn) btn.title = 'Erreur: ' + (err.message || err).toString().substring(0, 60);
  });
}

// Handle foreground messages
if (pushSupported) {
  try {
    firebase.messaging().onMessage(function(payload) {
      console.log('Foreground push (app handles it):', payload);
    });
  } catch(e) {}
}

// Auto-register if already granted
if (pushSupported && Notification.permission === 'granted') {
  registerToken();
}
</script>

<!-- Follow-Up ↔ Google Calendar (Stratégie) -->
<script>
/**
 * Push un follow-up en tant qu'event Google Calendar sur le calendrier
 * primary du closer assigné au lead. Non-bloquant : en cas d'échec, le
 * FU reste créé dans Firestore, on affiche juste un toast warning.
 *
 * Cible : /api/calendar-followup-event action=create
 */
async function pushFollowUpToCalendar(lead, fuObj) {
  try {
    if (!lead || !fuObj) return;
    var assignedToSlug = lead.assignedTo || '';
    if (!assignedToSlug) {
      toast('⚠️ FU créé sans event : lead non assigné');
      return;
    }

    // Pré-check local : le member a-t-il un firebaseUid dans TEAM_MEMBERS ?
    var tm = (window.TEAM_MEMBERS || {})[assignedToSlug];
    if (!tm) {
      toast('⚠️ FU créé sans event : closer inconnu (' + assignedToSlug + ')');
      return;
    }
    if (!tm.firebaseUid) {
      toast('⚠️ FU créé sans event : ' + (tm.shortName || tm.displayName || assignedToSlug) + ' n\'a pas de compte Firebase lié');
      return;
    }

    var user = firebase.auth().currentUser;
    if (!user) {
      toast('⚠️ FU créé sans event : session expirée');
      return;
    }
    var idToken = await user.getIdToken(false);

    var leadName = ((lead.prenom || '') + ' ' + (lead.nom || '')).trim() || (lead.nom || 'Lead');
    var payload = {
      action: 'create',
      leadId: lead.id,
      fuId: fuObj.id,
      assignedToSlug: assignedToSlug,
      fuDateTime: fuObj.dateTime,
      duration: fuObj.duration || 30,
      note: fuObj.note || '',
      leadName: leadName,
      leadPhone: lead.telephone || '',
      leadEmail: lead.email || ''
    };

    var resp = await fetch('/api/calendar-followup-event', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + idToken
      },
      body: JSON.stringify(payload)
    });

    var data = null;
    try { data = await resp.json(); } catch (_) { data = null; }

    if (!resp.ok) {
      var errCode = data && data.error ? data.error : 'unknown';
      var msg = '⚠️ Event calendrier non créé : ';
      switch (errCode) {
        case 'no_firebase_uid':     msg += 'closer sans compte lié'; break;
        case 'no_booking_config':   msg += 'fiche booking absente'; break;
        case 'calendar_not_connected': msg += 'calendrier Google non connecté pour ' + (data.memberName || 'ce closer'); break;
        case 'member_not_found':    msg += 'closer introuvable'; break;
        case 'team_members_missing': msg += '_meta/team_members absent'; break;
        case 'forbidden':           msg += 'droits insuffisants'; break;
        default:                    msg += (data && data.message) || ('code ' + resp.status);
      }
      toast(msg);
      return;
    }

    // Succès : MAJ locale du lead pour refléter calendarEventId + link
    // (le backend a déjà patché Firestore, mais on évite d'attendre
    // l'onSnapshot pour afficher la pastille).
    if (data && data.eventId) {
      var localLead = (window.allLeads || []).find(function (l) { return l.id === lead.id; });
      if (localLead && Array.isArray(localLead.followUps)) {
        for (var i = 0; i < localLead.followUps.length; i++) {
          if (localLead.followUps[i] && localLead.followUps[i].id === fuObj.id) {
            localLead.followUps[i].calendarEventId = data.eventId;
            localLead.followUps[i].calendarEventLink = data.eventLink || '';
            localLead.followUps[i].calendarPersonId = data.personId || '';
            break;
          }
        }
        if (typeof renderFeed === 'function') renderFeed();
      }
      toast('📅 Event ajouté au calendrier de ' + (data.memberName || 'closer'));
    }
  } catch (e) {
    console.error('[pushFollowUpToCalendar] error:', e);
    toast('⚠️ Event calendrier non créé : ' + (e.message || 'erreur réseau'));
  }
}

/**
 * Supprime l'event Google Calendar associé à un follow-up qu'on vient
 * de retirer. Non-bloquant : erreur → toast warning mais le FU reste
 * bien supprimé côté Firestore.
 *
 * Cible : /api/calendar-followup-event action=delete
 */
async function deleteFollowUpCalendarEvent(removedFu, lead) {
  try {
    if (!removedFu || !removedFu.calendarEventId) return;

    var user = firebase.auth().currentUser;
    if (!user) return;
    var idToken = await user.getIdToken(false);

    var payload = {
      action: 'delete',
      eventId: removedFu.calendarEventId,
      personId: removedFu.calendarPersonId || '',
      assignedToSlug: (lead && lead.assignedTo) || ''
    };

    var resp = await fetch('/api/calendar-followup-event', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + idToken
      },
      body: JSON.stringify(payload)
    });

    if (!resp.ok) {
      var data = null;
      try { data = await resp.json(); } catch (_) { data = null; }
      console.warn('[deleteFollowUpCalendarEvent] API error:', resp.status, data);
      toast('⚠️ Event Google non supprimé — à retirer manuellement');
    }
  } catch (e) {
    console.error('[deleteFollowUpCalendarEvent] error:', e);
  }
}
</script>

<!-- Follow-Up Reminder System -->
<script>
var _fuNotifiedIds = {};
var _fuCheckInterval = null;

function checkFollowUpReminders() {
  if (!window.allLeads || allLeads.length === 0) return;
  var now = Date.now();
  var hasOverdue = false;

  for (var i = 0; i < allLeads.length; i++) {
    var l = allLeads[i];
    // In personal mode, only check my leads
    if (window.personalUser && l.assignedTo !== window.personalUser) continue;
    var fus = l.followUps || [];
    for (var j = 0; j < fus.length; j++) {
      var fu = fus[j];
      if (fu.done) continue;
      var fuTs = new Date(fu.dateTime).getTime();
      var diff = fuTs - now;
      // Notify if due within 2 minutes or overdue (and not already notified)
      var fuKey = l.id + '_' + j + '_' + fu.dateTime;
      if (diff <= 120000 && !_fuNotifiedIds[fuKey]) {
        _fuNotifiedIds[fuKey] = true;
        hasOverdue = true;
        // Toast
        var fuName = l.nom || 'Lead';
        var fuNote = fu.note ? ' — ' + fu.note : '';
        toast('🔔 FU: ' + fuName + fuNote);
        // Browser notification
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            var notifBody = 'Follow-up pour ' + fuName;
            if (fu.note) notifBody += '\n' + fu.note;
            new Notification('🔔 Rappel Follow-Up', {
              body: notifBody,
              icon: 'icon-leads.png',
              tag: 'fu-' + fuKey,
              requireInteraction: true
            });
          } catch(e) { console.warn('Notification error:', e); }
        }
        // Play sound
        if (typeof playNotifSound === 'function') playNotifSound();
      }
    }
  }

  // Re-render badges if there are overdue FUs (throttled)
  if (hasOverdue && !window._fuRenderThrottle) {
    window._fuRenderThrottle = true;
    renderFeed();
    setTimeout(function() { window._fuRenderThrottle = false; }, 10000);
  }
}

// Check every 30 seconds
_fuCheckInterval = setInterval(checkFollowUpReminders, 30000);
// Also check on first load after a short delay
setTimeout(checkFollowUpReminders, 3000);
</script>
