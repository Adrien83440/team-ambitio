    h += '<div style="font-size:32px;opacity:0.4;margin-bottom:6px">🎓</div>';
    h += '<div style="font-size:13px;color:var(--ink-muted);margin-bottom:6px">Aucune progression Kajabi importée pour ce client</div>';
    h += '<div style="font-size:11px;color:var(--ink-muted);margin-bottom:14px">Vérifie que l\'email <strong>' + esc(c.email||'(non renseigné)') + '</strong> matche bien dans le CSV exporté.</div>';
    h += '<a class="csm-btn primary" href="csm-import.html" target="_blank">📥 Importer un CSV Kajabi</a>';
    h += '</div>';
  } else {
    Object.keys(kProg.byCourse).forEach(function(courseKey){
      var crs = kProg.byCourse[courseKey] || {};
      var coursePct = null;
      var subInfo = '';
      if(typeof crs.pct === 'number'){
        coursePct = Math.max(0, Math.min(100, Math.round(crs.pct)));
        if(crs.lastImportAt) subInfo = '📅 Importé ' + timeAgo(crs.lastImportAt);
      } else if(crs.modules){
        var modKeys = Object.keys(crs.modules);
        var totL = 0, doneL = 0;
        modKeys.forEach(function(mk){
          var m = crs.modules[mk];
          var d = (m && m.completedLessons) ? Object.keys(m.completedLessons).length : 0;
          doneL += d;
          if(m && m.totalLessons) totL += m.totalLessons;
        });
        if(totL > 0) coursePct = Math.round((doneL/totL)*100);
        subInfo = doneL + ' leçon' + (doneL>1?'s':'') + ' faite' + (doneL>1?'s':'');
        if(totL > 0) subInfo += ' / ' + totL;
      }
      h += '<div style="margin-bottom:14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px">';
      h += '<div style="font-size:14px;font-weight:700">' + esc(crs.title || courseKey) + '</div>';
      h += '<div style="font-size:18px;font-weight:800;color:var(--csm-accent)">' + (coursePct !== null ? coursePct + '%' : '—') + '</div>';
      h += '</div>';
      if(coursePct !== null){
        var pctColor = coursePct >= 80 ? 'var(--csm-accent)' : coursePct >= 40 ? '#fbbf24' : 'var(--crit-color)';
        h += '<div style="height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-bottom:8px">';
        h += '<div style="height:100%;width:' + coursePct + '%;background:linear-gradient(90deg,' + pctColor + ',var(--csm-accent))"></div>';
        h += '</div>';
      }
      if(subInfo) h += '<div style="font-size:11px;color:var(--ink-muted)">' + subInfo + '</div>';
      h += '</div>';
    });
    if(kProg.lastImportAt){
      h += '<div style="font-size:11px;color:var(--ink-muted);margin:8px 0">⏱ Dernier import global : ' + fmtDateTime(kProg.lastImportAt) + '</div>';
    }
    h += '<div style="margin-top:8px"><a class="csm-btn primary" href="csm-import.html" target="_blank">📥 Mettre à jour depuis Kajabi</a></div>';
  }
  h += '</div>'; // kajabi body

  // ─── ONGLET 5 : NOTES & HISTORIQUE ───
  h += '<div class="mtab-body" data-mtab-body="notes" style="display:none">';
  // Notes
  h += '<div class="csm-section" style="padding:0;border:none;background:none;margin-bottom:18px">';
  h += '<div class="csm-section-title">📝 Notes (' + notes.length + ')</div>';
  h += '<textarea class="csm-textarea" id="csmNoteInput" placeholder="Ajouter une note interne (visible aussi dans le module Clients du sales)…"></textarea>';
  h += '<div style="margin-top:6px;display:flex;gap:8px"><button class="csm-btn primary" onclick="addNote()">+ Ajouter la note</button></div>';
  if(notes.length){
    h += '<div style="margin-top:10px">';
    notes.forEach(function(n){
      h += '<div class="csm-note">';
      h += '<div class="csm-note-meta">' + esc(n.auteur||'?') + ' · ' + fmtDateTime(n.createdAt) + '</div>';
      h += '<div class="csm-note-content">' + esc(n.contenu||'') + '</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // Historique relances CSM
  h += '<div class="csm-section" style="padding:0;border:none;background:none">';
  h += '<div class="csm-section-title">↻ Historique des relances CSM (' + hist.length + ')</div>';
  if(hist.length){
    var sorted = hist.slice().sort(function(a,b){ return new Date(b.at||0) - new Date(a.at||0); });
    h += '<div style="display:flex;flex-direction:column;gap:6px">';
    sorted.forEach(function(e){
      h += '<div class="csm-note">';
      h += '<div class="csm-note-meta">' + (e.byName||e.by||'?') + ' · ' + fmtDateTime(e.at) + (e.channel ? ' · ' + e.channel : '') + '</div>';
      if(e.message) h += '<div class="csm-note-content">' + esc(e.message) + '</div>';
      h += '</div>';
    });
    h += '</div>';
  } else {
    h += '<div style="color:var(--ink-muted);font-size:12px;font-style:italic">Aucune relance enregistrée.</div>';
  }
  h += '</div>';

  h += '</div>'; // notes body

  h += '</div>'; // modal-tab-bodies

  document.getElementById('modalContent').innerHTML = h;

  // Restaurer l'onglet actif (default = overview)
  var activeMTab = window._activeModalTab || 'overview';
  switchModalTab(activeMTab);
}

/* Switch onglet interne de la modal client */
function switchModalTab(tabName){
  window._activeModalTab = tabName;
  document.querySelectorAll('.mtab').forEach(function(b){
    b.classList.toggle('active', b.dataset.mtab === tabName);
  });
  document.querySelectorAll('.mtab-body').forEach(function(b){
    b.style.display = (b.dataset.mtabBody === tabName) ? '' : 'none';
  });

  // Auto-sync GoCardless quand on ouvre l'onglet Paiements (avec cache pour
  // éviter de rappeler l'API à chaque switch d'onglet sur le même client)
  if(tabName === 'payments' && openClientId){
    var c = allClients.find(function(x){ return x.id === openClientId; });
    if(c && c.email && document.getElementById('gcLiveContent')){
      // Cache : si on a déjà résolu pour ce client dans cette session, ne pas rappeler
      window._gcCsmCache = window._gcCsmCache || {};
      var cached = window._gcCsmCache[openClientId];
      if(cached && (Date.now() - cached.at) < 60000){
        // Cache <60s : réutiliser
        renderGcLiveData(cached.data);
      } else {
        csmGcLookup(openClientId, c.email, false);
      }
    }
  }
}
window.switchModalTab = switchModalTab;

/* ─── GoCardless lookup pour la modal CSM ───
   Appelle /api/gocardless-lookup et rend dans #gcLiveContent la liste des
   mandats + échéances (passées payées + à venir) avec icônes 💰 / ⌛.
   Réplique de la logique gcLookupClient() de sales-crm-app.js mais
   adaptée à la modal CSM. forceRefresh=true ignore le cache.            */
function csmGcLookup(leadId, email, forceRefresh){
  var resultEl = document.getElementById('gcLiveContent');
  var btn = document.getElementById('gcResyncBtn');
  if(!resultEl) return;
  if(!email){
    resultEl.innerHTML = '<span style="color:var(--crit-color)">❌ Email manquant — impossible de chercher dans GoCardless</span>';
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Sync…'; }
  resultEl.innerHTML = '⏳ Synchronisation GoCardless en cours…';

  firebase.auth().currentUser.getIdToken().then(function(token){
    return fetch('/api/gocardless-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ leadId: leadId, email: email })
    });
  }).then(function(resp){
    return resp.json().then(function(data){ return { ok: resp.ok, data: data }; });
  }).then(function(r){
    if(btn){ btn.disabled = false; btn.textContent = '🔄 Resync'; }
    if(!r.ok){
      resultEl.innerHTML = '<span style="color:var(--crit-color)">❌ ' + esc(r.data.error || 'Erreur API') + '</span>';
      return;
    }
    // Cache pour éviter rappels trop fréquents
    window._gcCsmCache = window._gcCsmCache || {};
    window._gcCsmCache[leadId] = { at: Date.now(), data: r.data };
    renderGcLiveData(r.data);
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = '🔄 Resync'; }
    console.error('[csmGcLookup] error', err);
    resultEl.innerHTML = '<span style="color:var(--crit-color)">❌ ' + esc(err.message) + '</span>';
  });
}
window.csmGcLookup = csmGcLookup;

/* ─── Créer un lead réel depuis un client virtuel coaching-only ───
   Cette fonction est appelée depuis le bandeau ou l'onglet Paiements de
   la modal pour les clients _isCoachingOnly. Elle crée un doc dans
   `leads` avec isClient=true, copiant les champs depuis la fiche
   coaching. Le virtuel disparaîtra automatiquement au prochain snapshot
   (cf. rebuildCoachingOnlyVirtuals).
   Note : pour migrer en BULK tous les coaching-only d'un coup, utiliser
   plutôt csm-diagnostic.html qui a un bouton "Créer tous les leads
   manquants" avec confirmation et compteurs.                            */
function csmCreateLeadFromCoachingOnly(virtualId){
  var c = allClients.find(function(x){ return x.id === virtualId; });
  if(!c || !c._isCoachingOnly){
    showToast('❌ Client introuvable ou déjà un lead', 'error');
    return;
  }
  var co = coachingByEmail[(c.email||'').toLowerCase().trim()];
  if(!co){
    showToast('❌ Fiche coaching introuvable', 'error');
    return;
  }
  if(!confirm('Créer un lead client pour ' + (c.nom||'?') + ' ?\n\nEmail : ' + (c.email||'—') + '\nTel : ' + (c.telephone||'—'))) return;

  var leadData = {
    nom: (c.nom||'').trim(),
    email: (c.email||'').toLowerCase().trim(),
    telephone: c.telephone || '',
    commerce: c.commerce || '',
    secteur: c.secteur || '',
    isClient: true,
    clientStatus: c.clientStatus || 'active',
    clientSince: co.dateEntree || firebase.firestore.FieldValue.serverTimestamp(),
    source: 'coaching_migration',
    sourceCoachingId: co._id,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    importedCreatedAt: co.dateEntree || null,
    timeline_history: [{
      date: new Date().toISOString().slice(0,10),
      text: 'Lead créé depuis fiche coaching (CSM)',
      color: '#14b8a6'
    }]
  };
  Object.keys(leadData).forEach(function(k){ if(leadData[k] === undefined) delete leadData[k]; });

  db.collection('leads').add(leadData).then(function(ref){
    showToast('✅ Lead client créé');
    closeModal();
    // Le snapshot leads va se rafraîchir tout seul, supprimer le virtuel
    // et créer la "vraie" card. On rouvre le détail sur le nouveau leadId.
    setTimeout(function(){ openClientModal(ref.id); }, 800);
  }).catch(function(e){
    console.error('csmCreateLeadFromCoachingOnly error', e);
    showToast('❌ Erreur création lead — voir console', 'error');
  });
}
window.csmCreateLeadFromCoachingOnly = csmCreateLeadFromCoachingOnly;

/* Rend le détail GoCardless (mandats + paiements passés/futurs) dans #gcLiveContent */
function renderGcLiveData(data){
  var resultEl = document.getElementById('gcLiveContent');
  if(!resultEl) return;
  var html = '';

  // Customer GC (lien)
  if(data.customer){
    html += '<div style="background:rgba(96,165,250,0.06);border:1px solid rgba(96,165,250,0.20);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px">';
    html += '<span>👤</span>';
    html += '<span>' + esc(data.customer.name || '?') + '</span>';
    if(data.customer.id){
      html += ' <span>—</span> <span style="font-family:monospace;color:#60a5fa;font-size:11px">' + esc(data.customer.id) + '</span>';
    }
    html += '</div>';
  }

  // Mandats
  if(data.mandates && data.mandates.length){
    var mLabels = { pending_submission:'⏳ En attente', submitted:'📤 Soumis', active:'✅ Actif', failed:'❌ Échoué', cancelled:'🚫 Annulé', expired:'⌛ Expiré' };
    html += '<div style="font-size:11px;font-weight:700;color:var(--ink-muted);margin-bottom:6px">Mandats (' + data.mandates.length + ')</div>';
    data.mandates.forEach(function(m){
      html += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px">';
      html += '<span style="font-family:monospace">' + esc(m.id) + '</span>';
      html += '<span>' + (mLabels[m.status] || m.status) + '</span>';
      html += '</div>';
    });
  } else if(data.mandate){
    var mLabel = ({ pending_submission:'⏳ En attente', submitted:'📤 Soumis', active:'✅ Actif', failed:'❌ Échoué', cancelled:'🚫 Annulé', expired:'⌛ Expiré' })[data.mandate.status] || data.mandate.status;
    html += '<div style="font-size:11px;font-weight:700;color:var(--ink-muted);margin-bottom:6px">Mandat</div>';
    html += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px">';
    html += '<span style="font-family:monospace">' + esc(data.mandate.id) + '</span>';
    html += '<span>' + mLabel + '</span>';
    html += '</div>';
  }

  // Paiements à venir + passés combinés et triés par date desc
  var paymentList = [];
  // Passés (paid_out, confirmed, etc.) depuis data.payments
  if(data.payments && data.payments.length){
    data.payments.forEach(function(p){
      paymentList.push({
        date: p.chargeDate,
        amount: p.amount,
        status: p.status,
        kind: 'past'
      });
    });
  }
  // Futurs depuis data.subscription.upcomingPayments
  if(data.subscription && data.subscription.upcomingPayments){
    data.subscription.upcomingPayments.forEach(function(up){
      paymentList.push({
        date: up.charge_date || up.chargeDate,
        amount: (up.amount/100), // GC retourne en centimes pour upcoming
        status: 'upcoming',
        kind: 'upcoming'
      });
    });
  }
  // Tri par date desc (plus récent en premier comme dans l'image 2)
  paymentList.sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'');
  });

  if(paymentList.length){
    var pIcons = {
      pending_submission:'⏳', submitted:'📤', confirmed:'✅', paid_out:'💰',
      cancelled:'🚫', failed:'❌', charged_back:'↩', upcoming:'⏳'
    };
    var pColor = function(st){
      if(st === 'paid_out' || st === 'confirmed') return '#34d399';
      if(st === 'failed' || st === 'charged_back') return 'var(--crit-color)';
      if(st === 'cancelled') return 'var(--ink-muted)';
      return 'var(--ink-soft)';
    };
    html += '<div style="font-size:11px;font-weight:700;color:var(--ink-muted);margin:10px 0 6px">Paiements (' + paymentList.length + ')</div>';
    html += '<div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg2)">';
    paymentList.forEach(function(p){
      var icon = pIcons[p.status] || '?';
      var col  = pColor(p.status);
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px">';
      html += '<span style="display:flex;align-items:center;gap:6px"><span style="font-size:14px">' + icon + '</span><span>' + esc(p.date || '—') + '</span></span>';
      html += '<span style="font-weight:700;color:' + col + '">' + fmtEuro(p.amount) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--ink-muted);font-style:italic">Aucun paiement trouvé dans GoCardless.</div>';
  }

  resultEl.innerHTML = html;
}
window.renderGcLiveData = renderGcLiveData;

document.addEventListener('click', function(e){

function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
  openClientId = null;
}

function changeStatus(newStatus){
  if(!openClientId) return;
  var ctx = getClientWriteContext(openClientId);
  // Pour un coaching-only, on stocke clientStatus sur le doc clients (pas
  // de notion de statut dans la fiche coaching native, mais on l'ajoute
  // comme champ libre pour que la CSM puisse le suivre).
  ctx.ref.update({
    clientStatus: newStatus,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    if(ctx.client) ctx.client.clientStatus = newStatus;
    showToast('✅ Statut mis à jour');
    renderModal();
  }).catch(function(e){
    console.error('changeStatus error', e);
    showToast('❌ Erreur changement statut', 'error');
  });
}

function addNote(){
  if(!openClientId) return;
  var input = document.getElementById('csmNoteInput');
  var txt = (input.value || '').trim();
  if(!txt){ showToast('Note vide', 'error'); return; }
  var ctx = getClientWriteContext(openClientId);
  var noteObj = {
    contenu: txt,
    auteur: currentUserEmail || currentUserName || 'CSM',
    createdAt: new Date().toISOString() // on utilise un ISO pour pouvoir le mettre dans arrayUnion
  };
  if(ctx.isCoachingOnly){
    // Pour coaching-only : note ajoutée au tableau csmNotes du doc clients
    ctx.ref.update({
      csmNotes: firebase.firestore.FieldValue.arrayUnion(noteObj),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      // Mettre à jour le cache local
      var co = coachingByEmail[(ctx.client.email||'').toLowerCase().trim()];
      if(co){
        co.csmNotes = co.csmNotes || [];
        co.csmNotes.push(noteObj);
      }
      showToast('📝 Note ajoutée (sur fiche coaching)');
      input.value = '';
      loadNotesForLead(openClientId, function(){ renderModal(); });
    }).catch(function(e){
      console.error('addNote (coaching) error', e);
      showToast('❌ Erreur ajout note', 'error');
    });
    return;
  }
  // Cas normal lead : sous-collection client_notes
  ctx.ref.collection('client_notes').add({
    contenu: txt,
    auteur: currentUserEmail || currentUserName || 'CSM',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    showToast('📝 Note ajoutée');
    input.value = '';
    loadNotesForLead(openClientId, function(){ renderModal(); });
  }).catch(function(e){
    console.error('addNote error', e);
    showToast('❌ Erreur ajout note', 'error');
  });
}

function deleteNote(noteId){
  if(!openClientId) return;
  if(!confirm('Supprimer cette note ?')) return;
  var ctx = getClientWriteContext(openClientId);
  if(ctx.isCoachingOnly){
    // Pour coaching-only, noteId est en fait un createdAt ISO (cf. addNote).
    // On reconstruit le tableau en filtrant l'élément à supprimer.
    var co = coachingByEmail[(ctx.client.email||'').toLowerCase().trim()];
    var current = (co && co.csmNotes) ? co.csmNotes.slice() : [];
    var newArr = current.filter(function(n){ return n.createdAt !== noteId; });
    ctx.ref.update({
      csmNotes: newArr,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      if(co) co.csmNotes = newArr;
      showToast('🗑 Note supprimée');
      loadNotesForLead(openClientId, function(){ renderModal(); });
    }).catch(function(e){
      console.error('deleteNote (coaching) error', e);
      showToast('❌ Erreur', 'error');
    });
    return;
  }
  ctx.ref.collection('client_notes').doc(noteId).delete()
    .then(function(){
      showToast('🗑 Note supprimée');
      loadNotesForLead(openClientId, function(){ renderModal(); });
    }).catch(function(e){
      console.error('deleteNote error', e);
      showToast('❌ Erreur', 'error');
    });
}

function markFollowedUp(){
  if(!openClientId) return;
  var msg = prompt('Note de la relance (facultatif) :', '');
  if(msg === null) return;
  var ctx = getClientWriteContext(openClientId);
  var historyEntry = {
    at: new Date().toISOString(),
    by: currentUser ? currentUser.uid : null,
    byName: currentUserName,
    channel: 'note',
    message: msg || ''
  };
  ctx.ref.update({
    lastCsmFollowupAt: firebase.firestore.FieldValue.serverTimestamp(),
    lastCsmFollowupBy: currentUser ? currentUser.uid : null,
    csmFollowupHistory: firebase.firestore.FieldValue.arrayUnion(historyEntry),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    showToast('✅ Relance enregistrée' + (ctx.isCoachingOnly ? ' (sur fiche coaching)' : ''));
    if(ctx.client){
      if(!ctx.client.csmFollowupHistory) ctx.client.csmFollowupHistory = [];
      ctx.client.csmFollowupHistory.push(historyEntry);
      ctx.client.lastCsmFollowupAt = new Date();
    }
    // Si coaching-only, mettre à jour aussi le cache coachingByEmail
    if(ctx.isCoachingOnly){
      var co = coachingByEmail[(ctx.client.email||'').toLowerCase().trim()];
      if(co){
        co.csmFollowupHistory = co.csmFollowupHistory || [];
        co.csmFollowupHistory.push(historyEntry);
        co.lastCsmFollowupAt = new Date();
      }
    }
    renderModal();
  }).catch(function(e){
    console.error('markFollowedUp error', e);
    showToast('❌ Erreur — voir les rules Firestore', 'error');
  });
}

/* ─── Tab + filter listeners ─── */
function switchTab(tab, el){
  activeTab = tab;
  document.querySelectorAll('.csm-tab').forEach(function(t){ t.classList.remove('active'); });
  if(el) el.classList.add('active');
  renderAll();
}
function toggleLevel(level, el){
  levelsActive[level] = !levelsActive[level];
  el.classList.toggle('active');
  renderRetards();
}
document.getElementById('searchInput').addEventListener('input', function(e){
  searchQ = e.target.value.trim();
  renderAll();
});
document.getElementById('filterStatus').addEventListener('change', function(e){
  filterStatus = e.target.value;
  renderAll();
});
document.getElementById('filterPayStatus').addEventListener('change', function(e){
  filterPayStatus = e.target.value;
  renderAll();
});
document.getElementById('filterReason').addEventListener('change', function(e){
  filterReason = e.target.value;
  renderAll();
});

// Expose pour onclick inline
window.switchTab = switchTab;
window.toggleLevel = toggleLevel;
window.openClientModal = openClientModal;
window.closeModal = closeModal;
window.changeStatus = changeStatus;
window.addNote = addNote;
window.deleteNote = deleteNote;
window.markFollowedUp = markFollowedUp;
window.quickSms = quickSms;
window.quickEmail = quickEmail;
</script>
</body>
