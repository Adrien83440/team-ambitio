<style>
/* ─── CSM theme — teal/emerald ─── */
:root {
  --csm-accent:     #5eead4;
  --csm-accent-2:   #14b8a6;
  --csm-accent-dark:#0f766e;
  --csm-glow:       rgba(94,234,212,0.18);
  --csm-bg-soft:    rgba(94,234,212,0.06);
  --csm-border:     rgba(94,234,212,0.25);
  --crit-bg:        rgba(239,68,68,0.10);
  --crit-color:     #fca5a5;
  --crit-border:    rgba(239,68,68,0.25);
  --warn-bg:        rgba(251,146,60,0.10);
  --warn-color:     #fdba74;
  --warn-border:    rgba(251,146,60,0.25);
  --att-bg:         rgba(250,204,21,0.10);
  --att-color:      #fde68a;
  --att-border:     rgba(250,204,21,0.25);
}

body { background: var(--bg); color: var(--ink); }

.csm-app { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
.csm-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
  padding-bottom: 18px; border-bottom: 1px solid var(--border);
}
.csm-logo {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--csm-accent), var(--csm-accent-2));
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  box-shadow: 0 6px 20px var(--csm-glow);
}
.csm-title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.csm-sub   { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

.csm-stats { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; margin-bottom: 24px; }
.csm-stat {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; transition: all 0.15s;
}
.csm-stat:hover { border-color: var(--csm-border); }
.csm-stat-val { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.csm-stat-label { font-size: 11px; color: var(--ink-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
.csm-stat.crit .csm-stat-val { color: var(--crit-color); }
.csm-stat.warn .csm-stat-val { color: var(--warn-color); }
.csm-stat.att  .csm-stat-val { color: var(--att-color); }
.csm-stat.ok   .csm-stat-val { color: var(--csm-accent); }

.csm-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.csm-tab {
  padding: 12px 18px; cursor: pointer; font-size: 14px; font-weight: 600;
  color: var(--ink-muted); border-bottom: 2px solid transparent;
  transition: all 0.15s; background: transparent; border-top: none; border-left: none; border-right: none;
  font-family: inherit;
}
.csm-tab:hover { color: var(--ink); }
.csm-tab.active { color: var(--csm-accent); border-bottom-color: var(--csm-accent); }
.csm-tab-count {
  display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 10px;
  background: rgba(255,255,255,0.06); font-size: 11px; font-weight: 700; min-width: 22px; text-align: center;
}
.csm-tab.active .csm-tab-count { background: var(--csm-bg-soft); color: var(--csm-accent); }

.csm-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.csm-search {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; color: var(--ink); font-family: inherit; font-size: 13px; min-width: 240px; flex: 1;
}
.csm-search:focus { outline: none; border-color: var(--csm-accent); box-shadow: 0 0 0 3px var(--csm-bg-soft); }
.csm-pill {
  padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: var(--bg3); border: 1px solid var(--border); color: var(--ink-muted);
  cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap;
}
.csm-pill:hover { color: var(--ink); }
.csm-pill.active { background: var(--csm-bg-soft); border-color: var(--csm-border); color: var(--csm-accent); }
.csm-pill.crit.active { background: var(--crit-bg); border-color: var(--crit-border); color: var(--crit-color); }
.csm-pill.warn.active { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-color); }
.csm-pill.att.active  { background: var(--att-bg); border-color: var(--att-border); color: var(--att-color); }

.csm-list { display: flex; flex-direction: column; gap: 8px; }
.csm-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto auto;
  gap: 14px; align-items: center; transition: all 0.15s; cursor: pointer;
}
.csm-card:hover { border-color: var(--csm-border); transform: translateY(-1px); }
.csm-card.crit { border-left: 3px solid var(--crit-color); }
.csm-card.warn { border-left: 3px solid var(--warn-color); }
.csm-card.att  { border-left: 3px solid var(--att-color); }

/* ═══ Nouveau layout cards en colonnes par dimension ═══════════════════════
   Chaque card a 6 cellules visibles : Identité | Paiement | Coaching |
   Kajabi | Followup | Actions. Permet de scanner une dimension précise
   sur toute la liste sans être noyé dans des badges à plat.
*/
.csm-card2 {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 14px;
  display: grid; grid-template-columns: minmax(220px,1.4fr) 1.1fr 1.1fr 1.1fr 0.9fr auto;
  gap: 0; align-items: stretch; transition: all 0.15s; cursor: pointer;
  margin-bottom: 8px; overflow: hidden; min-height: 84px;
}
.csm-card2:hover { border-color: var(--csm-border); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
.csm-card2.crit { border-left: 3px solid var(--crit-color); }
.csm-card2.warn { border-left: 3px solid var(--warn-color); }
.csm-card2.att  { border-left: 3px solid var(--att-color); }

/* Cellule identité — premier bloc */
.csm2-id {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-right: 1px solid var(--border); min-width: 0;
}
.csm2-id-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.csm2-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.csm2-sub { font-size: 11px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.csm2-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.csm2-badges .csm-badge { font-size: 9px; padding: 2px 6px; }

/* Cellules de dimension (Paiement / Coaching / Kajabi / Followup) */
.csm2-cell {
  padding: 10px 14px; display: flex; flex-direction: column; gap: 3px;
  border-right: 1px solid var(--border); justify-content: center; min-width: 0;
}
.csm2-cell-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.6px; color: var(--ink-muted);
  text-transform: uppercase; opacity: 0.7;
}
.csm2-cell-main {
  font-size: 16px; font-weight: 800; line-height: 1.1; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.csm2-cell-main-small { font-size: 13px; font-weight: 700; }
.csm2-amount { color: var(--csm-accent); }
.csm2-amount-sep { color: var(--ink-muted); font-weight: 500; margin: 0 1px; }
.csm2-amount-total { color: var(--ink-muted); font-weight: 600; }
.csm2-cell-sub {
  font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
.csm2-cell-sub.ok    { color: #34d399; }
.csm2-cell-sub.att   { color: #fbbf24; }
.csm2-cell-sub.warn  { color: var(--warn-color); }
.csm2-cell-sub.crit  { color: var(--crit-color); }
.csm2-cell-sub.muted { color: var(--ink-muted); }
.csm2-cell-empty {
  font-size: 11px; color: var(--ink-muted); font-style: italic; opacity: 0.7;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.csm2-progress-mini {
  width: 100%; max-width: 90px; height: 4px; background: var(--bg2);
  border-radius: 2px; overflow: hidden; margin: 2px 0;
}
.csm2-progress-mini-fill { height: 100%; transition: width 0.3s; }

/* Cellule actions */
.csm2-actions {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 14px;
}

/* Backgrounds très subtils pour distinguer les dimensions visuellement */
.csm2-cell-pay   { background: linear-gradient(180deg, rgba(34,197,94,0.02) 0%, transparent 100%); }
.csm2-cell-coach { background: linear-gradient(180deg, rgba(94,234,212,0.025) 0%, transparent 100%); }
.csm2-cell-kaj   { background: linear-gradient(180deg, rgba(251,191,36,0.02) 0%, transparent 100%); }

/* Responsive : sur écran moyen on cache la cellule followup, sur mobile on stack */
@media (max-width: 1280px) {
  .csm-card2 { grid-template-columns: minmax(200px,1.4fr) 1.1fr 1.1fr 1.1fr auto; }
  .csm2-cell-followup { display: none; }
}
@media (max-width: 920px) {
  .csm-card2 { grid-template-columns: 1fr 1fr; gap: 0; }
  .csm2-id { grid-column: 1 / -1; border-right: none; border-bottom: 1px solid var(--border); }
  .csm2-cell { border-right: none; border-bottom: 1px solid var(--border); }
  .csm2-cell-pay, .csm2-cell-coach { border-right: 1px solid var(--border); }
  .csm2-actions { grid-column: 1 / -1; padding: 8px 14px; justify-content: flex-end; border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); }
}

.csm-avatar {
  width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-weight: 700; font-size: 15px; color: white;
  background: linear-gradient(135deg, var(--csm-accent-dark), var(--csm-accent-2));
  flex-shrink: 0;
}
.csm-card-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.csm-card-name { font-size: 14px; font-weight: 700; }
.csm-card-meta { font-size: 12px; color: var(--ink-muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.csm-card-meta span { display: inline-flex; align-items: center; gap: 4px; }

.csm-badge { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.csm-badge.crit { background: var(--crit-bg); color: var(--crit-color); border: 1px solid var(--crit-border); }
.csm-badge.warn { background: var(--warn-bg); color: var(--warn-color); border: 1px solid var(--warn-border); }
.csm-badge.att  { background: var(--att-bg); color: var(--att-color); border: 1px solid var(--att-border); }
.csm-badge.ok   { background: var(--csm-bg-soft); color: var(--csm-accent); border: 1px solid var(--csm-border); }
.csm-badge.followup{ background: rgba(96,165,250,0.10); color: #93c5fd; border: 1px solid rgba(96,165,250,0.20); }
.csm-badge-coaching-only {
  background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(192,132,252,0.10));
  color: #c4b5fd;
  border: 1px solid rgba(168,85,247,0.30);
}
.csm-badge.cs-active   { background: rgba(16,185,129,.12); color:#34d399; border:1px solid rgba(16,185,129,.25); }
.csm-badge.cs-paused   { background: rgba(245,158,11,.12); color:#fbbf24; border:1px solid rgba(245,158,11,.25); }
.csm-badge.cs-completed{ background: rgba(167,139,250,.12); color:#a78bfa; border:1px solid rgba(167,139,250,.25); }
.csm-badge.cs-stopped  { background: rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.25); }
.csm-badge.cs-procedure{ background: rgba(249,115,22,.12); color:#fb923c; border:1px solid rgba(249,115,22,.25); }
.csm-badge.pay-active     { background: rgba(16,185,129,.10); color:#34d399; border:1px solid rgba(16,185,129,.25); }
.csm-badge.pay-failed     { background: var(--crit-bg); color: var(--crit-color); border: 1px solid var(--crit-border); }
.csm-badge.pay-cancelled  { background: rgba(148,163,184,.10); color:#cbd5e1; border:1px solid rgba(148,163,184,.20); }
.csm-badge.pay-pending    { background: var(--warn-bg); color:var(--warn-color); border:1px solid var(--warn-border); }
.csm-badge.pay-completed  { background: rgba(167,139,250,.10); color:#a78bfa; border:1px solid rgba(167,139,250,.20); }
.csm-badge.pay-mandate_active{ background: rgba(16,185,129,.10); color:#34d399; border:1px solid rgba(16,185,129,.25); }
.csm-badge.pay-draft      { background: rgba(148,163,184,.10); color:#cbd5e1; border:1px solid rgba(148,163,184,.20); }

.csm-actions { display: flex; gap: 6px; }
.csm-act-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg2); cursor: pointer; font-size: 15px; display: flex;
  align-items: center; justify-content: center; transition: all 0.15s; color: var(--ink);
}
.csm-act-btn:hover { background: var(--csm-bg-soft); border-color: var(--csm-border); transform: scale(1.05); }

.csm-empty {
  text-align: center; padding: 80px 20px; color: var(--ink-muted);
}
.csm-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.csm-empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--ink); }

/* ─── Modal ─── */
.csm-modal-bg {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
  align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 16px;
}
.csm-modal-bg.show { display: flex; }
.csm-modal {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
  width: min(720px, 100%); max-height: 90vh; overflow-y: auto; padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.csm-modal-h { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
.csm-modal-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.csm-modal-close {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg3); cursor: pointer; color: var(--ink); font-size: 16px; flex-shrink: 0;
}
.csm-modal-close:hover { background: var(--csm-bg-soft); }

.csm-section { margin-bottom: 20px; }
.csm-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-muted); margin-bottom: 8px; font-weight: 700; }
.csm-info-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.csm-info-item {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
}
.csm-info-label { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.4px; }
.csm-info-val { font-size: 13px; font-weight: 600; margin-top: 3px; word-break: break-word; }

.csm-status-row { display: flex; gap: 6px; flex-wrap: wrap; }
.csm-status-btn {
  padding: 6px 12px; border-radius: 18px; font-size: 11px; font-weight: 700;
  border: 1.5px solid var(--border); background: transparent; color: var(--ink-muted);
  cursor: pointer; transition: all 0.15s; font-family: inherit;
}

.csm-pay-row {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 6px; display: grid;
  grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; font-size: 12px;
}
.csm-pay-row.failed { border-left: 3px solid var(--crit-color); }
.csm-pay-amt { font-weight: 700; font-size: 14px; }

.csm-textarea {
  width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; color: var(--ink); font-family: inherit; font-size: 13px; resize: vertical;
  min-height: 70px;
}
.csm-textarea:focus { outline: none; border-color: var(--csm-accent); box-shadow: 0 0 0 3px var(--csm-bg-soft); }

.csm-note-item {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 6px; font-size: 12px;
}
.csm-note-meta { font-size: 10px; color: var(--ink-muted); margin-bottom: 4px; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.csm-note-text { white-space: pre-wrap; line-height: 1.5; }

.csm-history-item {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; margin-bottom: 5px; font-size: 11px;
}
.csm-history-meta { font-size: 10px; color: var(--ink-muted); margin-bottom: 3px; display: flex; gap: 8px; flex-wrap: wrap; }

.csm-modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

/* ─── Modal sticky bar : contact compact + actions rapides ─── */
.modal-sticky-bar {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg2);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.modal-contact-line {
  display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft);
}
.modal-contact-line span {
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.modal-quick-actions {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.modal-quick-actions .csm-btn { padding: 6px 12px; font-size: 12px; }

/* ─── Modal tabs ─── */
.modal-tabs {
  display: flex; gap: 2px; border-bottom: 1px solid var(--border);
  margin-bottom: 16px; overflow-x: auto;
}
.mtab {
  padding: 9px 14px; font-size: 12px; font-weight: 600; font-family: inherit;
  background: transparent; border: none; color: var(--ink-muted);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: 5px;
}
.mtab:hover { color: var(--ink); background: rgba(255,255,255,0.02); }
.mtab.active {
  color: var(--csm-accent); border-bottom-color: var(--csm-accent);
}
.mtab-count {
  background: rgba(255,255,255,0.06); padding: 1px 6px; border-radius: 8px;
  font-size: 10px; font-weight: 700;
}
.mtab.active .mtab-count { background: var(--csm-bg-soft); color: var(--csm-accent); }
.mtab-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  vertical-align: middle; margin-left: 2px;
}
.mtab-dot.crit { background: var(--crit-color); box-shadow: 0 0 6px rgba(239,68,68,0.5); }

.mtab-body { padding-bottom: 6px; min-height: 100px; }

/* ─── Overview grid : 4 mini-cards synthèse ─── */
.overview-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px;
}
.ov-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
  position: relative; overflow: hidden;
}
.ov-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.ov-coach::before { background: linear-gradient(90deg, var(--csm-accent-dark), var(--csm-accent)); }
.ov-pay::before   { background: linear-gradient(90deg, #059669, #34d399); }
.ov-kaj::before   { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.ov-fu::before    { background: linear-gradient(90deg, #6b7280, #94a3b8); }
.ov-card-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  color: var(--ink-muted); text-transform: uppercase; margin-top: 4px;
}
.ov-card-main {
  font-size: 22px; font-weight: 800; line-height: 1.1;
}
.ov-card-main-small { font-size: 16px; }
.ov-card-sep { color: var(--ink-muted); font-weight: 500; margin: 0 1px; }
.ov-card-bar { height: 4px; background: var(--bg2); border-radius: 2px; overflow: hidden; margin: 4px 0 2px; }
.ov-card-bar-fill { height: 100%; transition: width 0.3s; }
.ov-card-sub {
  font-size: 11px; color: var(--ink-soft); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.ov-card-empty {
  font-size: 12px; color: var(--ink-muted); font-style: italic; padding: 8px 0;
}
.ov-card.ov-empty .ov-card-label { opacity: 0.6; }

@media (max-width: 900px) {
  .overview-grid { grid-template-columns: repeat(2, 1fr); }
  .modal-quick-actions .csm-btn { flex: 1; justify-content: center; }
}
.csm-btn {
  padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); background: var(--bg3); color: var(--ink);
  cursor: pointer; transition: all 0.15s; font-family: inherit; display: inline-flex;
  align-items: center; gap: 6px; text-decoration: none;
}
.csm-btn:hover { background: var(--csm-bg-soft); border-color: var(--csm-border); }
.csm-btn.primary {
  background: linear-gradient(135deg, var(--csm-accent-dark), var(--csm-accent-2));
  border-color: var(--csm-accent); color: white;
}
.csm-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--csm-glow); }
.csm-btn.danger { color: var(--crit-color); border-color: var(--crit-border); }

.csm-temo-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 8px;
}
.csm-temo-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.csm-temo-from { font-size: 13px; font-weight: 700; }
.csm-temo-when { font-size: 11px; color: var(--ink-muted); }
.csm-temo-text { font-size: 13px; line-height: 1.5; color: var(--ink-soft); white-space: pre-wrap; }

.csm-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--bg3); border: 1px solid var(--csm-border);
  padding: 12px 22px; border-radius: 10px; font-size: 13px; font-weight: 600;
  z-index: 2000; transition: transform 0.3s; box-shadow: 0 6px 24px rgba(0,0,0,0.4);
}
.csm-toast.show { transform: translateX(-50%) translateY(0); }
.csm-toast.error { border-color: var(--crit-border); color: var(--crit-color); }
.csm-toast.success { border-color: var(--csm-border); color: var(--csm-accent); }

.csm-loading { padding: 60px; text-align: center; color: var(--ink-muted); }
.csm-spinner {
  display: inline-block; width: 32px; height: 32px;
  border: 3px solid var(--border); border-top-color: var(--csm-accent);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .csm-stats { grid-template-columns: repeat(2,1fr); }

  .csm-info-grid { grid-template-columns: 1fr; }
  .csm-pay-row { grid-template-columns: 1fr; }
}

<body>

<div class="csm-app">
  <div class="csm-header">
    <div class="csm-logo">💎</div>
    <div>
      <div class="csm-title">Dashboard Customer Success</div>
      <div class="csm-sub">Suivi clients actifs, paiements, coachings, formation Kajabi</div>
    </div>

      <option value="all">Tous paiements</option>

  <!-- ─── BODY ─── -->

    <div class="csm-loading"><div class="csm-spinner"></div>Chargement des données…</div>

<!-- ─── MODAL DETAIL CLIENT ─── -->
<div class="csm-modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="csm-modal" id="modalContent"></div>
</div>

<!-- ─── TOAST ─── -->
<div class="csm-toast" id="toast"></div>

<script src="nav.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   csm-dashboard.html — Customer Success Manager
   ───────────────────────────────────────────────────────────────────────────
   Source UNIQUE de vérité pour les clients : leads where isClient==true
   (avec dédup _merged===true skipped — pattern aligné avec sales-leads.html)

   Enrichissements :
     • payments where leadId==id  → tous les paiements du client
     • leads/{id}/client_temoignages → témoignages
     • leads/{id}/client_notes      → notes (partagées avec sales-clients.html)

   Statuts client :   active / paused / completed / stopped / procedure
   Statuts paiement : draft / pending_mandate / mandate_active / active /
                      completed / failed / cancelled
   ═══════════════════════════════════════════════════════════════════════════ */

var db = firebase.firestore();
var currentUser = null;
var currentRole = null;
var currentUserName = '';
var currentUserEmail = '';

var allClients      = [];     // leads with isClient==true && !_merged
var paymentsByLead  = {};     // leadId -> [payments]
var notesByLead     = {};     // leadId -> [notes]
var temoByLead      = {};     // leadId -> [temo]
var temoFlat        = [];
var coachingByEmail = {};     // email lowercase -> client coaching doc
var coachMembersMap = {};     // slug -> displayName (pour afficher coach assigné)

var activeTab    = 'retards';
var levelsActive = { crit:true, warn:true, att:true };
var searchQ      = '';
var filterStatus = 'all';
var filterPayStatus = 'all';
var filterReason = 'all'; // all | payment | coaching
var openClientId = null;

/* ─── Constants ─── */
var CLIENT_STATUS = {
  active:    { label:'✅ Actif',     cls:'cs-active' },
  paused:    { label:'⏸ En pause',   cls:'cs-paused' },
  completed: { label:'🎉 Terminé',   cls:'cs-completed' },
  stopped:   { label:'🛑 Stoppé',    cls:'cs-stopped' },
  procedure: { label:'⚖️ Procédure', cls:'cs-procedure' }
};
var PAY_STATUS = {
  draft:           { label:'📝 Brouillon',         cls:'pay-draft' },
  pending_mandate: { label:'⏳ Mandat en attente', cls:'pay-pending' },
  mandate_active:  { label:'✅ Mandat actif',      cls:'pay-mandate_active' },
  active:          { label:'💸 Actif',             cls:'pay-active' },
  completed:       { label:'🎉 Terminé',           cls:'pay-completed' },
  failed:          { label:'❌ Échec',             cls:'pay-failed' },
  cancelled:       { label:'🚫 Annulé',            cls:'pay-cancelled' }
};

/* ─── Helpers ─── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
});}
function showToast(msg, kind){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'csm-toast show ' + (kind||'success');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}
function fmtEuro(v){ return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(v||0); }
function toDate(d){
  if(!d) return null;
  var dt = (d && d.toDate) ? d.toDate() : new Date(d);
  return isNaN(dt.getTime()) ? null : dt;
}
function fmtDate(d){
  var dt = toDate(d); if(!dt) return '—';
  return dt.toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtDateTime(d){
  var dt = toDate(d); if(!dt) return '—';
  return dt.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }) +
         ' à ' + dt.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}
function timeAgo(d){
  var dt = toDate(d); if(!dt) return '—';
  var diffDays = Math.floor((Date.now() - dt.getTime()) / 86400000);
  if(diffDays === 0) return "aujourd'hui";
  if(diffDays === 1) return 'hier';
  if(diffDays < 7) return 'il y a ' + diffDays + ' jours';
  if(diffDays < 30) return 'il y a ' + Math.floor(diffDays/7) + ' sem.';
  if(diffDays < 365) return 'il y a ' + Math.floor(diffDays/30) + ' mois';
  return 'il y a ' + Math.floor(diffDays/365) + ' an(s)';
}
function initials(name){
  if(!name) return '?';
  var parts = name.trim().split(/\s+/);
  if(parts.length >= 2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}
function clientDisplayName(c){
  return c.nom || c.commerce || c.email || c.telephone || '?';
}

/* ─── Compute level (crit / warn / att / ok) ─── */
function computeLevel(c){
  // Skip si client n'est plus à suivre
  var status = c.clientStatus || 'active';
  if(status === 'completed') return 'ok';
  if(status === 'stopped')   return null; // exclu de la vue retards

  var pays = paymentsByLead[c.id] || [];

  // Détecter paiement(s) en échec non résolu(s)
  var hasFailed = pays.some(function(p){ return p.status === 'failed'; });
  var hasCancelled = pays.some(function(p){ return p.status === 'cancelled'; });

  // Détecter retard de prélèvement sur paiement actif
  var hasPaymentBehind = false;
  pays.forEach(function(p){
    if(p.status !== 'active') return;
    if(!p.installmentsCount || p.installmentsCount <= 1) return;
    var start = toDate(p.startDate);
    if(!start) return;
    var monthsElapsed = (new Date().getFullYear() - start.getFullYear()) * 12
                      + (new Date().getMonth() - start.getMonth()) + 1;
    var expected = Math.min(monthsElapsed, p.installmentsCount);
    var actual = p.paidCount || 0;
    if(actual < expected - 1) hasPaymentBehind = true; // tolérance d'1 mois
  });

  // ─── Retards de coaching (collection clients) ───
  // Si un client coaching matché existe et qu'il n'est pas inactif/terminé,
  // on évalue ses 2 derniers mois de quota mensuel.
  var coachingDoc = getCoachingForLead(c);
  var hasCoaching2MonthsMissed = false;
  var hasCoaching1MonthMissed = false;
  var hasCoachingPartial = false;
  if(coachingDoc && coachingDoc.statut !== 'inactif'){
    var done  = coachingDoc.nbCoachingsFaits || 0;
    var total = coachingDoc.nbCoachingsTotal || 12;
    if(done < total){ // pas terminé
      var now = new Date();
      var qNow = getCoachingQuotaStatus(coachingDoc, now.getFullYear(), now.getMonth());
      var prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
      var qPrev = getCoachingQuotaStatus(coachingDoc, prev.getFullYear(), prev.getMonth());
      if(qNow && qPrev && qNow.status === 'miss' && qPrev.status === 'miss'){
        hasCoaching2MonthsMissed = true;
      } else if(qNow && qNow.status === 'miss'){
        hasCoaching1MonthMissed = true;
      } else if(qNow && qNow.status === 'partial'){
        hasCoachingPartial = true;
      }
    }
  }

  // Statuts critiques business
  if(status === 'procedure') return 'crit';
  if(hasFailed) return 'crit';
  if(hasPaymentBehind) return 'crit';
  if(hasCoaching2MonthsMissed) return 'crit';

  // Statut paused = à relancer
  if(status === 'paused') return 'warn';
  if(hasCancelled) return 'warn';
  if(hasCoaching1MonthMissed) return 'warn';

  // Pending_mandate depuis +7j = à relancer
  var hasOldPending = pays.some(function(p){
    if(p.status !== 'pending_mandate') return false;
    var ts = toDate(p.createdAt);
    if(!ts) return false;
    return (Date.now() - ts.getTime()) > 7 * 86400000;
  });
  if(hasOldPending) return 'warn';

  // Aucun paiement enregistré sur un client actif
  if(status === 'active' && pays.length === 0) return 'att';
  // Sessions partielles (en dessous quota mensuel)
  if(hasCoachingPartial) return 'att';

  return 'ok';
}

/* ─── Auth + boot ─── */
firebase.auth().onAuthStateChanged(function(user){
  if(!user){ window.location.href = 'login.html'; return; }
  currentUser = user;
  currentUserEmail = user.email;
  db.collection('users').doc(user.uid).get().then(function(snap){
    var d = snap.exists ? snap.data() : {};
    currentRole = d.role || 'csm';
    currentUserName = user.displayName || user.email.split('@')[0];
    if(['admin','csm','sales'].indexOf(currentRole) < 0){
      document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#cbd5e1"><h2>⛔ Accès réservé</h2></div>';
      return;
    }
    loadAllData();
  }).catch(function(e){
    console.warn('User doc error', e);
    loadAllData();
  });
});

/* ─── Data loading ─── */
function loadAllData(){
  // ─── Charger les clients coaching (collection séparée) en parallèle ───
  // Match plus tard avec leads par email canonicalisé.
  loadCoachingClients();
  // Charger les coachs (pour afficher coach assigné)
  loadCoachMembers();

  // Listener temps réel sur leads clients
  db.collection('leads').where('isClient','==',true).onSnapshot(function(snap){
    allClients = [];
    snap.forEach(function(d){
      var data = d.data();
      // ─── Dédup : skip _merged===true ───
      // Pattern aligné avec sales-leads.html (memories : "Always check
      // _merged===true and skip"). Évite les doublons quand un lead a été
      // fusionné dans un autre.
      if(data._merged === true) return;
      data.id = d.id;
      allClients.push(data);
    });
    // Sort : plus récents d'abord
    allClients.sort(function(a,b){
      var da = toDate(a.clientSince) || toDate(a.updatedAt) || new Date(0);
      var db_ = toDate(b.clientSince) || toDate(b.updatedAt) || new Date(0);
      return db_ - da;
    });
    // Recombiner les virtuels coaching-only (cf. rebuildCoachingOnlyVirtuals).
    // Si un lead vient d'être créé pour un coaching-only (via diagnostic),
    // le virtuel correspondant disparaîtra automatiquement à ce moment.
    rebuildCoachingOnlyVirtuals();
    loadPaymentsForClients();
    loadTemoignagesForClients();

    // ─── Auto-ouverture modal si ?clientId=X dans l'URL ───
    // Permet à csm-clients.html (et autres pages) d'ouvrir directement le
    // détail d'un client via un lien.
    var openId = (new URLSearchParams(window.location.search)).get('clientId');
    if(openId && !window._csmClientAutoOpened){
      window._csmClientAutoOpened = true;
      // Petit délai pour laisser le temps aux paiements/notes/témoignages de
      // se charger en arrière-plan et alimenter la modal.
      setTimeout(function(){ openClientModal(openId); }, 500);
    }
  }, function(err){
    console.error('Clients listener error:', err);
    document.getElementById('csmBody').innerHTML =
      '<div class="csm-empty"><div class="csm-empty-icon">⚠️</div><div class="csm-empty-title">Erreur de chargement</div><div>' + esc(err.message) + '</div></div>';
  });
}

/* ─── Coaching collection — match par email avec leads clients ─── */
// La collection `clients` est utilisée par coaching.html. Elle contient
// les sessions, programmes, quotas mensuels, coach assigné. On la charge
// pour DEUX raisons :
//   1. Enrichir chaque lead client avec ses infos de coaching matchées
//      par email (best-effort).
//   2. Détecter les fiches coaching SANS lead correspondant et les ajouter
//      au dashboard CSM en tant que "clients virtuels coaching only" (cf.
//      diagnostic — Catherine TALON et co. qui sont en coaching mais pas
//      marquées isClient dans leads). Pour ces virtuels, les writes
//      (notes, status, followup) vont sur le doc clients/{coachingId}
//      plutôt que leads/{leadId}.
function loadCoachingClients(){
  db.collection('clients').onSnapshot(function(snap){
    coachingByEmail = {};
    snap.forEach(function(d){
      var data = d.data();
      data._id = d.id;
      var email = (data.email || '').toLowerCase().trim();
      if(email) coachingByEmail[email] = data;
    });
    // Reconstruire les "clients virtuels coaching only" et merger dans allClients
    rebuildCoachingOnlyVirtuals();
    renderAll();
  }, function(err){
    console.warn('Coaching clients listener error (non-bloquant):', err.message);
  });
}

/* ─── Construction des clients virtuels coaching-only ───
   Pour chaque doc dans coachingByEmail dont l'email ne correspond à aucun
   lead client réel, on crée un objet client virtuel. Ces virtuels sont
   ajoutés à allClients pour qu'ils apparaissent dans le dashboard avec
   un badge "📚 Coaching only". Les writes sur ces clients sont routés
   vers la collection clients/{_id} via les flags _isCoachingOnly et
   _coachingId. Cf. memory note d'Adrien : "Sauvegardées sur le doc
   clients/coaching" pour notes/relances coaching-only.                  */
function rebuildCoachingOnlyVirtuals(){
  // Repérer les emails de leads clients réels (avec isClient=true && !_merged)
  var realEmails = {};
  allClients.forEach(function(c){
    if(c._isCoachingOnly) return; // ne pas se compter soi-même au passage suivant
    var em = (c.email||'').toLowerCase().trim();
    if(em) realEmails[em] = true;
  });

  // Retirer les anciens virtuels (on va les recréer)
  allClients = allClients.filter(function(c){ return !c._isCoachingOnly; });

  // Pour chaque coaching dont l'email n'est pas couvert, créer le virtuel
  Object.keys(coachingByEmail).forEach(function(em){
    if(realEmails[em]) return;
    var co = coachingByEmail[em];
    var nom = co.nom || co.name || '';
    if(co.prenom && nom.indexOf(co.prenom) < 0) nom = co.prenom + ' ' + nom;
    var virtualClient = {
      // ID préfixé pour que les autres pages (csm-clients.html, deeplinks)
      // ne tentent pas de read leads/{coaching_xxx} qui n'existe pas
      id: 'coaching_' + co._id,
      _isCoachingOnly: true,
      _coachingId: co._id,
      // Champs minimaux pour rendre la card et la modal
      nom: (nom || '').trim() || 'Sans nom',
      email: co.email || em,
      telephone: co.telephone || co.phone || '',
      commerce: co.activite || co.secteur || co.commerce || '',
      type: co.type || '',
      secteur: co.secteur || co.activite || '',
      isClient: true,
      clientStatus: co.clientStatus || (co.statut === 'inactif' ? 'paused' : 'active'),
      clientSince: co.dateEntree || null,
      // Notes/relances stockées sur le doc coaching pour les virtuels
      lastCsmFollowupAt: co.lastCsmFollowupAt || null,
      lastCsmFollowupBy: co.lastCsmFollowupBy || null,
      csmFollowupHistory: co.csmFollowupHistory || [],
      // Source pour info
      source: 'coaching_only_virtual'
    };
    allClients.push(virtualClient);
  });

  // Re-tri global
  allClients.sort(function(a,b){
    var da = toDate(a.clientSince) || toDate(a.updatedAt) || new Date(0);
    var db_ = toDate(b.clientSince) || toDate(b.updatedAt) || new Date(0);
    return db_ - da;
  });
}

function loadCoachMembers(){
  db.collection('_meta').doc('team_members').get().then(function(snap){
    if(!snap.exists) return;
    var raw = snap.data().members || {};
    var list = Array.isArray(raw)
      ? raw
      : Object.keys(raw).map(function(k){ var v = raw[k]; v.slug = v.slug||k; return v; });
    list.forEach(function(m){
      coachMembersMap[m.slug] = m.shortName || m.displayName || m.fullName || m.slug;
    });
  }).catch(function(){});
}

/* ─── Quota / sessions logic — réplique de coaching.html ─── */
function getMonthlyQuota(programme){
  if(!programme) return 1;
  var p = String(programme).toLowerCase();
  if(p.indexOf('24c') >= 0) return 2;
  if(p.indexOf('12c') >= 0) return 1;
  if(p.indexOf('6c')  >= 0) return 1;
  return 1;
}
function getAllCoachingSessions(coachingDoc){
  if(!coachingDoc) return [];
  if(coachingDoc.years && coachingDoc.years.length){
    var all = [];
    coachingDoc.years.forEach(function(y){ (y.sessions||[]).forEach(function(s){ all.push(s); }); });
    return all;
  }
  return coachingDoc.sessions || [];
}
function getSessionsInMonth(coachingDoc, year, month){
  return getAllCoachingSessions(coachingDoc).filter(function(s){
    if(s.statut !== 'fait' || !s.date) return false;
    if(s.numero === 0 || s.type === 'rdv72h') return false;
    var d = new Date(s.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });
}
function getCoachingQuotaStatus(coachingDoc, year, month){
  if(!coachingDoc) return null;
  var done  = coachingDoc.nbCoachingsFaits || 0;
  var total = coachingDoc.nbCoachingsTotal || 12;
  if(done >= total) return { status:'done', used:0, max:0 };
  var quota = getMonthlyQuota(coachingDoc.programme);
  var sessions = getSessionsInMonth(coachingDoc, year, month);
  var used = sessions.length;
  if(used >= quota)  return { status:'ok', used:used, max:quota };
  if(used > 0)       return { status:'partial', used:used, max:quota };
  return { status:'miss', used:0, max:quota };
}
function getCoachingForLead(lead){
  // Match best-effort par email canonicalisé
  var email = (lead.email || '').toLowerCase().trim();
  if(!email) return null;
  return coachingByEmail[email] || null;
}
function getLastSessionDate(coachingDoc){
  var ss = getAllCoachingSessions(coachingDoc).filter(function(s){
    return s.statut === 'fait' && s.date && s.numero !== 0 && s.type !== 'rdv72h';
  });
  if(!ss.length) return null;
  ss.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
  return new Date(ss[0].date);
}

function loadPaymentsForClients(){
  if(!allClients.length){ renderAll(); return; }
  var ids = allClients.map(function(c){ return c.id; });
  paymentsByLead = {};
  // Chunks de 10 (limite Firestore where-in)
  var chunks = [];
  for(var i = 0; i < ids.length; i += 10) chunks.push(ids.slice(i, i + 10));
  var pending = chunks.length;
  if(pending === 0){ renderAll(); return; }
  chunks.forEach(function(chunk){
    db.collection('payments').where('leadId','in',chunk).get().then(function(sn){
      sn.forEach(function(d){
        var p = d.data(); p.id = d.id;
        if(!paymentsByLead[p.leadId]) paymentsByLead[p.leadId] = [];
        paymentsByLead[p.leadId].push(p);
      });
      if(--pending <= 0){
        // Sort each list by createdAt desc
        Object.keys(paymentsByLead).forEach(function(k){
          paymentsByLead[k].sort(function(a,b){
            return (toDate(b.createdAt)||new Date(0)) - (toDate(a.createdAt)||new Date(0));
          });
        });
        renderAll();
      }
    }).catch(function(e){
      console.warn('Payments chunk error', e);
      if(--pending <= 0) renderAll();
    });
  });
}

function loadTemoignagesForClients(){
  temoByLead = {};
  temoFlat = [];
  if(!allClients.length) return;
  var pending = allClients.length;
  allClients.forEach(function(c){
    db.collection('leads').doc(c.id).collection('client_temoignages')
      .orderBy('createdAt','desc').get()
      .then(function(snap){
        var arr = [];
        snap.forEach(function(d){
          var o = d.data(); o._id = d.id; o._leadId = c.id;
          o._leadName = clientDisplayName(c);
          arr.push(o);
          temoFlat.push(o);
        });
        temoByLead[c.id] = arr;
        if(--pending <= 0){
          temoFlat.sort(function(a,b){
            return (toDate(b.createdAt)||new Date(0)) - (toDate(a.createdAt)||new Date(0));
          });
          renderAll();
        }
      }).catch(function(){
        if(--pending <= 0) renderAll();
      });
  });
}

function loadNotesForLead(leadId, cb){
  // Pour les "coaching only", les notes sont stockées sur le doc clients/{coachingId}
  // dans le tableau csmNotes (pas en sous-collection car les virtuels ne peuvent
  // pas avoir de sous-collection sans doc lead réel).
  var c = allClients.find(function(x){ return x.id === leadId; });
  if(c && c._isCoachingOnly){
    var co = coachingByEmail[(c.email||'').toLowerCase().trim()];
    var arr = (co && co.csmNotes) ? co.csmNotes.slice().sort(function(a,b){
      var da = toDate(a.createdAt) || new Date(0), dbn = toDate(b.createdAt) || new Date(0);
      return dbn - da;
    }) : [];
    notesByLead[leadId] = arr;
    if(cb) cb(arr);
    return;
  }
  // Cas normal (lead réel) : sous-collection client_notes
  db.collection('leads').doc(leadId).collection('client_notes')
    .orderBy('createdAt','desc').get()
    .then(function(snap){
      var arr = [];
      snap.forEach(function(d){ var o = d.data(); o._id = d.id; arr.push(o); });
      notesByLead[leadId] = arr;
      if(cb) cb(arr);
    }).catch(function(){
      notesByLead[leadId] = notesByLead[leadId] || [];
      if(cb) cb(notesByLead[leadId]);
    });
}

/* Helper : retourne {ref, isCoachingOnly} pour router les writes vers la
   bonne collection selon que le client est un vrai lead ou un virtuel
   coaching-only. */
function getClientWriteContext(clientId){
  var c = allClients.find(function(x){ return x.id === clientId; });
  if(c && c._isCoachingOnly){
    return {
      ref: db.collection('clients').doc(c._coachingId),
      isCoachingOnly: true,
      coachingId: c._coachingId,
      client: c
    };
  }
  return {
    ref: db.collection('leads').doc(clientId),
    isCoachingOnly: false,
    client: c
  };
}

/* ─── Rendering ─── */
function renderAll(){
  computeStats();
  if(activeTab === 'retards')      renderRetards();
  else if(activeTab === 'payments')renderPayments();
  else if(activeTab === 'temoignages') renderTemoignages();
  else if(activeTab === 'all')     renderAllClients();
}

function computeStats(){
  var crit = 0, warn = 0, att = 0, active = 0, coachLate = 0;
  allClients.forEach(function(c){
    var status = c.clientStatus || 'active';
    if(status === 'active') active++;
    var lvl = computeLevel(c);
    if(lvl === 'crit') crit++;
    else if(lvl === 'warn') warn++;
    else if(lvl === 'att')  att++;
    // Compteur coaching en retard (au moins 1 mois manqué)
    var coachingDoc = getCoachingForLead(c);
    if(coachingDoc && coachingDoc.statut !== 'inactif'){
      var done  = coachingDoc.nbCoachingsFaits || 0;
      var total = coachingDoc.nbCoachingsTotal || 12;
      if(done < total){
        var nowD = new Date();
        var qNow = getCoachingQuotaStatus(coachingDoc, nowD.getFullYear(), nowD.getMonth());
        if(qNow && qNow.status === 'miss') coachLate++;
      }
    }
  });
  document.getElementById('statCrit').textContent = crit;
  document.getElementById('statWarn').textContent = warn;
  document.getElementById('statAtt').textContent  = att;
  var elCoach = document.getElementById('statCoachLate');
  if(elCoach) elCoach.textContent = coachLate;
  var elTemo = document.getElementById('statTemo');
  if(elTemo) elTemo.textContent = temoFlat.length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('cntRetards').textContent = (crit + warn + att);
  document.getElementById('cntAll').textContent     = allClients.length;
  document.getElementById('cntTemo').textContent    = temoFlat.length;
  // Cnt payments = nombre de paiements totaux
  var totalPay = 0;
  Object.keys(paymentsByLead).forEach(function(k){ totalPay += paymentsByLead[k].length; });
  document.getElementById('cntPay').textContent = totalPay;
}

function searchMatch(c, q){
  if(!q) return true;
  var hay = ((c.nom||'') + ' ' + (c.commerce||'') + ' ' + (c.email||'') + ' ' + (c.telephone||'')).toLowerCase();
  return hay.indexOf(q.toLowerCase()) >= 0;
}

function renderRetards(){
  document.getElementById('toolbarRetards').style.display = '';
  document.getElementById('filterStatus').style.display = '';
  document.getElementById('filterPayStatus').style.display = 'none';
  var _fr = document.getElementById('filterReason'); if(_fr) _fr.style.display = 'none';
  var reasonFilterEl = document.getElementById('filterReason');
  if(reasonFilterEl) reasonFilterEl.style.display = '';
  var body = document.getElementById('csmBody');
  var list = [];
  allClients.forEach(function(c){
    var lvl = computeLevel(c);
    if(!lvl || lvl === 'ok') return;
    if(!levelsActive[lvl]) return;
    if(filterStatus !== 'all' && (c.clientStatus || 'active') !== filterStatus) return;
    if(!searchMatch(c, searchQ)) return;
    c._level = lvl;
    c._reasons = computeReasons(c);
    // Filtre par motif (paiement / coaching / autre)
    if(filterReason && filterReason !== 'all'){
      if(filterReason === 'payment'  && !c._reasons.some(function(r){ return r.kind === 'payment'; })) return;
      if(filterReason === 'coaching' && !c._reasons.some(function(r){ return r.kind === 'coaching'; })) return;
    }
    list.push(c);
  });
  // Sort : crit → warn → att
  var rank = { crit:0, warn:1, att:2 };
  list.sort(function(a,b){ return rank[a._level] - rank[b._level]; });

  if(!list.length){
    body.innerHTML = '<div class="csm-empty"><div class="csm-empty-icon">🎉</div>' +
      '<div class="csm-empty-title">Aucune alerte active</div>' +
      '<div>Tous les clients sont sous contrôle ou hors filtres.</div></div>';
    return;
  }
  var h = '<div class="csm-list">';
  list.forEach(function(c){ h += renderClientCard(c); });
  h += '</div>';
  body.innerHTML = h;
}

/* Calcule la liste des motifs d'alerte pour un client (pour affichage badges
   et filtrage par motif). Distingue paiement vs coaching. */
function computeReasons(c){
  var reasons = [];
  var status = c.clientStatus || 'active';
  if(status === 'procedure'){
    reasons.push({ kind:'payment', level:'crit', label:'⚖️ Procédure' });
  }
  var pays = paymentsByLead[c.id] || [];
  pays.forEach(function(p){
    if(p.status === 'failed'){
      reasons.push({ kind:'payment', level:'crit', label:'❌ Paiement en échec' });
    } else if(p.status === 'cancelled'){
      reasons.push({ kind:'payment', level:'warn', label:'🚫 Paiement annulé' });
    } else if(p.status === 'active' && p.installmentsCount > 1){
      var start = toDate(p.startDate);
      if(start){
        var monthsElapsed = (new Date().getFullYear() - start.getFullYear())*12 + (new Date().getMonth() - start.getMonth()) + 1;
        var expected = Math.min(monthsElapsed, p.installmentsCount);
        var late = expected - (p.paidCount || 0) - 1;
        if(late > 0) reasons.push({ kind:'payment', level:'crit', label:'⚠️ ' + late + ' mois de retard prélèv.' });
      }
    } else if(p.status === 'pending_mandate'){
      var ts = toDate(p.createdAt);
      if(ts && (Date.now() - ts.getTime()) > 7*86400000){
        reasons.push({ kind:'payment', level:'warn', label:'⏳ Mandat non signé +7j' });
      }
    }
  });
  if(status === 'active' && pays.length === 0){
    reasons.push({ kind:'payment', level:'att', label:'💸 Aucun paiement enregistré' });
  }
  if(status === 'paused'){
    reasons.push({ kind:'other', level:'warn', label:'⏸ Compte en pause' });
  }

  // Coaching
  var coachingDoc = getCoachingForLead(c);
  if(coachingDoc && coachingDoc.statut !== 'inactif'){
    var done = coachingDoc.nbCoachingsFaits || 0, total = coachingDoc.nbCoachingsTotal || 12;
    if(done < total){
      var now = new Date();
      var qN = getCoachingQuotaStatus(coachingDoc, now.getFullYear(), now.getMonth());
      var prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
      var qP = getCoachingQuotaStatus(coachingDoc, prev.getFullYear(), prev.getMonth());
      if(qN && qP && qN.status === 'miss' && qP.status === 'miss'){
        reasons.push({ kind:'coaching', level:'crit', label:'🎯 2 mois sans coaching' });
      } else if(qN && qN.status === 'miss'){
        reasons.push({ kind:'coaching', level:'warn', label:'🎯 Pas de coaching ce mois' });
      } else if(qN && qN.status === 'partial'){
        reasons.push({ kind:'coaching', level:'att', label:'🎯 Sous quota mensuel (' + qN.used + '/' + qN.max + ')' });
      }
    }
  }
  return reasons;
}

function renderAllClients(){
  document.getElementById('toolbarRetards').style.display = 'none';
  document.getElementById('filterStatus').style.display = '';
  document.getElementById('filterPayStatus').style.display = 'none';
  var _fr = document.getElementById('filterReason'); if(_fr) _fr.style.display = 'none';
  var body = document.getElementById('csmBody');
  var list = allClients.slice();
  if(filterStatus !== 'all') list = list.filter(function(c){ return (c.clientStatus||'active') === filterStatus; });
  if(searchQ) list = list.filter(function(c){ return searchMatch(c, searchQ); });
  list.forEach(function(c){ c._level = computeLevel(c); });

  if(!list.length){
    body.innerHTML = '<div class="csm-empty"><div class="csm-empty-icon">📋</div><div class="csm-empty-title">Aucun client</div></div>';
    return;
  }
  var h = '<div class="csm-list">';
  list.forEach(function(c){ h += renderClientCard(c); });
  h += '</div>';
  body.innerHTML = h;
}

function renderClientCard(c){
  var lvl = c._level;
  var lvlClass = lvl ? lvl : '';
  var lvlBadge = '';
  if(lvl === 'crit')      lvlBadge = '<span class="csm-badge crit">🔴 Critique</span>';
  else if(lvl === 'warn') lvlBadge = '<span class="csm-badge warn">🟠 Relancer</span>';
  else if(lvl === 'att')  lvlBadge = '<span class="csm-badge att">🟡 Attention</span>';
  else if(lvl === 'ok')   lvlBadge = '<span class="csm-badge ok">✅ OK</span>';

  var status = c.clientStatus || 'active';
  var cs = CLIENT_STATUS[status] || CLIENT_STATUS.active;
  var statusBadge = '<span class="csm-badge ' + cs.cls + '">' + cs.label + '</span>';

  // ───── CELLULE IDENTITÉ ─────
  var initialsTxt = esc(initials(clientDisplayName(c)));
  var nameTxt     = esc(clientDisplayName(c));
  var commerceTxt = c.commerce && c.commerce !== c.nom ? esc(c.commerce) : '';

  var identityCell = '<div class="csm2-id">'
    + '<div class="csm-avatar">' + initialsTxt + '</div>'
    + '<div class="csm2-id-text">'
    + '<div class="csm2-name">' + nameTxt + '</div>'
    + (commerceTxt ? '<div class="csm2-sub">' + commerceTxt + '</div>' : '')
    + '<div class="csm2-badges">' + lvlBadge + statusBadge
    + (c._isCoachingOnly ? '<span class="csm-badge csm-badge-coaching-only" title="Présent dans coaching mais pas dans leads CRM">📚 Coaching only</span>' : '')
    + '</div>'
    + '</div></div>';

  // ───── CELLULE PAIEMENT ─────
  var pays = paymentsByLead[c.id] || [];
  var payCell;
  if(pays.length){
    var totalAmt = 0, paidAmt = 0;
    pays.forEach(function(p){
      if(p.status === 'cancelled') return;
      totalAmt += (p.totalAmount || 0);
      paidAmt  += (p.paidAmount  || 0);
    });
    var nbFailed = pays.filter(function(p){ return p.status === 'failed'; }).length;
    var nbPending = pays.filter(function(p){ return p.status === 'pending_mandate'; }).length;
    var mainPay = pays[0];
    var hasInst = mainPay.installmentsCount > 1;

    // Détection retard de prélèvement (pour 1er paiement actif avec installments)
    var lateMonths = 0;
    var activePay = pays.find(function(p){ return p.status === 'active' && p.installmentsCount > 1; });
    if(activePay){
      var start = toDate(activePay.startDate);
      if(start){
        var monthsElapsed = (new Date().getFullYear() - start.getFullYear())*12 + (new Date().getMonth() - start.getMonth()) + 1;
        var expected = Math.min(monthsElapsed, activePay.installmentsCount);
        lateMonths = Math.max(0, expected - (activePay.paidCount || 0) - 1);
      }
    }

    var payMain = '<span class="csm2-amount">' + fmtEuro(paidAmt) + '</span><span class="csm2-amount-sep">/</span><span class="csm2-amount-total">' + fmtEuro(totalAmt) + '</span>';
    var paySubLabel = '';
    var paySubCls = '';
    if(nbFailed > 0){
      paySubLabel = '❌ ' + nbFailed + ' échec' + (nbFailed>1?'s':'');
      paySubCls = 'crit';
    } else if(lateMonths > 0){
      paySubLabel = '⚠️ ' + lateMonths + ' mois de retard';
      paySubCls = 'crit';
    } else if(nbPending > 0){
      paySubLabel = '⏳ Mandat en attente';
      paySubCls = 'warn';
    } else if(hasInst){
      paySubLabel = (mainPay.paidCount || 0) + '/' + mainPay.installmentsCount + ' échéances';
      paySubCls = 'ok';
    } else if(mainPay.status === 'completed'){
      paySubLabel = '🎉 Soldé';
      paySubCls = 'ok';
    } else {
      paySubLabel = PAY_STATUS[mainPay.status] ? PAY_STATUS[mainPay.status].label : (mainPay.status || '—');
      paySubCls = 'ok';
    }
    payCell = '<div class="csm2-cell csm2-cell-pay">'
      + '<div class="csm2-cell-label">💳 PAIEMENT</div>'
      + '<div class="csm2-cell-main">' + payMain + '</div>'
      + '<div class="csm2-cell-sub ' + paySubCls + '">' + paySubLabel + '</div>'
      + '</div>';
  } else {
    payCell = '<div class="csm2-cell csm2-cell-pay">'
      + '<div class="csm2-cell-label">💳 PAIEMENT</div>'
      + '<div class="csm2-cell-empty">Aucun paiement enregistré</div>'
      + '</div>';
  }

  // ───── CELLULE COACHING ─────
  var coachingDoc = getCoachingForLead(c);
  var coachCell;
  if(coachingDoc){
    var done = coachingDoc.nbCoachingsFaits || 0;
    var total = coachingDoc.nbCoachingsTotal || 12;
    var nowD = new Date();
    var qNow = getCoachingQuotaStatus(coachingDoc, nowD.getFullYear(), nowD.getMonth());
    var prevD = new Date(nowD.getFullYear(), nowD.getMonth()-1, 1);
    var qPrev = getCoachingQuotaStatus(coachingDoc, prevD.getFullYear(), prevD.getMonth());
    var coachSubLabel = '';

    else if(done >= total){ coachSubLabel = '🎉 Programme terminé'; coachSubCls = 'ok'; }
    else if(qNow && qPrev && qNow.status === 'miss' && qPrev.status === 'miss'){ coachSubLabel = '🔴 2 mois sans session'; coachSubCls = 'crit'; }
    else if(qNow && qNow.status === 'miss'){ coachSubLabel = '🟠 Aucune session ce mois'; coachSubCls = 'warn'; }
    else if(qNow && qNow.status === 'partial'){ coachSubLabel = qNow.used + '/' + qNow.max + ' ce mois'; coachSubCls = 'att'; }
    else if(qNow && qNow.status === 'ok'){ coachSubLabel = '✓ Quota mensuel OK'; coachSubCls = 'ok'; }

      + '</div>';

  var followCell = '<div class="csm2-cell csm2-cell-followup">'

function renderPayments(){
  document.getElementById('toolbarRetards').style.display = 'none';
  document.getElementById('filterStatus').style.display = 'none';
  document.getElementById('filterPayStatus').style.display = '';
  var body = document.getElementById('csmBody');

  // ─── Calcul des "échéances" pour chaque paiement actif ────────────────
  // Comme paymentsHistory[] ne contient QUE les prélèvements RÉUSSIS
  // (cf. api/gocardless-status.js), on déduit les états :
  //   - failed / cancelled              → bucket "Échouées"
  //   - active avec paidCount < expected→ bucket "Échouées" (retard)
  //   - pending_mandate                 → bucket "Mandat en attente"
  //   - active avec next dans 7j        → bucket "Prochaines échéances"
  //   - active sans retard et next > 7j → bucket "À jour"
  //   - completed                       → ignoré (soldés, pas critiques)
  //   - draft                           → bucket "À jour" (en cours de création)
  function buildPayItem(c, p){
    var item = { _client: c, _payment: p, bucket: null, nextDueDate: null,
                 monthsLate: 0, expectedCount: 0 };
    if(p.status === 'completed') return null; // soldés exclus de la vue échéances

    if(p.status === 'failed' || p.status === 'cancelled'){
      item.bucket = 'failed'; return item;
    }
    if(p.status === 'pending_mandate'){
      item.bucket = 'pending'; return item;
    }
    if(p.status === 'draft'){
      item.bucket = 'draft'; return item;
    }
    // active / mandate_active : on calcule le retard et la prochaine échéance
    var start = toDate(p.startDate) || toDate(p.createdAt);
    if(!start || !p.installmentsCount || p.installmentsCount <= 1){
      // Paiement en 1 fois : pas de notion d'échéance, classé "à jour"
      item.bucket = 'up'; return item;
    }
    var now = new Date();
    var monthsElapsed = (now.getFullYear() - start.getFullYear())*12 + (now.getMonth() - start.getMonth()) + 1;
    var expected = Math.min(monthsElapsed, p.installmentsCount);
    item.expectedCount = expected;
    var actual = p.paidCount || 0;
    var late = Math.max(0, expected - actual - 1); // tolérance d'1 mois
    item.monthsLate = late;
    // Calcul prochaine échéance théorique : startDate + (paidCount+1) mois
    var next = new Date(start);
    next.setMonth(next.getMonth() + actual);
    if(next < now) next = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    item.nextDueDate = next;
    if(late > 0){ item.bucket = 'failed'; return item; }
    var diffDays = Math.floor((next - now) / 86400000);
    if(diffDays >= 0 && diffDays <= 7){ item.bucket = 'next'; return item; }
    item.bucket = 'up'; return item;
  }

  // Aplatir et bucketiser
  var failed = [], pending = [], next = [], up = [];
  allClients.forEach(function(c){
    (paymentsByLead[c.id] || []).forEach(function(p){
      var item = buildPayItem(c, p);
      if(!item) return;
      // Filtres recherche
      if(searchQ && !searchMatch(c, searchQ)) return;
      if(filterPayStatus !== 'all' && p.status !== filterPayStatus) return;
      if(item.bucket === 'failed')      failed.push(item);
      else if(item.bucket === 'pending') pending.push(item);
      else if(item.bucket === 'next')    next.push(item);
      else                               up.push(item);
    });
  });

  // Sort interne à chaque bucket
  failed.sort(function(a,b){
    // Plus en retard d'abord
    if(b.monthsLate !== a.monthsLate) return b.monthsLate - a.monthsLate;
    return (toDate(b._payment.createdAt)||new Date(0)) - (toDate(a._payment.createdAt)||new Date(0));
  });
  pending.sort(function(a,b){
    return (toDate(a._payment.createdAt)||new Date()) - (toDate(b._payment.createdAt)||new Date());
  });
  next.sort(function(a,b){
    return (a.nextDueDate||new Date()) - (b.nextDueDate||new Date());
  });
  up.sort(function(a,b){
    return (toDate(b._payment.createdAt)||new Date(0)) - (toDate(a._payment.createdAt)||new Date(0));
  });

  if(!failed.length && !pending.length && !next.length && !up.length){
    body.innerHTML = '<div class="csm-empty"><div class="csm-empty-icon">💳</div><div class="csm-empty-title">Aucun paiement</div><div>Ajustez les filtres pour voir plus de résultats.</div></div>';
    return;
  }

  // ─── Render des 4 sections ──────────────────────────────────────────────
  var h = '';
  h += renderPaySection('🔴 Échouées & en retard', 'crit', failed,
       'Prélèvements en échec ou en retard de paiement. Action prioritaire requise.');
  h += renderPaySection('⏳ En attente de mandat', 'warn', pending,
       'Mandat GoCardless pas encore signé par le client.');
  h += renderPaySection('⏰ Prochaines échéances (7 jours)', 'att', next,
       'Prélèvements prévus dans la semaine.');
  h += renderPaySection('✅ À jour', 'ok', up,
       'Paiements en cours sans retard apparent.');
  body.innerHTML = h;
}

/* Helper : rend une section de paiements avec header coloré + toggle collapse */
function renderPaySection(title, kind, items, subtitle){
  if(!items.length) return '';
  var bg = kind === 'crit' ? 'rgba(239,68,68,.08)'
         : kind === 'warn' ? 'rgba(251,146,60,.08)'
         : kind === 'att'  ? 'rgba(250,204,21,.06)'
         : 'rgba(94,234,212,.05)';
  var bd = kind === 'crit' ? 'rgba(239,68,68,.25)'
         : kind === 'warn' ? 'rgba(251,146,60,.25)'
         : kind === 'att'  ? 'rgba(250,204,21,.20)'
         : 'rgba(94,234,212,.20)';
  var col = kind === 'crit' ? 'var(--crit-color)'
          : kind === 'warn' ? 'var(--warn-color)'
          : kind === 'att'  ? 'var(--att-color)'
          : 'var(--csm-accent)';

  var h = '<div style="margin-bottom:18px;border:1px solid ' + bd + ';background:' + bg + ';border-radius:12px;overflow:hidden">';
  h += '<div style="padding:11px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid ' + bd + '">';
  h += '<div style="font-size:14px;font-weight:700;color:' + col + '">' + title + '</div>';
  h += '<div style="background:rgba(255,255,255,0.05);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;color:' + col + '">' + items.length + '</div>';
  if(subtitle){
    h += '<div style="font-size:11px;color:var(--ink-muted);margin-left:auto">' + esc(subtitle) + '</div>';
  }
  h += '</div>';

  h += '<div style="display:flex;flex-direction:column;gap:6px;padding:8px">';
  items.forEach(function(item){
    h += renderPayCard(item, kind);
  });
  h += '</div></div>';
  return h;
}

/* Helper : rend une carte paiement avec contexte échéance */
function renderPayCard(item, kind){
  var c = item._client, p = item._payment;
  var ps = PAY_STATUS[p.status] || { label: p.status||'?', cls:'pay-draft' };
  var prog = '';
  if(p.installmentsCount > 1){
    prog = (p.paidCount || 0) + '/' + p.installmentsCount;
  }
  var pctBar = '';
  if(p.installmentsCount > 1){
    var done = (p.paidCount || 0) / p.installmentsCount;
    pctBar = '<div style="width:60px;height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;margin:0 4px"><div style="height:100%;width:' + Math.round(done*100) + '%;background:' + (kind==='crit'?'var(--crit-color)':'var(--csm-accent)') + '"></div></div>';
  }

  // Contexte spécifique au bucket
  var ctxInfo = '';
  if(item.bucket === 'failed'){
    if(item.monthsLate > 0){
      ctxInfo = '<span class="csm-badge crit" title="Retard estimé à partir de startDate">⚠️ ' + item.monthsLate + ' mois de retard</span>';
    } else if(p.status === 'failed'){
      ctxInfo = '<span class="csm-badge crit">❌ Prélèvement en échec</span>';
    } else if(p.status === 'cancelled'){
      ctxInfo = '<span class="csm-badge muted">🚫 Annulé</span>';
    }
  } else if(item.bucket === 'pending'){
    var createdAt = toDate(p.createdAt);
    var daysOld = createdAt ? Math.floor((Date.now() - createdAt.getTime())/86400000) : null;
    if(daysOld !== null && daysOld > 7){
      ctxInfo = '<span class="csm-badge warn">⏳ Mandat non signé depuis ' + daysOld + ' jours</span>';
    } else {
      ctxInfo = '<span class="csm-badge att">⏳ Mandat en cours de signature</span>';
    }
  } else if(item.bucket === 'next' && item.nextDueDate){
    var diffD = Math.floor((item.nextDueDate - new Date()) / 86400000);
    var lbl = diffD === 0 ? "aujourd'hui" : diffD === 1 ? "demain" : "dans " + diffD + " jours";
    ctxInfo = '<span class="csm-badge att" title="' + fmtDate(item.nextDueDate) + '">⏰ Prochain prélèvement ' + lbl + '</span>';
  }

  var h = '<div class="csm-card" onclick="openClientModal(\'' + c.id + '\')" style="cursor:pointer">';
  h += '<div class="csm-avatar">' + esc(initials(clientDisplayName(c))) + '</div>';
  h += '<div class="csm-card-info">';
  h += '<div class="csm-card-name">' + esc(clientDisplayName(c)) + '<span style="color:var(--ink-muted);font-weight:500;margin-left:8px;font-size:13px">' + fmtEuro(p.totalAmount) + '</span></div>';
  h += '<div class="csm-card-meta">';
  h += '<span class="csm-badge ' + ps.cls + '">' + ps.label + '</span>';
  if(prog) h += '<span title="Progression">📊 ' + prog + pctBar + '</span>';
  if(p.installmentAmount && p.installmentsCount > 1) h += '<span>' + fmtEuro(p.installmentAmount) + '/mois</span>';
  if(p.paiementPlateforme) h += '<span>🏦 ' + esc(p.paiementPlateforme) + '</span>';
  if(ctxInfo) h += ctxInfo;
  h += '</div></div>';
  h += '<div></div>';
  h += '<div class="csm-actions">';
  h += '<a class="csm-act-btn" title="Voir détail paiement" href="payments.html?leadId=' + c.id + '" onclick="event.stopPropagation()" target="_blank">→</a>';
  h += '</div></div>';
  return h;
}

    var nowD = new Date();
    var qN = getCoachingQuotaStatus(coaching, nowD.getFullYear(), nowD.getMonth());
    var subTxt = qN && qN.status === 'miss' ? '🔴 Aucune session ce mois'
               : qN && qN.status === 'partial' ? '🟡 ' + qN.used + '/' + qN.max + ' ce mois'
               : qN && qN.status === 'ok' ? '✓ Quota mensuel OK' : '—';

  // Paiements (synthèse)

    pays.forEach(function(p){ if(p.status !== 'cancelled'){ totalAmt += (p.totalAmount||0); paidAmt += (p.paidAmount||0); } });
    var nbFailed = pays.filter(function(p){ return p.status === 'failed'; }).length;
    var payPct = totalAmt > 0 ? Math.round((paidAmt/totalAmt)*100) : 0;
    var paySubTxt = nbFailed > 0 ? '🔴 ' + nbFailed + ' échec' + (nbFailed>1?'s':'')
                  : pays[0].status === 'pending_mandate' ? '🟠 Mandat en attente'

  if(!kProg || !kProg.byCourse || !Object.keys(kProg.byCourse).length){
