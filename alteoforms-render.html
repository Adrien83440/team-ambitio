<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#f59e0b;--accent-light:rgba(245,158,11,.12);--bg:#0a0a14;--card-bg:#12121e;--text:#f0f0f5;--text-muted:rgba(240,240,245,.45);--border:rgba(255,255,255,.06);--radius:16px;--ease:cubic-bezier(.4,0,.2,1)}
html{background:var(--bg)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* Embed mode: l'iframe parent matche la hauteur du contenu via postMessage,
   donc on désactive le centrage vertical forcé et on coule en flux naturel. */
body.embed-mode{min-height:0;overflow:visible}
body.embed-mode .progress{position:absolute}
/* Progress */
.progress{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.05);z-index:100}
.progress-bar{height:100%;background:var(--accent);transition:width .5s var(--ease);border-radius:0 2px 2px 0}
/* Container — standalone : centrage vertical élégant ; embed : flux naturel */
.form-container{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(20px,4vw,40px) clamp(16px,4vw,32px);
}
body.embed-mode .form-container{
  min-height:0;
  justify-content:flex-start;
  padding:clamp(28px,5vw,48px) clamp(16px,4vw,32px);
}
/* Card wrap : largeur fluide, hauteur animée pour que les transitions
   et le postMessage de hauteur soient précis. */
.card-wrap{
  width:100%;
  max-width:640px;
  position:relative;
  min-height:240px;
  height:auto;
  transition:height .4s var(--ease);
}
.card{position:absolute;top:0;left:0;width:100%;opacity:0;transform:translateY(40px);transition:opacity .45s var(--ease),transform .45s var(--ease);pointer-events:none}
.card.active{opacity:1;transform:translateY(0);pointer-events:auto;position:relative}
.card.exit-up{opacity:0;transform:translateY(-60px)}
.card.exit-down{opacity:0;transform:translateY(60px)}
/* Card content */
.card-num{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-num span{font-size:11px;color:var(--text-muted);font-weight:400}
.card-question{font-size:26px;font-weight:700;line-height:1.35;margin-bottom:8px;letter-spacing:-.3px}
.card-desc{font-size:14px;color:var(--text-muted);margin-bottom:28px;line-height:1.6}
/* Rating field */
.af-rating{display:flex;gap:6px;flex-wrap:wrap}
.af-rating-btn{font-size:28px;cursor:pointer;transition:all .15s;line-height:1;background:none;border:none;padding:4px;border-radius:8px;filter:grayscale(1) opacity(.35)}
.af-rating-btn:hover{transform:scale(1.15)}
.af-rating-btn.active{filter:grayscale(0) opacity(1)}
.af-rating-labels{display:flex;justify-content:space-between;width:100%;margin-top:6px;font-size:11px;color:var(--text-muted)}
/* Page form style */
.page-form{width:100%;max-width:680px;margin:0 auto;padding:20px 0 100px}
.pf-section{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.15);border-radius:14px;padding:24px 28px;margin-bottom:28px}
.pf-section-title{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.pf-field{margin-bottom:24px}
.pf-label{font-size:15px;font-weight:600;color:rgba(240,240,245,.9);margin-bottom:10px;line-height:1.4}
.pf-label .pf-req{color:var(--accent);margin-left:4px}
.pf-desc{font-size:12px;color:rgba(240,240,245,.4);margin-bottom:10px;line-height:1.5}
.pf-field input,.pf-field textarea,.pf-field select{width:100%}
.pf-field .af-options{gap:8px}
.pf-field .af-scale{justify-content:flex-start}
.pf-error{font-size:11px;color:#ef4444;margin-top:6px;display:none}
.pf-field.has-error .pf-error{display:block}
.pf-field.has-error .af-input,.pf-field.has-error .af-textarea,.pf-field.has-error .af-select{border-color:#ef4444}
.pf-submit-wrap{position:fixed;bottom:0;left:0;right:0;padding:16px 24px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center}
.pf-hidden{display:none!important}
/* Progress hidden in page mode */
.page-mode .progress{display:none}

/* Info card */
.card-info-body{font-size:15px;line-height:1.75;color:rgba(240,240,245,.82)}
.card-info-body p{margin-bottom:12px}
.card-info-body p:last-child{margin-bottom:0}
.card-info-body strong,.card-info-body b{font-weight:700;color:#fff}
.card-info-body em,.card-info-body i{font-style:italic}
.card-info-body h1{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:800;margin-bottom:12px;color:#fff;letter-spacing:-.3px}
.card-info-body h2{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;margin-bottom:10px;color:#fff}
.card-info-body ul{list-style:none;padding:0;margin-bottom:14px}
.card-info-body ul li{padding:5px 0 5px 22px;position:relative;color:rgba(240,240,245,.75)}
.card-info-body ul li::before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:700}
.card-info-body ol{padding-left:22px;margin-bottom:14px}
.card-info-body ol li{padding:4px 0;color:rgba(240,240,245,.75);list-style:decimal}
.card-info-body blockquote{border-left:3px solid var(--accent);padding:8px 16px;margin:12px 0;color:rgba(240,240,245,.55);font-style:italic}
.card-info-body a{color:var(--accent);text-decoration:underline}
.card-info-body .info-warning{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:12px 16px;margin:16px 0;font-size:13px;color:rgba(245,158,11,.9)}
.card-info-body .info-signature{margin-top:24px;font-weight:700;color:var(--text);font-size:15px}
.card-info-title{font-size:11px;font-weight:800;color:var(--accent);margin-bottom:18px;text-transform:uppercase;letter-spacing:.8px}
/* Info card scroll for long content */
.card.card-info-type{position:relative;overflow-y:auto;max-height:calc(100vh - 160px);padding-bottom:20px}
body.embed-mode .card.card-info-type{max-height:none;overflow-y:visible}
.card-req{color:var(--accent);font-size:12px;font-weight:600}
/* Inputs */
.af-input{width:100%;padding:16px 18px;background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,.12);color:var(--text);font-family:'DM Sans',sans-serif;font-size:20px;font-weight:500;outline:none;transition:border-color .3s}
.af-input:focus{border-bottom-color:var(--accent)}
.af-input::placeholder{color:rgba(255,255,255,.15)}
.af-textarea{width:100%;padding:16px 18px;background:rgba(255,255,255,.03);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;min-height:120px;resize:vertical;outline:none;transition:border-color .3s}
.af-textarea:focus{border-color:var(--accent)}
/* Options (radio/checkbox) */
.af-options{display:flex;flex-direction:column;gap:8px}
.af-option{display:flex;align-items:center;gap:14px;padding:16px 18px;background:rgba(255,255,255,.03);border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;user-select:none}
.af-option:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
.af-option.selected{border-color:var(--accent);background:var(--accent-light)}
.af-option-marker{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.af-option.selected .af-option-marker{border-color:var(--accent);background:var(--accent)}
.af-option.selected .af-option-marker::after{content:'';width:8px;height:8px;border-radius:50%;background:#000}
.af-option-check .af-option-marker{border-radius:6px}
.af-option-check.selected .af-option-marker::after{content:'✓';font-size:12px;font-weight:800;color:#000;width:auto;height:auto;border-radius:0;background:none}
.af-option-label{font-size:16px;font-weight:500;flex:1}
.af-option-key{font-size:11px;font-weight:700;color:var(--text-muted);padding:2px 8px;border:1px solid rgba(255,255,255,.08);border-radius:4px}
/* Select */
.af-select{width:100%;padding:16px 18px;background:rgba(255,255,255,.03);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;appearance:none;cursor:pointer;transition:border-color .3s}
.af-select:focus{border-color:var(--accent)}
.af-select option{background:var(--card-bg);color:var(--text)}
/* Scale */
.af-scale{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.af-scale-btn{width:56px;height:56px;border-radius:14px;border:1.5px solid var(--border);background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.af-scale-btn:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.af-scale-btn.selected{border-color:var(--accent);background:var(--accent);color:#000}
.af-scale-labels{display:flex;justify-content:space-between;width:100%;margin-top:8px;font-size:11px;color:var(--text-muted)}
/* Navigation — standalone : fixed bottom élégant ; embed : flux naturel */
.nav-bar{position:fixed;bottom:0;left:0;right:0;padding:16px 24px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(transparent,var(--bg) 30%);z-index:50}
body.embed-mode .nav-bar{position:relative;bottom:auto;left:auto;right:auto;padding:24px 16px 8px;background:transparent;width:100%;max-width:640px;margin:8px auto 0}
.nav-btn{padding:12px 28px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px}
.nav-btn-next{background:var(--accent);color:#000}.nav-btn-next:hover{background:#d97706;transform:translateY(-1px)}
.nav-btn-next:disabled{opacity:.3;cursor:not-allowed;transform:none}
.nav-btn-back{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.nav-btn-back:hover{color:var(--text);border-color:rgba(255,255,255,.15)}
.nav-hint{font-size:11px;color:var(--text-muted);position:fixed;bottom:64px;text-align:center;width:100%;pointer-events:none}
body.embed-mode .nav-hint{position:relative;bottom:auto;text-align:center;padding:6px 0 0}
/* Thank you */
.thankyou{text-align:center;animation:fadeUp .6s ease both}
.thankyou-icon{font-size:64px;margin-bottom:20px}
.thankyou-title{font-size:32px;font-weight:800;margin-bottom:12px;letter-spacing:-.5px}
.thankyou-msg{font-size:16px;color:var(--text-muted);line-height:1.6;max-width:400px;margin:0 auto}
/* Loading */
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px}
body:not(.embed-mode) .loading{min-height:100vh;min-height:100dvh}
.loading-spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
/* Error */
.error-page{text-align:center;padding:60px 20px;color:var(--text-muted)}
body.embed-mode .error-page{padding:48px 20px}
/* ─────────────────────────────────────────────
   RESPONSIVE BREAKPOINTS
   Mobile portrait <= 480
   Mobile / petit iframe   <= 640
   Tablet portrait         641 – 900
   Desktop / iPad landscape > 900
   ───────────────────────────────────────────── */
@media(max-width:640px){
  .card-question{font-size:22px;line-height:1.3}
  .card-desc{font-size:13px;margin-bottom:22px}
  .af-input{font-size:18px;padding:14px 14px}
  .af-textarea{font-size:15px;padding:14px 14px}
  .af-option{padding:14px 14px;gap:12px}
  .af-option-label{font-size:15px}
  .af-scale-btn{width:44px;height:44px;font-size:15px;border-radius:10px}
  .af-rating-btn{font-size:24px}
  .nav-btn{padding:11px 22px;font-size:13px}
  .nav-hint{display:none}
  .pf-section{padding:20px 18px}
  .pf-field{margin-bottom:20px}
  .form-container{padding:clamp(16px,4vw,28px) 14px}
  body.embed-mode .form-container{padding:clamp(20px,5vw,32px) 14px}
  .card-wrap{min-height:200px}
}
@media(max-width:480px){
  .card-question{font-size:20px}
  .af-scale-btn{width:38px;height:38px;font-size:13px}
}
@media(min-width:641px) and (max-width:900px){
  /* Tablette portrait + iPad portrait : marges plus généreuses */
  .form-container{padding:clamp(28px,5vw,48px) clamp(24px,4vw,40px)}
  .card-wrap{max-width:600px}
}
@media(min-width:901px){
  /* Desktop + iPad landscape */
  .form-container{padding:clamp(32px,4vw,56px) clamp(24px,4vw,48px)}
  .card-wrap{max-width:640px}
}
/* Très petite hauteur (iframe 700px etc.) en mode embed : compact */
@media(max-height:760px){
  body.embed-mode .form-container{padding-block:clamp(20px,4vw,32px)}
  body.embed-mode .card-question{font-size:21px}
  body.embed-mode .card-desc{margin-bottom:18px}
}
/* ═══ Finir plus tard — brouillons (07/2026) ═══ */
.af-resume-banner{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.28);border-radius:14px;padding:14px 18px;margin-bottom:22px;animation:fadeUp .5s ease both;flex-wrap:wrap}
.af-rb-txt{font-size:14px;font-weight:700}
.af-rb-txt span{display:block;font-size:11px;font-weight:400;color:var(--text-muted);margin-top:2px}
.af-rb-actions{display:flex;gap:8px}
.af-rb-btn{padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.af-rb-btn:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
.af-rb-primary{background:var(--accent);border-color:var(--accent);color:#000}
.af-rb-primary:hover{background:#d97706;border-color:#d97706;color:#000}
.af-save-btn{background:transparent;color:var(--text-muted);border:1px solid var(--border);font-size:13px}
.af-save-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.pf-submit-wrap .af-save-btn{margin-right:10px}
@media(max-width:640px){.af-save-lbl{display:none}.af-save-btn{padding:11px 13px}}
.af-resume-link{font-size:11px;color:var(--text-muted);margin-top:20px;text-align:center;width:100%}
body.page-mode .af-resume-link{padding-bottom:90px}
.af-resume-link a{color:var(--accent);cursor:pointer;text-decoration:underline}
.af-modal-ov{position:fixed;inset:0;background:rgba(5,5,12,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.af-modal{width:100%;max-width:430px;background:var(--card-bg);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:26px 26px 22px;animation:fadeUp .35s ease both}
.af-modal-title{font-size:18px;font-weight:800;margin-bottom:8px;letter-spacing:-.2px}
.af-modal-desc{font-size:13px;color:var(--text-muted);line-height:1.55;margin-bottom:16px}
.af-modal-input{font-size:16px!important}
.af-modal-err{font-size:12px;color:#ef4444;margin-top:8px;display:none}
.af-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.af-modal-done{font-size:14px;line-height:1.65;color:var(--text)}
.af-modal-done .af-md-btn{margin-top:18px}
.af-notice{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--card-bg);border:1px solid rgba(245,158,11,.4);color:var(--text);font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:999px;z-index:210;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:fadeUp .3s ease both;max-width:88vw;text-align:center}
.af-notice-err{border-color:rgba(239,68,68,.45)}
</style>

<div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="form-container" id="formContainer">
<div class="loading" id="loadingView"><div class="loading-spinner"></div><div style="font-size:13px;color:rgba(255,255,255,.3)">Chargement…</div></div>
</div>
<div class="nav-bar" id="navBar" style="display:none">
<button class="nav-btn nav-btn-back" id="btnBack" onclick="goBack()">← Retour</button>
<button class="nav-btn nav-btn-next" id="btnNext" onclick="goNext()">Continuer →</button>
</div>
<div class="nav-hint" id="navHint" style="display:none">Appuyez sur <strong>Entrée ↵</strong> pour continuer</div>

<script>
var db=firebase.firestore();
var FORM=null;
var FIELDS=[];
var CARD_GROUPS=[];
var currentIdx=0;
var answers={};
var submitted=false;

/* ═══════════════════════════════════════════════════════════
   EMBED BRIDGE
   - Détecte le mode iframe (auto via window.parent OU ?embed=1)
   - postMessage de la hauteur du contenu au parent (auto-resize iframe)
   - ResizeObserver + debounce raf pour suivre tous les changements DOM
   - updateCardWrapHeight() : anime la hauteur de .card-wrap vers la card
     active pour que la mesure et les transitions soient nettes
   ═══════════════════════════════════════════════════════════ */
var EMBED={enabled:false,lastHeight:0,raf:null};
(function initEmbedDetection(){
  var qp=new URLSearchParams(window.location.search);
  var inIframe=false;
  try{inIframe=window.parent&&window.parent!==window;}catch(e){inIframe=true;}
  EMBED.enabled=inIframe||qp.get('embed')==='1';
  if(EMBED.enabled){document.body.classList.add('embed-mode');}
})();

function notifyParentHeight(){
  if(!EMBED.enabled)return;
  if(EMBED.raf)cancelAnimationFrame(EMBED.raf);
  EMBED.raf=requestAnimationFrame(function(){
    var h=Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      document.documentElement.offsetHeight
    );
    if(h===EMBED.lastHeight)return;
    EMBED.lastHeight=h;
    try{
      window.parent.postMessage({
        type:'alteoforms:resize',
        formId:(FORM&&FORM._id)||null,
        height:h
      },'*');
    }catch(e){}
  });
}

function updateCardWrapHeight(){
  var wrap=document.getElementById('cardWrap');
  if(!wrap)return;
  var active=wrap.querySelector('.card.active');
  if(!active){wrap.style.height='';return;}
  // .active passe en position:relative dans le CSS donc scrollHeight reflète
  // la hauteur réelle du contenu de la card.
  var h=active.scrollHeight;
  if(h>0)wrap.style.height=h+'px';
  notifyParentHeight();
}

(function setupResizeObserver(){
  if(!EMBED.enabled)return;
  if(typeof ResizeObserver==='undefined')return;
  var ro=new ResizeObserver(function(){notifyParentHeight();});
  // Observer le body — ça couvre tous les changements de contenu
  ro.observe(document.body);
})();

window.addEventListener('resize',function(){
  updateCardWrapHeight();
  notifyParentHeight();
});
window.addEventListener('load',function(){
  setTimeout(notifyParentHeight,100);
});

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ═══ LOAD FORM ═══
(function(){
var params=new URLSearchParams(window.location.search);
var formId=params.get('id');
if(!formId){showError('Aucun formulaire spécifié.');return;}
db.collection('alteo_forms').doc(formId).get().then(function(doc){
if(!doc.exists){showError('Formulaire introuvable.');return;}
FORM=doc.data();FORM._id=doc.id;
if(FORM.status!=='live'&&!params.get('preview')){showError('Ce formulaire n\'est pas encore publié.');return;}
document.title=FORM.title||'Formulaire';
if(FORM.color)document.documentElement.style.setProperty('--accent',FORM.color);
FIELDS=(FORM.fields||[]).filter(function(f){return f.label||f.type==='info';});
if(!FIELDS.length){showError('Ce formulaire ne contient aucun champ.');return;}
document.getElementById('loadingView').style.display='none';

// === FORMAT INFO BODY ===
function formatInfoBody(text){
if(!text)return '';
// Quill HTML: inject directly
if(text.trim().charAt(0)==='<'){return text;}
// Legacy plain text with * bullets
var lines=text.split('\n');
var html='';var inList=false;
lines.forEach(function(line){
var trimmed=line.trim();
if(!trimmed){if(inList){html+='</ul>';inList=false;}return;}

if(trimmed.charAt(0)==='*'&&trimmed.charAt(1)===' '){
if(!inList){html+='<ul>';inList=true;}
html+='<li>'+esc(trimmed.slice(2).trim())+'</li>';
}else if(trimmed.charAt(0)==='\u26a0'||trimmed.indexOf('\u26a0\ufe0f')===0){
if(inList){html+='</ul>';inList=false;}
html+='<div class="info-warning">'+esc(trimmed)+'</div>';
}else if(trimmed.slice(0,6)==='Adrien'||trimmed.slice(0,5)==='Merci'){
if(inList){html+='</ul>';inList=false;}
html+='<div class="info-signature">'+esc(trimmed)+'</div>';
}else{
if(inList){html+='</ul>';inList=false;}
html+='<p>'+esc(trimmed)+'</p>';
}
});
if(inList)html+='</ul>';
return html;
}

function pfGetValue(fieldId){
var el=document.querySelector('[data-fid="'+fieldId+'"]');
if(!el)return '';
if(el.classList.contains('af-options')){
var sel=el.querySelector('.af-option.selected');
return sel?sel.dataset.value:'';
}
if(el.classList.contains('af-scale')){
var selBtn=el.querySelector('.af-scale-btn.selected');
return selBtn?selBtn.dataset.value:'';
}
if(el.classList.contains('af-rating')){
// Rating en mode cumulatif : cliquer la N-ième étoile active TOUTES les
// étoiles 1..N (effet barre). On lit donc la valeur de la DERNIÈRE
// étoile active, pas la première (querySelector renverrait toujours "1").
var actR=el.querySelectorAll('.af-rating-btn.active');
return actR.length?actR[actR.length-1].dataset.value:'';
}
return el.value||'';
}

function pfEvalConditions(){
document.querySelectorAll('.pf-field[data-cond-field]').forEach(function(el){
var depVal=pfGetValue(el.dataset.condField);
var op=el.dataset.condOp||'eq';
var cv=el.dataset.condVal||'';
var show=false;
if(op==='eq')show=String(depVal)===cv;
else if(op==='neq')show=String(depVal)!==cv;
else if(op==='contains')show=String(depVal).toLowerCase().indexOf(cv.toLowerCase())>=0;
else if(op==='lt')show=parseFloat(depVal)<parseFloat(cv);
else if(op==='lte')show=parseFloat(depVal)<=parseFloat(cv);
else if(op==='gt')show=parseFloat(depVal)>parseFloat(cv);
else if(op==='gte')show=parseFloat(depVal)>=parseFloat(cv);
el.classList.toggle('pf-hidden',!show);
});
}

function pfSelectRadio(el){
el.closest('.af-options').querySelectorAll('.af-option').forEach(function(o){o.classList.remove('selected');});
el.classList.add('selected');
pfEvalConditions();
}
function pfToggleCheck(el){el.classList.toggle('selected');pfEvalConditions();}
function pfSelectScale(el){
el.closest('.af-scale').querySelectorAll('.af-scale-btn').forEach(function(b){b.classList.remove('selected');});
el.classList.add('selected');
}

function submitPageForm(){
if(submitted)return;
// Validate required visible fields
var hasError=false;
FIELDS.forEach(function(fld){
if(fld.type==='info')return;
var wrapper=document.querySelector('.pf-field[data-pfid="'+fld.id+'"]');
if(!wrapper||wrapper.classList.contains('pf-hidden'))return;
if(!fld.required)return;
var val=pfGetValue(fld.id);
wrapper.classList.toggle('has-error',!val);
if(!val)hasError=true;
});
if(hasError){
var first=document.querySelector('.pf-field.has-error');
if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
return;
}
// Collect answers
var answersMap={};
FIELDS.forEach(function(fld){
if(fld.type==='info')return;
var wrapper=document.querySelector('.pf-field[data-pfid="'+fld.id+'"]');
if(!wrapper||wrapper.classList.contains('pf-hidden'))return;
var val=pfGetValue(fld.id);
if(val)answersMap[fld.id]=val;
});
submitAnswers(answersMap);
}

// ═══ NAVIGATION ═══
function getVisibleGroups(){
return CARD_GROUPS.filter(function(group){
// A group is visible if at least one field in it is visible
return group.some(function(fld){
if(fld.type==='info')return true;
if(!fld.condition||!fld.condition.fieldId)return true;
var depVal=answers[fld.condition.fieldId];
if(depVal===undefined||depVal===null||depVal==='')return false;
var op=fld.condition.operator||'eq';
var cv=fld.condition.value||'';
if(op==='eq')return String(depVal)===cv;
if(op==='neq')return String(depVal)!==cv;
if(op==='contains')return String(depVal).toLowerCase().indexOf(cv.toLowerCase())>=0;
if(op==='lt')return parseFloat(depVal)<parseFloat(cv);
if(op==='lte')return parseFloat(depVal)<=parseFloat(cv);
if(op==='gt')return parseFloat(depVal)>parseFloat(cv);
if(op==='gte')return parseFloat(depVal)>=parseFloat(cv);
return true;
});
});
}

function showCard(idx){
var visible=getVisibleGroups();
if(idx<0)idx=0;
if(idx>=visible.length)idx=visible.length-1;
currentIdx=idx;

var targetGroup=visible[idx];
var realGIdx=CARD_GROUPS.indexOf(targetGroup);

// Update all cards
document.querySelectorAll('.card').forEach(function(c){
c.classList.remove('active','exit-up','exit-down');
var ci=parseInt(c.dataset.gidx);
if(isNaN(ci))return;
if(ci<realGIdx)c.classList.add('exit-up');
else if(ci>realGIdx)c.classList.add('exit-down');
});

var activeCard=document.getElementById('card-g'+realGIdx);
if(activeCard){
activeCard.classList.add('active');
setTimeout(function(){
var inp=activeCard.querySelector('input,textarea,select');
if(inp&&inp.type!=='date')inp.focus();
},300);
// Recalcule la hauteur de card-wrap pour la nouvelle card active
// + notifie le parent iframe (auto-resize)
requestAnimationFrame(function(){
updateCardWrapHeight();
// Second tick après que le contenu soit peint pour les images/fonts tardives
setTimeout(updateCardWrapHeight,80);
});
}

var pct=((idx+1)/visible.length)*100;
document.getElementById('progressBar').style.width=pct+'%';

document.getElementById('btnBack').style.display=idx>0?'':'none';
var isLast=idx===visible.length-1;
var btn=document.getElementById('btnNext');
var isInfoCard=targetGroup&&targetGroup.length===1&&targetGroup[0].type==='info';
btn.textContent=isLast?(FORM.settings&&FORM.settings.submitLabel||'Envoyer'):(isInfoCard?'Commencer →':'Continuer →');
updateNextBtn();
}

function updateNextBtn(){
var visible=getVisibleGroups();
var group=visible[currentIdx];
if(!group)return;
var btn=document.getElementById('btnNext');
// All required fields in group must have values
var isInfoGroup=group.length===1&&group[0].type==='info';
var allFilled=isInfoGroup||group.every(function(fld){
if(!fld.required)return true;
if(fld.type==='rating'){
var rc=document.querySelector('[data-fid="'+fld.id+'"] .af-rating-btn.active');
return !!rc;
}
var val=answers[fld.id];
return val!==undefined&&val!==null&&val!=='';
});
btn.disabled=!allFilled;
}

function goNext(){
var visible=getVisibleGroups();
var group=visible[currentIdx];
if(!group)return;

// Collect all answers from current card
collectGroupAnswers(group);

// Check required fields (skip for info cards)
var isInfoGroup=group.length===1&&group[0].type==='info';
var missing=!isInfoGroup&&group.find(function(fld){
if(!fld.required)return false;
var val=answers[fld.id];
return !val&&val!==0;
});
if(missing){shakeCard();return;}

if(currentIdx>=visible.length-1){
submitForm();
return;
}
showCard(currentIdx+1);
}

function goBack(){
if(currentIdx>0)showCard(currentIdx-1);
}

function collectGroupAnswers(group){
var realGIdx=CARD_GROUPS.indexOf(group);
var card=document.getElementById('card-g'+realGIdx);
if(!card)return;

group.forEach(function(fld){
if(fld.type==='info')return;
var fidEls=card.querySelectorAll('[data-fid="'+fld.id+'"]');
fidEls.forEach(function(el){
if(fld.type==='radio'){
var sel=el.querySelector('.af-option.selected');
answers[fld.id]=sel?sel.dataset.value:'';
}
else if(fld.type==='checkbox'){
var vals=[];
el.querySelectorAll('.af-option.selected').forEach(function(o){vals.push(o.dataset.value);});
answers[fld.id]=vals.length?vals.join(', '):'';
}
else if(fld.type==='scale'){
var selBtn=el.querySelector('.af-scale-btn.selected');
answers[fld.id]=selBtn?selBtn.dataset.value:'';
}
else if(fld.type==='rating'){
// Cf. pfGetValue : on lit la DERNIÈRE étoile active (la valeur cliquée),
// pas la première (qui serait toujours "1" en mode cumulatif).
var actsRating=el.querySelectorAll('.af-rating-btn.active');
answers[fld.id]=actsRating.length?actsRating[actsRating.length-1].dataset.value:'';
}
else if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'){
answers[fld.id]=el.value;
}
});
});
}

function shakeCard(){
var visible=getVisibleGroups();
var group=visible[currentIdx];
var realGIdx=CARD_GROUPS.indexOf(group);
var card=document.getElementById('card-g'+realGIdx);
if(!card)return;
card.style.animation='shake .4s ease';
setTimeout(function(){card.style.animation='';},400);
}

// ═══ INTERACTIONS ═══
function selectRating(btn){
var container=btn.closest('.af-rating');
var val=parseInt(btn.dataset.value);
container.querySelectorAll('.af-rating-btn').forEach(function(b){
b.classList.toggle('active',parseInt(b.dataset.value)<=val);
});
updateNextBtn();
}
function pfSelectRating(btn){
var container=btn.closest('.af-rating');
var val=parseInt(btn.dataset.value);
container.querySelectorAll('.af-rating-btn').forEach(function(b){
b.classList.toggle('active',parseInt(b.dataset.value)<=val);
});
}

function selectRadio(el){
el.closest('.af-options').querySelectorAll('.af-option').forEach(function(o){o.classList.remove('selected');});
el.classList.add('selected');
var fid=el.closest('[data-fid]').dataset.fid;
answers[fid]=el.dataset.value;
updateNextBtn();
// Auto-advance only if single-field card
var visible=getVisibleGroups();
var group=visible[currentIdx];
if(group&&group.length===1)setTimeout(goNext,350);
}

function toggleCheck(el){
el.classList.toggle('selected');
var container=el.closest('[data-fid]');
var fid=container.dataset.fid;
var vals=[];
container.querySelectorAll('.af-option.selected').forEach(function(o){vals.push(o.dataset.value);});
answers[fid]=vals.join(', ');
updateNextBtn();
}

function selectScale(el){
el.closest('.af-scale').querySelectorAll('.af-scale-btn').forEach(function(b){b.classList.remove('selected');});
el.classList.add('selected');
var fid=el.closest('[data-fid]').dataset.fid;
answers[fid]=el.dataset.value;
updateNextBtn();
var visible=getVisibleGroups();
var group=visible[currentIdx];
if(group&&group.length===1)setTimeout(goNext,350);
}

// Keyboard navigation
document.addEventListener('keydown',function(e){
if(submitted)return;
if(window._afModalOpen)return;
if(e.key==='Enter'&&!e.shiftKey){
e.preventDefault();
goNext();
}
});

// Live collect on input
document.addEventListener('input',function(e){
var inp=e.target;
if(!inp.dataset||!inp.dataset.fid)return;
answers[inp.dataset.fid]=inp.value;
updateNextBtn();
});
document.addEventListener('change',function(e){
var inp=e.target;
if(!inp.dataset||!inp.dataset.fid)return;
answers[inp.dataset.fid]=inp.value;
updateNextBtn();
});

// ═══ SUBMIT ═══
function submitForm(){
if(submitted)return;
// Collect answers from cards
var answersMap={};
var visible=getVisibleGroups();
visible.forEach(function(group){collectGroupAnswers(group);});
FIELDS.forEach(function(fld){if(fld.type!=='info'&&answers[fld.id]!==undefined)answersMap[fld.id]=answers[fld.id];});
submitAnswers(answersMap);
}
function submitAnswers(answersMap){
if(submitted)return;
submitted=true;
draftOnSubmitted();

// ── Mode page : les handlers pfSelect* (radio/check/scale/rating)
//    n'écrivent pas dans la variable globale `answers`. submitPageForm()
//    nous passe un answersMap propre (collecté via pfGetValue), on le merge
//    ici pour que tout le code downstream (ansArr ci-dessous,
//    executePostSubmit contact mapping, doPostActions rules) puisse lire
//    `answers` global comme en mode cards. Sans ce merge, les soumissions
//    en mode page étaient enregistrées avec 0 champs dans Firestore et la
//    sync CRM ne déclenchait jamais.
if(answersMap)Object.keys(answersMap).forEach(function(k){answers[k]=answersMap[k];});

// Collect last answer
var visible=getVisibleGroups();
var lastGroup=visible[currentIdx];
if(lastGroup)collectGroupAnswers(lastGroup);

// Build answers array
var ansArr=FIELDS.map(function(f){
return{fieldId:f.id,label:f.label,type:f.type,value:answers[f.id]||''};
}).filter(function(a){return a.value!=='';});

// Disable nav
var btnNext=document.getElementById('btnNext');
if(btnNext){btnNext.disabled=true;btnNext.textContent='Envoi…';}

// Save to Firestore THEN redirect
db.collection('alteo_forms').doc(FORM._id).collection('responses').add({
answers:ansArr,
answersMap:answers,
submittedAt:firebase.firestore.FieldValue.serverTimestamp(),
userAgent:navigator.userAgent
}).then(function(){
// Increment response count (fire & forget)
db.collection('alteo_forms').doc(FORM._id).update({
responseCount:firebase.firestore.FieldValue.increment(1)
}).catch(function(){});

// Now evaluate rules and redirect
executePostSubmit();
}).catch(function(e){
console.error('Erreur soumission:',e);
// Redirect anyway to not block user
executePostSubmit();
});
}

function executePostSubmit(){
var settings=FORM.settings||{};
var fields=FORM.fields||[];

// Extract contact data from mapped fields
var contact={prenom:'',nom:'',email:'',telephone:''};
fields.forEach(function(f){
if(f.contactMapping&&answers[f.id]){
contact[f.contactMapping]=answers[f.id];
}
});

// Sync CRM gouvernée par les toggles du builder (par formulaire) :
//  - settings.createLead         → si lead existant trouvé (par email/tel),
//                                   on update sa fiche avec les réponses du form
//  - settings.createLeadIfMissing → si pas de lead trouvé, on en crée UN
//                                   nouveau "form sans RDV" (opt-in explicit
//                                   pour éviter de polluer le CRM sur les
//                                   formulaires où on ne le souhaite pas).
// Le _id du lead remonté est ensuite passé à booking.html en URL,
// ce qui permet à onBookingCreated de faire évoluer le même lead
// (pas de doublon) si le prospect prend finalement un créneau.
if(settings.createLead&&(contact.email||contact.telephone)){
findAndUpdateLead(contact,function(leadData){
doPostActions(settings,contact,leadData);
});
}else{
doPostActions(settings,contact,null);
}
}

function doPostActions(settings,contact,leadData){
// Build booking URL params
var _bkParams='&fromForm='+FORM._id;
// Propage le mode embed vers booking.html. Quand ce formulaire tourne dans
// une iframe (tunnel intégré sur la VSL), booking.html — chargé dans la MÊME
// iframe lors de la redirection — doit le savoir pour : (1) afficher sa mise
// en page compacte sans branding, et surtout (2) rediriger l'ONGLET du
// visiteur (window.top) vers la page de confirmation personnalisée à la fin
// du RDV, et non la seule iframe. Sans ce marqueur, booking.html se croit en
// plein écran et la page de confirmation s'affiche coincée dans le cadre.
if(EMBED.enabled)_bkParams+='&embed=1';
if(contact.prenom)_bkParams+='&prenom='+encodeURIComponent(contact.prenom);
if(contact.nom)_bkParams+='&nom='+encodeURIComponent(contact.nom);
if(contact.email)_bkParams+='&email='+encodeURIComponent(contact.email);
if(contact.telephone)_bkParams+='&tel='+encodeURIComponent(contact.telephone);
// Force the assigned closer only
if(leadData&&leadData.assignedTo)_bkParams+='&person='+encodeURIComponent(leadData.assignedTo);
if(leadData&&leadData._id)_bkParams+='&leadId='+encodeURIComponent(leadData._id);

// Evaluate rules
var rules=FORM.rules||[];
var matchedRule=null;
for(var ri=0;ri<rules.length;ri++){
var rule=rules[ri];
var conds=rule.conditions||[];
if(!conds.length)continue;
var logic=rule.logic||'or';
var results=conds.map(function(c){
var val=answers[c.fieldId];
if(val===undefined||val===null)val='';
val=String(val);
var cv=c.value||'';
if(c.operator==='eq')return val===cv;
if(c.operator==='neq')return val!==cv;
if(c.operator==='contains')return val.toLowerCase().indexOf(cv.toLowerCase())>=0;
if(c.operator==='gte')return parseFloat(val)>=parseFloat(cv);
if(c.operator==='lte')return parseFloat(val)<=parseFloat(cv);
return false;
});
var match=logic==='and'?results.every(Boolean):results.some(Boolean);
if(match){matchedRule=rule;break;}
}

// Execute matched rule action
if(matchedRule){
if(matchedRule.action==='redirect'&&matchedRule.actionValue){
window.location.href=matchedRule.actionValue;return;
}
if(matchedRule.action==='booking'&&matchedRule.actionValue){
window.location.href='booking.html?type='+matchedRule.actionValue+_bkParams;return;
}
if(matchedRule.action==='message'&&matchedRule.actionValue){
showThankYou(matchedRule.actionValue);return;
}
}

// Default: settings-based behavior
if(settings.linkedBookingType){
window.location.href='booking.html?type='+settings.linkedBookingType+_bkParams;
return;
}
if(settings.redirectUrl){
window.location.href=settings.redirectUrl;
return;
}
showThankYou(settings.thankYouMessage||'Merci pour vos réponses !');
}

// ─────────────────────────────────────────────────────────────────────────
//  Délégation backend : tout le pattern find / update / create / résurrection
//  est désormais orchestré par /api/alteoform-submit (Vercel Function avec
//  Admin SDK). Voir l'en-tête de ce fichier pour le pourquoi.
//
//  En résumé :
//   - Les rules Firestore /leads interdisent l'update aux non-authentifiés.
//     Avant ce changement, updateLeadWithForm échouait silencieusement pour
//     tous les vrais prospects (seul un admin connecté pouvait l'exécuter).
//   - Le pattern résurrection (lastOptinAt + timeline orange) qui faisait
//     défaut côté flux AlteoForm est maintenant câblé : un re-passage sur
//     un lead existant fait remonter la carte en haut de Lead Live avec
//     le badge "🔄 Déjà CRM", popup et son — exactement comme un webhook.
// ─────────────────────────────────────────────────────────────────────────
function findAndUpdateLead(contact, callback) {
  // Mode preview : test admin depuis le builder, on ne touche pas au CRM
  var qp = new URLSearchParams(window.location.search);
  if (qp.get('preview')) { callback(null); return; }

  // Snapshot des réponses au moment de l'envoi (la map brute, le backend
  // se charge de reconstituer le tableau enrichi via les fields du form).
  var payload = {
    formId: FORM._id,
    contact: contact,
    answers: answers
  };

  fetch('/api/alteoform-submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (out) {
      if (out.status !== 200 || !out.body || out.body.ok !== true) {
        console.error('[alteoform-submit] non-ok response:', out.status, out.body);
        callback(null); return;
      }
      var data = out.body;
      // skipped = pas de lead trouvé/créé → on continue le flow sans leadId.
      // updated/created → on remonte _id + assignedTo pour le routing
      // booking (doPostActions injecte ces deux champs dans l'URL).
      if (data.action === 'skipped' || !data.leadId) { callback(null); return; }
      callback({ _id: data.leadId, assignedTo: data.assignedTo || '' });
    })
    .catch(function (e) {
      console.error('[alteoform-submit] network error:', e);
      callback(null);
    });
}

function showThankYou(msg){
var ty=document.getElementById('card-thankyou');
if(ty){
// ── Mode cards (Typeform-style) ─────────────────────────────
document.querySelectorAll('.card').forEach(function(c){c.classList.remove('active');c.classList.add('exit-up');});
var msgEl=ty.querySelector('.thankyou-msg');
if(msgEl)msgEl.textContent=msg;
ty.classList.add('active');

}
setTimeout(notifyParentHeight,50);
}
}

/* ═══════════════════════════════════════════════════════════
   FINIR PLUS TARD — sauvegarde & reprise de brouillon (07/2026)
   - Auto-save localStorage (même appareil), debounce 600 ms
   - Bouton « 💾 Finir plus tard » → email → lien magique via
     POST /api/alteoform-draft (Admin SDK ; collection
     alteo_forms/{id}/drafts, invisible côté client anonyme)
   - Reprise : ?draft={token} (tout appareil) ou bannière locale
   - « Reprendre par email » : RENVOIE le lien à l'adresse saisie
     — jamais de chargement direct par email seul (sinon
     n'importe qui pourrait lire les réponses d'autrui)
   - Désactivable par formulaire : settings.allowDraft === false
   - Preview builder : totalement inerte
   ═══════════════════════════════════════════════════════════ */
var DRAFT={enabled:false,id:null,email:'',saveTimer:null,localKey:null,preview:false};

function draftApi(payload){
return fetch('/api/alteoform-draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.json();});
}

// Snapshot des réponses courantes — lecture DOM via pfGetValue, qui gère
// tous les types de champs et marche dans les DEUX modes (cards et page).
function buildCurrentAnswers(){
var map={};
FIELDS.forEach(function(f){
if(f.type==='info')return;
var v;
if(f.type==='checkbox'){
// pfGetValue ne renvoie que la PREMIÈRE option sélectionnée : pour les
// checkbox on rejoint toutes les valeurs par ', ' (même format que
// toggleCheck / la collecte page mode).
var el=document.querySelector('[data-fid="'+f.id+'"]');
var vals=[];
if(el)el.querySelectorAll('.af-option.selected').forEach(function(o){vals.push(o.dataset.value);});
v=vals.join(', ');
}else{
v=pfGetValue(f.id);
}
if(v===undefined||v===null||v==='')return;
map[f.id]=String(v);
});
return map;
}

function initDraftFeature(params){
if(!FORM)return;
DRAFT.localKey='af_draft_'+FORM._id;
DRAFT.preview=!!params.get('preview');
DRAFT.enabled=(!FORM.settings||FORM.settings.allowDraft!==false)&&!DRAFT.preview;
if(!DRAFT.enabled)return;
injectDraftUi();
// Écouteurs additifs (aucun handler existant modifié) : couvrent la saisie
// texte des deux modes + tous les clics option/échelle/rating.
document.addEventListener('input',draftActivity);
document.addEventListener('change',draftActivity);
document.addEventListener('click',function(e){
var t=e.target;
if(!t||!t.closest)return;
if(t.closest('.af-option')||t.closest('.af-scale-btn')||t.closest('.af-rating-btn'))draftActivity();
});
var urlDraft=params.get('draft');
if(urlDraft){loadServerDraft(urlDraft);return;}
var local=readLocalDraft();
if(local)showResumeBanner(local);
}

function draftActivity(){
if(!DRAFT.enabled||submitted)return;
scheduleDraftSave();
updateSaveBtnVisibility();
}

function scheduleDraftSave(){
if(DRAFT.saveTimer)clearTimeout(DRAFT.saveTimer);
DRAFT.saveTimer=setTimeout(writeLocalDraft,600);
}

function writeLocalDraft(){
if(!DRAFT.enabled||submitted)return;
try{
var map=buildCurrentAnswers();
if(!Object.keys(map).length)return;
localStorage.setItem(DRAFT.localKey,JSON.stringify({v:1,formId:FORM._id,answers:map,updatedAt:Date.now(),draftId:DRAFT.id||null,email:DRAFT.email||''}));
}catch(e){}
}

function readLocalDraft(){
try{
var raw=localStorage.getItem(DRAFT.localKey);
if(!raw)return null;
var d=JSON.parse(raw);
if(!d||!d.answers)return null;
// Même durée de vie que le brouillon serveur : 60 jours.
if(d.updatedAt&&(Date.now()-d.updatedAt)>60*86400000){localStorage.removeItem(DRAFT.localKey);return null;}
d.count=Object.keys(d.answers).length;
return d.count>0?d:null;
}catch(e){return null;}
}

function clearLocalDraft(){try{if(DRAFT.localKey)localStorage.removeItem(DRAFT.localKey);}catch(e){}}

// Appelé par submitAnswers() : purge locale + consommation du brouillon
// serveur (fire & forget — la soumission n'attend jamais cet appel).
function draftOnSubmitted(){
if(DRAFT.saveTimer)clearTimeout(DRAFT.saveTimer);
clearLocalDraft();
if(DRAFT.id&&FORM){
try{draftApi({action:'consume',formId:FORM._id,draftId:DRAFT.id}).catch(function(){});}catch(e){}
}
}

function updateSaveBtnVisibility(){
if(!DRAFT.enabled)return;
var show=!submitted&&Object.keys(buildCurrentAnswers()).length>0;
var b1=document.getElementById('afSaveBtn');
var b2=document.getElementById('afSaveBtnPage');
if(b1)b1.style.display=show?'':'none';
if(b2)b2.style.display=show?'':'none';
}

// Pré-remplissage de l'email du modal : champ mappé contact email, sinon
// premier champ de type email déjà renseigné.
function guessDraftEmail(){
if(DRAFT.email)return DRAFT.email;
var map=buildCurrentAnswers();
var best='';
FIELDS.forEach(function(f){
if(best)return;
var v=map[f.id];
if(!v)return;
if(f.contactMapping==='email'||f.type==='email')best=v;
});
return best;
}

var _afModalMode='save';
function openDraftModal(mode){
_afModalMode=mode||'save';
var ov=document.getElementById('afDraftModal');
if(!ov)return;
window._afModalOpen=true;
document.getElementById('afDmFormZone').style.display='';
document.getElementById('afDmDone').style.display='none';
var err=document.getElementById('afDmErr');err.style.display='none';err.textContent='';
var inp=document.getElementById('afDmEmail');
var send=document.getElementById('afDmSend');
send.disabled=false;
if(_afModalMode==='resend'){
document.getElementById('afDmTitle').textContent='🔁 Reprendre une sauvegarde';
document.getElementById('afDmDesc').textContent='Entrez l\'email utilisé lors de votre sauvegarde. Si une sauvegarde existe, nous vous renverrons votre lien de reprise.';
send.textContent='Renvoyer mon lien';
inp.value=DRAFT.email||'';
}else{
document.getElementById('afDmTitle').textContent='💾 Finir plus tard';
document.getElementById('afDmDesc').textContent='Recevez un lien par email pour reprendre ce formulaire exactement où vous en êtes, depuis n\'importe quel appareil. Le lien est valable 60 jours.';
send.textContent='Recevoir mon lien';
inp.value=guessDraftEmail();
}
ov.style.display='flex';
setTimeout(function(){try{inp.focus();}catch(e){}},80);
}

function closeDraftModal(){
var ov=document.getElementById('afDraftModal');
if(ov)ov.style.display='none';
window._afModalOpen=false;
}

function sendDraftModal(){
var inp=document.getElementById('afDmEmail');
var err=document.getElementById('afDmErr');
var send=document.getElementById('afDmSend');
var email=(inp.value||'').trim();
if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
err.textContent='Adresse email invalide.';err.style.display='block';return;
}
err.style.display='none';
send.disabled=true;send.textContent='Envoi…';
var payload;
if(_afModalMode==='resend'){
payload={action:'resend',formId:FORM._id,email:email};
}else{
payload={action:'save',formId:FORM._id,email:email,draftId:DRAFT.id||null,answers:buildCurrentAnswers()};
}
draftApi(payload).then(function(r){
if(_afModalMode==='resend'){
// Réponse volontairement neutre (anti-énumération d'emails).
showDraftDone('📩 Si une sauvegarde existe pour <strong>'+esc(email)+'</strong>, votre lien de reprise vient d\'être renvoyé. Pensez à vérifier vos spams.');
return;
}
if(!r||r.ok!==true){
send.disabled=false;send.textContent='Recevoir mon lien';
err.textContent=(r&&r.error==='draft_disabled')?'La sauvegarde n\'est pas activée sur ce formulaire.':'Impossible de sauvegarder pour le moment. Réessayez.';
err.style.display='block';
return;
}
DRAFT.id=r.draftId||DRAFT.id;
DRAFT.email=email;
writeLocalDraft();
if(r.emailSent){
showDraftDone('📩 Lien envoyé à <strong>'+esc(email)+'</strong>.<br/>Vous pouvez fermer cette page — ou continuer maintenant, votre progression est sauvegardée.');
}else if(r.emailReason==='cooldown'){
showDraftDone('💾 Progression mise à jour ! Le lien déjà reçu par email reste valable — il ouvrira toujours votre dernière version.');
}else{
showDraftDone('💾 Progression sauvegardée, mais l\'email n\'a pas pu partir. Réessayez dans un instant via « Finir plus tard ».');
}
}).catch(function(){
send.disabled=false;
send.textContent=_afModalMode==='resend'?'Renvoyer mon lien':'Recevoir mon lien';
err.textContent='Erreur réseau. Vérifiez votre connexion et réessayez.';
err.style.display='block';
});
}

function showDraftDone(html){
document.getElementById('afDmFormZone').style.display='none';
var d=document.getElementById('afDmDone');
d.innerHTML=html+'<div><button type="button" class="nav-btn nav-btn-next af-md-btn" onclick="closeDraftModal()">Continuer</button></div>';
d.style.display='block';
}

/* ── Restauration ── */
function restoreAnswers(map){
if(!map)return;
Object.keys(map).forEach(function(k){answers[k]=map[k];});
FIELDS.forEach(function(f){
if(f.type==='info')return;
var v=map[f.id];
if(v===undefined||v===null||v==='')return;
v=String(v);
var el=document.querySelector('[data-fid="'+f.id+'"]');
if(!el)return;
if(el.classList.contains('af-options')){
// Checkbox : valeurs jointes par ', ' (même format que la collecte).
var vals=f.type==='checkbox'?v.split(', '):[v];
el.querySelectorAll('.af-option').forEach(function(o){
o.classList.toggle('selected',vals.indexOf(o.dataset.value)>=0);
});
}else if(el.classList.contains('af-scale')){
el.querySelectorAll('.af-scale-btn').forEach(function(b){b.classList.toggle('selected',b.dataset.value===v);});
}else if(el.classList.contains('af-rating')){
var n=parseInt(v)||0;
el.querySelectorAll('.af-rating-btn').forEach(function(b){b.classList.toggle('active',parseInt(b.dataset.value)<=n);});
}else{
el.value=v;
}
});
if(document.body.classList.contains('page-mode')){
pfEvalConditions();
}else{
jumpToFirstUnanswered();
}
updateSaveBtnVisibility();
scheduleDraftSave();
setTimeout(notifyParentHeight,80);
}

// Mode cards : saute à la première carte visible contenant un champ vide
// (conditions recalculées depuis `answers`) ; sinon dernière carte.
function jumpToFirstUnanswered(){
var visible=getVisibleGroups();
if(!visible.length)return;
var idx=visible.length-1;
for(var i=0;i<visible.length;i++){
var hasEmpty=visible[i].some(function(f){
if(f.type==='info')return false;
var v=answers[f.id];
return v===undefined||v===null||v==='';
});
if(hasEmpty){idx=i;break;}
}
showCard(idx);
}

function loadServerDraft(token){
draftApi({action:'load',formId:FORM._id,draftId:token}).then(function(r){
if(r&&r.ok===true){
DRAFT.id=token;
if(r.email)DRAFT.email=r.email;
restoreAnswers(r.answers||{});
hideResumeBanner();
showDraftNotice('✅ Sauvegarde restaurée — reprenez où vous en étiez.');
}else if(r&&r.error==='expired'){
showDraftNotice('⏳ Cette sauvegarde a expiré (60 jours). Le formulaire repart de zéro.',true);
}else{
showDraftNotice('Cette sauvegarde est introuvable ou a déjà été envoyée.',true);
}
}).catch(function(){
showDraftNotice('Impossible de charger la sauvegarde (réseau).',true);
});
}

function showResumeBanner(local){
if(document.getElementById('afResumeBanner'))return;
var when='';
try{when=new Date(local.updatedAt).toLocaleDateString('fr-FR');}catch(e){}
var b=document.createElement('div');
b.className='af-resume-banner';b.id='afResumeBanner';
b.innerHTML='<div class="af-rb-txt">💾 Reprendre où vous en étiez ?<span>'+local.count+' réponse'+(local.count>1?'s':'')+(when?' · sauvegardé le '+when:'')+'</span></div>'
+'<div class="af-rb-actions"><button type="button" class="af-rb-btn af-rb-primary" id="afRbResume">Reprendre</button><button type="button" class="af-rb-btn" id="afRbReset">Recommencer</button></div>';
var fc=document.getElementById('formContainer');
if(!fc)return;
fc.insertBefore(b,fc.firstChild);
document.getElementById('afRbResume').onclick=function(){
if(local.draftId)DRAFT.id=local.draftId;
if(local.email)DRAFT.email=local.email;
restoreAnswers(local.answers);
hideResumeBanner();
};
document.getElementById('afRbReset').onclick=function(){
clearLocalDraft();
hideResumeBanner();
};
setTimeout(notifyParentHeight,60);
}

function hideResumeBanner(){
var b=document.getElementById('afResumeBanner');
if(b&&b.parentNode)b.parentNode.removeChild(b);
setTimeout(notifyParentHeight,60);
}

function showDraftNotice(msg,isErr){
var n=document.createElement('div');
n.className='af-notice'+(isErr?' af-notice-err':'');
n.textContent=msg;
document.body.appendChild(n);
setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n);},4500);
}

// Shake animation
var style=document.createElement('style');
style.textContent='@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}';
document.head.appendChild(style);
</script>
</body>
</html>
