var db = firebase.firestore();
var allLeads = [];
var matchResults = []; // {base, matchedLead, matchType}

function normalize(s) {
  return (s || '').toLowerCase().replace(/[^a-zàâäéèêëïîôùûüÿçœæ\s]/gi, '').replace(/\s+/g, ' ').trim();
}

function log(msg) {
  var el = document.getElementById('log');
  el.style.display = 'block';
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

firebase.auth().onAuthStateChanged(function(user) {
  if (!user) { setStatus('❌ Non connecté — ouvrez login.html d\'abord', 'err'); return; }
  setStatus('⏳ Chargement des leads…', 'info');
  db.collection('leads').get().then(function(snap) {
    allLeads = [];
    snap.forEach(function(doc) { var d = doc.data(); d.id = doc.id; allLeads.push(d); });
    setStatus('✅ ' + allLeads.length + ' leads chargés. Prêt pour la prévisualisation.', 'ok');
    document.getElementById('btnPreview').disabled = false;
  }).catch(function(err) {
    setStatus('❌ Erreur : ' + err.message, 'err');
  });
});

function findMatch(clientName) {
  var norm = normalize(clientName);
  var parts = norm.split(' ').filter(function(p) { return p.length > 2; });
  var bestMatch = null;
  var bestScore = 0;

  allLeads.forEach(function(lead) {
    var leadNorm = normalize(lead.nom || '');
    // Exact match
    if (leadNorm === norm) { bestMatch = lead; bestScore = 100; return; }
    // All parts match
    var score = 0;
    parts.forEach(function(p) { if (leadNorm.indexOf(p) >= 0) score++; });
    var pct = parts.length > 0 ? (score / parts.length) * 100 : 0;
    if (pct > bestScore && pct >= 60) { bestScore = pct; bestMatch = lead; }
  });
  return { lead: bestMatch, score: bestScore };
}

function countTemos(base) {
  var count = 0;
  ['trustpilot','video','autre_temoignage','temoignage_supp1','temoignage_supp2','temoignage_supp3','temoignage_supp4'].forEach(function(k) {
    if (base[k] && base[k].trim()) count++;
  });
  return count;
}

function runPreview() {
  matchResults = [];
  BASE_CLIENTS.forEach(function(base) {
    var result = findMatch(base.client);
    matchResults.push({
      base: base,
      matchedLead: result.lead,
      matchScore: result.score,
      matchType: result.lead ? (result.score === 100 ? 'exact' : 'partial') : 'none'
    });
  });

  var matched = matchResults.filter(function(r) { return r.matchType !== 'none'; }).length;
  var unmatched = matchResults.length - matched;

  var h = '<table><thead><tr><th>#</th><th>Client (ancien)</th><th>Match</th><th>Lead Firestore</th><th>Score</th><th>Commerce</th><th>Début</th><th>Tém.</th></tr></thead><tbody>';
  matchResults.forEach(function(r, i) {
    var cls = r.matchType === 'exact' ? 'match' : r.matchType === 'partial' ? 'nomatch' : 'new';
    var label = r.matchType === 'exact' ? '✅ Exact' : r.matchType === 'partial' ? '🟡 Partiel' : '🆕 Nouveau';
    h += '<tr>';
    h += '<td>' + (i + 1) + '</td>';
    h += '<td><strong>' + (r.base.client || '—') + '</strong></td>';
    h += '<td class="' + cls + '">' + label + '</td>';
    h += '<td>' + (r.matchedLead ? r.matchedLead.nom + ' <span style="color:rgba(255,255,255,0.3);font-size:10px">(' + r.matchedLead.id.slice(0, 8) + '…)</span>' : '—') + '</td>';
    h += '<td>' + (r.matchScore > 0 ? r.matchScore + '%' : '—') + '</td>';
    h += '<td style="color:rgba(255,255,255,0.5)">' + (r.base.commerce || '—') + '</td>';
    h += '<td style="color:rgba(255,255,255,0.5)">' + (r.base.date_debut || '—') + '</td>';
    h += '<td><span class="temo-count">' + countTemos(r.base) + '</span></td>';
    h += '</tr>';
  });
  h += '</tbody></table>';
  h += '<div style="color:rgba(255,255,255,0.5);font-size:12px;margin-top:8px">✅ ' + matched + ' matchés · 🆕 ' + unmatched + ' nouveaux leads à créer</div>';
  document.getElementById('tableWrap').innerHTML = h;
  document.getElementById('btnMigrate').disabled = false;
  setStatus('👁 Prévisualisation prête — ' + matched + ' matchés, ' + unmatched + ' à créer', 'ok');
}

async function runMigrate() {
  if (!confirm('Lancer la migration de ' + matchResults.length + ' clients ? Cette action enrichira les leads existants et créera les nouveaux.')) return;
  document.getElementById('btnMigrate').disabled = true;
  setStatus('⏳ Migration en cours…', 'info');
  log('=== MIGRATION START ===');

  var success = 0, errors = 0;

  for (var i = 0; i < matchResults.length; i++) {
    var r = matchResults[i];
    var base = r.base;
    try {
      var clientFields = {
        isClient: true,
        clientSince: firebase.firestore.FieldValue.serverTimestamp(),
        commerce: base.commerce || '',
        problematique: base.problematique || '',
        pbSecondaires: base.pb_secondaires || '',
        resultats: base.resultats || '',
        accompagnementDebut: base.date_debut || '',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      // Calculate accompagnementFin from temporalite
      if (base.date_debut && base.temporalite && !isNaN(parseInt(base.temporalite))) {
        var weeks = parseInt(base.temporalite);
        var d = new Date(base.date_debut);
        if (!isNaN(d.getTime())) {
          d.setDate(d.getDate() + weeks * 7);
          clientFields.accompagnementFin = d.toISOString().split('T')[0];
        }
      }

      var leadId;
      if (r.matchedLead) {
        // Update existing lead
        leadId = r.matchedLead.id;
        await db.collection('leads').doc(leadId).update(clientFields);
        log('✅ [' + (i+1) + '] ENRICHI: ' + base.client + ' → ' + leadId);
      } else {
        // Create new lead
        clientFields.nom = base.client || '';
        clientFields.stage = 'closed_won_setting';
        clientFields.status = 'rdv_pose';
        clientFields.source = 'migration_suivi_client';
        clientFields.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        var docRef = await db.collection('leads').add(clientFields);
        leadId = docRef.id;
        log('🆕 [' + (i+1) + '] CRÉÉ: ' + base.client + ' → ' + leadId);
      }

      // Create témoignage sub-docs
      var temoFields = [
        {key: 'trustpilot', type: 'trustpilot'},
        {key: 'video', type: 'video'},
        {key: 'autre_temoignage', type: 'autre'},
        {key: 'temoignage_supp1', type: 'autre'},
        {key: 'temoignage_supp2', type: 'autre'},
        {key: 'temoignage_supp3', type: 'autre'},
        {key: 'temoignage_supp4', type: 'autre'}
      ];
      var temoCount = 0;
      for (var t = 0; t < temoFields.length; t++) {
        var url = (base[temoFields[t].key] || '').trim();
        if (url) {
          await db.collection('leads').doc(leadId).collection('client_temoignages').add({
            type: temoFields[t].type,
            url: url,
            label: '',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          temoCount++;
        }
      }
      if (temoCount > 0) log('   ⭐ ' + temoCount + ' témoignage(s) migrés');
      success++;
    } catch (err) {
      log('❌ [' + (i+1) + '] ERREUR ' + base.client + ': ' + err.message);
      errors++;
    }
  }

  log('=== MIGRATION TERMINÉE: ' + success + ' OK, ' + errors + ' erreurs ===');
  setStatus('✅ Migration terminée — ' + success + ' clients migrés' + (errors > 0 ? ', ' + errors + ' erreurs' : ''), errors > 0 ? 'err' : 'ok');
}
</script>
</body>
</html>
