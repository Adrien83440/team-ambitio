<style>
/* ═══════════════════════════════════════════════════════════════════════
   aide.html — Aide Team (14/10/2026)
   Catalogue des fiches pratiques (recherche, catégories, « Montre-moi ») +
   l'assistant IA monté dans la page (aide-widget.js, AideTeam.mountInline).
   Rôles : sales + admin. Données : api/aide-ask (catalog / ask).
   ═══════════════════════════════════════════════════════════════════════ */
.ah{padding:20px 24px 30px;max-width:1240px;margin:0 auto;font-family:'Figtree',sans-serif}
.ah-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;padding-right:46px}
.ah-ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#10b981,#0ea5e9);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex:none}
.ah-top h1{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;margin:0}
.ah-top small{display:block;font-size:12.5px;color:rgba(255,255,255,.5);margin-top:2px}
.ah-top .sp{flex:1}
.ah-a{padding:8px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.8);text-decoration:none;font-size:12.5px;font-weight:700}
.ah-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.ah-col{background:var(--bg2,#0f0f1a);border:1px solid rgba(255,255,255,.07);border-radius:16px;min-height:560px;display:flex;flex-direction:column;overflow:hidden}
.ah-chat{height:calc(var(--al-vh,100vh) - 130px);min-height:560px;position:sticky;top:16px;padding:0;border:0;background:transparent}
.ah-chat .aidw.inline{height:100%;border-radius:16px}
.ah-search{padding:12px;border-bottom:1px solid rgba(255,255,255,.07)}
.ah-search input{width:100%;padding:11px 13px;border-radius:11px;background:var(--bg3,#141420);border:1.5px solid rgba(255,255,255,.08);color:#fff;font:14px 'Figtree',sans-serif;outline:0;box-sizing:border-box}
.ah-search input:focus{border-color:#14b8a6}
.ah-list{flex:1;overflow-y:auto;padding:6px 12px 16px}
.ah-cat{margin-top:12px}
.ah-cat h3{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#5eead4;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.ah-cat h3 span{color:rgba(255,255,255,.35);font-weight:700}
.ah-f{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:rgba(255,255,255,.88);font:13.5px 'Figtree',sans-serif;cursor:pointer}
.ah-f:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.07)}
.ah-f .t{flex:1;min-width:0}
.ah-f .g{font-size:10px;font-weight:800;color:#6ee7b7;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);border-radius:999px;padding:1px 7px;white-space:nowrap}
.ah-f .ad{font-size:10px;font-weight:800;color:#fcd34d;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:999px;padding:1px 7px}
.ah-empty{padding:30px 10px;text-align:center;color:rgba(255,255,255,.45);font-size:13px}
.ah-view{flex:1;overflow-y:auto;padding:16px 18px 22px;font-size:14px;line-height:1.65}
.ah-view .bk{background:0;border:0;color:#5eead4;font:700 13px 'Figtree',sans-serif;cursor:pointer;padding:0;margin-bottom:10px}
.ah-view h2{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin:2px 0 4px}
.ah-view .ct{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#5eead4}
.ah-view p{margin:0 0 7px}.ah-view ol,.ah-view ul{padding-left:22px;margin:5px 0 10px}.ah-view li{margin:4px 0}.ah-view .sp{height:5px}.ah-view .hd{font-weight:800;margin:12px 0 4px}
.ah-view a{color:#5eead4;word-break:break-all}.ah-view code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;font-size:12.5px}
.ah-view img{max-width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.12);margin:10px 0}
.ah-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ah-btn{border:0;border-radius:10px;padding:10px 15px;font:800 13px 'Figtree',sans-serif;cursor:pointer;background:linear-gradient(135deg,#10b981,#0ea5e9);color:#fff}
.ah-btn.o{background:transparent;border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.85)}
.ah-tabs{display:none;gap:6px;margin-bottom:12px}
.ah-tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.75);font:800 13px 'Figtree',sans-serif;cursor:pointer}
.ah-tabs button.on{background:linear-gradient(135deg,rgba(16,185,129,.25),rgba(14,165,233,.2));color:#fff;border-color:rgba(14,165,233,.4)}
.locked{text-align:center;padding:80px 20px;color:rgba(255,255,255,.35)}
@media (max-width:900px){
  .ah{padding:14px 16px 24px}
  .ah-tabs{display:flex}
  .ah-grid{grid-template-columns:minmax(0,1fr)}
  .ah-grid[data-tab="chat"] #colCat{display:none}
  .ah-grid[data-tab="cat"] #colChat{display:none}
  .ah-chat{position:static;height:78vh;min-height:460px}
}
@media (max-width:768px){.ah{padding-top:74px}.ah-top{padding-right:0}}
body.light-theme .ah-top small,body.light-theme .ah-cat h3 span,body.light-theme .ah-empty{color:rgba(17,19,36,.55)}
body.light-theme .ah-col{background:#fff;border-color:rgba(17,19,36,.1)}
body.light-theme .ah-search{border-color:rgba(17,19,36,.08)}
body.light-theme .ah-search input{background:#fff;border-color:rgba(17,19,36,.14);color:#111324}
body.light-theme .ah-f{color:#111324}body.light-theme .ah-f:hover{background:rgba(17,19,36,.04);border-color:rgba(17,19,36,.08)}
body.light-theme .ah-cat h3,body.light-theme .ah-view .ct,body.light-theme .ah-view .bk,body.light-theme .ah-view a{color:#0f766e}
body.light-theme .ah-a,body.light-theme .ah-btn.o,body.light-theme .ah-tabs button{color:#334155;border-color:rgba(17,19,36,.14)}
body.light-theme .ah-tabs button.on{color:#0f172a}
body.light-theme .ah-view code{background:rgba(17,19,36,.06)}
</style>

<body data-aide-inline="1">
<div class="ah" id="mainView" style="display:none">
  <div class="ah-top">
    <div class="ah-ic">?</div>
    <div><h1>Aide Team</h1><small>Toutes les procédures techniques de Team, et un assistant pour tes questions</small></div>
    <div class="sp"></div>
    <a class="ah-a" href="formations.html">← Formations</a>
  </div>
  <div class="ah-tabs" id="tabs"><button type="button" data-tab="chat" class="on">💬 Poser une question</button><button type="button" data-tab="cat">📚 Toutes les fiches</button></div>
  <div class="ah-grid" id="grid" data-tab="chat">
    <div class="ah-col" id="colCat">
      <div class="ah-search"><input id="q" type="search" placeholder="🔍 Chercher une fiche : agenda, horaires, WhatsApp, mot de passe…" autocomplete="off"/></div>
      <div class="ah-list" id="list"><div class="ah-empty">Chargement des fiches…</div></div>
      <div class="ah-view" id="view" style="display:none"></div>
    </div>
    <div class="ah-chat" id="colChat"></div>
  </div>
</div>
<div class="locked" id="lockedView" style="display:none">🔒 Réservé à l'équipe commerciale</div>

<script>
(function () {
var DATA = null;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function renderList() {
  var q = norm($('q').value.trim());
  var words = q ? q.split(/\s+/) : [];
  var byCat = {};
  (DATA.fiches || []).forEach(function (f) {
    if (words.length) {
      var hay = norm(f.title + ' ' + f.tags + ' ' + f.cat + ' ' + f.body);
      for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) < 0) return;
    }
    (byCat[f.cat] = byCat[f.cat] || []).push(f);
  });
  var h = '';
  (DATA.categories || []).forEach(function (c) {
    var l = byCat[c];
    if (!l || !l.length) return;
    h += '<div class="ah-cat"><h3>' + esc(c) + ' <span>' + l.length + '</span></h3>';
    l.forEach(function (f) {
      h += '<button type="button" class="ah-f" data-id="' + esc(f.id) + '"><span class="t">' + esc(f.title) + '</span>' +
        (f.adminOnly ? '<span class="ad">admin</span>' : '') + ((f.guide || []).length ? '<span class="g">👉 guidé</span>' : '') + '</button>';
    });
    h += '</div>';
  });
  $('list').innerHTML = h || '<div class="ah-empty">Aucune fiche ne correspond. Pose ta question à l\'assistant : si la procédure manque, elle sera ajoutée.</div>';
}

function showFiche(id) {
  var f = null;
  (DATA.fiches || []).forEach(function (x) { if (x.id === id) f = x; });
  if (!f) return;
  var md = window.AideTeam ? window.AideTeam.md : function (s) { return '<p>' + esc(s) + '</p>'; };
  $('view').innerHTML = '<button type="button" class="bk" data-act="back">← Toutes les fiches</button>' +
    '<div class="ct">' + esc(f.cat) + '</div><h2>' + esc(f.title) + '</h2>' + md(f.body) + '<div id="imgs"></div>' +
    '<div class="ah-acts">' + ((f.guide || []).length ? '<button type="button" class="ah-btn" data-act="guide" data-id="' + esc(f.id) + '">👉 Montre-moi en direct</button>' : '') +
    '<button type="button" class="ah-btn o" data-act="back">← Retour</button></div>';
  $('list').style.display = 'none'; $('view').style.display = '';
  $('view').scrollTop = 0;
  try { history.replaceState(null, '', '#' + f.id); } catch (e) {}
  (f.images || []).forEach(function (imgId) {
    api({ action: 'image', id: imgId }).then(function (j) {
      var im = document.createElement('img'); im.src = 'data:' + j.mediaType + ';base64,' + j.data; im.alt = 'capture';
      var box = $('imgs'); if (box) box.appendChild(im);
    }).catch(function () {});
  });
}
function back() {
  $('view').style.display = 'none'; $('list').style.display = '';
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}

function api(body) {
  return firebase.auth().currentUser.getIdToken().then(function (tok) {
    return fetch('/api/aide-ask', { method: 'POST', headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }).then(function (r) { return r.json(); }).then(function (j) { if (!j || j.ok === false) throw new Error((j && (j.message || j.error)) || 'Erreur'); return j; });
}

$('q').addEventListener('input', function () { back(); renderList(); });
$('list').addEventListener('click', function (e) { var b = e.target.closest('.ah-f'); if (b) showFiche(b.getAttribute('data-id')); });
$('view').addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act');
  if (a === 'back') back();
  else if (a === 'guide') {
    var f = null; (DATA.fiches || []).forEach(function (x) { if (x.id === b.getAttribute('data-id')) f = x; });
    if (f && window.AideGuide) window.AideGuide.start(f.guide, { ficheId: f.id, title: f.title });
  }
});
$('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-tab]'); if (!b) return;
  $('grid').setAttribute('data-tab', b.getAttribute('data-tab'));
  Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
});

firebase.auth().onAuthStateChanged(function (u) {
  if (!u) return;
  var r = localStorage.getItem('ambitio_role') || '';
  if (r !== 'sales' && r !== 'admin') { $('lockedView').style.display = ''; return; }
  $('mainView').style.display = '';
  (function waitWidget(n) {
    if (window.AideTeam) {
      window.AideTeam.mountInline($('colChat'));
      window.AideTeam.catalog().then(function (j) {
        DATA = j; renderList();
        var h = (location.hash || '').replace(/^#/, '');
        if (h) { showFiche(h); if (window.innerWidth <= 900) $('tabs').querySelector('[data-tab="cat"]').click(); }
      }).catch(function (e) { $('list').innerHTML = '<div class="ah-empty">⚠️ ' + esc(e.message) + '</div>'; });
      return;
    }
    if (n > 50) { $('list').innerHTML = '<div class="ah-empty">⚠️ Module d\'aide non chargé — recharge la page.</div>'; return; }
    setTimeout(function () { waitWidget(n + 1); }, 200);
  })(0);
});
})();
</script>
