<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp — Alteore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Habillage WhatsApp Web, thème sombre — mêmes teintes que l'application, pour
   que l'équipe n'ait rien à réapprendre. Les codes visuels de WhatsApp portent
   du SENS et sont repris tels quels : la bulle verte à droite est ce qu'on a
   envoyé, les coches disent où en est la remise, le fond texturé sépare le fil
   des panneaux. Inventer une autre grammaire ici obligerait à la traduire.
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  --wa-liste:   #111b21;   /* colonne de gauche */
  --wa-panneau: #202c33;   /* en-têtes et champs */
  --wa-fond:    #0b141a;   /* fond du fil */
  --wa-in:      #202c33;   /* bulle reçue */
  --wa-out:     #005c4b;   /* bulle envoyée */
  --wa-texte:   #e9edef;
  --wa-doux:    #8696a0;
  --wa-vert:    #00a884;
  --wa-lu:      #53bdeb;   /* les deux coches bleues */
  --wa-bord:    #222d34;
  --wa-survol:  #202c33;
  --wa-actif:   #2a3942;
  --wa-rouge:   #f15c6d;
  --fb: 'Figtree', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--wa-fond); color:var(--wa-texte);
  font-family:var(--fb); font-size:14px; -webkit-font-smoothing:antialiased; }
button { font-family:inherit; }

/* `dvh` plutôt que `vh` : sur iOS et sur Safari, `100vh` compte la barre
   d'adresse comme si elle était rétractée, donc le bas du fil — et avec lui le
   composeur — passe sous l'écran. Le `vh` reste en repli pour les navigateurs
   qui ignorent l'unité. */
.wa-wrap { display:grid; grid-template-columns:minmax(300px,30%) 1fr;
  height:100vh; height:100dvh; }
@media (max-width: 860px) {
  /* Une seule colonne à la fois : côte à côte sur 360 px, ni la liste ni le
     fil ne sont utilisables. */
  .wa-wrap { grid-template-columns:1fr; }
  .wa-wrap.lit .wa-list { display:none; }
  .wa-wrap:not(.lit) .wa-thread { display:none; }
}

/* ── Colonne de gauche ─────────────────────────────────────────────────── */
.wa-list { background:var(--wa-liste); border-right:1px solid var(--wa-bord);
  display:flex; flex-direction:column; min-height:0; }
.wa-list-top { background:var(--wa-panneau); padding:10px 16px; display:flex;
  align-items:center; gap:10px; min-height:59px; }
.wa-title { font-size:16px; font-weight:600; margin:0; flex:1; }
.wa-count { font-size:11px; color:var(--wa-doux); }

.wa-search-wrap { padding:7px 12px; background:var(--wa-liste); }
.wa-search-box { display:flex; align-items:center; gap:10px; background:var(--wa-panneau);
  border-radius:8px; padding:0 12px; }
.wa-loupe { color:var(--wa-doux); font-size:13px; flex-shrink:0; }
.wa-search { flex:1; border:0; background:transparent; color:var(--wa-texte);
  font-family:var(--fb); font-size:14px; padding:9px 0; outline:none; }
.wa-search::placeholder { color:var(--wa-doux); }

.wa-scope { display:flex; gap:8px; padding:4px 12px 8px; }
.wa-chip { padding:5px 12px; border-radius:14px; border:0; background:var(--wa-panneau);
  color:var(--wa-doux); font-size:12px; font-weight:500; cursor:pointer; }
.wa-chip.on { background:rgba(0,168,132,.18); color:var(--wa-vert); }

.wa-items { flex:1; overflow-y:auto; min-height:0; }
.wa-item { display:flex; align-items:center; gap:13px; width:100%; padding:10px 14px;
  background:transparent; border:0; border-bottom:1px solid var(--wa-bord);
  cursor:pointer; text-align:left; color:inherit; }
.wa-item:hover { background:var(--wa-survol); }
.wa-item.on { background:var(--wa-actif); }
.wa-av { width:46px; height:46px; border-radius:50%; flex-shrink:0; display:flex;
  align-items:center; justify-content:center; font-size:16px; font-weight:600; color:#fff; }
.wa-item-body { flex:1; min-width:0; }
.wa-item-l1 { display:flex; align-items:baseline; gap:8px; }
.wa-nom { font-size:15px; font-weight:500; flex:1; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.wa-quand { font-size:11px; color:var(--wa-doux); flex-shrink:0; }
.wa-item.nonlu .wa-quand { color:var(--wa-vert); }
.wa-item-l2 { display:flex; align-items:center; gap:8px; margin-top:3px; }
.wa-apercu { flex:1; font-size:13px; color:var(--wa-doux); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.wa-pastille { background:var(--wa-vert); color:#0b141a; font-size:11px; font-weight:700;
  border-radius:11px; min-width:20px; height:20px; padding:0 6px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; }
.wa-vide { padding:48px 26px; text-align:center; color:var(--wa-doux);
  font-size:13.5px; line-height:1.7; }

/* ── Colonne de droite ─────────────────────────────────────────────────── */
.wa-thread { display:flex; flex-direction:column; min-height:0; background:var(--wa-fond);
  /* Le fond texturé de WhatsApp, obtenu sans image : une trame de points très
     faible. Aucune requête réseau, aucun fichier à héberger. */
  background-image: radial-gradient(rgba(255,255,255,.021) 1px, transparent 1px);
  background-size: 22px 22px; }
.wa-thread-top { background:var(--wa-panneau); padding:9px 16px; display:flex;
  align-items:center; gap:13px; min-height:59px; flex-shrink:0; }
.wa-retour { display:none; background:transparent; border:0; color:var(--wa-doux);
  font-size:20px; cursor:pointer; padding:0 4px; }
@media (max-width: 860px) { .wa-retour { display:block; } }
.wa-thread-nom { font-size:16px; font-weight:500; }
.wa-thread-sub { font-size:12px; color:var(--wa-doux); margin-top:1px; }
.wa-thread-sub a { color:var(--wa-vert); text-decoration:none; }
.wa-thread-sub a:hover { text-decoration:underline; }
.wa-fenetre { margin-left:auto; font-size:11.5px; font-weight:600; padding:5px 11px;
  border-radius:13px; flex-shrink:0; }
.wa-fenetre.ouverte { background:rgba(0,168,132,.16); color:var(--wa-vert); }
.wa-fenetre.fermee  { background:rgba(241,92,109,.13); color:var(--wa-rouge); }

.wa-msgs { flex:1; overflow-y:auto; min-height:0; padding:16px 6%; display:flex;
  flex-direction:column; gap:3px; }

.wa-jour { align-self:center; background:var(--wa-panneau); color:var(--wa-doux);
  font-size:12px; padding:5px 13px; border-radius:8px; margin:14px 0 8px;
  box-shadow:0 1px 1px rgba(0,0,0,.2); }

.wa-bulle { position:relative; max-width:min(72%, 620px); padding:6px 9px 8px;
  border-radius:8px; font-size:14.2px; line-height:1.42; white-space:pre-wrap;
  word-break:break-word; box-shadow:0 1px 1px rgba(0,0,0,.16); margin-top:2px; }
.wa-bulle.in  { align-self:flex-start; background:var(--wa-in);  border-top-left-radius:0; }
.wa-bulle.out { align-self:flex-end;   background:var(--wa-out); border-top-right-radius:0; }
/* La pointe de la bulle — le détail qui fait qu'on reconnaît WhatsApp au
   premier coup d'œil. Uniquement sur le premier message d'une série, comme
   dans l'application. */
.wa-bulle.in.tete::before, .wa-bulle.out.tete::before {
  content:''; position:absolute; top:0; width:9px; height:13px;
}
.wa-bulle.in.tete::before  { left:-8px;  background:var(--wa-in);
  clip-path: polygon(100% 0, 0 0, 100% 100%); }
.wa-bulle.out.tete::before { right:-8px; background:var(--wa-out);
  clip-path: polygon(0 0, 100% 0, 0 100%); }
.wa-bulle:not(.tete) { margin-top:1px; }
.wa-bulle.in:not(.tete)  { border-top-left-radius:8px; }
.wa-bulle.out:not(.tete) { border-top-right-radius:8px; }

.wa-modele { font-size:11px; font-weight:700; color:var(--wa-vert);
  letter-spacing:.3px; margin-bottom:3px; }
.wa-corps-vide { color:var(--wa-doux); font-style:italic; }
/* L'heure et les coches flottent à droite du dernier mot, comme dans
   l'application : elles se glissent sur la ligne quand la place existe. */
.wa-meta { float:right; margin:7px -2px -3px 10px; font-size:11px;
  color:rgba(233,237,239,.55); display:inline-flex; align-items:center; gap:3px; }
.wa-tick { font-size:12px; letter-spacing:-2px; }
.wa-tick.lu { color:var(--wa-lu); }
.wa-meta.echec { color:var(--wa-rouge); font-weight:600; }

/* ── Pièces jointes reçues ─────────────────────────────────────────────
   Meta ne pousse qu'un identifiant : ce que le navigateur affiche ici vient
   de Firebase Storage, où le webhook a archivé le fichier. */
.wa-media { display:block; margin:1px 0 4px; }
.wa-media img, .wa-media video { display:block; max-width:100%; max-height:340px;
  border-radius:6px; }
.wa-media img { cursor:zoom-in; }
.wa-media audio { display:block; width:250px; max-width:100%; margin:4px 0 2px; }
.wa-fichier { display:inline-flex; align-items:center; gap:8px; padding:9px 11px;
  border-radius:8px; background:rgba(255,255,255,.07); color:inherit;
  text-decoration:none; font-size:13.5px; max-width:100%; }
.wa-fichier:hover { background:rgba(255,255,255,.13); }
.wa-fichier span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wa-media-ko { font-size:12.5px; font-style:italic; color:var(--wa-doux); }
/* Le motif d'un échec d'envoi. Sans lui, la bulle ne portait qu'un ⚠ muet et
   il fallait ouvrir la console Firestore pour savoir ce que Meta reprochait. */
.wa-motif { display:block; clear:both; margin-top:4px; font-size:11.5px;
  font-weight:600; color:var(--wa-rouge); }

/* ── Le composeur ─────────────────────────────────────────────────────
   Deux états, jamais les deux à la fois : champ libre quand la fenêtre de
   24 h est ouverte, choix d'un modèle quand elle est fermée. Afficher un
   champ de saisie hors fenêtre produirait des messages refusés par Meta —
   autant ne pas le proposer du tout. */
.wa-compose { background:var(--wa-panneau); flex-shrink:0; }

.wa-barre { display:flex; align-items:flex-end; gap:10px; padding:9px 16px; }
.wa-input { flex:1; background:var(--wa-fond); border:0; border-radius:9px;
  color:var(--wa-texte); font-family:var(--fb); font-size:14.2px; line-height:1.45;
  padding:10px 13px; resize:none; max-height:140px; outline:none; }
.wa-input::placeholder { color:var(--wa-doux); }
.wa-send { width:42px; height:42px; border-radius:50%; border:0; background:var(--wa-vert);
  color:#0b141a; font-size:17px; cursor:pointer; flex-shrink:0; display:flex;
  align-items:center; justify-content:center; }
.wa-send:disabled { opacity:.4; cursor:default; }

.wa-ferme { padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.wa-ferme-txt { flex:1; min-width:220px; font-size:12.5px; color:var(--wa-doux); line-height:1.55; }
.wa-ferme-txt strong { color:var(--wa-texte); font-weight:600; }
.wa-btn { border:0; border-radius:8px; padding:9px 15px; font-family:var(--fb);
  font-size:13px; font-weight:600; cursor:pointer; background:var(--wa-vert); color:#0b141a; }
.wa-btn.ghost { background:transparent; color:var(--wa-doux); box-shadow:inset 0 0 0 1px var(--wa-bord); }
.wa-btn:disabled { opacity:.45; cursor:default; }

/* ── Le choix d'un modèle ── */
.wa-tpl { padding:12px 16px 16px; max-height:52vh; overflow-y:auto; }
.wa-tpl-h { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.wa-tpl-h h3 { margin:0; font-size:14px; font-weight:600; flex:1; }
.wa-tpl-l { display:flex; flex-direction:column; gap:7px; }
.wa-tpl-i { text-align:left; background:var(--wa-fond); border:0; border-radius:9px;
  padding:10px 13px; cursor:pointer; color:var(--wa-texte); font-family:var(--fb); }
.wa-tpl-i:hover { background:var(--wa-actif); }
.wa-tpl-n { font-size:12.5px; font-weight:700; color:var(--wa-vert); margin-bottom:3px; }
.wa-tpl-t { font-size:12.5px; color:var(--wa-doux); line-height:1.5; }
.wa-tpl-form { display:flex; flex-direction:column; gap:9px; }
.wa-var { display:flex; align-items:center; gap:10px; }
.wa-var label { font-size:12px; color:var(--wa-doux); width:42px; flex-shrink:0; }
.wa-var input { flex:1; background:var(--wa-fond); border:0; border-radius:7px;
  color:var(--wa-texte); font-family:var(--fb); font-size:13.5px; padding:8px 11px; outline:none; }
.wa-apercu-tpl { background:var(--wa-out); border-radius:8px; padding:9px 12px;
  font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
.wa-tpl-actions { display:flex; gap:8px; justify-content:flex-end; }

/* ── Attribution ── */
.wa-assign { background:var(--wa-fond); border:0; border-radius:7px; color:var(--wa-doux);
  font-family:var(--fb); font-size:12px; padding:6px 9px; outline:none; cursor:pointer; }

.wa-erreur { padding:9px 16px; background:rgba(241,92,109,.12); color:var(--wa-rouge);
  font-size:12.5px; line-height:1.5; }
</style>
</head>
<body>

<div class="wa-wrap" id="waWrap">
  <aside class="wa-list">
    <div class="wa-list-top">
      <h1 class="wa-title">WhatsApp</h1>
      <span class="wa-count" id="waCount"></span>
    </div>
    <div class="wa-search-wrap">
      <div class="wa-search-box">
        <span class="wa-loupe">🔍</span>
        <input class="wa-search" id="waSearch" type="search" placeholder="Rechercher…">
      </div>
    </div>
    <div class="wa-scope" id="waScope"></div>
    <div class="wa-items" id="waItems">
      <div class="wa-vide">Chargement…</div>
    </div>
  </aside>

  <main class="wa-thread">
    <div class="wa-thread-top" id="waTop">
      <div><div class="wa-thread-nom">Aucune conversation</div></div>
    </div>
    <div class="wa-msgs" id="waMsgs">
      <div class="wa-vide">Choisis une conversation à gauche.</div>
    </div>
    <div class="wa-compose" id="waCompose"></div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="nav.js" defer></script>

<script>
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey:            "AIzaSyDo30FASeWnhvx4mYWYungKOu4AMhyJz6o",
    authDomain:        "ambitio-team.firebaseapp.com",
    projectId:         "ambitio-team",
    storageBucket:     "ambitio-team.firebasestorage.app",
    messagingSenderId: "1079366902268",
    appId:             "1:1079366902268:web:b4ec1691dba54230339279"
  });
  /* Firestore : auto-detect long-polling — sans lui WebChannel se bloque sur Safari. */
  try { firebase.firestore().settings({ experimentalAutoDetectLongPolling: true }); }
  catch (e) { if (window.console) console.warn('[firestore] settings non appliques:', e && e.message); }
}

var db = firebase.firestore();

var STATE = {
  uid: null, role: null, slug: null, nom: null,
  convs: [],          /* toutes les conversations lues */
  actif: null,        /* numéro de la conversation ouverte */
  filtre: '',
  portee: 'moi',      /* 'moi' | 'tout' */
  modeles: null,      /* modèles approuvés, chargés une fois */
  modeleActif: null,  /* modèle en cours de remplissage */
  envoiEnCours: false,
  equipe: [],         /* membres à qui attribuer une conversation */
  offFil: null        /* désabonnement de l'écouteur du fil */
};

/* ── Formatage ─────────────────────────────────────────────────────────── */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function deuxCh(n) { return (n < 10 ? '0' : '') + n; }

function heureDe(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return deuxCh(d.getHours()) + ':' + deuxCh(d.getMinutes());
}

/* « 14:32 / hier / 12 août » — la date n'apparaît que quand elle apporte
   quelque chose, sinon la colonne devient illisible. */
function quandCourt(ts) {
  if (!ts) return '';
  var d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return heureDe(ts);
  var hier = new Date(now.getTime() - 86400000);
  if (d.toDateString() === hier.toDateString()) return 'hier';
  try {
    return new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' }).format(d);
  } catch (e) { return deuxCh(d.getDate()) + '/' + deuxCh(d.getMonth() + 1); }
}

/* Séparateur de date : « aujourd'hui » et « hier » plutôt qu'une date, comme
   dans l'application. */
function jourLong(ts) {
  var d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return "aujourd'hui";
  var hier = new Date(now.getTime() - 86400000);
  if (d.toDateString() === hier.toDateString()) return 'hier';
  try {
    return new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).format(d);
  } catch (e) { return ''; }
}

/* Numéro brut (chiffres) → affichage lisible. */
function numLisible(n) {
  var s = String(n || '');
  if (s.indexOf('33') === 0 && s.length === 11) {
    return ('0' + s.slice(2)).replace(/(\d{2})(?=\d)/g, '$1 ').trim();
  }
  return '+' + s;
}

function initiales(nom, numero) {
  var t = String(nom || '').trim().split(/\s+/).filter(Boolean);
  if (t.length >= 2) return (t[0][0] + t[1][0]).toUpperCase();
  if (t.length === 1 && t[0].length) return t[0].slice(0, 2).toUpperCase();
  return String(numero || '?').slice(-2);
}

/* Couleur d'avatar stable, tirée du numéro : le même contact garde la même
   pastille d'une session à l'autre. */
var AV_COULEURS = ['#6a7ba2','#7f9c6c','#a2756a','#6a9ca2','#8f6aa2','#a2996a','#6aa287','#a26a86'];
function couleurAvatar(numero) {
  var h = 0, s = String(numero || 'x');
  for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return AV_COULEURS[Math.abs(h) % AV_COULEURS.length];
}

/* ── Les coches de remise ───────────────────────────────────────────────
   La grammaire de WhatsApp, reprise à l'identique parce que toute l'équipe
   la connaît déjà : une coche = parti, deux = remis, deux bleues = lu. */
function coches(statut) {
  if (statut === 'read')      return '<span class="wa-tick lu">✓✓</span>';
  if (statut === 'delivered') return '<span class="wa-tick">✓✓</span>';
  if (statut === 'sent')      return '<span class="wa-tick">✓</span>';
  if (statut === 'failed' || statut === 'echec') return '<span>⚠</span>';
  return '<span class="wa-tick">🕐</span>';   /* accepté par Meta, pas encore parti */
}

/* ── La fenêtre de 24 h ─────────────────────────────────────────────────
   Le seul état que l'équipe DOIT voir en permanence : hors fenêtre, un
   message libre est refusé par Meta. Affiché dès maintenant, avant même que
   la réponse soit livrée — savoir qu'on ne peut pas répondre vaut mieux que
   de l'apprendre en essayant. */
function fenetre(c) {
  var fin = c && c.fenetreExpireA;
  if (!fin) return { ouverte: false, texte: 'Réponse fermée' };
  var reste = fin - Date.now();
  if (reste <= 0) return { ouverte: false, texte: 'Réponse fermée' };
  var h = Math.floor(reste / 3600000);
  var m = Math.floor((reste % 3600000) / 60000);
  return { ouverte: true, texte: 'Réponse libre · ' + (h > 0 ? h + ' h ' + deuxCh(m) : m + ' min') };
}

/* ── Portée d'affichage ─────────────────────────────────────────────────
   FILTRE D'AFFICHAGE, PAS UNE BARRIÈRE DE SÉCURITÉ. Les règles Firestore
   autorisent tout `sales` à lire toutes les conversations : c'est une
   commodité pour ne pas noyer chacun sous le travail des autres. Un
   cloisonnement réel devrait être porté dans les rules, pas ici. */
function visible(c) {
  if (STATE.role === 'admin' || STATE.portee === 'tout') return true;
  if (!c.attribueA) return true;
  return c.attribueA === STATE.slug || c.attribueA === STATE.uid;
}

function correspond(c) {
  if (!STATE.filtre) return true;
  var f = STATE.filtre.toLowerCase();
  return String(c.nom || '').toLowerCase().indexOf(f) >= 0
      || String(c.nomLead || '').toLowerCase().indexOf(f) >= 0
      || String(c.numero || '').indexOf(f.replace(/\D/g, '')) >= 0;
}

function nomDe(c) { return c.nom || c.nomLead || numLisible(c.numero); }

/* ── Rendu de la liste ─────────────────────────────────────────────────── */

function rendreListe() {
  var host = document.getElementById('waItems');
  var l = STATE.convs.filter(function (c) { return visible(c) && correspond(c); });

  document.getElementById('waCount').textContent =
    l.length ? l.length + (l.length > 1 ? ' conversations' : ' conversation') : '';

  if (!l.length) {
    host.innerHTML = '<div class="wa-vide">' + (STATE.convs.length
      ? 'Aucune conversation ne correspond.'
      : 'Aucune conversation pour le moment.<br><br>La boîte se remplit à partir du premier message reçu — WhatsApp ne restitue aucun historique antérieur.') + '</div>';
    return;
  }

  var h = '';
  l.forEach(function (c) {
    var dm = c.dernierMessage || {};
    var apercu = (dm.sens === 'out' ? '↗&nbsp; ' : '') + esc(dm.texte || '—');
    h += '<button class="wa-item' + (c.numero === STATE.actif ? ' on' : '')
       +   (c.nonLus ? ' nonlu' : '') + '" data-num="' + esc(c.numero) + '">'
       +   '<span class="wa-av" style="background:' + couleurAvatar(c.numero) + '">'
       +     esc(initiales(nomDe(c), c.numero)) + '</span>'
       +   '<span class="wa-item-body">'
       +     '<span class="wa-item-l1">'
       +       '<span class="wa-nom">' + esc(nomDe(c)) + '</span>'
       +       '<span class="wa-quand">' + esc(quandCourt(dm.at || c.majA)) + '</span>'
       +     '</span>'
       +     '<span class="wa-item-l2">'
       +       '<span class="wa-apercu">' + apercu + '</span>'
       +       (c.nonLus ? '<span class="wa-pastille">' + c.nonLus + '</span>' : '')
       +     '</span>'
       +   '</span>'
       + '</button>';
  });
  host.innerHTML = h;
}

function rendrePortee() {
  var host = document.getElementById('waScope');
  if (STATE.role === 'admin') { host.innerHTML = ''; return; }
  host.innerHTML =
      '<button class="wa-chip' + (STATE.portee === 'moi' ? ' on' : '') + '" data-portee="moi">Les miennes</button>'
    + '<button class="wa-chip' + (STATE.portee === 'tout' ? ' on' : '') + '" data-portee="tout">Toutes</button>';
}

/* ── Rendu du fil ──────────────────────────────────────────────────────── */

function rendreEntete(c) {
  var top = document.getElementById('waTop');
  if (!c) { top.innerHTML = '<div><div class="wa-thread-nom">Aucune conversation</div></div>'; return; }
  var f = fenetre(c);
  var sub = numLisible(c.numero);
  if (c.leadId) sub += ' · <a href="sales-contact.html?leadId=' + encodeURIComponent(c.leadId) + '">Fiche du lead</a>';
  top.innerHTML =
      '<button class="wa-retour" id="waRetour">←</button>'
    + '<span class="wa-av" style="background:' + couleurAvatar(c.numero) + ';width:40px;height:40px;font-size:14px">'
    +   esc(initiales(nomDe(c), c.numero)) + '</span>'
    + '<div><div class="wa-thread-nom">' + esc(nomDe(c)) + '</div>'
    +      '<div class="wa-thread-sub">' + sub + '</div></div>'
    + '<span class="wa-fenetre ' + (f.ouverte ? 'ouverte' : 'fermee') + '">' + esc(f.texte) + '</span>'
    + rendreAttribution(c);
}

/* Attribuer une conversation : c'est ce qui décide de ce que chacun voit dans
   « Les miennes ». La liste vient de _meta/team_members via nav.js — la
   collection `users` n'est lisible que par son propriétaire et les admins,
   un sales ne pourrait pas y lire ses collègues. */
function rendreAttribution(c) {
  if (!STATE.equipe.length) return '';
  var h = '<select class="wa-assign" data-assign="' + esc(c.numero) + '">'
        + '<option value="">Non attribuée</option>';
  STATE.equipe.forEach(function (m) {
    var sel = (c.attribueA && c.attribueA === m.slug) ? ' selected' : '';
    h += '<option value="' + esc(m.slug) + '"' + sel + '>' + esc(m.nom) + '</option>';
  });
  return h + '</select>';
}

/* ── Le composeur ──────────────────────────────────────────────────────── */

function rendreCompose(c) {
  var host = document.getElementById('waCompose');
  if (!c) { host.innerHTML = ''; return; }

  /* Un modèle est en cours de remplissage : il occupe tout le composeur. */
  if (STATE.modeleActif) { rendreFormulaireModele(host, c); return; }

  var f = fenetre(c);
  if (f.ouverte) {
    host.innerHTML =
        '<div class="wa-barre">'
      +   '<textarea class="wa-input" id="waTexte" rows="1" placeholder="Écris un message…"></textarea>'
      +   '<button class="wa-send" id="waEnvoyer" title="Envoyer">➤</button>'
      + '</div>';
    var ta = document.getElementById('waTexte');
    if (ta) {
      ta.focus();
      /* Le champ grandit avec le texte, comme dans l'application. */
      ta.addEventListener('input', function () {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
      });
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envoyerTexte(c); }
      });
    }
    return;
  }

  host.innerHTML =
      '<div class="wa-ferme">'
    +   '<div class="wa-ferme-txt"><strong>Fenêtre de réponse fermée.</strong> '
    +     'Ce contact n\'a pas écrit depuis plus de 24 h : WhatsApp n\'autorise plus '
    +     'qu\'un modèle approuvé. Sa réponse rouvrira la fenêtre pour 24 h.</div>'
    +   '<button class="wa-btn" id="waChoisirModele">Choisir un modèle</button>'
    + '</div>';
}

function rendreFormulaireModele(host, c) {
  var m = STATE.modeleActif;

  /* Étape 1 : la liste. */
  if (m === true) {
    var l = (STATE.modeles || []).filter(function (x) { return !x.boutons; });
    var h = '<div class="wa-tpl"><div class="wa-tpl-h"><h3>Modèles approuvés</h3>'
          + '<button class="wa-btn ghost" data-tpl-annuler="1">Annuler</button></div>';
    if (STATE.modeles === null) {
      h += '<div class="wa-tpl-t">Chargement…</div>';
    } else if (!l.length) {
      h += '<div class="wa-tpl-t">Aucun modèle approuvé pour l\'instant. '
         + 'Tes modèles sont encore en examen chez Meta — dès qu\'ils passent, ils apparaissent ici.</div>';
    } else {
      h += '<div class="wa-tpl-l">';
      l.forEach(function (x) {
        h += '<button class="wa-tpl-i" data-tpl="' + esc(x.nom) + '">'
           +   '<div class="wa-tpl-n">' + esc(x.nom) + '</div>'
           +   '<div class="wa-tpl-t">' + esc(x.corps) + '</div>'
           + '</button>';
      });
      h += '</div>';
    }
    host.innerHTML = h + '</div>';
    return;
  }

  /* Étape 2 : le remplissage, avec aperçu de ce que le client va lire. */
  var vals = STATE.modeleValeurs || [];
  var apercu = m.corps;
  for (var i = 0; i < m.variables; i++) {
    var v = vals[i] ? vals[i] : '{{' + (i + 1) + '}}';
    apercu = apercu.split('{{' + (i + 1) + '}}').join(v);
  }
  var pret = true;
  for (var j = 0; j < m.variables; j++) { if (!vals[j] || !String(vals[j]).trim()) pret = false; }

  var h2 = '<div class="wa-tpl"><div class="wa-tpl-h"><h3>' + esc(m.nom) + '</h3>'
         + '<button class="wa-btn ghost" data-tpl-retour="1">← Modèles</button></div>'
         + '<div class="wa-tpl-form">';
  for (var k = 0; k < m.variables; k++) {
    h2 += '<div class="wa-var"><label>{{' + (k + 1) + '}}</label>'
        + '<input type="text" data-var="' + k + '" value="' + esc(vals[k] || '') + '"></div>';
  }
  h2 += '<div class="wa-apercu-tpl">' + esc(apercu) + '</div>'
      + '<div class="wa-tpl-actions">'
      +   '<button class="wa-btn ghost" data-tpl-annuler="1">Annuler</button>'
      +   '<button class="wa-btn" id="waEnvoyerModele"' + (pret ? '' : ' disabled') + '>Envoyer</button>'
      + '</div></div></div>';
  host.innerHTML = h2;
}

/* ── Envois ────────────────────────────────────────────────────────────── */

function afficherErreur(msg) {
  var host = document.getElementById('waCompose');
  var d = document.createElement('div');
  d.className = 'wa-erreur';
  d.textContent = msg;
  host.insertBefore(d, host.firstChild);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 8000);
}

async function poster(corps) {
  var a = window._auth || firebase.auth();
  var t = await a.currentUser.getIdToken();
  var r = await fetch('/api/whatsapp-send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
    body: JSON.stringify(corps)
  });
  var d = null;
  try { d = await r.json(); } catch (e) { d = null; }
  return d || { ok: false, erreur: 'reponse_illisible' };
}

async function envoyerTexte(c) {
  if (STATE.envoiEnCours) return;
  var ta = document.getElementById('waTexte');
  var txt = ta ? ta.value.trim() : '';
  if (!txt) return;

  STATE.envoiEnCours = true;
  var btn = document.getElementById('waEnvoyer');
  if (btn) btn.disabled = true;
  /* Le champ se vide tout de suite : le message apparaîtra dans le fil par
     l'écouteur temps réel, comme n'importe quel autre. */
  if (ta) { ta.value = ''; ta.style.height = 'auto'; }

  var d = await poster({ numero: c.numero, texte: txt });
  STATE.envoiEnCours = false;
  if (btn) btn.disabled = false;

  if (!d.ok) {
    /* On rend le texte plutôt que de le perdre — c'est la moindre des choses
       quand on vient de le taper. */
    if (ta) ta.value = txt;
    afficherErreur(d.erreur === 'fenetre_fermee'
      ? 'La fenêtre de 24 h vient de se fermer. Passe par un modèle approuvé.'
      : ('Envoi refusé : ' + (d.detail || d.erreur || 'erreur inconnue')));
    if (d.erreur === 'fenetre_fermee') rendreCompose(c);
  }
}

async function envoyerModele(c) {
  if (STATE.envoiEnCours) return;
  var m = STATE.modeleActif;
  if (!m || m === true) return;

  STATE.envoiEnCours = true;
  var btn = document.getElementById('waEnvoyerModele');
  if (btn) { btn.disabled = true; btn.textContent = 'Envoi…'; }

  var d = await poster({
    numero: c.numero, template: m.nom, langue: m.langue,
    params: (STATE.modeleValeurs || []).slice(0, m.variables)
  });
  STATE.envoiEnCours = false;

  if (d.ok) {
    STATE.modeleActif = null; STATE.modeleValeurs = [];
    rendreCompose(c);
  } else {
    if (btn) { btn.disabled = false; btn.textContent = 'Envoyer'; }
    afficherErreur('Envoi refusé : ' + (d.detail || d.erreur || 'erreur inconnue'));
  }
}

async function chargerModeles() {
  if (STATE.modeles !== null) return;
  try {
    var a = window._auth || firebase.auth();
    var t = await a.currentUser.getIdToken();
    var r = await fetch('/api/whatsapp-templates', { headers: { Authorization: 'Bearer ' + t } });
    var d = await r.json();
    STATE.modeles = (d && d.ok && d.modeles) ? d.modeles : [];
  } catch (e) { STATE.modeles = []; }
}

/* ── Ce que Meta reproche, en français ──────────────────────────────────
   Le webhook recopie désormais `erreurMeta` sur le message du fil. Traduire
   les codes ici évite d'avoir à les chercher : ce sont les seuls qu'on ait
   réellement rencontrés, le reste s'affiche brut plutôt que d'être deviné. */
var MOTIFS_META = {
  131042: 'Paiement WhatsApp non configuré sur le compte',
  131047: 'Fenêtre de 24 h fermée — il faut un modèle',
  131049: 'Bloqué par Meta pour préserver l\'écosystème',
  130472: 'Bloqué par Meta — numéro dans une expérience marketing',
  131026: 'Destinataire injoignable sur WhatsApp',
  131051: 'Type de message non pris en charge',
  132000: 'Modèle : nombre de variables incorrect',
  132001: 'Modèle introuvable dans cette langue',
  132015: 'Modèle suspendu par Meta'
};

function motifMeta(e) {
  if (!e) return '';
  var code = e.code != null ? Number(e.code) : null;
  var libelle = (code != null && MOTIFS_META[code]) ? MOTIFS_META[code] : (e.titre || e.detail || 'Échec de distribution');
  return libelle + (code != null ? ' (' + code + ')' : '');
}

var MOTIFS_MEDIA = {
  media_trop_lourd: 'fichier de plus de 8 Mo, non archivé',
  media_introuvable: 'fichier expiré chez Meta',
  media_id_absent: 'identifiant absent'
};

/* La pièce jointe d'un message reçu. `mediaUrl` pointe sur Firebase Storage :
   l'URL de Meta, elle, expire en 5 minutes et exige un en-tête d'autorisation,
   donc elle ne peut pas servir de source à une balise <img>. */
function blocMedia(m) {
  var genre = m.media;
  var nom = m.nomFichier || m.libelleMedia || 'Pièce jointe';

  if (!m.mediaUrl) {
    var pourquoi = MOTIFS_MEDIA[m.mediaErreur] || 'téléchargement impossible';
    return '<div class="wa-media-ko">' + esc(m.libelleMedia || 'Pièce jointe')
         + ' — ' + esc(pourquoi) + '</div>';
  }

  var url = esc(m.mediaUrl);
  if (genre === 'image' || genre === 'sticker') {
    return '<div class="wa-media"><a href="' + url + '" target="_blank" rel="noopener">'
         + '<img src="' + url + '" alt="' + esc(nom) + '" loading="lazy"></a></div>';
  }
  if (genre === 'video') {
    return '<div class="wa-media"><video src="' + url + '" controls preload="metadata"></video></div>';
  }
  if (genre === 'audio') {
    return '<div class="wa-media"><audio src="' + url + '" controls preload="metadata"></audio></div>';
  }
  return '<div class="wa-media"><a class="wa-fichier" href="' + url + '" target="_blank" rel="noopener">'
       + '📎 <span>' + esc(nom) + '</span></a></div>';
}

function rendreFil(msgs) {
  var host = document.getElementById('waMsgs');
  if (!msgs.length) { host.innerHTML = '<div class="wa-vide">Aucun message dans cette conversation.</div>'; return; }

  var h = '', dernierJour = '', dernierSens = '';
  msgs.forEach(function (m) {
    var j = jourLong(m.at);
    if (j !== dernierJour) {
      h += '<div class="wa-jour">' + esc(j) + '</div>';
      dernierJour = j; dernierSens = '';
    }

    var sortant = m.sens === 'out';
    var sens = sortant ? 'out' : 'in';
    /* La pointe n'apparaît que sur le premier message d'une série, comme dans
       l'application — sinon chaque bulle porte un ergot et le fil devient
       bruyant. */
    var tete = sens !== dernierSens ? ' tete' : '';
    dernierSens = sens;

    var corps = esc(m.texte || '');
    var enTete = '';
    /* Un modèle n'a pas de corps côté API : on annonce lequel est parti et on
       montre les valeurs envoyées — c'est ce qu'a réellement lu le
       destinataire, et la seule façon de le vérifier après coup. */
    if (sortant && m.modele) {
      enTete = '<div class="wa-modele">' + esc(m.modele) + '</div>';
      corps = (m.params && m.params.length)
        ? esc(m.params.join(' · '))
        : '<span class="wa-corps-vide">modèle sans variable</span>';
    }

    /* Une pièce jointe remplace le corps : `texte` porte alors l'étiquette du
       média (« 📷 Photo »), qui ferait doublon sous l'image. Seule une vraie
       légende mérite d'être écrite. */
    /* Uniquement ce qui a été ARCHIVÉ, ou reçu. Un média sortant ne porte pas
       d'URL — on n'archive que l'entrant — et le passer ici afficherait un
       « téléchargement impossible » alors que l'envoi s'est très bien passé.
       Dans ce cas, `texte` porte déjà « 📷 légende », qui suffit. */
    var media = '';
    if (m.media && (m.mediaUrl || m.sens === 'in')) {
      media = blocMedia(m);
      corps = m.legende ? esc(m.legende) : '';
    }

    var st = m.statut || '';
    var echec = st === 'failed' || st === 'echec';
    var meta = '<span class="wa-meta' + (echec ? ' echec' : '') + '">'
             +   esc(heureDe(m.at))
             +   (sortant ? coches(st) : '')
             + '</span>';

    var motif = (echec && m.erreurMeta)
      ? '<span class="wa-motif">⚠ ' + esc(motifMeta(m.erreurMeta)) + '</span>'
      : '';

    h += '<div class="wa-bulle ' + sens + tete + '">'
       + enTete + meta + media + corps + motif + '</div>';
  });
  host.innerHTML = h;
  host.scrollTop = host.scrollHeight;
}

/* ── Ouverture d'une conversation ──────────────────────────────────────── */

function ouvrir(numero) {
  STATE.actif = numero;
  document.getElementById('waWrap').classList.add('lit');
  rendreListe();

  var c = null;
  STATE.convs.forEach(function (x) { if (x.numero === numero) c = x; });
  rendreEntete(c);
  STATE.modeleActif = null;
  rendreCompose(c);

  if (STATE.offFil) { STATE.offFil(); STATE.offFil = null; }
  document.getElementById('waMsgs').innerHTML = '<div class="wa-vide">Chargement…</div>';

  STATE.offFil = db.collection('whatsapp_conversations').doc(numero)
    .collection('messages').orderBy('at')
    .onSnapshot(function (snap) {
      var l = [];
      snap.forEach(function (d) { l.push(d.data() || {}); });
      rendreFil(l);
    }, function (e) {
      document.getElementById('waMsgs').innerHTML =
        '<div class="wa-vide">Fil illisible : ' + esc(e && e.message) + '</div>';
    });

  /* Marquage lu — l'un des rares champs que le navigateur a le droit d'écrire.
     Silencieux : un échec ne doit pas gêner la lecture. */
  if (c && c.nonLus) {
    db.collection('whatsapp_conversations').doc(numero)
      .update({ nonLus: 0, luA: Date.now() })
      .catch(function (e) { if (window.console) console.warn('[wa] marquage lu', e && e.message); });
  }
}

/* ── Écouteurs ─────────────────────────────────────────────────────────── */

/* Numéro à ouvrir dès que la liste est chargée — posé par `?n=` dans l'URL,
   consommé une seule fois pour ne pas reprendre la main à chaque snapshot. */
var DEMANDE = (function () {
  var m = /[?&]n=([^&]+)/.exec(window.location.search || '');
  if (!m) return null;
  var brut = '';
  try { brut = decodeURIComponent(m[1]); } catch (e) { brut = m[1]; }
  var chiffres = String(brut).replace(/[^0-9]/g, '');
  return chiffres.length >= 10 ? chiffres : null;
})();

function ecouterConversations() {
  db.collection('whatsapp_conversations').orderBy('majA', 'desc').limit(300)
    .onSnapshot(function (snap) {
      var l = [];
      snap.forEach(function (d) {
        var v = d.data() || {};
        v.numero = v.numero || d.id;
        l.push(v);
      });
      STATE.convs = l;
      rendreListe();
      /* Conversation demandée dans l'URL (`?n=336…`), typiquement depuis la
         cloche de notifications. On attend le premier chargement plutôt que
         d'ouvrir à l'aveugle : sans la conversation en mémoire, l'entête
         s'afficherait sans nom et le composeur resterait vide. */
      if (DEMANDE) {
        var vise = DEMANDE;
        DEMANDE = null;
        ouvrir(vise);
      }
      /* L'entête porte un compte à rebours : il doit suivre les mises à jour. */
      if (STATE.actif) {
        var c = null;
        l.forEach(function (x) { if (x.numero === STATE.actif) c = x; });
        if (c) rendreEntete(c);
      }
    }, function (e) {
      document.getElementById('waItems').innerHTML =
        '<div class="wa-vide">Conversations illisibles : ' + esc(e && e.message)
        + '<br><br>Si le message parle de permissions, les règles Firestore ne sont pas déployées.</div>';
    });
}

/* Le compte à rebours doit vivre sans nouveau message : sinon une fenêtre
   affichée « 12 min » le resterait longtemps après son expiration. */
setInterval(function () {
  if (!STATE.actif) return;
  var c = null;
  STATE.convs.forEach(function (x) { if (x.numero === STATE.actif) c = x; });
  if (c) rendreEntete(c);
}, 30000);

/* ── Évènements, par délégation ────────────────────────────────────────── */

/* La conversation ouverte, telle qu'elle est en base à l'instant. */
function convActive() {
  var c = null;
  STATE.convs.forEach(function (x) { if (x.numero === STATE.actif) c = x; });
  return c;
}

/* Met à jour l'aperçu et l'état du bouton SANS repeindre le formulaire :
   repeindre à chaque frappe ferait perdre le curseur au bout d'un caractère. */
function rafraichirApercu() {
  var m = STATE.modeleActif;
  if (!m || m === true) return;
  var vals = STATE.modeleValeurs || [];
  var txt = m.corps, pret = true;
  for (var i = 0; i < m.variables; i++) {
    var v = (vals[i] || '').trim();
    if (!v) pret = false;
    txt = txt.split('{{' + (i + 1) + '}}').join(v || '{{' + (i + 1) + '}}');
  }
  var ap = document.querySelector('.wa-apercu-tpl');
  if (ap) ap.textContent = txt;
  var b = document.getElementById('waEnvoyerModele');
  if (b) b.disabled = !pret;
}

document.addEventListener('click', function (ev) {
  var t = ev.target;

  if (t && t.id === 'waEnvoyer') { envoyerTexte(convActive()); return; }
  if (t && t.id === 'waEnvoyerModele') { envoyerModele(convActive()); return; }

  if (t && t.id === 'waChoisirModele') {
    STATE.modeleActif = true; STATE.modeleValeurs = [];
    rendreCompose(convActive());
    chargerModeles().then(function () {
      if (STATE.modeleActif === true) rendreCompose(convActive());
    });
    return;
  }
  if (t && t.closest && t.closest('[data-tpl-annuler]')) {
    STATE.modeleActif = null; STATE.modeleValeurs = [];
    rendreCompose(convActive()); return;
  }
  if (t && t.closest && t.closest('[data-tpl-retour]')) {
    STATE.modeleActif = true; STATE.modeleValeurs = [];
    rendreCompose(convActive()); return;
  }
  var tpl = t && t.closest ? t.closest('[data-tpl]') : null;
  if (tpl) {
    var nom = tpl.getAttribute('data-tpl');
    (STATE.modeles || []).forEach(function (x) { if (x.nom === nom) STATE.modeleActif = x; });
    STATE.modeleValeurs = [];
    rendreCompose(convActive());
    return;
  }

  if (ev.target && ev.target.id === 'waRetour') {
    document.getElementById('waWrap').classList.remove('lit');
    return;
  }
  var sc = ev.target.closest ? ev.target.closest('[data-portee]') : null;
  if (sc) { STATE.portee = sc.getAttribute('data-portee'); rendrePortee(); rendreListe(); return; }

  var it = ev.target.closest ? ev.target.closest('[data-num]') : null;
  if (it) { ouvrir(it.getAttribute('data-num')); }
});

document.getElementById('waSearch').addEventListener('input', function (e) {
  STATE.filtre = e.target.value || '';
  rendreListe();
});

/* Saisie des variables d'un modèle — délégation, car les champs naissent et
   meurent avec le formulaire. */
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (!el || !el.getAttribute) return;
  var i = el.getAttribute('data-var');
  if (i === null) return;
  STATE.modeleValeurs = STATE.modeleValeurs || [];
  STATE.modeleValeurs[Number(i)] = el.value;
  rafraichirApercu();
});

/* Attribution d'une conversation. */
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (!el || !el.getAttribute) return;
  var num = el.getAttribute('data-assign');
  if (!num) return;
  db.collection('whatsapp_conversations').doc(num)
    .update({ attribueA: el.value || null })
    .catch(function (e) {
      if (window.console) console.warn('[wa] attribution', e && e.message);
      afficherErreur('Attribution refusée : ' + (e && e.message));
    });
});

/* L'équipe à qui attribuer : sales et admin actifs, lus par nav.js dans
   _meta/team_members (la collection `users` n'est pas lisible par un sales). */
function chargerEquipe() {
  /* `sales` est un rôle TECHNIQUE, jamais une valeur stockée : dans
     _meta/team_members, un commercial porte `setter`, `closer` ou
     `closer_setter` — Élodie est `closer_setter`. Filtrer sur `sales` ne
     laissait donc passer que les admins, et la principale utilisatrice du
     canal était absente de son propre sélecteur.
     Même liste que dispo-core.js et alteore-flow.js, DEPARTED compris :
     Guillaume est parti, son historique reste en base mais son nom ne doit
     apparaître dans aucun choix. */
  var ROLES_ATTRIBUABLES = { admin: 1, sales: 1, setter: 1, closer: 1, closer_setter: 1 };
  var DEPARTED = { guillaume: 1 };
  var l = window.TEAM_MEMBERS_ACTIVE || [];
  STATE.equipe = l
    .filter(function (m) {
      return m && m.slug && !DEPARTED[m.slug] && ROLES_ATTRIBUABLES[m.role];
    })
    /* Prénom court d'abord : « Elodie Vidotto Siarri » déborderait d'un menu
       où tous les autres tiennent en un mot. */
    .map(function (m) { return { slug: m.slug, nom: m.shortName || m.displayName || m.slug }; });
  var c = convActive();
  if (c) rendreEntete(c);
}
window.addEventListener('team-members-loaded', chargerEquipe);

/* ── Démarrage ─────────────────────────────────────────────────────────── */

firebase.auth().onAuthStateChanged(async function (user) {
  if (!user) { window.location.href = 'login.html'; return; }
  STATE.uid = user.uid;

  try {
    var udoc = await db.collection('users').doc(user.uid).get();
    var u = udoc.exists ? udoc.data() : {};
    STATE.role = u.role || 'sales';
    STATE.slug = u.slug || u.bookingSlug || null;
    STATE.nom  = u.displayName || (user.email || '').split('@')[0];
  } catch (e) { STATE.role = 'sales'; }

  /* Même règle que le Dialer : jamais un coach, jamais la CSM. */
  if (STATE.role !== 'sales' && STATE.role !== 'admin') {
    document.body.innerHTML =
      '<div style="padding:60px;text-align:center;color:#f15c6d;font-family:var(--fb)">'
      + 'Accès réservé aux sales et aux admins.</div>';
    return;
  }

  rendrePortee();
  ecouterConversations();
  if (window.loadTeamMembers) { window.loadTeamMembers().then(chargerEquipe).catch(function () {}); }
});
</script>
