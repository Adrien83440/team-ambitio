<body>
<div class="rc" id="mainView" style="display:none">
  <div class="rc-top">
    <div class="rc-ic">🎬</div>
    <div><h1>Replay closing</h1><small>Les appels de closing, chapitrés : clique un sujet, la vidéo saute au bon passage</small></div>
    <div class="sp"></div>
    <a class="bb bb-o" id="btnBack" style="display:none" data-action="back">← Tous les appels</a>
  </div>

  <div id="viewList">
    <div class="rc-banner" id="connBanner" style="display:none"></div>
    <div class="rc-filters">
      <input class="bi" id="fQ" type="search" placeholder="Rechercher un client, un closer…"/>
      <select class="bi" id="fStatus">
        <option value="">Tous les appels</option>
        <option value="ready">Chapitrés / transcrits</option>
        <option value="video">Vidéo seule</option>
        <option value="todo">À importer</option>
      </select>
      <select class="bi" id="fDays">
        <option value="30">30 derniers jours</option>
        <option value="60" selected>60 derniers jours</option>
        <option value="120">4 derniers mois</option>
        <option value="365">12 derniers mois</option>
      </select>
      <button class="bb bb-p" id="btnSync" data-action="syncAll">⟳ Tout synchroniser</button>
      <span class="rc-count" id="rcCount"></span>
    </div>
    <div class="rc-list" id="rcList"></div>
  </div>

  <div id="viewPlayer" style="display:none"></div>
</div>

<div class="locked" id="lockedView" style="display:none"><div style="font-size:48px;margin-bottom:12px">🔒</div><div>Module réservé aux administrateurs.</div></div>
<div class="rc-toast" id="rcToast"></div>

<script>
(function () {
'use strict';

var API = '/api/replay-closing';
var ITEMS = [];          // liste des appels
var CUR = null;          // replay ouvert : { booking, replay, entries, video }
var MODE = 'native';     // 'native' (flux, saut instantané) | 'drive' (lecteur intégré)
var EDIT = null;         // copie de travail des chapitres en cours d'édition
var FOLLOW = true;       // la transcription suit la lecture
var lastLine = -1, lastChap = -1;
var CFG_ERR = null;      // dernière erreur de configuration remontée par le serveur

var OUTCOMES = {
  close: '🏆 Close', non_close: '❌ Non close', offre: '💬 Offre', disqualifie: '🚫 Disqua',
  no_show: '👻 No-show', annule: '🔴 Annulé', replanifie: '📅 Replanifié'
};
var REASONS = {
  no_meet_link: 'Ce RDV n\'a pas de lien Google Meet.',
  conference_not_found: 'Aucune réunion Meet trouvée pour ce RDV sur le compte connecté (réunion non tenue, ou hébergée par un autre compte Google).',
  no_transcript: 'La transcription n\'a pas été activée pendant cet appel, ou Google ne la conserve plus (30 jours).',
  no_recording: 'La réunion a eu lieu mais n\'a été ni enregistrée ni transcrite.'
};

function $(id) { return document.getElementById(id); }
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
var toastTimer = null;
function toast(msg, isErr) {
  var t = $('rcToast');
  t.textContent = msg;
  t.className = 'rc-toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'rc-toast' + (isErr ? ' err' : ''); }, isErr ? 6000 : 3200);
}

function clock(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function parseClock(v) {
  var parts = String(v || '').trim().split(':'), sec = 0, i, n;
  if (!parts.length || parts.length > 3) return NaN;
  for (i = 0; i < parts.length; i++) {
    n = parseInt(parts[i], 10);
    if (isNaN(n) || n < 0) return NaN;
    sec = sec * 60 + n;
  }
  return sec;
}
function dateFr(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!m) return iso || '';
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12));
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
}
function durLabel(sec) {
  if (!sec) return '';
  var m = Math.round(sec / 60);
  if (m < 1) return sec + ' s';
  return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60 < 10 ? '0' : '') + (m % 60) : m + ' min';
}

/* ═══ API ═══ */
function api(method, params, body) {
  var u = firebase.auth().currentUser;
  if (!u) return Promise.reject(new Error('Session expirée'));
  return u.getIdToken().then(function (tok) {
    var qs = [];
    Object.keys(params || {}).forEach(function (k) { qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k])); });
    var opt = { method: method, headers: { Authorization: 'Bearer ' + tok } };
    if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch(API + (qs.length ? '?' + qs.join('&') : ''), opt);
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok || j.ok === false) {
        var err = new Error(j.error || ('Erreur ' + r.status));
        err.data = j;
        throw err;
      }
      return j;
    });
  });
}

/* ═══ LISTE ═══ */
function statusTag(it) {
  if (it.replayStatus === 'ready') {
    return it.chaptersCount
      ? '<span class="tag tag-ready">✓ ' + it.chaptersCount + ' chapitres</span>'
      : '<span class="tag tag-ready">✓ Transcrit</span>';
  }
  if (it.replayStatus === 'pending') return '<span class="tag tag-wait">⏳ En attente de Google</span>';
  if (it.hasVideo) return '<span class="tag tag-video">🎥 Vidéo seule</span>';
  if (it.replayStatus === 'none') return '<span class="tag tag-none">Pas d\'enregistrement</span>';
  return '<span class="tag tag-wait">À importer</span>';
}
function statusGroup(it) {
  if (it.replayStatus === 'ready') return 'ready';
  if (it.hasVideo) return 'video';
  return 'todo';
}

function renderList() {
  var q = $('fQ').value.trim().toLowerCase(), fs = $('fStatus').value, h = '', n = 0;
  ITEMS.forEach(function (it) {
    if (fs && statusGroup(it) !== fs) return;
    if (q) {
      var hay = ((it.clientName || '') + ' ' + (it.clientEmail || '') + ' ' + (it.closer || '') + ' ' + (it.typeLabel || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return;
    }
    n++;
    var meta = [dateFr(it.date) + (it.time ? ' · ' + it.time : '')];
    if (it.closer) meta.push('avec ' + it.closer);
    if (it.typeLabel) meta.push(it.typeLabel);
    if (it.durationSec) meta.push(durLabel(it.durationSec));
    h += '<div class="rc-row" data-action="open" data-id="' + escAttr(it.id) + '">'
      + '<div class="rc-av">' + esc((it.clientName || '?').charAt(0).toUpperCase()) + '</div>'
      + '<div class="rc-main"><div class="rc-nm">' + esc(it.clientName) + '</div>'
      + '<div class="rc-meta">' + esc(meta.join(' · ')) + '</div></div>'
      + '<div class="rc-tags">'
      + (it.outcome ? '<span class="tag tag-out">' + esc(OUTCOMES[it.outcome] || it.outcome) + '</span>' : '')
      + statusTag(it) + '</div></div>';
  });
  $('rcList').innerHTML = h || '<div class="rc-empty">Aucun appel de closing sur cette période.<br/>Les replays apparaissent ici le lendemain de l\'appel (import chaque nuit).</div>';
  $('rcCount').textContent = n + ' appel' + (n > 1 ? 's' : '');
}

function loadList() {
  $('rcList').innerHTML = '<div class="rc-empty">Chargement…</div>';
  return api('GET', { action: 'list', days: $('fDays').value }).then(function (j) {
    ITEMS = j.items || [];
    var b = $('connBanner'), msgs = [];
    if (j.google && !j.google.connected) {
      msgs.push('Le compte Google qui héberge les Meet de closing n\'est pas connecté : aucune transcription ne peut être importée. '
        + '<a href="admin-email-auth.html">Connecter « Meet Closing »</a> avec strategie@adrienemily.com.');
    }
    if (CFG_ERR) {
      msgs.push(esc(CFG_ERR.message) + (CFG_ERR.data.enableUrl ? ' <a href="' + escAttr(CFG_ERR.data.enableUrl) + '" target="_blank" rel="noopener">Ouvrir la console Google Cloud</a>' : ''));
    }
    if (j.aiReady === false) msgs.push('Clé IA absente côté serveur : les chapitres ne seront pas générés.');
    if (j.truncated) msgs.push('Période trop large : la liste est tronquée. Réduis la fenêtre.');
    b.innerHTML = msgs.join('<br/>');
    b.style.display = msgs.length ? '' : 'none';
    renderList();
  }).catch(function (e) {
    $('rcList').innerHTML = '<div class="rc-empty">Chargement impossible : ' + esc(e.message) + '</div>';
  });
}

/* ═══ SYNCHRONISATION ═══
   Importe tous les appels de la période pas encore traités, par lots de 3
   (chaque appel = lecture Meet + découpage IA, ~1 min). La page rappelle le
   serveur tant qu'il en reste. */
var SYNCING = false;
function syncAll() {
  if (SYNCING) return;
  SYNCING = true;
  var btn = $('btnSync'), done = [], stats = { ready: 0, video: 0, wait: 0, none: 0, errors: 0 };
  btn.disabled = true;
  CFG_ERR = null;
  function finish(msg, isErr) {
    SYNCING = false;
    btn.disabled = false;
    btn.textContent = '⟳ Tout synchroniser';
    toast(msg, isErr);
    loadList();
  }
  function step() {
    btn.textContent = done.length ? 'Synchronisation… ' + done.length + ' traité' + (done.length > 1 ? 's' : '') : 'Synchronisation…';
    api('POST', {}, { action: 'sync', days: $('fDays').value, max: 3, skip: done }).then(function (j) {
      (j.items || []).forEach(function (it) { done.push(it.id); });
      (j.errors || []).forEach(function (er) { if (done.indexOf(er.id) < 0) done.push(er.id); });
      stats.ready += j.ready || 0; stats.video += j.videoOnly || 0; stats.wait += j.pending || 0;
      stats.none += j.none || 0; stats.errors += (j.errors || []).length;
      if (j.processed > 0 && j.remaining > 0) { step(); return; }
      if (!done.length) { finish('Tout est déjà à jour'); return; }
      var parts = [stats.ready + ' chapitré' + (stats.ready > 1 ? 's' : '')];
      if (stats.video) parts.push(stats.video + ' vidéo seule');
      if (stats.wait) parts.push(stats.wait + ' en attente de Google');
      if (stats.none) parts.push(stats.none + ' sans enregistrement');
      if (stats.errors) parts.push(stats.errors + ' en erreur');
      finish('✓ Synchronisation terminée : ' + parts.join(', '), stats.errors > 0 && !stats.ready);
    }).catch(function (e) {
      // Erreur de configuration (API Google non activée…) : elle reste
      // affichée en bandeau, avec le lien pour la corriger.
      CFG_ERR = e.data && e.data.code ? e : null;
      finish('Synchronisation interrompue : ' + e.message, true);
    });
  }
  step();
}

function highlight(text, q) {
  if (!q) return esc(text);

  var parts = String(text).split(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig')), i, out = '';
  for (i = 0; i < parts.length; i++) out += i % 2 ? '<mark>' + esc(parts[i]) + '</mark>' : esc(parts[i]);
  return out;
}

function wireVideo() {

    MODE = 'drive';

  });

function currentTime() {
  var v = $('rpVideo');
  return v ? (v.currentTime || 0) : 0;
}

function seek(t) {
  t = Math.max(0, Number(t) || 0);
  var v = $('rpVideo'), f = $('rpFrame');
  if (v) {
    v.currentTime = t;
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  } else if (f && CUR.video.fileId) {
    f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(CUR.video.fileId) + '/preview?t=' + Math.floor(t) + '&autoplay=1';
    markActive(t);
  }
}

// Dernier index dont le temps de début est ≤ t (listes triées).
function indexAt(list, key, t) {
  var lo = 0, hi = list.length - 1, r = -1, mid;
  while (lo <= hi) {
    mid = (lo + hi) >> 1;
    if (list[mid][key] <= t) { r = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return r;
}

function markActive(t) {
  var ci = indexAt(CUR.replay.chapters || [], 't', t), box, el, prev;
  if (ci !== lastChap && !EDIT) {
    box = $('chList');
    if (box) {
      prev = box.querySelector('.ch.on'); if (prev) prev.classList.remove('on');
      el = box.querySelector('[data-ch="' + ci + '"]'); if (el) el.classList.add('on');
    }
    lastChap = ci;
  }
  var li = indexAt(CUR.entries || [], 's', t + 0.3);
  if (li !== lastLine) {
    box = $('trList');
    if (box) {
      prev = box.querySelector('.tr.on'); if (prev) prev.classList.remove('on');
      el = box.querySelector('[data-ln="' + li + '"]');
      if (el) {
        el.classList.add('on');
        if (FOLLOW) box.scrollTop = el.offsetTop - box.offsetTop - box.clientHeight / 3;
      }
    }
    lastLine = li;
  }
}
function onTime() { if (CUR) markActive(currentTime()); }

/* ═══ Chapitres : édition ═══ */
function readEdit() {
  var rows = $('chBox').querySelectorAll('.che'), i, r, out = [];
  for (i = 0; i < rows.length; i++) {
    r = rows[i];
    out.push({
      t: r.querySelector('[data-f="t"]').value,
      title: r.querySelector('[data-f="title"]').value,
      summary: r.querySelector('[data-f="summary"]').value
    });
  }
  return out;
}
function editToChapters(strict) {
  var raw = readEdit(), out = [], i, t;
  for (i = 0; i < raw.length; i++) {
    t = parseClock(raw[i].t);
    if (isNaN(t)) {
      if (strict) { toast('Horodatage invalide : « ' + raw[i].t + ' » (attendu mm:ss ou h:mm:ss)', true); return null; }
      t = 0;
    }
    if (strict && !raw[i].title.trim()) { toast('Un chapitre n\'a pas de titre', true); return null; }
    out.push({ t: t, title: raw[i].title.trim(), summary: raw[i].summary.trim() });
  }
  return out;
}

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.setAttribute('data-label', btn.textContent); btn.textContent = label; btn.disabled = true; }
  else { btn.textContent = btn.getAttribute('data-label') || btn.textContent; btn.disabled = false; }
}

function doImport(btn) {
  if (!CUR) return;
  var id = CUR.booking.id;
  busy(btn, true, 'Import en cours…');
  api('POST', {}, { action: 'import', id: id }).then(function (j) {
    var r = j.result || {};
    if (r.status === 'ready') toast('✓ ' + (r.kept ? 'Replay déjà à jour' : (r.entries || 0) + ' segments importés' + (r.chapters ? ', ' + r.chapters + ' chapitres' : '')));
    else toast(REASONS[r.reason] || 'Rien à importer pour l\'instant', true);
    return openReplay(id, false);
  }).catch(function (e) { busy(btn, false); toast('Import impossible : ' + e.message, true); });
}


function doRegen(btn) {
  if (!CUR) return;
  if (CUR.replay.chaptersEdited && !confirm('Les chapitres ont été retouchés à la main. Les remplacer par une nouvelle proposition de l\'IA ?')) return;
  busy(btn, true, 'Analyse de l\'appel…');
  api('POST', {}, { action: 'regen', id: CUR.booking.id }).then(function (j) {
    CUR.replay.chapters = j.chapters || [];
    CUR.replay.summary = j.summary || '';
    CUR.replay.chaptersEdited = false;
    CUR.replay.chaptersError = null;
    var t = currentTime();
    renderPlayer();
    if (t > 1 && $('rpVideo')) $('rpVideo').currentTime = t;
    toast('✓ ' + CUR.replay.chapters.length + ' chapitres générés');
  }).catch(function (e) { busy(btn, false); toast('Génération impossible : ' + e.message, true); });
}

/* ═══ Analyse IA du closing (programme IA 10/2026) ═══
   bookings/{id}.replay.analysis, produite par api/_aiClosing.js à l'import
   ou via le bouton (action 'analyze'). Chaque objection et la bascule sont
   cliquables : la vidéo saute au moment exact. */
function noteColor(n, max) {
  var r = n / max;
  return r >= 0.75 ? '#34d399' : (r >= 0.5 ? '#fbbf24' : '#f87171');
}
function renderAnalysis() {
  var box = $('anBox');
  if (!box) return;
  var rp = CUR.replay, a = rp.analysis;
  if (!a) {
    box.innerHTML = '<div class="rp-note">' + (rp.analysisError ? '⚠️ ' + esc(rp.analysisError) : 'Pas encore analysé. L\'IA note chaque étape de la trame de closing, repère le moment de bascule et les objections (ajoutées à la bibliothèque <a href="sales-objections.html" style="color:#f9a8d4">Objections</a>).') + '</div>';
    return;
  }
  var h = '<div class="an-score"><div class="n" style="color:' + noteColor(a.score, 100) + '">' + a.score + '<small>/100</small></div><div class="an-verdict">' + esc(a.verdict) + '</div></div>';
  if (a.bascule && a.bascule.description) {
    h += '<div class="an-bascule" data-action="seek" data-t="' + (a.bascule.t || 0) + '">⚡ <b>Bascule à ' + fmtT(a.bascule.t || 0) + '</b> — ' + esc(a.bascule.description) + '</div>';
  }
  if ((a.etapes || []).length) {
    h += '<div class="an-h">Trame de closing</div>';
    a.etapes.forEach(function (e) {
      var n = Math.max(0, Math.min(10, e.note || 0));
      h += '<div class="an-step"><span>' + esc(e.etape) + '</span><b>' + n + '/10</b><div class="bar"><i style="width:' + (n * 10) + '%;background:' + noteColor(n, 10) + '"></i></div>'
        + (e.commentaire ? '<div class="c">' + esc(e.commentaire) + '</div>' : '') + '</div>';
    });
  }
  if ((a.objections || []).length) {
    h += '<div class="an-h">Objections (' + a.objections.length + ')</div>';
    a.objections.forEach(function (o) {
      h += '<div class="an-obj" data-action="seek" data-t="' + (o.t || 0) + '"><q>' + esc(o.quote) + '</q><small>' + fmtT(o.t || 0) + ' · ' + (o.worked ? '✓ levée' : '✕ non levée') + (o.response ? ' — ' + esc(o.response) : '') + '</small></div>';
    });
  }
  function list(title, arr) {
    if (!(arr || []).length) return '';
    return '<div class="an-h">' + title + '</div><ul class="an-ul">' + arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }
  h += list('Points forts', a.pointsForts);
  h += list('Axes de progrès', a.axesProgres);
  if (a.prospect) {
    h += list('Douleurs du prospect', a.prospect.douleurs);
    h += list('Motivations', a.prospect.motivations);
    h += list('Freins', a.prospect.freins);
  }
  if (a.conseilRelance) h += '<div class="an-h">Conseil de relance</div><div class="an-verdict">' + esc(a.conseilRelance) + '</div>';
  box.innerHTML = h;
}
function fmtT(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  var hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
  return (hh ? hh + ':' + (mm < 10 ? '0' : '') : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
}
function doAnalyze(btn) {
  if (!CUR) return;
  busy(btn, true, 'Analyse… (≈ 1 min)');
  api('POST', {}, { action: 'analyze', id: CUR.booking.id }).then(function (j) {
    CUR.replay.analysis = j.analysis;
    CUR.replay.analysisError = null;
    busy(btn, false);
    renderAnalysis();
    btn.textContent = '↻ Réanalyser';
    toast('✓ Analyse terminée — objections ajoutées à la bibliothèque');
  }).catch(function (e) { busy(btn, false); toast('Analyse impossible : ' + e.message, true); });
}

function saveChapters(btn) {
  var list = editToChapters(true);
  if (!list) return;
  busy(btn, true, 'Enregistrement…');
  api('POST', {}, { action: 'chapters', id: CUR.booking.id, chapters: list }).then(function (j) {
    CUR.replay.chapters = j.chapters || [];
    CUR.replay.chaptersEdited = true;
    EDIT = null;
    renderChapters();
    markActive(currentTime());
    toast('✓ Chapitres enregistrés');
  }).catch(function (e) { busy(btn, false); toast('Enregistrement impossible : ' + e.message, true); });
}

/* ═══ Événements (délégation) ═══ */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-action]');
  if (!el) return;
  var act = el.getAttribute('data-action');
  if (act === 'open') { openReplay(el.getAttribute('data-id')); return; }
  if (act === 'back') { ev.preventDefault(); backToList(); loadList(); return; }
  if (act === 'syncAll') { syncAll(); return; }
  if (!CUR) return;
  if (act === 'seek') { seek(el.getAttribute('data-t')); return; }
  if (act === 'import') { doImport(el); return; }
  if (act === 'regen') { doRegen(el); return; }
  if (act === 'analyze') { doAnalyze(el); return; }
  if (act === 'mode') {
    var t = currentTime();
    MODE = MODE === 'native' ? 'drive' : 'native';
    $('rpVideoBox').innerHTML = videoHtml();
    wireVideo();
    if (t > 1) seek(t);
    return;
  }
  if (act === 'chEdit') {
    EDIT = (CUR.replay.chapters || []).map(function (c) { return { t: c.t, title: c.title, summary: c.summary || '' }; });
    renderChapters();
    return;
  }
  if (act === 'chCancel') { EDIT = null; renderChapters(); markActive(currentTime()); return; }
  if (act === 'chAdd') {
    EDIT = editToChapters(false) || [];
    EDIT.push({ t: Math.floor(currentTime()), title: '', summary: '' });
    EDIT.sort(function (a, b) { return a.t - b.t; });
    renderChapters();
    return;
  }
  if (act === 'chDel') {
    EDIT = editToChapters(false) || [];
    EDIT.splice(parseInt(el.getAttribute('data-i'), 10), 1);
    renderChapters();
    return;
  }
  if (act === 'chSave') { saveChapters(el); return; }
});
document.addEventListener('input', function (ev) {
  var id = ev.target.id;
  if (id === 'fQ') renderList();
  else if (id === 'trQ') { $('trList').innerHTML = transcriptRows(); lastLine = -1; }
});
document.addEventListener('change', function (ev) {
  var id = ev.target.id;
  if (id === 'fStatus') renderList();
  else if (id === 'fDays') loadList();
  else if (id === 'trFollow') FOLLOW = ev.target.checked;
});
window.addEventListener('popstate', function () {
  var id = new URLSearchParams(window.location.search).get('id');
  if (id) openReplay(id, false); else { backToList(false); }
});

firebase.auth().onAuthStateChanged(function (u) {
  if (!u) return;
  var role = localStorage.getItem('ambitio_role') || 'coach';
  if (role !== 'admin') { $('lockedView').style.display = ''; return; }
  $('mainView').style.display = '';
  var id = new URLSearchParams(window.location.search).get('id');
  loadList();
  if (id) openReplay(id, false);
});
})();
</script>
