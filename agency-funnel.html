<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Alteore — Tunnel marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Alteore — Tunnel marketing · vue AGENCE (lecture seule)
   Page publique AUTONOME : aucun SDK Firebase, aucune auth, aucun nav.js.
   Seule dépendance : GET /api/agency-funnel?t=TOKEN — qui calcule les KPIs
   à la demande avec funnel-core.js, le module que fait tourner le funnel
   interne. Styles repris de sales.css / sales-funnel.html (mêmes variables,
   mêmes cartes) pour que les deux vues se ressemblent.
   ═══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #08080f;
  --bg2:     #0f0f1a;
  --bg3:     #14141f;
  --bg4:     #1a1a28;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --red3:    #fca5a5;
  --gold:    #f59e0b;
  --green:   #34d399;
  --blue:    #60a5fa;
  --violet:  #a78bfa;
  --text:    rgba(255,255,255,0.92);
  --muted:   rgba(255,255,255,0.48);
  --muted2:  rgba(255,255,255,0.22);
  --font-b:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-m:  'JetBrains Mono', ui-monospace, monospace;
}
html, body {
  min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: var(--font-b); font-size: 14px; line-height: 1.5;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.ag-top { position: sticky; top: 0; z-index: 20; background: rgba(8,8,15,0.96); border-bottom: 1px solid var(--border); backdrop-filter: blur(20px); }
.ag-top-in { max-width: 1320px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ag-logo { width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; background: linear-gradient(135deg,#7f1d1d,#dc2626); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
.ag-brand { font-size: 15px; font-weight: 700; letter-spacing: -0.4px; }
.ag-brand span { color: var(--muted); font-weight: 500; }
.ag-ro { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; padding: 3px 8px; border-radius: 6px; background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
.ag-spacer { flex: 1; }
.ag-mnav { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.ag-mnav button { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 5px 9px; border-radius: 7px; font-family: var(--font-b); }
.ag-mnav button:hover:not(:disabled) { color: var(--text); background: var(--bg4); }
.ag-mnav button:disabled { opacity: .3; cursor: not-allowed; }
.ag-mnav select { background: none; border: none; color: var(--text); font-size: 12.5px; font-weight: 600; font-family: var(--font-b); cursor: pointer; padding: 4px 2px; outline: none; }
.ag-mnav select option { background: var(--bg3); color: var(--text); }
.ag-seg { display: flex; gap: 3px; padding: 3px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; }
.ag-seg button { padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--muted); background: none; border: none; font-family: var(--font-b); transition: all .15s; }
.ag-seg button:hover:not(.active) { color: var(--text); }
.ag-seg button.active { background: var(--bg4); color: var(--text); font-weight: 600; }
.ag-seg button[data-tunnel="elite"].active    { color: var(--violet); }
.ag-seg button[data-tunnel="business"].active { color: var(--blue); }
.ag-top-2 { padding-top: 0; gap: 8px; border-top: 1px solid var(--border); margin-top: 2px; padding-top: 10px; }
.ag-mnav input[type="date"] { background: none; border: none; color: var(--text); font-size: 12.5px; font-family: var(--font-m); padding: 4px 6px; outline: none; color-scheme: dark; }
.ag-arrowto { color: var(--muted); font-size: 12px; }
.ag-ok { background: var(--bg4) !important; color: var(--text) !important; font-size: 11.5px !important; font-weight: 600; padding: 5px 10px !important; }
.ag-range { font-size: 11px; font-family: var(--font-m); color: var(--muted2); white-space: nowrap; }

.ag-main { max-width: 1320px; margin: 0 auto; padding: 20px 24px 60px; }
.ag-stamp { font-size: 11.5px; color: var(--muted); font-family: var(--font-m); background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ag-stamp .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(52,211,153,0.6); flex-shrink: 0; }
.ag-stamp em { font-style: normal; color: var(--muted2); font-family: var(--font-b); }

/* ── Cartes (mêmes classes que le funnel interne) ── */
.ag-hero { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 10px; margin-bottom: 14px; }
.ag-hero-kpi { background: linear-gradient(160deg,var(--bg3),var(--bg2)); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.ag-hero-kpi .v { font-size: 24px; font-weight: 800; letter-spacing: -0.8px; font-family: var(--font-m); }
.ag-hero-kpi .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; font-weight: 700; margin-top: 3px; }
.ag-hero-kpi .s { font-size: 11px; color: var(--muted); margin-top: 3px; }
.ag-hero-kpi .s .pct { color: var(--blue); font-weight: 700; }
.ag-rates { display: flex; flex-wrap: wrap; gap: 8px 26px; background: linear-gradient(160deg,var(--bg3),var(--bg2)); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; align-items: center; }
.ag-rates .rt { font-size: 11.5px; color: var(--muted); }
.ag-rates .rt strong { font-size: 16px; color: var(--text); font-family: var(--font-m); margin-right: 6px; letter-spacing: -0.4px; }

.ag-stage { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
.ag-stage-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.ag-stage-title { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; }
.ag-stage-note { font-size: 11px; color: var(--muted); line-height: 1.5; }
.ag-sub { font-size: 10.5px; font-weight: 800; letter-spacing: 0.7px; margin: 14px 0 8px; }
.ag-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(158px,1fr)); gap: 10px; }
.ag-kpi { background: var(--bg3); border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; }
.ag-kpi .v { font-size: 19px; font-weight: 700; font-family: var(--font-m); letter-spacing: -0.5px; }
.ag-kpi .v.muted { color: var(--muted2); }
.ag-kpi .l { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 3px; line-height: 1.35; }
.ag-kpi .s { font-size: 10.5px; color: var(--muted2); margin-top: 2px; line-height: 1.35; }
.ag-arrow { text-align: center; color: var(--muted2); font-size: 15px; margin: 2px 0 12px; }

.ag-minibars { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.ag-minibar { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
.ag-minibar .mb-l { width: 78px; color: var(--muted); }
.ag-minibar .mb-track { flex: 1; height: 7px; background: var(--bg4); border-radius: 6px; overflow: hidden; }
.ag-minibar .mb-fill { height: 100%; border-radius: 6px; }
.ag-minibar .mb-v { width: 200px; text-align: right; font-family: var(--font-m); font-size: 11px; }

.ag-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--bg2); }
table.ag-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ag-table th { text-align: left; padding: 10px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); border-bottom: 1px solid var(--border2); white-space: nowrap; }
.ag-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.ag-table tr:last-child td { border-bottom: none; }
.ag-table .num { font-family: var(--font-m); font-size: 11.5px; text-align: right; }
.ag-table th.num { text-align: right; }
.ag-utm { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; color: var(--muted); }
.ag-badge { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.3px; }
.ag-badge.ok   { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
.ag-badge.warn { background: rgba(245,158,11,0.12); color: var(--gold);  border: 1px solid rgba(245,158,11,0.25); }
.ag-badge.bad  { background: rgba(239,68,68,0.12);  color: var(--red3);  border: 1px solid rgba(239,68,68,0.25); }

.ag-jr-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; align-items: flex-start; }
.ag-jr-item:last-child { border-bottom: none; }
.ag-jr-date { font-family: var(--font-m); font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; }
.ag-jr-cat { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 12px; background: var(--bg4); border: 1px solid var(--border); white-space: nowrap; }
.ag-jr-text { flex: 1; line-height: 1.45; }

.ag-empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 13px; }
.ag-loading { text-align: center; color: var(--muted); padding: 60px 10px; font-size: 13px; }
.ag-gate { max-width: 460px; margin: 90px auto; text-align: center; background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; padding: 34px 28px; }
.ag-gate .ic { font-size: 34px; margin-bottom: 12px; }
.ag-gate h1 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.ag-gate p { font-size: 13px; color: var(--muted); line-height: 1.6; }
.ag-foot { margin-top: 26px; font-size: 11px; color: var(--muted2); text-align: center; line-height: 1.6; }

@media (max-width: 760px) {
  .ag-top-in { padding: 10px 14px; }
  .ag-main { padding: 16px 12px 44px; }
  .ag-hero-kpi .v { font-size: 19px; }
  .ag-minibar .mb-v { width: 130px; }
}
</style>
</head>
<body>

<div class="ag-top" id="agTop" style="display:none">
  <div class="ag-top-in">
    <div class="ag-logo">A</div>
    <div class="ag-brand">Alteore <span>— Tunnel marketing</span></div>
    <div class="ag-ro">Lecture seule</div>
    <div class="ag-spacer"></div>
    <div class="ag-seg" id="agTunnelSeg">
      <button data-tunnel="all" class="active">Tous</button>
      <button data-tunnel="elite">Élite</button>
      <button data-tunnel="business">Business</button>
    </div>
  </div>
  <div class="ag-top-in ag-top-2">
    <div class="ag-seg" id="agModeSeg">
      <button data-mode="day">Jour</button>
      <button data-mode="month" class="active">Mois</button>
      <button data-mode="7d">7 jours</button>
      <button data-mode="30d">30 jours</button>
      <button data-mode="custom">Plage</button>
    </div>
    <div class="ag-mnav" id="agMonthNav">
      <button id="agPrevM" title="Mois précédent">‹</button>
      <select id="agMonthSel"></select>
      <button id="agNextM" title="Mois suivant">›</button>
    </div>
    <div class="ag-mnav" id="agDayNav" style="display:none">
      <button id="agPrevD" title="Jour précédent">‹</button>
      <input type="date" id="agDayPick">
      <button id="agNextD" title="Jour suivant">›</button>
    </div>
    <div class="ag-mnav" id="agCustom" style="display:none">
      <input type="date" id="agFrom"><span class="ag-arrowto">→</span><input type="date" id="agTo">
      <button id="agCustOk" class="ag-ok">OK</button>
    </div>
    <div class="ag-spacer"></div>
    <div class="ag-range" id="agRange"></div>
  </div>
</div>

<div class="ag-main" id="agRoot">
  <div class="ag-loading">Chargement…</div>
</div>

<script>
(function () {
  'use strict';

  /* ════════════════════════════════════════════════════════════════
     Vue AGENCE — rendu de l'objet `k` renvoyé par /api/agency-funnel.
     ZÉRO calcul métier ici : les chiffres sortent de funnel-core.js, le
     même module que le funnel interne, pour la période et le tunnel
     demandés. Les libellés et les formats sont recopiés de renderFunnel()
     pour que les deux vues disent exactement la même chose.
     ════════════════════════════════════════════════════════════════ */

  var ENDPOINT = '/api/agency-funnel';
  var MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var JCATS = { budget: '💰 Budget', crea: '🎨 Créa', vsl: '🎬 VSL', optin: '📄 Page opt-in', ciblage: '🎯 Ciblage', offre: '💼 Offre', autre: '🔧 Autre' };

  var TUNNEL_LABEL = { all: 'tous tunnels', elite: 'tunnel Élite', business: 'tunnel Business' };

  var TOKEN = '';
  var MONTHS = [];
  var CURRENT = null;          // mois affiché (mode month)
  var TUNNEL = 'all';
  var MODE = 'month';          // day | month | 7d | 30d | custom
  var DAY = null;              // YYYY-MM-DD (mode day)
  var FROM = null, TO = null;  // YYYY-MM-DD (mode custom)
  var busy = false;
  var LASTDATA = null;         // dernière réponse rendue — re-rendu local de la section 🎨
  var UTM_AXIS = 'creative';   // section 🎨 : creative | adset | campaign | channel
  var UTM_SHOWALL = false;     // section 🎨 : déplier les valeurs à < 3 leads

  function $(s) { return document.querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function escAttr(s) { if (s == null) return ''; return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  /* ── Formats — copie conforme de sales-funnel.html ──
     Règle maison : une valeur absente s'affiche « — », jamais un 0 inventé. */
  function pad2(n) { return String(n).length < 2 ? '0' + n : String(n); }
  function fmtNum(v) { if (v == null || isNaN(v) || !isFinite(v)) return '—'; return Math.round(v).toLocaleString('fr-FR'); }
  function fmtEuro(v) { if (v == null || isNaN(v) || !isFinite(v)) return '—'; return Math.round(v).toLocaleString('fr-FR') + ' €'; }
  function fmtEuro2(v) { if (v == null || isNaN(v) || !isFinite(v)) return '—'; return (Math.round(v * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
  function fmtPct(v, dec) { if (v == null || isNaN(v) || !isFinite(v)) return '—'; var f = dec == null ? 1 : dec; return (Math.round(v * Math.pow(10, f)) / Math.pow(10, f)).toLocaleString('fr-FR') + ' %'; }
  function fmtPts(d) { if (d == null || isNaN(d) || !isFinite(d)) return '—'; var r = Math.round(d * 10) / 10; return (r >= 0 ? '+' : '') + r.toLocaleString('fr-FR') + ' pts'; }
  /* « — » quand le 0 n'est pas un vrai 0 mais un manque de statuts RDV. */
  function numOrDash(v, unknown) { return (v === 0 && unknown > 0) ? '—' : fmtNum(v); }
  function monthLabel(mk) {
    if (!mk) return '—';
    var p = String(mk).split('-');
    return (MONTHS_FR[parseInt(p[1], 10) - 1] || '') + ' ' + p[0];
  }
  function frDateTime(ms) {
    if (ms == null) return '—';
    var d = new Date(ms);
    if (isNaN(d.getTime())) return '—';
    return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear() + ' à ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtDelay(ms) {
    if (ms == null || isNaN(ms) || ms < 0) return '—';
    var min = Math.round(ms / 60000);
    if (min < 60) return min + ' min';
    var hh = ms / 3600000;
    if (hh < 48) return (Math.round(hh * 10) / 10).toLocaleString('fr-FR') + ' h';
    return (Math.round(ms / 86400000 * 10) / 10).toLocaleString('fr-FR') + ' j';
  }
  function frDay(iso) { if (!iso) return '—'; var p = String(iso).split('-'); return p[2] + '/' + p[1]; }

  /* Sous-objets de k : absents sur un vieux snapshot → objet neutre. */
  function ch(k, name) { return (k && k[name]) || { n: 0, kept: 0, present: 0, pitched: 0, cancelled: 0, noshow: 0, aVenir: 0, sansDetail: 0, disqua: 0, nonCloses: 0 }; }

  function kpi(value, label, sub, muted) {
    return '<div class="ag-kpi"><div class="v' + (muted ? ' muted' : '') + '">' + value + '</div><div class="l">' + label + '</div>'
      + (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
  }
  function stageOpen(icon, title, note) {
    return '<div class="ag-stage"><div class="ag-stage-head"><div class="ag-stage-title">' + icon + ' ' + title + '</div>'
      + (note ? '<div class="ag-stage-note">' + note + '</div>' : '') + '</div>';
  }

  /* ════════════════════════════════════════════════════════════════
     RENDU
     ════════════════════════════════════════════════════════════════ */
  function renderGate(title, msg) {
    $('#agTop').style.display = 'none';
    $('#agRoot').innerHTML = '<div class="ag-gate"><div class="ic">🔒</div><h1>' + esc(title) + '</h1><p>' + esc(msg) + '</p></div>';
  }

  /* Affiche le sélecteur correspondant au mode et met à jour ses valeurs. */
  function renderControls() {
    $$('#agModeSeg button').forEach(function (b) {
      b.className = b.getAttribute('data-mode') === MODE ? 'active' : '';
    });
    $('#agMonthNav').style.display = MODE === 'month'  ? 'flex' : 'none';
    $('#agDayNav').style.display   = MODE === 'day'    ? 'flex' : 'none';
    $('#agCustom').style.display   = MODE === 'custom' ? 'flex' : 'none';

    if (MODE === 'month' && MONTHS.length) {
      var h = '';
      for (var i = 0; i < MONTHS.length; i++) {
        h += '<option value="' + escAttr(MONTHS[i]) + '"' + (MONTHS[i] === CURRENT ? ' selected' : '') + '>' + esc(monthLabel(MONTHS[i])) + '</option>';
      }
      $('#agMonthSel').innerHTML = h;
      var idx = MONTHS.indexOf(CURRENT);
      /* MONTHS est trié du plus récent au plus ancien : ‹ = index+1. */
      $('#agPrevM').disabled = idx < 0 || idx >= MONTHS.length - 1;
      $('#agNextM').disabled = idx <= 0;
    }
    if (MODE === 'day' && DAY) $('#agDayPick').value = DAY;
    if (MODE === 'custom') {
      if (FROM) $('#agFrom').value = FROM;
      if (TO) $('#agTo').value = TO;
    }
  }

  /* Paramètres de période envoyés à l'API — reflet exact de l'état d'écran. */
  function periodQuery() {
    if (MODE === 'day')    return '&mode=day' + (DAY ? '&day=' + encodeURIComponent(DAY) : '');
    if (MODE === '7d')     return '&mode=7d';
    if (MODE === '30d')    return '&mode=30d';
    if (MODE === 'custom') return '&mode=custom' + (FROM && TO ? '&from=' + encodeURIComponent(FROM) + '&to=' + encodeURIComponent(TO) : '');
    return '&mode=month' + (CURRENT ? '&month=' + encodeURIComponent(CURRENT) : '');
  }

  function periodLabel(data) {
    if (!data) return '';
    if (data.mode === 'month') return monthLabel(data.month);
    if (data.mode === 'day')   return 'Journée du ' + frFull(data.day);
    if (data.mode === '7d')    return '7 derniers jours';
    if (data.mode === '30d')   return '30 derniers jours';
    return 'Du ' + frFull(data.from) + ' au ' + frFull(data.to);
  }
  function frFull(iso) {
    if (!iso) return '—';
    var p = String(iso).split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function renderTunnelSeg() {
    var btns = $$('#agTunnelSeg button');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-tunnel') === TUNNEL;
      btns[i].className = on ? 'active' : '';
    }
  }

  function render(data) {
    LASTDATA = data;
    $('#agTop').style.display = '';
    if (data.mode) MODE = data.mode;
    if (data.month) CURRENT = data.month;
    if (data.day) DAY = data.day;
    if (data.mode === 'custom') { FROM = data.from; TO = data.to; }
    if (data.tunnel) TUNNEL = data.tunnel;
    if (data.months && data.months.length) MONTHS = data.months;
    renderControls();
    renderTunnelSeg();
    $('#agRange').textContent = data.from && data.to ? (frFull(data.from) + ' → ' + frFull(data.to)) : '';

    var root = $('#agRoot');
    var k = data.k;
    var h = '';

    /* Bandeau — les chiffres sont calculés à la demande sur les données du
       moment, pas repris d'un instantané figé. */
    h += '<div class="ag-stamp"><span class="dot"></span>Calculé le ' + esc(frDateTime(data.computedAt))
      + ' <em>· ' + esc(periodLabel(data)) + ' · ' + esc(TUNNEL_LABEL[TUNNEL] || '') + '</em></div>';

    if (!k || !k.leads && !k.spend && !(k.chAll && k.chAll.n) && !k.closesWonTotal) {
      /* Rien du tout sur la période : on le dit, on n'affiche pas une grille
         de zéros qui ressemblerait à un bug. */
      h += '<div class="ag-stage"><div class="ag-empty">Aucune activité sur cette période'
        + (TUNNEL !== 'all' ? ' pour le ' + esc(TUNNEL_LABEL[TUNNEL]) : '') + '.</div></div>';
      root.innerHTML = h;
      return;
    }

    h += renderHero(k);
    h += renderAds(k);
    h += renderBooking(k);
    h += renderLeads(k);
    h += renderAdsPerf(k);
    h += renderProfit(k);
    h += renderInstagram(data.instagram);
    h += renderFacebook(data.facebook);
    h += renderJournal(data.journal || []);

    h += '<div class="ag-foot">Vue agence en lecture seule — Alteore. Chiffres calculés à la demande sur le tunnel interne (pub → opt-in → leads → RDV → closing).<br>Aucune donnée nominative n\'est exposée sur cette page.</div>';
    root.innerHTML = h;
  }

  /* ── 1. Héro — mêmes définitions que la Ligne 1 / Ligne 2 du funnel ── */
  function renderHero(k) {

    var h = '<div class="ag-hero">';

       collecté n'en est que la part déjà encaissée. */
    var reste = (k.wonContracte || 0) - (k.wonCollecte || 0);
    h += '<div class="ag-hero-kpi"><div class="v">' + fmtEuro(k.wonContracte) + '</div><div class="l">Contracté (HT)</div><div class="s">'
      + 'SB ' + fmtEuro(k.wonContracteSB) + ' · NB ' + fmtEuro(k.wonContracteNB)
      + (k.wonContracte > 0 && reste > 0 ? ' · reste à encaisser ' + fmtEuro(reste) : '') + '</div></div>';
    h += '</div>';

    /* Taux de close du mois — présents uniquement si le snapshot les porte. */
    if (k.closeRateRdv != null || k.closeRateLive != null || k.closeRateOffre != null) {
      var oc = k.ocDue || {};
      h += '<div class="ag-rates">';
      h += '<div class="rt"><strong>' + fmtPct(k.closeRateRdv, 1) + '</strong>Taux de close / RDV du mois <span style="color:var(--muted2)">(' + fmtNum(k.closesWonTotal) + ' closes ÷ ' + fmtNum(k.rdvMois) + ' RDV)</span></div>';
      h += '<div class="rt"><strong>' + fmtPct(k.closeRateLive, 1) + '</strong>Taux de close / live <span style="color:var(--muted2)">(' + fmtNum(k.closesWonTotal) + ' ÷ ' + fmtNum(oc.present) + ' présents)</span></div>';
      h += '<div class="rt"><strong>' + fmtPct(k.closeRateOffre, 1) + '</strong>Taux de close / offre <span style="color:var(--muted2)">(' + fmtNum(k.closesWonTotal) + ' ÷ ' + fmtNum(oc.pitched) + ' pitchés)</span></div>';
      h += '</div>';
    }
    return h;
  }

  /* ── 2. Publicité — dépense → CPM/CTR/CPC → opt-in → échelle CPR → ROAS ── */
  function renderAds(k) {
    var sb = ch(k, 'chSB');
    var h = stageOpen('💰', 'Publicité (Meta)', k.hasAds ? (fmtNum(k.adsDays) + ' jour(s) de data') : 'Aucune donnée sur la période');
    h += '<div class="ag-grid">';
    h += kpi(fmtEuro2(k.spend || null), 'Dépense pub', null, !k.hasAds);
    h += kpi(fmtNum(k.impressions || null), 'Impressions', null, !k.hasAds);
    h += kpi(fmtEuro2(k.cpm), 'CPM', 'coût / 1000 impressions');
    h += kpi(fmtNum(k.clicks || null), 'Clics sortants', null, !k.hasAds);
    h += kpi(fmtPct(k.ctr, 2), 'CTR', 'clics / impressions');
    h += kpi(fmtEuro2(k.cpc), 'CPC', 'coût / clic');
    h += kpi(fmtEuro2(k.cpl), 'CPL réel', 'dépense ÷ ' + fmtNum(k.leads) + ' leads réels');
    h += kpi(k.views > 0 ? fmtNum(k.views) : '—', 'Vues page opt-in', k.views > 0 ? null : 'mesure beacon non active', !(k.views > 0));
    if (k.views > 0) h += kpi(fmtPct(k.optinReal), 'Taux d\'opt-in réel', 'leads ÷ vues');
    h += kpi(fmtPct(k.optinClicks), 'Taux d\'opt-in / clics', 'leads ÷ clics Meta');
    h += kpi(k.roasOutcome != null ? (Math.round(k.roasOutcome * 100) / 100).toLocaleString('fr-FR') + '×' : '—', 'ROAS', 'collecté réel (HT) ÷ dépense pub', k.roasOutcome == null);
    h += '</div>';

    /* Échelle CPR — même axe que « RDV pris SB » (RDV self-bookés créés
       sur la période, chaînes de replanification dédupliquées). */
    h += '<div class="ag-sub" style="color:var(--gold)">📉 Coût par RDV — l\'échelle complète (self-booking)</div>';
    h += '<div class="ag-grid">';
    h += kpi(fmtEuro2(k.cprSB), 'CPR', 'dépense ÷ ' + fmtNum(sb.n) + ' RDV SB pris (annulés inclus)', k.cprSB == null);
    h += kpi(fmtEuro2(k.cprKept), 'CPR KEPT', 'dépense ÷ ' + fmtNum(sb.kept) + ' RDV SB kept', k.cprKept == null);
    h += kpi(fmtEuro2(k.cprLive), 'CPR Live', 'dépense ÷ ' + fmtNum(sb.present) + ' RDV SB présents', k.cprLive == null);
    h += kpi(fmtEuro2(k.cprOffre), 'CPR Offre', 'dépense ÷ ' + fmtNum(sb.pitched) + ' RDV SB pitchés', k.cprOffre == null);
    h += '</div>';

    /* A/B tests opt-in — mesure beacon par variante, z-test 2 proportions. */
    if (k.abTests && k.abTests.length) {
      for (var t = 0; t < k.abTests.length; t++) {
        var test = k.abTests[t];
        var vars = test.variants || [];
        if (vars.length < 2) continue;
        var ref = vars[0];
        var refRate = ref.views > 0 ? ref.optins / ref.views * 100 : null;
        h += '<div class="ag-sub" style="color:var(--muted)">🧪 A/B test — page ' + esc(test.page) + ' <span style="font-weight:500;letter-spacing:0;text-transform:none">(variante ' + esc(String(ref.variant).toUpperCase()) + ' = référence)</span></div>';
        h += '<div class="ag-table-wrap"><table class="ag-table"><thead><tr><th>Variante</th><th class="num">Vues</th><th class="num">Opt-ins</th><th class="num">Taux</th><th class="num">Δ vs ' + esc(String(ref.variant).toUpperCase()) + '</th><th>Significativité (95 %)</th></tr></thead><tbody>';
        for (var v = 0; v < vars.length; v++) {
          var va = vars[v];
          var rate = va.views > 0 ? va.optins / va.views * 100 : null;
          var delta = '—', sig = '<span style="color:var(--muted2)">référence</span>';
          if (v > 0) {
            delta = (rate != null && refRate != null) ? fmtPts(rate - refRate) : '—';
            var st = abSignif(ref.views, ref.optins, va.views, va.optins);
            if (!st) sig = '<span style="color:var(--muted2)">échantillon insuffisant (≥ 30 vues/variante)</span>';
            else if (st.p < 0.05) sig = '<span class="ag-badge ' + ((rate || 0) >= (refRate || 0) ? 'ok' : 'bad') + '">✓ significatif · p = ' + st.p.toFixed(3) + '</span>';
            else sig = '<span class="ag-badge warn">en cours · p = ' + st.p.toFixed(2) + '</span>';
          }
          h += '<tr><td><strong>' + esc(String(va.variant).toUpperCase()) + '</strong></td><td class="num">' + fmtNum(va.views) + '</td><td class="num">' + fmtNum(va.optins) + '</td><td class="num">' + fmtPct(rate) + '</td><td class="num">' + delta + '</td><td>' + sig + '</td></tr>';
        }
        h += '</tbody></table></div>';
      }
    }
    h += '</div><div class="ag-arrow">▼</div>';
    return h;
  }

  /* Loi normale (approx. Zelen & Severo) + z-test 2 proportions — recopié du
     funnel pour afficher la MÊME significativité, jamais un calcul divergent. */
  function normCdf(z) {
    var t = 1 / (1 + 0.2316419 * Math.abs(z));
    var d = 0.3989423 * Math.exp(-z * z / 2);
    var pr = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return z > 0 ? 1 - pr : pr;
  }
  function abSignif(vRef, oRef, vChal, oChal) {
    if (vRef < 30 || vChal < 30) return null;
    var pp = (oRef + oChal) / (vRef + vChal);
    var se = Math.sqrt(pp * (1 - pp) * (1 / vRef + 1 / vChal));
    if (!se || !isFinite(se)) return null;
    var z = (oChal / vChal - oRef / vRef) / se;
    return { z: z, p: 2 * (1 - normCdf(Math.abs(z))) };
  }

  /* ── 3. Prise de RDV — Self Booking / No Booking, agrégats seulement ── */
  function renderBooking(k) {
    var sb = ch(k, 'chSB'), nb = ch(k, 'chNB');
    var h = stageOpen('📅', 'Prise de RDV — Self Booking / No Booking',
      'RDV <strong>pris</strong> sur la période, peu importe quand ils ont lieu (replanifications dédupliquées, résultat de fin de chaîne)');

    h += '<div class="ag-sub" style="color:var(--gold)">🔗 Self Booking — le lead prend RDV seul (lien public)</div>';
    h += '<div class="ag-grid">';
    h += kpi(fmtNum(sb.n), 'RDV pris SB', 'LTB (SB) ' + fmtPct(k.ltbSB) + ' — RDV self ÷ leads');
    h += kpi(fmtNum(sb.kept), 'Kept SB', 'pris − <span style="color:var(--red3)">' + fmtNum(sb.cancelled) + ' annulés</span>'
      + (sb.noshow ? ' · <span style="color:var(--gold)">' + fmtNum(sb.noshow) + ' no-show</span> (dans kept)' : '')
      + (sb.aVenir ? ' · ' + fmtNum(sb.aVenir) + ' à venir' : ''));
    h += kpi(numOrDash(sb.present, sb.sansDetail), 'Live SB (présents)',
      (sb.kept > 0 && sb.present > 0 ? 'show-up ' + fmtPct(sb.present / sb.kept * 100, 0) + ' (live ÷ kept)' : 'résultats RDV')
      + (sb.sansDetail ? ' · ⚠ ' + fmtNum(sb.sansDetail) + ' sans détail' : ''));
    h += kpi(numOrDash(sb.pitched, sb.sansDetail), 'Pitchés SB', 'offres faites'
      + (sb.disqua ? ' · ' + fmtNum(sb.disqua) + ' disqualifiés' : '')
      + (sb.nonCloses ? ' · ' + fmtNum(sb.nonCloses) + ' non closes' : ''));
    h += kpi(fmtNum(k.wonSelf), 'Closes SB', 'clients gagnés SB'
      + (sb.pitched > 0 ? ' · ' + fmtPct(k.wonSelf / sb.pitched * 100, 0) + ' des offres' : ''));
    h += kpi(fmtEuro(k.wonCollecteSB), 'Collecté SB (HT)', 'contracté ' + fmtEuro(k.wonContracteSB));
    h += '</div>';

    h += '<div class="ag-sub" style="color:#c4b5fd">📞 No Booking — RDV posés par l\'équipe (lien setter)</div>';
    h += '<div class="ag-grid">';
    h += kpi(fmtNum(k.leadsNoSB), 'Leads à travailler', fmtNum(k.leads) + ' leads de la période − ' + fmtNum(k.cohortSelf) + ' self-bookés');
    h += kpi(fmtNum(nb.n), 'RDV pris NB', 'posés par l\'équipe sur des leads qui n\'avaient pas booké seuls');
    h += kpi(fmtPct(k.recovery), 'Taux de récupération', fmtNum(k.cohortSetter) + ' des ' + fmtNum(k.leadsNoSB) + ' leads sans RDV self ont eu un RDV posé', k.recovery == null);
    h += kpi(fmtNum(nb.kept), 'Kept NB', 'pris − <span style="color:var(--red3)">' + fmtNum(nb.cancelled) + ' annulés</span>'
      + (nb.noshow ? ' · <span style="color:var(--gold)">' + fmtNum(nb.noshow) + ' no-show</span> (dans kept)' : ''));
    h += kpi(numOrDash(nb.present, nb.sansDetail), 'Live NB (présents)',
      (nb.kept > 0 && nb.present > 0 ? 'show-up ' + fmtPct(nb.present / nb.kept * 100, 0) + ' (live ÷ kept)' : 'résultats RDV')
      + (nb.sansDetail ? ' · ⚠ ' + fmtNum(nb.sansDetail) + ' sans détail' : ''));
    /* Pitchés NB — symétrique de la ligne SB : un pitché est toujours un
       sous-ensemble des présents, les deux se lisent côte à côte. */
    h += kpi(numOrDash(nb.pitched, nb.sansDetail), 'Pitchés NB', 'offres faites'
      + (nb.disqua ? ' · ' + fmtNum(nb.disqua) + ' disqualifiés' : '')
      + (nb.nonCloses ? ' · ' + fmtNum(nb.nonCloses) + ' non closes' : ''));
    h += kpi(fmtNum(k.wonSetting), 'Closes NB', 'clients gagnés via un RDV posé par l\'équipe');
    h += '</div>';
    h += '</div><div class="ag-arrow">▼</div>';
    return h;
  }

  /* ── 4. Leads — tunnels ── */
  function renderLeads(k) {
    var byT = k.leadsByTunnel || { elite: 0, business: 0 };
    var rdvT = k.bookedByTunnel || null;
    var total = (byT.elite || 0) + (byT.business || 0);
    var h = stageOpen('👥', 'Leads', null);
    h += '<div class="ag-grid">';
    h += kpi(fmtNum(k.leads), 'Nouveaux leads', 'date d\'entrée réelle dans la période');
    h += kpi('<span style="color:#fb923c">' + fmtNum(k.reoptins) + '</span>', 'Ré-optins 🔄', 'leads antérieurs revenus via opt-in');
    /* Cette répartition porte TOUJOURS sur tous les tunnels (c'est sa raison
       d'être) — dit explicitement, sinon elle se lit de travers quand le
       sélecteur est sur Élite ou Business. */
    h += '<div class="ag-kpi" style="grid-column:span 2;min-width:320px"><div class="l" style="margin-top:0;margin-bottom:6px">Répartition par tunnel (tous) — leads' + (rdvT ? ' &amp; RDV pris' : '') + '</div><div class="ag-minibars">';
    var rows = [['elite', 'Élite', '#a78bfa'], ['business', 'Business', '#60a5fa']];
    for (var i = 0; i < rows.length; i++) {
      var key = rows[i][0], n = byT[key] || 0;
      var pct = total > 0 ? n / total * 100 : 0;
      var rr = rdvT ? (rdvT[key] || 0) : null;
      h += '<div class="ag-minibar"><span class="mb-l">' + rows[i][1] + '</span>'
        + '<span class="mb-track"><span class="mb-fill" style="width:' + pct.toFixed(1) + '%;background:' + rows[i][2] + '"></span></span>'
        + '<span class="mb-v">' + fmtNum(n) + ' leads · ' + fmtPct(pct, 0) + (rr != null ? ' · <strong>' + fmtNum(rr) + ' RDV pris</strong>' : '') + '</span></div>';
    }
    h += '</div></div>';
    h += '</div>';

    h += '</div><div class="ag-arrow">▼</div>';
    return h;
  }

  /* ── 4bis. 🎨 Performance publicitaire — la section complète du funnel
     interne (renderCreativeSection de sales-funnel.html), ventilée sur les
     4 axes : créative / adset / campagne / canal. Les quatre tableaux
     arrivent déjà calculés dans k.utmRowsByAxis — basculer d'axe ou
     déplier les petites lignes ne refait AUCUNE requête, on re-rend la
     page avec la dernière réponse (LASTDATA). Libellés, colonnes et mises
     en garde recopiés du funnel interne pour que les deux vues disent
     exactement la même chose. */
  var UTM_AXIS_LABELS = { creative: 'Créative', adset: 'Adset / audience', campaign: 'Campagne', channel: 'Canal' };
  var UTM_MIN_LEADS = 3;   /* sous ce seuil ET sans RDV ni close → replié */

  function renderAdsPerf(k) {
    var rows = (k.utmRowsByAxis && k.utmRowsByAxis[UTM_AXIS]) || k.utmRows || [];
    var uu = (k.utmUnattrByAxis && k.utmUnattrByAxis[UTM_AXIS]) || k.utmUnattr || {};
    var axisLabel = UTM_AXIS_LABELS[UTM_AXIS] || 'Créative';
    var showSpend = !!k.hasAdLevelSpend;
    /* CPL et ROAS divisent une dépense par un volume de leads : tant que la
       dépense ne couvre pas TOUTE la période, le ratio est faux — dans le
       sens flatteur, ce qui est le pire. Même règle qu'en interne : la
       Dépense partielle reste affichée (annoncée comme telle), les ratios
       sont masqués. */
    var spendComplete = showSpend && k.adSpendComplete === true;
    var showRatios = showSpend && spendComplete;

    var h = stageOpen('🎨', 'Performance publicitaire',
      'axe = attribution capturée à l\'arrivée du lead (attributionFirst), plus le champ UTM écrasable · chaque colonne garde l\'axe de sa section : leads entrés · RDV pris · annulés &amp; no-show ayant lieu · closes gagnés sur la période · qualifiés = score ⭐ 4-5 noté par l\'équipe');

    /* — Sélecteur d'axe — */
    h += '<div style="display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap">';
    h += '<span style="font-size:10.5px;color:var(--muted2);letter-spacing:0.6px;font-weight:700">VENTILER PAR</span>';
    var axes = ['creative', 'adset', 'campaign', 'channel'];
    for (var ai = 0; ai < axes.length; ai++) {
      var ax = axes[ai];
      var on = ax === UTM_AXIS;
      h += '<button type="button" data-utm-axis="' + ax + '" style="cursor:pointer;font:inherit;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid ' + (on ? 'var(--blue)' : 'var(--border2)') + ';background:' + (on ? 'rgba(96,165,250,0.15)' : 'transparent') + ';color:' + (on ? 'var(--blue)' : 'var(--muted)') + '">' + esc(UTM_AXIS_LABELS[ax]) + '</button>';
    }
    h += '</div>';

    /* — Couverture d'attribution : LE chiffre qui dit si le tableau est
         exploitable. Sans lui, un tableau bien rangé mais alimenté par 8 %
         des leads passerait pour une vérité. — */
    if (UTM_AXIS === 'channel') {
      h += '<div class="ag-stage-note" style="margin-top:8px">🚪 <strong>Canal d\'acquisition, pas publicité.</strong> D\'où arrive le lead — VSL, webinaire, Skool, bio Instagram, recommandation. Ces lignes ne portent aucune information de créative : c\'est normal, c\'est tout ce que ces fiches savent dire. Pour la performance des pubs, bascule sur « Créative ».</div>';
    } else if (k.attributedPct != null) {
      var ap = k.attributedPct;
      var apColor = ap >= 80 ? '#34d399' : (ap >= 40 ? '#f59e0b' : '#ef4444');
      h += '<div class="ag-stage-note" style="margin-top:8px">📡 <strong style="color:' + apColor + '">' + fmtPct(ap, 0) + '</strong> des ' + fmtNum(k.leads) + ' leads de la période portent une attribution <strong>publicitaire</strong> structurée (' + fmtNum(k.attributedLeads) + ').';
      if (ap < 80) {
        h += ' Le reste est ventilé sur l\'ancien champ UTM — marqué <span style="color:var(--gold)">⚠</span> dans le tableau : ces lignes peuvent avoir été écrasées par un titre de formulaire ou un nom de tunnel. Les leads dont la seule origine connue est un canal (VSL, webinaire…) sont sur l\'axe <strong>Canal</strong>, pas ici.';
      }
      h += ' La capture ne vaut que pour les leads entrés après la mise en place du 17/08/2026 ; l\'historique remonte au fur et à mesure du backfill.</div>';
    }
    if (k.creativeIndexSize === 0 && UTM_AXIS !== 'channel') {
      h += '<div class="ag-stage-note" style="margin-top:6px">ℹ Référentiel créatives vide : les UTM ne portant qu\'un identifiant Meta restent affichés « ID 1202466… », et ni l\'adset ni la campagne ne peuvent en être déduits.</div>';
    }
    if (showSpend && !spendComplete) {
      h += '<div class="ag-stage-note" style="margin-top:6px;border-left:3px solid var(--gold);padding-left:8px">'
        + '⚠ <strong>Dépense incomplète : ' + fmtNum(k.adSpendDaysCovered) + ' jour' + (k.adSpendDaysCovered > 1 ? 's' : '') + ' sur ' + fmtNum(k.adSpendDaysExpected) + '</strong> de la période ont de la donnée publicitaire. '
        + 'La colonne Dépense ne montre donc qu\'une <strong>partie</strong> du budget réel, alors que la colonne Leads couvre tout. '
        + '<strong>CPL et ROAS sont masqués</strong> tant que c\'est le cas : les calculer reviendrait à diviser un jour de dépense par un mois de leads, et à afficher un coût par lead bien trop flatteur.</div>';
    }

    if (!rows.length) {
      h += '<div class="ag-empty" style="padding:14px">Aucun lead sur la période.</div></div><div class="ag-arrow">▼</div>';
      return h;
    }

    /* Axe structurellement vide : tous les leads dans le seau « non
       attribué ». Rien d'un bug — le champ UTM historique n'a jamais porté
       ni campagne ni adset, et le dire vaut mieux qu'une ligne grise que
       personne ne sait interpréter. */
    var namedLeads = 0;
    for (var ni = 0; ni < rows.length; ni++) {
      if (rows[ni].key !== '—' && rows[ni].key !== '— non attribué') namedLeads += rows[ni].leads;
    }
    if (namedLeads === 0 && (UTM_AXIS === 'campaign' || UTM_AXIS === 'adset')) {
      h += '<div class="ag-stage-note" style="margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:8px">'
        + '🚧 <strong>Aucun' + (UTM_AXIS === 'campaign' ? 'e campagne' : ' adset') + ' sur la période.</strong> '
        + 'Le champ UTM historique ne transportait que le nom de la publicité. '
        + 'Cet axe se remplit dès que le template d\'URL Meta envoie <code>utm_' + (UTM_AXIS === 'campaign' ? 'campaign={{campaign.name}}' : 'term={{adset.name}}') + '</code>.</div>';
    }

    /* — Repli du bruit : une ligne à 1-2 leads SANS RDV ni close n'apprend
         rien et noie les lignes utiles. Elle reste comptée, agrégée dans
         « Autres », et le détail est dépliable. Les lignes « Hors pub » ne
         se replient jamais : ce sont déjà des agrégats par canal. — */
    var main = [], small = [];
    for (var ri = 0; ri < rows.length; ri++) {
      var r0 = rows[ri];
      if (!r0.outOfAds && !UTM_SHOWALL && r0.leads < UTM_MIN_LEADS && !r0.booked && !r0.closes) small.push(r0);
      else main.push(r0);
    }
    if (small.length) {
      var agg = { key: 'Autres (' + small.length + ' valeur' + (small.length > 1 ? 's' : '') + ' à moins de ' + UTM_MIN_LEADS + ' leads)',
        leads: 0, scoreSum: 0, scoreN: 0, qual: 0, booked: 0, cancelled: 0, noshow: 0,
        closes: 0, col: 0, spend: 0, hasSpend: false, legacy: false, _agg: true };
      for (var sj = 0; sj < small.length; sj++) {
        var sr = small[sj];
        agg.leads += sr.leads; agg.scoreSum += sr.scoreSum || 0; agg.scoreN += sr.scoreN || 0;
        agg.qual += sr.qual || 0; agg.booked += sr.booked; agg.cancelled += sr.cancelled;
        agg.noshow += sr.noshow; agg.closes += sr.closes; agg.col += sr.col;
        agg.spend += sr.spend || 0; if (sr.hasSpend) agg.hasSpend = true;
        if (sr.legacy) agg.legacy = true;
      }
      agg.cpl = (agg.hasSpend && agg.leads > 0) ? agg.spend / agg.leads : null;
      agg.roas = (agg.hasSpend && agg.spend > 0 && agg.col > 0) ? agg.col / agg.spend : null;
      main.push(agg);
    }

    h += '<div class="ag-table-wrap" style="margin-top:10px"><table class="ag-table"><thead><tr>';
    h += '<th>' + esc(axisLabel) + '</th><th class="num">Leads</th><th class="num">Score moy ⭐</th><th class="num">Qualifiés 4-5</th>'
      + '<th class="num">RDV pris</th><th class="num">Annulés</th><th class="num">No-show</th>'
      + '<th class="num">Closes</th><th class="num">Collecté HT</th>';
    if (showSpend) {
      h += '<th class="num">Dépense' + (spendComplete ? '' : ' <span style="color:var(--gold)" title="Partielle — ' + k.adSpendDaysCovered + ' j sur ' + k.adSpendDaysExpected + '">⚠</span>') + '</th>';
      if (showRatios) h += '<th class="num">CPL</th><th class="num">ROAS</th>';
    }
    h += '</tr></thead><tbody>';

    for (var mi = 0; mi < main.length; mi++) {
      var r = main[mi];
      var avg = r.scoreN ? Math.round(r.scoreSum / r.scoreN * 10) / 10 : null;
      var avgColor = avg == null ? 'var(--muted2)' : (avg >= 4 ? '#34d399' : (avg >= 3 ? '#f59e0b' : '#ef4444'));
      /* Le taux de close reste un vrai ratio de cohorte : numérateur et
         dénominateur portent tous deux sur des leads. Le ratio RDV/leads,
         lui, ne l'est pas — il n'est pas affiché en pourcentage. */
      var closePct = (r.leads > 0 && r.closes > 0) ? ' <span style="color:var(--muted2);font-size:10px">' + fmtPct(r.closes / r.leads * 100, 1) + '</span>' : '';
      /* Le ⚠ signale une attribution PUBLICITAIRE douteuse. Une ligne
         « Hors pub » n'en est pas une : elle est nommée et assumée. */
      var mark = (r.legacy && !r._agg && !r.outOfAds)
        ? '<span style="color:var(--gold)" title="Ligne issue de l\'ancien champ UTM, sans attribution capturée — valeur potentiellement écrasée par un titre de formulaire ou un nom de tunnel">⚠ </span>' : '';
      h += '<tr' + (r._agg ? ' style="opacity:0.75"' : '') + '>';
      h += '<td>' + mark + '<span class="ag-utm" title="' + escAttr(r.key) + '">' + esc(r.key) + '</span></td>';
      h += '<td class="num">' + fmtNum(r.leads) + '</td>';
      h += '<td class="num" style="color:' + avgColor + '">' + (avg == null ? '—' : '⭐ ' + avg.toLocaleString('fr-FR')) + (r.scoreN ? ' <span style="color:var(--muted2);font-size:10px">(' + r.scoreN + ' noté' + (r.scoreN > 1 ? 's' : '') + ')</span>' : '') + '</td>';
      h += '<td class="num">' + (r.scoreN ? fmtNum(r.qual) : '—') + '</td>';
      h += '<td class="num">' + fmtNum(r.booked) + '</td>';
      h += '<td class="num"' + (r.cancelled ? ' style="color:var(--red3)"' : '') + '>' + fmtNum(r.cancelled) + '</td>';
      h += '<td class="num"' + (r.noshow ? ' style="color:var(--gold)"' : '') + '>' + fmtNum(r.noshow) + '</td>';
      h += '<td class="num"' + (r.closes ? ' style="color:#34d399;font-weight:700"' : '') + '>' + fmtNum(r.closes) + closePct + '</td>';
      h += '<td class="num">' + (r.closes ? fmtEuro(r.col) : '—') + '</td>';
      if (showSpend) {
        h += '<td class="num"' + (spendComplete ? '' : ' style="color:var(--muted)" title="Dépense partielle sur la période"') + '>' + (r.hasSpend ? fmtEuro(r.spend) : '—') + '</td>';
        if (showRatios) {
          h += '<td class="num">' + (r.cpl != null ? fmtEuro2(r.cpl) : '—') + '</td>';
          h += '<td class="num"' + (r.roas != null && r.roas >= 1 ? ' style="color:#34d399;font-weight:700"' : '') + '>' + (r.roas != null ? r.roas.toFixed(2).replace('.', ',') + '×' : '—') + '</td>';
        }
      }
      h += '</tr>';
    }
    h += '</tbody></table></div>';

    if (small.length || UTM_SHOWALL) {
      h += '<div style="margin-top:8px"><button type="button" data-utm-more="1" style="cursor:pointer;font:inherit;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted)">'
        + (UTM_SHOWALL ? '▲ Replier les valeurs à moins de ' + UTM_MIN_LEADS + ' leads' : '▼ Déplier les ' + small.length + ' valeur' + (small.length > 1 ? 's' : '') + ' repliée' + (small.length > 1 ? 's' : ''))
        + '</button></div>';
    }

    if (uu.booked || uu.cancelled || uu.noshow || uu.closes) {
      var parts = [];
      if (uu.booked) parts.push(fmtNum(uu.booked) + ' RDV pris');
      if (uu.cancelled) parts.push(fmtNum(uu.cancelled) + ' annulé(s)');
      if (uu.noshow) parts.push(fmtNum(uu.noshow) + ' no-show');
      if (uu.closes) parts.push(fmtNum(uu.closes) + ' close(s)');
      h += '<div class="ag-stage-note" style="margin-top:8px">⚠ Non ventilables : ' + parts.join(' · ')
        + ' — lead entré avant la période et sans ré-optin, ou close sans fiche liée. Comptés dans les totaux des sections, absents du tableau.</div>';
    }
    h += '<div class="ag-stage-note" style="margin-top:6px">Le ratio RDV/leads n\'est volontairement pas affiché : les RDV incluent ceux de leads ré-optinés entrés avant la période, le pourcentage pouvait dépasser 100 %. Le LTB fiable est dans « Prise de RDV ».</div>';
    h += '<div class="ag-stage-note" style="margin-top:6px">Le score ⭐ est la qualité du lead notée par l\'équipe après appel (1 à 5). Le nombre entre parenthèses dit combien de leads de la ligne ont été notés — une moyenne sur 2 notes ne vaut pas une moyenne sur 30.</div>';
    h += '<div class="ag-stage-note" style="margin-top:6px">Les lignes « Hors pub » regroupent les leads venus d\'ailleurs que de la publicité (Instagram organique, lien partagé, setting téléphonique). Elles sont là pour que les totaux tombent juste, pas pour être optimisées.</div>';
    h += '</div><div class="ag-arrow">▼</div>';
    return h;
  }

  /* ── 5. Rentabilité — CPL · CAC Market Only · AOV ── */
  function renderProfit(k) {
    var h = stageOpen('💶', 'Rentabilité', 'collecté = encaissements réels (HT) rattachés aux clients gagnés sur la période');
    h += '<div class="ag-grid">';
    h += kpi(fmtEuro2(k.cpl), 'CPL', 'dépense ÷ ' + fmtNum(k.leads) + ' leads', k.cpl == null);
    h += kpi(fmtEuro2(k.cacMarketOnly), 'CAC Market Only', 'dépense pub ÷ ' + fmtNum(k.closesWonTotal) + ' client(s) acquis — ≠ « CPA » Meta', k.cacMarketOnly == null);
    h += kpi(k.aovAll != null ? fmtEuro2(k.aovAll) : '—', 'AOV', 'collecté ' + fmtEuro(k.wonCollecte) + ' ÷ ' + fmtNum(k.closesWonTotal) + ' client(s)', k.aovAll == null);
    h += '</div></div><div class="ag-arrow">▼</div>';
    return h;
  }

  /* ── 6. Journal marketing (sans auteur) ── */
  /* ── 6. Instagram organique ──
     Audience des publications, et rien d'autre. Les pseudos des
     commentateurs et les messages privés ne transitent pas par cette page :
     l'API ne les envoie pas, et cette fonction ne saurait pas quoi en faire.
     Le compteur GO est un NOMBRE de commentaires portant le mot-clé — il ne
     dit jamais qui l'a écrit. */
  function renderInstagram(ig) {
    if (!ig || !ig.publications || !ig.publications.length) return '';
    var c = ig.compte || {};
    var h = stageOpen('📸', 'Instagram organique', ig.publications.length + ' publication(s) · '
      + (ig.jours || 0) + ' jour(s) de mesure d\'audience');

    h += '<div class="ag-grid">';
    h += kpi(fmtNum(c.followers), 'Abonnés',
             c.followersDelta != null ? ((c.followersDelta >= 0 ? '+' : '') + fmtNum(c.followersDelta) + ' sur la période') : null,
             c.followers == null);
    h += kpi(fmtNum(c.reach || null), 'Portée cumulée', 'somme des portées quotidiennes', !c.reach);
    h += kpi(fmtNum(c.views || null), 'Vues', 'toutes publications', !c.views);
    h += kpi(fmtNum(c.profileViews || null), 'Visites de profil', null, !c.profileViews);
    h += kpi(fmtNum(c.websiteClicks || null), 'Clics lien en bio', null, !c.websiteClicks);
    h += kpi(fmtNum(c.totalInteractions || null), 'Interactions', 'likes + comm. + saves + partages', !c.totalInteractions);
    h += '</div>';

    /* Même mise en garde que côté interne : la portée cumulée est un volume
       d'exposition, pas un nombre de personnes. Une agence qui la lirait
       comme une audience unique surestimerait la couverture. */
    if (c.reach) {
      h += '<div class="ag-stage-note" style="margin-top:10px">⚠️ La <strong>portée cumulée</strong> additionne des portées quotidiennes déjà dédupliquées jour par jour : une même personne touchée trois jours de suite y compte trois fois. À lire comme un volume d\'exposition, jamais comme un nombre de personnes.</div>';
    }

    /* ── Messages privés ──
       Uniquement des agrégats, calculés côté serveur. Aucun pseudo, aucun
       contenu de message : la question posée ici est « le canal
       convertit-il ? », pas « qui a écrit quoi ». */
    var dm = ig.dm;
    if (dm && dm.conversations) {
      h += '<div class="ag-stage-note" style="margin-top:16px;color:var(--text);font-weight:700">💬 Messages privés</div>';
      h += '<div class="ag-grid" style="margin-top:8px">';
      h += kpi(dm.initiesNous ? fmtPct(dm.tauxReponse) : '—', 'Taux de réponse',
               dm.repondus + ' / ' + dm.initiesNous + ' conversations ouvertes par nous', !dm.initiesNous);
      h += kpi(fmtNum(dm.sortants || null), 'Messages envoyés', null, !dm.sortants);
      h += kpi(fmtNum(dm.entrants || null), 'Messages reçus', null, !dm.entrants);
      h += kpi(fmtDelay(dm.delaiMedianMs), 'Délai médian de réponse', 'côté prospect', dm.delaiMedianMs == null);
      h += kpi(fmtNum(dm.initiesEux || null), 'Conversations entrantes', 'ouvertes par le prospect', !dm.initiesEux);
      h += kpi(fmtDelay(dm.notreDelaiMedianMs), 'Notre délai de réponse', 'sur les conversations entrantes', dm.notreDelaiMedianMs == null);
      h += kpi(fmtNum(dm.rattacheesFiche || null), 'Devenues un contact',
               dm.conversations ? fmtPct(dm.rattacheesFiche / dm.conversations * 100, 0) + ' des conversations' : null,
               !dm.rattacheesFiche);
      h += '</div>';
      h += '<div class="ag-stage-note" style="margin-top:8px">Conversations <strong>ouvertes</strong> pendant la période. Instagram n\'expose aucun historique de messagerie : ces chiffres ne comptent que ce qui a été observé depuis la mise en service du suivi.</div>';
    }

    /* Les publications, de la plus performante à la moins : sur cette page
       c'est le classement qui sert, pas la chronologie. */
    var arr = ig.publications.slice().sort(function (x, y) {
      return (Number(y.reach) || 0) - (Number(x.reach) || 0);
    });
    var top = arr.slice(0, 25);

    h += '<div class="ag-table-wrap" style="margin-top:12px"><table class="ag-table"><thead><tr>';
    h += '<th>Publiée</th><th>Publication</th><th class="num">Portée</th><th class="num">Vues</th>';
    h += '<th class="num">Likes</th><th class="num">Comm.</th><th class="num">GO</th><th class="num">GO ↔ contact</th>';
    h += '<th class="num">Saves</th><th class="num">Partages</th><th class="num">Engag.</th>';
    h += '</tr></thead><tbody>';

    var tot = { reach: 0, views: 0, likes: 0, comments: 0, go: 0, goLeads: 0, saved: 0, shares: 0 };
    arr.forEach(function (m) {
      tot.reach += (Number(m.reach) || 0); tot.views += (Number(m.views) || 0);
      tot.likes += (Number(m.likes) || 0); tot.comments += (Number(m.comments) || 0);
      tot.go += (Number(m.goCount) || 0); tot.goLeads += (Number(m.goLeads) || 0);
      tot.saved += (Number(m.saved) || 0);
      tot.shares += (Number(m.shares) || 0);
    });

    top.forEach(function (m) {
      var cap = (m.caption || '').replace(/\s+/g, ' ').trim();
      if (cap.length > 58) cap = cap.slice(0, 58) + '…';
      if (!cap) cap = '(sans légende)';
      h += '<tr>';
      h += '<td style="white-space:nowrap;color:var(--muted)">' + esc(frDay(m.date)) + '</td>';
      h += '<td>' + (m.permalink
        ? '<a href="' + esc(m.permalink) + '" target="_blank" rel="noopener noreferrer" style="color:var(--text);text-decoration:none">' + esc(cap) + '</a>'
        : esc(cap))
        + ' <span style="font-size:9px;font-weight:700;color:var(--muted2)">' + (m.isReel ? 'REEL' : 'POST') + '</span></td>';
      h += '<td class="num">' + fmtNum(m.reach) + '</td>';
      h += '<td class="num">' + fmtNum(m.views) + '</td>';
      h += '<td class="num">' + fmtNum(m.likes) + '</td>';
      h += '<td class="num">' + fmtNum(m.comments) + '</td>';
      h += '<td class="num" style="font-weight:700">' + (m.goCount == null ? '—' : fmtNum(m.goCount)) + '</td>';
      h += '<td class="num">' + (m.goLeads == null ? '—' : fmtNum(m.goLeads)) + '</td>';
      h += '<td class="num">' + fmtNum(m.saved) + '</td>';
      h += '<td class="num">' + fmtNum(m.shares) + '</td>';
      h += '<td class="num">' + fmtPct(m.engagementRate) + '</td>';
      h += '</tr>';
    });

    h += '<tr style="border-top:2px solid var(--border2);font-weight:700;background:var(--bg3)">';
    h += '<td>Total</td><td>' + arr.length + ' publication(s)</td>';
    h += '<td class="num">' + fmtNum(tot.reach) + '</td><td class="num">' + fmtNum(tot.views) + '</td>';
    h += '<td class="num">' + fmtNum(tot.likes) + '</td><td class="num">' + fmtNum(tot.comments) + '</td>';
    h += '<td class="num">' + fmtNum(tot.go) + '</td><td class="num">' + fmtNum(tot.goLeads) + '</td>';
    h += '<td class="num">' + fmtNum(tot.saved) + '</td>';
    h += '<td class="num">' + fmtNum(tot.shares) + '</td><td class="num">—</td>';
    h += '</tr>';
    h += '</tbody></table></div>';

    if (arr.length > top.length) {
      h += '<div class="ag-stage-note" style="margin-top:8px">Les ' + top.length + ' publications les plus vues sont détaillées ; le total porte sur les ' + arr.length + '.</div>';
    }
    h += '<div class="ag-stage-note" style="margin-top:8px"><strong>GO</strong> = nombre de commentaires contenant le mot-clé de l\'appel à l\'action, réponses comprises ; les commentaires du compte lui-même ne sont pas comptés. <strong>GO ↔ contact</strong> = ceux dont l\'auteur est déjà une fiche dans le CRM — l\'écart entre les deux colonnes est le volume de prise de contact restant à faire.</div>';
    h += '</div>';
    return h;
  }

  /* ── 7. Facebook ──
     Section distincte d'Instagram, et pas par commodité : la portée
     Facebook et la portée Instagram ne se définissent pas de la même
     façon. Les additionner donnerait un total d'apparence solide et de
     sens nul. Ici comme ailleurs, aucun nom de commentateur ni contenu de
     message ne transite — l'API ne les envoie pas. */
  function renderFacebook(fb) {
    if (!fb || !fb.publications || !fb.publications.length) return '';
    var p = fb.page || {};
    var h = stageOpen('📘', 'Facebook', fb.publications.length + ' publication(s) · '
      + (fb.jours || 0) + ' jour(s) de mesure d\'audience');

    h += '<div class="ag-grid">';
    h += kpi(fmtNum(p.followers), 'Abonnés',
             p.followersDelta != null ? ((p.followersDelta >= 0 ? '+' : '') + fmtNum(p.followersDelta) + ' sur la période') : null,
             p.followers == null);
    h += kpi(p.nouveauxAbonnes ? '+' + fmtNum(p.nouveauxAbonnes) : '—', 'Nouveaux abonnés', 'sur la période', !p.nouveauxAbonnes);
    h += kpi(fmtNum(p.videoViews || null), 'Vues vidéo', 'toutes publications', !p.videoViews);
    h += kpi(fmtNum(p.engagements || null), 'Engagements', 'clics, réactions, commentaires', !p.engagements);
    h += kpi(fmtNum(p.pageViews || null), 'Vues de la Page', null, !p.pageViews);
    if (p.reach) h += kpi(fmtNum(p.reach), 'Portée cumulée', 'personnes touchées / jour', false);
    h += '</div>';
    h += '<div class="ag-stage-note" style="margin-top:10px">📉 <strong>La portée de Page n\'existe plus</strong> : Meta a supprimé 85 métriques de portée et d\'impressions le 15/06/2026, sans remplaçante à ce niveau. Les vues vidéo sont le seul volume d\'exposition encore servi. Au niveau des publications, la portée est bien là. Rien de tout cela ne se compare à Instagram, qui ne définit rien pareil.</div>';

    var dm = fb.dm;
    if (dm && dm.conversations) {
      h += '<div class="ag-stage-note" style="margin-top:16px;color:var(--text);font-weight:700">💬 Messenger</div>';
      h += '<div class="ag-grid" style="margin-top:8px">';
      h += kpi(dm.initiesNous ? fmtPct(dm.tauxReponse) : '—', 'Taux de réponse',
               dm.repondus + ' / ' + dm.initiesNous + ' conversations ouvertes par nous', !dm.initiesNous);
      h += kpi(fmtNum(dm.sortants || null), 'Messages envoyés', null, !dm.sortants);
      h += kpi(fmtNum(dm.entrants || null), 'Messages reçus', null, !dm.entrants);
      h += kpi(fmtDelay(dm.delaiMedianMs), 'Délai médian de réponse', 'côté prospect', dm.delaiMedianMs == null);
      h += kpi(fmtNum(dm.initiesEux || null), 'Conversations entrantes', 'ouvertes par le prospect', !dm.initiesEux);
      h += kpi(fmtDelay(dm.notreDelaiMedianMs), 'Notre délai de réponse', 'sur les conversations entrantes', dm.notreDelaiMedianMs == null);
      h += kpi(fmtNum(dm.rattacheesFiche || null), 'Devenues un contact',
               dm.conversations ? fmtPct(dm.rattacheesFiche / dm.conversations * 100, 0) + ' des conversations' : null,
               !dm.rattacheesFiche);
      h += '</div>';
    }

    var arr = fb.publications.slice().sort(function (x, y) {
      return (Number(y.reach) || 0) - (Number(x.reach) || 0);
    });
    var top = arr.slice(0, 25);

    h += '<div class="ag-table-wrap" style="margin-top:12px"><table class="ag-table"><thead><tr>';
    h += '<th>Publiée</th><th>Publication</th><th class="num">Portée</th><th class="num">Vues</th>';
    h += '<th class="num">Réactions</th><th class="num">Comm.</th><th class="num">GO</th>';
    h += '<th class="num">GO ↔ contact</th><th class="num">Partages</th><th class="num">Clics</th><th class="num">Engag.</th>';
    h += '</tr></thead><tbody>';

    var tot = { reach: 0, impressions: 0, reactions: 0, comments: 0, go: 0, goLeads: 0, shares: 0, clicks: 0 };
    arr.forEach(function (m) {
      tot.reach += (Number(m.reach) || 0); tot.impressions += (Number(m.impressions) || 0);
      tot.reactions += (Number(m.reactions) || 0); tot.comments += (Number(m.comments) || 0);
      tot.go += (Number(m.goCount) || 0); tot.goLeads += (Number(m.goLeads) || 0);
      tot.shares += (Number(m.shares) || 0); tot.clicks += (Number(m.clicks) || 0);
    });

    top.forEach(function (m) {
      var cap = (m.message || '').replace(/\s+/g, ' ').trim();
      if (cap.length > 58) cap = cap.slice(0, 58) + '…';
      if (!cap) cap = '(sans texte)';
      h += '<tr>';
      h += '<td style="white-space:nowrap;color:var(--muted)">' + esc(frDay(m.date)) + '</td>';
      h += '<td>' + (m.permalink
        ? '<a href="' + esc(m.permalink) + '" target="_blank" rel="noopener noreferrer" style="color:var(--text);text-decoration:none">' + esc(cap) + '</a>'
        : esc(cap))
        + ' <span style="font-size:9px;font-weight:700;color:var(--muted2)">' + (m.isVideo ? 'VIDÉO' : 'POST') + '</span></td>';
      h += '<td class="num">' + fmtNum(m.reach) + '</td>';
      h += '<td class="num">' + fmtNum(m.impressions) + '</td>';
      h += '<td class="num">' + fmtNum(m.reactions) + '</td>';
      h += '<td class="num">' + fmtNum(m.comments) + '</td>';
      h += '<td class="num" style="font-weight:700">' + (m.goCount == null ? '—' : fmtNum(m.goCount)) + '</td>';
      h += '<td class="num">' + (m.goLeads == null ? '—' : fmtNum(m.goLeads)) + '</td>';
      h += '<td class="num">' + fmtNum(m.shares) + '</td>';
      h += '<td class="num">' + fmtNum(m.clicks) + '</td>';
      h += '<td class="num">' + fmtPct(m.engagementRate) + '</td>';
      h += '</tr>';
    });

    h += '<tr style="border-top:2px solid var(--border2);font-weight:700;background:var(--bg3)">';
    h += '<td>Total</td><td>' + arr.length + ' publication(s)</td>';
    h += '<td class="num">' + fmtNum(tot.reach) + '</td><td class="num">' + fmtNum(tot.impressions) + '</td>';
    h += '<td class="num">' + fmtNum(tot.reactions) + '</td><td class="num">' + fmtNum(tot.comments) + '</td>';
    h += '<td class="num">' + fmtNum(tot.go) + '</td><td class="num">' + fmtNum(tot.goLeads) + '</td>';
    h += '<td class="num">' + fmtNum(tot.shares) + '</td><td class="num">' + fmtNum(tot.clicks) + '</td><td class="num">—</td>';
    h += '</tr></tbody></table></div>';

    if (arr.length > top.length) {
      h += '<div class="ag-stage-note" style="margin-top:8px">Les ' + top.length + ' publications les plus vues sont détaillées ; le total porte sur les ' + arr.length + '.</div>';
    }
    h += '</div>';
    return h;
  }

  function renderJournal(journal) {
    var h = stageOpen('📒', 'Journal marketing de la période', 'changements consignés par l\'équipe (créa, budget, ciblage, VSL…)');
    if (!journal.length) {
      h += '<div class="ag-empty" style="padding:14px">Aucune action consignée sur la période.</div>';
    } else {
      h += '<div>';
      for (var i = 0; i < journal.length; i++) {
        var j = journal[i];
        h += '<div class="ag-jr-item">';
        h += '<span class="ag-jr-date">' + esc(frDay(j.date)) + '</span>';
        h += '<span class="ag-jr-cat">' + esc(JCATS[j.category] || JCATS.autre) + '</span>';
        h += '<span class="ag-jr-text">' + esc(j.text || '') + '</span>';
        h += '</div>';
      }
      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  /* ════════════════════════════════════════════════════════════════
     CHARGEMENT
     ════════════════════════════════════════════════════════════════ */
  function load() {
    if (busy) return;
    busy = true;
    var url = ENDPOINT + '?t=' + encodeURIComponent(TOKEN)
      + periodQuery()
      + '&tunnel=' + encodeURIComponent(TUNNEL);
    fetch(url, { method: 'GET', credentials: 'omit', cache: 'no-store' })
      .then(function (r) {
        if (r.status === 403) { renderGate('Lien invalide ou révoqué', 'Ce lien n\'est plus valable. Demande un nouveau lien à ton contact chez Alteore.'); return null; }
        /* Statut inattendu : message neutre à l'écran, détail dans la console
           (diagnostic possible sans rien révéler sur la page). */
        if (!r.ok) { if (window.console) console.warn('[agency-funnel] HTTP ' + r.status); throw new Error('http_' + r.status); }
        return r.json();
      })
      .then(function (data) {
        if (!data) return;
        if (data.ok !== true) { renderGate('Lien invalide ou révoqué', 'Ce lien n\'est plus valable. Demande un nouveau lien à ton contact chez Alteore.'); return; }
        render(data);
      })
      .catch(function () {
        $('#agTop').style.display = '';
        $('#agRoot').innerHTML = '<div class="ag-stage"><div class="ag-empty">Impossible de charger les données pour le moment. Réessaie dans un instant.</div></div>';
      })
      .then(function () { busy = false; });
  }

  /* Un seul point d'entrée pour toute navigation : on met à jour l'état,
     on montre l'attente, on recharge. Le calcul étant fait à la demande
     côté serveur, chaque changement est une vraie requête. */
  function go(label) {
    if (busy) return;
    renderControls();
    $('#agRoot').innerHTML = '<div class="ag-loading">Calcul en cours' + (label ? ' — ' + esc(label) : '') + '…</div>';
    load();
  }

  function shiftDay(delta) {
    var base = DAY ? new Date(DAY.slice(0, 4), +DAY.slice(5, 7) - 1, +DAY.slice(8, 10)) : new Date();
    base.setDate(base.getDate() + delta);
    DAY = base.getFullYear() + '-' + pad2(base.getMonth() + 1) + '-' + pad2(base.getDate());
    go(frFull(DAY));
  }

  function init() {
    var m = (window.location.search || '').match(/[?&]t=([^&]+)/);
    TOKEN = m ? decodeURIComponent(m[1]) : '';
    if (!TOKEN) {
      renderGate('Lien invalide ou révoqué', 'Ce lien n\'est plus valable. Demande un nouveau lien à ton contact chez Alteore.');
      return;
    }

    $$('#agModeSeg button').forEach(function (b) {
      b.onclick = function () {
        var mode = b.getAttribute('data-mode');
        if (mode === MODE) return;
        MODE = mode;
        if (mode === 'day' && !DAY) {
          var n = new Date();
          DAY = n.getFullYear() + '-' + pad2(n.getMonth() + 1) + '-' + pad2(n.getDate());
        }
        /* Mode Plage : on attend le clic OK, sinon on requêterait sur des
           dates vides à chaque frappe. */
        if (mode === 'custom' && (!FROM || !TO)) { renderControls(); return; }
        go(null);
      };
    });

    $('#agPrevM').onclick = function () { var i = MONTHS.indexOf(CURRENT); if (i >= 0 && i < MONTHS.length - 1) { CURRENT = MONTHS[i + 1]; go(monthLabel(CURRENT)); } };
    $('#agNextM').onclick = function () { var i = MONTHS.indexOf(CURRENT); if (i > 0) { CURRENT = MONTHS[i - 1]; go(monthLabel(CURRENT)); } };
    $('#agMonthSel').onchange = function () { CURRENT = this.value; go(monthLabel(CURRENT)); };

    $('#agPrevD').onclick = function () { shiftDay(-1); };
    $('#agNextD').onclick = function () { shiftDay(1); };
    $('#agDayPick').onchange = function () { if (this.value) { DAY = this.value; go(frFull(DAY)); } };

    $('#agCustOk').onclick = function () {
      var a = $('#agFrom').value, b = $('#agTo').value;
      if (!a || !b) { $('#agRange').textContent = 'Choisis les deux dates'; return; }
      if (a > b) { $('#agRange').textContent = 'Plage invalide'; return; }
      FROM = a; TO = b; MODE = 'custom';
      go(frFull(a) + ' → ' + frFull(b));
    };

    $$('#agTunnelSeg button').forEach(function (b) {
      b.onclick = function () {
        var tf = b.getAttribute('data-tunnel');
        if (tf === TUNNEL || busy) return;
        TUNNEL = tf;
        renderTunnelSeg();
        go(TUNNEL_LABEL[tf] || '');
      };
    });

    /* Section 🎨 — délégation sur le conteneur : render() remplace tout
       l'innerHTML, un gestionnaire posé sur un bouton ne survivrait pas.
       Aucune requête réseau : les 4 axes sont déjà dans la réponse, on
       re-rend la page avec la dernière donnée reçue. */
    $('#agRoot').addEventListener('click', function (ev) {
      var el = ev.target;
      while (el && el !== this && el.nodeType === 1) {
        if (el.hasAttribute('data-utm-axis')) {
          var ax = el.getAttribute('data-utm-axis');
          if (ax !== UTM_AXIS && LASTDATA) { UTM_AXIS = ax; render(LASTDATA); }
          return;
        }
        if (el.hasAttribute('data-utm-more')) {
          UTM_SHOWALL = !UTM_SHOWALL;
          if (LASTDATA) render(LASTDATA);
          return;
        }
        el = el.parentNode;
      }
    });

    renderControls();
    load();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
