  h += '</div>';
  body.innerHTML = h;
}

function renderClientCard(c){
  var lvl = c._level;
  var lvlClass = lvl ? lvl : '';
  var lvlBadge = '';
  if(lvl === 'crit')      lvlBadge = '<span class="csm-badge crit">🔴 Critique</span>';
  else if(lvl === 'warn') lvlBadge = '<span class="csm-badge warn">🟠 Relancer</span>';
  else if(lvl === 'att')  lvlBadge = '<span class="csm-badge att">🟡 Attention</span>';
  else if(lvl === 'ok')   lvlBadge = '<span class="csm-badge ok">✅ OK</span>';

  var status = c.clientStatus || 'active';
  var cs = CLIENT_STATUS[status] || CLIENT_STATUS.active;
  var statusBadge = '<span class="csm-badge ' + cs.cls + '">' + cs.label + '</span>';

  // ───── CELLULE IDENTITÉ ─────
  var initialsTxt = esc(initials(clientDisplayName(c)));
  var nameTxt     = esc(clientDisplayName(c));
  var commerceTxt = c.commerce && c.commerce !== c.nom ? esc(c.commerce) : '';

  var identityCell = '<div class="csm2-id">'
    + '<div class="csm-avatar">' + initialsTxt + '</div>'
    + '<div class="csm2-id-text">'
    + '<div class="csm2-name">' + nameTxt + '</div>'
    + (commerceTxt ? '<div class="csm2-sub">' + commerceTxt + '</div>' : '')
    + '<div class="csm2-badges">' + lvlBadge + statusBadge
    + (!c._hasLead ? '<span class="csm-badge csm-badge-no-lead" title="Ce client coaching n\'a pas de lead CRM lié — paiements non visibles">📚 Pas de lead CRM</span>' : '')
    + '</div>'
    + (c.email ? '<div data-academy-panel data-em="' + esc(c.email) + '" style="display:none"></div>' : '')
    + '</div></div>';

  // ───── CELLULE PAIEMENT ─────
  var pays = paymentsByLead[c._leadId] || [];
  var payCell;
  if(pays.length){
    var totalAmt = 0, paidAmt = 0;
    pays.forEach(function(p){
      if(p.status === 'cancelled') return;
      totalAmt += (p.totalAmount || 0);
      paidAmt  += (p.paidAmount  || 0);
    });
    var nbFailed = pays.filter(function(p){ return p.status === 'failed'; }).length;
    var nbPending = pays.filter(function(p){ return p.status === 'pending_mandate'; }).length;
    var mainPay = pays[0];
    var hasInst = mainPay.installmentsCount > 1;

    // Détection retard de prélèvement (pour 1er paiement actif avec installments)
    var lateMonths = 0;
    var activePay = pays.find(function(p){ return p.status === 'active' && p.installmentsCount > 1; });
    if(activePay){
      var start = toDate(activePay.startDate);
      if(start){
        var monthsElapsed = (new Date().getFullYear() - start.getFullYear())*12 + (new Date().getMonth() - start.getMonth()) + 1;
        var expected = Math.min(monthsElapsed, activePay.installmentsCount);
        lateMonths = Math.max(0, expected - (activePay.paidCount || 0) - 1);
      }
    }

    var payMain = '<span class="csm2-amount">' + fmtEuro(paidAmt) + '</span><span class="csm2-amount-sep">/</span><span class="csm2-amount-total">' + fmtEuro(totalAmt) + '</span>';
    var paySubLabel = '';
    var paySubCls = '';
    if(nbFailed > 0){
      paySubLabel = '❌ ' + nbFailed + ' échec' + (nbFailed>1?'s':'');
      paySubCls = 'crit';
    } else if(lateMonths > 0){
      paySubLabel = '⚠️ ' + lateMonths + ' mois de retard';
      paySubCls = 'crit';
    } else if(nbPending > 0){
      paySubLabel = '⏳ Mandat en attente';
      paySubCls = 'warn';
    } else if(hasInst){
      paySubLabel = (mainPay.paidCount || 0) + '/' + mainPay.installmentsCount + ' échéances';
      paySubCls = 'ok';
    } else if(mainPay.status === 'completed'){
      paySubLabel = '🎉 Soldé';
      paySubCls = 'ok';
    } else {
      paySubLabel = PAY_STATUS[mainPay.status] ? PAY_STATUS[mainPay.status].label : (mainPay.status || '—');
      paySubCls = 'ok';
    }
    payCell = '<div class="csm2-cell csm2-cell-pay">'
      + '<div class="csm2-cell-label">💳 PAIEMENT</div>'
      + '<div class="csm2-cell-main">' + payMain + '</div>'
      + '<div class="csm2-cell-sub ' + paySubCls + '">' + paySubLabel + '</div>'
      + '</div>';
  } else {
    payCell = '<div class="csm2-cell csm2-cell-pay">'
      + '<div class="csm2-cell-label">💳 PAIEMENT</div>'
      + '<div class="csm2-cell-empty">Aucun paiement enregistré</div>'
      + '</div>';
  }

  // ───── CELLULE COACHING ─────
  var coachingDoc = getCoachingForLead(c);
  var coachCell;
  if(coachingDoc){
    var done = coachingDoc.nbCoachingsFaits || 0;
    var total = coachingDoc.nbCoachingsTotal || 12;
    var nowD = new Date();
    var qNow = getCoachingQuotaStatus(coachingDoc, nowD.getFullYear(), nowD.getMonth());
    var prevD = new Date(nowD.getFullYear(), nowD.getMonth()-1, 1);
    var qPrev = getCoachingQuotaStatus(coachingDoc, prevD.getFullYear(), prevD.getMonth());
    var coachSubLabel = '';
    var coachSubCls = 'ok';
    if(coachingDoc.statut === 'inactif'){ coachSubLabel = 'Compte inactif'; coachSubCls = 'muted'; }
    else if(done >= total){ coachSubLabel = '🎉 Programme terminé'; coachSubCls = 'ok'; }
    else if(qNow && qPrev && qNow.status === 'miss' && qPrev.status === 'miss'){ coachSubLabel = '🔴 2 mois sans session'; coachSubCls = 'crit'; }
    else if(qNow && qNow.status === 'miss'){ coachSubLabel = '🟠 Aucune session ce mois'; coachSubCls = 'warn'; }
    else if(qNow && qNow.status === 'partial'){ coachSubLabel = qNow.used + '/' + qNow.max + ' ce mois'; coachSubCls = 'att'; }
    else if(qNow && qNow.status === 'ok'){ coachSubLabel = '✓ Quota mensuel OK'; coachSubCls = 'ok'; }
    else { coachSubLabel = '—'; coachSubCls = 'muted'; }
    coachCell = '<div class="csm2-cell csm2-cell-coach">'
      + '<div class="csm2-cell-label">🎯 COACHING</div>'
      + '<div class="csm2-cell-main">' + done + '<span class="csm2-amount-sep">/</span>' + total + '</div>'
      + '<div class="csm2-cell-sub ' + coachSubCls + '">' + coachSubLabel + '</div>'
      + '</div>';
  } else {
    coachCell = '<div class="csm2-cell csm2-cell-coach">'
      + '<div class="csm2-cell-label">🎯 COACHING</div>'
      + '<div class="csm2-cell-empty">Pas de fiche coaching</div>'
      + '</div>';
  }

  // ───── CELLULE ACADEMY (remplace Kajabi : avancement AE Academy en direct) ─────
  var kajCell;
  if(c.email){
    kajCell = '<div class="csm2-cell csm2-cell-kaj">'
      + '<div class="csm2-cell-label">🎓 ACADEMY</div>'
      + '<div style="margin-top:6px"><button type="button" data-academy-btn data-em="' + esc(c.email) + '" title="Avancement AE Academy en direct (progression, victoires, année 2)">Voir l\'avancement</button></div>'
      + '<div class="csm2-cell-sub" style="margin-top:6px">progression · 🏆 victoires · année 2</div>'
      + '</div>';
  } else {
    kajCell = '<div class="csm2-cell csm2-cell-kaj">'
      + '<div class="csm2-cell-label">🎓 ACADEMY</div>'
      + '<div class="csm2-cell-empty">Pas d\'e-mail sur la fiche</div>'
      + '</div>';
  }

  // ───── CELLULE FOLLOWUP ─────
  var followCell = '<div class="csm2-cell csm2-cell-followup">'
    + '<div class="csm2-cell-label">↻ DERN. RELANCE</div>';
  if(c.lastCsmFollowupAt){
    followCell += '<div class="csm2-cell-main csm2-cell-main-small">' + timeAgo(c.lastCsmFollowupAt) + '</div>';
  } else {
    followCell += '<div class="csm2-cell-empty">Jamais relancé</div>';
  }
  if(c.clientSince){
    followCell += '<div class="csm2-cell-sub muted">📅 Depuis ' + fmtDate(c.clientSince) + '</div>';
  }
  followCell += '</div>';

  // ───── ACTIONS ─────
  var actions = '<div class="csm2-actions">';
  if(c.telephone) actions += '<button class="csm-act-btn" title="📱 SMS" onclick="event.stopPropagation();quickSms(\'' + c.id + '\')">📱</button>';
  if(c.email)     actions += '<button class="csm-act-btn" title="📧 Email" onclick="event.stopPropagation();quickEmail(\'' + c.id + '\')">📧</button>';
  actions += '<button class="csm-act-btn" title="📋 Détails" onclick="event.stopPropagation();openClientModal(\'' + c.id + '\')">📋</button>';
  actions += '</div>';

  return '<div class="csm-card2 ' + lvlClass + '" onclick="openClientModal(\'' + c.id + '\')">'
       + identityCell + payCell + coachCell + kajCell + followCell + actions
       + '</div>';
}

function renderPayments(){
  document.getElementById('toolbarRetards').style.display = 'none';
  document.getElementById('filterStatus').style.display = 'none';
  document.getElementById('filterPayStatus').style.display = '';
  var body = document.getElementById('csmBody');

  // ─── Calcul des "échéances" pour chaque paiement actif ────────────────
  // Comme paymentsHistory[] ne contient QUE les prélèvements RÉUSSIS
  // (cf. api/gocardless-status.js), on déduit les états :
  //   - failed / cancelled              → bucket "Échouées"
  //   - active avec paidCount < expected→ bucket "Échouées" (retard)
  //   - pending_mandate                 → bucket "Mandat en attente"
  //   - active avec next dans 7j        → bucket "Prochaines échéances"
  //   - active sans retard et next > 7j → bucket "À jour"
  //   - completed                       → ignoré (soldés, pas critiques)
  //   - draft                           → bucket "À jour" (en cours de création)
  function buildPayItem(c, p){
    var item = { _client: c, _payment: p, bucket: null, nextDueDate: null,
                 monthsLate: 0, expectedCount: 0 };
    if(p.status === 'completed') return null; // soldés exclus de la vue échéances

    if(p.status === 'failed' || p.status === 'cancelled'){
      item.bucket = 'failed'; return item;
    }
    if(p.status === 'pending_mandate'){
      item.bucket = 'pending'; return item;
    }
    if(p.status === 'draft'){
      item.bucket = 'draft'; return item;
    }
    // active / mandate_active : on calcule le retard et la prochaine échéance
    var start = toDate(p.startDate) || toDate(p.createdAt);
    if(!start || !p.installmentsCount || p.installmentsCount <= 1){
      // Paiement en 1 fois : pas de notion d'échéance, classé "à jour"
      item.bucket = 'up'; return item;
    }
    var now = new Date();
    var monthsElapsed = (now.getFullYear() - start.getFullYear())*12 + (now.getMonth() - start.getMonth()) + 1;
    var expected = Math.min(monthsElapsed, p.installmentsCount);
    item.expectedCount = expected;
    var actual = p.paidCount || 0;
    var late = Math.max(0, expected - actual - 1); // tolérance d'1 mois
    item.monthsLate = late;
    // Calcul prochaine échéance théorique : startDate + (paidCount+1) mois
    var next = new Date(start);
    next.setMonth(next.getMonth() + actual);
    if(next < now) next = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    item.nextDueDate = next;
    if(late > 0){ item.bucket = 'failed'; return item; }
    var diffDays = Math.floor((next - now) / 86400000);
    if(diffDays >= 0 && diffDays <= 7){ item.bucket = 'next'; return item; }
    item.bucket = 'up'; return item;
  }

  // Aplatir et bucketiser
  var failed = [], pending = [], next = [], up = [];
  allClients.forEach(function(c){
    (paymentsByLead[c._leadId] || []).forEach(function(p){
      var item = buildPayItem(c, p);
      if(!item) return;
      // Filtres recherche
      if(searchQ && !searchMatch(c, searchQ)) return;
      if(filterPayStatus !== 'all' && p.status !== filterPayStatus) return;
      if(item.bucket === 'failed')      failed.push(item);
      else if(item.bucket === 'pending') pending.push(item);
      else if(item.bucket === 'next')    next.push(item);
      else                               up.push(item);
    });
  });

  // Sort interne à chaque bucket
  failed.sort(function(a,b){
    // Plus en retard d'abord
    if(b.monthsLate !== a.monthsLate) return b.monthsLate - a.monthsLate;
    return (toDate(b._payment.createdAt)||new Date(0)) - (toDate(a._payment.createdAt)||new Date(0));
  });
  pending.sort(function(a,b){
    return (toDate(a._payment.createdAt)||new Date()) - (toDate(b._payment.createdAt)||new Date());
  });
  next.sort(function(a,b){
    return (a.nextDueDate||new Date()) - (b.nextDueDate||new Date());
  });
  up.sort(function(a,b){
    return (toDate(b._payment.createdAt)||new Date(0)) - (toDate(a._payment.createdAt)||new Date(0));
  });

  if(!failed.length && !pending.length && !next.length && !up.length){
    body.innerHTML = '<div class="csm-empty"><div class="csm-empty-icon">💳</div><div class="csm-empty-title">Aucun paiement</div><div>Ajustez les filtres pour voir plus de résultats.</div></div>';
    return;
  }

  // ─── Render des 4 sections ──────────────────────────────────────────────
  var h = '';
  h += renderPaySection('🔴 Échouées & en retard', 'crit', failed,
       'Prélèvements en échec ou en retard de paiement. Action prioritaire requise.');
  h += renderPaySection('⏳ En attente de mandat', 'warn', pending,
       'Mandat GoCardless pas encore signé par le client.');
  h += renderPaySection('⏰ Prochaines échéances (7 jours)', 'att', next,
       'Prélèvements prévus dans la semaine.');
  h += renderPaySection('✅ À jour', 'ok', up,
       'Paiements en cours sans retard apparent.');
  body.innerHTML = h;
}

/* Helper : rend une section de paiements avec header coloré + toggle collapse */
function renderPaySection(title, kind, items, subtitle){
  if(!items.length) return '';
  var bg = kind === 'crit' ? 'rgba(239,68,68,.08)'
         : kind === 'warn' ? 'rgba(251,146,60,.08)'
         : kind === 'att'  ? 'rgba(250,204,21,.06)'
         : 'rgba(94,234,212,.05)';
  var bd = kind === 'crit' ? 'rgba(239,68,68,.25)'
         : kind === 'warn' ? 'rgba(251,146,60,.25)'
         : kind === 'att'  ? 'rgba(250,204,21,.20)'
         : 'rgba(94,234,212,.20)';
  var col = kind === 'crit' ? 'var(--crit-color)'
          : kind === 'warn' ? 'var(--warn-color)'
          : kind === 'att'  ? 'var(--att-color)'
          : 'var(--csm-accent)';

  var h = '<div style="margin-bottom:18px;border:1px solid ' + bd + ';background:' + bg + ';border-radius:12px;overflow:hidden">';
  h += '<div style="padding:11px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid ' + bd + '">';
  h += '<div style="font-size:14px;font-weight:700;color:' + col + '">' + title + '</div>';
  h += '<div style="background:rgba(255,255,255,0.05);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;color:' + col + '">' + items.length + '</div>';
  if(subtitle){
    h += '<div style="font-size:11px;color:var(--ink-muted);margin-left:auto">' + esc(subtitle) + '</div>';
  }
  h += '</div>';

  h += '<div style="display:flex;flex-direction:column;gap:6px;padding:8px">';
  items.forEach(function(item){
    h += renderPayCard(item, kind);
  });
  h += '</div></div>';
  return h;
}

/* Helper : rend une carte paiement avec contexte échéance */
function renderPayCard(item, kind){
  var c = item._client, p = item._payment;
  var ps = PAY_STATUS[p.status] || { label: p.status||'?', cls:'pay-draft' };
  var prog = '';
  if(p.installmentsCount > 1){
    prog = (p.paidCount || 0) + '/' + p.installmentsCount;
  }
  var pctBar = '';
  if(p.installmentsCount > 1){
    var done = (p.paidCount || 0) / p.installmentsCount;
    pctBar = '<div style="width:60px;height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;margin:0 4px"><div style="height:100%;width:' + Math.round(done*100) + '%;background:' + (kind==='crit'?'var(--crit-color)':'var(--csm-accent)') + '"></div></div>';
  }

  // Contexte spécifique au bucket
  var ctxInfo = '';
  if(item.bucket === 'failed'){
    if(item.monthsLate > 0){
      ctxInfo = '<span class="csm-badge crit" title="Retard estimé à partir de startDate">⚠️ ' + item.monthsLate + ' mois de retard</span>';
    } else if(p.status === 'failed'){
      ctxInfo = '<span class="csm-badge crit">❌ Prélèvement en échec</span>';
    } else if(p.status === 'cancelled'){
      ctxInfo = '<span class="csm-badge muted">🚫 Annulé</span>';
    }
  } else if(item.bucket === 'pending'){
    var createdAt = toDate(p.createdAt);
    var daysOld = createdAt ? Math.floor((Date.now() - createdAt.getTime())/86400000) : null;
    if(daysOld !== null && daysOld > 7){
      ctxInfo = '<span class="csm-badge warn">⏳ Mandat non signé depuis ' + daysOld + ' jours</span>';
    } else {
      ctxInfo = '<span class="csm-badge att">⏳ Mandat en cours de signature</span>';
    }
  } else if(item.bucket === 'next' && item.nextDueDate){
    var diffD = Math.floor((item.nextDueDate - new Date()) / 86400000);
    var lbl = diffD === 0 ? "aujourd'hui" : diffD === 1 ? "demain" : "dans " + diffD + " jours";
    ctxInfo = '<span class="csm-badge att" title="' + fmtDate(item.nextDueDate) + '">⏰ Prochain prélèvement ' + lbl + '</span>';
  }

  var h = '<div class="csm-card" onclick="openClientModal(\'' + c.id + '\')" style="cursor:pointer">';
  h += '<div class="csm-avatar">' + esc(initials(clientDisplayName(c))) + '</div>';
  h += '<div class="csm-card-info">';
  h += '<div class="csm-card-name">' + esc(clientDisplayName(c)) + '<span style="color:var(--ink-muted);font-weight:500;margin-left:8px;font-size:13px">' + fmtEuro(p.totalAmount) + '</span></div>';
  h += '<div class="csm-card-meta">';
  h += '<span class="csm-badge ' + ps.cls + '">' + ps.label + '</span>';
  if(prog) h += '<span title="Progression">📊 ' + prog + pctBar + '</span>';
  if(p.installmentAmount && p.installmentsCount > 1) h += '<span>' + fmtEuro(p.installmentAmount) + '/mois</span>';
  if(p.paiementPlateforme) h += '<span>🏦 ' + esc(p.paiementPlateforme) + '</span>';
  if(ctxInfo) h += ctxInfo;
  h += '</div></div>';
  h += '<div></div>';
  h += '<div class="csm-actions">';
  h += '<a class="csm-act-btn" title="Voir détail paiement" href="payments.html?leadId=' + c.id + '" onclick="event.stopPropagation()" target="_blank">→</a>';
  h += '</div></div>';
  return h;
}

  // ═══════ CONTENU DES ONGLETS ═══════

  Object.keys(CLIENT_STATUS).forEach(function(s){

    h += '<button class="csm-status-btn" style="' + st + '" onclick="changeStatus(\'' + s + '\')">' + CLIENT_STATUS[s].label + '</button>';

  h += '</div></div>';

  // 4 mini-cards synthèse
  h += '<div class="overview-grid">';
  // Coaching
  if(coaching){
    var done  = coaching.nbCoachingsFaits || 0;

    var pct   = total > 0 ? Math.round((done/total)*100) : 0;
    var nowD = new Date();
    var qN = getCoachingQuotaStatus(coaching, nowD.getFullYear(), nowD.getMonth());
    var subTxt = qN && qN.status === 'miss' ? '🔴 Aucune session ce mois'
               : qN && qN.status === 'partial' ? '🟡 ' + qN.used + '/' + qN.max + ' ce mois'
               : qN && qN.status === 'ok' ? '✓ Quota mensuel OK' : '—';

    // Mini indicateur RDV 72H : un petit badge en haut à droite de la card
    var rdv72ov = getRdv72h(coaching);

  if(pays.length){

    var payPct = totalAmt > 0 ? Math.round((paidAmt/totalAmt)*100) : 0;
    var paySubTxt = nbFailed > 0 ? '🔴 ' + nbFailed + ' échec' + (nbFailed>1?'s':'')

  h += '<div class="mtab-body" data-mtab-body="coaching" style="display:none">';
  if(coaching){
    var done2  = coaching.nbCoachingsFaits || 0;
    var total2 = coaching.nbCoachingsTotal || 12;
    var pct2   = total2 > 0 ? Math.round((done2/total2)*100) : 0;
    var remaining = Math.max(0, total2 - done2);

    // Détection du tier programme : Elite/Premium/Standard
    var progRaw = coaching.programme || '';
    var progLower = progRaw.toLowerCase();
    var isElite   = progLower.indexOf('elite') >= 0;
    var isPremium = isElite || progLower.indexOf('premium') >= 0 || progLower.indexOf('vip') >= 0;
    var quotaPerMonth = getMonthlyQuota(progRaw);

    // ── Header programme avec badge tier + secteur + dates ──
    var progBadge = '';
    if(isElite)        progBadge = '<span style="background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:0.4px;text-transform:uppercase">⭐ Elite</span>';
    else if(isPremium) progBadge = '<span style="background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0a0a0a;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:0.4px;text-transform:uppercase">★ Premium</span>';

    h += '<div style="font-size:12px;color:var(--ink-muted)">· ' + quotaPerMonth + ' coaching' + (quotaPerMonth>1?'s':'') + '/mois</div>';

    h += '<div style="display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-soft)">';

        rdvIcon = '🟡';
        rdvBg = 'rgba(251,191,36,0.08)';

        rdvLabel = 'RDV 72H à programmer';

      } else {

        rdvBg = 'rgba(255,255,255,0.04)';

    h += '<div style="font-size:11px;color:var(--ink-muted);margin-top:2px">' + remaining + ' séance' + (remaining>1?'s':'') + ' restante' + (remaining>1?'s':'') + ' sur ' + total2 + '</div></div>';
    h += '<div style="font-size:24px;font-weight:800;color:var(--csm-accent);line-height:1">' + done2 + '<span style="color:var(--ink-muted);font-weight:500;font-size:16px">/' + total2 + '</span></div>';
    h += '</div>';
    h += '<div style="height:8px;background:var(--bg2);border-radius:4px;overflow:hidden">';
    var progBarColor = pct2 >= 80 ? 'var(--csm-accent)' : pct2 >= 40 ? '#fbbf24' : '#fb923c';
    h += '<div style="height:100%;width:' + pct2 + '%;background:linear-gradient(90deg,' + progBarColor + ',var(--csm-accent));transition:width 0.3s"></div>';
    h += '</div>';
    h += '<div style="font-size:11px;color:var(--ink-muted);text-align:right;margin-top:4px">' + pct2 + '% complété</div>';

    // ── Bloc Quota mensuel + historique ──

      qThisColor = 'var(--ink-muted)';

    } else {
      qThisColor = qThis && qThis.status === 'ok' ? '#34d399'
                 : qThis && qThis.status === 'partial' ? '#fbbf24'
                 : qThis && qThis.status === 'miss' ? 'var(--crit-color)' : 'var(--ink-muted)';
      qThisLabel = qThis && qThis.status === 'ok' ? '✅ Quota atteint ce mois !'
                 : qThis && qThis.status === 'partial' ? '🟡 ' + qThisUsed + '/' + qThisMax + ' ce mois'
                 : qThis && qThis.status === 'miss' ? '🔴 Aucun coaching effectué ce mois'
                 : '—';

    h += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px">';

    h += '<div><div style="font-size:11px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">📊 Quota mensuel</div>';
    h += '<div style="font-size:11px;color:' + qThisColor + ';margin-top:2px;font-weight:600">' + qThisLabel + '</div></div>';
    h += '<div style="font-size:24px;font-weight:800;color:' + qThisColor + ';line-height:1">' + qThisUsed + '<span style="color:var(--ink-muted);font-weight:500;font-size:16px">/' + qThisMax + '</span></div>';

    // d'afficher "0/1 ❌" pour des mois où le client n'avait pas encore

/* Switch onglet interne de la modal client */
function switchModalTab(tabName){
  window._activeModalTab = tabName;
  document.querySelectorAll('.mtab').forEach(function(b){
    b.classList.toggle('active', b.dataset.mtab === tabName);
  });
  document.querySelectorAll('.mtab-body').forEach(function(b){
    b.style.display = (b.dataset.mtabBody === tabName) ? '' : 'none';
  });

  // Onglet Academy : le widget charge le panneau (une seule fois par client,
  // il gère lui-même son état « déjà chargé »).
  if(tabName === 'academy' && window.AcademyWidget){
    var ap = document.querySelector('[data-academy-modal]');
    if(ap) window.AcademyWidget.load(ap, ap.getAttribute('data-em') || '');
  }

  // Auto-sync GoCardless quand on ouvre l'onglet Paiements (avec cache pour
  // éviter de rappeler l'API à chaque switch d'onglet sur le même client).
  // En V2 le backend attend un vrai leadId — on passe c._leadId si dispo,
  // fallback sur c.id (coachingId) si pas de lead matché.
  if(tabName === 'payments' && openClientId){
    var c = allClients.find(function(x){ return x.id === openClientId; });
    if(c && c.email && document.getElementById('gcLiveContent')){
      var lookupId = c._leadId || c.id;
      // Cache : si on a déjà résolu pour ce client dans cette session, ne pas rappeler
      window._gcCsmCache = window._gcCsmCache || {};
      var cached = window._gcCsmCache[lookupId];
      if(cached && (Date.now() - cached.at) < 60000){
        // Cache <60s : réutiliser
        renderGcLiveData(cached.data);
      } else {
        csmGcLookup(lookupId, c.email, false);
      }
    }
  }
}
window.switchModalTab = switchModalTab;

/* ─── GoCardless lookup pour la modal CSM ───
   Appelle /api/gocardless-lookup et rend dans #gcLiveContent la liste des
   mandats + échéances (passées payées + à venir) avec icônes 💰 / ⌛.
   Réplique de la logique gcLookupClient() de sales-crm-app.js mais
   adaptée à la modal CSM. forceRefresh=true ignore le cache.            */
function csmGcLookup(leadId, email, forceRefresh){
  var resultEl = document.getElementById('gcLiveContent');
  var btn = document.getElementById('gcResyncBtn');
  if(!resultEl) return;
  if(!email){
    resultEl.innerHTML = '<span style="color:var(--crit-color)">❌ Email manquant — impossible de chercher dans GoCardless</span>';
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Sync…'; }
  resultEl.innerHTML = '⏳ Synchronisation GoCardless en cours…';

  firebase.auth().currentUser.getIdToken().then(function(token){
    return fetch('/api/gocardless-lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ leadId: leadId, email: email })
    });
  }).then(function(resp){
    return resp.json().then(function(data){ return { ok: resp.ok, data: data }; });
  }).then(function(r){
    if(btn){ btn.disabled = false; btn.textContent = '🔄 Resync'; }
    if(!r.ok){
      resultEl.innerHTML = '<span style="color:var(--crit-color)">❌ ' + esc(r.data.error || 'Erreur API') + '</span>';
      return;
    }
    // Cache pour éviter rappels trop fréquents
    window._gcCsmCache = window._gcCsmCache || {};
    window._gcCsmCache[leadId] = { at: Date.now(), data: r.data };
    renderGcLiveData(r.data);
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = '🔄 Resync'; }
    console.error('[csmGcLookup] error', err);
    resultEl.innerHTML = '<span style="color:var(--crit-color)">❌ ' + esc(err.message) + '</span>';
  });
}
window.csmGcLookup = csmGcLookup;

/* ─── Créer un lead CRM lié à un client coaching qui n'en a pas ───
   Cette fonction est appelée depuis le bandeau ou l'onglet Paiements de
   la modal pour les clients sans _hasLead. Elle crée un doc dans `leads`
   avec isClient=true, copiant les champs depuis la fiche coaching. Le
   `sourceCoachingId` permet de tracer l'origine. Au prochain snapshot
   leads, le client se retrouvera enrichi automatiquement (cf.
   buildAllClients qui fait le match par email).
   Note : pour migrer en BULK, utiliser plutôt csm-diagnostic.html.       */
function csmCreateLeadForClient(clientId){
  var c = allClients.find(function(x){ return x.id === clientId; });
  if(!c){
    showToast('❌ Client introuvable', 'error');
    return;
  }
  if(c._hasLead){
    showToast('Ce client a déjà un lead CRM lié', 'error');
    return;
  }
  if(!c.email){
    showToast('❌ Impossible de créer un lead sans email', 'error');
    return;
  }
  if(!confirm('Créer un lead CRM lié pour ' + (c.nom||'?') + ' ?\n\nEmail : ' + (c.email||'—') + '\nTel : ' + (c.telephone||'—'))) return;

  var co = c._coaching || {};
  var leadData = {
    nom: (c.nom||'').trim(),
    email: (c.email||'').toLowerCase().trim(),
    telephone: c.telephone || '',
    commerce: c.commerce || '',
    secteur: c.secteur || '',
    isClient: true,
    clientStatus: c.clientStatus || 'active',
    clientSince: co.dateEntree || firebase.firestore.FieldValue.serverTimestamp(),
    source: 'coaching_migration',
    sourceCoachingId: co._id || c._coachingId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    importedCreatedAt: co.dateEntree || null,
    timeline_history: [{
      date: new Date().toISOString().slice(0,10),
      text: 'Lead créé depuis fiche coaching (CSM)',
      color: '#14b8a6'
    }]
  };
  Object.keys(leadData).forEach(function(k){ if(leadData[k] === undefined) delete leadData[k]; });

  db.collection('leads').add(leadData).then(function(){
    showToast('✅ Lead CRM créé et lié');
    // Le snapshot leads va se rafraîchir et buildAllClients va matcher
    // automatiquement par email. Pas besoin de fermer la modal — elle
    // se mettra à jour au prochain renderModal.
    setTimeout(function(){
      var refreshed = allClients.find(function(x){ return x.id === clientId; });
      if(refreshed && refreshed._hasLead) renderModal();
    }, 1200);
  }).catch(function(e){
    console.error('csmCreateLeadForClient error', e);
    showToast('❌ Erreur création lead — voir console', 'error');
  });
}
window.csmCreateLeadForClient = csmCreateLeadForClient;

/* ─── Marquer un lead existant comme client (set isClient=true) ───
   Utilisé quand le lead matche par email mais n'a pas le flag isClient.
   Cas typique : un commercial a converti le lead en mode coaching mais
   le flag CRM n'a pas été propagé. Cette action met juste à jour le
   flag — le lead conserve toute son histoire CRM (timeline, notes, etc.)
*/
function csmMarkLeadAsClient(clientId){
  var c = allClients.find(function(x){ return x.id === clientId; });
  if(!c || !c._leadId){
    showToast('❌ Pas de lead à marquer', 'error');
    return;
  }
  if(c._lead && c._lead.isClient){
    showToast('Ce lead est déjà marqué client', 'error');
    return;
  }
  if(!confirm('Marquer le lead "' + esc(c._lead.nom||c._lead.email) + '" comme client ?\n\nIl apparaîtra alors dans le module sales-clients.')) return;

  db.collection('leads').doc(c._leadId).update({
    isClient: true,
    clientStatus: c.clientStatus || 'active',
    clientSince: c._lead.clientSince || (c._coaching && c._coaching.dateEntree) || firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    showToast('✅ Lead marqué client');
    // Le snapshot leads se rafraîchit auto, buildAllClients va remonter
    // l'info à jour. La modal se met à jour au renderModal suivant.
    setTimeout(renderModal, 800);
  }).catch(function(e){
    console.error('csmMarkLeadAsClient error', e);
    showToast('❌ Erreur — voir console', 'error');
  });
}
window.csmMarkLeadAsClient = csmMarkLeadAsClient;

/* Rend le détail GoCardless (mandats + paiements passés/futurs) dans #gcLiveContent */
function renderGcLiveData(data){
  var resultEl = document.getElementById('gcLiveContent');
  if(!resultEl) return;
  var html = '';

  // Customer GC (lien)
  if(data.customer){
    html += '<div style="background:rgba(96,165,250,0.06);border:1px solid rgba(96,165,250,0.20);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px">';
    html += '<span>👤</span>';
    html += '<span>' + esc(data.customer.name || '?') + '</span>';
    if(data.customer.id){
      html += ' <span>—</span> <span style="font-family:monospace;color:#60a5fa;font-size:11px">' + esc(data.customer.id) + '</span>';
    }
    html += '</div>';
  }

  // Mandats
  if(data.mandates && data.mandates.length){
    var mLabels = { pending_submission:'⏳ En attente', submitted:'📤 Soumis', active:'✅ Actif', failed:'❌ Échoué', cancelled:'🚫 Annulé', expired:'⌛ Expiré' };
    html += '<div style="font-size:11px;font-weight:700;color:var(--ink-muted);margin-bottom:6px">Mandats (' + data.mandates.length + ')</div>';
    data.mandates.forEach(function(m){
      html += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px">';
      html += '<span style="font-family:monospace">' + esc(m.id) + '</span>';
      html += '<span>' + (mLabels[m.status] || m.status) + '</span>';
      html += '</div>';
    });
  } else if(data.mandate){
    var mLabel = ({ pending_submission:'⏳ En attente', submitted:'📤 Soumis', active:'✅ Actif', failed:'❌ Échoué', cancelled:'🚫 Annulé', expired:'⌛ Expiré' })[data.mandate.status] || data.mandate.status;
    html += '<div style="font-size:11px;font-weight:700;color:var(--ink-muted);margin-bottom:6px">Mandat</div>';
    html += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px">';
    html += '<span style="font-family:monospace">' + esc(data.mandate.id) + '</span>';
    html += '<span>' + mLabel + '</span>';
    html += '</div>';
  }

  // Paiements à venir + passés combinés et triés par date desc
  var paymentList = [];
  // Passés (paid_out, confirmed, etc.) depuis data.payments
  if(data.payments && data.payments.length){
    data.payments.forEach(function(p){
      paymentList.push({
        date: p.chargeDate,
        amount: p.amount,
        status: p.status,
        kind: 'past'
      });
    });
  }
  // Futurs depuis data.subscription.upcomingPayments
  if(data.subscription && data.subscription.upcomingPayments){
    data.subscription.upcomingPayments.forEach(function(up){
      paymentList.push({
        date: up.charge_date || up.chargeDate,
        amount: (up.amount/100), // GC retourne en centimes pour upcoming
        status: 'upcoming',
        kind: 'upcoming'
      });
    });
  }
  // Tri par date desc (plus récent en premier comme dans l'image 2)
  paymentList.sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'');
  });

  if(paymentList.length){
    var pIcons = {
      pending_submission:'⏳', submitted:'📤', confirmed:'✅', paid_out:'💰',
      cancelled:'🚫', failed:'❌', charged_back:'↩', upcoming:'⏳'
    };
    var pColor = function(st){
      if(st === 'paid_out' || st === 'confirmed') return '#34d399';
      if(st === 'failed' || st === 'charged_back') return 'var(--crit-color)';
      if(st === 'cancelled') return 'var(--ink-muted)';
      return 'var(--ink-soft)';
    };
    html += '<div style="font-size:11px;font-weight:700;color:var(--ink-muted);margin:10px 0 6px">Paiements (' + paymentList.length + ')</div>';
    html += '<div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg2)">';
    paymentList.forEach(function(p){
      var icon = pIcons[p.status] || '?';
      var col  = pColor(p.status);
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px">';
      html += '<span style="display:flex;align-items:center;gap:6px"><span style="font-size:14px">' + icon + '</span><span>' + esc(p.date || '—') + '</span></span>';
      html += '<span style="font-weight:700;color:' + col + '">' + fmtEuro(p.amount) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--ink-muted);font-style:italic">Aucun paiement trouvé dans GoCardless.</div>';
  }

  resultEl.innerHTML = html;
}
window.renderGcLiveData = renderGcLiveData;

// Délégation : clic sur les onglets de modal
document.addEventListener('click', function(e){
  var btn = e.target.closest && e.target.closest('.mtab');
  if(!btn) return;
  var tab = btn.dataset.mtab;
  if(tab) switchModalTab(tab);
});

function closeModal(){
  // V2 : pas de modal à fermer, on désélectionne juste le client.
  // Sur mobile, ça remontre l'empty state.
  selectedClientId = null;
  openClientId = null;
  renderDetailPanel();
  renderSidebarList();
}

function changeStatus(newStatus){
  if(!openClientId) return;
  // Source de vérité = clients/{coachingId}
  db.collection('clients').doc(openClientId).update({
    clientStatus: newStatus,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    var c = allClients.find(function(x){ return x.id === openClientId; });
    if(c) c.clientStatus = newStatus;
    showToast('✅ Statut mis à jour');
    renderModal();
  }).catch(function(e){
    console.error('changeStatus error', e);
    showToast('❌ Erreur changement statut', 'error');
  });
}

function addNote(){
  if(!openClientId) return;
  var input = document.getElementById('csmNoteInput');
  var txt = (input.value || '').trim();
  if(!txt){ showToast('Note vide', 'error'); return; }
  var noteObj = {
    contenu: txt,
    auteur: currentUserEmail || currentUserName || 'CSM',
    // ISO car arrayUnion ne supporte pas serverTimestamp dans un objet
    createdAt: new Date().toISOString()
  };
  db.collection('clients').doc(openClientId).update({
    csmNotes: firebase.firestore.FieldValue.arrayUnion(noteObj),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    showToast('📝 Note ajoutée');
    input.value = '';
    // Mettre à jour le cache local
    var c = allClients.find(function(x){ return x.id === openClientId; });
    if(c && c._coaching){
      c._coaching.csmNotes = c._coaching.csmNotes || [];
      c._coaching.csmNotes.push(noteObj);
    }
    loadNotesForLead(openClientId, function(){ renderModal(); });
  }).catch(function(e){
    console.error('addNote error', e);
    showToast('❌ Erreur ajout note', 'error');
  });
}

function deleteNote(noteId){
  // noteId est le createdAt ISO de la note (cf. addNote — pas de doc id Firestore
  // car les notes sont en array, pas en sous-collection).
  if(!openClientId) return;
  if(!confirm('Supprimer cette note ?')) return;
  var c = allClients.find(function(x){ return x.id === openClientId; });
  if(!c){ showToast('❌ Client introuvable', 'error'); return; }
  var current = (c._coaching && c._coaching.csmNotes) ? c._coaching.csmNotes.slice() : [];
  var newArr = current.filter(function(n){ return n.createdAt !== noteId; });
  db.collection('clients').doc(openClientId).update({
    csmNotes: newArr,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    if(c._coaching) c._coaching.csmNotes = newArr;
    showToast('🗑 Note supprimée');
    loadNotesForLead(openClientId, function(){ renderModal(); });
  }).catch(function(e){
    console.error('deleteNote error', e);
    showToast('❌ Erreur', 'error');
  });
}

function markFollowedUp(){
  if(!openClientId) return;
  var msg = prompt('Note de la relance (facultatif) :', '');
  if(msg === null) return;
  var historyEntry = {
    at: new Date().toISOString(),
    by: currentUser ? currentUser.uid : null,
    byName: currentUserName,
    channel: 'note',
    message: msg || ''
  };
  db.collection('clients').doc(openClientId).update({
    lastCsmFollowupAt: firebase.firestore.FieldValue.serverTimestamp(),
    lastCsmFollowupBy: currentUser ? currentUser.uid : null,
    csmFollowupHistory: firebase.firestore.FieldValue.arrayUnion(historyEntry),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    showToast('✅ Relance enregistrée');
    var c = allClients.find(function(x){ return x.id === openClientId; });
    if(c){
      if(!c.csmFollowupHistory) c.csmFollowupHistory = [];
      c.csmFollowupHistory.push(historyEntry);
      c.lastCsmFollowupAt = new Date();
      if(c._coaching){
        c._coaching.csmFollowupHistory = c._coaching.csmFollowupHistory || [];
        c._coaching.csmFollowupHistory.push(historyEntry);
        c._coaching.lastCsmFollowupAt = new Date();
      }
    }
    renderModal();
  }).catch(function(e){
    console.error('markFollowedUp error', e);
    showToast('❌ Erreur — voir les rules Firestore', 'error');
  });
}

function quickSms(id){
  var c = allClients.find(function(x){ return x.id === id; });
  if(!c || !c.telephone){ showToast('Pas de numéro pour ce client', 'error'); return; }
  window.location.href = 'sms:' + c.telephone;
  traceFollowup(id, 'sms', 'SMS ouvert');
}

function quickEmail(id){
  var c = allClients.find(function(x){ return x.id === id; });
  if(!c || !c.email){ showToast('Pas d\'email pour ce client', 'error'); return; }
  var subject = 'Suivi de votre accompagnement — Ambitio Corp';
  window.location.href = 'mailto:' + c.email + '?subject=' + encodeURIComponent(subject);
  traceFollowup(id, 'email', 'Email ouvert');
}

function traceFollowup(clientId, channel, message){
  // V2 : on écrit dans clients/{coachingId} (source de vérité) au lieu de
  // leads/{leadId}. Cohérent avec la refonte architecturale où tous les
  // writes (notes, status, followups) vont sur la collection clients.
  // Le clientId reçu est l'id du document allClients (= coachingId, préfixé cli_).
  var c = allClients.find(function(x){ return x.id === clientId; });
  if(!c){ console.warn('traceFollowup : client introuvable', clientId); return; }

  var historyEntry = {
    at: new Date().toISOString(),
    by: currentUser ? currentUser.uid : null,
    byName: currentUserName,
    channel: channel,
    message: message
  };
  // Si le client a un coachingId (cas normal V2), on écrit dans clients/
  if(c._coachingId){
    db.collection('clients').doc(c._coachingId).update({
      lastCsmFollowupAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastCsmFollowupBy: currentUser ? currentUser.uid : null,
      csmFollowupHistory: firebase.firestore.FieldValue.arrayUnion(historyEntry),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function(e){ console.warn('traceFollowup (clients) error', e); });
  }
  // Si le client a aussi un lead matché, on duplique sur leads/ pour rester
  // cohérent avec l'historique CRM existant (sales-leads, etc.). Optionnel.
  if(c._leadId){
    db.collection('leads').doc(c._leadId).update({
      lastCsmFollowupAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastCsmFollowupBy: currentUser ? currentUser.uid : null,
      csmFollowupHistory: firebase.firestore.FieldValue.arrayUnion(historyEntry),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function(e){ console.warn('traceFollowup (leads) error', e); });
  }
}
