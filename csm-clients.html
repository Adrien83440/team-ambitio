<style>
/* ═══════════════════════════════════════════════════════════════════════
   CSM Dashboard — refonte style clair (Step 6.2)
   Cohérent avec admin-persons.html. Préserve toutes les classes utilisées
   par le JS (csm-*, modal-*, cs-*, csm2-*).
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Variables ── */
:root {
  /* Override des variables sales.css pour cette page uniquement */
  --bg:           #f5f4ee;
  --bg2:          #ffffff;
  --bg3:          #faf9f4;
  --ink:          #1a1a1a;
  --ink-muted:    #6b6b66;
  --ink-soft:     #9c9c95;
  --border:       rgba(0,0,0,.10);

  /* CSM accent — passe au teal classique sur clair */
  --csm-accent:     #0f6e56;
  --csm-accent-2:   #14b8a6;
  --csm-accent-dark:#085041;
  --csm-glow:       rgba(15,110,86,0.10);
  --csm-bg-soft:    rgba(15,110,86,0.06);
  --csm-border:     rgba(15,110,86,0.20);

  /* Sémantique levels — adoucis pour fond clair */
  --crit-bg:        #fcebeb;
  --crit-color:     #a32d2d;
  --crit-border:    rgba(163,45,45,0.20);
  --warn-bg:        #faeeda;
  --warn-color:     #854f0b;
  --warn-border:    rgba(133,79,11,0.20);
  --att-bg:         #fef3c7;
  --att-color:      #854f0b;
  --att-border:     rgba(133,79,11,0.18);
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

/* ── Layout général ── */
.csm-app { padding: 24px 28px 60px; max-width: 1400px; margin: 0 auto; }

.csm-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 22px;
  padding-bottom: 18px; border-bottom: 1px solid var(--border);
}
.csm-logo {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--csm-bg-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  border: 1px solid var(--csm-border);
}
.csm-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
.csm-sub   { font-size: 12.5px; color: var(--ink-muted); margin-top: 3px; }

/* ── KPI strip ── */
.csm-kpi-strip {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 12px;
  margin-bottom: 22px;
}
.csm-kpi {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px;
  cursor: pointer; transition: all 0.15s;
}
.csm-kpi:hover { border-color: var(--csm-border); transform: translateY(-1px); }
.csm-kpi-num {
  font-size: 26px; font-weight: 600; letter-spacing: -0.5px;
  display: flex; align-items: center; gap: 8px;
}
.csm-kpi-num i { font-size: 22px; opacity: 0.85; }
.csm-kpi-label {
  font-size: 11px; color: var(--ink-muted); margin-top: 6px;
  text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
}
.csm-kpi-trend { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }

/* ── Toolbar/Stats anciennes — masquées (compat) ── */
.csm-modal-bg, .csm-tabs, .csm-stats, .csm-toolbar { display: none !important; }

/* ── Split layout ── */
.csm-split {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 16px;
  align-items: start;
  min-height: 70vh;
}

.csm-sidebar {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; flex-direction: column;
  overflow: hidden;
  max-height: 80vh;
}
.csm-sidebar-head {
  padding: 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
.csm-sidebar-search {
  width: 100%; padding: 9px 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; outline: none;
  transition: border-color 0.15s; color: var(--ink);
  font-family: inherit;
}
.csm-sidebar-search:focus { border-color: var(--csm-accent); }
.csm-sidebar-search::placeholder { color: var(--ink-soft); }

.csm-sidebar-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.csm-sb-pill {
  font-size: 11.5px; padding: 5px 10px; border-radius: 6px;
  background: transparent; color: var(--ink-muted);
  border: 1px solid var(--border); cursor: pointer;
  font-weight: 500; transition: all 0.12s;
  font-family: inherit;
}
.csm-sb-pill:hover { background: var(--bg3); color: var(--ink); }
.csm-sb-pill.active {
  background: var(--csm-bg-soft); color: var(--csm-accent);
  border-color: var(--csm-border);
}

.csm-sidebar-list {
  flex: 1; overflow-y: auto; padding: 6px;
}
.csm-sidebar-list::-webkit-scrollbar { width: 8px; }
.csm-sidebar-list::-webkit-scrollbar-track { background: transparent; }
.csm-sidebar-list::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,.10); border-radius: 4px;
}
.csm-sidebar-list::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.18); }

/* ── Client row (sidebar) ── */
.csm-client-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 11px; border-radius: 8px;
  cursor: pointer; margin-bottom: 3px;
  border: 1px solid transparent;
  transition: all 0.12s;
}
.csm-client-row:hover { background: var(--bg3); }
.csm-client-row.active {
  background: var(--csm-bg-soft);
  border-color: var(--csm-border);
}
.csm-cr-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--ink-soft);
}
.csm-cr-dot.crit { background: #dc2626; }
.csm-cr-dot.warn { background: #ea580c; }
.csm-cr-dot.att  { background: #ca8a04; }
.csm-cr-dot.ok   { background: #16a34a; }

.csm-cr-line { flex: 1; min-width: 0; }
.csm-cr-name {
  font-size: 13px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.csm-cr-meta {
  font-size: 11px; color: var(--ink-muted); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.csm-cr-stats { display: flex; gap: 4px; flex-shrink: 0; }
.csm-cr-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 4px;
  background: rgba(0,0,0,.05); color: var(--ink-muted); font-weight: 500;
}
.csm-cr-tag.crit { background: var(--crit-bg); color: var(--crit-color); }
.csm-cr-tag.warn { background: var(--warn-bg); color: var(--warn-color); }
.csm-cr-tag.att  { background: var(--att-bg); color: var(--att-color); }
.csm-cr-time { font-size: 10.5px; color: var(--ink-soft); flex-shrink: 0; }

/* ── Detail panel ── */
.csm-detail-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 28px;
  min-height: 70vh;
}
.csm-detail-empty {
  text-align: center; padding: 80px 20px;
  color: var(--ink-soft); font-size: 14px;
}

/* ── Modal header / sticky bar ── */
.csm-modal-h {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 14px;
  margin-bottom: 14px;
}
.csm-modal-title {
  font-size: 20px; font-weight: 600;
  display: flex; align-items: center; gap: 9px;
  flex-wrap: wrap;
}
.csm-modal-close {
  background: none; border: none; cursor: pointer;
  padding: 4px 9px; border-radius: 6px;
  color: var(--ink-muted); font-size: 16px;
}
.csm-modal-close:hover { background: var(--bg3); color: var(--ink); }

.modal-sticky-bar {
  background: var(--bg3);
  border-radius: 10px; padding: 12px 14px;
  margin-bottom: 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
}
.modal-contact-line {
  display: flex; gap: 16px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--ink-muted);
}
.modal-contact-line span { display: inline-flex; align-items: center; gap: 4px; }
.modal-quick-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Tabs internes au modal (si utilisés) */
.modal-tabs {
  display: flex; gap: 4px; border-bottom: 1px solid var(--border);
  margin-bottom: 16px; flex-wrap: wrap;
}
.modal-tabs > * {
  padding: 9px 14px; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--ink-muted); border-bottom: 2px solid transparent;
  background: transparent; border-top: none; border-left: none; border-right: none;
  font-family: inherit; transition: all 0.12s;
}
.modal-tabs > *:hover { color: var(--ink); }
.modal-tabs > *.active {
  color: var(--csm-accent); border-bottom-color: var(--csm-accent);
}
.modal-tab-bodies { min-height: 200px; }

/* ── Sections dans le détail ── */
.csm-section {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.csm-section-title {
  font-size: 12px; font-weight: 600;
  color: var(--ink-muted);
  text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}

/* ── Avatars / cards ── */
.csm-avatar {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 14px; color: var(--csm-accent);
  background: var(--csm-bg-soft); border: 1px solid var(--csm-border);
  flex-shrink: 0;
}
.csm-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
  transition: all 0.12s;
}
.csm-card:hover { border-color: var(--csm-border); }
.csm-card-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.csm-card-name { font-size: 14px; font-weight: 600; }
.csm-card-meta {
  font-size: 12px; color: var(--ink-muted);
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.csm-card-meta span { display: inline-flex; align-items: center; gap: 4px; }

/* csm-card2 / csm2-* (cards alternatives plus structurées) */
.csm-card2 {
  display: grid;
  grid-template-columns: minmax(220px,1.5fr) 1.1fr 1.1fr 1.1fr 1fr auto;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 8px;
  overflow: hidden; transition: all 0.12s;
}
.csm-card2:hover { border-color: var(--csm-border); }
.csm2-cell {
  padding: 12px 14px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
}
.csm2-cell:last-of-type { border-right: none; }
.csm2-id {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 14px; border-right: 1px solid var(--border);
}
.csm2-actions {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 14px;
}
.csm2-cell-pay   { background: rgba(15,110,86,0.015); }
.csm2-cell-coach { background: rgba(15,110,86,0.025); }
.csm2-cell-kaj   { background: rgba(133,79,11,0.015); }

/* csm2 — sous-éléments des cells */
.csm2-cell-label {
  font-size: 10.5px; color: var(--ink-muted);
  text-transform: uppercase; letter-spacing: 0.04em;
  font-weight: 600;
}
.csm2-cell-main { font-size: 14px; font-weight: 600; color: var(--ink); }
.csm2-cell-main-small { font-size: 12.5px; font-weight: 500; color: var(--ink); }
.csm2-cell-sub { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
.csm2-cell-empty { font-size: 12px; color: var(--ink-soft); font-style: italic; }
.csm2-id-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.csm2-name {
  font-size: 13.5px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.csm2-sub {
  font-size: 11.5px; color: var(--ink-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.csm2-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.csm2-amount { font-size: 13px; font-weight: 600; color: var(--ink); }
.csm2-amount-sep { color: var(--ink-soft); margin: 0 4px; font-weight: 400; }
.csm2-amount-total { color: var(--csm-accent); }
.csm2-progress-mini {
  width: 100%; height: 4px;
  background: rgba(0,0,0,0.06); border-radius: 2px;
  overflow: hidden; margin-top: 5px;
}
.csm2-progress-mini-fill {
  height: 100%; background: var(--csm-accent);
  border-radius: 2px; transition: width 0.3s;
}

/* csm-modal (modal complet ancien — masqué) */
.csm-modal { display: none; }

@media (max-width: 1280px) {
  .csm-card2 { grid-template-columns: minmax(200px,1.4fr) 1.1fr 1.1fr 1.1fr auto; }
  .csm2-cell-followup { display: none; }
}
@media (max-width: 920px) {
  .csm-card2 { grid-template-columns: 1fr 1fr; gap: 0; }
  .csm2-id { grid-column: 1 / -1; border-right: none; border-bottom: 1px solid var(--border); }
  .csm2-cell { border-right: none; border-bottom: 1px solid var(--border); }
  .csm2-cell-pay, .csm2-cell-coach { border-right: 1px solid var(--border); }
  .csm2-actions {
    grid-column: 1 / -1; padding: 8px 14px;
    justify-content: flex-end; border-top: 1px solid var(--border);
    background: var(--bg3);
  }
}

/* ── Liste & empty ── */
.csm-list { display: flex; flex-direction: column; gap: 8px; }
.csm-empty {
  text-align: center; padding: 60px 20px; color: var(--ink-soft);
}
.csm-empty-icon { font-size: 38px; margin-bottom: 12px; opacity: 0.4; }
.csm-empty-title {
  font-size: 15px; font-weight: 600; color: var(--ink);
  margin-bottom: 6px;
}

/* ── Badges ── */
.csm-badge {
  padding: 3px 9px; border-radius: 6px;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0;
  display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap;
}
.csm-badge.crit { background: var(--crit-bg); color: var(--crit-color); border: 1px solid var(--crit-border); }
.csm-badge.warn { background: var(--warn-bg); color: var(--warn-color); border: 1px solid var(--warn-border); }
.csm-badge.att  { background: var(--att-bg); color: var(--att-color); border: 1px solid var(--att-border); }
.csm-badge.ok   { background: var(--csm-bg-soft); color: var(--csm-accent); border: 1px solid var(--csm-border); }
.csm-badge.followup {
  background: #e6f1fb; color: #185fa5; border: 1px solid rgba(24,95,165,0.20);
}
.csm-badge-no-lead {
  background: #eeedfe; color: #534ab7; border: 1px solid rgba(83,74,183,0.25);
  padding: 3px 9px; border-radius: 6px;
  font-size: 11px; font-weight: 500;
}

.csm-badge.cs-active    { background: #e1f5ee; color: #0f6e56; border: 1px solid rgba(15,110,86,.22); }
.csm-badge.cs-paused    { background: #faeeda; color: #854f0b; border: 1px solid rgba(133,79,11,.22); }
.csm-badge.cs-completed { background: #eeedfe; color: #534ab7; border: 1px solid rgba(83,74,183,.22); }
.csm-badge.cs-stopped   { background: var(--crit-bg); color: var(--crit-color); border: 1px solid var(--crit-border); }
.csm-badge.cs-procedure { background: #fef3c7; color: #92400e; border: 1px solid rgba(146,64,14,.22); }

.csm-badge.pay-active        { background: #e1f5ee; color: #0f6e56; border: 1px solid rgba(15,110,86,.22); }
.csm-badge.pay-failed        { background: var(--crit-bg); color: var(--crit-color); border: 1px solid var(--crit-border); }
.csm-badge.pay-cancelled     { background: rgba(0,0,0,.05); color: var(--ink-muted); border: 1px solid var(--border); }
.csm-badge.pay-pending       { background: var(--warn-bg); color: var(--warn-color); border: 1px solid var(--warn-border); }
.csm-badge.pay-completed     { background: #eeedfe; color: #534ab7; border: 1px solid rgba(83,74,183,.22); }
.csm-badge.pay-mandate_active{ background: #e1f5ee; color: #0f6e56; border: 1px solid rgba(15,110,86,.22); }
.csm-badge.pay-draft         { background: rgba(0,0,0,.05); color: var(--ink-muted); border: 1px solid var(--border); }

/* ── Boutons ── */
.csm-btn {
  padding: 7px 13px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg2);
  color: var(--ink);
  font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex; align-items: center; gap: 5px;
  text-decoration: none;
  white-space: nowrap;
  transition: all 0.12s;
}
.csm-btn:hover { background: var(--bg3); border-color: rgba(0,0,0,.18); }
.csm-btn:active { transform: scale(0.98); }
.csm-btn.primary {
  background: var(--csm-accent); color: #fff; border-color: var(--csm-accent);
}
.csm-btn.primary:hover { background: var(--csm-accent-dark); }
.csm-btn.danger { color: var(--crit-color); border-color: var(--crit-border); }
.csm-btn.danger:hover { background: var(--crit-bg); }
.csm-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.csm-act-btn {
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg2); color: var(--ink-muted);
  font-size: 11.5px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 4px;
  transition: all 0.12s;
}
.csm-act-btn:hover { background: var(--bg3); color: var(--ink); }

.csm-actions { display: flex; gap: 5px; flex-wrap: wrap; }

.csm-status-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.csm-status-btn {
  padding: 4px 9px; border-radius: 5px;
  background: var(--bg3); color: var(--ink-muted);
  border: 1px solid var(--border);
  font-size: 10.5px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  transition: all 0.12s;
}
.csm-status-btn:hover { background: var(--bg2); color: var(--ink); }
.csm-status-btn.active {
  background: var(--csm-bg-soft); color: var(--csm-accent);
  border-color: var(--csm-border);
}

/* ── Signals (alertes panneau détail) ── */
.csm-signals { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.csm-signal {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 13px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg2);
}
.csm-signal.crit { background: var(--crit-bg); border-color: var(--crit-border); }
.csm-signal.warn { background: var(--warn-bg); border-color: var(--warn-border); }
.csm-signal.att  { background: var(--att-bg);  border-color: var(--att-border); }
.csm-signal-icon { font-size: 16px; flex-shrink: 0; }
.csm-signal-text { flex: 1; min-width: 0; }
.csm-signal-title { font-size: 13px; font-weight: 600; }
.csm-signal-desc  { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.csm-signal-action-btn {
  padding: 5px 10px; border-radius: 6px;
  border: 1px solid currentColor;
  background: transparent; color: inherit;
  font-size: 11.5px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  flex-shrink: 0;
}
.csm-signal-action-btn:hover { background: rgba(0,0,0,.05); }

/* ── Témoignages ── */
.csm-temo-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 13px; margin-bottom: 8px;
}
.csm-temo-head {
  display: flex; align-items: center; gap: 9px;
  margin-bottom: 6px;
}
.csm-temo-from { font-size: 12.5px; font-weight: 600; }
.csm-temo-when { font-size: 11px; color: var(--ink-soft); margin-left: auto; }
.csm-temo-text { font-size: 13px; color: var(--ink); line-height: 1.55; }

/* ── Notes ── */
.csm-note {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 11px 13px; margin-bottom: 8px;
}
.csm-note-meta {
  font-size: 11px; color: var(--ink-soft);
  margin-bottom: 5px;
  display: flex; align-items: center; gap: 8px;
}
.csm-note-content { font-size: 13px; color: var(--ink); line-height: 1.55; }

/* ── Form ── */
.csm-textarea {
  width: 100%; padding: 10px 12px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px; font-family: inherit;
  color: var(--ink);
  outline: none; resize: vertical;
  min-height: 70px;
  transition: border-color 0.15s;
}
.csm-textarea:focus { border-color: var(--csm-accent); }

/* ── Loading & spinner ── */
.csm-loading {
  text-align: center; padding: 30px 20px;
  color: var(--ink-soft); font-size: 13px;
  display: flex; align-items: center; justify-content: center; gap: 9px;
}
.csm-spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--csm-accent);
  border-radius: 50%;
  animation: csmspin 0.7s linear infinite;
}
@keyframes csmspin { to { transform: rotate(360deg); } }

/* ── Toast ── */
.csm-toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(15px);
  background: #1a1a1a; color: #fff;
  padding: 11px 18px; border-radius: 9px;
  font-size: 13px; font-weight: 500;
  opacity: 0; pointer-events: none; z-index: 2000;
  transition: all 0.25s;
}
.csm-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.csm-toast.success { background: #0f6e56; }
.csm-toast.error   { background: #a32d2d; }

/* ── Vue 360° persons (NOUVEAU bloc Step 6.2) ── */
.csm-360 {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 14px;
}
.csm-360-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 10px; flex-wrap: wrap;
}
.csm-360-title {
  font-size: 12px; font-weight: 600;
  color: var(--ink-muted);
  text-transform: uppercase; letter-spacing: 0.05em;
  display: flex; align-items: center; gap: 6px;
}
.csm-360-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.csm-360-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 9px; padding: 10px 12px;
}
.csm-360-card.full { grid-column: 1 / -1; }
.csm-360-card-h {

.csm-360-card-h i { font-size: 14px; color: var(--ink-muted); }
.csm-360-card-h .count {

}
.csm-360-line {
  font-size: 12px; line-height: 1.5;
}
.csm-360-line .lbl { color: var(--ink-muted); }
.csm-360-empty { font-size: 11.5px; color: var(--ink-soft); font-style: italic; }

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   csm-dashboard.html — Customer Success Manager
   ───────────────────────────────────────────────────────────────────────────
   Source UNIQUE de vérité pour les clients : leads where isClient==true
   (avec dédup _merged===true skipped — pattern aligné avec sales-leads.html)

   Enrichissements :
     • payments where leadId==id  → tous les paiements du client
     • leads/{id}/client_temoignages → témoignages
     • leads/{id}/client_notes      → notes (partagées avec sales-clients.html)

   Statuts client :   active / paused / completed / stopped / procedure
   Statuts paiement : draft / pending_mandate / mandate_active / active /
                      completed / failed / cancelled
   ═══════════════════════════════════════════════════════════════════════════ */

var db = firebase.firestore();
var currentUser = null;
var currentRole = null;
var currentUserName = '';
var currentUserEmail = '';

var allClients      = [];     // leads with isClient==true && !_merged
var paymentsByLead  = {};     // leadId -> [payments]
var notesByLead     = {};     // leadId -> [notes]
var temoByLead      = {};     // leadId -> [temo]
var temoFlat        = [];
var coachingByEmail = {};     // email lowercase -> client coaching doc
var coachMembersMap = {};     // slug -> displayName (pour afficher coach assigné)

var activeTab    = 'retards';
var levelsActive = { crit:true, warn:true, att:true };
var searchQ      = '';
var filterStatus = 'all';
var filterPayStatus = 'all';
var filterReason = 'all'; // all | payment | coaching
var openClientId = null;

/* ─── Constants ─── */
var CLIENT_STATUS = {
  active:    { label:'✅ Actif',     cls:'cs-active' },
  paused:    { label:'⏸ En pause',   cls:'cs-paused' },
  completed: { label:'🎉 Terminé',   cls:'cs-completed' },
  stopped:   { label:'🛑 Stoppé',    cls:'cs-stopped' },
  procedure: { label:'⚖️ Procédure', cls:'cs-procedure' }
};
var PAY_STATUS = {
  draft:           { label:'📝 Brouillon',         cls:'pay-draft' },
  pending_mandate: { label:'⏳ Mandat en attente', cls:'pay-pending' },
  mandate_active:  { label:'✅ Mandat actif',      cls:'pay-mandate_active' },
  active:          { label:'💸 Actif',             cls:'pay-active' },
  completed:       { label:'🎉 Terminé',           cls:'pay-completed' },
  failed:          { label:'❌ Échec',             cls:'pay-failed' },
  cancelled:       { label:'🚫 Annulé',            cls:'pay-cancelled' }
};

/* ─── Helpers ─── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
});}
function showToast(msg, kind){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'csm-toast show ' + (kind||'success');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}
function fmtEuro(v){ return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(v||0); }
function toDate(d){
  if(!d) return null;
  var dt = (d && d.toDate) ? d.toDate() : new Date(d);
  return isNaN(dt.getTime()) ? null : dt;
}
function fmtDate(d){
  var dt = toDate(d); if(!dt) return '—';
  return dt.toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtDateTime(d){
  var dt = toDate(d); if(!dt) return '—';
  return dt.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }) +
         ' à ' + dt.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}
function timeAgo(d){
  var dt = toDate(d); if(!dt) return '—';
  var diffDays = Math.floor((Date.now() - dt.getTime()) / 86400000);
  if(diffDays === 0) return "aujourd'hui";
  if(diffDays === 1) return 'hier';
  if(diffDays < 7) return 'il y a ' + diffDays + ' jours';
  if(diffDays < 30) return 'il y a ' + Math.floor(diffDays/7) + ' sem.';
  if(diffDays < 365) return 'il y a ' + Math.floor(diffDays/30) + ' mois';
  return 'il y a ' + Math.floor(diffDays/365) + ' an(s)';
}
function initials(name){
  if(!name) return '?';
  var parts = name.trim().split(/\s+/);
  if(parts.length >= 2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}
function clientDisplayName(c){
  return c.nom || c.commerce || c.email || c.telephone || '?';
}

/* ─── Compute level (crit / warn / att / ok) ─── */
function computeLevel(c){
  // Skip si client n'est plus à suivre
  var status = c.clientStatus || 'active';
  if(status === 'completed') return 'ok';
  if(status === 'stopped')   return null; // exclu de la vue retards

  var pays = paymentsByLead[c._leadId] || [];

  // Détecter paiement(s) en échec non résolu(s)
  var hasFailed = pays.some(function(p){ return p.status === 'failed'; });
  var hasCancelled = pays.some(function(p){ return p.status === 'cancelled'; });

  // Détecter retard de prélèvement sur paiement actif
  var hasPaymentBehind = false;
  pays.forEach(function(p){
    if(p.status !== 'active') return;
    if(!p.installmentsCount || p.installmentsCount <= 1) return;
    var start = toDate(p.startDate);
    if(!start) return;
    var monthsElapsed = (new Date().getFullYear() - start.getFullYear()) * 12
                      + (new Date().getMonth() - start.getMonth()) + 1;
    var expected = Math.min(monthsElapsed, p.installmentsCount);
    var actual = p.paidCount || 0;
    if(actual < expected - 1) hasPaymentBehind = true; // tolérance d'1 mois
  });

  // ─── Retards de coaching (collection clients) ───
  // Si un client coaching matché existe et qu'il n'est pas inactif/terminé,
  // on évalue ses 2 derniers mois de quota mensuel — MAIS on ignore les
  // mois antérieurs au "vrai début" du client (cf. getCoachingStartReference)
  // pour ne pas tagger CRITIQUE un client qui vient juste d'arriver.
  var coachingDoc = getCoachingForLead(c);
  var hasCoaching2MonthsMissed = false;
  var hasCoaching1MonthMissed = false;
  var hasCoachingPartial = false;
  if(coachingDoc && coachingDoc.statut !== 'inactif'){
    var done  = coachingDoc.nbCoachingsFaits || 0;
    var total = coachingDoc.nbCoachingsTotal || 12;
    if(done < total){ // pas terminé
      var now = new Date();
      var refStart = getCoachingStartReference(coachingDoc);
      var refMonth = refStart ? new Date(refStart.getFullYear(), refStart.getMonth(), 1) : null;
      var thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      var prevMonth = new Date(now.getFullYear(), now.getMonth()-1, 1);

      // Si le client est entré ce mois-ci ou plus tard, on ne lui reproche
      // aucun retard (c'est normal de ne pas avoir encore eu de session).
      var thisMonthBeforeStart = refMonth && thisMonth < refMonth;
      var prevMonthBeforeStart = refMonth && prevMonth < refMonth;

      var qNow = thisMonthBeforeStart ? null : getCoachingQuotaStatus(coachingDoc, now.getFullYear(), now.getMonth());
      var qPrev = prevMonthBeforeStart ? null : getCoachingQuotaStatus(coachingDoc, prevMonth.getFullYear(), prevMonth.getMonth());

      if(qNow && qPrev && qNow.status === 'miss' && qPrev.status === 'miss'){
        hasCoaching2MonthsMissed = true;
      } else if(qNow && qNow.status === 'miss'){
        hasCoaching1MonthMissed = true;
      } else if(qNow && qNow.status === 'partial'){
        hasCoachingPartial = true;
      }
    }
  }

  // Statuts critiques business
  if(status === 'procedure') return 'crit';
  if(hasFailed) return 'crit';
  if(hasPaymentBehind) return 'crit';
  if(hasCoaching2MonthsMissed) return 'crit';

  // Statut paused = à relancer
  if(status === 'paused') return 'warn';
  if(hasCancelled) return 'warn';
  if(hasCoaching1MonthMissed) return 'warn';

  // Pending_mandate depuis +7j = à relancer
  var hasOldPending = pays.some(function(p){
    if(p.status !== 'pending_mandate') return false;
    var ts = toDate(p.createdAt);
    if(!ts) return false;
    return (Date.now() - ts.getTime()) > 7 * 86400000;
  });
  if(hasOldPending) return 'warn';

  // Aucun paiement enregistré sur un client actif
  if(status === 'active' && pays.length === 0) return 'att';
  // Sessions partielles (en dessous quota mensuel)
  if(hasCoachingPartial) return 'att';

  return 'ok';
}

/* ─── Auth + boot ─── */
firebase.auth().onAuthStateChanged(function(user){
  if(!user){ window.location.href = 'login.html'; return; }
  currentUser = user;
  currentUserEmail = user.email;
  db.collection('users').doc(user.uid).get().then(function(snap){
    var d = snap.exists ? snap.data() : {};
    currentRole = d.role || 'csm';
    currentUserName = user.displayName || user.email.split('@')[0];
    if(['admin','csm','sales'].indexOf(currentRole) < 0){
      document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#cbd5e1"><h2>⛔ Accès réservé</h2></div>';
      return;
    }
    loadAllData();
  }).catch(function(e){
    console.warn('User doc error', e);
    loadAllData();
  });
});

/* ─── Data loading ─── */
/* ──────────────────────────────────────────────────────────────────────
   ARCHITECTURE DE DONNÉES (refonte 2026-05-06)
   ──────────────────────────────────────────────────────────────────────
   Source PRIMAIRE = collection `clients` (coaching). Chaque doc est un
   client en accompagnement, avec ses sessions, programme, quotas, coach.

   Source d'ENRICHISSEMENT = `leads where isClient==true && !_merged`,
   matché par email canonicalisé. Apporte au client unifié :
     • paymentsByLead (indexés par leadId du lead matché)
     • kajabiProgress (champ stocké sur le lead, alimenté par csm-import)
     • gcCustomerId, source, importedCreatedAt (champs CRM)
     • temoByLead (témoignages sous-collection du lead)

   Les writes (notes csmNotes, relances csmFollowupHistory, statut
   clientStatus) vont TOUJOURS sur clients/{coachingId}, qui est la
   source de vérité de la CSM. Les leads ne sont plus écrits par la CSM.

   `id` du client unifié = coachingId (doc ID dans `clients`).
   `_leadId` = leadId du lead matché si trouvé, sinon null.
   `_hasLead` = booléen pour styler/conditionner.
   ────────────────────────────────────────────────────────────────────── */

function loadAllData(){
  loadCoachMembers();
  loadCoachingClients();   // → déclenche loadEnrichmentLeads() après chaque snap
  loadVue360Data();        // Step 6.2 : persons + invoice_clients + subscriptions
}

/* ─── Step 6.2 : Vue 360° persons ─────────────────────────────────────
   Charge les 3 collections nécessaires à la section "Vue 360° persons"
   du panneau détail. allSettled tolère les permission-denied (ex. csm
   sans accès à invoice_clients) — la section sera juste partielle.

   Variables globales remplies :
     personsById     personId → personDoc
     icsByPersonId   personId → invoice_client doc
     subsByPersonId  personId → [subscription docs]
*/
var personsById   = {};
var icsByPersonId = {};
var subsByPersonId = {};
function loadVue360Data(){
  Promise.allSettled([
    db.collection('persons').get(),
    db.collection('invoice_clients').get(),
    db.collection('subscriptions').get()
  ]).then(function(results){
    if(results[0].status === 'fulfilled'){
      personsById = {};
      results[0].value.forEach(function(d){
        personsById[d.id] = Object.assign({_id:d.id}, d.data());
      });
    } else {
      console.warn('[csm-360] persons load failed:', results[0].reason && results[0].reason.message);
    }
    if(results[1].status === 'fulfilled'){
      icsByPersonId = {};
      results[1].value.forEach(function(d){
        var data = d.data();
        if(data.personId) icsByPersonId[data.personId] = Object.assign({_id:d.id}, data);
      });
    } else {
      console.warn('[csm-360] invoice_clients load failed:', results[1].reason && results[1].reason.message);
    }
    if(results[2].status === 'fulfilled'){
      subsByPersonId = {};
      results[2].value.forEach(function(d){
        var data = d.data();
        if(!data.personId) return;
        if(!subsByPersonId[data.personId]) subsByPersonId[data.personId] = [];
        subsByPersonId[data.personId].push(Object.assign({_id:d.id}, data));
      });
    } else {
      console.warn('[csm-360] subscriptions load failed:', results[2].reason && results[2].reason.message);
    }
    /* Si on a déjà un client ouvert, re-render le modal pour faire apparaître la section */
    if(openClientId) renderModal();
  });
}

/* Récupère le personId associé à un client csm — via le lead ou le coaching */
function getPersonIdForClient(c){
  if(!c) return null;
  if(c._lead && c._lead.personId) return c._lead.personId;
  if(c._coaching && c._coaching.personId) return c._coaching.personId;
  return null;
}

/* Render la section Vue 360° pour le client courant. Renvoie le HTML.
   Si pas de personId trouvé, renvoie une string vide. */
function renderVue360Section(c){
  var personId = getPersonIdForClient(c);
  if(!personId) return '';

  var p = personsById[personId];
  if(!p) return '';   /* persons pas encore chargé ou pas trouvé */

  var ic     = icsByPersonId[personId] || null;
  var subs   = subsByPersonId[personId] || [];
  var pays   = paymentsByLead[c._leadId] || [];   /* déjà indexé par leadId */
  var leadOk = !!c._leadId;
  var coachOk = !!c._coaching;

  var h = '<div class="csm-360">';
  h += '<div class="csm-360-head">';
  h += '<div class="csm-360-title"><i class="ti ti-hexagon"></i>Vue 360° persons</div>';
  if(currentRole === 'admin'){
    h += '<a href="admin-persons.html?id=' + esc(personId) + '" target="_blank" class="csm-btn"><i class="ti ti-external-link"></i>Ouvrir la fiche complète</a>';
  } else {
    h += '<span style="font-size:11px;color:var(--ink-soft);font-family:JetBrains Mono,monospace">personId : ' + esc(personId) + '</span>';
  }
  h += '</div>';

  h += '<div class="csm-360-grid">';

  /* Lead */
  h += '<div class="csm-360-card">';
  h += '<div class="csm-360-card-h"><i class="ti ti-list-details"></i><span>Lead</span><span class="count">' + (leadOk ? '1' : '0') + '</span></div>';
  if(leadOk){
    h += '<div class="csm-360-line"><span class="lbl">stage :</span> ' + esc((c._lead && c._lead.stage) || '—') + '</div>';
    h += '<div class="csm-360-line"><span class="lbl">source :</span> ' + esc((c._lead && (c._lead.source || c._lead.utm)) || '—') + '</div>';
    h += '<a href="sales-leads.html?leadId=' + esc(c._leadId) + '" target="_blank" class="csm-360-link">Ouvrir CRM <i class="ti ti-external-link"></i></a>';
  } else {
    h += '<div class="csm-360-empty">Aucun lead lié.</div>';
  }
  h += '</div>';

  /* Coaching */
  h += '<div class="csm-360-card">';
  h += '<div class="csm-360-card-h"><i class="ti ti-school"></i><span>Coaching</span>';
  if(coachOk){
    var st = (c._coaching && c._coaching.statut) || '—';
    var stCls = (st === 'actif') ? 'cs-active' : 'neutral';
    h += '<span class="csm-badge ' + stCls + '" style="margin-left:auto">' + esc(st) + '</span>';
  } else {
    h += '<span class="count">0</span>';
  }
  h += '</div>';
  if(coachOk){
    h += '<div class="csm-360-line"><span class="lbl">programme :</span> ' + esc((c._coaching && c._coaching.programme) || '—') + '</div>';
    h += '<div class="csm-360-line"><span class="lbl">date entrée :</span> ' + esc((c._coaching && c._coaching.dateEntree) || '—') + '</div>';
  } else {
    h += '<div class="csm-360-empty">Aucun suivi coaching.</div>';
  }
  h += '</div>';

  /* Invoice client */
  h += '<div class="csm-360-card">';
  h += '<div class="csm-360-card-h"><i class="ti ti-receipt"></i><span>Fiche facturation</span>';
  h += '<span class="' + (ic ? 'csm-badge ok' : 'count') + '" style="margin-left:auto">' + (ic ? 'linkée' : '—') + '</span>';
  h += '</div>';
  if(ic){
    h += '<div class="csm-360-line"><span class="lbl">type :</span> ' + esc(ic.clientType || 'individual') + '</div>';

  if(subs.length > 0){

    h += '<div class="csm-360-card full">';
    h += '<div class="csm-360-card-h"><i class="ti ti-refresh"></i><span>Abonnement actif</span>';
    h += '<span class="csm-badge ' + (sub.status === 'active' ? 'ok' : 'neutral') + '" style="margin-left:auto">' + esc(sub.status || '—') + '</span>';
    h += '</div>';
    h += '<div style="display:flex;gap:24px;font-size:12.5px;flex-wrap:wrap">';
    h += '<div><span class="lbl" style="color:var(--ink-muted)">programme :</span> ' + esc(sub.description || sub.programme || '—') + '</div>';
    h += '<div><span class="lbl" style="color:var(--ink-muted)">échéance :</span> ' + (sub.installmentAmount || 0) + ' € ' + (sub.vatType === 'ttc' ? 'TTC' : 'HT') + ' / ' + esc(sub.frequency || 'mois') + '</div>';
    h += '<div><span class="lbl" style="color:var(--ink-muted)">prochaine :</span> ' + esc(fmtDate(sub.nextBillingDate)) + '</div>';
    h += '<div><span class="lbl" style="color:var(--ink-muted)">restant :</span> ' + (sub.installmentsRemaining || '?') + ' / ' + (sub.totalInstallments || '?') + '</div>';
    h += '</div>';
    if(subs.length > 1){
      h += '<div style="margin-top:7px;font-size:11px;color:var(--ink-muted)">+ ' + (subs.length - 1) + ' autre(s) abonnement(s)</div>';
    }
    h += '</div>';
  }

  h += '</div>'; /* end grid */
  h += '</div>'; /* end csm-360 */

  return h;
}

/* ─── Listener primaire : clients (coaching) ─── */
function loadCoachingClients(){
  db.collection('clients').onSnapshot(function(snap){
    coachingByEmail = {};
    snap.forEach(function(d){
      var data = d.data();
      data._id = d.id;
      var email = (data.email || '').toLowerCase().trim();
      if(email) coachingByEmail[email] = data;
    });
    /* Step 6.2 perf fix : on charge maintenant les leads pertinents
       uniquement (where email in [...]) plutôt que toute la collection.
       Réduit le transfert de ~7549 leads à ~80 emails matchants. */
    loadEnrichmentLeads();
  }, function(err){
    console.error('Clients listener error:', err);
    document.getElementById('csmBody').innerHTML =
      '<div class="csm-empty"><div class="csm-empty-icon">⚠️</div><div class="csm-empty-title">Erreur de chargement coaching</div><div>' + esc(err.message) + '</div></div>';
  });
}

/* ─── Listener enrichissement : leads (tous, pas seulement isClient=true) ───
   Initialement on filtrait sur `isClient==true` mais ça ratait des matches
   où le lead correspondait à un coaching mais n'avait pas (encore) le flag
   isClient. Exemple concret : un lead "sebastien" converti en client (visible
   dans sa timeline) mais dont le flag isClient n'avait pas été propagé →
   le coaching BELLE ANNE (même email contact@climabitat.net) apparaissait
   comme "Pas de lead CRM lié" alors que le lead existait bel et bien.

   On charge donc maintenant TOUS les leads (skip _merged===true) pour le
   matching par email. C'est un peu plus lourd en lecture Firestore mais
   beaucoup plus robuste. Si la collection grossit énormément (>20k leads),
   on pourra optimiser via where('email','in',[...batches]).               */
var leadsByEmail = {};
function loadEnrichmentLeads(){
  /* Step 6.2 perf fix : au lieu de charger TOUS les leads (7549) via
     onSnapshot, on ne charge que les leads dont l'email matche un coaching
     existant via where('email', 'in', batch). Firestore limite 'in' à 10
     valeurs par query → on batche par 10. ~78 emails = ~8 queries.

     Compromis : pas de temps réel sur les changements de leads (un edit
     dans sales-leads ne se reflète pas instantanément ici). On préfère
     ce trade-off vs charger 7549 docs à chaque ouverture de page. */

  var emails = Object.keys(coachingByEmail);
  if(emails.length === 0){
    leadsByEmail = {};
    buildAllClients();
    return;
  }

  /* Batch par 10 (limite Firestore .where('email', 'in', [...])) */
  var batches = [];
  for(var i = 0; i < emails.length; i += 10){
    batches.push(emails.slice(i, i + 10));
  }

  var queries = batches.map(function(batch){
    return db.collection('leads').where('email', 'in', batch).get();
  });

  Promise.all(queries).then(function(snapshots){
    leadsByEmail = {};
    snapshots.forEach(function(snap){
      snap.forEach(function(d){
        var data = d.data();
        if(data._merged === true) return;
        var em = (data.email||'').toLowerCase().trim();
        if(!em) return;
        data.id = d.id;
        /* Si plusieurs leads partagent le même email, on garde celui qui a
           isClient=true en priorité (c'est le plus pertinent pour la CSM),
           sinon le plus récemment mis à jour. */
        var existing = leadsByEmail[em];
        if(!existing){
          leadsByEmail[em] = data;
        } else {
          var existingIsClient = !!existing.isClient;
          var newIsClient = !!data.isClient;
          if(newIsClient && !existingIsClient){
            leadsByEmail[em] = data;
          } else if(newIsClient === existingIsClient){
            var existingT = toDate(existing.updatedAt) || toDate(existing.createdAt) || new Date(0);
            var newT = toDate(data.updatedAt) || toDate(data.createdAt) || new Date(0);
            if(newT > existingT) leadsByEmail[em] = data;
          }
        }
      });
    });
    buildAllClients();
  }).catch(function(err){
    console.warn('Leads enrichment query error (non-bloquant):', err.message);
    leadsByEmail = {};
    buildAllClients();
  });
}

/* ─── Construction des clients unifiés depuis coaching + enrichissement lead ───
   Cette fonction est appelée chaque fois que l'un des deux listeners reçoit
   un snapshot. Elle reconstruit allClients de manière déterministe en
   prenant clients (coaching) comme source et en mergeant avec leads quand
   il y a match par email. */
function buildAllClients(){
  allClients = [];
  Object.keys(coachingByEmail).forEach(function(em){
    var co = coachingByEmail[em];
    var lead = leadsByEmail[em] || null;

    // Composer le nom (préfix prénom si dispo et pas déjà dans nom)
    var nom = co.nom || co.name || '';
    if(co.prenom && nom.indexOf(co.prenom) < 0){
      nom = (co.prenom + ' ' + nom).trim();
    }
    if(!nom && lead) nom = lead.nom || '';
    if(!nom) nom = 'Sans nom';

    // Status : la CSM écrit sur clients/, donc clients/.clientStatus prioritaire.
    // Fallback : statut coaching natif (actif/inactif), puis lead.clientStatus.
    var status = co.clientStatus
                || (co.statut === 'inactif' ? 'paused' : null)
                || (lead && lead.clientStatus)
                || 'active';

    var client = {
      id: co._id,                    // toujours coachingId — source primaire
      _coachingId: co._id,
      _leadId: lead ? lead.id : null,
      _hasLead: !!lead,
      _coaching: co,                 // ref vers le doc coaching pour fonctions helper
      _lead: lead,                   // ref vers lead matché si présent

      // Champs identité (priorité coaching, fallback lead)
      nom: nom,
      email: co.email || em,
      telephone: co.telephone || co.phone || co.tel || (lead && lead.telephone) || '',
      commerce: co.activite || co.secteur || (lead && lead.commerce) || '',
      type: co.type || (lead && lead.type) || '',
      secteur: co.secteur || co.activite || (lead && lead.secteur) || '',

      // Marqueurs CSM (depuis clients/, source primaire)
      clientStatus: status,
      clientSince: co.dateEntree || (lead && lead.clientSince) || null,
      lastCsmFollowupAt: co.lastCsmFollowupAt || (lead && lead.lastCsmFollowupAt) || null,
      lastCsmFollowupBy: co.lastCsmFollowupBy || (lead && lead.lastCsmFollowupBy) || null,
      csmFollowupHistory: co.csmFollowupHistory || (lead && lead.csmFollowupHistory) || [],

      // Champs enrichis depuis le lead (CRM-only)
      kajabiProgress: lead ? (lead.kajabiProgress || null) : null,
      gcCustomerId: lead ? (lead.gcCustomerId || null) : null,
      source: lead ? lead.source : null,
      importedCreatedAt: lead ? lead.importedCreatedAt : null,

      isClient: true
    };

    allClients.push(client);
  });

  // Tri : plus récents (entrée coaching) d'abord
  allClients.sort(function(a,b){
    var da = toDate(a.clientSince) || new Date(0);
    var db_ = toDate(b.clientSince) || new Date(0);
    return db_ - da;
  });

  // Recharger paiements/témoignages indexés par _leadId du lead matché
  loadPaymentsForClients();
  loadTemoignagesForClients();

  // ─── Auto-ouverture modal si ?clientId=X dans l'URL ───
  // Tolérant : le clientId peut être un coachingId (recommandé) ou un
  // ancien leadId (deeplinks anciens). On match les deux cas.
  var openId = (new URLSearchParams(window.location.search)).get('clientId');
  if(openId && !window._csmClientAutoOpened){
    window._csmClientAutoOpened = true;
    setTimeout(function(){
      // Cas 1 : coachingId trouvé direct
      var found = allClients.find(function(x){ return x.id === openId; });
      // Cas 2 : leadId → remonter au coaching matché
      if(!found) found = allClients.find(function(x){ return x._leadId === openId; });
      if(found) openClientModal(found.id);
    }, 500);
  }
}

/* ─── Quota / sessions logic — réplique de coaching.html ─── */
function getMonthlyQuota(programme){
  if(!programme) return 1;
  var p = String(programme).toLowerCase();
  if(p.indexOf('24c') >= 0) return 2;
  if(p.indexOf('12c') >= 0) return 1;
  if(p.indexOf('6c')  >= 0) return 1;
  return 1;
}
function getAllCoachingSessions(coachingDoc){
  if(!coachingDoc) return [];
  if(coachingDoc.years && coachingDoc.years.length){
    var all = [];
    coachingDoc.years.forEach(function(y){ (y.sessions||[]).forEach(function(s){ all.push(s); }); });
    return all;
  }
  return coachingDoc.sessions || [];
}
function getSessionsInMonth(coachingDoc, year, month){
  return getAllCoachingSessions(coachingDoc).filter(function(s){
    if(s.statut !== 'fait' || !s.date) return false;
    if(s.numero === 0 || s.type === 'rdv72h') return false;
    var d = new Date(s.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });
}
function getCoachingQuotaStatus(coachingDoc, year, month){
  if(!coachingDoc) return null;
  var done  = coachingDoc.nbCoachingsFaits || 0;
  var total = coachingDoc.nbCoachingsTotal || 12;
  if(done >= total) return { status:'done', used:0, max:0 };
  var quota = getMonthlyQuota(coachingDoc.programme);
  var sessions = getSessionsInMonth(coachingDoc, year, month);
  var used = sessions.length;
  if(used >= quota)  return { status:'ok', used:used, max:quota };
  if(used > 0)       return { status:'partial', used:used, max:quota };
  return { status:'miss', used:0, max:quota };
}
function getCoachingForLead(lead){
  // Match best-effort par email canonicalisé
  var email = (lead.email || '').toLowerCase().trim();
  if(!email) return null;
  return coachingByEmail[email] || null;
}
function getLastSessionDate(coachingDoc){
  var ss = getAllCoachingSessions(coachingDoc).filter(function(s){
    return s.statut === 'fait' && s.date && s.numero !== 0 && s.type !== 'rdv72h';
  });
  if(!ss.length) return null;
  ss.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
  return new Date(ss[0].date);
}

/* ─── RDV 72H : la session d'onboarding faite dans les 72h après inscription ───
   Convention coaching.html : type === 'rdv72h' OU numero === 0. C'est un
   signal critique côté CSM — si raté, le client démarre mal. */
function getRdv72h(coachingDoc){
  var allSess = getAllCoachingSessions(coachingDoc);
  return allSess.find(function(s){
    return s.type === 'rdv72h' || s.numero === 0;
  }) || null;
}

/* ─── Calculer la date de début effective d'un client coaching ───
   On combine deux signaux pour ne pas tagger à tort un client comme
   "en retard" sur des mois où il n'avait pas encore commencé :
     • dateEntree (peut être mal saisie, parfois dans le futur)
     • Date de la PREMIÈRE session réelle (peut précéder l'entrée
       officielle, ex : RDV 72H avant le contrat)
   On prend le MINIMUM des deux comme repère réel de début. Si les deux
   sont absents, retourne null (impossible de déterminer).
   Cette fonction est utilisée à 2 endroits :
     1. Affichage de l'historique 4 mois précédents (afficher "Avant
        début" plutôt que "0/1 ❌")
     2. computeLevel — un client tout juste arrivé ne peut pas être
        marqué CRITIQUE pour absence de coaching dans le passé.        */
function getCoachingStartReference(coachingDoc){
  if(!coachingDoc) return null;
  var entry = coachingDoc.dateEntree ? new Date(coachingDoc.dateEntree) : null;
  if(entry && isNaN(entry.getTime())) entry = null;
  var firstSess = null;
  var allSess = getAllCoachingSessions(coachingDoc).filter(function(s){
    return s.statut === 'fait' && s.date;
  });
  if(allSess.length){
    allSess.sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
    var d = new Date(allSess[0].date);
    if(!isNaN(d.getTime())) firstSess = d;
  }
  if(entry && firstSess) return entry < firstSess ? entry : firstSess;
  return entry || firstSess;
}

function loadPaymentsForClients(){
  if(!allClients.length){ renderAll(); return; }
  // Les paiements sont indexés par leadId — on ne charge que pour les
  // clients qui ont un _leadId (lead matché). Les autres n'auront pas de
  // paiements visibles, c'est par design.
  var ids = allClients.filter(function(c){ return c._leadId; })
                     .map(function(c){ return c._leadId; });
  paymentsByLead = {};
  if(!ids.length){ renderAll(); return; }
  // Chunks de 10 (limite Firestore where-in)
  var chunks = [];
  for(var i = 0; i < ids.length; i += 10) chunks.push(ids.slice(i, i + 10));
  var pending = chunks.length;
  chunks.forEach(function(chunk){
    db.collection('payments').where('leadId','in',chunk).get().then(function(sn){
      sn.forEach(function(d){
        var p = d.data(); p.id = d.id;
        if(!paymentsByLead[p.leadId]) paymentsByLead[p.leadId] = [];
        paymentsByLead[p.leadId].push(p);
      });
      if(--pending <= 0){
        Object.keys(paymentsByLead).forEach(function(k){
          paymentsByLead[k].sort(function(a,b){
            return (toDate(b.createdAt)||new Date(0)) - (toDate(a.createdAt)||new Date(0));
          });
        });
        renderAll();
      }
    }).catch(function(e){
      console.warn('Payments chunk error', e);
      if(--pending <= 0) renderAll();
    });
  });
}

function loadTemoignagesForClients(){
  temoByLead = {};
  temoFlat = [];
  // Témoignages = sous-collection des leads. Donc on ne charge que pour
  // les clients qui ont un lead matché (_leadId).
  var clientsWithLead = allClients.filter(function(c){ return c._leadId; });
  if(!clientsWithLead.length){ renderAll(); return; }
  var pending = clientsWithLead.length;
  clientsWithLead.forEach(function(c){
    db.collection('leads').doc(c._leadId).collection('client_temoignages')
      .orderBy('createdAt','desc').get()
      .then(function(snap){
        var arr = [];
        snap.forEach(function(d){
          var o = d.data(); o._id = d.id; o._leadId = c._leadId;
          o._clientId = c.id;
          o._leadName = clientDisplayName(c);
          arr.push(o);
          temoFlat.push(o);
        });
        // Index par clientId (id unifié) pour cohérence avec le reste
        temoByLead[c.id] = arr;
        if(--pending <= 0){
          temoFlat.sort(function(a,b){
            return (toDate(b.createdAt)||new Date(0)) - (toDate(a.createdAt)||new Date(0));
          });
          renderAll();
        }
      }).catch(function(){
        if(--pending <= 0) renderAll();
      });
  });
}

function loadNotesForLead(clientId, cb){
  // Toutes les notes CSM sont stockées sur clients/{coachingId}.csmNotes
  // (array). Le clientId passé EST le coachingId (cf. buildAllClients).
  var c = allClients.find(function(x){ return x.id === clientId; });
  if(!c){
    notesByLead[clientId] = [];
    if(cb) cb([]);
    return;
  }
  // Lire le doc fresh pour avoir les notes les plus récentes (le snapshot
  // des coachings nous donne déjà les notes mais peut être un poil en
  // retard après un addNote).
  db.collection('clients').doc(c.id).get().then(function(snap){
    var data = snap.data() || {};
    var arr = (data.csmNotes || []).slice().sort(function(a,b){
      var da = toDate(a.createdAt) || new Date(0);
      var dbn = toDate(b.createdAt) || new Date(0);
      return dbn - da;
    });
    notesByLead[clientId] = arr;
    if(cb) cb(arr);
  }).catch(function(){
    // Fallback : utiliser le cache du snapshot
    var co = c._coaching || {};
    var arr = (co.csmNotes || []).slice();
    notesByLead[clientId] = arr;
    if(cb) cb(arr);
  });
}

function renderAll(){

  renderKpiStrip();            // 4 KPI cards en haut

  renderSidebarList();         // Liste compacte des clients

/* ─── KPI strip — 4 cards cliquables qui filtrent la liste ─── */
function renderKpiStrip(){
  var s = window._statsCache || {};
  var pendingThisWeek = computePendingFollowups();
  var doneToday = computeDoneFollowupsToday();

  var html = '';
  html += '<div class="csm-kpi" onclick="setSidebarFilter(\'crit\')">';
  html += '<div class="csm-kpi-num" style="color:var(--crit-color)"><i class="ti ti-alert-circle"></i>' + (s.crit||0) + '</div>';
  html += '<div class="csm-kpi-label">Critiques · à actionner</div>';
  html += '<div class="csm-kpi-trend">' + (s.crit > 0 ? 'Action urgente requise' : 'RAS pour le moment') + '</div>';
  html += '</div>';

  html += '<div class="csm-kpi" onclick="setSidebarFilter(\'coachLate\')">';
  html += '<div class="csm-kpi-num" style="color:#fb923c"><i class="ti ti-target"></i>' + (s.coachLate||0) + '</div>';
  html += '<div class="csm-kpi-label">Retards coaching</div>';
  html += '<div class="csm-kpi-trend">2 mois sans session</div>';
  html += '</div>';

  html += '<div class="csm-kpi" onclick="setSidebarFilter(\'payment\')">';
  html += '<div class="csm-kpi-num" style="color:#dc2626"><i class="ti ti-credit-card"></i>' + (s.payIssue||0) + '</div>';
  html += '<div class="csm-kpi-label">Paiements en échec</div>';
  html += '<div class="csm-kpi-trend">À récupérer</div>';
  html += '</div>';

  html += '<div class="csm-kpi" onclick="setSidebarFilter(\'warn\')">';
  html += '<div class="csm-kpi-num" style="color:#60a5fa"><i class="ti ti-phone-call"></i>' + pendingThisWeek + '</div>';
  html += '<div class="csm-kpi-label">À relancer cette semaine</div>';
  html += '<div class="csm-kpi-trend up">' + doneToday + ' fait aujourd\'hui</div>';
  html += '</div>';

  document.getElementById('kpiStrip').innerHTML = html;
}

function computePendingFollowups(){
  // À relancer cette semaine = clients warn/att/crit qui n'ont pas été
  // relancés depuis plus de 7 jours
  var sevenDaysAgo = Date.now() - 7*86400000;
  var n = 0;
  allClients.forEach(function(c){
    var lvl = computeLevel(c);
    if(lvl !== 'crit' && lvl !== 'warn' && lvl !== 'att') return;
    var last = toDate(c.lastCsmFollowupAt);
    if(!last || last.getTime() < sevenDaysAgo) n++;
  });
  return n;
}
function computeDoneFollowupsToday(){
  var startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  var n = 0;
  allClients.forEach(function(c){
    var last = toDate(c.lastCsmFollowupAt);
    if(last && last >= startOfDay) n++;
  });
  return n;
}

function computeStats(){
  var crit = 0, warn = 0, att = 0, active = 0, coachLate = 0, payIssue = 0;
  allClients.forEach(function(c){
    var status = c.clientStatus || 'active';
    if(status === 'active') active++;
    var lvl = computeLevel(c);
    if(lvl === 'crit') crit++;
    else if(lvl === 'warn') warn++;
    else if(lvl === 'att')  att++;
    // Compteur coaching en retard (au moins 1 mois manqué)
    var coachingDoc = getCoachingForLead(c);
    if(coachingDoc && coachingDoc.statut !== 'inactif'){
      var done  = coachingDoc.nbCoachingsFaits || 0;
      var total = coachingDoc.nbCoachingsTotal || 12;
      if(done < total){
        var nowD = new Date();
        var qNow = getCoachingQuotaStatus(coachingDoc, nowD.getFullYear(), nowD.getMonth());
        if(qNow && qNow.status === 'miss') coachLate++;
      }
    }
    // Compteur paiements en échec
    if(c._leadId){
      var pays = paymentsByLead[c._leadId] || [];
      if(pays.some(function(p){ return p.status === 'failed'; })) payIssue++;
    }
  });
  // Stocker en cache pour renderKpiStrip et autres
  window._statsCache = {
    crit: crit, warn: warn, att: att, active: active,
    coachLate: coachLate, payIssue: payIssue,
    total: allClients.length, temoignages: temoFlat.length
  };
}

function searchMatch(c, q){
  if(!q) return true;
  var hay = ((c.nom||'') + ' ' + (c.commerce||'') + ' ' + (c.email||'') + ' ' + (c.telephone||'')).toLowerCase();
  return hay.indexOf(q.toLowerCase()) >= 0;
}

/* ═════ STATE & FILTRES SIDEBAR ═════════════════════════════════════════
   selectedClientId : id du client affiché dans le panneau de droite.
   sidebarFilter : 'all' | 'crit' | 'warn' | 'att' | 'coachLate' | 'payment' | 'onboarding'
   ═══════════════════════════════════════════════════════════════════════ */
var selectedClientId = null;
var sidebarFilter = 'all';

function setSidebarFilter(filter){
  sidebarFilter = filter;
  renderSidebarPills();
  renderSidebarList();
}
window.setSidebarFilter = setSidebarFilter;

function selectClient(clientId){
  selectedClientId = clientId;
  // Pour la rétro-compat avec les fonctions existantes (changeStatus, addNote, etc.)
  // qui lisent encore openClientId
  openClientId = clientId;
  renderSidebarList();    // re-render pour highlight la sélection
  renderDetailPanel();
  // Charger les notes pour ce client (asynchrone)
  loadNotesForLead(clientId, function(){ renderDetailPanel(); });
}
window.selectClient = selectClient;

/* ─── Sidebar : pills de filtres ─── */
function renderSidebarPills(){
  var s = window._statsCache || {};
  var pills = [
    { id: 'all',         label: 'Tous',          count: allClients.length, cls: '' },
    { id: 'crit',        label: '🔴 Critiques',  count: s.crit||0,         cls: 'crit' },
    { id: 'warn',        label: '🟠 À relancer', count: s.warn||0,         cls: 'warn' },
    { id: 'att',         label: '🟡 Attention',  count: s.att||0,          cls: 'att' },
    { id: 'coachLate',   label: '🎯 Retard coaching', count: s.coachLate||0, cls: '' },
    { id: 'payment',     label: '💳 Échec paiement', count: s.payIssue||0, cls: '' }
  ];
  var html = pills.map(function(p){
    var on = sidebarFilter === p.id;
    return '<button class="csm-sb-pill ' + p.cls + (on?' on':'') + '" onclick="setSidebarFilter(\'' + p.id + '\')">'
         + p.label + ' · ' + p.count + '</button>';
  }).join('');
  document.getElementById('filterPills').innerHTML = html;
}

/* ─── Sidebar : liste compacte filtrée ─── */
function getFilteredClients(){
  var q = (document.getElementById('searchInput').value || '').trim();
  return allClients.filter(function(c){
    if(!searchMatch(c, q)) return false;
    var lvl = computeLevel(c);
    if(sidebarFilter === 'all') return true;
    if(sidebarFilter === 'crit') return lvl === 'crit';
    if(sidebarFilter === 'warn') return lvl === 'warn';
    if(sidebarFilter === 'att')  return lvl === 'att';
    if(sidebarFilter === 'coachLate'){
      var co = getCoachingForLead(c);
      if(!co || co.statut === 'inactif') return false;
      var done = co.nbCoachingsFaits || 0, total = co.nbCoachingsTotal || 12;
      if(done >= total) return false;
      var now = new Date();
      var q2 = getCoachingQuotaStatus(co, now.getFullYear(), now.getMonth());
      return q2 && q2.status === 'miss';
    }
    if(sidebarFilter === 'payment'){
      if(!c._leadId) return false;
      var pays = paymentsByLead[c._leadId] || [];
      return pays.some(function(p){ return p.status === 'failed'; });
    }
    return true;
  }).sort(function(a, b){
    // Tri : critiques d'abord, puis warn, puis att, puis ok
    var order = { crit: 0, warn: 1, att: 2, ok: 3 };
    var la = order[computeLevel(a)] !== undefined ? order[computeLevel(a)] : 4;
    var lb = order[computeLevel(b)] !== undefined ? order[computeLevel(b)] : 4;
    if(la !== lb) return la - lb;
    // À niveau égal : tri par dernière relance (les jamais relancés en premier)
    var ta = toDate(a.lastCsmFollowupAt);
    var tb = toDate(b.lastCsmFollowupAt);
    if(!ta && tb) return -1;
    if(ta && !tb) return 1;
    if(ta && tb) return ta - tb; // plus ancien d'abord
    return 0;
  });
}

function renderSidebarList(){
  var list = getFilteredClients();
  var listEl = document.getElementById('clientsList');
  if(!list.length){
    listEl.innerHTML = '<div class="csm-empty"><div class="csm-empty-icon">🌟</div>'
                     + '<div class="csm-empty-title">Aucun client</div>'
                     + '<div>Aucun client ne correspond aux filtres</div></div>';
    return;
  }
  // Auto-sélection du premier client si rien n'est sélectionné
  if(!selectedClientId || !list.find(function(c){ return c.id === selectedClientId; })){
    selectedClientId = list[0].id;
    openClientId = selectedClientId; // rétro-compat
    setTimeout(renderDetailPanel, 0);
  }
  var html = list.map(function(c){
    return renderSidebarRow(c);
  }).join('');
  listEl.innerHTML = html;
}

function renderSidebarRow(c){
  var lvl = computeLevel(c) || 'ok';
  var dotCls = lvl === 'crit' ? 'crit' : lvl === 'warn' ? 'warn' : lvl === 'att' ? 'att' : 'ok';
  var sel = (c.id === selectedClientId) ? ' selected' : '';
  var timeText = '—';
  if(c.lastCsmFollowupAt){
    timeText = timeAgo(c.lastCsmFollowupAt);
  } else if(c.clientSince){
    timeText = '+' + timeAgo(c.clientSince);
  }

  // Tags : on prend les 1-2 raisons les plus prioritaires
  var reasons = (c._reasons || computeReasons(c)).slice(0, 1);
  var tagsHtml = '';
  if(reasons.length){
    var r = reasons[0];
    var tagCls = r.level === 'crit' ? 'crit' : r.level === 'warn' ? 'warn' : 'att';
    tagsHtml = '<span class="csm-cr-tag ' + tagCls + '">' + esc(r.label) + '</span>';
  } else if(!c._hasLead){
    tagsHtml = '<span class="csm-cr-tag muted">Pas de lead CRM</span>';
  } else if(lvl === 'ok'){
    tagsHtml = '<span class="csm-cr-tag ok">À jour</span>';
  }

  // Stats compactes : X/Y coaching · montant
  var stats = '';
  var coDoc = getCoachingForLead(c);
  if(coDoc){
    stats += (coDoc.nbCoachingsFaits||0) + '/' + (coDoc.nbCoachingsTotal||12);
  }
  if(c._leadId){
    var pays = paymentsByLead[c._leadId] || [];
    if(pays.length){
      var paid = 0;
      pays.forEach(function(p){ if(p.status !== 'cancelled') paid += (p.paidAmount||0); });
      if(paid > 0) stats += (stats?' · ':'') + fmtEuro(paid);
    }
  }

  return '<div class="csm-client-row' + sel + '" onclick="selectClient(\'' + c.id + '\')">'
       + '<div class="csm-cr-line1">'
       +   '<span class="csm-cr-dot ' + dotCls + '"></span>'
       +   '<span class="csm-cr-name">' + esc(clientDisplayName(c)) + '</span>'
       +   '<span class="csm-cr-time">' + esc(timeText) + '</span>'
       + '</div>'
       + '<div class="csm-cr-meta">'
       +   tagsHtml
       +   (stats ? '<span class="csm-cr-stats">' + stats + '</span>' : '')
       + '</div>'
       + '</div>';
}

function renderRetards(){
  document.getElementById('toolbarRetards').style.display = '';
  document.getElementById('filterStatus').style.display = '';
  document.getElementById('filterPayStatus').style.display = 'none';
  var _fr = document.getElementById('filterReason'); if(_fr) _fr.style.display = 'none';
  var reasonFilterEl = document.getElementById('filterReason');
  if(reasonFilterEl) reasonFilterEl.style.display = '';
  var body = document.getElementById('csmBody');
  var list = [];
  allClients.forEach(function(c){
    var lvl = computeLevel(c);
    if(!lvl || lvl === 'ok') return;
    if(!levelsActive[lvl]) return;
    if(filterStatus !== 'all' && (c.clientStatus || 'active') !== filterStatus) return;
    if(!searchMatch(c, searchQ)) return;
    c._level = lvl;
    c._reasons = computeReasons(c);
    // Filtre par motif (paiement / coaching / autre)
    if(filterReason && filterReason !== 'all'){
      if(filterReason === 'payment'  && !c._reasons.some(function(r){ return r.kind === 'payment'; })) return;
      if(filterReason === 'coaching' && !c._reasons.some(function(r){ return r.kind === 'coaching'; })) return;
    }
    list.push(c);
  });
  // Sort : crit → warn → att
  var rank = { crit:0, warn:1, att:2 };
  list.sort(function(a,b){ return rank[a._level] - rank[b._level]; });

  if(!list.length){
    body.innerHTML = '<div class="csm-empty"><div class="csm-empty-icon">🎉</div>' +
      '<div class="csm-empty-title">Aucune alerte active</div>' +
      '<div>Tous les clients sont sous contrôle ou hors filtres.</div></div>';
    return;
  }
  var h = '<div class="csm-list">';
  list.forEach(function(c){ h += renderClientCard(c); });
  h += '</div>';
  body.innerHTML = h;
}

/* Calcule la liste des motifs d'alerte pour un client (pour affichage badges
   et filtrage par motif). Distingue paiement vs coaching. */
function computeReasons(c){
  var reasons = [];
  var status = c.clientStatus || 'active';
  if(status === 'procedure'){
    reasons.push({ kind:'payment', level:'crit', label:'⚖️ Procédure' });
  }
  var pays = paymentsByLead[c._leadId] || [];
  pays.forEach(function(p){
    if(p.status === 'failed'){
      reasons.push({ kind:'payment', level:'crit', label:'❌ Paiement en échec' });
    } else if(p.status === 'cancelled'){
      reasons.push({ kind:'payment', level:'warn', label:'🚫 Paiement annulé' });
    } else if(p.status === 'active' && p.installmentsCount > 1){
      var start = toDate(p.startDate);
      if(start){
        var monthsElapsed = (new Date().getFullYear() - start.getFullYear())*12 + (new Date().getMonth() - start.getMonth()) + 1;
        var expected = Math.min(monthsElapsed, p.installmentsCount);
        var late = expected - (p.paidCount || 0) - 1;
        if(late > 0) reasons.push({ kind:'payment', level:'crit', label:'⚠️ ' + late + ' mois de retard prélèv.' });
      }
    } else if(p.status === 'pending_mandate'){
      var ts = toDate(p.createdAt);
      if(ts && (Date.now() - ts.getTime()) > 7*86400000){
        reasons.push({ kind:'payment', level:'warn', label:'⏳ Mandat non signé +7j' });
      }
    }
  });
  if(status === 'active' && pays.length === 0){
    reasons.push({ kind:'payment', level:'att', label:'💸 Aucun paiement enregistré' });
  }
  if(status === 'paused'){
    reasons.push({ kind:'other', level:'warn', label:'⏸ Compte en pause' });
  }

  // Coaching
  var coachingDoc = getCoachingForLead(c);
  if(coachingDoc && coachingDoc.statut !== 'inactif'){
    var done = coachingDoc.nbCoachingsFaits || 0, total = coachingDoc.nbCoachingsTotal || 12;
    if(done < total){
      var now = new Date();
      var qN = getCoachingQuotaStatus(coachingDoc, now.getFullYear(), now.getMonth());
      var prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
      var qP = getCoachingQuotaStatus(coachingDoc, prev.getFullYear(), prev.getMonth());
      if(qN && qP && qN.status === 'miss' && qP.status === 'miss'){
        reasons.push({ kind:'coaching', level:'crit', label:'🎯 2 mois sans coaching' });
      } else if(qN && qN.status === 'miss'){
        reasons.push({ kind:'coaching', level:'warn', label:'🎯 Pas de coaching ce mois' });
      } else if(qN && qN.status === 'partial'){
        reasons.push({ kind:'coaching', level:'att', label:'🎯 Sous quota mensuel (' + qN.used + '/' + qN.max + ')' });
      }
    }
  }
  return reasons;
}

/* ─── computeSignals(c) ───
   Produit les "cartes actionnables" pour le bloc Signaux à actionner de
   la Vue d'ensemble. Chaque signal a :
     - level : crit | warn | att | info  → couleur
     - icon : emoji affiché (Adrien préfère emojis sur statuts)
     - title : phrase courte (gras)
     - desc : contexte (1 ligne, gris)
     - actionLabel : verbe d'action ("Programmer", "Contacter"…)
     - actionFn : code JS à exécuter au clic (string pour onclick inline)
   Réutilise les helpers existants pour cohérence avec computeReasons.   */
function computeSignals(c){
  var signals = [];
  var pays = paymentsByLead[c._leadId] || [];
  var coachingDoc = getCoachingForLead(c);

  // 1. Lead non lié → signal info violet
  if(!c._hasLead){
    signals.push({
      level: 'info', icon: '📚',
      title: 'Pas de lead CRM lié',
      desc: 'Paiements GoCardless invisibles tant qu\'il n\'y a pas de lead',
      actionLabel: 'Créer le lead',
      actionFn: 'csmCreateLeadForClient(\'' + c.id + '\')'
    });
  } else if(c._lead && !c._lead.isClient){
    signals.push({
      level: 'warn', icon: '⚠️',
      title: 'Lead trouvé mais pas marqué client',
      desc: 'Le lead "' + esc(c._lead.nom||c._lead.email) + '" existe mais isClient=false',
      actionLabel: 'Marquer client',
      actionFn: 'csmMarkLeadAsClient(\'' + c.id + '\')'
    });
  }

  // 2. RDV 72H raté (signal critique côté CSM)
  var rdv72 = coachingDoc ? getRdv72h(coachingDoc) : null;
  var entryD = coachingDoc && coachingDoc.dateEntree ? new Date(coachingDoc.dateEntree) : null;
  if(coachingDoc && (!rdv72 || rdv72.statut !== 'fait')){
    if(entryD && !isNaN(entryD.getTime())){
      var hSince = (Date.now() - entryD)/3600000;
      if(hSince > 72){
        signals.push({
          level: 'crit', icon: '🔴',
          title: 'RDV 72H raté',
          desc: 'Entré le ' + fmtDate(entryD) + ' · ' + Math.round(hSince/24) + 'j de retard sur l\'onboarding',
          actionLabel: 'Caller le coach',
          actionFn: 'switchModalTab(\'coaching\')'
        });
      } else if(hSince > 24){
        signals.push({
          level: 'warn', icon: '⏱',
          title: 'RDV 72H à programmer',
          desc: 'Reste ' + Math.round(72-hSince) + 'h pour rester dans les délais',
          actionLabel: 'Voir coaching',
          actionFn: 'switchModalTab(\'coaching\')'
        });
      }
    }
  }

  // 3. Coaching : 2 mois sans session (critique)
  if(coachingDoc && coachingDoc.statut !== 'inactif'){
    var done = coachingDoc.nbCoachingsFaits || 0, total = coachingDoc.nbCoachingsTotal || 12;
    if(done < total){
      var now = new Date();
      var refStart = getCoachingStartReference(coachingDoc);
      var refMonth = refStart ? new Date(refStart.getFullYear(), refStart.getMonth(), 1) : null;
      var thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      var prevMonth = new Date(now.getFullYear(), now.getMonth()-1, 1);
      var nowBefore = refMonth && thisMonth < refMonth;
      var prevBefore = refMonth && prevMonth < refMonth;
      var qN = nowBefore ? null : getCoachingQuotaStatus(coachingDoc, now.getFullYear(), now.getMonth());
      var qP = prevBefore ? null : getCoachingQuotaStatus(coachingDoc, prevMonth.getFullYear(), prevMonth.getMonth());

      var lastSess = getLastSessionDate(coachingDoc);
      var lastInfo = lastSess ? 'Dernière session ' + fmtDate(lastSess) : 'Aucune session effectuée';

      if(qN && qP && qN.status === 'miss' && qP.status === 'miss'){
        signals.push({
          level: 'crit', icon: '🎯',
          title: '2 mois sans coaching',
          desc: lastInfo + (lastSess && coachingDoc.coachAssigned ? ' avec ' + esc(coachingDoc.coachAssigned) : ''),
          actionLabel: 'Relancer',
          actionFn: 'markFollowedUp()'
        });
      } else if(qN && qN.status === 'miss'){
        signals.push({
          level: 'warn', icon: '🎯',
          title: 'Aucun coaching ce mois',
          desc: lastInfo + ' · quota mensuel non atteint',
          actionLabel: 'Programmer',
          actionFn: 'switchModalTab(\'coaching\')'
        });
      } else if(qN && qN.status === 'partial'){
        signals.push({
          level: 'att', icon: '🎯',
          title: 'Sous quota mensuel',
          desc: qN.used + '/' + qN.max + ' coachings ce mois — programmer le reste',
          actionLabel: 'Voir détail',
          actionFn: 'switchModalTab(\'coaching\')'
        });
      }
    }
  }

  // 4. Paiements en échec (critique business)
  pays.forEach(function(p){
    if(p.status === 'failed'){
      signals.push({
        level: 'crit', icon: '💳',
        title: 'Paiement en échec',
        desc: fmtEuro(p.totalAmount) + ' · mandat à recréer ou contact direct',
        actionLabel: 'Voir paiements',
        actionFn: 'switchModalTab(\'payments\')'
      });
    } else if(p.status === 'pending_mandate'){
      var ts = toDate(p.createdAt);
      if(ts && (Date.now() - ts.getTime()) > 7*86400000){
        signals.push({
          level: 'warn', icon: '⏳',
          title: 'Mandat non signé depuis +7j',
          desc: fmtEuro(p.totalAmount) + ' · relancer pour signature GoCardless',
          actionLabel: 'Voir paiements',
          actionFn: 'switchModalTab(\'payments\')'
        });
      }
    }
  });

  // 5. Kajabi peu avancé (signal d'engagement)
  if(c.kajabiProgress && c.kajabiProgress.byCourse){
    var courseKeys = Object.keys(c.kajabiProgress.byCourse);
    if(courseKeys.length){
      var sumPct = 0, nPct = 0, firstTitle = '';
      courseKeys.forEach(function(ck){
        var crs = c.kajabiProgress.byCourse[ck] || {};
        if(!firstTitle && crs.title) firstTitle = crs.title;
        if(typeof crs.pct === 'number'){ sumPct += crs.pct; nPct++; }
      });
      if(nPct > 0){
        var avgPct = Math.round(sumPct/nPct);
        // Si client présent depuis >30j et progression < 20% → signal
        var since = c.clientSince ? toDate(c.clientSince) : null;
        if(since && (Date.now() - since.getTime()) > 30*86400000 && avgPct < 20){
          signals.push({
            level: 'att', icon: '🎓',
            title: 'Kajabi peu avancé',
            desc: avgPct + '% sur ' + esc(firstTitle || 'Programme') + ' — encourager',
            actionLabel: 'Voir Academy',
            actionFn: 'switchModalTab(\'academy\')'
          });
        }
      }
    }
  }

  // 6. Jamais relancé alors que client à risque (méta-signal)
  var lvl = computeLevel(c);
  if((lvl === 'crit' || lvl === 'warn') && !c.lastCsmFollowupAt){
    signals.push({
      level: 'info', icon: '📞',
      title: 'Jamais relancé',
      desc: 'Ce client est à risque mais aucune relance enregistrée',
      actionLabel: 'Marquer relancé',
      actionFn: 'markFollowedUp()'
    });
  }

  return signals;
}

function renderAllClients(){
  document.getElementById('toolbarRetards').style.display = 'none';
  document.getElementById('filterStatus').style.display = '';
  document.getElementById('filterPayStatus').style.display = 'none';
  var _fr = document.getElementById('filterReason'); if(_fr) _fr.style.display = 'none';
  var body = document.getElementById('csmBody');
  var list = allClients.slice();
  if(filterStatus !== 'all') list = list.filter(function(c){ return (c.clientStatus||'active') === filterStatus; });
  if(searchQ) list = list.filter(function(c){ return searchMatch(c, searchQ); });
  list.forEach(function(c){ c._level = computeLevel(c); });

  if(!list.length){
    body.innerHTML = '<div class="csm-empty"><div class="csm-empty-icon">📋</div><div class="csm-empty-title">Aucun client</div></div>';

  var h = '<div class="csm-list">';
