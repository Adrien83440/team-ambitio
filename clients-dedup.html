<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: #0a0e1a; color: #e2e8f0; }
    .dedup-page { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .dedup-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .dedup-title h1 { font-size: 28px; font-weight: 800; margin: 0 0 4px; color: #fff; }
    .dedup-title p { color: #94a3b8; margin: 0; font-size: 14px; }
    .dedup-stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .dedup-stat { background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 12px; padding: 10px 16px; min-width: 100px; }
    .dedup-stat-value { font-size: 22px; font-weight: 800; color: #fff; }
    .dedup-stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .dedup-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .dedup-btn { padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: #e2e8f0; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
    .dedup-btn:hover { background: rgba(255,255,255,0.08); }
    .dedup-btn.primary { background: linear-gradient(135deg, #3b82f6, #6366f1); border: none; color: #fff; }
    .dedup-btn.primary:hover { filter: brightness(1.1); }
    .dedup-btn.danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #fca5a5; }
    .dedup-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dedup-mode-tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 4px; margin-bottom: 16px; width: fit-content; }
    .dedup-tab { padding: 8px 18px; border-radius: 8px; border: none; background: transparent; color: #94a3b8; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
    .dedup-tab.active { background: rgba(59,130,246,0.2); color: #93c5fd; }
    .dedup-search { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #e2e8f0; font-size: 14px; font-family: inherit; margin-bottom: 12px; box-sizing: border-box; }
    .dedup-search:focus { outline: none; border-color: rgba(59,130,246,0.5); }
    .clusters-list { display: flex; flex-direction: column; gap: 12px; }
    .cluster-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 16px; transition: all 0.15s; }
    .cluster-card:hover { border-color: rgba(59,130,246,0.3); }
    .cluster-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .cluster-info { flex: 1; min-width: 200px; }
    .cluster-name { font-weight: 700; font-size: 16px; color: #fff; margin-bottom: 4px; }
    .cluster-meta { font-size: 12px; color: #94a3b8; }
    .cluster-meta span { background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 6px; margin-right: 6px; display: inline-block; }
    .cluster-meta .has-conflict { color: #fbbf24; background: rgba(251,191,36,0.1); }
    .cluster-meta .has-payment { color: #34d399; background: rgba(52,211,153,0.1); }
    .cluster-meta .visible-tag { color: #93c5fd; background: rgba(59,130,246,0.15); }
    .cluster-actions { display: flex; gap: 8px; }
    .cluster-actions .dedup-btn { padding: 7px 14px; font-size: 12px; }
    .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
    .empty-state h3 { color: #e2e8f0; margin: 0 0 8px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
    .modal-content { background: #0f1729; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; max-width: 1200px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { margin: 0; font-size: 20px; font-weight: 700; color: #fff; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 28px; cursor: pointer; line-height: 1; padding: 0 8px; }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .merge-summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .merge-chip { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }
    .merge-chip.primary { background: rgba(34,197,94,0.15); color: #86efac; }
    .merge-chip.secondary { background: rgba(255,255,255,0.05); color: #cbd5e1; }
    .merge-chip.conflict { background: rgba(251,191,36,0.15); color: #fcd34d; }
    .conflict-section { background: rgba(251,191,36,0.05); border: 1px solid rgba(251,191,36,0.2); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .conflict-section h3 { margin: 0 0 12px; font-size: 14px; color: #fbbf24; font-weight: 700; }
    .conflict-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .conflict-key { font-weight: 600; color: #e2e8f0; font-size: 13px; margin-bottom: 8px; font-family: monospace; }
    .conflict-options { display: flex; flex-direction: column; gap: 6px; }
    .conflict-option { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .conflict-option:hover { border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.05); }
    .conflict-option input[type="radio"] { margin-top: 4px; cursor: pointer; }
    .conflict-option.selected { border-color: rgba(59,130,246,0.5); background: rgba(59,130,246,0.1); }
    .conflict-option-content { flex: 1; }
    .conflict-option-source { font-size: 11px; color: #94a3b8; margin-bottom: 2px; font-family: monospace; }
    .conflict-option-value { font-size: 13px; color: #e2e8f0; word-break: break-all; }
    .conflict-option-empty { color: #6b7280; font-style: italic; }
    .docs-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
    .docs-table th, .docs-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
    .docs-table th { background: rgba(255,255,255,0.03); color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .docs-table .doc-id { font-family: monospace; font-size: 11px; color: #6b7280; }
    .docs-table .doc-primary { background: rgba(34,197,94,0.05); }
    .docs-table .doc-primary td { border-color: rgba(34,197,94,0.1); }
    .docs-table .col-flag { white-space: nowrap; font-size: 10px; }
    .flag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-right: 3px; }
    .flag.visible { background: rgba(59,130,246,0.15); color: #93c5fd; }
    .flag.invisible { background: rgba(107,114,128,0.15); color: #9ca3af; }
    .flag.merged { background: rgba(168,85,247,0.15); color: #c4b5fd; }
    .flag.payment { background: rgba(52,211,153,0.15); color: #6ee7b7; }
    .flag.primary-tag { background: rgba(34,197,94,0.2); color: #86efac; }
    .field-value { font-family: monospace; font-size: 11px; color: #cbd5e1; word-break: break-all; max-width: 220px; }
    .field-value.empty { color: #4b5563; font-style: italic; }
    .auto-fields-summary { background: rgba(34,197,94,0.05); border: 1px solid rgba(34,197,94,0.15); border-radius: 12px; padding: 14px; margin-bottom: 16px; font-size: 12px; }
    .auto-fields-summary h4 { margin: 0 0 8px; font-size: 13px; color: #86efac; }
    .auto-field { font-family: monospace; font-size: 11px; color: #cbd5e1; padding: 2px 0; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; margin: 12px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); transition: width 0.3s; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px 18px; color: #e2e8f0; font-size: 13px; z-index: 2000; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .toast.success { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.1); }
    .toast.error { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.1); color: #fca5a5; }
    .manual-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 6px; cursor: pointer; transition: all 0.15s; }
    .manual-row:hover { background: rgba(255,255,255,0.04); }
    .manual-row.selected { border-color: rgba(59,130,246,0.5); background: rgba(59,130,246,0.08); }
    .manual-row input[type="checkbox"] { cursor: pointer; }
    .manual-row-info { flex: 1; }
    .manual-row-name { font-weight: 600; color: #e2e8f0; font-size: 13px; }
    .manual-row-detail { font-size: 11px; color: #94a3b8; font-family: monospace; }
    .loading-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .filter-checkbox { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #cbd5e1; cursor: pointer; }
    @media (max-width: 768px) {
      .dedup-page { padding: 16px; }
      .docs-table { font-size: 11px; }
      .docs-table th, .docs-table td { padding: 6px 8px; }
    }
  </style>

<body>
  <div class="app-container">
    <nav id="nav-container"></nav>
    <main id="main-content">
      <div class="dedup-page" id="dedup-app">
        <div class="empty-state">
          <span class="loading-spinner"></span>
          <p>Vérification des accès…</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ============================================================
    // STATE
    // ============================================================
    var STATE = {
      user: null,
      isAdmin: false,
      allLeads: [],          // tous les docs leads (avec id)
      leadsById: {},
      clusters: [],          // [{ id, leads, hasConflict, hasClient, hasPayment, paymentsCount }]
      filteredClusters: [],
      paymentsCountByLeadId: {},  // { leadId: count }
      mode: 'auto',          // 'auto' | 'manual'
      filter: { onlyVisible: true, hideMerged: false, search: '' },
      manualSelected: {},    // { leadId: lead } pour le mode manuel
      currentMerge: null,    // { cluster, primary, autoFields, conflicts, conflictChoices }
    };

    var SUB_COLLECTIONS = ['client_temoignages', 'client_notes', 'voice_notes'];
    var SKIP_KEYS = ['id', '_merged', '_mergedInto', 'mergedAt', 'mergedBy', '_backupId',
                     '_orphanRepaired', '_orphanRepairedAt', '_orphanRevertedAt',
                     'createdAt', 'updatedAt', '_mergedFrom', '_lastMergedAt', '_lastBackupId',
                     '_migratedFromLeadId', '_migratedAt'];

    // ============================================================
    // BOOT
    // ============================================================
    document.addEventListener('DOMContentLoaded', function(){
      firebase.auth().onAuthStateChanged(function(user){
        if (!user) { window.location.href = '/login.html'; return; }
        STATE.user = user;
        checkAdminAndBoot();
      });
    });

    function checkAdminAndBoot(){
      firebase.firestore().collection('users').doc(STATE.user.uid).get().then(function(doc){
        if (!doc.exists) { renderNotAuthorized(); return; }
        var data = doc.data();
        STATE.isAdmin = data.role === 'admin' || data.role === 'super_admin';
        if (!STATE.isAdmin) { renderNotAuthorized(); return; }
        loadAllData();
      }).catch(function(e){ console.error(e); renderNotAuthorized(); });
    }

    function renderNotAuthorized(){
      document.getElementById('dedup-app').innerHTML =
        '<div class="empty-state"><h3>Accès refusé</h3><p>Cette page est réservée aux administrateurs.</p></div>';
    }

    // ============================================================
    // LOAD DATA
    // ============================================================
    function loadAllData(){
      renderLoading('Chargement des leads…');
      var db = firebase.firestore();
      db.collection('leads').get().then(function(snap){
        STATE.allLeads = [];
        STATE.leadsById = {};
        snap.forEach(function(d){
          var lead = Object.assign({ id: d.id }, d.data());
          STATE.allLeads.push(lead);
          STATE.leadsById[lead.id] = lead;
        });
        renderLoading('Chargement des paiements…');
        return db.collection('payments').get();
      }).then(function(paySnap){
        STATE.paymentsCountByLeadId = {};
        paySnap.forEach(function(d){
          var lid = d.data().leadId;
          if (!lid) return;
          STATE.paymentsCountByLeadId[lid] = (STATE.paymentsCountByLeadId[lid] || 0) + 1;
        });
        renderLoading('Détection des doublons…');
        setTimeout(function(){
          STATE.clusters = detectClusters(STATE.allLeads);
          applyFilter();
          renderApp();
        }, 50);
      }).catch(function(err){
        console.error(err);
        document.getElementById('dedup-app').innerHTML =
          '<div class="empty-state"><h3>Erreur</h3><p>'+escapeHtml(err.message)+'</p></div>';
      });
    }

    function renderLoading(msg){
      document.getElementById('dedup-app').innerHTML =
        '<div class="empty-state"><span class="loading-spinner"></span><p>'+escapeHtml(msg)+'</p></div>';
    }

    // ============================================================
    // CLUSTER DETECTION (Union-Find)
    // ============================================================
    function detectClusters(leads){
      var parent = {};
      leads.forEach(function(l){ parent[l.id] = l.id; });
      function find(x){
        while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; }
        return x;
      }
      function union(a, b){
        var ra = find(a), rb = find(b);
        if (ra !== rb) parent[ra] = rb;
      }

      // Index par email
      var byEmail = {};
      leads.forEach(function(l){
        if (l.email && typeof l.email === 'string') {
          var e = l.email.toLowerCase().trim();
          if (e.length > 3 && e.indexOf('@') > 0) {
            if (!byEmail[e]) byEmail[e] = [];
            byEmail[e].push(l.id);
          }
        }
      });
      Object.keys(byEmail).forEach(function(e){
        var ids = byEmail[e];
        for (var i = 1; i < ids.length; i++) union(ids[0], ids[i]);
      });

      // Index par tél
      var byTel = {};
      leads.forEach(function(l){
        var t = l.telephone || l.phone;
        if (t && typeof t === 'string' && t.length >= 10) {
          if (!byTel[t]) byTel[t] = [];
          byTel[t].push(l.id);
        }
      });
      Object.keys(byTel).forEach(function(t){
        var ids = byTel[t];
        for (var i = 1; i < ids.length; i++) union(ids[0], ids[i]);
      });

      // Index par nom : tokenisation
      var leadTokens = {};
      leads.forEach(function(l){
        leadTokens[l.id] = normalizeTokens(l.nom);
      });

      var byToken = {};
      leads.forEach(function(l){
        leadTokens[l.id].forEach(function(t){
          if (!byToken[t]) byToken[t] = [];
          byToken[t].push(l.id);
        });
      });

      // Pour chaque token avec >=2 leads, vérifier paires
      var checked = {};
      Object.keys(byToken).forEach(function(tok){
        var ids = byToken[tok];
        for (var i = 0; i < ids.length; i++) {
          for (var j = i+1; j < ids.length; j++) {
            var a = ids[i], b = ids[j];
            var key = a < b ? a+'|'+b : b+'|'+a;
            if (checked[key]) continue;
            checked[key] = true;
            var ta = leadTokens[a], tb = leadTokens[b];
            var setA = {}; ta.forEach(function(t){ setA[t] = true; });
            var common = 0;
            tb.forEach(function(t){ if (setA[t]) common++; });
            if (common >= 2) union(a, b);
          }
        }
      });

      // Construire clusters
      var clusterMap = {};
      leads.forEach(function(l){
        var root = find(l.id);
        if (!clusterMap[root]) clusterMap[root] = [];
        clusterMap[root].push(l);
      });

      var clusters = [];
      Object.keys(clusterMap).forEach(function(k){
        var arr = clusterMap[k];
        if (arr.length < 2) return;
        var hasClient = arr.some(function(l){ return l.isClient === true; });
        var paymentsCount = 0;
        arr.forEach(function(l){ paymentsCount += (STATE.paymentsCountByLeadId[l.id] || 0); });
        clusters.push({
          id: k,
          leads: arr,
          hasClient: hasClient,
          hasPayment: paymentsCount > 0,
          paymentsCount: paymentsCount,
        });
      });

      // Trier : clients actifs d'abord, puis ceux avec paiements, puis taille
      clusters.sort(function(a, b){
        if (a.hasClient !== b.hasClient) return a.hasClient ? -1 : 1;
        if (a.hasPayment !== b.hasPayment) return a.hasPayment ? -1 : 1;
        return b.leads.length - a.leads.length;
      });

      return clusters;
    }

    function normalizeTokens(str){
      if (!str || typeof str !== 'string') return [];
      return str.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .trim()
        .split(/\s+/)
        .filter(function(t){ return t.length >= 2; });
    }

    // ============================================================
    // MERGE PLAN BUILDING
    // ============================================================
    function scoreLead(l){
      var s = 0;
      var keys = Object.keys(l);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        if (SKIP_KEYS.indexOf(k) >= 0) continue;
        var v = l[k];
        if (v === null || v === undefined || v === '') continue;
        if (Array.isArray(v) && v.length === 0) continue;
        s++;
      }
      if (l.isClient === true) s += 1000;
      return s;
    }

    function pickPrimary(cluster){
      var best = null, bestScore = -1;
      cluster.forEach(function(l){
        var s = scoreLead(l);
        if (s > bestScore) { bestScore = s; best = l; }
      });
      return best;
    }

    function buildMergePlan(cluster, primaryId){
      var primary = null, secondaries = [];
      cluster.forEach(function(l){
        if (l.id === primaryId) primary = l; else secondaries.push(l);
      });
      if (!primary) return null;

      var allKeys = {};
      cluster.forEach(function(l){
        Object.keys(l).forEach(function(k){ allKeys[k] = true; });
      });

      var autoFields = {};
      var conflicts = [];

      Object.keys(allKeys).forEach(function(k){
        if (SKIP_KEYS.indexOf(k) >= 0) return;

        // Collecter les valeurs non-vides depuis tous les docs
        var values = [];
        cluster.forEach(function(l){
          var v = l[k];
          if (v === null || v === undefined || v === '') return;
          if (Array.isArray(v) && v.length === 0) return;
          values.push({ leadId: l.id, value: v });
        });
        if (values.length === 0) return;

        // Si la valeur est un array : union
        if (Array.isArray(values[0].value)) {
          var seen = {};
          var merged = [];
          values.forEach(function(v){
            if (!Array.isArray(v.value)) return;
            v.value.forEach(function(item){
              var key = typeof item === 'object' ? JSON.stringify(item) : String(item);
              if (!seen[key]) { seen[key] = true; merged.push(item); }
            });
          });
          if (JSON.stringify(merged) !== JSON.stringify(primary[k] || [])) {
            autoFields[k] = merged;
          }
          return;
        }

        // Si c'est un objet : on garde celui du primary si rempli, sinon premier non-vide
        if (typeof values[0].value === 'object' && values[0].value !== null) {
          // Pour les objets, on prend le primary s'il en a un, sinon le premier
          if (!primary[k]) {
            autoFields[k] = values[0].value;
          }
          return;
        }

        // Scalaire (string, number, bool) : dédupe
        var uniqueMap = {};
        values.forEach(function(v){
          var key = JSON.stringify(v.value);
          if (!uniqueMap[key]) uniqueMap[key] = v;
        });
        var uniqueOpts = Object.keys(uniqueMap).map(function(k){ return uniqueMap[k]; });

        if (uniqueOpts.length === 1) {
          // Une seule valeur distincte → auto si différente du primary
          if (JSON.stringify(primary[k]) !== JSON.stringify(uniqueOpts[0].value)) {
            autoFields[k] = uniqueOpts[0].value;
          }
        } else {
          // Plusieurs valeurs distinctes → conflit
          conflicts.push({
            key: k,
            options: uniqueOpts,
            primaryValue: primary[k],
            primaryHasValue: primary[k] !== null && primary[k] !== undefined && primary[k] !== '',
          });
        }
      });

      return {
        cluster: cluster,
        primary: primary,
        secondaries: secondaries,
        autoFields: autoFields,
        conflicts: conflicts,
        conflictChoices: {},
      };
    }

    // ============================================================
    // RENDER APP
    // ============================================================
    function renderApp(){
      var html = '';
      html += '<div class="dedup-header">';

    function searchManual(query){
      var results = document.getElementById('manual-results');
      query = (query || '').trim().toLowerCase();
      if (query.length < 2) { results.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:20px;">Tape au moins 2 caractères pour rechercher dans les '+STATE.allLeads.length+' leads.</p>'; return; }
      var qNorm = query.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      var matches = [];
      for (var i = 0; i < STATE.allLeads.length && matches.length < 100; i++) {
        var l = STATE.allLeads[i];
        var nom = (l.nom || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        var email = (l.email || '').toLowerCase();
        var tel = (l.telephone || l.phone || '');
        if (nom.indexOf(qNorm) >= 0 || email.indexOf(query) >= 0 || tel.indexOf(query) >= 0) {
          matches.push(l);
        }
      }
      var html = '';
      if (matches.length === 0) { html = '<p style="color:#94a3b8;text-align:center;padding:20px;">Aucun résultat.</p>'; }
      else {
        html += '<p style="color:#94a3b8;font-size:12px;margin-bottom:10px;">'+matches.length+' résultat'+(matches.length > 1 ? 's' : '')+(matches.length === 100 ? ' (limite atteinte)' : '')+'</p>';
        matches.forEach(function(l){
          var isSel = !!STATE.manualSelected[l.id];
          var flags = '';
          if (l.isClient === true) flags += '<span class="flag visible">✓ Client</span>';
          else flags += '<span class="flag invisible">invisible</span>';
          if (l._merged === true) flags += '<span class="flag merged">_merged</span>';
          var pcount = STATE.paymentsCountByLeadId[l.id] || 0;
          if (pcount > 0) flags += '<span class="flag payment">💶 '+pcount+'</span>';
          html += '<label class="manual-row '+(isSel ? 'selected' : '')+'">';
          html += '<input type="checkbox" '+(isSel ? 'checked' : '')+' onchange="toggleManualSelect(\''+l.id+'\', this.checked)">';
          html += '<div class="manual-row-info">';
          html += '<div class="manual-row-name">'+escapeHtml(l.nom || '(sans nom)')+' '+flags+'</div>';
          html += '<div class="manual-row-detail">'+escapeHtml(l.id)+' · '+escapeHtml(l.email || '(pas d\'email)')+' · '+escapeHtml(l.telephone || l.phone || '(pas de tél)')+(l.source ? ' · '+escapeHtml(l.source) : '')+'</div>';
          html += '</div>';
          html += '</label>';
        });
      }
      results.innerHTML = html;
    }

      STATE.filteredClusters = STATE.clusters.filter(function(c){
        if (f.onlyVisible && !c.hasClient) return false;
        if (q) {

          for (var i = 0; i < c.leads.length; i++) {
            var l = c.leads[i];

            if ((l.email || '').toLowerCase().indexOf(q) >= 0) { ok = true; break; }

    function openMergeModalForCluster(cluster, manual){
      var primary = pickPrimary(cluster.leads);
      var plan = buildMergePlan(cluster.leads, primary.id);
      // Init conflict choices to primary value if it has one, else first option
      plan.conflicts.forEach(function(cf){
        if (cf.primaryHasValue) {
          plan.conflictChoices[cf.key] = JSON.stringify(cf.primaryValue);
        } else if (cf.options.length > 0) {
          plan.conflictChoices[cf.key] = JSON.stringify(cf.options[0].value);
        }
      });
      plan.manual = !!manual;
      STATE.currentMerge = plan;
      renderMergeModal();

    function doMerge(plan){
      var db = firebase.firestore();
      var user = STATE.user;
      var primaryId = plan.primary.id;
      var secondaryIds = plan.secondaries.map(function(l){ return l.id; });

      // 1. Create backup snapshots
      return collectBackupData(plan.cluster).then(function(backupData){
        return db.collection('dedup_backups').add({
          startedAt: firebase.firestore.FieldValue.serverTimestamp(),
          startedBy: user.uid,
          startedByEmail: user.email,
          version: 'v2',
          manual: !!plan.manual,
          primaryId: primaryId,
          secondaryIds: secondaryIds,
          snapshots: backupData.snapshots,
          subColls: backupData.subColls,
          payments: backupData.payments,
          autoFields: plan.autoFields,
          conflictChoices: plan.conflictChoices,
        });
      }).then(function(backupRef){
        // 2. Build the patch for the primary
        var patch = Object.assign({}, plan.autoFields);
        Object.keys(plan.conflictChoices).forEach(function(k){
          var raw = plan.conflictChoices[k];
          try {
            var v = JSON.parse(raw);
            // Skip if same as current primary value
            if (JSON.stringify(plan.primary[k]) !== JSON.stringify(v)) {
              patch[k] = v;
            }
          } catch(e) {}
        });
        patch._mergedFrom = (plan.primary._mergedFrom || []).concat(secondaryIds);
        patch._lastMergedAt = firebase.firestore.FieldValue.serverTimestamp();
        patch._lastBackupId = backupRef.id;
        patch.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        // If primary was invisible, make it visible
        if (plan.primary.isClient !== true) {
          patch.isClient = true;
        }

        // 3. Apply patch + mark secondaries (in chunks for safety)
        var batch = db.batch();
        if (Object.keys(patch).length > 0) {
          batch.update(db.collection('leads').doc(primaryId), patch);
        }
        secondaryIds.forEach(function(sid){
          batch.update(db.collection('leads').doc(sid), {
            _merged: true,
            _mergedInto: primaryId,
            mergedAt: firebase.firestore.FieldValue.serverTimestamp(),
            mergedBy: user.uid,
            _backupId: backupRef.id,
            isClient: false,
            clientStatus: null,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
        });

        return batch.commit().then(function(){ return backupRef; });
      }).then(function(backupRef){
        // 4. Migrate payments
        return migratePayments(secondaryIds, primaryId).then(function(){ return backupRef; });
      }).then(function(backupRef){
        // 5. Migrate sub-collections
        return migrateSubCollections(secondaryIds, primaryId).then(function(){ return backupRef; });
      }).then(function(backupRef){
        // 6. Audit log
        return db.collection('audit_log').add({
          action: 'clients_dedup_merge_v2',
          actorUid: user.uid,
          actorEmail: user.email,
          primaryId: primaryId,
          secondaryIds: secondaryIds,
          backupId: backupRef.id,
          manual: !!plan.manual,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          success: true,
        }).then(function(){ return { backupId: backupRef.id }; });
      });
    }

    function collectBackupData(cluster){
      var db = firebase.firestore();
      var snapshots = {};
      var subColls = {};
      var payments = {};

      cluster.forEach(function(l){
        snapshots[l.id] = sanitizeForBackup(l);
      });

      // Collect sub-collections (sequentially to avoid overwhelming)
      var promises = [];
      cluster.forEach(function(l){
        subColls[l.id] = {};
        SUB_COLLECTIONS.forEach(function(sc){
          promises.push(
            db.collection('leads').doc(l.id).collection(sc).get().then(function(snap){
              if (snap.empty) return;
              var arr = [];
              snap.forEach(function(d){ arr.push(Object.assign({ _id: d.id }, d.data())); });
              subColls[l.id][sc] = arr;
            }).catch(function(){ /* ignore */ })
          );
        });
        // Payments
        promises.push(
          db.collection('payments').where('leadId', '==', l.id).get().then(function(snap){
            if (snap.empty) return;
            var arr = [];
            snap.forEach(function(d){ arr.push(Object.assign({ _id: d.id }, d.data())); });
            payments[l.id] = arr;
          }).catch(function(){ /* ignore */ })
        );
      });

      return Promise.all(promises).then(function(){
        return { snapshots: snapshots, subColls: subColls, payments: payments };
      });
    }

    function sanitizeForBackup(obj){
      // Remove Firestore Timestamps as they cause issues — store as raw {seconds, nanoseconds}
      var clean = {};
      Object.keys(obj).forEach(function(k){
        var v = obj[k];
        if (v && typeof v === 'object' && typeof v.toDate === 'function') {
          // Firestore Timestamp
          clean[k] = { _ts: true, seconds: v.seconds, nanoseconds: v.nanoseconds };
        } else if (Array.isArray(v)) {
          clean[k] = v.map(function(item){ return (item && typeof item === 'object' && !Array.isArray(item)) ? sanitizeForBackup(item) : item; });
        } else if (v && typeof v === 'object') {
          clean[k] = sanitizeForBackup(v);
        } else {
          clean[k] = v;
        }
      });
      return clean;
    }

    function migratePayments(secondaryIds, primaryId){
      var db = firebase.firestore();
      // Process each secondary's payments
      var promises = secondaryIds.map(function(sid){
        return db.collection('payments').where('leadId', '==', sid).get().then(function(snap){
          if (snap.empty) return;
          var batch = db.batch();
          var count = 0;
          snap.forEach(function(d){
            batch.update(d.ref, {
              leadId: primaryId,
              _migratedFromLeadId: sid,
              _migratedAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            count++;
            if (count >= 400) { /* should not happen for one lead but safe */ }
          });
          return batch.commit();
        });
      });
      return Promise.all(promises);
    }

    function migrateSubCollections(secondaryIds, primaryId){
      var db = firebase.firestore();
      var promises = [];
      secondaryIds.forEach(function(sid){
        SUB_COLLECTIONS.forEach(function(sc){
          promises.push(
            db.collection('leads').doc(sid).collection(sc).get().then(function(snap){
              if (snap.empty) return;
              var batch = db.batch();
              snap.forEach(function(d){
                var newRef = db.collection('leads').doc(primaryId).collection(sc).doc();
                batch.set(newRef, Object.assign({}, d.data(), {
                  _migratedFromLeadId: sid,
                  _originalDocId: d.id,
                  _migratedAt: firebase.firestore.FieldValue.serverTimestamp(),
                }));
                batch.delete(d.ref);
              });
              return batch.commit();
            }).catch(function(e){ console.warn('Sub migration warning:', sid, sc, e.message); })
          );
        });
      });
      return Promise.all(promises);
    }

    // ============================================================
    // UTILS
    // ============================================================
    function escapeHtml(s){
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg, type){
      type = type || 'success';
      var t = document.createElement('div');
      t.className = 'toast ' + type;
      t.innerHTML = msg;
      document.body.appendChild(t);
      setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 5000);
    }
  </script>
