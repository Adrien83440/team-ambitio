<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Alteore — Stats funnel</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background:#0a0e1a; color:#e5e7eb; padding:20px; }
  .card { width:100%; max-width:440px; background:#121829; border:1px solid #232b45; border-radius:16px; padding:28px; text-align:center; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { font-size:14px; line-height:1.5; color:#9ca3af; margin:8px 0; }
  .spin { width:28px; height:28px; border:3px solid #232b45; border-top-color:#818cf8; border-radius:50%; margin:18px auto; animation:sp 0.9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .err { color:#fca5a5; }
  .btn { display:inline-block; margin-top:14px; padding:10px 18px; border-radius:10px; border:1px solid #4f46e5; background:#4f46e5; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:transparent; color:#c7d2fe; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>📊 Stats funnel</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">Ouverture de votre accès en lecture…</p>
  <div id="actions"></div>
</div>
<script>
/* ============================================================================
   funnel-acces.html — ouverture d'un LIEN D'ACCÈS en lecture au module Stats
   funnel (19/11/2026). Lien : funnel-acces.html#t=<id>.<secret> (le secret
   est dans le fragment # : jamais envoyé dans les journaux d'un serveur).
   api/funnel-acces.js valide le lien et rend un jeton Firebase personnalisé ;
   la page se connecte et part sur sales-funnel.html, en lecture seule.
   ES5 strict.
   ============================================================================ */
(function () {
  'use strict';
  var FB = { apiKey: 'AIzaSyDo30FASeWnhvx4mYWYungKOu4AMhyJz6o', authDomain: 'ambitio-team.firebaseapp.com', projectId: 'ambitio-team',
    storageBucket: 'ambitio-team.firebasestorage.app', messagingSenderId: '1079366902268', appId: '1:1079366902268:web:b4ec1691dba54230339279' };
  if (!firebase.apps.length) firebase.initializeApp(FB);
  var auth = firebase.auth();

  function $(id) { return document.getElementById(id); }
  function show(text, isErr, actionsHtml) {
    $('spin').style.display = 'none';
    $('msg').textContent = text;
    $('msg').className = isErr ? 'err' : '';
    $('actions').innerHTML = actionsHtml || '';
  }

  var m = /[#&]t=([^&]+)/.exec(location.hash || '');
  var t = m ? decodeURIComponent(m[1]) : '';
  /* Retire le secret de la barre d'adresse et de l'historique. */
  try { if (t && window.history && history.replaceState) history.replaceState(null, '', location.pathname); } catch (e) {}
  if (!t) { show('Lien incomplet : demandez un nouveau lien à la personne qui vous l\'a envoyé.', true); return; }

  function open() {
    $('spin').style.display = '';
    $('msg').className = '';
    $('msg').textContent = 'Ouverture de votre accès en lecture…';
    $('actions').innerHTML = '';
    fetch('/api/funnel-acces', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', t: t }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (!x.r.ok || !x.j.ok || !x.j.token) throw new Error((x.j && x.j.error) || 'Lien refusé.');
        return auth.signOut().then(function () { return auth.signInWithCustomToken(x.j.token); }).then(function () { return x.j; });
      })
      .then(function (j) {
        try {
          localStorage.setItem('ambitio_role', 'funnel_viewer');
          localStorage.setItem('ambitio_name', j.name || 'Lecture');
          localStorage.setItem('ambitio_email', '');
          localStorage.removeItem('ambitio_modules');
        } catch (e) {}
        location.replace('sales-funnel.html');
      })
      .catch(function (e) {
        show((e && e.message) || 'Lien refusé.', true);
      });
  }

  /* Un membre de l'équipe déjà connecté dans ce navigateur : ouvrir le lien
     le déconnecterait — on demande d'abord. */
  var first = true;
  auth.onAuthStateChanged(function (u) {
    if (!first) return;
    first = false;
    if (u && String(u.uid).indexOf('fl_') !== 0) {
      show('Vous êtes déjà connecté à l\'espace équipe (' + (u.email || 'compte équipe') + '). Ouvrir ce lien vous déconnectera de ce compte.', false,
        '<button class="btn" id="go">Ouvrir quand même</button> <a class="btn ghost" href="sales-funnel.html">Rester connecté</a>');
      $('go').onclick = open;
      return;
    }
    open();
  });
})();
</script>
</body>
</html>
