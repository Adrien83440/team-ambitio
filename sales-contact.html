h+='<div class="fiche-right"><div class="fr-tabs">';
var nc=l.notesHistory?l.notesHistory.length:0,fc=l.files?l.files.length:0,ac=l.activities?l.activities.length:0,tc=l.timeline_history?l.timeline_history.length:0;
h+='<button class="fr-tab active" data-tab="chrono">Chronologie'+(tc?'<span class="tc">'+tc+'</span>':'')+'</button>';
h+='<button class="fr-tab" data-tab="notes">Remarques'+(nc?'<span class="tc">'+nc+'</span>':'')+'</button>';
h+='<button class="fr-tab" data-tab="act">Activit\u00e9s'+(ac?'<span class="tc">'+ac+'</span>':'')+'</button>';
h+='<button class="fr-tab" data-tab="files">Fichiers'+(fc?'<span class="tc">'+fc+'</span>':'')+'</button>';
h+='</div>';
// Chrono
h+='<div class="fr-panel active" id="pChrono">';
var tl=l.timeline_history||[];
if(!tl.length)h+='<div class="fr-empty">Aucun \u00e9v\u00e9nement</div>';
else for(var i=tl.length-1;i>=0;i--){var ev=tl[i];h+='<div class="tl-item"><span class="tl-dot" style="background:'+(ev.color||'var(--muted)')+'"></span><span class="tl-date">'+esc(ev.date)+'</span><span class="tl-text">'+esc(ev.text)+'</span></div>';}
h+='</div>';
// Notes
h+='<div class="fr-panel" id="pNotes">';
var ns=l.notesHistory||[];
for(var ni=ns.length-1;ni>=0;ni--)h+='<div class="note-item"><div class="note-head"><span class="note-date">'+esc(ns[ni].date)+'</span><button class="note-del" data-action="delNote" data-idx="'+ni+'">\u2715</button></div><div class="note-text">'+esc(ns[ni].text)+'</div></div>';
h+='<div class="note-add"><textarea class="note-input" id="noteIn" placeholder="Ajouter une remarque..."></textarea><button class="note-btn" id="noteBtn">+ Ajouter</button></div></div>';
// Activities
h+='<div class="fr-panel" id="pAct">';
var as=l.activities||[];
for(var ai=0;ai<as.length;ai++){var a=as[ai];h+='<div class="act-item"><span class="act-check'+(a.done?' done':'')+'" data-action="togAct" data-idx="'+ai+'">'+(a.done?'\u2713':'')+'</span><span class="act-text'+(a.done?' done':'')+'">'+esc(a.text)+'</span><span class="act-date">'+esc(a.date||'')+'</span><button class="act-del" data-action="delAct" data-idx="'+ai+'">\u2715</button></div>';}
h+='<div class="act-add"><input type="text" id="actIn" placeholder="Nouvelle t\u00e2che..."/><input type="date" id="actDt"/><button id="actBtn">+</button></div></div>';
// Files
h+='<div class="fr-panel" id="pFiles">';
var fs=l.files||[];
for(var fi=0;fi<fs.length;fi++){var f=fs[fi];h+='<div class="file-item"><span class="file-icon">'+(f.name&&/\.pdf$/i.test(f.name)?'\ud83d\udcd5':'\ud83d\udcc4')+'</span><span class="file-name">'+esc(f.name)+'</span><span class="file-meta">'+esc(f.size||'')+' \u00b7 '+esc(f.uploadedAt||'')+'</span><button class="file-del" data-action="delFile" data-idx="'+fi+'">\u2715</button></div>';}
h+='<label class="file-upload">\ud83d\udcc1 Ajouter un fichier (max 750KB)<input type="file" id="fileIn" style="display:none" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.xlsx"/></label></div>';
h+='</div></div>';
document.getElementById('ctApp').innerHTML=h;
initEv();
}
function flR(ic,k,v){return '<div class="fl-row"><span class="fl-icon">'+ic+'</span><input class="fl-editable" data-f="'+k+'" value="'+escA(v||'')+'" placeholder="\u2014"/></div>';}

function initEv(){
document.querySelectorAll('.fr-tab').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.fr-tab').forEach(function(x){x.classList.remove('active');});document.querySelectorAll('.fr-panel').forEach(function(x){x.classList.remove('active');});b.classList.add('active');var m={chrono:'pChrono',notes:'pNotes',act:'pAct',files:'pFiles'};document.getElementById(m[b.dataset.tab]).classList.add('active');});});
document.getElementById('ctApp').addEventListener('input',function(e){if(e.target.closest('[data-f]')){if(autoTimer)clearTimeout(autoTimer);autoTimer=setTimeout(saveF,3000);}});
document.getElementById('ctApp').addEventListener('change',function(e){if(e.target.closest('[data-f]'))saveF();});
document.getElementById('ctApp').addEventListener('click',function(e){
var dot=e.target.closest('[data-action="setStage"]');if(dot){var o=lead.stage||'lead',n=dot.dataset.stage;if(o===n)return;lead.stage=n;addTL(sName(o)+' \u2192 '+sName(n),SM[n]?SM[n].color:'var(--muted)');if(n==='closed_won_setting'||n==='closed_won_self')addTL('\ud83c\udf89 Converti en client !','#10b981');sv({stage:n});renderAll();return;}
var dt=e.target.closest('[data-action="delTag"]');if(dt){lead.tags=(lead.tags||[]);lead.tags.splice(+dt.dataset.idx,1);sv({tags:lead.tags});renderAll();return;}
var dn=e.target.closest('[data-action="delNote"]');if(dn){lead.notesHistory=(lead.notesHistory||[]);lead.notesHistory.splice(+dn.dataset.idx,1);sv({notesHistory:lead.notesHistory});renderAll();return;}
var ta=e.target.closest('[data-action="togAct"]');if(ta){lead.activities=(lead.activities||[]);var ai=+ta.dataset.idx;if(lead.activities[ai])lead.activities[ai].done=!lead.activities[ai].done;sv({activities:lead.activities});renderAll();return;}
var da=e.target.closest('[data-action="delAct"]');if(da){lead.activities=(lead.activities||[]);lead.activities.splice(+da.dataset.idx,1);sv({activities:lead.activities});renderAll();return;}
var df=e.target.closest('[data-action="delFile"]');if(df){lead.files=(lead.files||[]);lead.files.splice(+df.dataset.idx,1);sv({files:lead.files});renderAll();return;}
});
document.getElementById('tagBtn').addEventListener('click',function(){var v=document.getElementById('tagIn').value.trim();if(!v)return;lead.tags=(lead.tags||[]);lead.tags.push(v);sv({tags:lead.tags});renderAll();});
document.getElementById('noteBtn').addEventListener('click',function(){var v=document.getElementById('noteIn').value.trim();if(!v)return;lead.notesHistory=(lead.notesHistory||[]);lead.notesHistory.push({text:v,date:fmtNow()});addTL('Note : '+v.substring(0,60),'#f59e0b');sv({notesHistory:lead.notesHistory});renderAll();setTimeout(function(){document.querySelector('[data-tab="notes"]').click();},50);});
document.getElementById('actBtn').addEventListener('click',function(){var v=document.getElementById('actIn').value.trim();if(!v)return;lead.activities=(lead.activities||[]);lead.activities.push({text:v,date:document.getElementById('actDt').value,done:false});addTL('T\u00e2che : '+v,'#60a5fa');sv({activities:lead.activities});renderAll();setTimeout(function(){document.querySelector('[data-tab="act"]').click();},50);});
document.getElementById('fileIn').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;if(f.size>750*1024){toast('\u274c Max 750KB');return;}var r=new FileReader();r.onload=function(ev){lead.files=(lead.files||[]);lead.files.push({name:f.name,size:Math.round(f.size/1024)+'KB',data:ev.target.result,uploadedAt:fmtNow()});addTL('Fichier : '+f.name,'#a78bfa');sv({files:lead.files});renderAll();setTimeout(function(){document.querySelector('[data-tab="files"]').click();},50);};r.readAsDataURL(f);});
}

function saveF(){
var flds='nom,telephone,email,assignedTo,type,utm,description,secteur,ca,defi,disponibilite,timeline,prospectWebinaire,dateWebinaire,present,tagsWebi,dateReceptionLead,rejetMails,formule,dateInscription,dateFinProgramme,retractation,plateformePaiement,commissions,coaching72h,coach72h,closeur,setting,goodies,dateEnvoiGoodies'.split(',');
var u={};flds.forEach(function(f){var el=document.querySelector('[data-f="'+f+'"]');if(el){u[f]=el.value.trim();lead[f]=u[f];}});
sv(u);var m=document.getElementById('flS');if(m){m.style.opacity='1';setTimeout(function(){m.style.opacity='0';},1500);}
}
function sv(u){u.updatedAt=firebase.firestore.FieldValue.serverTimestamp();db.collection('leads').doc(leadId).update(u).catch(function(e){toast('\u274c '+e.message);});}
function addTL(t,c){lead.timeline_history=(lead.timeline_history||[]);lead.timeline_history.push({text:t,date:fmtNow(),color:c||'var(--muted)'});db.collection('leads').doc(leadId).update({timeline_history:lead.timeline_history}).catch(function(){});}
firebase.auth().onAuthStateChanged(function(u){if(u){db.collection('users').doc(u.uid).get().then(function(s){var d=s.exists?s.data():{};window._currentRole=d.role||'sales';window._currentUserName=u.displayName||u.email.split('@')[0];localStorage.setItem('ambitio_role',d.role||'sales');localStorage.setItem('ambitio_name',window._currentUserName);});}});
</script>
<script src="nav.js"></script>
