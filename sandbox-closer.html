<style>
/* ═══════════════════════════════════════════════════════════════════════
   sandbox-closer.html — BAC À SABLE CLOSER (demande Adrien 08/10/2026)
   Mini-logiciel d'entraînement ouvert dans une fenêtre à part depuis
   Outils → 🧪 Bac à sable closer (sales + admin). Copie fidèle des écrans
   Leads Live, des cartes du Close et de la modale Résultat du RDV ; les
   modules Signatures et Paiements et la page de signature du client sont
   les VRAIES pages (miroir vivant, sandbox-frame.html). Rien de réel n'est
   déclenché. Logique : sandbox-closer.js · base : sandbox-db.js · serveur :
   sandbox-server.js (généré) · mandat GoCardless simulé : sandbox-gc.html.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#07080f;--bg2:#0e111c;--bg3:#151928;--bg4:#1c2136;
  --border:rgba(148,163,214,.11);--border2:rgba(148,163,214,.22);
  --red:#b91c1c;--red2:#ef4444;--gold:#fbbf24;--green:#34d399;--blue:#60a5fa;--indigo:#5b7cfa;--purple:#a78bfa;
  --text:#eef0f8;--muted:#8f97b2;--muted2:#596180;
  --fh:'Space Grotesk',sans-serif;--fb:'Plus Jakarta Sans',sans-serif;--fm:'DM Mono',monospace;--fd:'Bricolage Grotesque',sans-serif;
  --r:12px;--r2:16px;
  --sbx:#f59e0b;--sbx2:#fbbf24;
  --pay-green:#10b981;--pay-amber:#f59e0b;--pay-red:#ef4444;--pay-blue:#60a5fa;--pay-purple:#a78bfa;
  --sig:#6366f1;--sig2:#818cf8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(185,28,28,.10),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(91,124,250,.08),transparent 60%),var(--bg)}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit}

/* ── Bandeau BAC À SABLE : toujours visible, impossible à confondre ── */
.sbx-banner{position:sticky;top:0;z-index:400;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:repeating-linear-gradient(135deg,rgba(245,158,11,.16) 0 14px,rgba(245,158,11,.08) 14px 28px),#1a1407;border-bottom:1px solid rgba(245,158,11,.45);font-size:12.5px}
.sbx-banner .tag{font-family:var(--fh);font-weight:700;letter-spacing:.6px;color:#1a1407;background:var(--sbx2);padding:3px 9px;border-radius:6px;font-size:11.5px}
.sbx-banner .msg{color:#fde68a;font-weight:600;flex:1;min-width:200px}
.sbx-btn{padding:6px 12px;border-radius:8px;border:1px solid rgba(245,158,11,.45);background:rgba(245,158,11,.12);color:#fde68a;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.sbx-btn:hover{background:rgba(245,158,11,.22)}
.sbx-btn.solid{background:var(--sbx2);color:#1a1407;border-color:var(--sbx2)}

/* ── Coquille : mini sidebar + vue ── */
.app{display:flex;min-height:calc(100vh - 44px)}
.side{width:212px;flex-shrink:0;background:linear-gradient(180deg,#3b0a0a 0%,#160709 40%,#0b0b14 100%);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:44px;height:calc(100vh - 44px)}
.side-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px}
.side-brand .b{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#b91c1c,#ef4444);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--fh)}
.side-brand .t{font-weight:800;font-size:13.5px}
.side-brand .s{font-size:10.5px;color:#fca5a5}
.side-sec{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.35);padding:10px 10px 4px}
.nav-it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:600;color:rgba(255,255,255,.72);cursor:pointer;border:none;background:none;text-align:left;width:100%}
.nav-it:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-it.on{background:rgba(252,165,165,.12);color:#fff;box-shadow:inset 2px 0 0 #fca5a5}
.nav-it .ic{width:20px;text-align:center}
.nav-it .bdg{margin-left:auto;background:var(--red2);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 7px}
.nav-it .bdg:empty{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side-phone{border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.08);color:#fde68a}
.side-phone:hover{background:rgba(245,158,11,.16)}
.side-me{font-size:11px;color:var(--muted);padding:6px 10px}
.main{flex:1;min-width:0;padding:22px 26px 80px}
@media(max-width:860px){.side{display:none}.main{padding:16px 16px 90px}.mnav{display:flex!important}}
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;background:#0b0b14;border-top:1px solid var(--border);padding:6px;gap:4px}
.mnav .nav-it{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;align-items:center;justify-content:center}

/* ── En-têtes de vue ── */
.vh{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.vh h1{font-family:var(--fh);font-size:21px;font-weight:700;letter-spacing:-.3px}
.vh small{display:block;font-size:12px;color:var(--muted)}
.vh .sp{flex:1}

/* ═══ LEADS LIVE ═══ */
.ll-ic{background:linear-gradient(135deg,#b91c1c,#f97316)}
.ll-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chipf{padding:6px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.chipf.on{color:#fff;border-color:rgba(252,165,165,.5);background:rgba(239,68,68,.12)}
.ll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lcard{background:linear-gradient(165deg,var(--bg3),var(--bg2));border:1px solid var(--border);border-radius:var(--r2);padding:14px;cursor:pointer;transition:border-color .15s,transform .15s;position:relative}
.lcard:hover{border-color:var(--border2);transform:translateY(-1px)}
.lcard.sel{border-color:rgba(91,124,250,.6);box-shadow:0 0 0 1px rgba(91,124,250,.4) inset}
.lc-top{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;color:#fff}
.lc-name{font-weight:800;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-ago{font-size:11px;color:var(--muted);font-family:var(--fm)}
.lc-tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;border:1px solid var(--border2);background:rgba(255,255,255,.03);white-space:nowrap}
.lc-last{font-size:12px;color:var(--muted);line-height:1.45;min-height:34px}
.lc-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.lc-rdv{font-size:11px;font-weight:700;color:#c4b5fd;font-family:var(--fm)}
.btn-q{margin-left:auto;padding:5px 10px;border-radius:8px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fde68a;font-size:11px;font-weight:800;cursor:pointer}
.lc-prog{height:3px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:10px;overflow:hidden}
.lc-prog i{display:block;height:100%;background:linear-gradient(90deg,#5b7cfa,#34d399);border-radius:99px}

/* ── Fiche lead (panneau latéral) ── */
/* Fond NON bloquant : le closer garde la main sur la sidebar (téléphone du
   client) et sur les cartes pendant que la fiche est ouverte. */
.sheet-bg{position:fixed;inset:0;background:rgba(5,6,12,.35);z-index:500;display:none;pointer-events:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:linear-gradient(180deg,#121628,#0b0e19);border-left:1px solid var(--border2);z-index:510;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.sheet.show{transform:none}
.sh-head{padding:16px 18px 0;border-bottom:1px solid var(--border)}
.sh-top{display:flex;align-items:center;gap:12px}
.sh-name{font-family:var(--fh);font-size:18px;font-weight:700}
.sh-sub{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.sh-sub a{color:#93c5fd;text-decoration:none;cursor:pointer}
.sh-x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;align-self:flex-start}
.sh-acts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.sh-act{padding:7px 11px;border-radius:9px;border:1px solid var(--border2);background:rgba(255,255,255,.03);font-size:12px;font-weight:700;cursor:pointer;color:var(--text)}
.sh-act:hover{border-color:rgba(91,124,250,.5)}
.sh-tabs{display:flex;gap:2px}
.sh-tab{padding:9px 14px;border:none;background:none;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.sh-tab.on{color:#fff;border-bottom-color:#5b7cfa}
.sh-body{flex:1;overflow-y:auto;padding:14px 18px 40px}
.blk{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.blk-t{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.blk-t .r{margin-left:auto}
.ld-rdvx-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12px;flex-wrap:wrap}
.ld-rdvx-when{display:inline-flex;align-items:baseline;gap:5px;font-weight:700;color:#c4b5fd;min-width:118px}
.ld-rdvx-when .d{font-size:10.5px;color:var(--muted);font-weight:600;font-family:var(--fm)}
.ld-rdvx-meta{font-size:11px;color:var(--muted);flex:1;min-width:84px}
.ld-rdvx-btn{background:rgba(91,124,250,.14);border:1px solid rgba(91,124,250,.42);color:#b6c3ff;padding:4px 10px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;text-decoration:none}
.ld-rdvx-btn:hover{border-color:rgba(91,124,250,.6);box-shadow:0 4px 12px rgba(91,124,250,.2)}
.ld-rdvx-btn.ghost{background:transparent;border-color:rgba(255,255,255,.12);color:var(--muted)}
.ld-rdvx-btn.meet{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.42);color:#6ee7b7}
.ld-rdvx-btn.meet:hover{border-color:rgba(52,211,153,.65);box-shadow:0 4px 12px rgba(52,211,153,.2)}
.ld-rdvx-info{padding:2px 0 4px;font-size:11px;line-height:1.5;color:var(--muted)}
.ld-rdvx-info .url{color:var(--muted2);font-family:var(--fm);font-size:9.5px;margin-top:3px;word-break:break-all}
.oc-chip{border-radius:999px;padding:1px 8px;font-size:9.5px;font-weight:800;border:1px solid}
.ld-rail-block{background:rgba(167,139,250,.05);border:1px solid rgba(167,139,250,.18);border-radius:12px;padding:10px 12px;margin:10px 0}
.ld-rail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ld-rail-head .t{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#c4b5fd}
.ld-rail-head .n{font-size:11px;font-weight:800;font-family:var(--fm);color:var(--muted)}
.ld-rail{display:flex;flex-direction:column;gap:1px}
.ld-rail-step{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--muted)}
.ld-rail-step .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.ld-rail-step.done{color:var(--text)}
.ld-rail-step.done .dot{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:#34d399}
.ld-rail-step.next{color:#fff;font-weight:700}
.ld-rail-step.next .dot{background:rgba(251,191,36,.16);border-color:rgba(251,191,36,.5);color:#fbbf24}
.ld-rail-step .lbl{flex:1}
.ld-rail-step .hint{font-size:10.5px;color:var(--muted2);font-weight:400;font-style:italic}
.ld-rail-btn{background:rgba(91,124,250,.14);border:1px solid rgba(91,124,250,.42);color:#b6c3ff;padding:3px 10px;border-radius:7px;font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.ld-rail-btn.ghost{background:transparent;border-color:rgba(255,255,255,.13);color:var(--muted)}
.ld-rail-btn.ghost:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.ld-rail-actions{display:flex;gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.07);flex-wrap:wrap}
.st-fam{margin-bottom:8px}
.st-fam-t{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.st-grid{display:flex;flex-wrap:wrap;gap:5px}
.st-b{padding:5px 9px;border-radius:8px;border:1px solid var(--border2);background:rgba(255,255,255,.02);font-size:11.5px;font-weight:700;cursor:pointer;color:var(--text)}
.st-b:hover{border-color:rgba(91,124,250,.5)}
.st-b.on{border-color:#5b7cfa;background:rgba(91,124,250,.16)}
.st-b.win{border-color:rgba(52,211,153,.45);color:#6ee7b7}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;font-size:12.5px}
.kv .k{color:var(--muted);font-size:11.5px;font-weight:600}
.kv .v{font-weight:600;word-break:break-word}
.note{background:rgba(255,255,255,.03);border-left:2px solid rgba(167,139,250,.5);border-radius:0 8px 8px 0;padding:7px 10px;font-size:12px;margin-bottom:6px}
.note small{display:block;color:var(--muted);font-size:10.5px;margin-bottom:2px}
.tl-it{display:flex;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
.tl-it .d{color:var(--muted);font-family:var(--fm);font-size:10.5px;min-width:86px}
.bub{max-width:88%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.45;margin-bottom:6px}
.bub.p{background:var(--bg3);border:1px solid var(--border)}
.bub.c{margin-left:auto;background:rgba(91,124,250,.12);border:1px solid rgba(91,124,250,.3);color:#c7d2fe;font-style:italic}
.stars{color:#fbbf24;letter-spacing:2px}

/* ═══ MODALES génériques ═══ */
.mo-bg{position:fixed;inset:0;background:rgba(8,10,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:700;display:none;align-items:center;justify-content:center;padding:16px}
.mo-bg.show{display:flex}
.mo{width:min(520px,96vw);max-height:92vh;overflow-y:auto;background:linear-gradient(165deg,#171c2e,#10141f);border:1px solid rgba(255,255,255,.09);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative}
.mo.wide{width:min(980px,97vw);height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden}
.mo-h{padding:16px 20px 12px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.mo-h b{font-size:15px;font-weight:800;flex:1}
.mo-h small{display:block;font-size:11px;color:#8d93a8;font-weight:500}
.mo-x{background:transparent;border:none;color:#8d93a8;font-size:18px;cursor:pointer;padding:4px 6px}
.mo-b{padding:16px 20px 20px}
.mo.wide .mo-b{flex:1;overflow-y:auto;padding:16px 18px}
.mo-f{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 18px;flex-wrap:wrap}
.b{padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:800;cursor:pointer;border:1px solid transparent}
.b-ok{background:linear-gradient(135deg,#10b981,#0d9f6f);color:#04120c;box-shadow:0 6px 18px rgba(16,185,129,.25)}
.b-ok:disabled{opacity:.45;box-shadow:none;cursor:default}
.b-pri{background:linear-gradient(135deg,#5b7cfa,#4a63d8);color:#fff}
.b-gh{background:transparent;border-color:rgba(255,255,255,.16);color:#aab0c4}
.b-gh:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.b-red{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#fca5a5}

/* ── Résultat du RDV (copie rdv-outcome.js) ── */
.ro-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ro-opt{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);border-radius:12px;padding:11px;text-align:left;cursor:pointer;color:#eef1fa;transition:all .12s}
.ro-opt:hover{border-color:#5b7cfa}
.ro-opt.sel{border-color:var(--oc);background:rgba(255,255,255,.06);box-shadow:0 0 0 1px var(--oc) inset}
.ro-opt .i{font-size:18px}
.ro-opt .l{font-weight:800;font-size:13px;margin-top:3px}
.ro-opt .d{font-size:10.5px;color:#8d93a8;margin-top:2px;line-height:1.35}
.ro-extra{margin-top:12px}
.in{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:9px 12px;font-size:13px;outline:none;color:#eef1fa}
.in:focus{border-color:#5b7cfa}
.lb{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#8d93a8;margin:10px 0 5px}

/* ── Cartes du Close (copie close-wizard.js) ── */
.cw-dots{display:flex;gap:6px;margin-top:10px}
.cw-dot{height:4px;flex:1;border-radius:99px;background:rgba(255,255,255,.10)}
.cw-dot.on{background:#5b7cfa}.cw-dot.done{background:rgba(91,124,250,.45)}
.cw-body{padding:18px 20px 20px;min-height:190px}
.cw-q{font-size:13px;font-weight:700;margin-bottom:12px}
